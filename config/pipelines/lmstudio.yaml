pipeline:
  version: 1
  description: Proforma-v1 local LM Studio OpenAI-compatible pipeline.
execution:
  max_parallel_cases: 1
provider:
  type: openai-compatible
  base_url: http://localhost:1234/v1
  base_url_env: NEL_LMSTUDIO_BASE_URL
  api_key_env: NEL_LMSTUDIO_API_KEY
  timeout_s: 900
  api_key_required: false
model_aliases:
  default:
    model: qwen3-coder-next
    temperature: 0.0
    max_tokens: 16384
    reasoning: default
model_roles:
  structure:
    model: default
  diagnosis:
    model: default
  ptbg:
    model: default
  evidence_match:
    model: default
  evidence_audit:
    model: default
  report_write:
    model: default
  preservation_check:
    model: default
  marking:
    model: default
  syntax_repair:
    model: default
  evidence_adjudication:
    model: default
  reasoning_audit:
    model: default
  reasoning_adjudication:
    model: default
  dissent_summary:
    model: default
