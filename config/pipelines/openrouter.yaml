pipeline:
  version: 1
  description: Proforma-v1 OpenRouter pipeline.
execution:
  max_parallel_cases: 4
provider:
  type: openai-compatible
  base_url: https://openrouter.ai/api/v1
  base_url_env: NEL_OPENROUTER_BASE_URL
  api_key_env: OPENROUTER_API_KEY
  timeout_s: 900
  api_key_required: true
model_aliases:
  default:
    model: qwen/qwen3-coder-next
    temperature: 0.0
    max_tokens: 16384
    reasoning: default
model_roles:
  structure:
    model: default
  diagnosis:
    model: default
  ptbg:
    model: default
  evidence_match:
    model: default
  evidence_audit:
    model: default
  report_write:
    model: default
  preservation_check:
    model: default
  marking:
    model: default
  syntax_repair:
    model: default
  evidence_adjudication:
    model: default
  reasoning_audit:
    model: default
  reasoning_adjudication:
    model: default
  dissent_summary:
    model: default
