pipeline:
  id: openrouter
  version: 1
  description: Terraced-v6 OpenRouter pipeline.
provider:
  type: openai-compatible
  base_url: https://openrouter.ai/api/v1
  base_url_env: NEL_OPENROUTER_BASE_URL
  api_key_env: OPENROUTER_API_KEY
  timeout_s: 900
  api_key_required: true
models:
  structure:
    model: qwen/qwen3-coder-next
    temperature: 0.0
    max_tokens: 65536
  diagnosis:
    model: qwen/qwen3-coder-next
    temperature: 0.0
    max_tokens: 65536
  ptbg:
    model: qwen/qwen3-coder-next
    temperature: 0.0
    max_tokens: 65536
  evidence_match:
    model: qwen/qwen3-coder-next
    temperature: 0.0
    max_tokens: 16384
  evidence_audit:
    model: qwen/qwen3-coder-next
    temperature: 0.0
    max_tokens: 16384
  report_write:
    model: qwen/qwen3-coder-next
    temperature: 0.0
    max_tokens: 16384
  preservation_check:
    model: qwen/qwen3-coder-next
    temperature: 0.0
    max_tokens: 16384
  syntax_repair:
    model: qwen/qwen3-coder-next
    temperature: 0.0
    max_tokens: 16384
