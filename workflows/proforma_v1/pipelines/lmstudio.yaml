pipeline:
  version: 1
  description: Proforma-v1 local LM Studio OpenAI-compatible pipeline.
provider:
  type: openai-compatible
  base_url: http://localhost:1234/v1
  base_url_env: NEL_LMSTUDIO_BASE_URL
  api_key_env: NEL_LMSTUDIO_API_KEY
  timeout_s: 900
  api_key_required: false
model_aliases:
  default: qwen3-coder-next
model_roles:
  structure:
    model: default
    temperature: 0.0
    max_tokens: 65536
  diagnosis:
    model: default
    temperature: 0.0
    max_tokens: 65536
  ptbg:
    model: default
    temperature: 0.0
    max_tokens: 65536
  evidence_match:
    model: default
    temperature: 0.0
    max_tokens: 16384
  evidence_audit:
    model: default
    temperature: 0.0
    max_tokens: 16384
  report_write:
    model: default
    temperature: 0.0
    max_tokens: 16384
  preservation_check:
    model: default
    temperature: 0.0
    max_tokens: 16384
  syntax_repair:
    model: default
    temperature: 0.0
    max_tokens: 16384
  evidence_adjudication:
    model: default
    temperature: 0.0
    max_tokens: 16384
