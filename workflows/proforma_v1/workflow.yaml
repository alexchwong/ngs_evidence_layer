version: 1
workflow_id: proforma-v1

evidence_policies:
  literature_support:
    assignment:
      role: evidence_match
      prompt: prompts/evidence_match.md
    audit:
      role: evidence_audit
      prompt: prompts/evidence_audit.md
    adjudication:
      role: evidence_audit
      prompt: prompts/evidence_adjudicate.md

steps:
  structure:
    type: model
    role: structure
    stage: structure_case
    prompt: prompts/structure_case.md
    inputs:
      case_text: {from: run.case_text}
      panel_scope: {from: assets.ngs_panel_scope}
    output:
      artifact: structured_case
      format: json
      schema: schemas/structured_case.json
    checks:
      - {rule: sequential_ids, path: variants, field: variant_id, prefix: V}
    execution:
      provider_handler: structure
      self_handler: structure
      self_mode: handoff

  corpus:
    type: transform
    needs: [structure]
    transform: load_corpus
    output: {artifact: corpus_state}
    execution:
      provider_handler: corpus
      self_handler: corpus
      self_mode: deterministic

  diagnosis.who1:
    type: model
    needs: [corpus]
    role: diagnosis
    stage: diagnosis_who5
    prompt: prompts/diagnosis_who5.md
    output:
      artifact: diagnosis_who1
      format: yaml
      schema: schemas/diagnosis_who5.json
    execution:
      provider_handler: diagnosis
      provider_group: diagnosis
      self_handler: diagnosis_who1
      self_mode: handoff

  diagnosis.icc:
    type: model
    needs: [diagnosis.who1]
    role: diagnosis
    stage: diagnosis_icc
    prompt: prompts/diagnosis_icc.md
    output:
      artifact: diagnosis_icc
      format: yaml
      schema: schemas/diagnosis.json
    execution:
      provider_handler: diagnosis
      provider_group: diagnosis
      self_handler: diagnosis_icc
      self_mode: handoff

  diagnosis.who2:
    type: model
    needs: [diagnosis.icc]
    role: diagnosis
    stage: diagnosis_who5
    prompt: prompts/diagnosis_who5.md
    output:
      artifact: diagnosis_who2
      format: yaml
      schema: schemas/diagnosis_who5.json
    execution:
      provider_handler: diagnosis
      provider_group: diagnosis
      self_handler: diagnosis_who2
      self_mode: handoff

  diagnosis.other:
    type: model
    needs: [diagnosis.who2]
    role: diagnosis
    stage: diagnosis_other
    prompt: prompts/diagnosis_other.md
    output:
      artifact: diagnosis_other
      format: yaml
      schema: schemas/second_diagnosis.json
    execution:
      provider_handler: diagnosis
      provider_group: diagnosis
      self_handler: diagnosis_other_default
      self_mode: deterministic

  diagnosis.finalize:
    type: transform
    needs: [diagnosis.other]
    transform: finalize_diagnosis
    output: {artifact: diagnosis}
    execution:
      provider_handler: diagnosis
      provider_group: diagnosis
      self_handler: diagnosis_finalize
      self_mode: deterministic

  prognosis:
    type: model
    needs: [diagnosis.finalize]
    role: ptbg
    stage: prognosis
    prompt: prompts/prognosis.md
    output:
      artifact: prognosis
      format: yaml
      schema: schemas/prognosis.json
    execution:
      provider_handler: domain
      self_handler: ptbg
      self_group: ptbg
      self_mode: handoff

  treatment:
    type: model
    needs: [prognosis]
    role: ptbg
    stage: treatment
    prompt: prompts/treatment.md
    output:
      artifact: treatment
      format: yaml
      schema: schemas/treatment.json
    execution:
      provider_handler: domain
      self_handler: ptbg
      self_group: ptbg
      self_mode: handoff

  biomarker:
    type: model
    needs: [treatment]
    role: ptbg
    stage: biomarker
    prompt: prompts/biomarker.md
    output:
      artifact: biomarker
      format: yaml
      schema: schemas/biomarker.json
    execution:
      provider_handler: domain
      self_handler: ptbg
      self_group: ptbg
      self_mode: handoff

  germline:
    type: model
    needs: [biomarker]
    role: ptbg
    stage: germline
    prompt: prompts/germline.md
    output:
      artifact: germline
      format: yaml
      schema: schemas/domain_classification.json
    execution:
      provider_handler: domain
      self_handler: ptbg
      self_group: ptbg
      self_mode: handoff

  evidence.assignment:
    type: evidence_review
    needs: [germline]
    role: evidence_match
    stage: evidence_match
    prompt: prompts/evidence_match.md
    evidence:
      policy: literature_support
      timing: deferred
      cards: {from: owner.cards}
    output:
      artifact: evidence_assignments
      format: yaml
      schema: schemas/evidence_match.json
    execution:
      provider_handler: evidence
      provider_group: evidence
      self_handler: evidence_assignment
      self_mode: handoff

  evidence.audit:
    type: evidence_review
    needs: [evidence.assignment]
    role: evidence_audit
    stage: evidence_audit
    prompt: prompts/evidence_audit.md
    evidence:
      policy: literature_support
      timing: deferred
      cards: {from: owner.cards}
    output:
      artifact: evidence_audits
      format: yaml
      schema: schemas/evidence_audit.json
    execution:
      provider_handler: evidence
      provider_group: evidence
      self_handler: evidence_audit
      self_mode: handoff

  evidence.adjudication:
    type: evidence_adjudication
    needs: [evidence.audit]
    barrier_for: [evidence.assignment, evidence.audit]
    role: evidence_audit
    prompt: prompts/evidence_adjudicate.md
    evidence:
      policy: literature_support
      timing: deferred
      cards: {from: owner.cards}
    output:
      artifact: evidence_adjudication
      format: yaml
      schema: schemas/evidence_adjudicate.json
    execution:
      provider_handler: evidence
      provider_group: evidence
      self_handler: evidence_adjudication
      self_mode: handoff

  evidence.finalize:
    type: transform
    needs: [evidence.adjudication]
    transform: finalize_evidence
    output: {artifact: evidence_enriched}
    execution:
      provider_handler: evidence
      provider_group: evidence
      self_handler: evidence_finalize
      self_mode: deterministic

  report.blocks:
    type: transform
    needs: [evidence.finalize]
    transform: report_blocks
    output: {artifact: report_blocks}
    execution:
      provider_handler: report_blocks
      self_handler: report_blocks
      self_mode: deterministic

  report:
    type: render/report
    needs: [report.blocks]
    role: report_write
    stage: report_write
    prompt: prompts/report_write.md
    output:
      artifact: final_report
      format: text
    execution:
      provider_handler: report
      self_handler: report
      self_mode: handoff
