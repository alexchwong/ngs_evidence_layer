version: 1
workflow_id: proforma-v1
self_groups:
  final_presentation:
    strategy: batch_ready
evidence_policies:
  literature_support:
    assignment:
      role: evidence_match
      prompt: prompts/evidence_match.md
    audit:
      role: evidence_audit
      prompt: prompts/evidence_audit.md
    adjudication:
      role: evidence_adjudication
      prompt: prompts/evidence_adjudicate.md
steps:
  structure:
    type: model
    role: structure
    stage: structure_case
    prompt: prompts/structure_case.md
    inputs:
      case_text:
        from: run.case_text
      panel_scope:
        from: assets.ngs_panel_scope
    output:
      artifact: structured_case
      format: json
      schema: schemas/structured_case.json
    checks:
    - rule: sequential_ids
      path: variants
      field: variant_id
      prefix: V
    execution:
      provider_handler: structure
      self_handler: structure
      self_mode: handoff
  corpus:
    type: transform
    needs:
    - structure
    transform: reasoning_load_corpus
    output:
      artifact: corpus_state
    execution:
      provider_handler: corpus
      self_handler: corpus
      self_mode: deterministic
  diagnosis.who.prepare:
    type: transform
    needs:
    - corpus
    transform: reasoning_prepare_diagnostic_reasoning
    output:
      artifact: diagnosis_who_pack
      format: yaml
    execution:
      provider_handler: generic_transform
      self_handler: generic_transform
      self_mode: deterministic
  diagnosis.who.reason:
    type: model
    needs:
    - diagnosis.who.prepare
    role: diagnosis
    prompt: prompts/reasoning/diagnosis_who.md
    inputs:
      owner_pack:
        from: artifacts.diagnosis_who_pack
      audit_feedback:
        from: feedback.diagnosis.who.reason
        optional: true
    output:
      artifact: diagnosis_who_reasoning
      format: yaml
      schema: schemas/reasoning/diagnostic_reasoning.json
    execution:
      provider_handler: reasoning_model
      self_handler: reasoning_model
      self_mode: handoff
  diagnosis.who.reason.validate:
    type: transform
    needs:
    - diagnosis.who.reason
    transform: reasoning_validate_diagnostic_reasoning_v2
    output:
      artifact: diagnosis_who_reasoning_validation
      format: yaml
    execution:
      provider_handler: generic_transform
      self_handler: generic_transform
      self_mode: deterministic
    review:
      target: diagnosis.who.reason
      verdict:
        path: status
        pass_values:
        - pass
      on_pass:
        continue: true
      on_fail:
        retry_target: true
        feedback:
          from: artifacts.diagnosis_who_reasoning_validation
          as: audit_feedback
        max_cycles: 1
        exhausted:
          action: stop
  diagnosis.who.em.prepare:
    type: transform
    needs:
    - diagnosis.who.reason.validate
    transform: reasoning_prepare_diagnostic_evidence_match
    output:
      artifact: diagnosis_who_evidence_match_items
