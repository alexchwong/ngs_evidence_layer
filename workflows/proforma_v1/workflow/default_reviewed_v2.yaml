version: 1
workflow_id: proforma-v1
self_groups:
  ptbg:
    strategy: batch_ready
batching:
  evidence_match: 8
  evidence_audit: 8
  evidence_adjudication: 8
evidence_policies:
  literature_support:
    assignment:
      role: evidence_match
      prompt: prompts/evidence_match.md
    audit:
      role: evidence_audit
      prompt: prompts/evidence_audit.md
    adjudication:
      role: evidence_adjudication
      prompt: prompts/evidence_adjudicate.md
  diagnosis_complete_support:
    assignment:
      role: evidence_match
      prompt: prompts/evidence/diagnosis_match.md
    audit:
      role: evidence_audit
      prompt: prompts/evidence/diagnosis_audit.md
    adjudication:
      role: evidence_adjudication
      prompt: prompts/evidence/diagnosis_adjudicate.md
steps:
  structure:
    type: model
    role: structure
    stage: structure_case
    prompt: prompts/structure_case.md
    inputs:
      case_text:
        from: run.case_text
      panel_scope:
        from: assets.ngs_panel_scope
    output:
      artifact: structured_case
      format: json
      schema: schemas/structured_case.json
    checks:
    - rule: sequential_ids
      path: variants
      field: variant_id
      prefix: V
    execution:
      provider_handler: structure
      self_handler: structure
      self_mode: handoff
  corpus:
    type: transform
    needs:
    - structure
    transform: load_corpus
    output:
      artifact: corpus_state
    execution:
      provider_handler: corpus
      self_handler: corpus
      self_mode: deterministic
  diagnosis.who1:
    type: model
    needs:
    - corpus
    role: diagnosis
    stage: diagnosis_who5
    prompt: prompts/default_reviewed_v2/diagnosis_who5.md
    output:
      artifact: diagnosis_who1
      format: yaml
      schema: schemas/diagnosis_who5.json
    execution:
      provider_handler: diagnosis_who1
      self_handler: diagnosis_who1
      self_mode: handoff
    inputs:
      reasoning_correction:
        from: feedback.reviewed_v2.who1.correction
        optional: true
  audit.who1.packet:
    type: transform
    needs:
    - diagnosis.who1
    transform: v2_coherence_packet
    output:
      artifact: v2_who1_packet
      format: yaml
    execution:
      provider_handler: generic_transform
      self_handler: generic_transform
      self_mode: deterministic
      params:
        owner: who1
  audit.who1.coherence:
    type: model
    needs:
    - audit.who1.packet
    role: reasoning_audit
    prompt: prompts/default_reviewed_v2/diagnosis_coherence.md
    inputs:
      coherence_packet:
        from: artifacts.v2_who1_packet
    output:
      artifact: v2_who1_coherence
      format: yaml
    execution:
      provider_handler: reasoning_model
      self_handler: reasoning_model
      self_mode: handoff
  audit.who1.disputes:
    type: transform
    needs:
    - audit.who1.coherence
    transform: v2_dispute_filter
    output:
      artifact: v2_who1_disputes
      format: yaml
    execution:
      provider_handler: generic_transform
      self_handler: generic_transform
      self_mode: deterministic
      params:
        owner: who1
  audit.who1.adjudicate:
    type: model
    needs:
    - audit.who1.disputes
    role: reasoning_adjudication
    prompt: prompts/default_reviewed_v2/dispute_adjudicate.md
    inputs:
      coherence_packet:
        from: artifacts.v2_who1_packet
      disputes:
        from: artifacts.v2_who1_disputes
    when:
      has_items:
        artifact: v2_who1_disputes
    output:
      artifact: v2_who1_adjudication
      format: yaml
      schema: schemas/default_reviewed_v2/dispute_adjudication.json
    checks:
    - rule: rows_match_source_keys
      path: adjudications
      source: v2_who1_disputes
      fields:
      - proposition_id
      - premise
    execution:
      provider_handler: generic_model
      self_handler: generic_model
      self_mode: handoff
      params:
        canonicalizer: adjudication_nulls
  audit.who1.gate:
    type: transform
    needs:
    - audit.who1.adjudicate
    transform: v2_correction_gate
    output:
      artifact: v2_who1_gate
      format: yaml
    execution:
      provider_handler: generic_transform
      self_handler: generic_transform
      self_mode: deterministic
      params:
        owner: who1
    review:
      target: diagnosis.who1
      verdict:
        path: status
        pass_values:
        - pass
      on_pass:
        continue: true
      on_fail:
        retry_target: true
        feedback:
          from: artifacts.v2_who1_gate
          path: correction
          as: reasoning_correction
        max_cycles: 2
        exhausted:
          action: continue_with_dissent
  diagnosis.who1.routing_change:
    type: transform
    needs:
    - audit.who1.gate
    transform: assess_who1_routing_change
    output:
      artifact: who1_routing_change
    execution:
      provider_handler: who1_routing_change
      self_handler: who1_routing_change
      self_mode: deterministic
  diagnosis.who1.evidence.assignment:
    type: evidence_review
    needs:
    - diagnosis.who1.routing_change
    role: evidence_match
    stage: evidence_match
    prompt: prompts/evidence/diagnosis_match.md
    when:
      predicate: who1_routing_changed
    evidence:
      policy: diagnosis_complete_support
      timing: blocking
      cards:
        from: owner.cards
      match_passes: 2
    output:
      artifact: who1_evidence_assignments
      format: yaml
      schema: schemas/evidence_match.json
    execution:
      provider_handler: who1_evidence_assignment
      self_handler: who1_evidence_assignment
      self_mode: handoff
  diagnosis.who1.evidence.audit:
    type: evidence_review
    needs:
    - diagnosis.who1.evidence.assignment
    role: evidence_audit
    stage: evidence_audit
    prompt: prompts/evidence/diagnosis_audit.md
    when:
      predicate: who1_routing_changed
    evidence:
      policy: diagnosis_complete_support
      timing: blocking
      cards:
        from: owner.cards
    output:
      artifact: who1_evidence_audits
      format: yaml
      schema: schemas/evidence_audit.json
    execution:
      provider_handler: who1_evidence_audit
      self_handler: who1_evidence_audit
      self_mode: handoff
  diagnosis.who1.evidence.adjudication:
    type: evidence_adjudication
    needs:
    - diagnosis.who1.evidence.audit
    role: evidence_adjudication
    prompt: prompts/evidence/diagnosis_adjudicate.md
    when:
      predicate: who1_routing_changed
    evidence:
      policy: diagnosis_complete_support
      timing: blocking
      cards:
