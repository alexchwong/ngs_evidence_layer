        owner: biomarker
    review:
      target: biomarker
      verdict:
        path: status
        pass_values:
        - pass
      on_pass:
        continue: true
      on_fail:
        retry_target: true
        feedback:
          from: artifacts.v2_biomarker_gate
          path: correction
          as: reasoning_correction
        max_cycles: 2
        exhausted:
          action: continue_with_dissent
  germline:
    type: model
    needs:
    - audit.diagnosis.provenance
    role: ptbg
    stage: germline
    prompt: prompts/default_reviewed_v2/germline.md
    output:
      artifact: germline
      format: yaml
      schema: schemas/domain_classification.json
    execution:
      provider_handler: domain
      self_handler: ptbg
      self_group: ptbg
      self_mode: handoff
    evidence:
      policy: literature_support
      timing: deferred
      cards:
        from: owner.cards
      owner_assignment: true
    inputs:
      reasoning_correction:
        from: feedback.reviewed_v2.germline.correction
        optional: true
  audit.germline.packet:
    type: transform
    needs:
    - germline
    transform: v2_coherence_packet
    output:
      artifact: v2_germline_packet
      format: yaml
    execution:
      provider_handler: generic_transform
      self_handler: generic_transform
      self_mode: deterministic
      params:
        owner: germline
  audit.germline.coherence:
    type: model
    needs:
    - audit.germline.packet
    role: reasoning_audit
    prompt: prompts/default_reviewed_v2/ptbg_coherence.md
    inputs:
      coherence_packet:
        from: artifacts.v2_germline_packet
    output:
      artifact: v2_germline_coherence
      format: yaml
    execution:
      provider_handler: reasoning_model
      self_handler: reasoning_model
      self_mode: handoff
  audit.germline.disputes:
    type: transform
    needs:
    - audit.germline.coherence
    transform: v2_dispute_filter
    output:
      artifact: v2_germline_disputes
      format: yaml
    execution:
      provider_handler: generic_transform
      self_handler: generic_transform
      self_mode: deterministic
      params:
        owner: germline
  audit.germline.adjudicate:
    type: model
    needs:
    - audit.germline.disputes
    role: reasoning_adjudication
    prompt: prompts/default_reviewed_v2/dispute_adjudicate.md
    inputs:
      coherence_packet:
        from: artifacts.v2_germline_packet
      disputes:
        from: artifacts.v2_germline_disputes
    when:
      has_items:
        artifact: v2_germline_disputes
    output:
      artifact: v2_germline_adjudication
      format: yaml
      schema: schemas/default_reviewed_v2/dispute_adjudication.json
    checks:
    - rule: rows_match_source_keys
      path: adjudications
      source: v2_germline_disputes
      fields:
      - proposition_id
      - premise
    execution:
      provider_handler: generic_model
      self_handler: generic_model
      self_mode: handoff
      params:
        canonicalizer: adjudication_nulls
  audit.germline.gate:
    type: transform
    needs:
    - audit.germline.adjudicate
    transform: v2_correction_gate
    output:
      artifact: v2_germline_gate
      format: yaml
    execution:
      provider_handler: generic_transform
      self_handler: generic_transform
      self_mode: deterministic
      params:
        owner: germline
    review:
      target: germline
      verdict:
        path: status
        pass_values:
        - pass
      on_pass:
        continue: true
      on_fail:
        retry_target: true
        feedback:
          from: artifacts.v2_germline_gate
          path: correction
          as: reasoning_correction
        max_cycles: 2
        exhausted:
          action: continue_with_dissent
  audit.ptbg.terminal:
    type: transform
    needs:
    - audit.prognosis.gate
    - audit.treatment.gate
    - audit.biomarker.gate
    - audit.germline.gate
    transform: v2_ptbg_terminal
    output:
      artifact: v2_ptbg_terminal
      format: yaml
    execution:
      provider_handler: generic_transform
      self_handler: generic_transform
      self_mode: deterministic
  evidence.assignment:
    type: evidence_review
    needs:
    - audit.ptbg.terminal
    role: evidence_match
    stage: evidence_match
    prompt: prompts/evidence_match.md
    evidence:
      policy: literature_support
      timing: deferred
      cards:
        from: owner.cards
      rescue_match_passes: 1
    output:
      artifact: evidence_assignments
      format: yaml
      schema: schemas/evidence_match.json
    execution:
      provider_handler: evidence_assignment
      self_handler: evidence_assignment
      self_mode: handoff
    inputs:
      audit_feedback:
        from: feedback.evidence.audit
        optional: true
  evidence.audit:
    type: evidence_review
    needs:
    - evidence.assignment
    role: evidence_audit
    stage: evidence_audit
    prompt: prompts/evidence_audit.md
    evidence:
      policy: literature_support
      timing: deferred
      cards:
        from: owner.cards
    output:
      artifact: evidence_audits
      format: yaml
      schema: schemas/evidence_audit.json
    execution:
      provider_handler: evidence_audit
      self_handler: evidence_audit
      self_mode: handoff
    review:
      target: evidence.assignment
      verdict:
        predicate: evidence_audit_resolved
      on_pass:
        continue: true
      on_fail:
        retry_target: true
        feedback:
          from: artifacts.evidence_audits
          as: audit_feedback
        max_cycles: 2
        exhausted:
          action: continue_with_dissent
  evidence.adjudication:
    type: evidence_adjudication
    needs:
    - evidence.audit
    barrier_for:
    - evidence.assignment
    - evidence.audit
    role: evidence_adjudication
    prompt: prompts/evidence_adjudicate.md
    evidence:
      policy: literature_support
      timing: deferred
      cards:
        from: owner.cards
    output:
      artifact: evidence_adjudication
      format: yaml
      schema: schemas/evidence_adjudicate.json
    execution:
      provider_handler: evidence_adjudication
      self_handler: evidence_adjudication
      self_mode: handoff
  evidence.finalize:
    type: transform
    needs:
    - evidence.adjudication
    transform: finalize_evidence
    output:
      artifact: evidence_enriched
    execution:
      provider_handler: evidence_finalize
      self_handler: evidence_finalize
      self_mode: deterministic
  report.blocks:
    type: transform
    needs:
    - evidence.finalize
    transform: report_blocks
    output:
      artifact: report_blocks
    execution:
      provider_handler: report_blocks
      self_handler: report_blocks
      self_mode: deterministic
  report.write:
    type: render/report
    needs:
    - report.blocks
    role: report_write
    stage: report_write
    prompt: prompts/report_write.md
    output:
      artifact: report_draft
      format: yaml
      schema: schemas/report_write.json
    execution:
      provider_handler: report_write
      self_handler: report_write
      self_mode: handoff
  report.preservation:
    type: model
    needs:
    - report.write
    role: preservation_check
    stage: report_preservation
    prompt: prompts/report_preservation.md
    output:
      artifact: report_preservation
      format: yaml
      schema: schemas/report_preservation.json
    execution:
      provider_handler: report_preservation
      self_handler: report_preservation
      self_mode: handoff
      self:
        enabled: false
  report.finalize:
    type: transform
    needs:
    - report.preservation
    transform: finalize_report
    output:
      artifact: final_report
    execution:
      provider_handler: report_finalize
      self_handler: report_finalize
      self_mode: deterministic
presentation:
  model_roles:
    structure: Structures the raw case into normalized facts for downstream interpretation.
    diagnosis: Produces diagnostic assessments and classification conclusions.
    ptbg: Produces prognosis, treatment, biomarker, and germline conclusions.
    evidence_match: Selects corpus evidence that supports each clinical conclusion.
    evidence_audit: Independently checks whether selected evidence supports each conclusion.
    evidence_adjudication: Resolves disagreements between evidence matching and evidence audit.
    report_write: Writes the clinical report from approved conclusions and evidence.
    preservation_check: Checks that report synthesis preserved the approved clinical content.
    marking: Evaluates completed validation reports; it does not generate clinical conclusions.
    reasoning_audit: Checks whether each stated conclusion follows from the reasons the clinical owner gave.
    reasoning_adjudication: Independently decides whether an addressable audit criticism warrants owner reassessment.
    syntax_repair: Repairs malformed structured model output without changing clinical meaning.
  progress_phases:
  - id: preparation
    label: Preparation
    steps:
    - structure
    - corpus
  - id: diagnosis
    label: Diagnosis
    steps:
    - diagnosis.who1
    - audit.who1.packet
    - audit.who1.coherence
    - audit.who1.disputes
    - audit.who1.adjudicate
    - audit.who1.gate
    - diagnosis.who1.routing_change
    - diagnosis.who1.evidence.assignment
    - diagnosis.who1.evidence.audit
    - diagnosis.who1.evidence.adjudication
    - diagnosis.who1.commit
    - diagnosis.who2
    - audit.who2.packet
    - audit.who2.coherence
    - audit.who2.disputes
    - audit.who2.adjudicate
    - audit.who2.gate
    - diagnosis.icc
    - audit.icc.packet
    - audit.icc.coherence
    - audit.icc.disputes
    - audit.icc.adjudicate
    - audit.icc.gate
    - audit.diagnosis.terminal
    - diagnosis.finalize
    - audit.diagnosis.provenance
  - id: prognosis
    label: Prognosis
    steps:
    - prognosis
    - audit.prognosis.packet
    - audit.prognosis.coherence
    - audit.prognosis.disputes
    - audit.prognosis.adjudicate
    - audit.prognosis.gate
  - id: treatment
    label: Treatment
    steps:
    - treatment
    - audit.treatment.packet
    - audit.treatment.coherence
    - audit.treatment.disputes
    - audit.treatment.adjudicate
    - audit.treatment.gate
  - id: biomarker
    label: Biomarker
    steps:
    - biomarker
    - audit.biomarker.packet
    - audit.biomarker.coherence
    - audit.biomarker.disputes
    - audit.biomarker.adjudicate
    - audit.biomarker.gate
  - id: germline
    label: Germline
    steps:
    - germline
    - audit.germline.packet
    - audit.germline.coherence
    - audit.germline.disputes
    - audit.germline.adjudicate
    - audit.germline.gate
  - id: evidence
    label: Evidence
    steps:
    - audit.ptbg.terminal
    - evidence.assignment
    - evidence.audit
    - evidence.adjudication
    - evidence.finalize
  - id: report
    label: Report
    steps:
    - report.blocks
    - report.write
    - report.preservation
    - report.finalize
