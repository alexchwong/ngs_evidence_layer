version: 1
workflow_id: proforma-v1-default-reviewed
self_groups:
  ptbg:
    strategy: batch_ready

evidence_policies:
  literature_support:
    assignment:
      role: evidence_match
      prompt: prompts/evidence_match.md
    audit:
      role: evidence_audit
      prompt: prompts/evidence_audit.md
    adjudication:
      role: evidence_adjudication
      prompt: prompts/evidence_adjudicate.md
  diagnosis_complete_support:
    assignment:
      role: evidence_match
      prompt: prompts/evidence/diagnosis_match.md
    audit:
      role: evidence_audit
      prompt: prompts/evidence/diagnosis_audit.md
    adjudication:
      role: evidence_adjudication
      prompt: prompts/evidence/diagnosis_adjudicate.md

steps:
  structure:
    type: model
    role: structure
    stage: structure_case
    prompt: prompts/structure_case.md
    inputs:
      case_text: {from: run.case_text}
      panel_scope: {from: assets.ngs_panel_scope}
    output:
      artifact: structured_case
      format: json
      schema: schemas/structured_case.json
    checks:
    - rule: sequential_ids
      path: variants
      field: variant_id
      prefix: V
    execution:
      provider_handler: structure
      self_handler: structure
      self_mode: handoff

  corpus:
    type: transform
    needs: [structure]
    transform: load_corpus
    output: {artifact: corpus_state}
    execution:
      provider_handler: corpus
      self_handler: corpus
      self_mode: deterministic

  diagnosis.who1:
    type: model
    needs: [corpus]
    role: diagnosis
    stage: diagnosis_who5
    prompt: prompts/default_reviewed/diagnosis_who5.md
    inputs:
      clinical_audit_feedback:
        from: feedback.default_reviewed.clinical_audit
        optional: true
    output:
      artifact: diagnosis_who1
      format: yaml
      schema: schemas/diagnosis_who5.json
    execution:
      provider_handler: diagnosis_who1
      self_handler: diagnosis_who1
      self_mode: handoff

  diagnosis.who1.routing_change:
    type: transform
    needs: [diagnosis.who1]
    transform: assess_who1_routing_change
    output: {artifact: who1_routing_change}
    execution:
      provider_handler: who1_routing_change
      self_handler: who1_routing_change
      self_mode: deterministic

  diagnosis.who1.evidence.assignment:
    type: evidence_review
    needs: [diagnosis.who1.routing_change]
    role: evidence_match
    stage: evidence_match
    prompt: prompts/evidence/diagnosis_match.md
    when: {predicate: who1_routing_changed}
    evidence:
      policy: diagnosis_complete_support
      timing: blocking
      cards: {from: owner.cards}
      match_passes: 2
    output:
      artifact: who1_evidence_assignments
      format: yaml
      schema: schemas/evidence_match.json
    execution:
      provider_handler: who1_evidence_assignment
      self_handler: who1_evidence_assignment
      self_mode: handoff

  diagnosis.who1.evidence.audit:
    type: evidence_review
    needs: [diagnosis.who1.evidence.assignment]
    role: evidence_audit
    stage: evidence_audit
    prompt: prompts/evidence/diagnosis_audit.md
    when: {predicate: who1_routing_changed}
    evidence:
      policy: diagnosis_complete_support
      timing: blocking
      cards: {from: owner.cards}
    output:
      artifact: who1_evidence_audits
      format: yaml
      schema: schemas/evidence_audit.json
    execution:
      provider_handler: who1_evidence_audit
      self_handler: who1_evidence_audit
      self_mode: handoff

  diagnosis.who1.evidence.adjudication:
    type: evidence_adjudication
    needs: [diagnosis.who1.evidence.audit]
    role: evidence_adjudication
    prompt: prompts/evidence/diagnosis_adjudicate.md
    when: {predicate: who1_routing_changed}
    evidence:
      policy: diagnosis_complete_support
      timing: blocking
      cards: {from: owner.cards}
    output:
      artifact: who1_evidence_adjudication
      format: yaml
      schema: schemas/evidence_adjudicate.json
    execution:
      provider_handler: who1_evidence_adjudication
      self_handler: who1_evidence_adjudication
      self_mode: handoff

  diagnosis.who1.commit:
    type: transform
    needs: [diagnosis.who1.evidence.adjudication]
    transform: commit_who1_routing
    output: {artifact: who1_commit}
    execution:
      provider_handler: who1_commit
      self_handler: who1_commit
      self_mode: deterministic

  diagnosis.who2:
    type: model
    needs: [diagnosis.who1.commit]
    role: diagnosis
    stage: diagnosis_who5
    prompt: prompts/default_reviewed/diagnosis_who5.md
    inputs:
      clinical_audit_feedback:
        from: feedback.default_reviewed.clinical_audit
        optional: true
    when: {predicate: who2_required}
    output:
      artifact: diagnosis_who2
      format: yaml
      schema: schemas/diagnosis_who5.json
    execution:
      provider_handler: diagnosis_who2
      self_handler: diagnosis_who2
      self_mode: handoff

  diagnosis.icc:
    type: model
    needs: [diagnosis.who1.commit, diagnosis.who2]
    role: diagnosis
    stage: diagnosis_icc
    prompt: prompts/default_reviewed/diagnosis_icc.md
    inputs:
      clinical_audit_feedback:
        from: feedback.default_reviewed.clinical_audit
        optional: true
    output:
      artifact: diagnosis_icc
      format: yaml
      schema: schemas/diagnosis.json
    execution:
      provider_handler: diagnosis_icc
      self_handler: diagnosis_icc
      self_mode: handoff

  diagnosis.finalize:
    type: transform
    needs: [diagnosis.icc]
    transform: finalize_diagnosis
    output: {artifact: diagnosis}
    execution:
      provider_handler: diagnosis_finalize
      self_handler: diagnosis_finalize
      self_mode: deterministic

  prognosis:
    type: model
    needs: [diagnosis.finalize]
    role: ptbg
    stage: stages/default_reviewed/prognosis.yaml
    prompt: prompts/default_reviewed/prognosis.md
    inputs:
      clinical_audit_feedback:
        from: feedback.default_reviewed.clinical_audit
        optional: true
    output:
      artifact: prognosis
      format: yaml
      schema: schemas/prognosis.json
    execution:
      provider_handler: domain
      self_handler: ptbg
      self_group: ptbg
      self_mode: handoff
    evidence:
      policy: literature_support
      timing: deferred
      cards: {from: owner.cards}
      owner_assignment: false

  treatment:
    type: model
    needs: [diagnosis.finalize]
    role: ptbg
    stage: stages/default_reviewed/treatment.yaml
    prompt: prompts/default_reviewed/treatment.md
    inputs:
      clinical_audit_feedback:
        from: feedback.default_reviewed.clinical_audit
        optional: true
    output:
      artifact: treatment
      format: yaml
      schema: schemas/treatment.json
    execution:
      provider_handler: domain
      self_handler: ptbg
      self_group: ptbg
      self_mode: handoff
    evidence:
      policy: literature_support
      timing: deferred
      cards: {from: owner.cards}
      owner_assignment: false

  biomarker:
    type: model
    needs: [diagnosis.finalize]
    role: ptbg
    stage: stages/default_reviewed/biomarker.yaml
    prompt: prompts/default_reviewed/biomarker.md
    inputs:
      clinical_audit_feedback:
        from: feedback.default_reviewed.clinical_audit
        optional: true
    output:
      artifact: biomarker
      format: yaml
      schema: schemas/biomarker.json
    execution:
      provider_handler: domain
      self_handler: ptbg
      self_group: ptbg
      self_mode: handoff
    evidence:
      policy: literature_support
      timing: deferred
      cards: {from: owner.cards}
      owner_assignment: false

  germline:
    type: model
    needs: [diagnosis.finalize]
    role: ptbg
    stage: stages/default_reviewed/germline.yaml
    prompt: prompts/default_reviewed/germline.md
    inputs:
      clinical_audit_feedback:
        from: feedback.default_reviewed.clinical_audit
        optional: true
    output:
      artifact: germline
      format: yaml
      schema: schemas/default_reviewed/germline.json
    execution:
      provider_handler: domain
      self_handler: ptbg
      self_group: ptbg
      self_mode: handoff
    evidence:
      policy: literature_support
      timing: deferred
      cards: {from: owner.cards}
      owner_assignment: false

  evidence.assignment:
    type: evidence_review
    needs: [prognosis, treatment, biomarker, germline]
    role: evidence_match
    stage: evidence_match
    prompt: prompts/evidence_match.md
    inputs:
      audit_feedback:
        from: feedback.evidence.audit
        optional: true
    evidence:
      policy: literature_support
      timing: deferred
      cards: {from: owner.cards}
      rescue_match_passes: 1
    output:
      artifact: evidence_assignments
      format: yaml
      schema: schemas/evidence_match.json
    execution:
      provider_handler: evidence_assignment
      self_handler: evidence_assignment
      self_mode: handoff

  evidence.audit:
    type: evidence_review
    needs: [evidence.assignment]
    role: evidence_audit
    stage: evidence_audit
    prompt: prompts/evidence_audit.md
    evidence:
      policy: literature_support
      timing: deferred
      cards: {from: owner.cards}
    output:
      artifact: evidence_audits
      format: yaml
      schema: schemas/evidence_audit.json
    execution:
      provider_handler: evidence_audit
      self_handler: evidence_audit
      self_mode: handoff
    review:
      target: evidence.assignment
      verdict: {predicate: evidence_audit_resolved}
      on_pass: {continue: true}
      on_fail:
        retry_target: true
        feedback:
          from: artifacts.evidence_audits
          as: audit_feedback
        max_cycles: 2
        exhausted: {action: continue_with_dissent}

  evidence.adjudication:
    type: evidence_adjudication
    needs: [evidence.audit]
    barrier_for: [evidence.assignment, evidence.audit]
    role: evidence_adjudication
    prompt: prompts/evidence_adjudicate.md
    evidence:
      policy: literature_support
      timing: deferred
      cards: {from: owner.cards}
    output:
      artifact: evidence_adjudication
      format: yaml
      schema: schemas/evidence_adjudicate.json
    execution:
      provider_handler: evidence_adjudication
      self_handler: evidence_adjudication
      self_mode: handoff

  evidence.finalize:
    type: transform
    needs: [evidence.adjudication]
    transform: finalize_evidence
    output: {artifact: evidence_enriched}
    execution:
      provider_handler: evidence_finalize
      self_handler: evidence_finalize
      self_mode: deterministic

  clinical.packet:
    type: transform
    needs: [evidence.finalize]
    transform: default_reviewed_clinical_packet
    output:
      artifact: default_reviewed_clinical_packet
      format: yaml
    execution:
      provider_handler: generic_transform
      self_handler: generic_transform
      self_mode: deterministic

  clinical.audit:
    type: model
    needs: [clinical.packet]
    role: reasoning_audit
    prompt: prompts/default_reviewed/clinical_audit.md
    inputs:
      clinical_packet: {from: artifacts.default_reviewed_clinical_packet}
    output:
      artifact: clinical_audit
      format: yaml
      schema: schemas/default_reviewed/clinical_audit.json
    execution:
      provider_handler: generic_model
      self_handler: generic_model
      self_mode: handoff
    review:
      target: diagnosis.who1
      verdict:
        path: status
        pass_values: [pass]
      on_pass: {continue: true}
      on_fail:
        retry_target: true
        feedback:
          from: artifacts.clinical_audit
          as: clinical_audit_feedback
        max_cycles: 2
        exhausted: {action: stop}

  report.blocks:
    type: transform
    needs: [clinical.audit]
    transform: report_blocks
    output: {artifact: report_blocks}
    execution:
      provider_handler: report_blocks
      self_handler: report_blocks
      self_mode: deterministic

  report.write:
    type: render/report
    needs: [report.blocks]
    role: report_write
    stage: report_write
    prompt: prompts/report_write.md
    output:
      artifact: report_draft
      format: yaml
      schema: schemas/report_write.json
    execution:
      provider_handler: report_write
      self_handler: report_write
      self_mode: handoff

  report.preservation:
    type: model
    needs: [report.write]
    role: preservation_check
    stage: report_preservation
    prompt: prompts/report_preservation.md
    output:
      artifact: report_preservation
      format: yaml
      schema: schemas/report_preservation.json
    execution:
      provider_handler: report_preservation
      self_handler: report_preservation
      self_mode: handoff
      self: {enabled: false}

  report.finalize:
    type: transform
    needs: [report.preservation]
    transform: finalize_report
    output: {artifact: final_report}
    execution:
      provider_handler: report_finalize
      self_handler: report_finalize
      self_mode: deterministic

presentation:
  progress_phases:
  - id: preparation
    label: Preparation
    steps: [structure, corpus]
  - id: diagnosis
    label: Diagnosis
    steps:
    - diagnosis.who1
    - diagnosis.who1.routing_change
    - diagnosis.who1.evidence.assignment
    - diagnosis.who1.evidence.audit
    - diagnosis.who1.evidence.adjudication
    - diagnosis.who1.commit
    - diagnosis.who2
    - diagnosis.icc
    - diagnosis.finalize
  - id: prognosis
    label: Prognosis
    steps: [prognosis]
  - id: treatment
    label: Treatment
    steps: [treatment]
  - id: biomarker
    label: Biomarker
    steps: [biomarker]
  - id: germline
    label: Germline
    steps: [germline]
  - id: evidence
    label: Evidence
    steps: [evidence.assignment, evidence.audit, evidence.adjudication, evidence.finalize]
  - id: clinical_audit
    label: Clinical audit
    steps: [clinical.packet, clinical.audit]
  - id: report
    label: Report
    steps: [report.blocks, report.write, report.preservation, report.finalize]
