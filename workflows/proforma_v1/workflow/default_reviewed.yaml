version: 1
workflow_id: proforma-v1-default-reviewed
self_groups:
  ptbg:
    strategy: batch_ready
evidence_policies:
  literature_support:
    assignment:
      role: evidence_match
      prompt: prompts/evidence_match.md
    audit:
      role: evidence_audit
      prompt: prompts/evidence_audit.md
    adjudication:
      role: evidence_adjudication
      prompt: prompts/evidence_adjudicate.md
  diagnosis_complete_support:
    assignment:
      role: evidence_match
      prompt: prompts/evidence/diagnosis_match.md
    audit:
      role: evidence_audit
      prompt: prompts/evidence/diagnosis_audit.md
    adjudication:
      role: evidence_adjudication
      prompt: prompts/evidence/diagnosis_adjudicate.md
steps:
  structure:
    type: model
    role: structure
    stage: structure_case
    prompt: prompts/structure_case.md
    inputs:
      case_text:
        from: run.case_text
      panel_scope:
        from: assets.ngs_panel_scope
    output:
      artifact: structured_case
      format: json
      schema: schemas/structured_case.json
    checks:
    - rule: sequential_ids
      path: variants
      field: variant_id
      prefix: V
    execution:
      provider_handler: structure
      self_handler: structure
      self_mode: handoff
  corpus:
    type: transform
    needs:
    - structure
    transform: load_corpus
    output:
      artifact: corpus_state
    execution:
      provider_handler: corpus
      self_handler: corpus
      self_mode: deterministic
  diagnosis.who1:
    type: model
    needs:
    - corpus
    role: diagnosis
    stage: diagnosis_who5
    prompt: prompts/default_reviewed/diagnosis_who5.md
    inputs:
      reasoning_feedback:
        from: feedback.default_reviewed.who1.reasoning
        optional: true
    output:
      artifact: diagnosis_who1
      format: yaml
      schema: schemas/diagnosis_who5.json
    execution:
      provider_handler: diagnosis_who1
      self_handler: diagnosis_who1
      self_mode: handoff
  who1.packet:
    type: transform
    needs:
    - diagnosis.who1
    transform: default_reviewed_owner_packet
    output:
      artifact: default_reviewed_who1_packet
      format: yaml
    execution:
      provider_handler: generic_transform
      self_handler: generic_transform
      self_mode: deterministic
  who1.secretary:
    type: model
    needs:
    - who1.packet
    role: reasoning_audit
    prompt: prompts/default_reviewed/secretary.md
    inputs:
      owner_packet:
        from: artifacts.default_reviewed_who1_packet
      secretary_feedback:
        from: feedback.default_reviewed.who1.secretary
        optional: true
    output:
      artifact: default_reviewed_who1_secretary
      format: yaml
      schema: schemas/default_reviewed/secretary.json
    execution:
      provider_handler: reasoning_model
      self_handler: reasoning_model
      self_mode: handoff
  who1.secretary.compile:
    type: transform
    needs:
    - who1.secretary
    transform: default_reviewed_compile_secretary
    output:
      artifact: default_reviewed_who1_reasoning
      format: yaml
    execution:
      provider_handler: generic_transform
      self_handler: generic_transform
      self_mode: deterministic
    review:
      target: who1.secretary
      verdict:
        path: status
        pass_values:
        - pass
      on_pass:
        continue: true
      on_fail:
        retry_target: true
        feedback:
          from: artifacts.default_reviewed_who1_reasoning
          as: secretary_feedback
        max_cycles: 2
        exhausted:
          action: stop
  who1.precheck:
    type: model
    needs:
    - who1.secretary.compile
    role: reasoning_audit
    prompt: prompts/default_reviewed/reasoning_precheck.md
    inputs:
      owner_packet:
        from: artifacts.default_reviewed_who1_packet
      compiled_reasoning:
        from: artifacts.default_reviewed_who1_reasoning
      precheck_feedback:
        from: feedback.default_reviewed.who1.precheck
        optional: true
    output:
      artifact: default_reviewed_who1_precheck
      format: yaml
      schema: schemas/default_reviewed/precheck.json
    execution:
      provider_handler: reasoning_model
      self_handler: reasoning_model
      self_mode: handoff
  who1.precheck.validate:
    type: transform
    needs:
    - who1.precheck
    transform: default_reviewed_validate_precheck
    output:
      artifact: default_reviewed_who1_precheck_validation
      format: yaml
    execution:
      provider_handler: generic_transform
      self_handler: generic_transform
      self_mode: deterministic
    review:
