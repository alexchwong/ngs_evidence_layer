stage: diagnosis_who5
version: 1
type: model
role: diagnosis
label: WHO5 diagnosis
prompt: diagnosis_who5.md
output:
  format: yaml
  schema: diagnosis_who5.json
rules:
- rule: enum
  field: schema_disease
  values_from: allowed_diseases
  label: schema disease
- rule: id_subset
  field: variants
  source: registry
- rule: one_row_per_id
  field: variant_assessments
  id_field: variant_id
  source: registry
- rule: enum
  field: variant_assessments[].classification
  values:
  - diagnostic_for_primary
  - nonspecific
  - diagnostic_for_other_pathology
  label: diagnostic classification
retries:
  content: 2
  serialization: 3
