pipeline:
  id: lmstudio
  version: 1
  description: Terraced-v5 lmstudio prototype pipeline.
provider:
  type: openai-compatible
  base_url: http://localhost:1234/v1
  base_url_env: NEL_LMSTUDIO_BASE_URL
  api_key_env: NEL_LMSTUDIO_API_KEY
  timeout_s: 900
models:
  structure:
    model: qwen3-coder-next
    temperature: 0.0
    max_tokens: 65536
  diagnosis:
    model: qwen3-coder-next
    temperature: 0.0
    max_tokens: 65536
  ptbg:
    model: qwen3-coder-next
    temperature: 0.0
    max_tokens: 65536
  statement_generation:
    model: qwen3-coder-next
    temperature: 0.0
    max_tokens: 16384
  statement_audit:
    model: qwen3-coder-next
    temperature: 0.0
    max_tokens: 16384
  evidence_match:
    model: qwen3-coder-next
    temperature: 0.0
    max_tokens: 16384
  evidence_audit:
    model: qwen3-coder-next
    temperature: 0.0
    max_tokens: 16384
  summarization:
    model: qwen3-coder-next
    temperature: 0.0
    max_tokens: 16384
  paraphrasing:
    model: qwen3-coder-next
    temperature: 0.0
    max_tokens: 16384
  semantic_preservation_check:
    model: qwen3-coder-next
    temperature: 0.0
    max_tokens: 16384
  syntax_repair:
    model: qwen3-coder-next
    temperature: 0.0
    max_tokens: 8192
