pipeline:
  id: openrouter
  version: 1
  description: Terraced-v5 openrouter prototype pipeline.
provider:
  type: openai-compatible
  base_url: https://openrouter.ai/api/v1
  base_url_env: NEL_OPENROUTER_BASE_URL
  api_key_env: OPENROUTER_API_KEY
  timeout_s: 900
models:
  structure:
    model: qwen/qwen3-coder-next
    temperature: 0.0
    max_tokens: 65536
  diagnosis:
    model: qwen/qwen3-coder-next
    temperature: 0.0
    max_tokens: 65536
  ptbg:
    model: qwen/qwen3-coder-next
    temperature: 0.0
    max_tokens: 65536
  statement_generation:
    model: qwen/qwen3-coder-next
    temperature: 0.0
    max_tokens: 16384
  statement_audit:
    model: qwen/qwen3-coder-next
    temperature: 0.0
    max_tokens: 16384
  evidence_match:
    model: qwen/qwen3-coder-next
    temperature: 0.0
    max_tokens: 16384
  evidence_audit:
    model: qwen/qwen3-coder-next
    temperature: 0.0
    max_tokens: 16384
  summarization:
    model: qwen/qwen3-coder-next
    temperature: 0.0
    max_tokens: 16384
  paraphrasing:
    model: qwen/qwen3-coder-next
    temperature: 0.0
    max_tokens: 16384
  semantic_preservation_check:
    model: qwen/qwen3-coder-next
    temperature: 0.0
    max_tokens: 16384
  syntax_repair:
    model: qwen/qwen3-coder-next
    temperature: 0.0
    max_tokens: 8192
