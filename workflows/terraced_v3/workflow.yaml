schema_version: 1
workflow_id: terraced-v3
pipeline:
  - id: structure
    module: structure_case
    description: Structure immutable case and stable variant IDs
  - id: corpus
    module: initialise_corpus
    description: Initialise deterministic whole-corpus card identity
  - id: diagnosis
    module: diagnosis_scheduler
    description: Execute the selected diagnosis scheduler and freeze invariant diagnosis outputs
  - id: ptbg
    module: ptbg_scheduler
    description: Execute the selected prognosis/treatment/biomarker/germline scheduler
  - id: evidence
    module: evidence_alignment
    description: Semantically align surfaced fact reasons to supporting cards
  - id: summarization
    module: summarization_scheduler
    description: Execute the selected summarization scheduler over the locked cited fact ledger
  - id: finalise
    module: finalise_report
    description: Deterministically render sentence/card provenance, citations and packages
invariants:
  scheduler_phase_interfaces: [diagnosis, ptbg, summarization]
  diagnosis_authority: WHO5
  icc_blind_to_who5: true
  icc_used_for_routing: false
  cmc_source: deterministic_from_who5_schema_disease
  diagnosis_cmc_history_visible_during_stabilisation: true
  downstream_uses_final_cmcs_only: true
  concurrent_diagnoses_supported: true
  downstream_decision_scope: variant_or_gene_x_diagnosis
  clinical_decisions_before_prose: true
  evidence_alignment_uses_reason_as_semantic_bridge: true
  sentence_card_interpretations_created_deterministically: true
  detected_variants_summary_prepended_invariant: true
  citation_integrity_core_owned: true
  run_root_true_case_input: case.md
  generated_namespaces_numbered_by_creation_order: true
  marking: package_only
