scheduler:
  id: default-summarization
  phase: summarization
  version: 1
  order: 10
  description: Plan statement inclusion/order/merge/split, paraphrase each sentence, then publish citations deterministically.
steps:
- id: plan
  kind: model
  inputs:
    statements: core.statements.cited
  prompt:
    template: prompts/plan.md
    inject:
      statements:
        input: statements
        render: yaml
      output_contract:
        contract: ../common/contracts/summary-plan.md
  output:
    format: yaml
    validator: summary_plan
    contract: ../common/contracts/summary-plan.md
- id: prepare
  kind: operation
  operation: prepare_paraphrase_items
  inputs:
    plan: steps.plan
    statements: core.statements.cited
- id: paraphrase
  kind: model
  foreach: steps.prepare
  depends_on: [prepare]
  role: paraphrasing
  inputs:
    sentence_plan: $item
  prompt:
    template: ../common/prompts/paraphrase.md
    inject:
      sentence_plan:
        input: sentence_plan
        render: yaml
      output_contract:
        contract: ../common/contracts/paraphrase-output.md
  output:
    format: yaml
    validator: paraphrase_sentence
    contract: ../common/contracts/paraphrase-output.md
- id: publish
  kind: operation
  operation: publish_summary
  depends_on: [paraphrase]
  inputs:
    plan: steps.plan
    paraphrases: steps.paraphrase
    statements: core.statements.cited
outputs:
  summary: steps.publish.summary
interface:
  inputs:
    cited_statements:
      contract: core.statements.cited
  outputs:
    summary:
      contract: ../common/contracts/summary-output.md
