scheduler:
  id: evidence-first
  phase: ptbg
  version: 1
  order: 20
  description: Normalise relevant cards first, then independently adjudicate each clinical domain.
steps:
- id: normalize
  kind: model
  foreach: domains
  inputs:
    diagnoses: core.diagnosis.who5.active
    evidence: core.evidence.domain-current
    domain: $item
  prompt:
    template: prompts/normalize_evidence.md
    inject:
      domain:
        input: domain
        render: text
      diagnoses:
        input: diagnoses
        render: yaml
      evidence:
        input: evidence
        render: text
      output_contract:
        contract: local.normalized-evidence
  output:
    format: yaml
    validator: normalized_evidence
    contract: local.normalized-evidence
- id: adjudicate
  kind: model
  foreach: domains
  depends_on:
  - normalize
  inputs:
    case: core.case.structured
    diagnoses: core.diagnosis.who5.active
    scope: core.ptbg.task-scope
    normalized_evidence: steps.normalize[$item]
  prompt:
    template: prompts/adjudicate.md
    inject:
      common_rules:
        prompt: ../../common/prompts/domain_task.md
      domain_contract:
        contract_select:
          prognosis: ../common/contracts/prognosis-output.md
          treatment: ../common/contracts/treatment-output.md
          biomarker: ../common/contracts/biomarker-output.md
          germline: ../common/contracts/germline-output.md
      case:
        input: case
        render: json
      diagnoses:
        input: diagnoses
        render: yaml
      scope:
        input: scope
        render: yaml
      normalized_evidence:
        input: normalized_evidence
        render: yaml
  output:
    format: yaml
    validator: domain
    contract_select:
      prognosis: ../common/contracts/prognosis-output.md
      treatment: ../common/contracts/treatment-output.md
      biomarker: ../common/contracts/biomarker-output.md
      germline: ../common/contracts/germline-output.md
- id: publish
  kind: operation
  operation: publish_domains
  inputs:
    states: steps.adjudicate
outputs:
  prognosis: steps.publish.prognosis
  treatment: steps.publish.treatment
  biomarker: steps.publish.biomarker
  germline: steps.publish.germline
interface:
  inputs:
    case:
      contract: core.case.structured
    who5:
      contract: core.requirements.diagnosis-who5
    routing:
      contract: core.requirements.diagnosis-routing
    card_identity:
      contract: core.cards.identity
  outputs:
    prognosis:
      contract: ../common/contracts/prognosis-output.md
    treatment:
      contract: ../common/contracts/treatment-output.md
    biomarker:
      contract: ../common/contracts/biomarker-output.md
    germline:
      contract: ../common/contracts/germline-output.md
