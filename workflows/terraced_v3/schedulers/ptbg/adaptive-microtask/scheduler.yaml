scheduler:
  id: adaptive-microtask
  phase: ptbg
  version: 1
  order: 50
  description: Initial domain batches followed by targeted review only for high-impact decision cells.
steps:
- id: initial
  kind: model
  foreach: domains
  inputs:
    case: core.case.structured
    diagnoses: core.diagnosis.who5.active
    scope: core.ptbg.task-scope
    evidence: core.evidence.domain-current
  prompt:
    template: prompts/initial_domain.md
    inject:
      common_rules:
        prompt: ../../common/prompts/domain_task.md
      domain_contract:
        contract_select:
          prognosis: ../common/contracts/prognosis-output.md
          treatment: ../common/contracts/treatment-output.md
          biomarker: ../common/contracts/biomarker-output.md
          germline: ../common/contracts/germline-output.md
      case:
        input: case
        render: json
      diagnoses:
        input: diagnoses
        render: yaml
      scope:
        input: scope
        render: yaml
      evidence:
        input: evidence
        render: text
  output:
    format: yaml
    validator: domain
    contract_select:
      prognosis: ../common/contracts/prognosis-output.md
      treatment: ../common/contracts/treatment-output.md
      biomarker: ../common/contracts/biomarker-output.md
      germline: ../common/contracts/germline-output.md
- id: select
  kind: operation
  operation: select_high_impact
  inputs:
    states: steps.initial
- id: review
  kind: model
  foreach: steps.select
  depends_on:
  - select
  retain_item_metadata: true
  inputs:
    cell: $item
    case: core.case.structured
    diagnoses: core.diagnosis.who5.active
    evidence: core.evidence.cell-domain
  prompt:
    template: prompts/review_cell.md
    inject:
      cell:
        input: cell
        render: yaml
      case:
        input: case
        render: json
      diagnoses:
        input: diagnoses
        render: yaml
      evidence:
        input: evidence
        render: text
      output_contract:
        contract: local.cell-review
  output:
    format: yaml
    validator: adaptive_cell_review
    contract: local.cell-review
- id: apply_reviews
  kind: operation
  operation: apply_cell_reviews
  inputs:
    initial: steps.initial
    reviews: steps.review
- id: publish
  kind: operation
  operation: publish_domains
  inputs:
    states: steps.apply_reviews
outputs:
  prognosis: steps.publish.prognosis
  treatment: steps.publish.treatment
  biomarker: steps.publish.biomarker
  germline: steps.publish.germline
interface:
  inputs:
    case:
      contract: core.case.structured
    who5:
      contract: core.requirements.diagnosis-who5
    routing:
      contract: core.requirements.diagnosis-routing
    card_identity:
      contract: core.cards.identity
  outputs:
    prognosis:
      contract: ../common/contracts/prognosis-output.md
    treatment:
      contract: ../common/contracts/treatment-output.md
    biomarker:
      contract: ../common/contracts/biomarker-output.md
    germline:
      contract: ../common/contracts/germline-output.md
