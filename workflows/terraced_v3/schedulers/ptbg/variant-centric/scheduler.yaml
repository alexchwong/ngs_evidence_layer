scheduler:
  id: variant-centric
  phase: ptbg
  version: 1
  order: 30
  description: One cross-domain task per detected variant, plus a case-level germline phenotype task.
steps:
  - id: variant_review
    kind: model
    foreach: variants
    inputs:
      variant: $item
      case: core.case
      diagnoses: core.diagnoses
      evidence: evidence.all
      include_treatment: core.treatment_owner[$item]
      variant_id: $item.variant_id
    prompt:
      template: prompts/variant_review.md
      inject:
        variant: {input: variant, render: yaml}
        include_treatment: {input: include_treatment, render: text}
        variant_id: {input: variant_id, render: text}
        case: {input: case, render: json}
        diagnoses: {input: diagnoses, render: yaml}
        evidence: {input: evidence, render: evidence_by_domain}
    output:
      format: yaml
      validator: variant_cross_domain
      contract: variant_cross_domain
  - id: germline_clinical_picture
    kind: model
    inputs:
      case: core.case
      evidence: evidence.germline
    prompt:
      template: prompts/germline_clinical_picture.md
      inject:
        case: {input: case, render: json}
        evidence: {input: evidence, render: germline_evidence}
    output:
      format: yaml
      validator: germline_clinical_picture
      contract: germline_clinical_picture
  - id: assemble
    kind: operation
    operation: assemble_variant_outputs
    inputs:
      variants: steps.variant_review
      clinical_picture: steps.germline_clinical_picture
  - id: publish
    kind: operation
    operation: publish_domains
    inputs:
      states: steps.assemble
outputs:
  prognosis: steps.publish.prognosis
  treatment: steps.publish.treatment
  biomarker: steps.publish.biomarker
  germline: steps.publish.germline
