gnosis.","locator":"Acute myeloid leukemia; Table 25"},{"id":"arber-2022-blood-140-1200-C0155","paper":"arber-2022-blood-140-1200","category":"prognosis","tier":"restated secondary","genes":["MYC"],"diseases":["B-ALL"],"text":"B-ALL with MYC rearrangement is associated with poor prognosis.","locator":"B-ALL/T-ALL; new B-ALL entities; Table 28"},{"id":"arber-2022-blood-140-1200-C0156","paper":"arber-2022-blood-140-1200","category":"prognosis","tier":"restated secondary","genes":["DUX4","IKZF1"],"diseases":["B-ALL"],"text":"DUX4-rearranged B-ALL is associated with excellent prognosis in children and adults, even with other poor-risk features such as IKZF1 deletion.","locator":"B-ALL/T-ALL; new B-ALL entities; Table 28"},{"id":"arber-2022-blood-140-1200-C0157","paper":"arber-2022-blood-140-1200","category":"prognosis","tier":"restated secondary","genes":["MEF2D"],"diseases":["B-ALL"],"text":"MEF2D-rearranged B-ALL has poor prognosis.","locator":"B-ALL/T-ALL; new B-ALL entities; Table 28"},{"id":"arber-2022-blood-140-1200-C0158","paper":"arber-2022-blood-140-1200","category":"prognosis","tier":"restated secondary","genes":["EP300","TCF3","ZNF384"],"diseases":["B-ALL"],"text":"In ZNF384-rearranged B-ALL or B/myeloid acute leukemia of ambiguous lineage, prognosis varies by fusion partner, with EP300-associated disease having the best and TCF3-associated disease the worst prognosis.","locator":"B-ALL/T-ALL; new B-ALL entities; Table 28"},{"id":"arber-2022-blood-140-1200-C0159","paper":"arber-2022-blood-140-1200","category":"prognosis","tier":"restated secondary","genes":["KMT2A","NUTM1"],"diseases":["B-ALL"],"text":"NUTM1-rearranged B-ALL has a much more favorable prognosis than KMT2A-rearranged infant leukemia.","locator":"B-ALL/T-ALL; new B-ALL entities; Table 28"},{"id":"arber-2022-blood-140-1200-C0160","paper":"arber-2022-blood-140-1200","category":"prognosis","tier":"restated secondary","genes":["HLF"],"diseases":["B-ALL"],"text":"HLF-rearranged B-ALL has very poor prognosis.","locator":"B-ALL/T-ALL; new B-ALL entities; Table 28"},{"id":"arber-2022-blood-140-1200-C0162","paper":"arber-2022-blood-140-1200","category":"prognosis","tier":"restated secondary","genes":["IKZF1"],"diseases":["B-ALL"],"text":"B-ALL with IKZF1 N159Y has intermediate prognosis in the ICC summary table.","locator":"B-ALL/T-ALL; new B-ALL entities; Table 28"},{"id":"arber-2022-blood-140-1200-C0163","paper":"arber-2022-blood-140-1200","category":"prognosis","tier":"restated secondary","genes":["PAX5"],"diseases":["B-ALL"],"text":"PAX5 P80R B-ALL has a relatively favorable prognosis, particularly in adults.","locator":"B-ALL/T-ALL; new B-ALL entities; Table 28"},{"id":"arber-2022-blood-140-1200-C0165","paper":"arber-2022-blood-140-1200","category":"prognosis","tier":"restated secondary","genes":["CEBPE","IGH","ZEB2"],"diseases":["B-ALL"],"text":"B-ALL cases with ZEB2 H1038R that co-cluster with IGH::CEBPE have poor prognosis.","locator":"B-ALL/T-ALL; provisional B-ALL entities"},{"id":"arber-2022-blood-140-1200-C0166","paper":"arber-2022-blood-140-1200","category":"treatment","tier":"restated secondary","genes":["PDGFRA","PDGFRB"],"diseases":["myeloid/lymphoid neoplasm with eosinophilia and TK fusion"],"text":"PDGFRA-rearranged and PDGFRB-rearranged myeloid/lymphoid neoplasms with eosinophilia and tyrosine kinase gene fusions show excellent response to tyrosine kinase inhibitor therapy.","locator":"Myeloid/lymphoid neoplasms with eosinophilia and tyrosine kinase gene fusions; Table 10"},{"id":"arber-2022-blood-140-1200-C0167","paper":"arber-2022-blood-140-1200","category":"treatment","tier":"restated secondary","genes":["FGFR1"],"diseases":["myeloid/lymphoid neoplasm with eosinophilia and TK fusion"],"text":"FGFR1-rearranged myeloid/lymphoid neoplasm with eosinophilia and tyrosine kinase gene fusion has a high rate of response to FGFR inhibition such as pemigatinib, especially in chronic phase.","locator":"Myeloid/lymphoid neoplasms with eosinophilia and tyrosine kinase gene fusions; Table 10"},{"id":"arber-2022-blood-140-1200-C0168","paper":"arber-2022-blood-140-1200","category":"treatment","tier":"restated secondary","genes":["JAK2"],"diseases":["myeloid/lymphoid neoplasm with eosinophilia and TK fusion"],"text":"JAK2-rearranged myeloid/lymphoid neoplasm with eosinophilia and tyrosine kinase gene fusion has shown limited responses to ruxolitinib.","locator":"Myeloid/lymphoid neoplasms with eosinophilia and tyrosine kinase gene fusions; Table 10"},{"id":"arber-2022-blood-140-1200-C0170","paper":"arber-2022-blood-140-1200","category":"treatment","tier":"restated secondary","genes":["ABL1","ETV6"],"diseases":["myeloid/lymphoid neoplasm with eosinophilia and TK fusion"],"text":"ETV6::ABL1-rearranged myeloid/lymphoid neoplasm with eosinophilia and tyrosine kinase gene fusion has shown therapeutic benefit from tyrosine kinase inhibitors, especially second-generation TKIs.","locator":"Myeloid/lymphoid neoplasms with eosinophilia and tyrosine kinase gene fusions; Table 10"},{"id":"arber-2022-blood-140-1200-C0172","paper":"arber-2022-blood-140-1200","category":"treatment","tier":"restated secondary","genes":["TP53"],"diseases":["MDS","MDS/AML","AML"],"text":"The ICC groups TP53-mutated MDS, MDS/AML, and AML because their similarly aggressive behavior irrespective of blast percentage is stated to warrant a more unified treatment strategy across the blast spectrum.","locator":"Premalignant clonal cytopenias and MDS; myeloid neoplasms with mutated TP53"},{"id":"arber-2022-blood-140-1200-C0173","paper":"arber-2022-blood-140-1200","category":"treatment","tier":"restated secondary","genes":["ABL1","BCR"],"diseases":["B-ALL"],"text":"BCR::ABL1-like B-ALL with an ABL-class fusion has a distinctive response pattern to ABL1-class tyrosine kinase inhibitors, making recognition of this subgroup treatment-relevant.","locator":"B-ALL/T-ALL; BCR::ABL1-like B-ALL"},{"id":"arber-2022-blood-140-1200-C0178","paper":"arber-2022-blood-140-1200","category":"biomarker","tier":"guideline criterion","genes":["JAK2"],"diseases":["PV"],"text":"For suspected polycythemia vera, the ICC recommends highly sensitive JAK2 V617F testing (<1% sensitivity); if negative, noncanonical or atypical JAK2 mutations in exons 12-15 should be sought.","locator":"Myeloproliferative neoplasms; PV; Table 3"},{"id":"arber-2022-blood-140-1200-C0179","paper":"arber-2022-blood-140-1200","category":"biomarker","tier":"restated secondary","genes":["ABL1","BCR","CALR","JAK2","MPL"],"diseases":["MPN"],"text":"In BCR::ABL1-negative MPN, a JAK2 V617F VAF <1% should prompt a search for coexisting canonical CALR and MPL mutations.","locator":"Myeloproliferative neoplasms; MPN driver mutations"},{"id":"arber-2022-blood-140-1200-C0180","paper":"arber-2022-blood-140-1200","category":"biomarker","tier":"guideline criterion","genes":["CALR","JAK2","MPL"],"diseases":["ET"],"text":"For suspected essential thrombocythemia, the ICC recommends highly sensitive assays for JAK2 V617F (<1% sensitivity) and CALR/MPL (1%-3% sensitivity), with consideration of noncanonical JAK2 and MPL mutations when canonical testing is negative.","locator":"Myeloproliferative neoplasms; essential thrombocythemia; Table 4"},{"id":"arber-2022-blood-140-1200-C0181","paper":"arber-2022-blood-140-1200","category":"biomarker","tier":"guideline criterion","genes":["CALR","JAK2","MPL"],"diseases":["PMF"],"text":"For suspected primary myelofibrosis, the ICC recommends highly sensitive assays for JAK2 V617F (<1% sensitivity) and CALR/MPL (1%-3% sensitivity), with consideration of noncanonical JAK2 and MPL mutations when canonical testing is negative.","locator":"Myeloproliferative neoplasms; primary myelofibrosis; Table 5"},{"id":"arber-2022-blood-140-1200-C0182","paper":"arber-2022-blood-140-1200","category":"biomarker","tier":"guideline criterion","genes":["CALR","JAK2","MPL"],"diseases":["MPN-U"],"text":"For suspected MPN-U, the ICC recommends highly sensitive JAK2 V617F testing with sensitivity <1% and CALR/MPL testing with sensitivity 1%-3%; when canonical testing is negative, noncanonical JAK2 and MPL mutations should be considered.","locator":"Myeloproliferative neoplasms; MPN-U; Table 9 footnote"},{"id":"arber-2022-blood-140-1200-C0184","paper":"arber-2022-blood-140-1200","category":"biomarker","tier":"guideline criterion","genes":["KIT"],"diseases":["mastocytosis"],"text":"In suspected systemic mastocytosis without a KIT mutation, particularly when eosinophilia is present, the ICC requires exclusion of tyrosine-kinase gene fusions associated with myeloid/lymphoid neoplasm with eosinophilia.","locator":"Mastocytosis; Table 11 footnote"},{"id":"arber-2022-blood-140-1200-C0185","paper":"arber-2022-blood-140-1200","category":"biomarker","tier":"guideline criterion","genes":["KIT"],"diseases":["mastocytosis"],"text":"In suspected systemic mastocytosis, high-sensitivity PCR is recommended for KIT D816V; if negative, testing for other KIT mutation variants is strongly recommended.","locator":"Mastocytosis; Table 11"},{"id":"arber-2022-blood-140-1200-C0186","paper":"arber-2022-blood-140-1200","category":"biomarker","tier":"guideline criterion","genes":["ABL1","ETV6","FGFR1","FLT3","JAK2","PDGFRA","PDGFRB"],"diseases":["mastocytosis"],"text":"When eosinophilia is present in systemic mastocytosis, the ICC recommends excluding PDGFRA, PDGFRB, FGFR1, JAK2, FLT3, and ETV6::ABL1 tyrosine-kinase gene fusions associated with myeloid/lymphoid neoplasm with eosinophilia.","locator":"Mastocytosis; systemic mastocytosis with associated myeloid neoplasm; Table 12"},{"id":"arber-2022-blood-140-1200-C0187","paper":"arber-2022-blood-140-1200","category":"biomarker","tier":"restated secondary","genes":["ABL1","BCR"],"diseases":["B-ALL"],"text":"FISH detection of BCR::ABL1 in granulocytes supports multilineage involvement, whereas FISH positivity confined to lymphoblasts supports lymphoid-only BCR::ABL1-positive B-ALL.","locator":"B-ALL/T-ALL; BCR::ABL1-positive B-ALL"},{"id":"arber-2022-blood-140-1200-C0188","paper":"arber-2022-blood-140-1200","category":"biomarker","tier":"restated secondary","genes":["ABL1","BCR"],"diseases":["B-ALL"],"text":"In some BCR::ABL1-positive B-ALL cases, cell sorting may be necessary to obtain enough myeloid cells for FISH assessment of multilineage versus lymphoid-only BCR::ABL1 involvement.","locator":"B-ALL/T-ALL; BCR::ABL1-positive B-ALL"},{"id":"arber-2022-blood-140-1200-C0189","paper":"arber-2022-blood-140-1200","category":"biomarker","tier":"restated secondary","genes":["ABL1","BCR"],"diseases":["B-ALL"],"text":"After treatment of BCR::ABL1-positive B-ALL with multilineage involvement, high BCR::ABL1 RT-PCR positivity can persist despite little or no MRD by flow cytometry or other molecular MRD methods, so BCR::ABL1 PCR alone may not reflect residual lymphoblastic disease.","locator":"B-ALL/T-ALL; BCR::ABL1-positive B-ALL"},{"id":"arber-2022-blood-140-1200-C0190","paper":"arber-2022-blood-140-1200","category":"biomarker","tier":"restated secondary","genes":["ABL1","BCR","CRLF2"],"diseases":["B-ALL"],"text":"CRLF2 rearrangement in BCR::ABL1-like B-ALL can often be detected by FISH or screened by flow cytometry because CRLF2 is upregulated.","locator":"B-ALL/T-ALL; BCR::ABL1-like B-ALL"},{"id":"arber-2022-blood-140-1200-C0191","paper":"arber-2022-blood-140-1200","category":"biomarker","tier":"restated secondary","genes":["MYC"],"diseases":["B-ALL"],"text":"Somatic hypermutation of immunoglobulin V(H) genes favors a MYC-rearranged mature B-cell lymphoma, whereas B-ALL with MYC rearrangement has unmutated immunoglobulin V(H) genes.","locator":"B-ALL/T-ALL; B-ALL with MYC rearrangement"},{"id":"arber-2022-blood-140-1200-C0193","paper":"arber-2022-blood-140-1200","category":"biomarker","tier":"restated secondary","genes":["DUX4"],"diseases":["B-ALL"],"text":"DUX4 overexpression is specific for DUX4-rearranged B-ALL and can be detected by quantitation of DUX4 gene expression or immunohistochemistry.","locator":"B-ALL/T-ALL; new B-ALL entities; Table 28"},{"id":"arber-2022-blood-140-1200-C0194","paper":"arber-2022-blood-140-1200","category":"biomarker","tier":"restated secondary","genes":["DUX4"],"diseases":["B-ALL"],"text":"In DUX4-rearranged B-ALL, CD371 expression is associated with DUX4 rearrangement and may be identified by flow cytometry.","locator":"B-ALL/T-ALL; DUX4-rearranged B-ALL; Table 28"},{"id":"arber-2022-blood-140-1200-C0195","paper":"arber-2022-blood-140-1200","category":"biomarker","tier":"restated secondary","genes":["DUX4","IGH"],"diseases":["B-ALL"],"text":"In DUX4-rearranged B-ALL, the DUX4 rearrangement is difficult to detect by FISH, and whole-transcriptome sequencing may also miss some cases because of repetitive genomic features at the DUX4 and IGH loci.","locator":"B-ALL/T-ALL; DUX4-rearranged B-ALL; Table 28 footnote"},{"id":"arber-2022-blood-140-1200-C0196","paper":"arber-2022-blood-140-1200","category":"biomarker","tier":"guideline criterion","genes":["HLF","MEF2D"],"diseases":["B-ALL"],"text":"Whole-transcriptome sequencing and corresponding MEF2D or HLF FISH are listed diagnostic approaches for MEF2D-rearranged or HLF-rearranged B-ALL, respectively.","locator":"B-ALL/T-ALL; new B-ALL entities; Table 28"},{"id":"arber-2022-blood-140-1200-C0197","paper":"arber-2022-blood-140-1200","category":"biomarker","tier":"restated secondary","genes":["MEF2D"],"diseases":["B-ALL"],"text":"MEF2D-rearranged B-ALL can be suspected from a CD10-negative or dim, CD38-positive, cytoplasmic-mu-positive immunophenotype.","locator":"B-ALL/T-ALL; MEF2D-rearranged B-ALL; Table 28"},{"id":"arber-2022-blood-140-1200-C0198","paper":"arber-2022-blood-140-1200","category":"biomarker","tier":"restated secondary","genes":["ZNF362","ZNF384"],"diseases":["B-ALL"],"text":"In ZNF384- or ZNF362-rearranged leukemia, MPO negativity supports classification as B-ALL whereas MPO positivity supports B/myeloid mixed-phenotype acute leukemia.","locator":"B-ALL/T-ALL; ZNF384/ZNF362-rearranged leukemia"},{"id":"arber-2022-blood-140-1200-C0199","paper":"arber-2022-blood-140-1200","category":"biomarker","tier":"guideline criterion","genes":["ZNF362","ZNF384"],"diseases":["B-ALL"],"text":"Whole-transcriptome sequencing, with FISH possible, is listed as a diagnostic approach for ZNF384- or ZNF362-rearranged B-ALL.","locator":"B-ALL/T-ALL; new B-ALL entities; Table 28"},{"id":"arber-2022-blood-140-1200-C0200","paper":"arber-2022-blood-140-1200","category":"biomarker","tier":"restated secondary","genes":["NUTM1"],"diseases":["B-ALL"],"text":"NUTM1-rearranged B-ALL can be diagnosed using a standard NUTM1 break-apart FISH probe set.","locator":"B-ALL/T-ALL; new B-ALL entities; Table 28"},{"id":"arber-2022-blood-140-1200-C0201","paper":"arber-2022-blood-140-1200","category":"biomarker","tier":"restated secondary","genes":["NUTM1"],"diseases":["B-ALL"],"text":"NUTM1-rearranged B-ALL typically has a CD10-negative or dim immunophenotype with expression of myeloid markers including CD13, CD15, or CD33.","locator":"B-ALL/T-ALL; NUTM1-rearranged B-ALL; Table 28"},{"id":"arber-2022-blood-140-1200-C0202","paper":"arber-2022-blood-140-1200","category":"biomarker","tier":"restated secondary","genes":["NUTM1"],"diseases":["B-ALL"],"text":"In addition to NUTM1 break-apart FISH, the ICC table lists whole-transcriptome sequencing and NUTM1-overexpression assays by whole-transcriptome sequencing, RT-PCR, or immunohistochemistry as diagnostic approaches for NUTM1-rearranged B-ALL.","locator":"B-ALL/T-ALL; NUTM1-rearranged B-ALL; Table 28"},{"id":"arber-2022-blood-140-1200-C0203","paper":"arber-2022-blood-140-1200","category":"biomarker","tier":"guideline criterion","genes":["CDX2","UBTF"],"diseases":["B-ALL"],"text":"RT-PCR and whole-transcriptome sequencing are listed diagnostic approaches for CDX2/UBTF-deregulated B-ALL.","locator":"B-ALL/T-ALL; new B-ALL entities; Table 28"},{"id":"arber-2022-blood-140-1200-C0204","paper":"arber-2022-blood-140-1200","category":"biomarker","tier":"restated secondary","genes":["CDX2","UBTF"],"diseases":["B-ALL"],"text":"CDX2/UBTF-deregulated B-ALL is described with a CD10-negative, cytoplasmic-IgM-positive immunophenotype.","locator":"B-ALL/T-ALL; CDX2/UBTF-deregulated B-ALL; Table 28"},{"id":"arber-2022-blood-140-1200-C0205","paper":"arber-2022-blood-140-1200","category":"biomarker","tier":"guideline criterion","genes":["IKZF1","PAX5"],"diseases":["B-ALL"],"text":"Exome or gene-panel sequencing is listed as a diagnostic approach for B-ALL with IKZF1 N159Y or PAX5 P80R.","locator":"B-ALL/T-ALL; new B-ALL entities; Table 28"},{"id":"arber-2022-blood-140-1200-C0206","paper":"arber-2022-blood-140-1200","category":"biomarker","tier":"guideline criterion","genes":["PAX5"],"diseases":["B-ALL"],"text":"Complete definition of the provisional PAX5-altered B-ALL group requires gene-expression profiling.","locator":"B-ALL/T-ALL; provisional PAX5-altered B-ALL"},{"id":"arber-2022-blood-140-1200-C0207","paper":"arber-2022-blood-140-1200","category":"biomarker","tier":"restated secondary","genes":["BCL11B"],"diseases":["ETP-ALL"],"text":"Most BCL11B-rearranged ETP-ALL cases may be detected by FISH demonstrating disruption of the BCL11B locus.","locator":"B-ALL/T-ALL; T-ALL"},{"id":"arber-2022-blood-140-1200-C0208","paper":"arber-2022-blood-140-1200","category":"germline","tier":"restated secondary","genes":["NF1"],"diseases":[],"text":"An ICC genetic route to JMML is either a germline NF1 mutation with loss of heterozygosity of NF1, or a clinical diagnosis of neurofibromatosis type 1.","locator":"Pediatric disorders and/or germline mutation-associated disorders; JMML; Tables 22-23"},{"id":"arber-2022-blood-140-1200-C0209","paper":"arber-2022-blood-140-1200","category":"germline","tier":"restated secondary","genes":["CBL"],"diseases":[],"text":"JMML associated with germline CBL requires germline CBL alteration with acquired loss of heterozygosity/biallelic CBL inactivation in hematopoietic cells, although occasional cases remain heterozygous.","locator":"Pediatric disorders and/or germline mutation-associated disorders; JMML; Tables 22-23"},{"id":"arber-2022-blood-140-1200-C0210","paper":"arber-2022-blood-140-1200","category":"germline","tier":"restated secondary","genes":["KRAS","NRAS","PTPN11"],"diseases":[],"text":"PTPN11-, NRAS-, and KRAS-mutated JMML subtypes are typically characterized by heterozygous somatic gain-of-function mutations in children without germline disease.","locator":"Pediatric disorders and/or germline mutation-associated disorders; JMML; Tables 22-23"},{"id":"arber-2022-blood-140-1200-C0211","paper":"arber-2022-blood-140-1200","category":"germline","tier":"restated secondary","genes":["KRAS","NRAS","PTPN11","RIT1"],"diseases":[],"text":"Noonan syndrome with germline PTPN11, NRAS, KRAS, or RIT1 can cause a transient myeloproliferative disorder in the first year of life that may mimic JMML but lacks acquired somatic mutations; the ICC summary describes no secondary mutations and usually a normal karyotype, with rare monosomy 7.","locator":"Pediatric disorders and/or germline mutation-associated disorders; Noonan syndrome-associated myeloproliferative disorder"},{"id":"arber-2022-blood-140-1200-C0212","paper":"arber-2022-blood-140-1200","category":"germline","tier":"restated secondary","genes":["GATA2","SAMD9","SAMD9L"],"diseases":[],"text":"Germline GATA2, SAMD9, and SAMD9L predisposition can precede refractory cytopenia of childhood, in which RCC may represent progression to marrow failure or frank MDS.","locator":"Pediatric disorders and/or germline mutation-associated disorders; refractory cytopenia of childhood; Box 1"},{"id":"arber-2022-blood-140-1200-C0213","paper":"arber-2022-blood-140-1200","category":"germline","tier":"restated secondary","genes":["CEBPA"],"diseases":[],"text":"Germline CEBPA mutation predisposes to AML.","locator":"Hematologic neoplasms with germline predisposition; Table 24"},{"id":"arber-2022-blood-140-1200-C0214","paper":"arber-2022-blood-140-1200","category":"germline","tier":"restated secondary","genes":["DDX41"],"diseases":[],"text":"Germline DDX41 mutation predisposes to both myeloid and lymphoid neoplasms.","locator":"Hematologic neoplasms with germline predisposition; Table 24"},{"id":"arber-2022-blood-140-1200-C0215","paper":"arber-2022-blood-140-1200","category":"germline","tier":"restated secondary","genes":["TP53"],"diseases":[],"text":"Germline TP53 mutation/Li-Fraumeni syndrome predisposes to myeloid and lymphoid malignancies in treatment-naive and therapy-related settings.","locator":"Hematologic neoplasms with germline predisposition; Table 24"},{"id":"arber-2022-blood-140-1200-C0216","paper":"arber-2022-blood-140-1200","category":"germline","tier":"restated secondary","genes":["RUNX1"],"diseases":[],"text":"Germline RUNX1 mutation, associated with a constitutional platelet disorder, predisposes to myeloid and lymphoid neoplasms.","locator":"Hematologic neoplasms with germline predisposition; Table 24"},{"id":"arber-2022-blood-140-1200-C0217","paper":"arber-2022-blood-140-1200","category":"germline","tier":"restated secondary","genes":["ANKRD26"],"diseases":[],"text":"Germline ANKRD26 mutation, associated with a constitutional platelet disorder, predisposes to myeloid neoplasms.","locator":"Hematologic neoplasms with germline predisposition; Table 24"},{"id":"arber-2022-blood-140-1200-C0218","paper":"arber-2022-blood-140-1200","category":"germline","tier":"restated secondary","genes":["ETV6"],"diseases":[],"text":"Germline ETV6 mutation, associated with a constitutional platelet disorder, predisposes to myeloid and lymphoid neoplasms, including ALL.","locator":"Hematologic neoplasms with germline predisposition; Table 24"},{"id":"arber-2022-blood-140-1200-C0219","paper":"arber-2022-blood-140-1200","category":"germline","tier":"restated secondary","genes":["GATA2"],"diseases":[],"text":"Germline GATA2 mutation predisposes to myeloid neoplasms.","locator":"Hematologic neoplasms with germline predisposition; Table 24"},{"id":"arber-2022-blood-140-1200-C0220","paper":"arber-2022-blood-140-1200","category":"germline","tier":"restated secondary","genes":["SAMD9","SAMD9L"],"diseases":[],"text":"Germline SAMD9 or SAMD9L mutation predisposes to myeloid neoplasms and is associated with acquired monosomy 7/del(7q) and MDS.","locator":"Hematologic neoplasms with germline predisposition; Table 24"},{"id":"arber-2022-blood-140-1200-C0221","paper":"arber-2022-blood-140-1200","category":"germline","tier":"restated secondary","genes":["IKZF1","PAX5"],"diseases":[],"text":"Germline PAX5 or IKZF1 mutation predisposes to acute lymphoblastic leukemia.","locator":"Hematologic neoplasms with germline predisposition; Table 24"},{"id":"arber-2022-blood-140-1200-C0222","paper":"arber-2022-blood-140-1200","category":"germline","tier":"restated secondary","genes":["IKZF1","PAX5"],"diseases":[],"text":"Germline PAX5 or IKZF1 mutation can predispose to loss of B-cell subsets and immune deficiency.","locator":"Hematologic neoplasms with germline predisposition; ALL with germline predisposition"},{"id":"arber-2022-blood-140-1200-C0223","paper":"arber-2022-blood-140-1200","category":"germline","tier":"restated secondary","genes":["NF1"],"diseases":[],"text":"Germline NF1 predisposition associated with neurofibromatosis can predispose to JMML.","locator":"Hematologic neoplasms with germline predisposition; Table 24"},{"id":"arber-2022-blood-140-1200-C0224","paper":"arber-2022-blood-140-1200","category":"germline","tier":"restated secondary","genes":["PTPN11"],"diseases":[],"text":"Germline PTPN11 predisposition associated with Noonan syndrome can predispose to JMML or a Noonan-associated myeloproliferative disorder.","locator":"Hematologic neoplasms with germline predisposition; Table 24"},{"id":"arber-2022-blood-140-1200-C0225","paper":"arber-2022-blood-140-1200","category":"germline","tier":"restated secondary","genes":["CBL"],"diseases":[],"text":"Germline CBL predisposition associated with a Noonan-like syndrome can predispose to JMML.","locator":"Hematologic neoplasms with germline predisposition; Table 24"},{"id":"arber-2022-blood-140-1200-C0226","paper":"arber-2022-blood-140-1200","category":"germline","tier":"restated secondary","genes":["BLM"],"diseases":[],"text":"Germline BLM mutation/Bloom syndrome is associated with predisposition to hematologic malignancy.","locator":"Hematologic neoplasms with germline predisposition; Table 24"},{"id":"arber-2022-blood-140-1200-C0227","paper":"arber-2022-blood-140-1200","category":"germline","tier":"restated secondary","genes":["DNMT3A","ERCC6L2","MBD4","XPC"],"diseases":[],"text":"Germline DNMT3A, ERCC6L2, MBD4, or XPC mutation is associated with predisposition to hematologic malignancy.","locator":"Hematologic neoplasms with germline predisposition; Table 24"},{"id":"baliakas-2019-operational-germline-testing-C0002","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"restated secondary","genes":["CEBPA","DDX41","RUNX1","ANKRD26","ETV6","GATA2","SAMD9","SAMD9L","SRP72","CBL","KRAS","NF1","PTPN11","TP53","MECOM"],"diseases":[],"text":"The Nordic 2019 guidelines list germline predisposition involving CEBPA, DDX41, RUNX1, ANKRD26, ETV6, GATA2, SAMD9, SAMD9L, SRP72, CBL, KRAS, NF1, PTPN11, TP53, and MECOM as autosomal dominant.","locator":"Table 1, lines 95-137, 189, 205-211"},{"id":"baliakas-2019-operational-germline-testing-C0003","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"restated secondary","genes":["CEBPA"],"diseases":[],"text":"According to the Nordic 2019 guidelines, germline CEBPA predisposition is associated with AML and has a reported lifetime myeloid-malignancy risk >80%.","locator":"Table 1, lines 95-97"},{"id":"baliakas-2019-operational-germline-testing-C0004","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"restated secondary","genes":["DDX41"],"diseases":[],"text":"The Nordic 2019 guidelines list germline DDX41 predisposition as associated with MDS and AML.","locator":"Table 1, lines 99-103"},{"id":"baliakas-2019-operational-germline-testing-C0007","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"restated secondary","genes":["DDX41"],"diseases":[],"text":"For germline DDX41 predisposition, CML, CMML and lymphomas have also been reported in addition to MDS and AML.","locator":"Table 1, lines 99-103"},{"id":"baliakas-2019-operational-germline-testing-C0010","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"restated secondary","genes":["RUNX1"],"diseases":[],"text":"According to the Nordic 2019 guidelines, germline RUNX1 predisposition is associated with MDS and AML, with ALL also listed, and has a reported lifetime myeloid-malignancy risk of approximately 45%.","locator":"Table 1, lines 111-113"},{"id":"baliakas-2019-operational-germline-testing-C0014","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"restated secondary","genes":["ANKRD26"],"diseases":[],"text":"According to the Nordic 2019 guidelines, germline ANKRD26 predisposition is associated with AML, MDS and CML and has a reported lifetime myeloid-malignancy risk of approximately 8%.","locator":"Table 1, lines 115-117"},{"id":"baliakas-2019-operational-germline-testing-C0016","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"restated secondary","genes":["ETV6"],"diseases":[],"text":"The Nordic 2019 guidelines list germline ETV6 predisposition as associated with ALL, AML and MDS.","locator":"Table 1, lines 119-123"},{"id":"baliakas-2019-operational-germline-testing-C0021","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"restated secondary","genes":["GATA2"],"diseases":[],"text":"According to the Nordic 2019 guidelines, germline GATA2 deficiency predisposes to MDS and AML and has a reported lifetime myeloid-malignancy risk >80%.","locator":"Table 1, lines 123-125"},{"id":"baliakas-2019-operational-germline-testing-C0022","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"restated secondary","genes":["GATA2"],"diseases":[],"text":"GATA2 deficiency syndrome can include B-cell, NK-cell and CD4-cell lymphocytopenia, monocytopenia, viral susceptibility, warts, disseminated nontuberculous mycobacterial infection, lymphedema, sensorineural hearing loss and pulmonary alveolar proteinosis.","locator":"Table 1, lines 123-125"},{"id":"baliakas-2019-operational-germline-testing-C0023","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"restated secondary","genes":["SAMD9","SAMD9L"],"diseases":[],"text":"The Nordic 2019 guidelines list germline SAMD9-related MIRAGE syndrome and SAMD9L-related ataxia-pancytopenia syndrome as predisposing to MDS or AML with monosomy 7.","locator":"Table 1, lines 127-133"},{"id":"baliakas-2019-operational-germline-testing-C0025","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"restated secondary","genes":["SAMD9","SAMD9L"],"diseases":[],"text":"According to the Nordic 2019 guidelines, both SAMD9-related MIRAGE syndrome and SAMD9L-related ataxia-pancytopenia syndrome have a high lifetime risk of myeloid malignancy.","locator":"Table 1, lines 127-133"},{"id":"baliakas-2019-operational-germline-testing-C0027","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"restated secondary","genes":["SAMD9"],"diseases":[],"text":"SAMD9-related MIRAGE syndrome can include cytopenias and marrow failure, growth restriction, infection susceptibility, adrenal hypoplasia, genital phenotypes and enteropathy.","locator":"Table 1, lines 127-129"},{"id":"baliakas-2019-operational-germline-testing-C0028","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"restated secondary","genes":["SAMD9L"],"diseases":[],"text":"SAMD9L-related ataxia-pancytopenia syndrome can include cytopenias and marrow failure, gait disturbance, nystagmus, cerebellar atrophy, white-matter hyperintensities and immunodeficiency.","locator":"Table 1, lines 131-133"},{"id":"baliakas-2019-operational-germline-testing-C0029","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"restated secondary","genes":["SRP72"],"diseases":[],"text":"Germline SRP72 bone marrow failure syndrome is listed as associated with MDS.","locator":"Table 1, lines 135-137"},{"id":"baliakas-2019-operational-germline-testing-C0031","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"restated secondary","genes":["SRP72"],"diseases":[],"text":"Germline SRP72 bone marrow failure syndrome can include congenital sensorineural deafness.","locator":"Table 1, lines 135-137"},{"id":"baliakas-2019-operational-germline-testing-C0033","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"restated secondary","genes":["FANCA","FANCB","FANCC","BRCA2","FANCD2","FANCE","FANCF","FANCG","FANCI","FANCM","PALB2","RAD51C","SLX4"],"diseases":[],"text":"According to the Nordic 2019 guidelines, Fanconi anaemia associated with FANCA, FANCB, FANCC, BRCA2, FANCD2, FANCE, FANCF, FANCG, FANCI, FANCM, PALB2, RAD51C, or SLX4 predisposes to MDS and AML, with a reported lifetime myeloid-malignancy risk of approximately 10%.","locator":"Table 1, lines 139-143"},{"id":"baliakas-2019-operational-germline-testing-C0034","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"restated secondary","genes":["FANCA","FANCB","FANCC","BRCA2","FANCD2","FANCE","FANCF","FANCG","FANCI","FANCM","PALB2","RAD51C","SLX4"],"diseases":[],"text":"Fanconi anaemia associated with FANCA, FANCB, FANCC, BRCA2, FANCD2, FANCE, FANCF, FANCG, FANCI, FANCM, PALB2, RAD51C and SLX4 can include bone marrow failure, short stature, abnormal skin pigmentation, skeletal anomalies, congenital heart disease, ear anomalies, renal malformations and squamous cell carcinomas.","locator":"Table 1, lines 139-143"},{"id":"baliakas-2019-operational-germline-testing-C0036","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"restated secondary","genes":["ELANE","CSF3R","GFI1","SRP54","HAX1","G6PC3","JAGN1","VPS45","WAS"],"diseases":[],"text":"According to the Nordic 2019 guidelines, severe congenital neutropenia associated with ELANE, CSF3R, GFI1, SRP54, HAX1, G6PC3, JAGN1, VPS45, or WAS predisposes to MDS and AML, with a reported lifetime myeloid-malignancy risk of 21–40%.","locator":"Table 1, lines 145-147"},{"id":"baliakas-2019-operational-germline-testing-C0038","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"restated secondary","genes":["SBDS","MLH1","MSH2","MSH6","PMS2","EPCAM","BLM","LIG4","ERCC6L2"],"diseases":[],"text":"The Nordic 2019 guidelines list germline predisposition involving SBDS, MLH1, MSH2, MSH6, PMS2, EPCAM, BLM, LIG4, and ERCC6L2 as autosomal recessive.","locator":"Table 1, lines 149-151, 191-203, 207-211"},{"id":"baliakas-2019-operational-germline-testing-C0039","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"restated secondary","genes":["SBDS"],"diseases":[],"text":"According to the Nordic 2019 guidelines, germline SBDS Shwachman-Diamond syndrome is associated with MDS, AML and ALL and has a reported lifetime myeloid-malignancy risk of 5–24%.","locator":"Table 1, lines 149-151"},{"id":"baliakas-2019-operational-germline-testing-C0040","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"restated secondary","genes":["SBDS"],"diseases":[],"text":"Germline SBDS Shwachman-Diamond syndrome can include neutropenia, pancreatic insufficiency, short stature and skeletal abnormalities.","locator":"Table 1, lines 149-151"},{"id":"baliakas-2019-operational-germline-testing-C0042","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"restated secondary","genes":["RPS19","RPS17","RPS24","RPL35A","RPL5","RPL11","RPL15","RPL26","RPS7","RPS26","RPS10","RPS29","GATA1"],"diseases":[],"text":"According to the Nordic 2019 guidelines, Diamond-Blackfan anaemia associated with RPS19, RPS17, RPS24, RPL35A, RPL5, RPL11, RPL15, RPL26, RPS7, RPS26, RPS10, RPS29, or GATA1 is associated with MDS, AML and ALL and has a reported lifetime myeloid-malignancy risk of approximately 5%.","locator":"Table 1, lines 153-157"},{"id":"baliakas-2019-operational-germline-testing-C0043","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"restated secondary","genes":["RPS19","RPS17","RPS24","RPL35A","RPL5","RPL11","RPL15","RPL26","RPS7","RPS26","RPS10","RPS29","GATA1"],"diseases":[],"text":"Diamond-Blackfan anaemia associated with RPS19, RPS17, RPS24, RPL35A, RPL5, RPL11, RPL15, RPL26, RPS7, RPS26, RPS10, RPS29, or GATA1 can include anaemia with marrow erythroid hypoplasia, small stature and congenital craniofacial, cardiac, skeletal or genitourinary anomalies.","locator":"Table 1, lines 153-157"},{"id":"baliakas-2019-operational-germline-testing-C0045","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"restated secondary","genes":["DKC1","TERT","TERC","TINF2","RTEL1","PARN","ACD","NOP10","NHP2","WRAP53","CTC1"],"diseases":[],"text":"According to the Nordic 2019 guidelines, telomere biology disorders associated with DKC1, TERT, TERC, TINF2, RTEL1, PARN, ACD, NOP10, NHP2, WRAP53, or CTC1 predispose to MDS and AML, with a reported lifetime myeloid-malignancy risk of 2–30%.","locator":"Table 1, lines 171-179"},{"id":"baliakas-2019-operational-germline-testing-C0046","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"restated secondary","genes":["DKC1","TERT","TERC","TINF2","RTEL1","PARN","ACD","NOP10","NHP2","WRAP53","CTC1"],"diseases":[],"text":"Telomere biology disorders associated with DKC1, TERT, TERC, TINF2, RTEL1, PARN, ACD, NOP10, NHP2, WRAP53, or CTC1 can include bone marrow failure, nail dystrophy, abnormal skin pigmentation, oral leukoplakia, early hair graying, pulmonary fibrosis, hepatic fibrosis and squamous cell carcinoma.","locator":"Table 1, lines 171-179"},{"id":"baliakas-2019-operational-germline-testing-C0049","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"restated secondary","genes":["CBL","KRAS","NF1","PTPN11"],"diseases":[],"text":"According to the Nordic 2019 guidelines, RASopathies associated with CBL, KRAS, NF1, or PTPN11 predispose to JMML and AML, with a reported lifetime myeloid-malignancy risk of approximately 10%.","locator":"Table 1, line 189"},{"id":"baliakas-2019-operational-germline-testing-C0050","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"restated secondary","genes":["CBL","KRAS","NF1","PTPN11"],"diseases":[],"text":"RASopathies associated with CBL, KRAS, NF1, or PTPN11 can include short stature, characteristic facial features, cardio-thoracic defects and coagulopathy.","locator":"Table 1, line 189"},{"id":"baliakas-2019-operational-germline-testing-C0051","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"restated secondary","genes":["MLH1","MSH2","MSH6","PMS2","EPCAM"],"diseases":[],"text":"Constitutional mismatch repair deficiency associated with MLH1, MSH2, MSH6, PMS2, or EPCAM is listed as associated with ALL, lymphomas, AML and MDS.","locator":"Table 1, lines 191-197"},{"id":"baliakas-2019-operational-germline-testing-C0053","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"restated secondary","genes":["MLH1","MSH2","MSH6","PMS2","EPCAM"],"diseases":[],"text":"According to the Nordic 2019 guidelines, constitutional mismatch repair deficiency associated with MLH1, MSH2, MSH6, PMS2, or EPCAM has a reported lymphoma/ALL risk of approximately 30%.","locator":"Table 1, lines 191-197"},{"id":"baliakas-2019-operational-germline-testing-C0054","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"restated secondary","genes":["MLH1","MSH2","MSH6","PMS2","EPCAM"],"diseases":[],"text":"Constitutional mismatch repair deficiency associated with MLH1, MSH2, MSH6, PMS2, or EPCAM can include café-au-lait spots, brain tumours, colorectal cancer, osteosarcoma and other solid tumours.","locator":"Table 1, lines 191-197"},{"id":"baliakas-2019-operational-germline-testing-C0057","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"restated secondary","genes":["BLM"],"diseases":[],"text":"According to the Nordic 2019 guidelines, germline BLM Bloom syndrome is associated with ALL, AML/MDS and lymphoma and has a reported lifetime myeloid-malignancy risk of approximately 15%.","locator":"Table 1, line 199"},{"id":"baliakas-2019-operational-germline-testing-C0058","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"restated secondary","genes":["BLM"],"diseases":[],"text":"Germline BLM Bloom syndrome can include growth deficiency, photosensitive skin changes, immunodeficiency, early-onset diabetes, microcephaly, a high-pitched voice, hypogonadism and risk of other cancers.","locator":"Table 1, line 199"},{"id":"baliakas-2019-operational-germline-testing-C0059","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"restated secondary","genes":["LIG4"],"diseases":[],"text":"Germline LIG4 syndrome is listed as associated with MDS, with the risk described as rare.","locator":"Table 1, lines 201-203"},{"id":"baliakas-2019-operational-germline-testing-C0061","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"restated secondary","genes":["LIG4"],"diseases":[],"text":"Germline LIG4 syndrome can include short stature, microcephaly, combined immunodeficiency and pancytopenia.","locator":"Table 1, lines 201-203"},{"id":"baliakas-2019-operational-germline-testing-C0064","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"restated secondary","genes":["TP53"],"diseases":[],"text":"According to the Nordic 2019 guidelines, germline TP53 Li-Fraumeni syndrome is associated with ALL, MDS and AML and has a reported lifetime myeloid-malignancy risk of 2–4%.","locator":"Table 1, line 205"},{"id":"baliakas-2019-operational-germline-testing-C0065","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"restated secondary","genes":["TP53"],"diseases":[],"text":"According to the Nordic 2019 guidelines, germline TP53 Li-Fraumeni syndrome carries a high overall cancer risk—approximately 50% by age 30 and 90% by age 60—with particularly high risk of cancers including adrenocortical carcinoma, brain and breast cancer, choroid plexus carcinoma, colon and lung cancer, and sarcoma.","locator":"Table 1, line 205"},{"id":"baliakas-2019-operational-germline-testing-C0067","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"restated secondary","genes":["MECOM"],"diseases":[],"text":"Germline MECOM is listed among bone marrow failure syndromes associated with MDS and AML.","locator":"Table 1, lines 207-211"},{"id":"baliakas-2019-operational-germline-testing-C0069","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"restated secondary","genes":["MECOM"],"diseases":[],"text":"Germline MECOM-associated bone marrow failure can include skeletal, cardiac and neurological abnormalities.","locator":"Table 1, lines 207-211"},{"id":"baliakas-2019-operational-germline-testing-C0070","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"restated secondary","genes":["ERCC6L2"],"diseases":[],"text":"ERCC6L2 is listed under other germline bone marrow failure syndromes predisposing to myeloid neoplasms.","locator":"Table 1, lines 207-211"},{"id":"baliakas-2019-operational-germline-testing-C0072","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"guideline criterion","genes":["TERC","RUNX1"],"diseases":[],"text":"Poor stem-cell mobilisation in a sibling donor candidate is a clinical clue to hereditary myeloid predisposition and has been reported in rare cases with germline TERC and RUNX1 variants.","locator":"Criteria A footnote 1, line 77"},{"id":"baliakas-2019-operational-germline-testing-C0073","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"guideline criterion","genes":["BRCA2"],"diseases":[],"text":"Under Nordic criterion A3, germline evaluation is indicated for a patient with MDS or AML who has two first- or second-degree relatives with solid tumours, with at least one diagnosed before age 50; BRCA2-related tumour patterns are included among the suggestive cancers.","locator":"Criterion A3 and footnote 2, lines 74 and 78"},{"id":"baliakas-2019-operational-germline-testing-C0075","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"guideline criterion","genes":["RUNX1","GATA2","TP53","ETV6","CEBPA"],"diseases":[],"text":"In patients with MDS or AML, a RUNX1, GATA2, TP53, ETV6, or CEBPA variant detected on a somatic NGS panel at VAF 40–60% or >90% can suggest germline origin; the Nordic 2019 guidelines recommend confirmation in extra-haematological tissue after consent.","locator":"Criterion B discussion, line 221"},{"id":"baliakas-2019-operational-germline-testing-C0078","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"restated secondary","genes":["DDX41"],"diseases":[],"text":"A truncating DDX41 variant is usually of germline origin according to the Nordic 2019 guidelines.","locator":"Criterion B discussion, line 221"},{"id":"baliakas-2019-operational-germline-testing-C0079","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"guideline criterion","genes":["GATA2","SAMD9","SAMD9L"],"diseases":[],"text":"Under the Nordic 2019 recommendations, patients diagnosed with MDS or AML before age 50 who lack a suggestive personal or family history but have monosomy 7, del(7q), or another chromosome 7 aberration with loss of 7q material should be referred for genetic counselling/testing; these abnormalities are particularly common in GATA2-, SAMD9-, and SAMD9L-related germline disorders.","locator":"Criterion C discussion, line 227"},{"id":"baliakas-2019-operational-germline-testing-C0080","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"guideline criterion","genes":["GATA2","ANKRD26"],"diseases":[],"text":"For suspected GATA2- or ANKRD26-related germline predisposition, the Nordic 2019 guidelines state that testing should include noncoding regulatory regions.","locator":"Diagnostic algorithm, line 245; Table 1 line 115"},{"id":"baliakas-2019-operational-germline-testing-C0081","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"restated secondary","genes":["RUNX1","ANKRD26","ETV6"],"diseases":[],"text":"Asymptomatic carriers of germline RUNX1, ANKRD26, or ETV6 variants may have thrombocytopenia or a bleeding tendency at baseline, including bleeding tendency without thrombocytopenia.","locator":"Baseline work-up, line 291"},{"id":"barbui-2015-blood-cancer-journal-5-e369-C0001","paper":"barbui-2015-blood-cancer-journal-5-e369","category":"prognosis","tier":"restated secondary","genes":["JAK2"],"diseases":["ET"],"text":"In essential thrombocythemia, JAK2 (JAK2V617F) mutation is an independent risk factor for future thrombosis in the original IPSET-thrombosis model.","locator":"Opening paragraph, sentence beginning 'In the recent International Prognostic Score for Thrombosis in ET'"},{"id":"barbui-2015-blood-cancer-journal-5-e369-C0002","paper":"barbui-2015-blood-cancer-journal-5-e369","category":"prognosis","tier":"restated secondary","genes":["CALR"],"diseases":["ET"],"text":"In essential thrombocythemia, CALR mutation does not modify thrombosis-risk prediction by the IPSET-thrombosis model.","locator":"Opening paragraph, sentence ending 'was not further affected by the recently discovered CALR mutation'"},{"id":"barbui-2015-blood-cancer-journal-5-e369-C0003","paper":"barbui-2015-blood-cancer-journal-5-e369","category":"prognosis","tier":"univariable or descriptive","genes":["JAK2"],"diseases":["ET"],"text":"Among patients with essential thrombocythemia who are conventionally low risk, defined as age ≤60 years with no history of thrombosis, JAK2 (JAK2V617F)-unmutated patients have lower thrombosis risk than JAK2 (JAK2V617F)-mutated patients, whether or not cardiovascular risk factors are present.","locator":"Opening paragraph conventional-risk definition; discussion paragraph beginning 'The current study quantifies'"},{"id":"barbui-2015-blood-cancer-journal-5-e369-C0004","paper":"barbui-2015-blood-cancer-journal-5-e369","category":"prognosis","tier":"univariable or descriptive","genes":["JAK2"],"diseases":["ET"],"text":"Among patients with essential thrombocythemia who are conventionally high risk, defined by age >60 years and/or a history of thrombosis, the combination of JAK2 (JAK2V617F) mutation and cardiovascular risk factors is associated with higher thrombosis risk than the absence of both additional risk factors.","locator":"Opening paragraph conventional-risk definition; results subsection '(ii) Conventionally assigned high-risk group'"},{"id":"barbui-2015-blood-cancer-journal-5-e369-C0006","paper":"barbui-2015-blood-cancer-journal-5-e369","category":"prognosis","tier":"univariable or descriptive","genes":["JAK2"],"diseases":["ET"],"text":"Among patients with essential thrombocythemia whose conventional high-risk status is defined by a history of thrombosis, regardless of age, JAK2 (JAK2V617F) mutation and/or cardiovascular risk factors provide only limited additional thrombosis-risk information.","locator":"Results paragraph beginning 'Additional analysis revealed limited enhancement'"},{"id":"barbui-2015-blood-cancer-journal-5-e369-C0007","paper":"barbui-2015-blood-cancer-journal-5-e369","category":"prognosis","tier":"univariable or descriptive","genes":["JAK2"],"diseases":["ET"],"text":"The proposed 2015 revision of IPSET-thrombosis classifies essential thrombocythemia with no thrombosis history, age ≤60 years, and JAK2 (JAK2V617F)-unmutated status as very low risk.","locator":"Figure 1c legend and revised four-category risk scheme"},{"id":"barbui-2015-blood-cancer-journal-5-e369-C0008","paper":"barbui-2015-blood-cancer-journal-5-e369","category":"prognosis","tier":"univariable or descriptive","genes":["JAK2"],"diseases":["ET"],"text":"The proposed 2015 revision of IPSET-thrombosis classifies essential thrombocythemia with no thrombosis history, age ≤60 years, and JAK2 (JAK2V617F) mutation as low risk.","locator":"Figure 1c legend and revised four-category risk scheme"},{"id":"barbui-2015-blood-cancer-journal-5-e369-C0009","paper":"barbui-2015-blood-cancer-journal-5-e369","category":"prognosis","tier":"univariable or descriptive","genes":["JAK2"],"diseases":["ET"],"text":"The proposed 2015 revision of IPSET-thrombosis classifies essential thrombocythemia with no thrombosis history, age >60 years, and JAK2 (JAK2V617F)-unmutated status as intermediate risk.","locator":"Figure 1d legend and revised four-category risk scheme"},{"id":"barbui-2015-blood-cancer-journal-5-e369-C0010","paper":"barbui-2015-blood-cancer-journal-5-e369","category":"prognosis","tier":"univariable or descriptive","genes":["JAK2"],"diseases":["ET"],"text":"The proposed 2015 revision of IPSET-thrombosis classifies essential thrombocythemia as high risk when there is a history of thrombosis regardless of age, or when age is >60 years with JAK2 (JAK2V617F) mutation.","locator":"Figure 1d legend and revised four-category risk scheme"},{"id":"bernard-2020-tp53-mds-C0001","paper":"bernard-2020-tp53-mds","category":"diagnosis","tier":"univariable or descriptive","genes":["TP53"],"diseases":["MDS"],"text":"For TP53-mutated MDS, a single TP53 mutation with a retained wild-type copy represents a monoallelic state, whereas multiple TP53 mutations or TP53 mutation(s) with TP53 deletion or copy-neutral loss of heterozygosity represent multi-hit TP53, consistent with biallelic targeting.","locator":"Main text and Fig. 1 legend defining TP53 allelic-state subgroups and monoallelic versus multi-hit states"},{"id":"bernard-2020-tp53-mds-C0002","paper":"bernard-2020-tp53-mds","category":"prognosis","tier":"multivariable-adjusted","genes":["TP53"],"diseases":["MDS"],"text":"In MDS, multi-hit TP53 is associated with inferior overall survival and independently identifies adverse-risk disease across IPSS-R strata; poor survival persists irrespective of TP53 VAF and the number of co-occurring driver mutations.","locator":"Main text outcome, co-mutation and VAF analyses; Fig. 3; Extended Data Fig. 7"},{"id":"bernard-2020-tp53-mds-C0003","paper":"bernard-2020-tp53-mds","category":"prognosis","tier":"multivariable-adjusted","genes":["TP53"],"diseases":["MDS"],"text":"In MDS, monoallelic TP53 is not independently associated with worse overall survival than TP53-wild-type disease.","locator":"Main text multivariable outcome analysis; Fig. 3g"},{"id":"bernard-2020-tp53-mds-C0004","paper":"bernard-2020-tp53-mds","category":"prognosis","tier":"multivariable-adjusted","genes":["TP53"],"diseases":["MDS"],"text":"In MDS, multi-hit TP53 independently predicts increased risk of transformation to acute myeloid leukemia; this adverse risk persists even when the TP53-mutated clone has a low VAF.","locator":"Main text multivariable AML-transformation and VAF analyses; Fig. 3h; Extended Data Fig. 7d"},{"id":"bernard-2020-tp53-mds-C0005","paper":"bernard-2020-tp53-mds","category":"prognosis","tier":"multivariable-adjusted","genes":["TP53"],"diseases":["MDS"],"text":"In MDS, monoallelic TP53 is not independently associated with greater risk of transformation to acute myeloid leukemia than TP53-wild-type disease.","locator":"Main text multivariable AML-transformation analysis; Fig. 3h"},{"id":"bernard-2020-tp53-mds-C0006","paper":"bernard-2020-tp53-mds","category":"prognosis","tier":"univariable or descriptive","genes":["TP53"],"diseases":["MDS"],"text":"In monoallelic TP53 MDS, survival worsens as the number of co-occurring driver mutations increases.","locator":"Main text, paragraph beginning 'Outcomes of monoallelic patients significantly differed with the number of co-occurring driver mutations'"},{"id":"bernard-2020-tp53-mds-C0011","paper":"bernard-2020-tp53-mds","category":"prognosis","tier":"univariable or descriptive","genes":["TP53"],"diseases":["MDS"],"text":"Within multi-hit TP53 MDS, poor outcomes are similar across missense, truncating, and hotspot TP53 mutation types.","locator":"Main text mutation-type analysis; Extended Data Fig. 8 and Supplementary Fig. 17a,b"},{"id":"bernard-2020-tp53-mds-C0012","paper":"bernard-2020-tp53-mds","category":"prognosis","tier":"univariable or descriptive","genes":["TP53"],"diseases":["MDS"],"text":"In monoallelic TP53 MDS, a TP53 R248 hotspot mutation is associated with increased risk of death compared with TP53-wild-type disease.","locator":"Main text monoallelic hotspot analysis; Supplementary Fig. 17c,d"},{"id":"bernard-2020-tp53-mds-C0013","paper":"bernard-2020-tp53-mds","category":"prognosis","tier":"univariable or descriptive","genes":["TP53"],"diseases":["MDS"],"text":"In monoallelic TP53 MDS, a TP53 R175 hotspot mutation, but not R273, was reported to be associated with increased risk of death compared with TP53-wild-type disease; the evidence for the R175 association was less certain than for R248.","locator":"Main text monoallelic hotspot analysis; Supplementary Fig. 17c,d"},{"id":"bernard-2020-tp53-mds-C0014","paper":"bernard-2020-tp53-mds","category":"prognosis","tier":"univariable or descriptive","genes":["TP53"],"diseases":["MDS"],"text":"In TP53-mutated therapy-related MDS, monoallelic TP53 is associated with lower risk of death than multi-hit TP53.","locator":"Main text therapy-related MDS analysis; Fig. 4a"},{"id":"bernard-2020-tp53-mds-C0015","paper":"bernard-2020-tp53-mds","category":"prognosis","tier":"multivariable-adjusted","genes":["TP53"],"diseases":["MDS"],"text":"In MDS, multi-hit TP53 and complex karyotype are independent predictors of adverse outcome.","locator":"Main text outcome paragraph; Supplementary Fig. 14"},{"id":"bernard-2020-tp53-mds-C0016","paper":"bernard-2020-tp53-mds","category":"prognosis","tier":"univariable or descriptive","genes":["TP53"],"diseases":["MDS"],"text":"Within multi-hit TP53 MDS, multiple TP53 mutations, TP53 mutation plus deletion, and TP53 mutation plus copy-neutral loss of heterozygosity have similarly dismal outcomes.","locator":"Main text outcome paragraph; Extended Data Fig. 7a,b"},{"id":"bernard-2020-tp53-mds-C0018","paper":"bernard-2020-tp53-mds","category":"prognosis","tier":"restated secondary","genes":["TP53"],"diseases":["MDS"],"text":"TP53 mutation in therapy-related MDS has been associated with a high risk of progression to acute myeloid leukemia.","locator":"Main text, paragraph beginning 'Beyond primary MDS'"},{"id":"bernard-2020-tp53-mds-C0019","paper":"bernard-2020-tp53-mds","category":"prognosis","tier":"restated secondary","genes":["TP53"],"diseases":["MDS"],"text":"TP53-mutated therapy-related MDS and disease at progression have been described as an extremely adverse prognostic group with very poor long-term survival.","locator":"Main text, paragraph beginning 'Beyond primary MDS'"},{"id":"bernard-2020-tp53-mds-C0023","paper":"bernard-2020-tp53-mds","category":"treatment","tier":"univariable or descriptive","genes":["TP53"],"diseases":["MDS"],"text":"In MDS, treatment resistance is associated with multi-hit TP53 rather than TP53 mutation alone; monoallelic TP53 cases had overall therapy responses similar to TP53-wild-type disease.","locator":"Main text, summary paragraph beginning 'We have demonstrated that the multi-hit TP53 state in MDS'"},{"id":"bernard-2020-tp53-mds-C0027","paper":"bernard-2020-tp53-mds","category":"treatment","tier":"restated secondary","genes":["TP53"],"diseases":["MDS"],"text":"TP53-mutated therapy-related MDS and disease at progression have been described as chemorefractory.","locator":"Main text, paragraph beginning 'Beyond primary MDS'"},{"id":"bernard-2020-tp53-mds-C0028","paper":"bernard-2020-tp53-mds","category":"treatment","tier":"restated secondary","genes":["TP53"],"diseases":["MDS"],"text":"In MDS, TP53-mutated patients have been reported to respond poorly to lenalidomide.","locator":"Main text, treatment paragraph beginning 'Last, we evaluated the implication of TP53 allelic state in response to therapy'"},{"id":"bernard-2020-tp53-mds-C0029","paper":"bernard-2020-tp53-mds","category":"treatment","tier":"restated secondary","genes":["TP53"],"diseases":["MDS"],"text":"In MDS, TP53-mutated patients have been reported to respond poorly to hematopoietic stem cell transplantation.","locator":"Main text, treatment paragraph beginning 'Last, we evaluated the implication of TP53 allelic state in response to therapy'"},{"id":"bernard-2020-tp53-mds-C0030","paper":"bernard-2020-tp53-mds","category":"treatment","tier":"restated secondary","genes":["TP53"],"diseases":["MDS"],"text":"In MDS, TP53-mutated patients have been reported to have marked but transient responses to hypomethylating agents.","locator":"Main text, treatment paragraph beginning 'Last, we evaluated the implication of TP53 allelic state in response to therapy'"},{"id":"bernard-2022-nejm-evidence-1-na-C0001","paper":"bernard-2022-nejm-evidence-1-na","category":"prognosis","tier":"multivariable-adjusted","genes":["ASXL1","CBL","DNMT3A","ETV6","EZH2","FLT3","IDH2","KRAS","KMT2A","NPM1","NRAS","RUNX1","SF3B1","SRSF2","TP53","U2AF1","BCOR","BCORL1","CEBPA","ETNK1","GATA2","GNB1","IDH1","NF1","PHF6","PPM1D","PRPF8","PTPN11","SETBP1","STAG2","WT1"],"diseases":["MDS"],"text":"In MDS, the IPSS-M integrates ASXL1, CBL, DNMT3A, ETV6, EZH2, FLT3, IDH2, KRAS, KMT2A, NPM1, NRAS, RUNX1, SF3B1, SRSF2, TP53, U2AF1, BCOR, BCORL1, CEBPA, ETNK1, GATA2, GNB1, IDH1, NF1, PHF6, PPM1D, PRPF8, PTPN11, SETBP1, STAG2, and WT1 with hematologic and cytogenetic variables to provide patient-specific risk stratification with better prognostic discrimination than IPSS-R across leukemia-free survival, overall survival, and AML transformation.","locator":"Results: IPSS-M risk score/model development"},{"id":"bernard-2022-nejm-evidence-1-na-C0002","paper":"bernard-2022-nejm-evidence-1-na","category":"prognosis","tier":"univariable or descriptive","genes":["ASXL1","CBL","DNMT3A","ETV6","EZH2","FLT3","IDH2","KRAS","KMT2A","NPM1","NRAS","RUNX1","SF3B1","SRSF2","TP53","U2AF1","BCOR","BCORL1","CEBPA","ETNK1","GATA2","GNB1","IDH1","NF1","PHF6","PPM1D","PRPF8","PTPN11","SETBP1","STAG2","WT1"],"diseases":["MDS"],"text":"In secondary/therapy-related MDS, the IPSS-M, which incorporates ASXL1, CBL, DNMT3A, ETV6, EZH2, FLT3, IDH2, KRAS, KMT2A, NPM1, NRAS, RUNX1, SF3B1, SRSF2, TP53, U2AF1, BCOR, BCORL1, CEBPA, ETNK1, GATA2, GNB1, IDH1, NF1, PHF6, PPM1D, PRPF8, PTPN11, SETBP1, STAG2, and WT1, captures heterogeneous prognosis: outcomes within IPSS-M risk categories track those observed in primary MDS.","locator":"Results: IPSS-M in secondary/therapy-related MDS"},{"id":"bernard-2022-nejm-evidence-1-na-C0003","paper":"bernard-2022-nejm-evidence-1-na","category":"prognosis","tier":"univariable or descriptive","genes":["ASXL1","CBL","DNMT3A","ETV6","EZH2","FLT3","IDH2","KRAS","KMT2A","NPM1","NRAS","RUNX1","SF3B1","SRSF2","TP53","U2AF1","BCOR","BCORL1","CEBPA","ETNK1","GATA2","GNB1","IDH1","NF1","PHF6","PPM1D","PRPF8","PTPN11","SETBP1","STAG2","WT1"],"diseases":["MDS"],"text":"In MDS, the IPSS-M, which incorporates ASXL1, CBL, DNMT3A, ETV6, EZH2, FLT3, IDH2, KRAS, KMT2A, NPM1, NRAS, RUNX1, SF3B1, SRSF2, TP53, U2AF1, BCOR, BCORL1, CEBPA, ETNK1, GATA2, GNB1, IDH1, NF1, PHF6, PPM1D, PRPF8, PTPN11, SETBP1, STAG2, and WT1, has better prognostic discrimination than IPSS-R in both untreated patients and patients subsequently treated, across leukemia-free survival, overall survival, and AML transformation.","locator":"Results: relation between IPSS-M and treatment"},{"id":"bernard-2022-nejm-evidence-1-na-C0004","paper":"bernard-2022-nejm-evidence-1-na","category":"prognosis","tier":"multivariable-adjusted","genes":["TP53"],"diseases":["MDS"],"text":"In MDS, multihit TP53, but not monoallelic TP53 mutation, is associated with adverse prognosis.","locator":"Results: association between gene mutations and clinical end points"},{"id":"bernard-2022-nejm-evidence-1-na-C0005","paper":"bernard-2022-nejm-evidence-1-na","category":"prognosis","tier":"multivariable-adjusted","genes":["FLT3"],"diseases":["MDS"],"text":"In MDS, FLT3 internal tandem duplication or tyrosine kinase domain mutations are associated with adverse prognosis, with a particularly strong association with AML transformation.","locator":"Results: association between gene mutations and clinical end points"},{"id":"bernard-2022-nejm-evidence-1-na-C0006","paper":"bernard-2022-nejm-evidence-1-na","category":"prognosis","tier":"multivariable-adjusted","genes":["KMT2A"],"diseases":["MDS"],"text":"In MDS, KMT2A (MLL) partial tandem duplication is associated with adverse prognosis, including high risk of AML transformation and poor overall survival.","locator":"Results: association between gene mutations and clinical end points"},{"id":"bernard-2022-nejm-evidence-1-na-C0007","paper":"bernard-2022-nejm-evidence-1-na","category":"prognosis","tier":"multivariable-adjusted","genes":["ASXL1","BCOR","EZH2","NRAS","RUNX1","STAG2","U2AF1"],"diseases":["MDS"],"text":"In MDS, mutations in ASXL1, BCOR, EZH2, NRAS, RUNX1, STAG2, or U2AF1 are each associated with adverse outcomes across leukemia-free survival, overall survival, and AML transformation.","locator":"Results: association between gene mutations and clinical end points"},{"id":"bernard-2022-nejm-evidence-1-na-C0008","paper":"bernard-2022-nejm-evidence-1-na","category":"prognosis","tier":"multivariable-adjusted","genes":["DDX41"],"diseases":["MDS"],"text":"In MDS, DDX41 mutation is associated with increased risk of AML transformation.","locator":"Results: association between gene mutations and clinical end points"},{"id":"bernard-2022-nejm-evidence-1-na-C0009","paper":"bernard-2022-nejm-evidence-1-na","category":"prognosis","tier":"multivariable-adjusted","genes":["DDX41"],"diseases":["MDS"],"text":"In MDS, DDX41 mutation is associated with favorable overall survival, particularly in MDS with excess blasts.","locator":"Results: association between gene mutations and clinical end points"},{"id":"bernard-2022-nejm-evidence-1-na-C0010","paper":"bernard-2022-nejm-evidence-1-na","category":"prognosis","tier":"univariable or descriptive","genes":["SF3B1","BCOR","BCORL1","NRAS","RUNX1","SRSF2","STAG2"],"diseases":["MDS"],"text":"In MDS, the favorable prognostic association of SF3B1 mutation is confined to cases without isolated del(5q) and without comutation in BCOR, BCORL1, NRAS, RUNX1, SRSF2, or STAG2; the favorable association is not observed in those excluded contexts.","locator":"Results: association between gene mutations and clinical end points"},{"id":"bernard-2022-nejm-evidence-1-na-C0011","paper":"bernard-2022-nejm-evidence-1-na","category":"biomarker","tier":"multivariable-adjusted","genes":["TP53"],"diseases":["MDS"],"text":"For MDS risk assessment at diagnosis, determining TP53 allelic state is important because the adverse prognostic signal is specific to multihit TP53 rather than monoallelic TP53 mutation.","locator":"Results: association between gene mutations and clinical end points"},{"id":"bernard-2022-nejm-evidence-1-na-C0012","paper":"bernard-2022-nejm-evidence-1-na","category":"biomarker","tier":"multivariable-adjusted","genes":["KMT2A"],"diseases":["MDS"],"text":"For MDS risk assessment at diagnosis, specifically assessing KMT2A (MLL) partial tandem duplication is important because it contributes to adverse risk estimation and is not routinely included in myeloid panel tests.","locator":"Results: association between gene mutations and clinical end points"},{"id":"bernard-2022-nejm-evidence-1-na-C0013","paper":"bernard-2022-nejm-evidence-1-na","category":"biomarker","tier":"multivariable-adjusted","genes":["FLT3"],"diseases":["MDS"],"text":"For MDS risk assessment at diagnosis, FLT3 mutation screening is important because FLT3 mutation is a strong predictor of adverse outcomes.","locator":"Discussion"},{"id":"bernard-2022-nejm-evidence-1-na-C0014","paper":"bernard-2022-nejm-evidence-1-na","category":"germline","tier":"univariable or descriptive","genes":["DDX41"],"diseases":["MDS"],"text":"In MDS, a DDX41 pattern with a clonal variant and a subclonal second variant can suggest germline DDX41 followed by a secondary somatic hit.","locator":"Results: association between gene mutations and clinical end points"},{"id":"bernard-2022-nejm-evidence-1-na-C0015","paper":"bernard-2022-nejm-evidence-1-na","category":"treatment","tier":"univariable or descriptive","genes":["TP53"],"diseases":["MDS"],"text":"In MDS treated with hypomethylating agents, multihit TP53 is associated with worse overall survival.","locator":"Results: relation between IPSS-M and treatment"},{"id":"bernard-2022-nejm-evidence-1-na-C0016","paper":"bernard-2022-nejm-evidence-1-na","category":"treatment","tier":"univariable or descriptive","genes":["TP53"],"diseases":["MDS"],"text":"In MDS undergoing stem cell transplantation, multihit TP53 is associated with worse overall survival.","locator":"Results: relation between IPSS-M and treatment"},{"id":"bernard-2022-nejm-evidence-1-na-C0017","paper":"bernard-2022-nejm-evidence-1-na","category":"treatment","tier":"univariable or descriptive","genes":["TP53"],"diseases":["MDS"],"text":"In MDS treated with lenalidomide, multihit TP53 is associated with worse overall survival.","locator":"Results: relation between IPSS-M and treatment"},{"id":"bernard-2022-nejm-evidence-1-na-C0018","paper":"bernard-2022-nejm-evidence-1-na","category":"treatment","tier":"univariable or descriptive","genes":["DDX41"],"diseases":["MDS"],"text":"In MDS treated with hypomethylating agents, DDX41 mutation is associated with favorable overall survival; this treatment-specific association requires further investigation in randomized studies.","locator":"Results: relation between IPSS-M and treatment"},{"id":"bernard-2022-nejm-evidence-1-na-C0019","paper":"bernard-2022-nejm-evidence-1-na","category":"treatment","tier":"restated secondary","genes":[],"diseases":["MDS"],"text":"Patients with higher-risk MDS are considered for disease-modifying therapies intended to prolong survival, including hypomethylating agents and allogeneic transplantation.","locator":"Discussion"},{"id":"bernard-2022-nejm-evidence-1-na-C0020","paper":"bernard-2022-nejm-evidence-1-na","category":"prognosis","tier":"multivariable-adjusted","genes":["TP53","KMT2A","FLT3","SF3B1","NPM1","RUNX1","NRAS","ETV6","IDH2","CBL","EZH2","U2AF1","SRSF2","DNMT3A","ASXL1","KRAS"],"diseases":["MDS"],"text":"According to the IPSS-M framework for MDS, multihit TP53, KMT2A (MLL) partial tandem duplication, FLT3 ITD/TKD, SF3B1 mutation with isolated del(5q), and mutations in NPM1, RUNX1, NRAS, ETV6, IDH2, CBL, EZH2, U2AF1, SRSF2, DNMT3A, ASXL1, and KRAS are main-effect molecular findings that individually contribute adverse prognostic weight. SF3B1a—SF3B1 mutation without BCOR, BCORL1, RUNX1, NRAS, STAG2, SRSF2, or del(5q)—is a main-effect finding that individually contributes favourable prognostic weight. A main-effect finding is modelled individually in IPSS-M, so its gene-specific prognostic contribution is incorporated directly rather than through the residual mutation count.","locator":"Results — Feature Selection for IPSS-M Model Development; Table 1 — IPSS-M Risk Score Construction"},{"id":"bernard-2022-nejm-evidence-1-na-C0022","paper":"bernard-2022-nejm-evidence-1-na","category":"prognosis","tier":"multivariable-adjusted","genes":["BCOR","BCORL1","CEBPA","ETNK1","GATA2","GNB1","IDH1","NF1","PHF6","PPM1D","PRPF8","PTPN11","SETBP1","STAG2","WT1"],"diseases":["MDS"],"text":"In MDS, mutations in BCOR, BCORL1, CEBPA, ETNK1, GATA2, GNB1, IDH1, NF1, PHF6, PPM1D, PRPF8, PTPN11, SETBP1, STAG2, or WT1 are associated with adverse prognostic effects of similar magnitude. Their adverse effects are cumulative across this gene group, but the source observed saturation of additive risk beyond two mutated genes, so additional mutations beyond two did not add further adverse prognostic value.","locator":"Results — Feature Selection for IPSS-M Model Development; Table 1 — gene residuals"},{"id":"cloos-2026-blood-147-1147-C0001","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["NPM1","FLT3","PML","RARA","RUNX1","RUNX1T1","CBFB","MYH11","KMT2A"],"diseases":["AML"],"text":"According to ELN-DAVID 2025, validated leukemia-specific MRD assays targeting NPM1, FLT3-ITD, PML::RARA, RUNX1::RUNX1T1, CBFB::MYH11, or KMT2A rearrangements are preferred over less-specific molecular markers for acute myeloid leukemia.","locator":"Table 3, recommendation C4; section C1 qPCR-based MRD assessment"},{"id":"cloos-2026-blood-147-1147-C0002","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["WT1","MECOM"],"diseases":["AML"],"text":"According to ELN-DAVID 2025, WT1 and EVI1/MECOM expression are less-specific MRD markers in acute myeloid leukemia, so validated leukemia-specific MRD assays are preferred when available.","locator":"Table 3, recommendation C4; section C1 qPCR-based MRD assessment"},{"id":"cloos-2026-blood-147-1147-C0003","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes": vity in acute myeloid leukemia is defined as a result above the assay limit of detection, and the assay should achieve at least 0.01% sensitivity.","locator":"Section C2 NGS-based MRD assessment; Table 5"},{"id":"cloos-2026-blood-147-1147-C0058","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["FLT3"],"diseases":["AML"],"text":"According to ELN-DAVID 2025, in FLT3-ITD-mutated acute myeloid leukemia after 2 intensive-chemotherapy cycles or before alloHCT, using bone marrow preferentially over peripheral blood, FLT3-ITD below the UHS-NGS limit of detection is MRD-negative with an optimal response.","locator":"Table 5, targeted FLT3-ITD UHS-NGS, after 2 cycles or before alloHCT"},{"id":"cloos-2026-blood-147-1147-C0059","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["FLT3"],"diseases":["AML"],"text":"According to ELN-DAVID 2025, in FLT3-ITD-mutated acute myeloid leukemia after 2 intensive-chemotherapy cycles or before alloHCT, using bone marrow preferentially over peripheral blood, FLT3-ITD at or above the UHS-NGS limit of detection is MRD-positive and indicates high risk of treatment failure.","locator":"Table 5, targeted FLT3-ITD UHS-NGS, after 2 cycles or before alloHCT"},{"id":"cloos-2026-blood-147-1147-C0060","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["FLT3"],"diseases":["AML"],"text":"According to ELN-DAVID 2025, in FLT3-ITD-mutated acute myeloid leukemia at end of treatment after consolidation or alloHCT, using bone marrow preferentially over peripheral blood, FLT3-ITD below the UHS-NGS limit of detection is MRD-negative with an optimal response. Use of FLT3-ITD UHS-NGS at end of treatment is based on limited evidence and expert consensus.","locator":"Table 5, targeted FLT3-ITD UHS-NGS, EOT; Section C2 NGS-based MRD assessment; Table 4 footnote"},{"id":"cloos-2026-blood-147-1147-C0061","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["FLT3"],"diseases":["AML"],"text":"According to ELN-DAVID 2025, in FLT3-ITD-mutated acute myeloid leukemia at end of treatment after consolidation or alloHCT, using bone marrow preferentially over peripheral blood, FLT3-ITD at or above the UHS-NGS limit of detection is MRD-positive and indicates high risk of treatment failure. Use of FLT3-ITD UHS-NGS at end of treatment is based on limited evidence and expert consensus.","locator":"Table 5, targeted FLT3-ITD UHS-NGS, EOT; Section C2 NGS-based MRD assessment; Table 4 footnote"},{"id":"cloos-2026-blood-147-1147-C0062","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["FLT3"],"diseases":["AML"],"text":"According to ELN-DAVID 2025, during follow-up of FLT3-ITD-mutated acute myeloid leukemia, FLT3-ITD below the UHS-NGS limit of detection is MRD-negative with an optimal response. Use of FLT3-ITD UHS-NGS during follow-up is based on limited evidence and expert consensus.","locator":"Table 5, targeted FLT3-ITD UHS-NGS, follow-up; Section C2 NGS-based MRD assessment; Table 4 footnote"},{"id":"cloos-2026-blood-147-1147-C0063","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["FLT3"],"diseases":["AML"],"text":"According to ELN-DAVID 2025, during follow-up of FLT3-ITD-mutated acute myeloid leukemia, FLT3-ITD at or above the UHS-NGS limit of detection meets the definition of MRD relapse. Use of FLT3-ITD UHS-NGS during follow-up is based on limited evidence and expert consensus.","locator":"Table 5 and Table 6, targeted FLT3-ITD UHS-NGS, follow-up; Section C2 NGS-based MRD assessment; Table 4 footnote"},{"id":"cloos-2026-blood-147-1147-C0064","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["FLT3"],"diseases":["AML"],"text":"According to ELN-DAVID 2025, FLT3-ITD UHS-NGS MRD relapse in acute myeloid leukemia may not require
