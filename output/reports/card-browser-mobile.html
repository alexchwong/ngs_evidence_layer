CBFB","MYH11","DEK","NUP214","RBM15","MRTFA"],"diseases":["AML"],"text":"According to WHO 5th Edition 2022, AML with PML::RARA, RUNX1::RUNX1T1, CBFB::MYH11, DEK::NUP214 or RBM15::MRTFA is classified as AML with a defining genetic abnormality.","locator":"ACUTE MYELOID LEUKAEMIA — Table 7 defining genetic abnormalities"},{"id":"khoury-2022-leukemia-36-1703-C0083","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["BCR","ABL1"],"diseases":["AML"],"text":"According to WHO 5th Edition 2022, AML with BCR::ABL1 requires ≥20% blasts, principally to avoid overlap with CML.","locator":"ACUTE MYELOID LEUKAEMIA — BCR::ABL1 blast threshold"},{"id":"khoury-2022-leukemia-36-1703-C0084","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["CEBPA"],"diseases":["AML"],"text":"According to WHO 5th Edition 2022, AML with CEBPA mutation includes either biallelic CEBPA mutations or a single CEBPA mutation in the basic leucine zipper region and requires ≥20% blasts.","locator":"ACUTE MYELOID LEUKAEMIA — CEBPA blast threshold"},{"id":"khoury-2022-leukemia-36-1703-C0085","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["KMT2A","MECOM","NUP98"],"diseases":["AML"],"text":"According to WHO 5th Edition 2022, AML with KMT2A, MECOM or NUP98 rearrangement may be diagnosed with <20% blasts.","locator":"ACUTE MYELOID LEUKAEMIA — rearrangement-defined AML"},{"id":"khoury-2022-leukemia-36-1703-C0088","paper":"khoury-2022-leukemia-36-1703","category":"biomarker","tier":"restated secondary","genes":["KMT2A","MECOM","NUP98"],"diseases":["AML"],"text":"In AML, KMT2A, MECOM and NUP98 rearrangements, particularly NUP98 rearrangements, may be cryptic on conventional karyotyping.","locator":"ACUTE MYELOID LEUKAEMIA — cryptic rearrangements"},{"id":"khoury-2022-leukemia-36-1703-C0089","paper":"khoury-2022-leukemia-36-1703","category":"biomarker","tier":"guideline criterion","genes":["KMT2A"],"diseases":["AML"],"text":"According to WHO 5th Edition 2022, identification of the KMT2A fusion partner in AML with KMT2A rearrangement is desirable, although not required, because it may affect disease monitoring.","locator":"ACUTE MYELOID LEUKAEMIA — KMT2A fusion-partner identification"},{"id":"khoury-2022-leukemia-36-1703-C0090","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["NPM1"],"diseases":["AML"],"text":"According to WHO 5th Edition 2022, AML with NPM1 mutation may be diagnosed irrespective of blast count, with judicious clinicopathologic correlation.","locator":"ACUTE MYELOID LEUKAEMIA — NPM1 definition"},{"id":"khoury-2022-leukemia-36-1703-C0091","paper":"khoury-2022-leukemia-36-1703","category":"prognosis","tier":"restated secondary","genes":["NPM1"],"diseases":["MDS","MDS/MPN","AML"],"text":"MDS or MDS/MPN harbouring NPM1 mutation is described as progressing to AML over a short period of time.","locator":"ACUTE MYELOID LEUKAEMIA — NPM1 in prior MDS/MDS-MPN"},{"id":"khoury-2022-leukemia-36-1703-C0092","paper":"khoury-2022-leukemia-36-1703","category":"prognosis","tier":"restated secondary","genes":["NPM1"],"diseases":["CHIP","AML"],"text":"Acquisition of NPM1 mutation in CHIP is similarly associated with rapid progression to AML.","locator":"ACUTE MYELOID LEUKAEMIA — acquired NPM1 in clonal haematopoiesis"},{"id":"khoury-2022-leukemia-36-1703-C0094","paper":"khoury-2022-leukemia-36-1703","category":"prognosis","tier":"restated secondary","genes":["CEBPA"],"diseases":["AML"],"text":"In AML, a single CEBPA mutation in the basic leucine zipper region is associated with favourable prognosis in children and adults up to age 70.","locator":"ACUTE MYELOID LEUKAEMIA — CEBPA bZIP prognosis"},{"id":"khoury-2022-leukemia-36-1703-C0095","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["RUNX1"],"diseases":["AML"],"text":"According to WHO 5th Edition 2022, somatic RUNX1 mutation does not define a standalone AML type because it lacks sufficient specificity across defining molecular contexts.","locator":"ACUTE MYELOID LEUKAEMIA — RUNX1 mutation classification"},{"id":"khoury-2022-leukemia-36-1703-C0096","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["ASXL1","BCOR","EZH2","SF3B1","SRSF2","STAG2","U2AF1","ZRSR2"],"diseases":["AML","MDS","MDS/MPN","acute erythroid leukaemia"],"text":"According to WHO 5th Edition 2022, AML, myelodysplasia-related (AML-MR; formerly AML with myelodysplasia-related changes) requires ≥20% blasts with a myeloid immunophenotype plus at least one qualifying MDS-related feature: a history of MDS or MDS/MPN; a defining somatic mutation in ASXL1, BCOR, EZH2, SF3B1, SRSF2, STAG2, U2AF1 or ZRSR2; or a defining cytogenetic abnormality comprising complex karyotype (≥3 abnormalities), 5q deletion/loss, monosomy 7 or 7q deletion/loss, 11q deletion, 12p deletion/loss, monosomy 13 or 13q deletion, 17p deletion/loss, isochromosome 17q or idic(X)(q13). Morphologic dysplasia alone is insufficient. A diagnosis of acute erythroid leukaemia supersedes AML-MR.","locator":"ACUTE MYELOID LEUKAEMIA — AML-MR core definition"},{"id":"khoury-2022-leukemia-36-1703-C0114","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["AML with minimal differentiation"],"text":"According to WHO 5th Edition 2022, AML with minimal differentiation requires blasts negative (<3%) for MPO and SBB by cytochemistry and expression of at least two myeloid-associated antigens such as CD13, CD33 and CD117. It also requires ≥20% blasts, absence of a defining genetic AML type, absence of mixed-phenotype acute leukaemia, absence of myeloid neoplasm post cytotoxic therapy and no prior MPN.","locator":"ACUTE MYELOID LEUKAEMIA — AML with minimal differentiation (Table 9)"},{"id":"khoury-2022-leukemia-36-1703-C0115","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["AML without maturation"],"text":"According to WHO 5th Edition 2022, AML without maturation requires ≥3% blasts positive for MPO or SBB, NSE negativity, <10% maturing granulocytic cells and expression of at least two myeloid-associated antigens. It also requires ≥20% blasts, absence of a defining genetic AML type, absence of mixed-phenotype acute leukaemia, absence of myeloid neoplasm post cytotoxic therapy and no prior MPN.","locator":"ACUTE MYELOID LEUKAEMIA — AML without maturation (Table 9)"},{"id":"khoury-2022-leukemia-36-1703-C0116","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["AML with maturation"],"text":"According to WHO 5th Edition 2022, AML with maturation requires ≥3% blasts positive for MPO or SBB, ≥10% maturing granulocytic cells, <20% monocyte-lineage cells and expression of at least two myeloid-associated antigens. It also requires ≥20% blasts, absence of a defining genetic AML type, absence of mixed-phenotype acute leukaemia, absence of myeloid neoplasm post cytotoxic therapy and no prior MPN.","locator":"ACUTE MYELOID LEUKAEMIA — AML with maturation (Table 9)"},{"id":"khoury-2022-leukemia-36-1703-C0117","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["acute basophilic leukaemia"],"text":"According to WHO 5th Edition 2022, acute basophilic leukaemia requires basophilic blasts/immature or mature basophils with metachromasia on toluidine blue, blasts negative for MPO, SBB and NSE, and absence of strong CD117-equivalent expression. It also requires ≥20% blasts, absence of a defining genetic AML type, absence of mixed-phenotype acute leukaemia, absence of myeloid neoplasm post cytotoxic therapy and no prior MPN.","locator":"ACUTE MYELOID LEUKAEMIA — acute basophilic leukaemia (Table 9)"},{"id":"khoury-2022-leukemia-36-1703-C0118","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["AMML"],"text":"According to WHO 5th Edition 2022, acute myelomonocytic leukaemia requires ≥20% monocytes and precursors, ≥20% maturing granulocytic cells and ≥3% blasts positive for MPO. It also requires ≥20% blasts, absence of a defining genetic AML type, absence of mixed-phenotype acute leukaemia, absence of myeloid neoplasm post cytotoxic therapy and no prior MPN.","locator":"ACUTE MYELOID LEUKAEMIA — acute myelomonocytic leukaemia (Table 9)"},{"id":"khoury-2022-leukemia-36-1703-C0119","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["AMoL"],"text":"According to WHO 5th Edition 2022, acute monocytic leukaemia requires ≥80% monocytes and/or their precursors, <20% maturing granulocytic cells, and blasts/promonocytes expressing at least two monocytic markers among CD11c, CD14, CD36 and CD64 or showing NSE positivity. It also requires ≥20% blasts, absence of a defining genetic AML type, absence of mixed-phenotype acute leukaemia, absence of myeloid neoplasm post cytotoxic therapy and no prior MPN.","locator":"ACUTE MYELOID LEUKAEMIA — acute monocytic leukaemia (Table 9)"},{"id":"khoury-2022-leukemia-36-1703-C0120","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["acute erythroid leukaemia"],"text":"According to WHO 5th Edition 2022, acute erythroid leukaemia is characterized by erythroid predominance, usually ≥80% of marrow cellularity, with ≥30% proerythroblasts; cases with <80% erythroid cellularity are recognized when they share the same clinicopathologic features. “Pure erythroid leukaemia” is retained as an acceptable related term. The other shared differentiation-defined AML exclusions apply, but the ≥20% blast requirement does not.","locator":"ACUTE MYELOID LEUKAEMIA — acute erythroid leukaemia"},{"id":"khoury-2022-leukemia-36-1703-C0122","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["AMKL"],"text":"According to WHO 5th Edition 2022, acute megakaryoblastic leukaemia requires blasts expressing at least one platelet glycoprotein marker—CD41, CD61 or CD42b. It also requires ≥20% blasts, absence of a defining genetic AML type, absence of mixed-phenotype acute leukaemia, absence of myeloid neoplasm post cytotoxic therapy and no prior MPN.","locator":"ACUTE MYELOID LEUKAEMIA — acute megakaryoblastic leukaemia (Table 9)"},{"id":"khoury-2022-leukemia-36-1703-C0123","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["CBFA2T3","GLIS2"],"diseases":["AML","AMKL"],"text":"According to WHO 5th Edition 2022, AML with other defined genetic alterations provides a classification category for uncommon or emerging genetically defined AML subtypes, including rare genetic fusions; CBFA2T3::GLIS2 is recognized in this category in the acute megakaryoblastic leukaemia context.","locator":"ACUTE MYELOID LEUKAEMIA — AMKL/RAM immunophenotype"},{"id":"khoury-2022-leukemia-36-1703-C0125","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["NPM1","RUNX1","RUNX1T1","CBFB","MYH11","PARP1"],"diseases":["AML","MDS","MDS/MPN","CCUS"],"text":"According to WHO 5th Edition 2022, a myeloid neoplasm post cytotoxic therapy (MN-pCT) is diagnosed when criteria for AML, MDS or MDS/MPN are fulfilled in a patient with a documented history of chemotherapy or large-field radiation therapy for an unrelated neoplasm. CCUS is excluded. NPM1-mutated disease and core-binding-factor leukaemias with RUNX1::RUNX1T1 or CBFB::MYH11 still receive the post-cytotoxic designation when the exposure history is present. PARP1 inhibitors qualify as an exposure and methotrexate does not. The specific myeloid diagnosis should be given when possible with “post cytotoxic therapy” appended.","locator":"SECONDARY MYELOID NEOPLASMS — disease-attribute framework"},{"id":"khoury-2022-leukemia-36-1703-C0131","paper":"khoury-2022-leukemia-36-1703","category":"prognosis","tier":"restated secondary","genes":["TP53"],"diseases":["AML","MDS"],"text":"In AML or MDS post cytotoxic therapy, biallelic/multi-hit TP53 alterations—including ≥2 TP53 mutations or a TP53 mutation with 17p/TP53 deletion or copy-neutral loss of heterozygosity—are associated with worse outcomes.","locator":"SECONDARY MYELOID NEOPLASMS — TP53 allelic state after cytotoxic therapy"},{"id":"khoury-2022-leukemia-36-1703-C0132","paper":"khoury-2022-leukemia-36-1703","category":"germline","tier":"restated secondary","genes":["PPM1D"],"diseases":[],"text":"PPM1D and other DNA-damage-response mutations detected in myeloid neoplasms post cytotoxic therapy may warrant additional work-up for germline predisposition.","locator":"SECONDARY MYELOID NEOPLASMS — possible germline work-up"},{"id":"khoury-2022-leukemia-36-1703-C0133","paper":"khoury-2022-leukemia-36-1703","category":"germline","tier":"restated secondary","genes":["NF1","CBL"],"diseases":["JMML"],"text":"JMML can arise in association with germline pathogenic NF1 variants in neurofibromatosis type 1 or pathogenic germline CBL variants.","locator":"MYELOPROLIFERATIVE NEOPLASMS — JMML germline genetic background"},{"id":"khoury-2022-leukemia-36-1703-C0135","paper":"khoury-2022-leukemia-36-1703","category":"germline","tier":"guideline criterion","genes":["CEBPA","DDX41","TP53","RUNX1","ANKRD26","ETV6","GATA2","SAMD9","SAMD9L","BLM"],"diseases":["germline predisposition syndrome"],"text":"According to WHO 5th Edition 2022, a germline predisposition syndrome involving myeloid neoplasms is classified by coupling the myeloid disease phenotype with the predisposing germline genotype. The framework includes: without a pre-existing platelet disorder or organ dysfunction—germline CEBPA, DDX41 or TP53 pathogenic/likely pathogenic variants; with a pre-existing platelet disorder—germline RUNX1, ANKRD26 or ETV6 pathogenic/likely pathogenic variants; and with potential organ dysfunction—including germline GATA2, SAMD9 or SAMD9L pathogenic/likely pathogenic variants and biallelic germline BLM pathogenic/likely pathogenic variants. SAMD9L-related ataxia-pancytopenia syndrome may occur without ataxia.","locator":"SECONDARY MYELOID NEOPLASMS — germline predisposition subtypes (Table 10)"},{"id":"khoury-2022-leukemia-36-1703-C0145","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["GATA1"],"diseases":["germline predisposition syndrome"],"text":"According to WHO 5th Edition 2022, in the germline predisposition syndrome context, myeloid proliferations associated with constitutional trisomy 21 comprise transient abnormal myelopoiesis, confined to the first 6 months of life, and myeloid leukaemia of Down syndrome; these proliferations are typically associated with somatic GATA1 exon 2 or 3 mutation.","locator":"SECONDARY MYELOID NEOPLASMS — Down syndrome myeloid proliferations"},{"id":"khoury-2022-leukemia-36-1703-C0146","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["BCR","ABL1","PDGFRA","PDGFRB","FGFR1","JAK2","FLT3","ETV6","FGFR2","LYN","NTRK3","RANBP2","ALK","RET","FGFR1OP"],"diseases":["myeloid/lymphoid neoplasm with eosinophilia and TK fusion"],"text":"According to WHO 5th Edition 2022, myeloid/lymphoid neoplasms with eosinophilia and tyrosine kinase gene fusions (MLN-TK) are BCR::ABL1-negative neoplasms driven by defining tyrosine-kinase rearrangements; eosinophilia is common but is not required. Defining abnormalities include rearrangements of PDGFRA, PDGFRB, FGFR1, JAK2 or FLT3; ETV6::ABL1; and other defined fusions including ETV6::FGFR2, ETV6::LYN, ETV6::NTRK3, RANBP2::ALK, BCR::RET and FGFR1OP::RET. MLN-TK supersedes other myeloid or lymphoid diagnoses and systemic mastocytosis in the diagnostic hierarchy, must be excluded before diagnosing CEL, and MLN-TK with ETV6::ABL1 should be distinguished from B-ALL with ETV6::ABL1.","locator":"MYELOID/LYMPHOID NEOPLASMS WITH EOSINOPHILIA AND TYROSINE KINASE GENE FUSIONS — diagnostic hierarchy"},{"id":"khoury-2022-leukemia-36-1703-C0149","paper":"khoury-2022-leukemia-36-1703","category":"biomarker","tier":"restated secondary","genes":["FIP1L1","PDGFRA"],"diseases":["myeloid/lymphoid neoplasm with eosinophilia and TK fusion"],"text":"In myeloid/lymphoid neoplasm with eosinophilia and tyrosine kinase fusion (MLN-TK), FIP1L1::PDGFRA commonly results from a cytogenetically cryptic deletion of 4q12.","locator":"MYELOID/LYMPHOID NEOPLASMS WITH EOSINOPHILIA AND TYROSINE KINASE GENE FUSIONS — cryptic FIP1L1::PDGFRA"},{"id":"khoury-2022-leukemia-36-1703-C0163","paper":"khoury-2022-leukemia-36-1703","category":"treatment","tier":"restated secondary","genes":["PDGFRA","PDGFRB"],"diseases":["myeloid/lymphoid neoplasm with eosinophilia and TK fusion"],"text":"In myeloid/lymphoid neoplasm with eosinophilia and tyrosine kinase fusion (MLN-TK), PDGFRA- or PDGFRB-rearranged disease is highly sensitive to tyrosine-kinase inhibitor therapy, particularly imatinib, with major alteration of the natural history of the disease.","locator":"MYELOID/LYMPHOID NEOPLASMS WITH EOSINOPHILIA AND TYROSINE KINASE GENE FUSIONS — TKI sensitivity"},{"id":"khoury-2022-leukemia-36-1703-C0165","paper":"khoury-2022-leukemia-36-1703","category":"treatment","tier":"restated secondary","genes":["FGFR1","JAK2","FLT3","ETV6","ABL1"],"diseases":["myeloid/lymphoid neoplasm with eosinophilia and TK fusion"],"text":"Myeloid/lymphoid neoplasm with eosinophilia and tyrosine kinase fusion (MLN-TK) involving FGFR1, JAK2, FLT3 or ETV6::ABL1 has variable sensitivity to currently available newer-generation tyrosine-kinase inhibitors.","locator":"MYELOID/LYMPHOID NEOPLASMS WITH EOSINOPHILIA AND TYROSINE KINASE GENE FUSIONS — variable TKI sensitivity"},{"id":"khoury-2022-leukemia-36-1703-C0169","paper":"khoury-2022-leukemia-36-1703","category":"treatment","tier":"restated secondary","genes":["FGFR1","JAK2","FLT3","ETV6","ABL1"],"diseases":["myeloid/lymphoid neoplasm with eosinophilia and TK fusion"],"text":"For myeloid/lymphoid neoplasm with eosinophilia and tyrosine kinase fusion (MLN-TK) with FGFR1, JAK2 or FLT3 fusions or ETV6::ABL1, long-term disease-free survival may in most cases only be achievable with allogeneic haematopoietic stem-cell transplantation.","locator":"MYELOID/LYMPHOID NEOPLASMS WITH EOSINOPHILIA AND TYROSINE KINASE GENE FUSIONS — transplantation"},{"id":"khoury-2022-leukemia-36-1703-C0170","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["BCR","ABL1","KMT2A","ZNF384","BCL11B"],"diseases":["acute leukaemia of ambiguous lineage"],"text":"According to WHO 5th Edition 2022, acute leukaemia of ambiguous lineage is separated into those with defining genetic abnormalities and those defined immunophenotypically. Defining genetic subtypes include MPAL with BCR::ABL1, KMT2A rearrangement or ZNF384 rearrangement, and ALAL with BCL11B rearrangement.","locator":"ACUTE LEUKAEMIAS OF MIXED OR AMBIGUOUS LINEAGE — WHO5 grouping"},{"id":"khoury-2022-leukemia-36-1703-C0175","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["acute leukaemia of ambiguous lineage"],"text":"According to WHO 5th Edition 2022, lineage assignment in acute leukaemia of ambiguous lineage uses: for B lineage, strong CD19 plus ≥1 strongly expressed CD10, CD22 or CD79a, or weak CD19 plus ≥2 of these markers; for T lineage, cytoplasmic or surface CD3 of sufficient intensity or positive immunocytochemistry with a non-zeta-chain reagent; and for myeloid lineage, sufficiently intense MPO expression or monocytic differentiation demonstrated by at least two of nonspecific esterase, CD11c, CD14, CD64 or lysozyme.","locator":"ACUTE LEUKAEMIAS OF MIXED OR AMBIGUOUS LINEAGE — B-lineage assignment (Table 13)"},{"id":"khoury-2022-leukemia-36-1703-C0178","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["acute leukaemia of ambiguous lineage"],"text":"For acute leukaemia of ambiguous lineage assessed by flow cytometry, a 3% MPO-positive blast threshold has high sensitivity but poor specificity, >10% appears to improve specificity, and no consensus cutoff has been established.","locator":"ACUTE LEUKAEMIAS OF MIXED OR AMBIGUOUS LINEAGE — MPO flow-cytometry threshold uncertainty"},{"id":"khoury-2022-leukemia-36-1703-C0179","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["BPDCN"],"text":"According to WHO 5th Edition 2022, BPDCN immunophenotypic diagnosis requires either CD123 plus one other plasmacytoid dendritic-cell marker together with CD4 and/or CD56, or any three plasmacytoid dendritic-cell markers with absence of all expected negative markers including CD3, CD14, CD19, CD34, lysozyme and MPO.","locator":"HISTIOCYTIC/DENDRITIC CELL NEOPLASMS — BPDCN immunophenotypic criteria (Table 15)"},{"id":"khoury-2022-leukemia-36-1703-C0180","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["ALK"],"diseases":["histiocytic/dendritic neoplasm"],"text":"According to WHO 5th Edition 2022, ALK-positive histiocytosis is a defined histiocytic/dendritic neoplasm unified by the presence of an ALK gene translocation.","locator":"HISTIOCYTIC/DENDRITIC CELL NEOPLASMS — ALK-positive histiocytosis"},{"id":"khoury-2022-leukemia-36-1703-C0181","paper":"khoury-2022-leukemia-36-1703","category":"treatment","tier":"restated secondary","genes":["ALK"],"diseases":["histiocytic/dendritic neoplasm"],"text":"Within the histiocytic/dendritic neoplasm category, ALK-positive histiocytosis is described as showing a remarkable response to ALK-inhibitor therapy.","locator":"HISTIOCYTIC/DENDRITIC CELL NEOPLASMS — ALK-positive histiocytosis treatment"},{"id":"khoury-2022-leukemia-36-1703-C0182","paper":"khoury-2022-leukemia-36-1703","category":"biomarker","tier":"guideline criterion","genes":["ALK"],"diseases":["histiocytic/dendritic neoplasm"],"text":"WHO 5th Edition 2022 recommends ALK immunostaining when a histiocytic/dendritic neoplasm does not conform to defined entities, to screen for possible ALK-positive histiocytosis.","locator":"HISTIOCYTIC/DENDRITIC CELL NEOPLASMS — ALK screening"},{"id":"khoury-2022-leukemia-36-1703-C0183","paper":"khoury-2022-leukemia-36-1703","category":"treatment","tier":"restated secondary","genes":["BRAF","ARAF","MAP2K1","NRAS","KRAS"],"diseases":["histiocytic/dendritic neoplasm"],"text":"In the histiocytic/dendritic neoplasm category, alterations in BRAF, ARAF, MAP2K1, NRAS and KRAS have treatment implications because activated MAPK-pathway components can be targeted with therapies including BRAF and MEK inhibitors.","locator":"HISTIOCYTIC/DENDRITIC CELL NEOPLASMS — MAPK-pathway alterations"},{"id":"khoury-2022-leukemia-36-1703-C0184","paper":"khoury-2022-leukemia-36-1703","category":"biomarker","tier":"guideline criterion","genes":["NF1","NRAS","KRAS","PTPN11","CBL"],"diseases":["JMML"],"text":"Genomic analysis of NF1, NRAS, KRAS, PTPN11 and CBL in myeloid neoplasms from patients suspected of a RASopathy is important and can aid JMML diagnosis in the majority of cases.","locator":"GENETIC TUMOR SYNDROMES WITH PREDISPOSITION TO MYELOID NEOPLASIA — RASopathies/JMML"},{"id":"khoury-2022-leukemia-36-1703-C0185","paper":"khoury-2022-leukemia-36-1703","category":"germline","tier":"guideline criterion","genes":["NF1","NRAS","KRAS","PTPN11","CBL"],"diseases":["germline predisposition syndrome"],"text":"According to WHO 5th Edition 2022, a RASopathy is a germline predisposition syndrome in which the myeloid disease phenotype is coupled to the predisposing germline genotype. In this germline RASopathy context, WHO5 specifically mline-guide","category":"germline","tier":"restated secondary","genes":["RUNX1","TP53"],"diseases":[],"text":"A RUNX1 or TP53 variant detected in hematopoietic tissue should not be assumed to be germline or somatic based on the variant itself, because variants in either gene can occur in both settings.","locator":"Identifying potential germline alleles from NGS assays of tumor samples, line 57"},{"id":"kraft-godley-2020-germline-guide-C0007","paper":"kraft-godley-2020-germline-guide","category":"germline","tier":"univariable or descriptive","genes":["TP53"],"diseases":[],"text":"A TP53 variant detected in hematopoietic tissue is more commonly somatic than germline; however, germline TP53 origin remains possible and may require dedicated germline evaluation.","locator":"Identifying potential germline alleles from NGS assays of tumor samples, lines 57 and 126"},{"id":"kraft-godley-2020-germline-guide-C0008","paper":"kraft-godley-2020-germline-guide","category":"germline","tier":"univariable or descriptive","genes":["BRCA1","BRCA2"],"diseases":[],"text":"A deleterious BRCA1 or BRCA2 variant detected during sequencing of a hematologic malignancy may warrant consideration of germline origin; the authors report that such variants were more commonly germline in their experience.","locator":"Identifying potential germline alleles from NGS assays of tumor samples, line 126"},{"id":"kraft-godley-2020-germline-guide-C0009","paper":"kraft-godley-2020-germline-guide","category":"germline","tier":"univariable or descriptive","genes":["TP53"],"diseases":[],"text":"Persistence of a TP53 variant at a relatively stable VAF across serial hematopoietic samples can raise suspicion of germline origin, including in patients who do not otherwise meet clinical criteria for Li-Fraumeni syndrome; germline status requires confirmation with appropriate germline testing.","locator":"Identifying potential germline alleles from NGS assays of tumor samples, lines 57 and 126"},{"id":"kraft-godley-20 const CATEGORY_COLOURS = {
  diagnosis:"var(--cat-diagnosis)", prognosis:"var(--cat-prognosis)",
  treatment:"var(--cat-treatment)", biomarker:"var(--cat-biomarker)",
  germline:"var(--cat-germline)"
};
const PAGE = 40;

const paperName = {};
const paperCite = {};
DATA.papers.forEach(p => { paperName[p.key] = p.nickname; paperCite[p.key] = p.display || ""; });

const state = { category:new Set(), paper:new Set(), disease:new Set(), gene:new Set(), tier:new Set(), query:"" };
const facetSearch = { category:"", paper:"", disease:"", gene:"", tier:"" };
const expanded = new Set();
let shown = PAGE;
let activeTab = "category";

const FACETS = [
  { key:"category", title:"Category", field:c => [c.category], searchable:false, swatch:true },
  { key:"gene",     title:"Gene",     field:c => c.genes,      searchable:true  },
  { key:"disease",  title:"Disease",  field:c => c.diseases,   searchable:true  },
  { key:"paper",    title:"Paper",    field:c => [c.paper],    searchable:true, labelOf:k => paperName[k] || k },
  { key:"tier",     title:"Tier",     field:c => [c.tier],     searchable:false }
];
const facetByKey = Object.fromEntries(FACETS.map(f => [f.key, f]));

function labelFor(key, value){
  const f = facetByKey[key];
  return f.labelOf ? f.labelOf(value) : value;
}

function matches(card, skip){
  for (const f of FACETS){
    if (f.key === skip) continue;
    const chosen = state[f.key];
    if (!chosen.size) continue;
    if (!f.field(card).some(v => chosen.has(v))) return false;
  }
  return true;
}

function textHit(card){
  return !state.query || card.text.toLowerCase().includes(state.query);
}

function visibleCards(){
  return DATA.cards.filter(c => matches(c, null) && textHit(c));
}

function countsFor(facet){
  const tally = new Map();
  for (const card of DATA.cards){
    if (!matches(card, facet.key) || !textHit(card)) continue;
    for (const value of facet.field(card)){
      if (!value) continue;
      tally.set(value, (tally.get(value) || 0) + 1);
    }
  }
  state[facet.key].forEach(v => { if (!tally.has(v)) tally.set(v, 0); });
  return tally;
}

function activeCount(){
  return FACETS.reduce((n, f) => n + state[f.key].size, 0);
}

function toggle(key, value){
  const set = state[key];
  if (set.has(value)) set.delete(value); else set.add(value);
  shown = PAGE;
  renderAll();
}

/* ---------- filter sheet ---------- */
function buildTabs(){
  const tabs = document.getElementById("tabs");
  tabs.innerHTML = "";
  for (const facet of FACETS){
    const b = document.createElement("button");
    b.type = "button";
    b.className = "tab";
    b.setAttribute("role", "tab");
    b.setAttribute("aria-selected", facet.key === activeTab ? "true" : "false");
    b.textContent = facet.title;
    const n = state[facet.key].size;
    if (n){
      const badge = document.createElement("span");
      badge.className = "n";
      badge.textContent = n;
      b.appendChild(badge);
    }
    b.addEventListener("click", () => {
      activeTab = facet.key;
      buildTabs();
      buildOptions();
      document.getElementById("options").scrollTop = 0;
    });
    tabs.appendChild(b);
  }
}

function buildOptions(){
  const facet = facetByKey[activeTab];
  const box = document.getElementById("facetsearch");
  if (facet.searchable){
    box.hidden = false;
    box.placeholder = "Filter " + facet.title.toLowerCase() + "s";
    box.setAttribute("aria-label", box.placeholder);
    if (box.value !== facetSearch[facet.key]) box.value = facetSearch[facet.key];
  } else {
    box.hidden = true;
  }

  const tally = countsFor(facet);
  let entries = [...tally.entries()];
  if (facet.key === "category" || facet.key === "tier"){
    entries.sort((a,b) => b[1] - a[1] || a[0].localeCompare(b[0]));
  } else if (facet.key === "paper"){
    entries.sort((a,b) => labelFor("paper", a[0]).localeCompare(labelFor("paper", b[0])));
  } else {
    entries.sort((a,b) => b[1] - a[1] || a[0].localeCompare(b[0], undefined, {numeric:true}));
  }
  const needle = facetSearch[facet.key].trim().toLowerCase();
  if (needle){
    entries = entries.filter(([value]) =>
      labelFor(facet.key, value).toLowerCase().includes(needle) || state[facet.key].has(value));
  }

  const list = document.getElementById("options");
  list.innerHTML = "";
  if (!entries.length){
    const li = document.createElement("li");
    li.style.cssText = "padding:18px 4px;color:var(--muted);font-size:14px";
    li.textContent = "Nothing in this list matches.";
    list.appendChild(li);
    return;
  }
  const frag = document.createDocumentFragment();
  for (const [value, count] of entries){
    const li = document.createElement("li");
    const b = document.createElement("button");
    const on = state[facet.key].has(value);
    b.type = "button";
    b.className = "opt";
    b.setAttribute("aria-pressed", on ? "true" : "false");
    if (!count && !on) b.disabled = true;

    const box2 = document.createElement("span");
    box2.className = "box";
    box2.textContent = on ? "\u2713" : "";
    box2.setAttribute("aria-hidden", "true");
    b.appendChild(box2);

    if (facet.swatch){
      const dot = document.createElement("span");
      dot.className = "swatch";
      dot.style.background = CATEGORY_COLOURS[value] || "var(--muted)";
      b.appendChild(dot);
    }

    const label = document.createElement("span");
    label.className = "label";
    label.textContent = labelFor(facet.key, value);
    b.appendChild(label);

    const num = document.createElement("span");
    num.className = "count";
    num.textContent = count;
    b.appendChild(num);

    b.addEventListener("click", () => toggle(facet.key, value));
    li.appendChild(b);
    frag.appendChild(li);
  }
  list.appendChild(frag);
}

/* ---------- chips ---------- */
function buildChips(){
  const wrap = document.getElementById("chips");
  wrap.innerHTML = "";
  const total = activeCount();
  if (!total) return;
  for (const facet of FACETS){
    for (const value of state[facet.key]){
      const b = document.createElement("button");
      b.type = "button";
      b.className = "chip";
      const t = document.createElement("span");
      t.className = "txt";
      t.textContent = labelFor(facet.key, value);
      const x = document.createElement("span");
      x.className = "x";
      x.textContent = "\u2715";
      b.append(t, x);
      b.setAttribute("aria-label", "Remove filter " + labelFor(facet.key, value));
      b.addEventListener("click", () => toggle(facet.key, value));
      wrap.appendChild(b);
    }
  }
  if (total > 1){
    const b = document.createElement("button");
    b.type = "button";
    b.className = "chip clearall";
    b.textContent = "Clear all";
    b.addEventListener("click", clearAll);
    wrap.appendChild(b);
  }
}

/* ---------- results ---------- */
function highlight(text, needle){
  if (!needle) return document.createTextNode(text);
  const frag = document.createDocumentFragment();
  const lower = text.toLowerCase();
  let from = 0, at = lower.indexOf(needle, from);
  while (at !== -1){
    frag.appendChild(document.createTextNode(text.slice(from, at)));
    const mark = document.createElement("mark");
    mark.textContent = text.slice(at, at + needle.length);
    frag.appendChild(mark);
    from = at + needle.length;
    at = lower.indexOf(needle, from);
  }
  frag.appendChild(document.createTextNode(text.slice(from)));
  return frag;
}

function tagRow(key, values){
  const wrap = document.createElement("dd");
  for (const value of values){
    const b = document.createElement("button");
    b.type = "button";
    b.className = "tagbtn";
    b.setAttribute("aria-pressed", state[key].has(value) ? "true" : "false");
    b.textContent = value;
    b.addEventListener("click", () => toggle(key, value));
    wrap.appendChild(b);
  }
  return wrap;
}

function buildCards(){
  const list = document.getElementById("cards");
  const rows = visibleCards();
  const more = document.getElementById("more");
  list.innerHTML = "";

  document.getElementById("tally").innerHTML =
    "<b>" + rows.length + "</b> of " + DATA.cards.length + " cards";

  if (!rows.length){
    more.hidden = true;
    more.textContent = "";
    more.disabled = true;
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.innerHTML = "<h3>Nothing matches</h3><p>Remove a filter, or start again from a single gene.</p>";
    list.appendChild(empty);
    return;
  }

  const slice = rows.slice(0, shown);
  const frag = document.createDocumentFragment();
  for (const card of slice){
    const li = document.createElement("li");
    li.className = "card";
    li.style.setProperty("--spine", CATEGORY_COLOURS[card.category] || "var(--rule)");

    const head = document.createElement("button");
    head.type = "button";
    head.className = "card-head";
    const isOpen = expanded.has(card.id);
    head.setAttribute("aria-expanded", isOpen ? "true" : "false");

    const meta = document.createElement("div");
    meta.className = "card-meta";
    const cat = document.createElement("span");
    cat.className = "cat";
    cat.textContent = card.category || "\u2014";
    const paper = document.createElement("span");
    paper.className = "paper";
    paper.textContent = paperName[card.paper] || card.paper;
    meta.append(cat, paper);
    head.appendChild(meta);

    const p = document.createElement("p");
    p.appendChild(highlight(card.text, state.query));
    head.appendChild(p);

    head.addEventListener("click", () => {
      if (expanded.has(card.id)) expanded.delete(card.id); else expanded.add(card.id);
      buildCards();
    });
    li.appendChild(head);

    if (isOpen){
      const detail = document.createElement("div");
      detail.className = "detail";
      const dl = document.createElement("dl");
      const add = (term, node) => {
        const dt = document.createElement("dt");
        dt.textContent = term;
        dl.append(dt, node);
      };
      if (card.genes.length) add("Genes", tagRow("gene", card.genes));
      if (card.diseases.length) add("Disease", tagRow("disease", card.diseases));
      if (card.tier){
        const dd = document.createElement("dd");
        dd.textContent = card.tier;
        add("Tier", dd);
      }
      const src = document.createElement("dd");
      src.textContent = paperCite[card.paper] || paperName[card.paper] || card.paper;
      add("Source", src);
      if (card.locator){
        const dd = document.createElement("dd");
        dd.textContent = card.locator;
        add("Locator", dd);
      }
      const cid = document.createElement("dd");
      cid.className = "cid";
      cid.textContent = card.id;
      add("Card", cid);
      detail.appendChild(dl);
      li.appendChild(detail);
    }
    frag.appendChild(li);
  }
  list.appendChild(frag);

  if (rows.length > shown){
    more.hidden = false;
    more.disabled = false;
    more.textContent = "Show " + Math.min(PAGE, rows.length - shown) +
      " more (" + (rows.length - shown) + " remaining)";
  } else {
    more.hidden = true;
    more.disabled = true;
    more.textContent = "";
  }
}

function renderAll(){
  buildChips();
  buildTabs();
  buildOptions();
  buildCards();
  const badge = document.getElementById("badge");
  const n = activeCount();
  badge.hidden = !n;
  badge.textContent = n ? String(n) : "";
}

function clearAll(){
  FACETS.forEach(f => { state[f.key].clear(); facetSearch[f.key] = ""; });
  state.query = "";
  document.getElementById("textsearch").value = "";
  document.getElementById("facetsearch").value = "";
  shown = PAGE;
  renderAll();
}

/* ---------- wiring ---------- */
document.getElementById("provenance").innerHTML =
  "corpus " + DATA.corpusVersion + "<br>" + DATA.cards.length + " cards \u00b7 " +
  DATA.papers.length + " papers";

let searchTimer;
document.getElementById("textsearch").addEventListener("input", event => {
  const value = event.target.value.trim().toLowerCase();
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    state.query = value;
    shown = PAGE;
    renderAll();
  }, 140);
});

document.getElementById("facetsearch").addEventListener("input", event => {
  facetSearch[activeTab] = event.target.value;
  buildOptions();
});

document.getElementById("more").addEventListener("click", event => {
  if (event.currentTarget.hidden || event.currentTarget.disabled) return;
  shown += PAGE;
  buildCards();
});

const sheet = document.getElementById("sheet");
const scrim = document.getElementById("scrim");
function openSheet(){
  sheet.classList.add("open");
  scrim.classList.add("open");
  document.body.classList.add("locked");
}
function closeSheet(){
  sheet.classList.remove("open");
  scrim.classList.remove("open");
  document.body.classList.remove("locked");
}
document.getElementById("openfilters").addEventListener("click", openSheet);
document.getElementById("closefilters").addEventListener("click", closeSheet);
document.getElementById("applyfilters").addEventListener("click", closeSheet);
scrim.addEventListener("click", closeSheet);
document.getElementById("clearall").addEventListener("click", clearAll);
window.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

/* swipe the sheet down to dismiss */
let dragFrom = null;
sheet.addEventListener("touchstart", e => {
  const list = document.getElementById("options");
  if (list.contains(e.target) && list.scrollTop > 0) return;
  dragFrom = e.touches[0].clientY;
}, {passive:true});
sheet.addEventListener("touchmove", e => {
  if (dragFrom === null) return;
  const dy = e.touches[0].clientY - dragFrom;
  if (dy > 0){
    sheet.style.transition = "none";
    sheet.style.transform = "translateY(" + dy + "px)";
  }
}, {passive:true});
sheet.addEventListener("touchend", e => {
  if (dragFrom === null) return;
  const dy = e.changedTouches[0].clientY - dragFrom;
  sheet.style.transition = "";
  sheet.style.transform = "";
  if (dy > 110) closeSheet();
  dragFrom = null;
}, {passive:true});

renderAll();
</script>
</body>
</html>
