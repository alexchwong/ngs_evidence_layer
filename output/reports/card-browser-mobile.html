the ICC, MDS/MPN NOS requires mixed myelodysplastic and myeloproliferative features that do not meet another MDS/MPN, MDS, or MPN category; cytopenia using MDS thresholds; <20% blasts in blood and marrow; platelets >=450 x 10^9/L and/or WBC >=13 x 10^9/L; evidence of clonality when demonstrable (or persistent findings with other causes excluded if clonality cannot be determined); and absence of BCR::ABL1, TK-fusion myeloid/lymphoid neoplasms, t(3;3), inv(3), and del(5q) meeting corresponding MDS criteria.","locator":"MDS/MPN; MDS/MPN, NOS; Table 19"},{"id":"arber-2022-blood-140-1200-C0053","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["CALR","JAK2","MPL"],"diseases":["MDS/MPN-U"],"text":"A history of MPN and/or JAK2, CALR, or MPL mutation, particularly at high VAF, tends to exclude MDS/MPN NOS.","locator":"MDS/MPN; MDS/MPN, NOS; Table 19"},{"id":"arber-2022-blood-140-1200-C0054","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["MDS/MPN-U"],"text":"Hypereosinophilia in a case being considered as MDS/MPN NOS favors chronic eosinophilic leukemia, NOS instead.","locator":"MDS/MPN; MDS/MPN, NOS; Table 19"},{"id":"arber-2022-blood-140-1200-C0055","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["MDS/MPN-U"],"text":"The ICC MDS/MPN NOS category should not be used to classify advanced-stage MPN or triple-negative MPN merely because they are otherwise difficult to classify.","locator":"MDS/MPN; MDS/MPN, NOS; Table 19"},{"id":"arber-2022-blood-140-1200-C0056","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["ABL1","BCR","CALR","JAK2","MPL","SETBP1","SRSF2"],"diseases":["MDS/MPN-U"],"text":"According to the ICC, MDS/MPN with i(17q) is a provisional subtype of MDS/MPN, NOS. Diagnosis requires leukocytosis >=13 x 10^9/L, cytopenia using MDS thresholds, <20% blasts in blood and bone marrow, dysgranulopoiesis with nonsegmented or pseudo-Pelger-Huet neutrophils, and i(17q) either isolated or with one additional abnormality other than -7/del(7q). BCR::ABL1, myeloid/lymphoid-neoplasm tyrosine-kinase gene fusions, and JAK2/CALR/MPL mutations should be absent, and recent cytotoxic or growth-factor therapy must not explain the phenotype. SRSF2 and SETBP1 co-mutations further support the diagnosis.","locator":"MDS/MPN; provisional MDS/MPN with i(17q); Table 18"},{"id":"arber-2022-blood-140-1200-C0057","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["CCUS","MDS"],"text":"For clonal cytopenias spanning CCUS to MDS, the ICC defines cytopenia as acquired sustained hemoglobin <12 g/dL in females or <13 g/dL in males, ANC <1.8 x 10^9/L, and/or platelets <150 x 10^9/L not explained by another condition.","locator":"Premalignant clonal cytopenias and MDS; CCUS and CHIP"},{"id":"arber-2022-blood-140-1200-C0058","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["CHIP"],"text":"CHIP is defined by a somatic mutation in a myeloid-neoplasm driver gene at VAF >=2% or a non-MDS-defining clonal cytogenetic abnormality in a patient without a myeloid neoplasm or unexplained cytopenia.","locator":"Premalignant clonal cytopenias and MDS; CCUS and CHIP"},{"id":"arber-2022-blood-140-1200-C0059","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["CCUS"],"text":"According to the ICC, CCUS has persistent idiopathic cytopenia for >=4 months; it is distinguished from MDS by absence of dysplasia or increased blasts in blood and marrow, and a VAF threshold >=2% is recommended for the clonal abnormality in CCUS and other premalignant clonal cytopenias.","locator":"Premalignant clonal cytopenias and MDS; CCUS and CHIP"},{"id":"arber-2022-blood-140-1200-C0060","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["UBA1"],"diseases":["MDS"],"text":"VEXAS syndrome is associated with somatic UBA1 mutation and should be kept separate from MDS unless morphologic MDS criteria are met.","locator":"Premalignant clonal cytopenias and MDS; CCUS and CHIP"},{"id":"arber-2022-blood-140-1200-C0061","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["ABL1","BCR"],"diseases":["MDS"],"text":"According to the ICC, MDS is a clonal hematopoietic neoplasm defined by persistent unexplained cytopenia and morphologic dysplasia, generally chronic for about >=4 months and not explained by drug, toxin, or comorbidity; a 10% dysplasia threshold is recommended for each lineage, and demonstrable clonality is not required when qualifying dysplasia and cytopenia are present. BCR::ABL1 or a TK-fusion myeloid/lymphoid neoplasm excludes MDS. At initial diagnosis, persistent WBC >=13 x 10^9/L, platelets >=450 x 10^9/L (except MDS-del(5q) or inv(3)/t(3;3)), or monocytes >=0.5 x 10^9/L and >=10% of leukocytes instead favors MDS/MPN or MPN classification.","locator":"Premalignant clonal cytopenias and MDS; MDS definition"},{"id":"arber-2022-blood-140-1200-C0062","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["RUNX1","SF3B1","TP53"],"diseases":["MDS"],"text":"According to the ICC, MDS with mutated SF3B1 requires SF3B1 mutation VAF >=10%, at least one cytopenia, no ICC-defined cytosis at diagnosis, <5% marrow blasts and <2% blood blasts, and absence of multihit TP53, RUNX1 mutation, isolated del(5q), -7/del(7q), 3q26.2 abnormalities, and complex karyotype. Dysplasia is typically present but is not required, and ring sideroblasts are not required.","locator":"Premalignant clonal cytopenias and MDS; Table 20"},{"id":"arber-2022-blood-140-1200-C0063","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["SF3B1"],"diseases":["MDS"],"text":"SF3B1-unmutated MDS with ring sideroblasts is classified as MDS, NOS irrespective of ring-sideroblast number.","locator":"Premalignant clonal cytopenias and MDS; Table 20"},{"id":"arber-2022-blood-140-1200-C0064","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["CCUS","MDS"],"text":"In cytopenic patients lacking dysplasia, prior MDS-defining cytogenetic abnormalities other than del(5q), -7/del(7q), or complex karyotype are now classified as CCUS rather than MDS.","locator":"Premalignant clonal cytopenias and MDS; Table 20"},{"id":"arber-2022-blood-140-1200-C0065","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["TP53"],"diseases":["MDS"],"text":"According to the ICC, MDS with excess blasts requires at least one cytopenia, no ICC-defined cytosis, and 5%-9% marrow blasts or 2%-9% blood blasts; 1% peripheral-blood blasts confirmed on two occasions also qualifies. Dysplasia is typically present but not required, multihit TP53 is excluded in favor of MDS with mutated TP53, and excess blasts supersede other non-TP53 MDS subtypes. In patients <18 years, MDS with excess blasts uses 5%-19% marrow blasts and 2%-19% blood blasts, and MDS/AML does not apply.","locator":"Premalignant clonal cytopenias and MDS; Table 20"},{"id":"arber-2022-blood-140-1200-C0066","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["TP53"],"diseases":["MDS"],"text":"According to the ICC, MDS with del(5q) requires at least one cytopenia, del(5q) isolated or with no more than one additional cytogenetic abnormality other than -7/del(7q), <5% marrow blasts and <2% blood blasts, and absence of multihit TP53. Thrombocytosis is allowed but other ICC-defined cytoses are not; dysplasia is typically present but is not required.","locator":"Premalignant clonal cytopenias and MDS; Table 20"},{"id":"arber-2022-blood-140-1200-C0067","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["SF3B1","TP53"],"diseases":["MDS"],"text":"According to the ICC, MDS, NOS without dysplasia requires at least one cytopenia, no ICC-defined cytosis, <5% marrow blasts and <2% blood blasts, and -7/del(7q) or complex karyotype as the defining cytogenetic abnormality; multihit TP53 and SF3B1 mutation with VAF >=10% are excluded.","locator":"Premalignant clonal cytopenias and MDS; Table 20"},{"id":"arber-2022-blood-140-1200-C0068","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["SF3B1","TP53"],"diseases":["MDS"],"text":"According to the ICC, MDS, NOS with single-lineage dysplasia requires dysplasia in one lineage, at least one cytopenia, no ICC-defined cytosis, <5% marrow blasts and <2% blood blasts, and failure to meet criteria for MDS with del(5q) or MDS with mutated SF3B1; multihit TP53 is excluded.","locator":"Premalignant clonal cytopenias and MDS; Table 20"},{"id":"arber-2022-blood-140-1200-C0069","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["SF3B1","TP53"],"diseases":["MDS"],"text":"According to the ICC, MDS, NOS with multilineage dysplasia requires dysplasia in at least two lineages, at least one cytopenia, no ICC-defined cytosis, <5% marrow blasts and <2% blood blasts, and failure to meet criteria for MDS with del(5q) or MDS with mutated SF3B1; multihit TP53 is excluded.","locator":"Premalignant clonal cytopenias and MDS; Table 20"},{"id":"arber-2022-blood-140-1200-C0070","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["CEBPA","NPM1","TP53"],"diseases":["MDS/AML"],"text":"According to the ICC, adult MDS/AML is defined by 10%-19% blasts in blood or marrow, at least one cytopenia, and absence of ICC-defined cytosis. Generic MDS/AML excludes AML-defining cytogenetic abnormalities and NPM1, in-frame bZIP CEBPA, and TP53 mutations that define other genetic categories; dysplasia is typically present but not required. MDS/AML is subclassified as TP53-mutated, myelodysplasia-related gene-mutated, myelodysplasia-related cytogenetic, or NOS.","locator":"Premalignant clonal cytopenias and MDS; Table 20"},{"id":"arber-2022-blood-140-1200-C0071","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["TP53"],"diseases":["MDS"],"text":"According to the ICC, MDS with mutated TP53 has 0%-9% blasts and requires multihit TP53, defined as 2 distinct TP53 mutations each with VAF >10% or one TP53 mutation plus 17p deletion, VAF >50%, or copy-neutral LOH at TP53; when LOH information is unavailable, TP53 mutation VAF >10% with complex karyotype qualifies. Complex karyotype without a TP53 mutation does not qualify, and monoallelic TP53-mutated MDS is excluded from this entity.","locator":"Premalignant clonal cytopenias and MDS; myeloid neoplasms with mutated TP53; Table 21"},{"id":"arber-2022-blood-140-1200-C0072","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["TP53"],"diseases":["MDS/AML"],"text":"MDS/AML with mutated TP53 is defined by 10%-19% blasts and any somatic TP53 mutation with VAF >10%; monoallelic TP53 mutations are allowed.","locator":"Premalignant clonal cytopenias and MDS; myeloid neoplasms with mutated TP53; Table 21"},{"id":"arber-2022-blood-140-1200-C0073","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["TP53"],"diseases":["AML"],"text":"AML with mutated TP53 is defined by >=20% marrow or blood blasts, or pure erythroid leukemia, plus any somatic TP53 mutation with VAF >10%; monoallelic TP53 mutations are allowed.","locator":"Premalignant clonal cytopenias and MDS; myeloid neoplasms with mutated TP53; Table 21"},{"id":"arber-2022-blood-140-1200-C0074","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["TP53"],"diseases":["MDS"],"text":"Established MDS that acquires a TP53 mutation can be redesignated as MDS, MDS/AML, or AML with mutated TP53 according to blast count.","locator":"Premalignant clonal cytopenias and MDS; progression"},{"id":"arber-2022-blood-140-1200-C0075","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["MDS"],"text":"Development of leukocytosis, thrombocytosis, or monocytosis during established MDS generally does not warrant reclassification as MDS/MPN; the disease can instead be designated as MDS with neutrophilic, thrombocytotic, or monocytic progression.","locator":"Premalignant clonal cytopenias and MDS; progression"},{"id":"arber-2022-blood-140-1200-C0076","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["MDS"],"text":"The ICC recommends retaining the morphologic/genetic MDS diagnosis as primary and adding a therapy-related qualifier when disease follows cytotoxic therapy.","locator":"Premalignant clonal cytopenias and MDS; diagnostic qualifiers"},{"id":"arber-2022-blood-140-1200-C0077","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["CHIP","CCUS","MDS"],"text":"The ICC recommends qualifying CHIP, CCUS, and other non-MDS clonal cytopenias as therapy-related when they follow marrow exposure to chemotherapy or radiation.","locator":"Premalignant clonal cytopenias and MDS; diagnostic qualifiers"},{"id":"arber-2022-blood-140-1200-C0078","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["MDS"],"text":"Any underlying germline predisposition mutation or syndrome should be specified as a qualifier after the MDS diagnosis and subtype.","locator":"Premalignant clonal cytopenias and MDS; diagnostic qualifiers"},{"id":"arber-2022-blood-140-1200-C0079","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["ABL1","BCR","CBL","KRAS","NF1","NRAS","PTPN11","RRAS"],"diseases":["JMML"],"text":"According to the ICC, JMML is a RAS-pathway-defined neoplasm involving PTPN11, NRAS, KRAS, RRAS, NF1, or CBL and generally requires peripheral-blood monocytes >=1 x 10^9/L, splenomegaly, <20% blasts in blood and marrow, and absence of BCR::ABL1. One diagnostic genetic route is a somatic PTPN11, KRAS, NRAS, or RRAS mutation after excluding relevant germline Noonan-syndrome forms; the paper notes that a minority of JMML cases may present below the monocytosis threshold or without splenomegaly.","locator":"Pediatric disorders and/or germline mutation-associated disorders; JMML; Tables 22-23"},{"id":"arber-2022-blood-140-1200-C0080","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["ALK","CBL","CCDC88C","FIP1L1","FLT3","KRAS","NF1","NRAS","PTPN11","RARA","ROS1","RRAS"],"diseases":["JMML"],"text":"According to the ICC, JMML-like neoplasm is a clonal disorder phenotypically resembling JMML but lacking a canonical PTPN11, NRAS, KRAS, RRAS, NF1, or CBL RAS-pathway mutation; rare examples include ALK or ROS1 rearrangements and FIP1L1::RARA or CCDC88C::FLT3 fusions. AML-defining recurrent genetic abnormalities and myeloid/lymphoid neoplasms with eosinophilia and TK fusions are excluded.","locator":"Pediatric disorders and/or germline mutation-associated disorders; JMML-like neoplasms"},{"id":"arber-2022-blood-140-1200-C0084","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["ANKRD26","ETV6","RUNX1"],"diseases":["MDS"],"text":"In germline RUNX1-, ANKRD26-, or ETV6-associated constitutional platelet disorders, marrow megakaryocytic dysplasia can be present with isolated thrombocytopenia in the absence of MDS.","locator":"Hematologic neoplasms with germline predisposition; Table 24"},{"id":"arber-2022-blood-140-1200-C0085","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["MDS"],"text":"When assessing MDS in patients with germline predisposition, baseline dyspoietic bone-marrow changes can be present even in the absence of a myeloid malignancy.","locator":"Hematologic neoplasms with germline predisposition; diagnosis of MDS in germline predisposition"},{"id":"arber-2022-blood-140-1200-C0086","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["MDS"],"text":"In patients with germline predisposition, development of MDS is generally associated with new or progressive cytopenia, often with rising marrow cellularity, overt multilineage dysplasia, increased blasts, and/or acquired pathogenic genetic abnormalities.","locator":"Hematologic neoplasms with germline predisposition; diagnosis of MDS in germline predisposition"},{"id":"arber-2022-blood-140-1200-C0087","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["SF3B1","TP53"],"diseases":["MDS"],"text":"In a patient with germline predisposition, emergence of del(5q), -7/del(7q), complex karyotype, multihit TP53 mutation VAF >10%, or SF3B1 mutation VAF >10% is considered MDS-defining.","locator":"Hematologic neoplasms with germline predisposition; diagnosis of MDS in germline predisposition"},{"id":"arber-2022-blood-140-1200-C0088","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["TP53"],"diseases":["MDS"],"text":"In Shwachman-Diamond syndrome, a small stable clone with monoallelic TP53 mutation alone is not considered MDS, whereas biallelic TP53 mutation is associated with myeloid malignancy.","locator":"Hematologic neoplasms with germline predisposition; diagnosis of MDS in germline predisposition"},{"id":"arber-2022-blood-140-1200-C0089","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["PML","RARA"],"diseases":["APL"],"text":"According to the ICC, acute promyelocytic leukemia with PML::RARA can be diagnosed with >=10% blasts.","locator":"Acute myeloid leukemia; Table 25"},{"id":"arber-2022-blood-140-1200-C0090","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["BCOR","FIP1L1","IRF2BP2","NPM1","RARA","STAT3","STAT5B","TBL1XR1","ZBTB16"],"diseases":["APL"],"text":"According to the ICC, APL with other RARA rearrangements can be diagnosed with >=10% blasts; listed RARA partners include IRF2BP2, NPM1, ZBTB16, STAT5B, STAT3, TBL1XR1, FIP1L1, and BCOR.","locator":"Acute myeloid leukemia; Table 25"},{"id":"arber-2022-blood-140-1200-C0091","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["CBFB","DEK","KMT2A","MLLT3","MYH11","NUP214","RUNX1","RUNX1T1"],"diseases":["AML"],"text":"According to the ICC, AML with RUNX1::RUNX1T1, CBFB::MYH11, MLLT3::KMT2A, or DEK::NUP214 can be diagnosed with >=10% blasts.","locator":"Acute myeloid leukemia; Table 25"},{"id":"arber-2022-blood-140-1200-C0092","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["AFDN","AFF1","ELL","KMT2A","MLLT1","MLLT10","TET1"],"diseases":["AML"],"text":"According to the ICC, AML with other KMT2A rearrangements can be diagnosed with >=10% blasts; listed partners include AFF1, AFDN, MLLT10, TET1, ELL, and MLLT1.","locator":"Acute myeloid leukemia; Table 25"},{"id":"arber-2022-blood-140-1200-C0093","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["GATA2","MECOM"],"diseases":["AML"],"text":"According to the ICC, AML with inv(3) or t(3;3) involving GATA2 and MECOM can be diagnosed with >=10% blasts.","locator":"Acute myeloid leukemia; Table 25"},{"id":"arber-2022-blood-140-1200-C0094","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["ETV6","MECOM","MYC","RUNX1"],"diseases":["AML"],"text":"According to the ICC, AML with other MECOM rearrangements can be diagnosed with >=10% blasts; listed examples include MECOM rearrangements involving MYC, ETV6, or RUNX1.","locator":"Acute myeloid leukemia; Table 25"},{"id":"arber-2022-blood-140-1200-C0095","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["ABL1","BCR"],"diseases":["AML"],"text":"According to the ICC, AML with BCR::ABL1 requires >=20% blasts.","locator":"Acute myeloid leukemia; Table 25"},{"id":"arber-2022-blood-140-1200-C0096","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["ABL1","BCR"],"diseases":["AML"],"text":"The ICC does not use the MDS/AML category for BCR::ABL1-positive AML because of overlap with progression of BCR::ABL1-positive CML.","locator":"Acute myeloid leukemia; Table 25 footnote"},{"id":"arber-2022-blood-140-1200-C0097","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["NPM1"],"diseases":["AML"],"text":"According to the ICC, AML with mutated NPM1 can be diagnosed with >=10% blasts.","locator":"Acute myeloid leukemia; Table 25"},{"id":"arber-2022-blood-140-1200-C0098","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["CEBPA"],"diseases":["AML"],"text":"According to the ICC, AML with an in-frame bZIP CEBPA mutation can be diagnosed with >=10% blasts, without requiring biallelic CEBPA mutations.","locator":"Acute myeloid leukemia; Table 25"},{"id":"arber-2022-blood-140-1200-C0099","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["ASXL1","BCOR","EZH2","RUNX1","SF3B1","SRSF2","STAG2","U2AF1","ZRSR2"],"diseases":["MDS/AML"],"text":"According to the ICC, MDS/AML with myelodysplasia-related gene mutations has 10%-19% blasts and is defined by mutation in ASXL1, BCOR, EZH2, RUNX1, SF3B1, SRSF2, STAG2, U2AF1, or ZRSR2.","locator":"Acute myeloid leukemia; Table 25"},{"id":"arber-2022-blood-140-1200-C0100","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["ASXL1","BCOR","EZH2","RUNX1","SF3B1","SRSF2","STAG2","U2AF1","ZRSR2"],"diseases":["AML"],"text":"According to the ICC, AML with myelodysplasia-related gene mutations requires >=20% blasts and is defined by mutation in ASXL1, BCOR, EZH2, RUNX1, SF3B1, SRSF2, STAG2, U2AF1, or ZRSR2.","locator":"Acute myeloid leukemia; Table 25"},{"id":"arber-2022-blood-140-1200-C0101","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["TP53"],"diseases":["MDS/AML"],"text":"After excluding TP53 mutation, myelodysplasia-related gene mutation, and other class-defining recurring genetic abnormalities, MDS/AML with myelodysplasia-related cytogenetic abnormalities is defined at 10%-19% blasts by specified abnormalities including complex karyotype, del/t/add(5q), -7/del(7q), +8, del/t/add(12p), i(17q), -17/add(17p)/del(17p), del(20q), or idic(X)(q13).","locator":"Acute myeloid leukemia; Table 25"},{"id":"arber-2022-blood-140-1200-C0102","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["TP53"],"diseases":["AML"],"text":"After excluding TP53 mutation, myelodysplasia-related gene mutation, and other class-defining recurring genetic abnormalities, AML with myelodysplasia-related cytogenetic abnormalities is defined at >=20% blasts by specified abnormalities including complex karyotype, del/t/add(5q), -7/del(7q), +8, del/t/add(12p), i(17q), -17/add(17p)/del(17p), del(20q), or idic(X)(q13).","locator":"Acute myeloid leukemia; Table 25"},{"id":"arber-2022-blood-140-1200-C0103","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["AML"],"text":"AML, NOS requires >=20% blasts after excluding class-defining genetic categories.","locator":"Acute myeloid leukemia; Table 25"},{"id":"arber-2022-blood-140-1200-C0104","paper":"a
