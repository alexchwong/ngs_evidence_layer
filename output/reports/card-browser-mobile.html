<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cards">
<meta name="theme-color" content="#efeef4">
<title>Evidence cards</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%23191825'/%3E%3Crect x='40' y='46' width='100' height='24' rx='4' fill='%23a31e63'/%3E%3Crect x='40' y='82' width='100' height='16' rx='4' fill='%23efeef4'/%3E%3Crect x='40' y='110' width='72' height='16' rx='4' fill='%236e6a82'/%3E%3C/svg%3E">
<style>
  :root{
    --paper:#efeef4;
    --panel:#f7f6fa;
    --card:#fff;
    --ink:#191825;
    --muted:#6e6a82;
    --rule:#d8d5e3;
    --azure:#2b4c8c;
    --eosin:#a31e63;
    --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
    --display:"New York",Georgia,serif;
    --cat-diagnosis:#4a3f8f;
    --cat-prognosis:#a31e63;
    --cat-treatment:#1d6f63;
    --cat-biomarker:#2b4c8c;
    --cat-germline:#8a5a12;
    --bar:calc(56px + env(safe-area-inset-bottom));
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  /* author display rules outrank the UA sheet's [hidden]; restate it with weight */
  [hidden]{display:none!important}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);color:var(--ink);font-family:var(--sans);
    font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none;
  }
  body.locked{overflow:hidden}
  button{font:inherit;color:inherit;border:0;background:none;padding:0}
  input{font-size:16px} /* keeps iOS from zooming on focus */

  /* ---------- masthead + search ---------- */
  header{
    position:sticky;top:0;z-index:20;background:var(--paper);
    border-bottom:1px solid var(--rule);
    padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
  }
  .titlerow{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  .wordmark{font-family:var(--display);font-size:22px;font-weight:600;margin:0;letter-spacing:-.01em}
  .wordmark em{font-style:italic;color:var(--eosin)}
  .provenance{font-family:var(--mono);font-size:10.5px;color:var(--muted);text-align:right}
  .searchrow{display:flex;gap:8px;margin-top:10px}
  .text-search{
    flex:1;min-width:0;border:1px solid var(--rule);background:var(--card);border-radius:9px;
    padding:9px 12px;font-family:var(--sans);color:var(--ink);-webkit-appearance:none;
  }
  .text-search::placeholder{color:#9a96ab}

  /* ---------- active filter chips ---------- */
  .chips{display:flex;gap:6px;overflow-x:auto;padding:9px 16px 0;
    -webkit-overflow-scrolling:touch;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chips:empty{display:none}
  .chip{
    flex:none;display:flex;align-items:center;gap:6px;background:var(--card);
    border:1px solid var(--rule);border-radius:999px;padding:5px 10px;
    font-size:13px;max-width:60vw;
  }
  .chip .txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .chip .x{font-family:var(--mono);font-size:12px;color:var(--eosin);flex:none}
  .chip.clearall{color:var(--eosin);border-style:dashed}

  /* ---------- results ---------- */
  main{padding:10px 12px calc(var(--bar) + 28px)}
  ol.cards{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
  li.card{
    background:var(--card);border:1px solid var(--rule);border-radius:11px;
    border-left:4px solid var(--spine,var(--rule));overflow:hidden;
  }
  .card-head{
    display:block;width:100%;text-align:left;padding:11px 13px;cursor:pointer;
  }
  .card-meta{
    display:flex;align-items:center;gap:8px;margin-bottom:5px;
    font-family:var(--mono);font-size:10.5px;color:var(--muted);
  }
  .card-meta .cat{color:var(--spine,var(--muted));text-transform:uppercase;letter-spacing:.07em}
  .card-meta .paper{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
  .card-head p{margin:0;font-size:15.5px;line-height:1.5}
  li.card mark{background:#f7dbe8;color:inherit;border-radius:2px;padding:0 1px}
  .detail{border-top:1px solid var(--rule);padding:10px 13px 12px;background:var(--panel);font-size:13.5px}
  .detail dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px}
  .detail dt{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;
    text-transform:uppercase;color:var(--muted);padding-top:2px}
  .detail dd{margin:0;overflow-wrap:anywhere}
  .detail .cid{font-family:var(--mono);font-size:11.5px}
  .tagbtn{
    display:inline-block;border:1px solid var(--rule);background:var(--card);
    border-radius:999px;padding:2px 9px;margin:0 4px 4px 0;font-size:12.5px;
  }
  .tagbtn[aria-pressed="true"]{border-color:var(--eosin);color:var(--eosin)}
  .empty{padding:48px 16px;text-align:center;color:var(--muted)}
  .empty h3{font-family:var(--display);font-size:19px;color:var(--ink);margin:0 0 6px}
  .more{
    display:block;width:100%;margin-top:12px;padding:12px;background:var(--card);
    border:1px solid var(--rule);border-radius:11px;font-family:var(--mono);font-size:12.5px;
  }

  /* ---------- bottom bar ---------- */
  .bar{
    position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;align-items:center;
    gap:12px;padding:8px 16px calc(8px + env(safe-area-inset-bottom));
    background:rgba(239,238,244,.93);backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);border-top:1px solid var(--rule);
  }
  .tally{flex:1;font-family:var(--mono);font-size:12px;color:var(--muted)}
  .tally b{color:var(--ink);font-weight:600}
  .filterbtn{
    background:var(--ink);color:#fff;border-radius:999px;padding:10px 20px;
    font-size:14.5px;font-weight:600;min-height:44px;
  }
  .filterbtn .badge{
    display:inline-block;margin-left:7px;background:var(--eosin);border-radius:999px;
    padding:1px 7px;font-family:var(--mono);font-size:11px;
  }

  /* ---------- filter sheet ---------- */
  .scrim{
    position:fixed;inset:0;z-index:40;background:rgba(25,24,37,.36);
    opacity:0;pointer-events:none;transition:opacity .2s;
  }
  .scrim.open{opacity:1;pointer-events:auto}
  .sheet{
    position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--paper);
    border-radius:16px 16px 0 0;max-height:88vh;display:flex;flex-direction:column;
    transform:translateY(102%);transition:transform .24s cubic-bezier(.32,.72,0,1);
    box-shadow:0 -8px 40px rgba(25,24,37,.18);
  }
  .sheet.open{transform:translateY(0)}
  .grabber{width:38px;height:5px;border-radius:3px;background:var(--rule);margin:8px auto 2px;flex:none}
  .sheet-head{display:flex;align-items:center;justify-content:space-between;
    padding:6px 16px 10px;flex:none}
  .sheet-head h2{font-family:var(--display);font-size:19px;margin:0;font-weight:600}
  .sheet-head button{font-size:15px;color:var(--azure);padding:8px;margin:-8px}
  .tabs{display:flex;gap:6px;overflow-x:auto;padding:0 16px 10px;flex:none;
    scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{
    flex:none;border:1px solid var(--rule);background:var(--card);border-radius:999px;
    padding:7px 14px;font-size:13.5px;min-height:38px;
  }
  .tab[aria-selected="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
  .tab .n{font-family:var(--mono);font-size:11px;color:var(--eosin);margin-left:5px}
  .tab[aria-selected="true"] .n{color:#f0a8c9}
  .facet-search{
    width:calc(100% - 32px);margin:0 16px 8px;border:1px solid var(--rule);
    background:var(--card);border-radius:9px;padding:9px 12px;-webkit-appearance:none;
  }
  .options{list-style:none;margin:0;padding:0 16px calc(20px + env(safe-area-inset-bottom));
    overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1}
  .opt{
    width:100%;display:flex;gap:10px;align-items:center;text-align:left;
    padding:11px 4px;border-bottom:1px solid var(--rule);min-height:46px;
  }
  .opt .box{
    width:20px;height:20px;flex:none;border:1.5px solid var(--rule);border-radius:5px;
    background:var(--card);font-family:var(--mono);font-size:12px;line-height:17px;
    text-align:center;color:#fff;
  }
  .opt[aria-pressed="true"] .box{background:var(--eosin);border-color:var(--eosin)}
  .opt[aria-pressed="true"] .label{font-weight:600;color:var(--eosin)}
  .opt .label{flex:1;min-width:0;overflow-wrap:anywhere;font-size:15px}
  .opt .count{font-family:var(--mono);font-size:12px;color:var(--muted);flex:none}
  .opt[disabled]{opacity:.32}
  .swatch{width:9px;height:9px;border-radius:50%;flex:none}
  .sheet-foot{
    flex:none;display:flex;gap:10px;padding:10px 16px calc(10px + env(safe-area-inset-bottom));
    border-top:1px solid var(--rule);background:var(--panel);
  }
  .sheet-foot button{flex:1;border-radius:9px;padding:12px;font-size:15px;min-height:46px}
  .sheet-foot .clear{border:1px solid var(--rule);background:var(--card)}
  .sheet-foot .apply{background:var(--ink);color:#fff;font-weight:600}

  :focus-visible{outline:2px solid var(--eosin);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  @media (prefers-color-scheme:dark){
    :root{
      --paper:#151420;--panel:#1d1b2a;--card:#232135;--ink:#eceaf4;--muted:#9a95b0;
      --rule:#35324a;--eosin:#f078ac;--azure:#8fb0ee;
      --cat-diagnosis:#a396f0;--cat-prognosis:#f078ac;--cat-treatment:#4fbfa8;
      --cat-biomarker:#8fb0ee;--cat-germline:#d9a44e;
    }
    .bar{background:rgba(21,20,32,.93)}
    li.card mark{background:#5c2442}
    .opt .box{color:#151420}
  }
</style>
</head>
<body>
<header>
  <div class="titlerow">
    <h1 class="wordmark">Evidence <em>cards</em></h1>
    <div class="provenance" id="provenance"></div>
  </div>
  <div class="searchrow">
    <input class="text-search" id="textsearch" type="search" enterkeyhint="search"
           autocapitalize="off" autocorrect="off" spellcheck="false"
           placeholder="Search interpretations" aria-label="Search interpretation text">
  </div>
</header>

<div class="chips" id="chips"></div>

<main>
  <ol class="cards" id="cards"></ol>
  <button class="more" id="more" type="button" hidden></button>
</main>

<div class="bar">
  <div class="tally" id="tally"></div>
  <button class="filterbtn" id="openfilters" type="button">Filters<span class="badge" id="badge" hidden></span></button>
</div>

<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Filters">
  <div class="grabber"></div>
  <div class="sheet-head">
    <h2>Filters</h2>
    <button type="button" id="closefilters">Done</button>
  </div>
  <div class="tabs" id="tabs" role="tablist"></div>
  <input class="facet-search" id="facetsearch" type="search"
         autocapitalize="off" autocorrect="off" spellcheck="false" hidden>
  <ul class="options" id="options"></ul>
  <div class="sheet-foot">
    <button type="button" class="clear" id="clearall">Clear all</button>
    <button type="button" class="apply" id="applyfilters">Show results</button>
  </div>
</section>

seases":["B-ALL"],"text":"According to WHO-HAEM5, B-ALL with TCF3::HLF fusion is a distinct B-ALL entity from B-ALL with TCF3::PBX1 fusion.","locator":"B-ALL section, line 79"},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0008","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"prognosis","tier":"restated secondary","genes":["TCF3","HLF"],"diseases":["B-ALL"],"text":"B-ALL with TCF3::HLF fusion is characterized by particularly aggressive behaviour.","locator":"B-ALL section, line 79"},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0009","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["B-ALL"],"text":"According to WHO-HAEM5, B-ALL with BCR::ABL1-like features is a B-ALL entity, upgraded from provisional status, defined by gene-expression and phenotypic similarity to B-ALL with BCR::ABL1 fusion.","locator":"B-ALL section, line 79"},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0010","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["B-ALL"],"text":"According to WHO-HAEM5, B-ALL with ETV6::RUNX1-like features is a new B-ALL entity.","locator":"B-ALL section, line 79"},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0013","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["MBL"],"text":"According to WHO-HAEM5, low-count MBL is defined by a clonal CLL/SLL-phenotype B-cell count below 0.5 × 10^9/L with no other features diagnostic of a B-lymphoproliferative disorder.","locator":"MBL section, lines 201–203"},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0014","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["MBL"],"text":"According to WHO-HAEM5, CLL/SLL-type MBL is defined by a monoclonal CLL/SLL-phenotype B-cell count at least 0.5 × 10^9/L and a total B-cell count below 5 × 10^9/L, with no other features diagnostic of CLL/SLL.","locator":"MBL section, lines 204–207"},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0015","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["MBL"],"text":"According to WHO-HAEM5, non-CLL/SLL-type MBL is any monoclonal non-CLL/SLL-phenotype B-cell expansion without symptoms or features diagnostic of another mature B-cell neoplasm.","locator":"MBL section, line 209"},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0016","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["CLL/SLL"],"text":"For CLL/SLL diagnosis, WHO-HAEM5 regards CD5, CD19, CD20, CD23, and surface or cytoplasmic kappa and lambda light chains as essential markers.","locator":"CLL/SLL section, line 211"},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0019","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":["IGH","CCND1"],"diseases":["mantle cell lymphoma"],"text":"According to WHO-HAEM5, cases formerly labelled B-prolymphocytic leukaemia that carry IGH::CCND1 are classified as a mantle cell lymphoma variant rather than B-PLL.","locator":"B-prolymphocytic leukaemia section, line 257"},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0020","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["CLL/SLL"],"text":"According to WHO-HAEM5, CLL/SLL with at least 15% prolymphocytes is classified as prolymphocytic progression of CLL/SLL, whereas CLL/SLL with less than 15% prolymphocytes remains CLL/SLL.","locator":"B-prolymphocytic leukaemia section and Fig. 1, lines 257 and 275"},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0021","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["SBLPN"],"text":"According to WHO-HAEM5, former B-prolymphocytic leukaemia cases not reclassified as mantle cell lymphoma or CLL/SLL progression are incorporated into splenic B-cell lymphoma/leukaemia with prominent nucleoli (SBLPN).","locator":"B-prolymphocytic leukaemia section, lines 257–263"},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0022","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":["BRAF"],"diseases":["HCL"],"text":"In hairy cell leukaemia, BRAF p.V600E is a hallmark somatic mutation, whereas other members of the splenic B-cell lymphoma/leukaemia family usually lack BRAF mutations, supporting diagnostic distinction.","locator":"Splenic B-cell lymphoma section, line 261"},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0023","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["SDRPL"],"text":"A CD200 mean fluorescence intensity/CD180 mean fluorescence intensity ratio below 0.5 on flow cytometry favours splenic diffuse red pulp small B-cell lymphoma (SDRPL) over hairy cell leukaemia (HCL), splenic marginal zone lymphoma (SMZL), and splenic B-cell lymphoma/leukaemia with prominent nucleoli (SBLPN).","locator":"SDRPL section, line 267"},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0024","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":["MYD88"],"diseases":["IgM LPL/WM"],"text":"According to WHO-HAEM5, IgM LPL/WM has two molecular subsets based on the presence or absence of MYD88 p.L265P.","locator":"Lymphoplasmacytic lymphoma section, line 273"},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0025","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":["MYD88"],"diseases":["LPL"],"text":"In lymphoplasmacytic lymphoma (LPL), demonstration of MYD88 p.L265P may aid differential diagnosis from nodal marginal zone lymphoma, extranodal MZL of MALT with plasmacytoid differentiation, and plasma cell myeloma.","locator":"Lymphoplasmacytic lymphoma section, line 273"},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0026","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"prognosis","tier":"restated secondary","genes":["CXCR4"],"diseases":["LPL"],"text":"In lymphoplasmacytic lymphoma (LPL), CXCR4-mutated disease is associated with shorter time to treatment.","locator":"Lymphoplasmacytic lymphoma section, line 277"},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0027","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"treatment","tier":"restated secondary","genes":["CXCR4"],"diseases":["LPL"],"text":"In lymphoplasmacytic lymphoma (LPL), CXCR4 mutation is associated particularly with resistance to ibrutinib therapy.","locator":"Lymphoplasmacytic lymphoma section, line 277"},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0029","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"treatment","tier":"restated secondary","genes":["BIRC3","MALT1"],"diseases":["extranodal MZL of MALT"],"text":"In gastric extranodal MZL of MALT, BIRC3::MALT1 identifies disease that does not respond to Helicobacter pylori eradication.","locator":"Extranodal marginal zone lymphoma Fig. 2 legend, line 317"},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0030","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":["IGH","BCL2"],"diseases":["follicular lymphoma"],"text":"According to WHO-HAEM5, classic follicular lymphoma encompasses the usual follicular-pattern follicular lymphomas composed of centrocytes and centroblasts that commonly harbour t(14;18)/IGH::BCL2, and is distinguished from follicular large B-cell lymphoma and follicular lymphoma with uncommon features.","locator":"Follicular lymphoma section, line 289"},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0031","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["follicular lymphoma"],"text":"According to WHO-HAEM5, histological grading is optional rather than mandatory for classic follicular lymphoma.","locator":"Follicular lymphoma section, lines 291–319"},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0032","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":["IRF4"],"diseases":["follicular lymphoma"],"text":"Follicular lymphoma with blastoid or large-centrocyte cytology should be distinguished from large B-cell lymphoma with IRF4 rearrangement.","locator":"Follicular lymphoma section, line 325"},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0033","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":["CCND1"],"diseases":["in situ mantle cell neoplasm"],"text":"According to WHO-HAEM5, in situ mantle cell neoplasm represents mantle-zone colonization by B cells carrying an IG::CCND1 fusion with cyclin D1 overexpression.","locator":"Mantle cell lymphoma section, line 329"},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0034","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":["IGH","CCND1"],"diseases":["mantle cell lymphoma"],"text":"In mantle cell lymphoma, IGH::CCND1 fusion associated with t(11;14) is the genetic hallmark and is present in at least 95% of cases.","locator":"Mantle cell lymphoma section, line 331"},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0035","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":["IGK","IGL","CCND1"],"diseases":["mantle cell lymphoma"],"text":"In cyclin D1-positive mantle cell lymphoma with no detectable CCND1 rearrangement by FISH, cryptic rearrangements of IGK or IGL enhancers with CCND1 can account for cyclin D1 overexpression.","locator":"Mantle cell lymphoma section, line 331"},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0036","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":["CCND2","CCND3","CCNE"],"diseases":["mantle cell lymphoma"],"text":"In cyclin D1-negative, CCND1-rearrangement-negative mantle cell lymphoma, rearrangements of CCND2, CCND3, or CCNE are alternative cell-cycle lesions.","locator":"Mantle cell lymphoma section, line 335"},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0037","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"prognosis","tier":"restated secondary","genes":["TP53"],"diseases":["mantle cell lymphoma"],"text":"TP53 mutation is a best-established biomarker of high-risk mantle cell lymphoma.","locator":"Mantle cell lymphoma section, line 335"},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0038","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":["SOX11"],"diseases":["leukaemic non-nodal mantle cell lymphoma"],"text":"Leukaemic non-nodal mantle cell lymphoma is characteristically SOX11-negative, with a low Ki67 index and frequent lack of CD5 expression.","locator":"Mantle cell lymphoma section, line 337"},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0039","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["DLBCL, NOS"],"text":"According to WHO-HAEM5, DLBCL, NOS continues to include germinal-centre B-cell-like and activated B-cell-like subtypes.","locator":"DLBCL, NOS section, lines 347–353"},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0040","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["DLBCL, NOS"],"text":"According to WHO-HAEM5, proposed NGS-based molecular classifications are not incorporated into DLBCL, NOS because no unified genetic framework is established and their outcome and targeted-treatment implications remain unclear.","locator":"DLBCL, NOS section, lines 349–353"},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0041","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":["MYC","BCL2"],"diseases":["DLBCL/HGBL-MYC/BCL2"],"text":"According to WHO-HAEM5, DLBCL/HGBL-MYC/BCL2 is defined by dual MYC and BCL2 rearrangements and can have large-cell, intermediate-cell, or blastoid morphology.","locator":"Large B-cell lymphoma section, line 357"},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0042","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":["MYC","BCL6"],"diseases":["DLBCL, NOS","HGBL, NOS"],"text":"According to WHO-HAEM5, lymphoid neoplasms with dual MYC and BCL6 rearrangements are excluded from DLBCL/HGBL-MYC/BCL2 and are classified as DLBCL, NOS or HGBL, NOS according to cytomorphology.","locator":"Large B-cell lymphoma section, line 357"},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0043","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":["MYC"],"diseases":["HGBL-11q"],"text":"According to WHO-HAEM5, HGBL-11q is a MYC-rearrangement-negative mature B-cell lymphoma with Burkitt-like, intermediate, or blastoid morphology and a characteristic 11q gain/loss pattern.","locator":"HGBL-11q section, lines 359–361"},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0044","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":["MYC"],"diseases":["HGBL-11q"],"text":"B-cell lymphomas with a Burkitt-like appearance that lack MYC rearrangement should be tested for the characteristic 11q gain/loss pattern of HGBL-11q.","locator":"HGBL-11q section, line 361"},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0045","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":["MYD88","CD79B"],"diseases":["primary large B-cell lymphoma of immune-privileged sites"],"text":"In primary large B-cell lymphoma of immune-privileged sites, concomitant MYD88 and CD79B mutations are a distinctive shared mutational profile across primary CNS, vitreoretinal, and testicular large B-cell lymphomas.","locator":"Table 4, lines 367–381"},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0046","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["fluid overload-associated large B-cell lymphoma"],"text":"According to WHO-HAEM5, fluid overload-associated large B-cell lymphoma is distinct from primary effusion lymphoma; fluid overload-associated large B-cell lymphoma is KSHV/HHV8-negative and usually presents as an isolated body-cavity effusion in adults without underlying immunodeficiency.","locator":"Fluid overload-associated large B-cell lymphoma section, lines 365 and 383"},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0047","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["DLBCL, NOS"],"text":"According to WHO-HAEM5, cases resembling mediastinal grey zone lymphoma but occurring outside and without mediastinal involvement are better classified as DLBCL, NOS.","locator":"Mediastinal grey zone lymphoma section, line 385"},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0048","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":["MYC"],"diseases":["Burkitt lymphoma"],"text":"According to WHO-HAEM5, Burkitt lymphoma is an aggressive mature B-cell neoplasm with germinal-centre phenotype, very high Ki67, and an IG::MYC juxtaposition.","locator":"Burkitt lymphoma section, line 391"},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0049","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["Burkitt lymphoma"],"text":"According to WHO-HAEM5, Burkitt lymphoma should be classified into EBV-positive and EBV-negative subtypes rather than the traditional endemic, sporadic, and immunodeficiency-associated epidemiological variants.","locator":"Burkitt lymphoma section, lines 391–393"},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0051","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["lymphoid neoplasm"],"text":"For a lymphoid neoplasm arising in immune deficiency/dysregulation, WHO-HAEM5 uses a three-part nomenclature comprising histological diagnosis, oncogenic-virus status, and the immune-deficiency/dysregulation setting.","locator":"Immune deficiency/dysregulation section and Table 5, lines 401–451"},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0052","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["classic Hodgkin lymphoma"],"text":"For classic Hodgkin lymphoma, WHO-HAEM5 advises caution in immune-deficiency/dysregulation settings and in purely extranodal CHL-like proliferations because EBV-positive HRS-like cells can occur in mimics.","locator":"Classic Hodgkin lymphoma section, line 461"},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0053","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["nodular lymphocyte predominant Hodgkin lymphoma"],"text":"According to WHO-HAEM5, nodular lymphocyte predominant Hodgkin lymphoma remains the formal terminology, while “nodular lymphocyte predominant B-cell lymphoma” is an acceptable alternative name in preparation for possible future adoption.","locator":"NLPHL section, line 463"},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0054","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["MGRS"],"text":"According to WHO-HAEM5, monoclonal gammopathy of renal significance (MGRS) is a plasma-cell or B-cell proliferation below accepted malignancy criteria that secretes a monoclonal immunoglobulin or fragment causing kidney injury.","locator":"Plasma cell neoplasms section, line 471"},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0055","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["TEMPI syndrome"],"text":"According to WHO-HAEM5, TEMPI syndrome is included among plasma-cell-neoplasm-associated paraneoplastic syndromes.","locator":"Plasma cell neoplasms section, lines 467–469"},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0056","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["TEMPI syndrome"],"text":"According to WHO-HAEM5, TEMPI syndrome is diagnosed primarily using clinical and imaging investigations.","locator":"Plasma cell neoplasms section, line 473"},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0057","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["T-ALL"],"text":"Indolent T-lymphoblastic proliferation may mimic T-ALL because of TdT expression, but typically lacks architectural destruction, marked cytologic atypia, and monoclonal TCR gene rearrangement.","locator":"Tumour-like T-cell lesions section, line 485"},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0058","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["T-ALL"],"text":"According to WHO-HAEM5, genetically defined T-ALL types are not recognized because current genetic evidence is insufficient to establish clinically relevant genetic subtypes.","locator":"Precursor T-cell neoplasms section, lines 487–489"},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0059","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["acute lymphoblastic leukaemia/lymphoma"],"text":"Within acute lymphoblastic leukaemia/lymphoma classification, WHO-HAEM5 does not separately list NK-lymphoblastic leukaemia/lymphoma because reliable diagnostic criteria are lacking and there is substantial overlap with other CD56-positive acute neoplasms.","locator":"Precursor T-cell neoplasms section, line 489"},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0060","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":["TCL1A","MTCP1"],"diseases":["T-PLL"],"text":"Unified diagnostic criteria for T-PLL include T-lymphocytosis above 5 × 10^9/L with appropriate phenotype and T-cell monoclonality plus genetic aberrations with breakpoints affecting TCL1A or MTCP1, or TCL1 expression.","locator":"T-prolymphocytic leukaemia section, line 497"},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0061","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"prognosis","tier":"restated secondary","genes":["STAT3"],"diseases":["T-LGLL"],"text":"In T-LGLL, STAT3 mutation is associated with poorer overall survival.","locator":"T-LGLL section, line 497"},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0062","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"prognosis","tier":"restated secondary","genes":["STAT5B"],"diseases":["T-LGLL"],"text":"In T-LGLL, STAT5B mutation is associated with poor prognosis in CD8-positive disease but has no prognostic impact in CD4-positive or gamma/delta T-LGLL.","locator":"T-LGLL section, line 497"},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0063","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["primary cutaneous T-cell lymphoma"],"text":"Because forms of primary cutaneous T-cell lymphoma overlap morphologically and immunophenotypically, WHO-HAEM5 regards clinical correlation, dermatological examination, and photographic documentation as indispensable to correct diagnosis.","locator":"Primary cutaneous T-cell lymphoma section, lines 503–507"},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0064","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":["JAK3"],"diseases":["indolent NK-cell lymphoproliferative disorder of the gastrointestinal tract"],"text":"In indolent NK-cell lymphoproliferative disorder of the gastrointestinal tract, recurrent somatic JAK3 mutations support its neoplastic classification rather than a reactive process.","locator":"Intestinal T/NK-cell section, line 511"},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0065","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["indolent NK-cell lymphoproliferative disorder of the gastrointestinal tract"],"text":"Indolent NK-cell lymphoproliferative disorder of the gastrointestinal tract should not be misdiagnosed as extranodal NK/T-cell lymphoma; lack of EBV is a crucial differential feature supporting the indolent NK-cell lymphoproliferative disorder diagnosis.","locator":"Intestinal T/NK-cell section, line 511"},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0066","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"prognosis","tier":"restated secondary","genes":["TP63","TP53"],"diseases":["ALK-negative anaplastic large cell lymphoma"],"text":"In ALK-negative anaplastic large cell lymphoma, TP63 rearrangement and loss of TP53 are associated with poor outcome.","locator":"ALK-negative ALCL section, line 637"},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0069","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["nodal TFH cell lymphoma"],"text":"According to WHO-HAEM5, the TFH phenotype in nodal TFH cell lymphoma is defined by at least two TFH markers in addition to CD4.","locator":"Nodal TFH lymphoma section, line 651"},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0070","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["nodal TFH cell lymphoma"],"text":"For difficult nodal TFH cell lymphoma diagnoses, WHO-HAEM5 recommends an integrated approach using clinical, morphologic, and immunophenotypic features, with genomic input for clonality and mutational profiles.","locator":"Nodal TFH lymphoma section, line 651"},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0072","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["EBV-positive nodal T/NK-cell lymphoma"],"text":"According to WHO-HAEM5, EBV-positive nodal T/NK-cell lymphoma is a distinct entity rather than a peripheral T-cell lymphoma, NOS subtype, and EBV positivity is required by definition.","locator":"Nodal EBV-positive T/NK-cell lymphoma section, lines 657–661"},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0073","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"germline","tier":"restated secondary","genes":["ATM"],"diseases":[],"text":"Ataxia telangiectasia is a lymphoid-neoplasm-relevant inherited predisposition syndrome linked to germline ATM mutations.","locator":"Genetic predisposition syndromes section, line 677"},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0074","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"germline","tier":"restated secondary","genes":["NBN"],"diseases":[],"text":"Nijmegen breakage syndrome is a lymphoid-neoplasm-relevant inherited predisposition syndrome linked to germline NBN mutations.","locator":"Genetic predisposition syndromes section, line 677"},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0075","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":["ATM"],"diseases":["lymphoid neoplasm"],"text":"In a lymphoid neoplasm arising in a patient with ataxia telangiectasia due to germline ATM predisposition, leukaemias and lymphomas should be diagnosed by conventional criteria and designated “AT-related”.","locator":"Genetic predisposition syndromes section, line 677"},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0076","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":["NBN"],"diseases":["lymphoid neoplasm"],"text":"In a lymphoid neoplasm arising in a patient with Nijmegen breakage syndrome due to germline NBN predisposition, leukaemias and lymphomas should be diagnosed by conventional criteria and designated “NBS-related”.","locator":"Genetic predisposition syndromes section, line 677"},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0077","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"treatment","tier":"restated secondary","genes":["ATM"],"diseases":["lymphoid neoplasm"],"text":"In a lymphoid neoplasm associated with germline ATM predisposition causing ataxia telangiectasia, recognition of the syndrome is clinically important for treatment planning because of increased toxicities.","locator":"Genetic predisposition syndromes section, line 677"},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0078","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"treatment","tier":"restated secondary","genes":["NBN"],"diseases":["lymphoid neoplasm"],"text":"In a lymphoid neoplasm associated with germline NBN predisposition causing Nijmegen breakage syndrome, recognition of the syndrome is clinically important for treatment planning because of increased toxicities.","locator":"Genetic predisposition syndromes section, line 677"},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0079","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"germline","tier":"restated secondary","genes":["ATM"],"diseases":[],"text":"Recognition of germline ATM predisposition causing ataxia telangiectasia is clinically important for surveillance of carriers and counselling of relatives.","locator":"Genetic predisposition syndromes section, line 677"},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0080","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"germline","tier":"restated secondary","genes":["NBN"],"diseases":[],"text":"Recognition of germline NBN predisposition causing Nijmegen breakage syndrome is clinically important for surveillance of carriers and counselling of relatives.","locator":"Genetic predisposition syndromes section, line 677"},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0081","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":["ALK"],"diseases":["ALK-positive anaplastic large cell lymphoma","ALK-negative anaplastic large cell lymphoma"],"text":"According to WHO-HAEM5, ALK-positive anaplastic large cell lymphoma and ALK-negative anaplastic large cell lymphoma are distinct entities based on their distinct pathogenesis and clinical course.","locator":"Anaplastic large cell lymphoma section, line 637"},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0082","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":["ID3","TCF3"],"diseases":["HGBL-11q"],"text":"Genomic alterations affecting the ID3-TCF3 complex, a molecular hallmark of Burkitt lymphoma, are rare or absent in HGBL-11q, supporting molecular distinction between HGBL-11q and Burkitt lymphoma.","locator":"HGBL-11q section, line 361"},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0084","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["CLL/SLL"],"text":"For CLL/SLL transformation, WHO-HAEM5 recommends the term “Richter transformation” rather than “Richter Syndrome”.","locator":"CLL/SLL section, line 255"},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0085","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["SBLPN"],"text":"According to WHO-HAEM5, splenic B-cell lymphoma/leukaemia with prominent nucleoli (SBLPN) replaces and absorbs cases formerly classified as hairy cell leukaemia variant.","locator":"SBLPN section and Fig. 1, lines 259–265 and 275"},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0086","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["LPL"],"text":"According to WHO-HAEM5, lymphoplasmacytic lymphoma (LPL) has two subtypes: IgM LPL/Waldenström macroglobulinaemia type and non-WM type LPL; non-WM type LPL includes cases with IgG or IgA monoclonal proteins, non-secretory LPL, and IgM LPL without bone marrow involvement.","locator":"Lymphoplasmacytic lymphoma section, line 271"},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0087","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["paediatric MZL"],"text":"According to WHO-HAEM5, paediatric marginal zone lymphoma is a separate entity rather than a subtype of nodal marginal zone lymphoma.","locator":"Marginal zone lymphoma section, line 279"},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0088","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["primary cutaneous MZL"],"text":"According to WHO-HAEM5, primary cutaneous marginal zone lymphoma is a separate entity.","locator":"Marginal zone lymphoma section, line 279"},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0090","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["follicular lymphoma"],"text":"According to WHO-HAEM5, follicular large B-cell lymphoma largely corresponds to WHO-HAEM4R follicular lymphoma grade 3B.","locator":"Follicular lymphoma section, line 323"},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0091","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["follicular lymphoma"],"text":"According to WHO-HAEM5, follicular lymphoma with uncommon features comprises two subsets: blastoid or large-centrocyte cytology, and predominantly diffuse growth pattern.","locator":"Follicular lymphoma section, line 325"},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0092","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["primary large B-cell lymphoma of immune-privileged sites"],"text":"According to WHO-HAEM5, primary large B-cell lymphoma of immune-privileged sites is an umbrella entity combining primary large B-cell lymphomas of the CNS, vitreoretina, and testis in immunocompetent patients.","locator":"Large B-cell lymphoma section, line 363"},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0093","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":["B2M"],"diseases":["primary large B-cell lymphoma of immune-privileged sites"],"text":"In primary large B-cell lymphoma of immune-privileged sites, genetic inactivation of B2M, together with MHC class I/II inactivation and subsequent loss of protein expression, is a distinctive immune-evasion molecular feature.","locator":"Table 4, lines 367–381"},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0094","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["primary cutaneous gamma/delta T-cell lymphoma"],"text":"According to WHO-HAEM5, primary cutaneous gamma/delta T-cell lymphoma is listed as a separate entity rather than within the WHO-HAEM4R group “cutaneous peripheral T-cell lymphoma, rare subtypes”.","locator":"Primary cutaneous T-cell lymphoma section, lines 501–505"},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0095","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["primary cutaneous peripheral T-cell lymphoma, NOS"],"text":"According to WHO-HAEM5, primary cutaneous peripheral T-cell lymphoma, NOS is a new entity for rare primary cutaneous T-cell lymphoma cases that do not fit other recognized cutaneous T-cell lymphoma entities.","locator":"Primary cutaneous T-cell lymphoma section, lines 503–505"},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0096","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["indolent T-cell lymphoma of the gastrointestinal tract"],"text":"According to WHO-HAEM5, indolent T-cell lymphoproliferative disorder of the gastrointestinal tract is renamed indolent T-cell lymphoma of the gastrointestinal tract.","locator":"Intestinal T/NK-cell section, line 511"},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0097","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["indolent NK-cell lymphoproliferative disorder of the gastrointestinal tract"],"text":"According to WHO-HAEM5, indolent NK-cell lymphoproliferative disorder of the gastrointestinal tract is a new entity.","locator":"Intestinal T/NK-cell section, line 511"},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0098","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["breast implant-associated anaplastic large cell lymphoma"],"text":"According to WHO-HAEM5, breast implant-associated anaplastic large cell lymphoma is an entity distinct from other ALK-negative anaplastic large cell lymphoma.","locator":"Anaplastic large cell lymphoma section, line 637"},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0099","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["nodal TFH cell lymphoma, angioimmunoblastic-type"],"text":"According to WHO-HAEM5, angioimmunoblastic T-cell lymphoma is renamed nodal TFH cell lymphoma, angioimmunoblastic-type.","locator":"Nodal TFH lymphoma section, line 645"},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0100","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["nodal TFH cell lymphoma, follicular-type"],"text":"According to WHO-HAEM5, follicular T-cell lymphoma is renamed nodal TFH cell lymphoma, follicular-type.","locator":"Nodal TFH lymphoma section, line 645"},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0101","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["nodal TFH cell lymphoma, NOS"],"text":"According to WHO-HAEM5, peripheral T-cell lymphoma with TFH phenotype is renamed nodal TFH cell lymphoma, NOS.","locator":"Nodal TFH lymphoma section, line 645"},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0102","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["nodal TFH cell lymphoma, NOS"],"text":"According to WHO-HAEM5, nodal TFH cell lymphoma, NOS is recommended for CD4-positive lymphomas with a TFH phenotype that do not meet criteria for nodal TFH cell lymphoma, angioimmunoblastic-type or follicular-type.","locator":"Nodal TFH lymphoma section, line 651"},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0103","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["nodal TFH cell lymphoma","nodal TFH cell lymphoma, NOS"],"text":"On core biopsies, WHO-HAEM5 recommends the generic term nodal TFH cell lymphoma rather than nodal TFH cell lymphoma, NOS to reduce misclassification from inadequate sampling.","locator":"Nodal TFH lymphoma section, line 651"},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0104","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["peripheral T-cell lymphoma, NOS"],"text":"According to WHO-HAEM5, peripheral T-cell lymphoma, NOS remains a diagnosis of exclusion, with nodal TFH cell lymphoma among the important differential diagnoses.","locator":"Peripheral T-cell lymphoma section, line 655"},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0105","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["extranodal NK/T-cell lymphoma"],"text":"According to WHO-HAEM5, extranodal NK/T-cell lymphoma drops the former “nasal-type” qualifier because the disease can present at multiple extranodal sites.","locator":"Extranodal NK/T-cell lymphoma section, line 655"},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0107","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["CLL/SLL"],"text":"For differential diagnosis of CLL/SLL from other small B-cell lymphomas/leukaemias, WHO-HAEM5 identifies CD10, CD43, CD79b, CD81, CD200, and ROR1 as useful additional targets.","locator":"CLL/SLL section, line 211"},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0108","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["primary cutaneous CD8-positive aggressive epidermotropic cytotoxic T-cell lymphoma"],"text":"According to WHO-HAEM5, primary cutaneous CD8-positive aggressive epidermotropic cytotoxic T-cell lymphoma is listed as a separate entity rather than within the WHO-HAEM4R group “cutaneous peripheral T-cell lymphoma, rare subtypes”.","locator":"Primary cutaneous T-cell lymphoma section, line 503"},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0109","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["primary cutaneous acral CD8-positive lymphoproliferative disorder"],"text":"According to WHO-HAEM5, primary cutaneous acral CD8-positive lymphoproliferative disorder is listed as a separate entity rather than within the WHO-HAEM4R group “cutaneous peripheral T-cell lymphoma, rare subtypes”.","locator":"Primary cutaneous T-cell lymphoma section, line 503"},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0110","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["primary cutaneous CD4-positive small/medium T-cell lymphoproliferative disorder"],"text":"According to WHO-HAEM5, primary cutaneous CD4-positive small/medium T-cell lymphoproliferative disorder is listed as a separate entity rather than within the WHO-HAEM4R group “cutaneous peripheral T-cell lymphoma, rare subtypes”.","locator":"Primary cutaneous T-cell lymphoma section, line 503"},{"id":"arber-2022-blood-140-1200-C0001","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["CML"],"text":"According to the ICC, accelerated-phase CML is defined by any of the following: 10%-19% blasts in peripheral blood or bone marrow; peripheral-blood basophils >=20%; or a major-route additional clonal cytogenetic abnormality in Philadelphia-positive cells at diagnosis or acquired during treatment (second Philadelphia chromosome, trisomy 8, i(17q), trisomy 19, complex karyotype, or 3q26.2 abnormality).","locator":"Myeloproliferative neoplasms; CML; Table 2"},{"id":"arber-2022-blood-140-1200-C0002","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["CML"],"text":"According to the ICC, blast-phase CML is defined by >=20% blasts in peripheral blood or bone marrow or by myeloid sarcoma (extramedullary blast proliferation).","locator":"Myeloproliferative neoplasms; CML; Table 2"},{"id":"arber-2022-blood-140-1200-C0003","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["CML"],"text":"In CML, morphologically apparent lymphoblasts >5% warrant consideration of lymphoblastic crisis; immunophenotypic analysis is required to confirm lymphoid lineage.","locator":"Myeloproliferative neoplasms; CML; Table 2"},{"id":"arber-2022-blood-140-1200-C0004","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["JAK2"],"diseases":["PV"],"text":"According to the ICC, polycythemia vera requires either all 3 major criteria or the first 2 major criteria plus the minor criterion. Major criteria are: elevated hemoglobin (>16.5 g/dL in men or >16.0 g/dL in women), elevated hematocrit (>49% in men or >48% in women), or red-cell mass >25% above predicted; JAK2 V617F or JAK2 exon 12 mutation; and age-adjusted hypercellular marrow with trilineage proliferation (panmyelosis). The minor criterion is a subnormal serum erythropoietin level.","locator":"Myeloproliferative neoplasms; PV; Table 3"},{"id":"arber-2022-blood-140-1200-C0005","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["JAK2"],"diseases":["PV"],"text":"In patients with sustained absolute erythrocytosis (hemoglobin >18.5 g/dL in men or >16.5 g/dL in women and hematocrit >55.5% in men or >49.5% in women) plus JAK2 V617F or JAK2 exon 12 mutation, a bone marrow biopsy may not be required for polycythemia vera diagnosis.","locator":"Myeloproliferative neoplasms; PV; Table 3"},{"id":"arber-2022-blood-140-1200-C0006","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["JAK2"],"diseases":["PV"],"text":"In JAK2 exon 12-mutated polycythemia vera with isolated erythrocytosis and erythroid-predominant marrow, the usual panmyelosis diagnostic criterion may not apply.","locator":"Myeloproliferative neoplasms; MPN driver mutations"},{"id":"arber-2022-blood-140-1200-C0007","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["post-PV/post-ET MF"],"text":"According to the ICC, post-polycythemia vera myelofibrosis requires both required criteria—previous established polycythemia vera and bone-marrow fibrosis grade 2 or 3—plus at least 2 additional criteria: anemia or sustained loss of requirement for phlebotomy/cytoreductive treatment for erythrocytosis; leukoerythroblastosis; increased or newly palpable splenomegaly; or development of at least 2 of >10% weight loss in 6 months, night sweats, and unexplained fever >37.5°C.","locator":"Myeloproliferative neoplasms; post-ET myelofibrosis; Table 4"},{"id":"arber-2022-blood-140-1200-C0008","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["ABL1","BCR","CALR","JAK2","MPL"],"diseases":["ET"],"text":"According to the ICC, essential thrombocythemia requires all 4 major criteria or the first 3 major criteria plus the minor criterion. Major criteria are platelet count >=450 x 10^9/L; characteristic megakaryocytic-lineage proliferation with enlarged mature hyperlobulated megakaryocytes and no significant granulocytic/erythroid proliferation or relevant fibrosis; exclusion of BCR::ABL1-positive CML, polycythemia vera, primary myelofibrosis, and other myeloid neoplasms; and JAK2, CALR, or MPL mutation. The minor criterion is another clonal marker or absence of reactive thrombocytosis.","locator":"Myeloproliferative neoplasms; essential thrombocythemia; Table 4"},{"id":"arber-2022-blood-140-1200-C0009","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["ET"],"text":"Small dense megakaryocyte clusters can occur infrequently in essential thrombocythemia and therefore do not by themselves exclude that diagnosis.","locator":"Myeloproliferative neoplasms; essential thrombocythemia; Table 4"},{"id":"arber-2022-blood-140-1200-C0010","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["post-PV/post-ET MF"],"text":"According to the ICC, post-essential thrombocythemia myelofibrosis requires both required criteria—previous established essential thrombocythemia and bone-marrow fibrosis grade 2 or 3—plus at least 2 additional criteria: anemia with a >2 g/dL decrease from baseline hemoglobin; leukoerythroblastosis; increased or newly palpable splenomegaly; elevated LDH; or development of at least 2 of >10% weight loss in 6 months, night sweats, and unexplained fever >37.5°C.","locator":"Myeloproliferative neoplasms; post-ET myelofibrosis; Table 4"},{"id":"arber-2022-blood-140-1200-C0011","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["ABL1","BCR","CALR","JAK2","MPL"],"diseases":["PMF"],"text":"According to the ICC, pre-fibrotic/early primary myelofibrosis requires all 3 major criteria and at least 1 minor criterion confirmed on 2 consecutive determinations. Major criteria are characteristic megakaryocytic proliferation/atypia with marrow fibrosis <grade 2, increased age-adjusted cellularity, granulocytic proliferation and often decreased erythropoiesis; JAK2, CALR, or MPL mutation, another clonal marker, or absence of reactive reticulin fibrosis; and exclusion of BCR::ABL1-positive CML, polycythemia vera, essential thrombocythemia, MDS, and other myeloid neoplasms. Minor criteria are unexplained anemia, leukocytosis >=11 x 10^9/L, palpable splenomegaly, or elevated LDH.","locator":"Myeloproliferative neoplasms; primary myelofibrosis; Table 5"},{"id":"arber-2022-blood-140-1200-C0012","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["ABL1","BCR","CALR","JAK2","MPL"],"diseases":["PMF"],"text":"According to the ICC, overt primary myelofibrosis requires all 3 major criteria and at least 1 minor criterion confirmed on 2 consecutive determinations. Major criteria are megakaryocytic proliferation/atypia with reticulin and/or collagen fibrosis grade 2 or 3; JAK2, CALR, or MPL mutation, another clonal marker, or absence of reactive myelofibrosis; and exclusion of essential thrombocythemia, polycythemia vera, BCR::ABL1-positive CML, MDS, and other myeloid neoplasms. Minor criteria are unexplained anemia, leukocytosis >=11 x 10^9/L, palpable splenomegaly, elevated LDH, or leukoerythroblastosis.","locator":"Myeloproliferative neoplasms; primary myelofibrosis; Table 5"},{"id":"arber-2022-blood-140-1200-C0013","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["ASXL1","EZH2","IDH1","IDH2","SF3B1","SRSF2","TET2"],"diseases":["PMF"],"text":"In suspected primary myelofibrosis, detection of ASXL1, EZH2, IDH1, IDH2, SF3B1, SRSF2, or TET2 mutation can support the clonal nature of disease when canonical MPN-driver mutations are absent.","locator":"Myeloproliferative neoplasms; primary myelofibrosis; Table 5"},{"id":"arber-2022-blood-140-1200-C0014","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["PMF"],"text":"In primary myelofibrosis with monocytosis, a history of MPN excludes CMML, while a higher variant allele frequency of MPN-associated driver mutations supports PMF with monocytosis rather than CMML.","locator":"Myeloproliferative neoplasms; primary myelofibrosis; Table 5"},{"id":"arber-2022-blood-140-1200-C0015","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["ABL1","BCR","CSF3R"],"diseases":["CNL"],"text":"According to the ICC, chronic neutrophilic leukemia requires neutrophilic leukocytosis with segmented/band neutrophils >=80%, neutrophil precursors <10%, monocytes <10%, no significant dysgranulopoiesis, and hypercellular marrow with increased normally maturing neutrophil granulocytes; exclusion of BCR::ABL1-positive CML, polycythemia vera, essential thrombocythemia, primary myelofibrosis, and myeloid/lymphoid neoplasms with eosinophilia and TK fusions; and either CSF3R T618I/another activating CSF3R mutation or, if CSF3R is absent, persistent neutrophilia for >=3 months with splenomegaly and no reactive cause (with myeloid clonality demonstrated if a plasma-cell neoplasm is present). The WBC threshold is >=13 x 10^9/L with an activating CSF3R mutation and >=25 x 10^9/L without one; absence of CSF3R does not exclude CNL.","locator":"Myeloproliferative neoplasms; chronic neutrophilic leukemia; Table 6"},{"id":"arber-2022-blood-140-1200-C0016","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["CNL"],"text":"Significant monocytosis, basophilia, eosinophilia, or dysgranulopoiesis should prompt critical review of a proposed chronic neutrophilic leukemia diagnosis.","locator":"Myeloproliferative neoplasms; chronic neutrophilic leukemia; Table 6"},{"id":"arber-2022-blood-140-1200-C0017","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["CNL"],"text":"In chronic neutrophilic leukemia, 10%-19% blasts in peripheral blood or bone marrow represents accelerated phase, whereas >=20% blasts represents blast phase.","locator":"Myeloproliferative neoplasms; chronic neutrophilic leukemia; Table 6"},{"id":"arber-2022-blood-140-1200-C0018","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["ABL1","BCR","FGFR1","FLT3","JAK2","PDGFRA","PDGFRB"],"diseases":["CEL"],"text":"According to the ICC, chronic eosinophilic leukemia, NOS requires all 6 criteria: peripheral-blood eosinophils >=1.5 x 10^9/L and >=10% of leukocytes; <20% blasts in blood and marrow without another AML-defining recurrent genetic abnormality; absence of BCR::ABL1 and other ABL1, PDGFRA, PDGFRB, FGFR1, JAK2, or FLT3 TK fusions; failure to meet criteria for another well-defined MPN, CMML, or systemic mastocytosis; characteristic marrow abnormalities or increased blasts (>=5% marrow and/or >=2% blood); and a clonal cytogenetic abnormality and/or somatic mutation. If clonality or increased blasts are absent, supportive marrow findings can suffice when persistent eosinophilia is present and other causes are excluded.","locator":"Myeloproliferative neoplasms; chronic eosinophilic leukemia, NOS; Table 7"},{"id":"arber-2022-blood-140-1200-C0020","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["ABL1","BCR","CALR","JAK2","MPL"],"diseases":["MPN-U"],"text":"According to the ICC, myeloproliferative neoplasm, unclassifiable (MPN-U) requires all 3 criteria: clinical and hematologic features of an MPN (with reactive causes excluded if marrow fibrosis is present); JAK2, CALR, or MPL mutation or another clonal marker; and failure to meet criteria for another MPN, MDS, MDS/MPN, or BCR::ABL1-positive CML.","locator":"Myeloproliferative neoplasms; MPN-unclassifiable; Table 9"},{"id":"arber-2022-blood-140-1200-C0021","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["MPN-U"],"text":"Myeloproliferative neoplasm, unclassifiable (MPN-U) is an appropriate ICC category for very early-phase MPN lacking fully developed subtype criteria or for splanchnic/portal-vein thrombosis with MPN features that do not meet a specific MPN subtype.","locator":"Myeloproliferative neoplasms; MPN-unclassifiable; Table 9"},{"id":"arber-2022-blood-140-1200-C0022","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["ASXL1","EZH2","IDH1","IDH2","SF3B1","SRSF2","TET2"],"diseases":["MPN-U"],"text":"In myeloproliferative neoplasm, unclassifiable (MPN-U), ASXL1, EZH2, IDH1, IDH2, SF3B1, SRSF2, or TET2 mutations detected by sensitive molecular methods can support the clonal nature of disease.","locator":"Myeloproliferative neoplasms; MPN-unclassifiable; Table 9"},{"id":"arber-2022-blood-140-1200-C0023","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["ETV6","FIP1L1","PDGFRA","PDGFRB"],"diseases":["myeloid/lymphoid neoplasm with eosinophilia and TK fusion"],"text":"The ICC recognizes PDGFRA-rearranged and PDGFRB-rearranged disease within the category of myeloid/lymphoid neoplasms with eosinophilia and tyrosine kinase gene fusions, most commonly FIP1L1::PDGFRA and ETV6::PDGFRB respectively.","locator":"Myeloid/lymphoid neoplasms with eosinophilia and tyrosine kinase gene fusions; Table 10"},{"id":"arber-2022-blood-140-1200-C0024","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["FGFR1"],"diseases":["myeloid/lymphoid neoplasm with eosinophilia and TK fusion"],"text":"The ICC recognizes myeloid/lymphoid neoplasm with eosinophilia and tyrosine kinase gene fusion involving FGFR1, most commonly ZMYM2::FGFR1.","locator":"Myeloid/lymphoid neoplasms with eosinophilia and tyrosine kinase gene fusions; Table 10"},{"id":"arber-2022-blood-140-1200-C0025","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["JAK2","PCM1"],"diseases":["myeloid/lymphoid neoplasm with eosinophilia and TK fusion"],"text":"The ICC recognizes PCM1::JAK2-rearranged myeloid/lymphoid neoplasm with eosinophilia and tyrosine kinase gene fusion as a formal member of this category.","locator":"Myeloid/lymphoid neoplasms with eosinophilia and tyrosine kinase gene fusions; Table 10"},{"id":"arber-2022-blood-140-1200-C0026","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["BCR","ETV6","JAK2","PCM1"],"diseases":["myeloid/lymphoid neoplasm with eosinophilia and TK fusion"],"text":"ETV6::JAK2 and BCR::JAK2 neoplasms are considered genetic variants of PCM1::JAK2 myeloid/lymphoid neoplasm with eosinophilia and tyrosine kinase gene fusion in the ICC.","locator":"Myeloid/lymphoid neoplasms with eosinophilia and tyrosine kinase gene fusions; Table 10"},{"id":"arber-2022-blood-140-1200-C0027","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["ETV6","FLT3"],"diseases":["myeloid/lymphoid neoplasm with eosinophilia and TK fusion"],"text":"The ICC recognizes FLT3-rearranged myeloid/lymphoid neoplasm with eosinophilia and tyrosine kinase gene fusion, most commonly ETV6::FLT3.","locator":"Myeloid/lymphoid neoplasms with eosinophilia and tyrosine kinase gene fusions; Table 10"},{"id":"arber-2022-blood-140-1200-C0028","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["ABL1","ETV6"],"diseases":["myeloid/lymphoid neoplasm with eosinophilia and TK fusion"],"text":"The ICC recognizes ETV6::ABL1-rearranged myeloid/lymphoid neoplasm with eosinophilia and tyrosine kinase gene fusion.","locator":"Myeloid/lymphoid neoplasms with eosinophilia and tyrosine kinase gene fusions; Table 10"},{"id":"arber-2022-blood-140-1200-C0029","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["ABL1","BCR"],"diseases":["myeloid/lymphoid neoplasm with eosinophilia and TK fusion"],"text":"When acute lymphoblastic leukemia carries a tyrosine-kinase fusion, involvement of background myeloid cells supports classification as myeloid/lymphoid neoplasm with eosinophilia and tyrosine kinase gene fusion rather than lymphoid-restricted BCR::ABL1-like B-ALL or de novo T-ALL.","locator":"Myeloid/lymphoid neoplasms with eosinophilia and tyrosine kinase gene fusions; Table 10"},{"id":"arber-2022-blood-140-1200-C0030","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["mastocytosis"],"text":"The ICC classifies mastocytosis into cutaneous mastocytosis, generally skin-confined, and systemic mastocytosis, defined by extracutaneous involvement with or without skin disease.","locator":"Mastocytosis; Table 11"},{"id":"arber-2022-blood-140-1200-C0031","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["mastocytosis"],"text":"The ICC recognizes five systemic mastocytosis subtypes: indolent, smoldering, aggressive, mast cell leukemia, and systemic mastocytosis with an associated myeloid neoplasm.","locator":"Mastocytosis; Table 11"},{"id":"arber-2022-blood-140-1200-C0032","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["mastocytosis"],"text":"Bone-marrow mastocytosis is described as an indolent systemic mastocytosis variant characterized by limited bone-marrow infiltration, no skin lesions, and normal or slightly elevated serum tryptase levels.","locator":"Mastocytosis; Table 11"},{"id":"arber-2022-blood-140-1200-C0033","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["KIT"],"diseases":["mastocytosis"],"text":"According to the ICC, systemic mastocytosis is established by the major criterion—multifocal dense aggregates of >=15 tryptase- and/or CD117-positive mast cells in marrow and/or another extracutaneous organ—or, when the major criterion is absent, by at least 3 of 4 minor criteria: >25% spindle-shaped/atypical immature mast cells; mast-cell expression of CD25, CD2, and/or CD30; KIT D816V or another activating KIT mutation; and persistent serum tryptase >20 ng/mL (not counted in SM with an associated myeloid neoplasm). A TK fusion associated with myeloid/lymphoid neoplasm with eosinophilia excludes systemic mastocytosis.","locator":"Mastocytosis; Table 11"},{"id":"arber-2022-blood-140-1200-C0034","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["mastocytosis"],"text":"In systemic mastocytosis, mast cell leukemia is defined by atypical immature mast cells accounting for >=20% of bone marrow cellularity, with provision for diagnosis when the aspirate is a dry tap or otherwise suboptimal.","locator":"Mastocytosis; mast cell leukemia"},{"id":"arber-2022-blood-140-1200-C0035","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["mastocytosis"],"text":"In systemic mastocytosis, the amount of circulating mast cells does not justify a separate leukemic versus aleukemic mast cell leukemia subcategory in the ICC.","locator":"Mastocytosis; mast cell leukemia"},{"id":"arber-2022-blood-140-1200-C0036","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["KIT"],"diseases":["mastocytosis"],"text":"Rare cases of systemic mastocytosis can show mature, round, well-granulated mast cells; these cases typically lack KIT D816V and are often CD25-negative, CD2-negative, and CD30-positive, with variable serum tryptase.","locator":"Mastocytosis; mast cell leukemia"},{"id":"arber-2022-blood-140-1200-C0037","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["mastocytosis"],"text":"According to the ICC, systemic mastocytosis with an associated myeloid neoplasm requires meeting diagnostic criteria for systemic mastocytosis and for an associated myeloid neoplasm, with the associated neoplasm fully classified.","locator":"Mastocytosis; systemic mastocytosis with associated myeloid neoplasm; Table 12"},{"id":"arber-2022-blood-140-1200-C0038","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["KIT"],"diseases":["mastocytosis"],"text":"Monocytosis, eosinophilia, splenomegaly, elevated LDH, high KIT D816V variant allele frequency, and additional myeloid-malignancy mutations, particularly in combination, can raise suspicion for an associated myeloid neoplasm in systemic mastocytosis.","locator":"Mastocytosis; systemic mastocytosis with associated myeloid neoplasm; Table 12"},{"id":"arber-2022-blood-140-1200-C0039","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["KIT"],"diseases":["mastocytosis"],"text":"In rare systemic mastocytosis cases with both a KIT mutation and a myeloid/lymphoid-neoplasm tyrosine-kinase fusion, the ICC recommends assigning the fusion-defined myeloid/lymphoid neoplasm as the associated myeloid neoplasm only when both abnormalities are present.","locator":"Mastocytosis; systemic mastocytosis with associated myeloid neoplasm; Table 12 footnote"},{"id":"arber-2022-blood-140-1200-C0040","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["MDS/MPN"],"text":"According to the ICC, cytopenia together with cytosis is a key characteristic of MDS/MPN; cytopenia thresholds are hemoglobin <13 g/dL in males or <12 g/dL in females, ANC <1.8 x 10^9/L, or platelets <150 x 10^9/L.","locator":"MDS/MPN; general criteria"},{"id":"arber-2022-blood-140-1200-C0041","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["ABL1","BCR"],"diseases":["CMML"],"text":"According to the ICC, CMML requires persistent monocytosis (absolute monocytes >=0.5 x 10^9/L and >=10% of WBCs), cytopenia using MDS thresholds except that some early cases may have borderline/no cytopenia, <20% blasts including promonocytes in blood and marrow, marrow morphology consistent with CMML, and absence of BCR::ABL1 or TK-fusion myeloid/lymphoid neoplasms. Clonality is established by abnormal cytogenetics and/or a myeloid-neoplasm-associated mutation with allele frequency >=10%; without demonstrable clonality, monocytes must be >=1.0 x 10^9/L and >10% of WBCs together with increased blasts, morphologic dysplasia, or an abnormal CMML immunophenotype.","locator":"MDS/MPN; CMML; Table 13"},{"id":"arber-2022-blood-140-1200-C0042","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["CMML"],"text":"According to the ICC, CMML uses a 2-tier blast classification: CMML-1 has <5% blasts in peripheral blood and <10% in bone marrow; CMML-2 has 5%-19% blasts in blood, 10%-19% in marrow, or Auer rods. The former CMML-0 category is eliminated.","locator":"MDS/MPN; CMML"},{"id":"arber-2022-blood-140-1200-C0043","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["NPM1"],"diseases":["CMML"],"text":"Development of an NPM1 mutation in established CMML should be noted but does not by itself define de novo AML.","locator":"MDS/MPN; CMML; Table 13"},{"id":"arber-2022-blood-140-1200-C0044","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["CMML"],"text":"The ICC myeloproliferative subtype of CMML (CMML-MP) is defined by WBC >13 x 10^9/L.","locator":"MDS/MPN; CMML; Table 13"},{"id":"arber-2022-blood-140-1200-C0046","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["ABL1","ASXL1","BCR","CALR","JAK2","MPL","SETBP1"],"diseases":["aCML"],"text":"According to the ICC, atypical chronic myeloid leukemia (aCML) requires WBC >=13 x 10^9/L due to neutrophils and precursors with promyelocytes/myelocytes/metamyelocytes >=10%; cytopenia using MDS thresholds; <20% blasts; prominent dysgranulopoiesis; monocytes <10% and eosinophils <10% of leukocytes; hypercellular marrow with granulocytic proliferation/dysplasia; and absence of BCR::ABL1 and TK-fusion myeloid/lymphoid neoplasms. Absence of JAK2, CALR, and MPL supports the diagnosis, and SETBP1 mutation, often with ASXL1, provides additional support.","locator":"MDS/MPN; atypical chronic myeloid leukemia; diagnostic criteria"},{"id":"arber-2022-blood-140-1200-C0047","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["CALR","JAK2","MPL"],"diseases":["aCML"],"text":"A history of MPN and/or JAK2, CALR, or MPL mutation tends to exclude atypical chronic myeloid leukemia (aCML).","locator":"MDS/MPN; atypical chronic myeloid leukemia; diagnostic criteria"},{"id":"arber-2022-blood-140-1200-C0048","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["CSF3R"],"diseases":["aCML","CNL"],"text":"Detection of a CSF3R mutation in suspected atypical chronic myeloid leukemia (aCML) should prompt careful morphologic review to exclude chronic neutrophilic leukemia.","locator":"MDS/MPN; atypical chronic myeloid leukemia; diagnostic criteria"},{"id":"arber-2022-blood-140-1200-C0049","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["ABL1","BCR","CALR","JAK2","MPL","SF3B1"],"diseases":["MDS/MPN-SF3B1-T"],"text":"According to the ICC, MDS/MPN with SF3B1 mutation and thrombocytosis requires thrombocytosis >=450 x 10^9/L and anemia present at initial diagnosis, <1% blood blasts and <5% marrow blasts, and SF3B1 mutation with VAF >10%; no recent cytotoxic/growth-factor therapy explaining the phenotype; no prior MPN, MDS, or other MDS/MPN; and absence of BCR::ABL1, TK-fusion myeloid/lymphoid neoplasms, t(3;3), inv(3), and del(5q) meeting MDS-del(5q) criteria. Ring sideroblasts are not required when SF3B1 VAF is >10%; JAK2 V617F, CALR, or MPL W515 co-mutation is not required but supports the diagnosis.","locator":"MDS/MPN; MDS/MPN with SF3B1 mutation and thrombocytosis; Table 16"},{"id":"arber-2022-blood-140-1200-C0050","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["ABL1","BCR","SF3B1"],"diseases":["MDS/MPN-SF3B1-T"],"text":"According to the ICC, MDS/MPN with ring sideroblasts and thrombocytosis, NOS requires thrombocytosis >=450 x 10^9/L and anemia present at initial diagnosis, erythroid dysplasia with >=15% ring sideroblasts, <1% blood blasts and <5% marrow blasts, and clonality by cytogenetic abnormality and/or somatic mutation (or, if clonality is absent, no recent cytotoxic/growth-factor therapy explaining the phenotype); no prior MPN, MDS, or other MDS/MPN; and absence of SF3B1 mutation, BCR::ABL1, TK-fusion myeloid/lymphoid neoplasms, t(3;3), inv(3), and del(5q) meeting MDS-del(5q) criteria.","locator":"MDS/MPN; MDS/MPN with ring sideroblasts and thrombocytosis, NOS; Table 17"},{"id":"arber-2022-blood-140-1200-C0051","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["SF3B1"],"diseases":["MDS"],"text":"MDS with SF3B1 mutation that later develops thrombocytosis is classified as thrombocytotic progression of MDS-SF3B1 rather than MDS/MPN with thrombocytosis.","locator":"MDS/MPN; MDS/MPN with ring sideroblasts and thrombocytosis, NOS; Table 17"},{"id":"arber-2022-blood-140-1200-C0052","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["ABL1","BCR"],"diseases":["MDS/MPN-U"],"text":"According to
