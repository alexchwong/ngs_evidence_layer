PML::RARA qPCR row"},{"id":"cloos-2026-blood-147-1147-C0127","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["RUNX1","RUNX1T1","CBFB","MYH11"],"diseases":["AML"],"text":"According to ELN-DAVID 2025, an end-of-treatment qPCR warning response in RUNX1::RUNX1T1- or CBFB::MYH11-positive core-binding-factor acute myeloid leukemia should prompt repeat MRD assessment after about 4 weeks.","locator":"Table 5, CBF-AML EOT warning row and footnote ‡"},{"id":"cloos-2026-blood-147-1147-C0128","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["FLT3"],"diseases":["AML"],"text":"According to ELN-DAVID 2025, when multiple FLT3-ITD clones are present in UHS-NGS MRD testing for acute myeloid leukemia, the VAF and sequence of each FLT3-ITD clone should be reported.","locator":"Table 3 recommendation C8; section C2 NGS-based MRD assessment"},{"id":"d-hner-2022-blood-140-1345-C0001","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"guideline criterion","genes":["PML","RARA","RUNX1","RUNX1T1","CBFB","MYH11","MLLT3","KMT2A","DEK","NUP214","GATA2","MECOM","NPM1","CEBPA","BCR","ABL1"],"diseases":["AML"],"text":"Under the 2022 International Consensus Classification (ICC), PML::RARA, RUNX1::RUNX1T1, CBFB::MYH11, MLLT3::KMT2A, DEK::NUP214, inv(3)/t(3;3) involving GATA2 and MECOM, mutated NPM1, and in-frame bZIP CEBPA mutations are AML-defining recurrent abnormalities at ≥10% blasts; BCR::ABL1 requires ≥20% blasts because of overlap with chronic myeloid leukemia.","locator":"AML classification — Changes to the blast thresholds defining AML; Table 1; Figure 1"},{"id":"d-hner-2022-blood-140-1345-C0002","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"guideline criterion","genes":["IRF2BP2","RARA","NPM1","ZBTB16","STAT5B","STAT3","TBL1XR1","FIP1L1","BCOR","BCR","ABL1"],"diseases":["AML","APL"],"text":"Under the 2022 ICC, IRF2BP2::RARA, NPM1::RARA, ZBTB16::RARA, STAT5B::RARA, STAT3::RARA, TBL1XR1::RARA, FIP1L1::RARA, and BCOR::RARA are recognized recurring RARA-rearranged APL entities and, as AML-defining recurrent abnormalities other than BCR::ABL1, establish AML/APL at ≥10% blasts.","locator":"Table 1 footnote † — other recurring RARA translocations; AML classification — Changes to the blast thresholds defining AML; Table 1; Figure 1"},{"id":"d-hner-2022-blood-140-1345-C0003","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"guideline criterion","genes":["AFF1","KMT2A","AFDN","MLLT10","TET1","ELL","MLLT1"],"diseases":["AML"],"text":"Under the 2022 ICC, AFF1::KMT2A, AFDN::KMT2A, MLLT10::KMT2A, TET1::KMT2A, KMT2A::ELL, and KMT2A::MLLT1 are recognized recurring KMT2A-rearranged AML entities and establish AML at ≥10% blasts.","locator":"Table 1 footnote ‡ — other recurring KMT2A translocations; AML classification — Changes to the blast thresholds defining AML; Table 1; Figure 1"},{"id":"d-hner-2022-blood-140-1345-C0004","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"guideline criterion","genes":["MECOM","MYC","ETV6","RUNX1"],"diseases":["AML"],"text":"Under the 2022 ICC, t(2;3) involving MECOM, MYC/MECOM t(3;8), ETV6::MECOM, and MECOM::RUNX1 are recognized recurring MECOM-rearranged AML entities and establish AML at ≥10% blasts.","locator":"Table 1 footnote § — other recurring MECOM translocations; AML classification — Changes to the blast thresholds defining AML; Table 1; Figure 1"},{"id":"d-hner-2022-blood-140-1345-C0005","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"guideline criterion","genes":["PRDM16","RPN1","RBM15","MRTFA","NPM1","MLF1","NUP98","NSD1","ETV6","MNX1","KAT6A","CREBBP","PICALM","MLLT10","KMD5A","FUS","ERG","RUNX1","CBFA2T3","GLIS2"],"diseases":["AML"],"text":"Under the 2022 ICC, PRDM16::RPN1, RBM15::MRTFA, NPM1::MLF1, NUP98::NSD1, ETV6::MNX1, KAT6A::CREBBP, PICALM::MLLT10, NUP98::KMD5A, FUS::ERG, RUNX1::CBFA2T3, CBFA2T3::GLIS2, and other NUP98 rearrangements are listed as rare recurring AML-defining genetic entities and establish AML at ≥10% blasts.","locator":"Table 1 footnote jj — other rare recurring translocations; AML classification — Changes to the blast thresholds defining AML; Table 1; Figure 1"},{"id":"d-hner-2022-blood-140-1345-C0006","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"guideline criterion","genes":["TP53"],"diseases":["AML","MDS/AML"],"text":"Under the 2022 ICC, when higher-priority recurrent AML-defining abnormalities are absent, a pathogenic somatic TP53 mutation with variant allele fraction ≥10%, with or without loss of the wild-type allele, defines TP53-mutated AML at ≥20% blasts; the corresponding 10%-19% blast category is MDS/AML.","locator":"AML classification — AML with mutated TP53; Table 1; Figure 1; Table 1; Figure 1; AML classification — remaining AML cases"},{"id":"d-hner-2022-blood-140-1345-C0007","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"guideline criterion","genes":["TP53","ASXL1","BCOR","EZH2","RUNX1","SF3B1","SRSF2","STAG2","U2AF1","ZRSR2"],"diseases":["AML","MDS","MDS/AML"],"text":"Under the 2022 ICC, when higher-priority recurrent AML-defining abnormalities and TP53-mutated disease are absent, pathogenic mutations in ASXL1, BCOR, EZH2, RUNX1, SF3B1, SRSF2, STAG2, U2AF1, or ZRSR2 define AML with myelodysplasia-related gene mutations at ≥20% blasts, irrespective of prior MDS; the corresponding 10%-19% blast category is MDS/AML.","locator":"AML classification — AML with myelodysplasia-related gene mutations; Table 1; Figure 1; Table 1; Figure 1; AML classification — remaining AML cases"},{"id":"d-hner-2022-blood-140-1345-C0008","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["AML","MDS/AML"],"text":"Under the 2022 ICC, when higher-priority AML-defining categories are absent, del(5q)/t(5q)/add(5q), monosomy 7/del(7q), trisomy 8, del(12p)/t(12p)/add(12p), i(17q), monosomy 17/add(17p)/del(17p), del(20q), idic(X)(q13), or a complex karyotype of ≥3 unrelated chromosome abnormalities (excluding hyperdiploid karyotypes with ≥3 trisomies/polysomies and no structural abnormality) defines AML with myelodysplasia-related cytogenetic abnormality at ≥20% blasts and MDS/AML at 10%-19% blasts.","locator":"Table 1 footnote ** — AML with myelodysplasia-related cytogenetic abnormalities; Table 1; Figure 1; AML classification — remaining AML cases"},{"id":"d-hner-2022-blood-140-1345-C0009","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["AML"],"text":"Under the 2022 ICC, prior chemotherapy, radiotherapy, or immune intervention for a nonmyeloid neoplasm is recorded as a therapy-related diagnostic qualifier to the genetically defined AML category rather than as a separate AML entity.","locator":"AML classification — Antecedent AML history; Table 1"},{"id":"d-hner-2022-blood-140-1345-C0010","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["AML","MDS"],"text":"Under the 2022 ICC, a prior MDS is appended as a diagnostic qualifier to the AML category only when it was established by standard diagnostics more than 3 months before AML diagnosis.","locator":"AML classification — Antecedent AML history; Table 1"},{"id":"d-hner-2022-blood-140-1345-C0011","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"guideline criterion","genes":["TP53"],"diseases":["AML"],"text":"Under the 2022 ICC, the AML classification hierarchy is: recurrent AML-defining genetic abnormality first; otherwise TP53-mutated AML; otherwise AML with myelodysplasia-related gene mutations; otherwise AML with myelodysplasia-related cytogenetic abnormalities.","locator":"Figure 1 — hierarchical classification of AML; AML classification — hierarchy; Figure 1"},{"id":"d-hner-2022-blood-140-1345-C0012","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["MDS/MPN","CMML"],"text":"Under the 2022 ICC, for a patient with a prior MDS/MPN such as CMML, the MDS/MPN diagnosis is retained until blasts or blast equivalents reach ≥20%.","locator":"Figure 1 legend"},{"id":"d-hner-2022-blood-140-1345-C0013","paper":"d-hner-2022-blood-140-1345","category":"prognosis","tier":"guideline criterion","genes":["RUNX1","RUNX1T1","CBFB","MYH11","KIT","FLT3"],"diseases":["AML"],"text":"Under the 2022 ELN genetic risk classification, which is based mainly on intensively treated patients, RUNX1::RUNX1T1 and CBFB::MYH11 core-binding-factor AML are classified as favorable risk, and concurrent KIT and/or FLT3 mutation does not change that category.","locator":"2022 European LeukemiaNet genetic risk classification at diagnosis; Table 6"},{"id":"d-hner-2022-blood-140-1345-C0014","paper":"d-hner-2022-blood-140-1345","category":"prognosis","tier":"guideline criterion","genes":["NPM1","FLT3"],"diseases":["AML"],"text":"Under the 2022 ELN genetic risk classification, which is based mainly on intensively treated patients, NPM1-mutated AML without FLT3-ITD is classified as favorable risk unless adverse-risk cytogenetic abnormalities are present.","locator":"2022 European LeukemiaNet genetic risk classification at diagnosis; Table 6"},{"id":"d-hner-2022-blood-140-1345-C0015","paper":"d-hner-2022-blood-140-1345","category":"prognosis","tier":"guideline criterion","genes":["CEBPA"],"diseases":["AML"],"text":"Under the 2022 ELN genetic risk classification, which is based mainly on intensively treated patients, in-frame bZIP CEBPA-mutated AML is classified as favorable risk whether the CEBPA mutation is monoallelic or biallelic.","locator":"2022 European LeukemiaNet genetic risk classification at diagnosis; Table 6"},{"id":"d-hner-2022-blood-140-1345-C0016","paper":"d-hner-2022-blood-140-1345","category":"prognosis","tier":"guideline criterion","genes":["NPM1","FLT3"],"diseases":["AML"],"text": h is based mainly on intensively treated patients, AML with other t(3q26.2;v) MECOM rearrangements is classified as adverse risk.","locator":"2022 European LeukemiaNet genetic risk classification at diagnosis; Table 6"},{"id":"d-hner-2022-blood-140-1345-C0025","paper":"d-hner-2022-blood-140-1345","category":"prognosis","tier":"guideline criterion","genes":["ASXL1","BCOR","EZH2","RUNX1","SF3B1","SRSF2","STAG2","U2AF1","ZRSR2"],"diseases":["AML"],"text":"Under the 2022 ELN genetic risk classification, which is based mainly on intensively treated patients, pathogenic ASXL1, BCOR, EZH2, RUNX1, SF3B1, SRSF2, STAG2, U2AF1, or ZRSR2 mutations are adverse-risk markers in AML, including de novo AML, but should not currently be used as adverse-risk markers when they co-occur with a favorable-risk AML subtype.","locator":"2022 European LeukemiaNet genetic risk classification at diagnosis; Table 6"},{"id":"d-hner-2022-blood-140-1345-C0026","paper":"d-hner-2022-blood-140-1345","category":"prognosis","tier":"guideline criterion","genes":["TP53"],"diseases":["AML"],"text":"Under the 2022 ELN genetic risk classification, which is based mainly on intensively treated patients, TP53 mutation with variant allele fraction ≥10% is an adverse-risk marker in AML irrespective of monoallelic or biallelic status.","locator":"2022 European LeukemiaNet genetic risk classification at diagnosis; Table 6"},{"id":"d-hner-2022-blood-140-1345-C0028","paper":"d-hner-2022-blood-140-1345","category":"prognosis","tier":"guideline criterion","genes":["NPM1"],"diseases":["AML"],"text":"Under the 2022 ELN genetic risk classification, which is based mainly on intensively treated patients, NPM1-mutated AML with adverse-risk cytogenetic abnormalities is classified as adverse risk.","locator":"2022 European LeukemiaNet genetic risk classification at diagnosis; Table 6"},{"id":"d-hner-2022-blood-140-1345-C0029","paper":"d-hner-2022-blood-140-1345","category":"prognosis","tier":"guideline criterion","genes":["IDH1","IDH2","DNMT3A"],"diseases":["AML"],"text":"The 2022 ELN genetic risk classification, which is based mainly on intensively treated patients, does not assign IDH1-, IDH2-, or DNMT3A-mutated AML to a distinct risk group on the available evidence.","locator":"2022 European LeukemiaNet genetic risk classification at diagnosis; Table 6"},{"id":"d-hner-2022-blood-140-1345-C0032","paper":"d-hner-2022-blood-140-1345","category":"biomarker","tier":"guideline criterion","genes":["FLT3"],"diseases":["AML"],"text":"The 2022 ELN recommendations recommend testing for both FLT3 internal tandem duplications and FLT3 tyrosine-kinase-domain mutations at AML diagnosis.","locator":"Diagnostic procedures — Cytogenetic and molecular studies; Table 4 footnote ¶"},{"id":"d-hner-2022-blood-140-1345-C0033","paper":"d-hner-2022-blood-140-1345","category":"biomarker","tier":"guideline criterion","genes":["CEBPA"],"diseases":["AML"],"text":"The 2022 ELN recommendations specify that CEBPA testing in AML should report whether a variant is an in-frame bZIP-region mutation because that molecular definition is used for favorable-risk classification.","locator":"Table 4 footnote #"},{"id":"d-hner-2022-blood-140-1345-C0034","paper":"d-hner-2022-blood-140-1345","category":"biomarker","tier":"guideline criterion","genes":["NPM1","RUNX1","RUNX1T1","CBFB","MYH11"],"diseases":["AML"],"text":"Under the ELN MRD framework incorporated into the 2022 AML recommendations, baseline qPCR or dPCR assessment is recommended in NPM1-mutated, RUNX1::RUNX1T1, and CBFB::MYH11 AML to establish a molecular baseline for subsequent MRD monitoring.","locator":"Diagnostic procedures — Cytogenetic and molecular studies"},{"id":"d-hner-2022-blood-140-1345-C0035","paper":"d-hner-2022-blood-140-1345","category":"biomarker","tier":"guideline criterion","genes":["NPM1","RUNX1","RUNX1T1","CBFB","MYH11"],"diseases":["AML"],"text":"Under the ELN MRD framework incorporated into the 2022 AML recommendations, mutated NPM1, RUNX1::RUNX1T1, and CBFB::MYH11 are robustly validated qPCR targets for molecular MRD monitoring in AML.","locator":"Monitoring of measurable residual disease — Molecular MRD; Table 7"},{"id":"d-hner-2022-blood-140-1345-C0036","paper":"d-hner-2022-blood-140-1345","category":"biomarker","tier":"guideline criterion","genes":["KMT2A","MLLT3","DEK","NUP214","BCR","ABL1","WT1","NPM1"],"diseases":["AML"],"text":"Under the ELN MRD framework incorporated into the 2022 AML recommendations, KMT2A::MLLT3, DEK::NUP214, BCR::ABL1, and WT1 expression can be used as qPCR MRD targets in AML but are less well validated for this role than NPM1 and the core-binding-factor fusion targets.","locator":"Monitoring of measurable residual disease — Molecular MRD; Table 7"},{"id":"d-hner-2022-blood-140-1345-C0037","paper":"d-hner-2022-blood-140-1345","category":"biomarker","tier":"guideline criterion","genes":["DNMT3A","TET2","ASXL1"],"diseases":["AML"],"text":"Under the ELN MRD framework incorporated into the 2022 AML recommendations, DNMT3A, TET2, and ASXL1 mutations consistent with premalignant clonal hematopoiesis should not be interpreted as AML MRD in NGS-based assessment.","locator":"Monitoring of measurable residual disease — Molecular MRD; Table 7 footnote ‡"},{"id":"d-hner-2022-blood-140-1345-C0038","paper":"d-hner-2022-blood-140-1345","category":"biomarker","tier":"guideline criterion","genes":["NPM1","RUNX1","RUNX1T1","CBFB","MYH11"],"diseases":["AML"],"text":"Under the ELN MRD framework incorporated into the 2022 AML recommendations, molecular MRD relapse in NPM1-mutated, RUNX1::RUNX1T1, or CBFB::MYH11 AML assessed by qPCR is defined as conversion from MRD-negative to MRD-positive or a ≥1 log10 rise between two positive samples and should be rapidly confirmed in a second consecutive sample from the same tissue source.","locator":"Table 8 — MRD relapse; Figure 2"},{"id":"d-hner-2022-blood-140-1345-C0039","paper":"d-hner-2022-blood-140-1345","category":"biomarker","tier":"guideline criterion","genes":["NPM1","RUNX1","RUNX1T1","CBFB","MYH11"],"diseases":["AML"],"text":"Under the ELN MRD framework incorporated into the 2022 AML recommendations, after consolidation in NPM1-mutated, RUNX1::RUNX1T1, or CBFB::MYH11 AML, qPCR MRD ≥2% or failure to achieve a 3-4 log transcript reduction is a clinically relevant threshold at which treatment modification, including consideration of allogeneic HCT, may be appropriate.","locator":"Figure 2 — Algorithm of MRD assessment"},{"id":"d-hner-2022-blood-140-1345-C0040","paper":"d-hner-2022-blood-140-1345","category":"biomarker","tier":"guideline criterion","genes":["IDH1","IDH2","FLT3"],"diseases":["AML"],"text":"The 2022 ELN recommendations recommend molecular reassessment at AML relapse for IDH1, IDH2, and FLT3 because actionable abnormalities can emerge or expand and may identify a targeted salvage option.","locator":"Therapy for AML — Relapsed and refractory disease"},{"id":"d-hner-2022-blood-140-1345-C0041","paper":"d-hner-2022-blood-140-1345","category":"biomarker","tier":"guideline criterion","genes":["IDH1"],"diseases":["AML"],"text":"The 2022 ELN recommendations recommend rapid IDH1 mutation screening at initial diagnosis in older patients with AML to identify candidates for ivosidenib-based therapy.","locator":"Therapy for AML — patients not considered candidates for intensive therapy"},{"id":"d-hner-2022-blood-140-1345-C0042","paper":"d-hner-2022-blood-140-1345","category":"germline","tier":"guideline criterion","genes":["CHEK2","DDX41"],"diseases":[],"text":"In the 2022 ELN recommendations, CHEK2 I200T and truncating DDX41 variants identified on tumor profiling are considered overwhelmingly likely to be germline.","locator":"Table 3 footnote"},{"id":"d-hner-2022-blood-140-1345-C0044","paper":"d-hner-2022-blood-140-1345","category":"germline","tier":"guideline criterion","genes":["CEBPA"],"diseases":[],"text":"Germline pathogenic or likely pathogenic CEBPA variants are recognized as a myeloid-neoplasm predisposition disorder.","locator":"Table 2 — Myeloid neoplasms with germline predisposition"},{"id":"d-hner-2022-blood-140-1345-C0045","paper":"d-hner-2022-blood-140-1345","category":"germline","tier":"guideline criterion","genes":["DDX41"],"diseases":[],"text":"Germline pathogenic or likely pathogenic DDX41 variants are recognized as a myeloid-neoplasm predisposition disorder.","locator":"Table 2 — Myeloid neoplasms with germline predisposition"},{"id":"d-hner-2022-blood-140-1345-C0046","paper":"d-hner-2022-blood-140-1345","category":"germline","tier":"guideline criterion","genes":["TP53"],"diseases":[],"text":"Germline pathogenic or likely pathogenic TP53 variants causing Li-Fraumeni syndrome are associated with predisposition to myeloid neoplasia.","locator":"Table 2 — Myeloid neoplasms with germline predisposition"},{"id":"d-hner-2022-blood-140-1345-C0047","paper":"d-hner-2022-blood-140-1345","category":"germline","tier":"guideline criterion","genes":["RUNX1","ANKRD26","ETV6"],"diseases":[],"text":"Germline pathogenic or likely pathogenic RUNX1, ANKRD26, and ETV6 variants are recognized myeloid-neoplasm predisposition disorders associated with a preexisting platelet disorder.","locator":"Table 2 — Myeloid neoplasms with germline predisposition"},{"id":"d-hner-2022-blood-140-1345-C0048","paper":"d-hner-2022-blood-140-1345","category":"germline","tier":"guideline criterion","genes":["GATA2"],"diseases":[],"text":"Germline pathogenic or likely pathogenic GATA2 variants are recognized as a myeloid-neoplasm predisposition disorder.","locator":"Table 2 — Myeloid neoplasms with germline predisposition"},{"id":"d-hner-2022-blood-140-1345-C0049","paper":"d-hner-2022-blood-140-1345","category":"germline","tier":"guideline criterion","genes":["ELANE","HAX1"],"diseases":[],"text":"Germline ELANE and HAX1 variants associated with severe congenital neutropenia are recognized causes of myeloid-neoplasm predisposition.","locator":"Table 2 — Myeloid neoplasms with germline predisposition"},{"id":"d-hner-2022-blood-140-1345-C0050","paper":"d-hner-2022-blood-140-1345","category":"germline","tier":"guideline criterion","genes":["SBDS","DNAJC21","EFL1","SRP54"],"diseases":[],"text":"Germline SBDS, DNAJC21, EFL1, and SRP54 variants associated with Shwachman-Diamond syndrome are recognized causes of myeloid-neoplasm predisposition.","locator":"Table 2 — Myeloid neoplasms with germline predisposition"},{"id":"d-hner-2022-blood-140-1345-C0051","paper":"d-hner-2022-blood-140-1345","category":"germline","tier":"guideline criterion","genes":["ACD","CTC1","DKC1","RTEL1","TERC","TERT","TINF2","NHP2","NOP10","PARN","WRAP53","RPA1"],"diseases":[],"text":"Germline ACD, CTC1, DKC1, RTEL1, TERC, TERT, TINF2, NHP2, NOP10, PARN, WRAP53, and RPA1 variants associated with telomere biology disorders/short telomere syndromes are recognized causes of myeloid-neoplasm predisposition.","locator":"Table 2 — Myeloid neoplasms with germline predisposition"},{"id":"d-hner-2022-blood-140-1345-C0052","paper":"d-hner-2022-blood-140-1345","category":"germline","tier":"guideline criterion","genes":["CBL"],"diseases":[],"text":"Germline CBL variants causing CBL syndrome are associated with myeloid-neoplasm predisposition.","locator":"Table 2 — Myeloid neoplasms with germline predisposition"},{"id":"d-hner-2022-blood-140-1345-C0053","paper":"d-hner-2022-blood-140-1345","category":"germline","tier":"guideline criterion","genes":["PTPN11","NRAS","KRAS"],"diseases":[],"text":"Germline PTPN11, NRAS, and KRAS variants associated with Noonan syndrome are recognized causes of myeloid-neoplasm predisposition.","locator":"Table 2 — Myeloid neoplasms with germline predisposition"},{"id":"d-hner-2022-blood-140-1345-C0054","paper":"d-hner-2022-blood-140-1345","category":"germline","tier":"guideline criterion","genes":["NF1"],"diseases":[],"text":"Germline NF1 variants causing neurofibromatosis type I are associated with myeloid-neoplasm predisposition.","locator":"Table 2 — Myeloid neoplasms with germline predisposition"},{"id":"d-hner-2022-blood-140-1345-C0055","paper":"d-hner-2022-blood-140-1345","category":"germline","tier":"guideline criterion","genes":["SAMD9","SAMD9L"],"diseases":[],"text":"Germline pathogenic or likely pathogenic SAMD9 and SAMD9L variants are recognized as myeloid-neoplasm predisposition disorders.","locator":"Table 2 — Myeloid neoplasms with germline predisposition"},{"id":"d-hner-2022-blood-140-1345-C0056","paper":"d-hner-2022-blood-140-1345","category":"germline","tier":"guideline criterion","genes":["BLM"],"diseases":[],"text":"Germline BLM variants causing Bloom syndrome are associated with myeloid-neoplasm predisposition.","locator":"Table 2 — Myeloid neoplasms with germline predisposition"},{"id":"d-hner-2022-blood-140-1345-C0057","paper":"d-hner-2022-blood-140-1345","category":"germline","tier":"guideline criterion","genes":["CHEK2"],"diseases":[],"text":"Germline pathogenic or likely pathogenic CHEK2 variants are recognized as a myeloid-neoplasm predisposition disorder.","locator":"Table 2 — Myeloid neoplasms with germline predisposition"},{"id":"d-hner-2022-blood-140-1345-C0058","paper":"d-hner-2022-blood-140-1345","category":"germline","tier":"guideline criterion","genes":["MPL"],"diseases":[],"text":"Germline pathogenic or likely pathogenic MPL variants are recognized as a myeloid-neoplasm predisposition disorder.","locator":"Table 2 — Myeloid neoplasms with germline predisposition"},{"id":"d-hner-2022-blood-140-1345-C0059","paper":"d-hner-2022-blood-140-1345","category":"germline","tier":"guideline criterion","genes":["RECQL4"],"diseases":[],"text":"Germline pathogenic or likely pathogenic RECQL4 variants are recognized as a myeloid-neoplasm predisposition disorder.","locator":"Table 2 — Myeloid neoplasms with germline predisposition"},{"id":"d-hner-2022-blood-140-1345-C0060","paper":"d-hner-2022-blood-140-1345","category":"germline","tier":"guideline criterion","genes":["BRCA1","BRCA2"],"diseases":[],"text":"Germline BRCA1 and BRCA2 variants associated with hereditary breast and ovarian cancer are listed as causes of myeloid-neoplasm predisposition.","locator":"Table 2 — Myeloid neoplasms with germline predisposition"},{"id":"d-hner-2022-blood-140-1345-C0061","paper":"d-hner-2022-blood-140-1345","category":"germline","tier":"guideline criterion","genes":["MLH1","MSH2","MSH6","PMS2"],"diseases":[],"text":"Germline MLH1, MSH2, MSH6, and PMS2 variants associated with Lynch syndrome are listed as causes of myeloid-neoplasm predisposition.","locator":"Table 2 — Myeloid neoplasms with germline predisposition"},{"id":"d-hner-2022-blood-140-1345-C0062","paper":"d-hner-2022-blood-140-1345","category":"germline","tier":"guideline criterion","genes":["NBN"],"diseases":[],"text":"Germline NBN variants causing Nijmegen breakage syndrome are associated with myeloid-neoplasm predisposition.","locator":"Table 2 — Myeloid neoplasms with germline predisposition"},{"id":"d-hner-2022-blood-140-1345-C0063","paper":"d-hner-2022-blood-140-1345","category":"germline","tier":"guideline criterion","genes":["WAS"],"diseases":[],"text":"Germline WAS variants causing Wiskott-Aldrich syndrome are associated with myeloid-neoplasm predisposition.","locator":"Table 2 — Myeloid neoplasms with germline predisposition"},{"id":"d-hner-2022-blood-140-1345-C0071","paper":"d-hner-2022-blood-140-1345","category":"treatment","tier":"guideline criterion","genes":[],"diseases":["AML"],"text":"The 2022 ELN recommendations identify anthracycline plus cytarabine as the standard induction backbone for patients with AML who are fit for intensive therapy.","locator":"Therapy for AML — Patients considered fit for intensive therapy"},{"id":"d-hner-2022-blood-140-1345-C0072","paper":"d-hner-2022-blood-140-1345","category":"treatment","tier":"guideline criterion","genes":["FLT3"],"diseases":["AML"],"text":"The 2022 ELN recommendations identify incorporation of midostaurin into first-line daunorubicin/cytarabine induction and cytarabine consolidation as standard treatment for intensively treated FLT3-mutated AML; this regimen improves overall survival.","locator":"Therapy for AML — Induction therapy; Table 10"},{"id":"d-hner-2022-blood-140-1345-C0074","paper":"d-hner-2022-blood-140-1345","category":"treatment","tier":"guideline criterion","genes":["CD33"],"diseases":["AML"],"text":"The 2022 ELN recommendations list gemtuzumab ozogamicin combined with daunorubicin and cytarabine as an approved frontline treatment option for previously untreated CD33-positive AML.","locator":"Therapy for AML — Gemtuzumab ozogamicin; Table 10"},{"id":"d-hner-2022-blood-140-1345-C0075","paper":"d-hner-2022-blood-140-1345","category":"treatment","tier":"restated secondary","genes":["RUNX1","RUNX1T1","CBFB","MYH11"],"diseases":["AML"],"text":"In RUNX1::RUNX1T1 and CBFB::MYH11 core-binding-factor AML, adding gemtuzumab ozogamicin to frontline intensive therapy provides particular benefit.","locator":"Therapy for AML — Gemtuzumab ozogamicin"},{"id":"d-hner-2022-blood-140-1345-C0076","paper":"d-hner-2022-blood-140-1345","category":"treatment","tier":"restated secondary","genes":["NPM1"],"diseases":["AML"],"text":"In NPM1-mutated AML, adding gemtuzumab ozogamicin reduces relapse risk, although an event-free-survival benefit was not demonstrated in the cited randomized study.","locator":"Therapy for AML — Gemtuzumab ozogamicin"},{"id":"d-hner-2022-blood-140-1345-C0078","paper":"d-hner-2022-blood-140-1345","category":"treatment","tier":"guideline criterion","genes":[],"diseases":["AML"],"text":"The 2022 ELN recommendations generally recommend intermediate-dose cytarabine for consolidation after CR/CRh/CRi following intensive AML treatment; high-dose cytarabine adds toxicity without demonstrated survival benefit.","locator":"Therapy for AML — Consolidation therapy"},{"id":"d-hner-2022-blood-140-1345-C0080","paper":"d-hner-2022-blood-140-1345","category":"treatment","tier":"guideline criterion","genes":[],"diseases":["AML"],"text":"The 2022 ELN recommendations identify azacitidine plus venetoclax as a standard-of-care regimen for older or unfit patients with AML who are not candidates for intensive chemotherapy; the combination improves response and overall survival versus azacitidine alone.","locator":"Therapy for AML — Patients not considered candidates for intensive therapy; Table 11"},{"id":"d-hner-2022-blood-140-1345-C0081","paper":"d-hner-2022-blood-140-1345","category":"treatment","tier":"guideline criterion","genes":[],"diseases":["AML"],"text":"The 2022 ELN recommendations list low-dose cytarabine plus venetoclax as an alternative treatment option for patients with AML unsuitable for intensive chemotherapy who cannot receive a hypomethylating agent.","locator":"Table 11 — Selected treatment options for patients not suitable for intensive chemotherapy"},{"id":"d-hner-2022-blood-140-1345-C0082","paper":"d-hner-2022-blood-140-1345","category":"treatment","tier":"restated secondary","genes":["IDH1"],"diseases":["AML"],"text":"The 2022 ELN recommendations list ivosidenib plus azacitidine as a treatment option for newly diagnosed IDH1-mutated AML unsuitable for intensive chemotherapy; randomized evidence shows improved event-free survival, response, and overall survival versus azacitidine plus placebo.","locator":"Therapy for AML — Patients not considered candidates for intensive therapy; Table 11"},{"id":"d-hner-2022-blood-140-1345-C0083","paper":"d-hner-2022-blood-140-1345","category":"treatment","tier":"guideline criterion","genes":["IDH1"],"diseases":["AML"],"text":"The 2022 ELN recommendations state that very frail patients with IDH1-mutated AML who cannot tolerate hypomethylating-agent-based therapy may be offered ivosidenib monotherapy, which can be continued until progression.","locator":"Table 11 — Selected treatment options for patients not suitable for intensive chemotherapy; Therapy for AML — Patients not considered candidates for intensive therapy"},{"id":"d-hner-2022-blood-140-1345-C0084","paper":"d-hner-2022-blood-140-1345","category":"treatment","tier":"guideline criterion","genes":["IDH2"],"diseases":["AML"],"text":"The 2022 ELN recommendations state that very frail patients with IDH2-mutated AML who cannot tolerate hypomethylating-agent-based therapy may be offered monotherapy with a targeted IDH2 inhibitor.","locator":"Therapy for AML — Patients not considered candidates for intensive therapy"},{"id":"d-hner-2022-blood-140-1345-C0085","paper":"d-hner-2022-blood-140-1345","category":"treatment","tier":"restated secondary","genes":["FLT3"],"diseases":["AML"],"text":"The 2022 ELN recommendations list gilteritinib as a salvage option for relapsed/refractory FLT3-mutated AML after prior intensive chemotherapy; randomized evidence shows improved response and overall survival versus physician-choice salvage therapy.","locator":"Therapy for AML — Relapsed and refractory disease; Table 10"},{"id":"d-hner-2022-blood-140-1345-C0086","paper":"d-hner-2022-blood-140-1345","category":"treatment","tier":"restated secondary","genes":["FLT3"],"diseases":["AML"],"text":"For relapsed/refractory FLT3-ITD-positive AML, quizartinib improves overall survival versus conventional care, although FDA and EMA approval was not granted after review of the cited trial data.","locator":"Therapy for AML — Relapsed and refractory disease"},{"id":"d-hner-2022-blood-140-1345-C0087","paper":"d-hner-2022-blood-140-1345","category":"treatment","tier":"restated secondary","genes":["IDH1"],"diseases":["AML"],"text":"The 2022 ELN recommendations list ivosidenib as a salvage option for relapsed/refractory IDH1-mutated AML, supported by clinically meaningful single-agent antileukemic activity from single-arm evidence.","locator":"Therapy for AML — Relapsed and refractory disease; Table 10"},{"id":"d-hner-2022-blood-140-1345-C0088","paper":"d-hner-2022-blood-140-1345","category":"treatment","tier":"restated secondary","genes":["IDH2"],"diseases":["AML"],"text":"The 2022 ELN recommendations list enasidenib as a salvage option for relapsed/refractory IDH2-mutated AML because clinically useful single-agent antileukemic activity has been demonstrated, although a randomized late-line study did not improve overall survival versus conventional care.","locator":"Therapy for AML — Relapsed and refractory disease; Table 10"},{"id":"d-hner-2022-blood-140-1345-C0089","paper":"d-hner-2022-blood-140-1345","category":"treatment","tier":"guideline criterion","genes":["FLT3"],"diseases":["AML"],"text":"The 2022 ELN recommendations consider use of a FLT3 inhibitor a reasonable posttransplant maintenance strategy for FLT3-mutated AML, based on randomized evidence that sorafenib maintenance reduces relapse after allogeneic HCT.","locator":"Allogeneic HCT — Pre- and posttransplant strategies"},{"id":"d-hner-2022-blood-140-1345-C0090","paper":"d-hner-2022-blood-140-1345","category":"treatment","tier":"guideline criterion","genes":["FLT3"],"diseases":["AML"],"text":"The 2022 ELN recommendations identify gilteritinib as the preferred treatment option for FLT3-mutated AML relapsing after allogeneic HCT with an emergent FLT3-mutant clone.","locator":"Relapse after transplant"},{"id":"d-hner-2022-blood-140-1345-C0091","paper":"d-hner-2022-blood-140-1345","category":"treatment","tier":"guideline criterion","genes":["RUNX1","CEBPA"],"diseases":["AML"],"text":"The 2022 ELN recommendations advise against using related donor stem cells carrying the same deleterious germline RUNX1 or CEBPA variant in a patient with AML.","locator":"Germline predisposition; Allogeneic HCT — Donor selection"},{"id":"d-hner-2022-blood-140-1345-C0093","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["AML"],"text":"Under the 2022 ICC, the former AML with myelodysplasia-related changes (AML-MRC) category is removed, and multilineage dysplasia is no longer an independent criterion for that AML category.","locator":"AML classification — Antecedent AML history"},{"id":"d-hner-2022-blood-140-1345-C0094","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"guideline criterion","genes":["TP53"],"diseases":["AML","MDS/AML"],"text":"Under the 2022 ICC, cases lacking a recurrent AML-defining abnormality, TP53-mutated category, myelodysplasia-related gene mutation category, or myelodysplasia-related cytogenetic category are classified as AML, not otherwise specified at ≥20% blasts, or MDS/AML at 10%-19% blasts, irrespective of multilineage dysplasia.","locator":"AML classification — remaining AML cases; Figure 1; Table 1; Figure 1; AML classification — remaining AML cases"},{"id":"d-hner-2022-blood-140-1345-C0095","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["AML"],"text":"Under the 2022 ICC, when an inherited germline predisposing disorder is identified in a patient with AML, the germline disorder is appended as a diagnostic qualifier to the specific AML category.","locator":"Germline predisposition"},{"id":"d-hner-2022-blood-140-1345-C0096","paper":"d-hner-2022-blood-140-1345","category":"prognosis","tier":"guideline criterion","genes":["NPM1"],"diseases":["AML"],"text":"The 2022 ELN recommendations state that subsequent MRD response may modify the initial ELN genetic risk assignment in NPM1-mutated AML.","locator":"2022 European LeukemiaNet genetic risk classification at diagnosis"},{"id":"d-hner-2022-blood-140-1345-C0097","paper":"d-hner-2022-blood-140-1345","category":"biomarker","tier":"guideline criterion","genes":["FLT3","IDH1","IDH2","NPM1","CEBPA","DDX41","TP53","ASXL1","BCOR","EZH2","RUNX1","SF3B1","SRSF2","STAG2","U2AF1","ZRSR2"],"diseases":["AML"],"text":"The 2022 ELN recommendations recommend mutation testing at AML diagnosis for FLT3, IDH1, IDH2, NPM1, CEBPA, DDX41, TP53, ASXL1, BCOR, EZH2, RUNX1, SF3B1, SRSF2, STAG2, U2AF1, and ZRSR2 because these genes are required for disease/risk classification and/or identification of actionable therapeutic targets as applicable.","locator":"Table 4 — Genetic analyses at diagnosis"},{"id":"d-hner-2022-blood-140-1345-C0098","paper":"d-hner-2022-blood-140-1345","category":"biomarker","tier":"guideline criterion","genes":["PML","RARA","CBFB","MYH11","RUNX1","RUNX1T1","KMT2A","BCR","ABL1"],"diseases":["AML"],"text":"The 2022 ELN recommendations recommend screening at AML diagnosis for PML::RARA, CBFB::MYH11, RUNX1::RUNX1T1, KMT2A rearrangements, and BCR::ABL1 when rapid therapeutic information is needed, chromosome morphology is poor, or typical morphology lacks the suspected cytogenetic abnormality.","locator":"Table 4 — Screening for gene rearrangements; footnote **"},{"id":"d-hner-2022-blood-140-1345-C0099","paper":"d-hner-2022-blood-140-1345","category":"biomarker","tier":"guideline criterion","genes":["ANKRD26","BCORL1","BRAF","CBL","CSF3R","DNMT3A","ETV6","GATA2","JAK2","KIT","KRAS","NRAS","NF1","PHF6","PPM1D","PTPN11","RAD21","SETBP1","TET2","WT1"],"diseases":["AML"],"text":"The 2022 ELN recommendations list ANKRD26, BCORL1, BRAF, CBL, CSF3R, DNMT3A, ETV6, GATA2, JAK2, KIT, KRAS, NRAS, NF1, PHF6, PPM1D, PTPN11, RAD21, SETBP1, TET2, and WT1 as additional genes for possible investigational NGS-based disease monitoring after AML diagnosis; DNMT3A and TET2 mutations consistent with clonal hematopoiesis are specifically excluded from use as AML MRD markers.","locator":"Table 4 — Additional genes recommended to test at diagnosis; footnote ††"},{"id":"d-hner-2022-blood-140-1345-C0106","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"guideline criterion","genes":["BCR","ABL1","KMT2A"],"diseases":["acute leukaemia of ambiguous lineage"],"text":"Under the 2022 ICC, mixed-phenotype acute leukemia with BCR::ABL1 and mixed-phenotype acute leukemia with KMT2A rearrangement are recognized distinct genetic entities within acute leukemia of ambiguous lineage.","locator":"Table 1 — Acute leukemia of ambiguous lineage"},{"id":"d-hner-2022-blood-140-1345-C0107","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"guideline criterion","genes":["BCR","ABL1"],"diseases":["CML","AML"],"text":"Under the 2022 ICC, BCR::ABL1-positive disease with 10%-19% blasts is classified as chronic myeloid leukemia in accelerated phase rather than AML.","locator":"Figure 1 legend; Changes to the blast thresholds defining AML"},{"id":"d-hner-2022-blood-140-1345-C0108","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"guideline criterion","genes":["BCR","ABL1"],"diseases":["CML","AML"],"text":"Under the 2022 ICC, in a patient with a history of chronic myeloid leukemia, BCR::ABL1-positive disease with ≥20% blasts is classified as CML in myeloid blast phase rather than de novo AML with BCR::ABL1.","locator":"Figure 1 legend"},{"id":"d-hner-2022-blood-140-1345-C0109","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["MDS/MPN","AML"],"text":"Under the 2022 ICC, a prior MDS/MPN is appended as a diagnostic qualifier to the AML category only when the MDS/MPN was established by standard diagnostics more than 3 months before AML diagnosis, and the MDS/MPN type should be specified.","locator":"Table 1 — Diagnostic qualifiers"},{"id":"d-hner-2022-blood-140-1345-C0110","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["MPN","MPN blast phase"],"text":"Under the 2022 ICC, patients with a prior myeloproliferative neoplasm are excluded from the AML hierarchy and are classified as accelerated-phase MPN at 10%-19% blasts or MPN blast phase at ≥20% blasts.","locator":"Figure 1 legend"},{"id":"d-hner-2022-blood-140-1345-C0111","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["AML"],"text":"Under the 2022 ICC, myeloblasts, monoblasts, and megakaryoblasts are included in the blast count used for AML classification.","locator":"Figure 1 legend; Table 4 footnote †"},{"id":"d-hner-2022-blood-140-1345-C0112","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["AML"],"text":"Under the 2022 ICC, in AML with monocytic or myelomonocytic differentiation, monoblasts and promonocytes are counted as blast equivalents, whereas abnormal monocytes are not.","locator":"Figure 1 legend; Table 4 footnote †"},{"id":"d-hner-2022-blood-140-1345-C0113","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"guideline criterion","genes":["PML","RARA"],"diseases":["APL","AML"],"text":"Under the 2022 ICC, in PML::RARA or variant RARA-rearranged APL/AML, promyelocytes are counted as blast equivalents for classification.","locator":"Figure 1 legend"},{"id":"d-hner-2022-blood-140-1345-C0114","paper":"d-hner-2022-blood-140-1345","category":"treatment","tier":"guideline criterion","genes":["PML","RARA","RUNX1","RUNX1T1","CBFB","MYH11","MLLT3","KMT2A","DEK","NUP214","GATA2","MECOM","NPM1","CEBPA","IRF2BP2","ZBTB16","STAT5B","STAT3","TBL1XR1","FIP1L1","BCOR","AFF1","AFDN","MLLT10","TET1","ELL","MLLT1","MYC","ETV6","PRDM16","RPN1","RBM15","MRTFA","MLF1","NUP98","NSD1","MNX1","KAT6A","CREBBP","PICALM","KMD5A","FUS","ERG","CBFA2T3","GLIS2"],"diseases":["MDS/MPN","AML"],"text":"The 2022 ELN recommendations advise AML-type therapy for a patient with prior MDS/MPN when an AML-defining recurrent abnormality is detected at ≥10% blasts—including PML::RARA, RUNX1::RUNX1T1, CBFB::MYH11, MLLT3::KMT2A, DEK::NUP214, GATA2/MECOM rearrangement, mutated NPM1, in-frame bZIP CEBPA, or the listed variant RARA, KMT2A, MECOM, and rare recurrent rearrangements involving IRF2BP2, ZBTB16, STAT5B, STAT3, TBL1XR1, FIP1L1, BCOR, AFF1, AFDN, MLLT10, TET1, ELL, MLLT1, MYC, ETV6, PRDM16, RPN1, RBM15, MRTFA, MLF1, NUP98, NSD1, MNX1, KAT6A, CREBBP, PICALM, KMD5A, FUS, ERG, CBFA2T3, or GLIS2—even though the antecedent MDS/MPN diagnosis is otherwise retained until ≥20% blasts.","locator":"Figure 1 legend"},{"id":"d-hner-2022-blood-140-1345-C0115","paper":"d-hner-2022-blood-140-1345","category":"biomarker","tier":"guideline criterion","genes":["NPM1","RUNX1","RUNX1T1","CBFB","MYH11"],"diseases":["AML"],"text":"Under the ELN MRD framework incorporated into the 2022 AML recommendations, at the end of consolidation, molecular CR with qPCR MRD below 2% in NPM1-mutated, RUNX1::RUNX1T1, or CBFB::MYH11 AML is operationally designated MRD-negative.","locator":"Table 8 footnote §"},{"id":"d-hner-2022-blood-140-1345-C0116","paper":"d-hner-2022-blood-140-1345","category":"biomarker","tier":"guideline criterion","genes":["FLT3"],"diseases":["AML"],"text":"The 2022 ELN recommendations advise retaining capillary electrophoresis for FLT3-ITD detection in AML because longer FLT3 internal tandem duplications can be missed by next-generation sequencing.","locator":"Table 4 footnote ¶"},{"id":"d-hner-2022-blood-140-1345-C0117","paper":"d-hner-2022-blood-140-1345","category":"germline","tier":"guideline criterion","genes":["CHEK2","DDX41"],"diseases":[],"text":"The 2022 ELN recommendations advise consideration of germline testing when CHEK2 I200T or a truncating DDX41 variant is identified on tumor profiling, even when identified once.","locator":"Table 3 footnote"},{"id":"d-hner-2022-blood-140-1345-C0122","paper":"d-hner-2022-blood-140-1345","category":"treatment","tier":"restated secondary","genes":["CD33"],"diseases":["AML"],"text":"In patients aged 50-70 years with de novo CD33-positive AML, adding gemtuzumab ozogamicin to frontline therapy provides an event-free-survival benefit in favorable- or intermediate-cytogenetic-risk disease, with no corresponding benefit stated for adverse-risk disease.","locator":"Therapy for AML — Gemtuzumab ozogamicin"},{"id":"d-hner-2022-blood-140-1345-C0124","paper":"d-hner-2022-blood-140-1345","category":"biomarker","tier":"guideline criterion","genes":["RUNX1","RUNX1T1","CBFB","MYH11","KMT2A","MECOM"],"diseases":["AML"],"text":"The 2022 ELN recommendations identify FISH as an alternative method to detect RUNX1::RUNX1T1, CBFB::MYH11, KMT2A rearrangements, and MECOM rearrangements when conventional cytogenetic analysis yields no analyzable metaphases in AML.","locator":"Diagnostic procedures — Cytogenetic and molecular studies; Table 4 footnote §"},{"id":"d-hner-2022-blood-140-1345-C0127","paper":"d-hner-2022-blood-140-1345","category":"treatment","tier":"guideline criterion","genes":[],"diseases":["AML"],"text":"The 2022 ELN recommendations list best supportive care as an appropriate option for patients with AML who cannot tolerate any active antileukemic therapy or who do not wish to receive antileukemic treatment.","locator":"Table 11 — Selected treatment options for patients not suitable for intensive chemotherapy; Therapy for AML — Patients not considered candidates for intensive therapy"},{"id":"d-hner-2024-blood-144-2169-C0001","paper":"d-hner-2024-blood-144-2169","category":"prognosis","tier":"restated secondary","genes":["NPM1","IDH2","FLT3","KRAS","NRAS"],"diseases":["AML"],"text":"Exploratory analyses in NPM1- or IDH2-mutated AML treated with azacitidine/venetoclax found inferior overall survival when FLT3-ITD, KRAS, and/or NRAS mutations co-occurred.","locator":"HMAs plus VEN, paragraph beginning “Within these newly deﬁned higher- and intermediate-beneﬁt groups”"},{"id":"d-hner-2024-blood-144-2169-C0002","paper":"d-hner-2024-blood-144-2169","category":"prognosis","tier":"restated secondary","genes":["RUNX1"],"diseases":["AML"],"text":"Exploratory analyses in RUNX1-mutated AML treated with azacitidine/venetoclax suggest inferior overall survival when an activated kinase pathogenic variant is present.","locator":"HMAs plus VEN, paragraph beginning “Within these newly deﬁned higher- and intermediate-beneﬁt groups”"},{"id":"d-hner-2024-blood-144-2169-C0003","paper":"d-hner-2024-blood-144-2169","category":"prognosis","tier":"restated secondary","genes":["FLT3","KRAS","NRAS"],"diseases":["AML"],"text":"In AML with myelodysplasia-related gene mutations treated with HMA/venetoclax, co-occurring FLT3-ITD, KRAS, and/or NRAS signaling mutations are associated with inferior prognosis.","locator":"Genetic risk classiﬁcation, paragraph spanning “AML with MR mutations…” and HMAs plus VEN signaling-gene context"},{"id":"d-hner-2024-blood-144-2169-C0004","paper":"d-hner-2024-blood-144-2169","category":"prognosis","tier":"restated secondary","genes":["FLT3"],"diseases":["AML"],"text":"FLT3-ITD positivity has an adverse prognostic impact in AML treated with azacitidine/venetoclax.","locator":"HMAs plus VEN, paragraph containing “The adverse prognostic impact of TP53mut or FLT3-ITDpos”"},{"id":"d-hner-2024-blood-144-2169-C0005","paper":"d-hner-2024-blood-144-2169","category":"prognosis","tier":"guideline criterion","genes":["NPM1","IDH2","FLT3","NRAS","KRAS","TP53"],"diseases":["AML"],"text":"According to the proposed 2024 ELN Less-Intensive classification, newly diagnosed AML with mutated NPM1 or IDH2, FLT3-ITD negativity, NRAS/KRAS wild type, and TP53 wild type is favorable risk with HMA-based less-intensive therapy. This framework does not apply after prior HMA therapy and has limited relevance in patients with a prior myeloproliferative neoplasm.","locator":"Table 1, risk row; Genetic risk classification applicability/limitations"},{"id":"d-hner-2024-blood-144-2169-C0006","paper":"d-hner-2024-blood-144-2169","category":"prognosis","tier":"guideline criterion","genes":["IDH1","TP53"],"diseases":["AML"],"text":"According to the proposed 2024 ELN Less-Intensive classification, IDH1-mutated, TP53-wild-type AML is favorable risk specifically with azacitidine/ivosidenib, irrespective of the presence of activating signaling gene mutations. This framework does not apply after prior HMA therapy and has limited relevance in patients with a prior myeloproliferative neoplasm.","locator":"Table 1, risk row; Genetic risk classification applicability/limitations"},{"id":"d-hner-2024-blood-144-2169-C0007","paper":"d-hner-2024-blood-144-2169","category":"prognosis","tier":"guideline criterion","genes":["DDX41"],"diseases":["AML"],"text":"According to the proposed 2024 ELN Less-Intensive classification, DDX41-mutated AML is favorable risk with HMA-based less-intensive therapy. This framework does not apply after prior HMA therapy and has limited relevance in patients with a prior myeloproliferative neoplasm.","locator":"Table 1, risk row; Genetic risk classification applicability/limitations"},{"id":"d-hner-2024-blood-144-2169-C0008","paper":"d-hner-2024-blood-144-2169","category":"prognosis","tier":"guideline criterion","genes":["FLT3","NRAS","KRAS","TP53"],"diseases":["AML"],"text":"According to the proposed 2024 ELN Less-Intensive classification, other cytogenetic and/or molecular abnormalities in newly diagnosed AML are tentatively favorable risk when FLT3-ITD is negative, NRAS and KRAS are wild type, and TP53 is wild type. This framework does not apply after prior HMA therapy and has limited relevance in patients with a prior myeloproliferative neoplasm.","locator":"Table 1, risk row; Genetic risk classification applicability/limitations"},{"id":"d-hner-2024-blood-144-2169-C0009","paper":"d-hner-2024-blood-144-2169","category":"prognosis","tier":"guideline criterion","genes":["FLT3","NRAS","KRAS","TP53"],"diseases":["AML"],"text":"According to the proposed 2024 ELN Less-Intensive classification, other cytogenetic and molecular abnormalities in newly diagnosed AML are tentatively intermediate risk when FLT3-ITD is positive and/or NRAS or KRAS is mutated, with TP53 wild type. This framework does not apply after prior HMA therapy and has limited relevance in patients with a prior myeloproliferative neoplasm.","locator":"Table 1, intermediate-risk row; Genetic risk classification applicability/limitations"},{"id":"d-hner-2024-blood-144-2169-C0010","paper":"d-hner-2024-blood-144-2169","category":"prognosis","tier":"guideline criterion","genes":["TP53"],"diseases":["AML"],"text":"According to the proposed 2024 ELN Less-Intensive classification, TP53-mutated AML is adverse risk with HMA-based less-intensive therapy. This framework does not apply after prior HMA therapy and has limited relevance in patients with a prior myeloproliferative neoplasm.","locator":"Table 1, adverse-risk row; Genetic risk classification applicability/limitations"},{"id":"d-hner-2024-blood-144-2169-C0012","paper":"d-hner-2024-blood-144-2169","category":"prognosis","tier":"guideline criterion","genes":["FLT3","NRAS","KRAS","TP53"],"diseases":["AML"],"text":"According to the proposed 2024 ELN Less-Intensive classification, AML with myelodysplasia-related gene mutations is favorable risk when FLT3-ITD is negative, NRAS and KRAS are wild type, and TP53 is wild type. This framework does not apply after prior HMA therapy and has limited relevance in patients with a prior myeloproliferative neoplasm.","locator":"Table 2, favorable-risk group; Genetic risk classification applicability/limitations"},{"id":"d-hner-2024-blood-144-2169-C0013","paper":"d-hner-2024-blood-144-2169","category":"prognosis","tier":"guideline criterion","genes":["FLT3","NRAS","KRAS","TP53"],"diseases":["AML"],"text":"According to the proposed 2024 ELN Less-Intensive classification, AML with myelodysplasia-related gene mutations is intermediate risk when FLT3-ITD is positive and/or NRAS or KRAS is mutated, with TP53 wild type. This framework does not apply after prior HMA therapy and has limited relevance in patients with a prior myeloproliferative neoplasm.","locator":"Table 2, intermediate-risk group; Genetic risk classification applicability/limitations"},{"id":"d-hner-2024-blood-144-2169-C0014","paper":"d-hner-2024-blood-144-2169","category":"prognosis","tier":"restated secondary","genes":["ASXL1"],"diseases":["AML"],"text":"ASXL1 mutations have been linked to improved outcomes in AML treated with HMA/venetoclax.","locator":"Genetic risk classification, paragraph beginning “secondary AML”"},{"id":"d-hner-2024-blood-144-2169-C0016","paper":"d-hner-2024-blood-144-2169","category":"treatment","tier":"restated secondary","genes":["TP53","FLT3"],"diseases":["AML"],"text":"In TP53-mutated or FLT3-ITD-positive AML, adding venetoclax to azacitidine has been reported not to improve survival beyond azacitidine alone.","locator":"HMAs plus VEN, paragraph containing “failure to improve survival above AZA alone”"},{"id":"d-hner-2024-blood-144-2169-C0017","paper":"d-hner-2024-blood-144-2169","category":"treatment","tier":"restated secondary","genes":["DDX41"],"diseases":["AML"],"text":"DDX41-mutated AML treated with HMA/venetoclax has been reported to have a high response rate.","locator":"HMAs plus VEN, paragraph beginning “DDX41 mutations identify”"},{"id":"d-hner-2024-blood-144-2169-C0018","paper":"d-hner-2024-blood-144-2169","category":"treatment","tier":"restated secondary","genes":["IDH1"],"diseases":["AML"],"text":"For IDH1-mutated AML receiving less-intensive therapy, azacitidine/ivosidenib is an established treatment standard.","locator":"AZA and IVO, paragraph beginning “A randomized phase 3 study established”"},{"id":"d-hner-2024-blood-144-2169-C0019","paper":"d-hner-2024-blood-144-2169","category":"treatment","tier":"restated secondary","genes":["IDH1"],"diseases":["AML"],"text":"In IDH1-mutated AML, azacitidine/ivosidenib improves overall survival compared with azacitidine/placebo.","locator":"AZA and IVO, paragraph beginning “A randomized phase 3 study established”"},{"id":"d-hner-2024-blood-144-2169-C0020","paper":"d-hner-2024-blood-144-2169","category":"treatment","tier":"restated secondary","genes":["NPM1","IDH2"],"diseases":["AML"],"text":"NPM1-mutated or IDH2-mutated AML appears sensitive to venetoclax treatment.","locator":"Genetic risk classification, paragraph beginning “Although patients with NPM1mut or IDH2mut AML”"},{"id":"d-hner-2024-blood-144-2169-C0021","paper":"d-hner-2024-blood-144-2169","category":"germline","tier":"guideline criterion","genes":["DDX41"],"diseases":["AML"],"text":"In AML, identification of a DDX41 mutation at near-heterozygous frequency should prompt consideration of germline DDX41 mutation.","locator":"Table 1, DDX41 footnote"},{"id":"elena-2016-blood-128-1408-C0001","paper":"elena-2016-blood-128-1408","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["CMML"],"text":"According to the FAB classification, chronic myelomonocytic leukemia is classified as myelodysplastic CMML when the leukocyte count is ≤13 × 10^9/L and myeloproliferative CMML when it is >13 × 10^9/L.","locator":"Introduction, paragraph beginning 'Chronic myelomonocytic leukemia (CMML) is a myeloid neoplasm'"},{"id":"elena-2016-blood-128-1408-C0003","paper":"elena-2016-blood-128-1408","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["CMML"],"text":"According to the 2016 WHO revision, chronic myelomonocytic leukemia includes dysplastic and proliferative types.","locator":"Introduction, paragraph beginning 'Chronic myelomonocytic leukemia (CMML) is a myeloid neoplasm'"},{"id":"elena-2016-blood-128-1408-C0005","paper":"elena-2016-blood-128-1408","category":"prognosis","tier":"multivariable-adjusted","genes":["ASXL1","NRAS","RUNX1","SETBP1"],"diseases":["CMML"],"text":"According to the CMML-specific genetic score developed as part of the CPSS-Mol framework, mutations in ASXL1, NRAS, RUNX1, and SETBP1 are independently associated with inferior overall survival in chronic myelomonocytic leukemia.","locator":"Results, Prognostic value of genetic lesions in CMML, multivariable Cox regression paragraph; Results, Development of a clinical/molecular prognostic scoring system in CMML"},{"id":"elena-2016-blood-128-1408-C0006","paper":"elena-2016-blood-128-1408","category":"prognosis","tier":"univariable or descriptive","genes":["EZH2"],"diseases":["CMML"],"text":"In chronic myelomonocytic leukemia, EZH2 mutation is associated with inferior overall survival in univariable analysis, but was not retained as an independent prognostic factor in multivariable analysis.","locator":"Results, Prognostic value of genetic lesions in CMML, univariable analysis and multivariable Cox regression paragraphs"},{"id":"guglielmelli-2017-mipss70-pmf-C0001","paper":"guglielmelli-2017-mipss70-pmf","category":"prognosis","tier":"multivariable-adjusted","genes":["CALR"],"diseases":["PMF"],"text":"According to the MIPSS70 and MIPSS70-plus frameworks, absence of a type 1-like CALR mutation in patients aged 70 years or younger with primary myelofibrosis is associated with inferior overall survival.","locator":"Development and Validation of Mutation-Enhanced IPSS: MIPSS70; Development and Validation of the Cytogenetic-Enhanced MIPSS70 Scoring System: MIPSS70-Plus; Table 2"},{"id":"guglielmelli-2017-mipss70-pmf-C0002","paper":"guglielmelli-2017-mipss70-pmf","category":"prognosis","tier":"multivariable-adjusted","genes":["ASXL1","EZH2","SRSF2","IDH1","IDH2"],"diseases":["PMF"],"text":"According to the MIPSS70 and MIPSS70-plus frameworks, the presence of a high-molecular-risk mutation in ASXL1, EZH2, SRSF2, IDH1, or IDH2 in patients aged 70 years or younger with primary myelofibrosis is associated with inferior overall survival.","locator":"Mutation Analysis; Development and Validation of Mutation-Enhanced IPSS: MIPSS70; Development and Validation of the Cytogenetic-Enhanced MIPSS70 Scoring System: MIPSS70-Plus; Table 2"},{"id":"guglielmelli-2017-mipss70-pmf-C0003","paper":"guglielmelli-2017-mipss70-pmf","category":"prognosis","tier":"multivariable-adjusted","genes":["ASXL1","EZH2","SRSF2","IDH1","IDH2"],"diseases":["PMF"],"text":"According to the MIPSS70 and MIPSS70-plus frameworks, the presence of mutations in two or more of ASXL1, EZH2, SRSF2, IDH1, and IDH2 in patients aged 70 years or younger with primary myelofibrosis identifies a particularly adverse overall-survival group.","locator":"Development and Validation of Mutation-Enhanced IPSS: MIPSS70; Development and Validation of the Cytogenetic-Enhanced MIPSS70 Scoring System: MIPSS70-Plus; Table 2"},{"id":"guglielmelli-2017-mipss70-pmf-C0004","paper":"guglielmelli-2017-mipss70-pmf","category":"prognosis","tier":"univariable or descriptive","genes":["CALR","ASXL1","EZH2","SRSF2","IDH1","IDH2"],"diseases":["PMF"],"text":"According to the MIPSS70 framework, which incorporates CALR, ASXL1, EZH2, SRSF2, IDH1, and IDH2 with clinical factors, patients aged 70 years or younger with primary myelofibrosis are classified into low-, intermediate-, and high-risk overall-survival groups.","locator":"Development and Validation of Mutation-Enhanced IPSS: MIPSS70; Table 3; Figure 1A-B"},{"id":"guglielmelli-2017-mipss70-pmf-C0005","paper":"guglielmelli-2017-mipss70-pmf","category":"prognosis","tier":"univariable or descriptive","genes":["CALR","ASXL1","EZH2","SRSF2","IDH1","IDH2"],"diseases":["PMF"],"text":"According to the MIPSS70-plus framework, which incorporates CALR, ASXL1, EZH2, SRSF2, IDH1, and IDH2 with clinical and cytogenetic factors, patients aged 70 years or younger with primary myelofibrosis are classified into low-, intermediate-, high-, and very-high-risk overall-survival groups.","locator":"Development and Validation of the Cytogenetic-Enhanced MIPSS70 Scoring System: MIPSS70-Plus; Table 3; Figure 1C-D"},{"id":"guglielmelli-2017-mipss70-pmf-C0006","paper":"guglielmelli-2017-mipss70-pmf","category":"prognosis","tier":"univariable or descriptive","genes":["CALR","ASXL1","EZH2","SRSF2","IDH1","IDH2"],"diseases":["PMF"],"text":"According to the MIPSS70 framework, which incorporates CALR, ASXL1, EZH2, SRSF2, IDH1, and IDH2 with clinical factors, overall-survival risk stratification in primary myelofibrosis remains informative when patients older than 70 years are included.","locator":"All Age-Inclusive Application of Novel Prognostic Scoring Systems; Appendix Table A2; Discussion"},{"id":"guglielmelli-2017-mipss70-pmf-C0007","paper":"guglielmelli-2017-mipss70-pmf","category":"prognosis","tier":"univariable or descriptive","genes":["CALR","ASXL1","EZH2","SRSF2","IDH1","IDH2"],"diseases":["PMF"],"text":"According to the MIPSS70-plus framework, which incorporates CALR, ASXL1, EZH2, SRSF2, IDH1, and IDH2 with clinical and cytogenetic factors, overall-survival risk stratification in primary myelofibrosis remains informative when patients older than 70 years are included.","locator":"All Age-Inclusive Application of Novel Prognostic Scoring Systems; Appendix Table A2; Discussion"},{"id":"khoury-2022-leukemia-36-1703-C0001","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["CHIP"],"text":"According to WHO 5th Edition 2022, clonal haematopoiesis is recognized as a precursor myeloid disease state, and CHIP is defined as clonal haematopoiesis with somatic mutations in myeloid malignancy-associated genes detected in blood or bone marrow at VAF ≥2% (≥4% for X-linked gene mutations in males), in the absence of a diagnosed haematologic disorder or unexplained cytopenia.","locator":"CLONAL HAEMATOPOIESIS — CHIP definition"},{"id":"khoury-2022-leukemia-36-1703-C0002","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["CCUS"],"text":"According to WHO 5th Edition 2022, CCUS is defined as CHIP with one or more persistent cytopenias that are otherwise unexplained and that do not meet diagnostic criteria for a defined myeloid neoplasm.","locator":"CLONAL HAEMATOPOIESIS — CCUS definition"},{"id":"khoury-2022-leukemia-36-1703-C0003","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["CCUS","MDS","MDS/MPN"],"text":"According to WHO 5th Edition 2022, cytopenia thresholds harmonized across CCUS, MDS and MDS/MPN are haemoglobin <13 g/dL in males or <12 g/dL in females, absolute neutrophil count <1.8 × 10^9/L, and platelets <150 × 10^9/L.","locator":"CLONAL HAEMATOPOIESIS — harmonized cytopenia thresholds"},{"id":"khoury-2022-leukemia-36-1703-C0004","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["BCR","ABL1"],"diseases":["CML"],"text":"According to WHO 5th Edition 2022, chronic myeloid leukaemia is defined by BCR::ABL1 resulting from t(9;22)(q34;q11).","locator":"MYELOPROLIFERATIVE NEOPLASMS — CML definition"},{"id":"khoury-2022-leukemia-36-1703-C0005","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["CML"],"text":"According to WHO 5th Edition 2022, CML is classified into chronic and blast phases; accelerated phase is omitted. Blast phase is defined by ≥20% myeloid blasts in blood or bone marrow, extramedullary proliferation of blasts, or increased lymphoblasts in blood or marrow. The optimal lymphoblast cutoff and significance of low-level B-lymphoblasts remain uncertain.","locator":"MYELOPROLIFERATIVE NEOPLASMS — CML phase classification"},{"id":"khoury-2022-leukemia-36-1703-C0006","paper":"khoury-2022-leukemia-36-1703","category":"treatment","tier":"restated secondary","genes":["ABL1"],"diseases":["CML"],"text":"In chronic-phase CML, ABL1 kinase mutations are a source of resistance to tyrosine-kinase inhibitor therapy.","locator":"MYELOPROLIFERATIVE NEOPLASMS — CML resistance features"},{"id":"khoury-2022-leukemia-36-1703-C0009","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["JAK2"],"diseases":["PV"],"text":"According to WHO 5th Edition 2022, major diagnostic criteria for polycythaemia vera include elevated haemoglobin and/or haematocrit, bone-marrow trilineage hyperplasia (panmyelosis) with pleomorphic mature megakaryocytes, and JAK2 p.V617F or a JAK2 exon 12 mutation. Measurement of increased red-cell mass with 51Cr-labelled red cells is no longer a diagnostic criterion.","locator":"MYELOPROLIFERATIVE NEOPLASMS — PV major diagnostic criteria"},{"id":"khoury-2022-leukemia-36-1703-C0011","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["PMF","ET","PV"],"text":"According to WHO 5th Edition 2022, recognition of prefibrotic primary myelofibrosis remains necessary to distinguish it from essential thrombocythaemia, polycythaemia vera and fibrotic primary myelofibrosis.","locator":"MYELOPROLIFERATIVE NEOPLASMS — prefibrotic PMF distinction"},{"id":"khoury-2022-leukemia-36-1703-C0012","paper":"khoury-2022-leukemia-36-1703","category":"prognosis","tier":"restated secondary","genes":["EZH2","IDH1","IDH2","SRSF2","U2AF1","ASXL1"],"diseases":["PMF"],"text":"In primary myelofibrosis, mutations in EZH2, IDH1, IDH2, SRSF2, U2AF1 and ASXL1 are associated with poorer prognostic risk.","locator":"MYELOPROLIFERATIVE NEOPLASMS — additional mutations in PMF"},{"id":"khoury-2022-leukemia-36-1703-C0018","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["BCR","ABL1"],"diseases":["CNL"],"text":"According to WHO 5th Edition 2022, chronic neutrophilic leukaemia is a BCR::ABL1-negative MPN characterized by sustained peripheral-blood neutrophilia with WBC ≥25 × 10^9/L and ≥80% segmented neutrophils and bands, bone-marrow hypercellularity due to neutrophilic granulocyte proliferation, and hepatosplenomegaly.","locator":"MYELOPROLIFERATIVE NEOPLASMS — CNL definition"},{"id":"khoury-2022-leukemia-36-1703-C0019","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["CEL"],"text":"According to WHO 5th Edition 2022, chronic eosinophilic leukaemia is defined by sustained clonal proliferation of morphologically abnormal eosinophils and eosinophil precursors producing persistent hypereosinophilia in blood and marrow. Sustained hypereosinophilia requires ≥4 weeks; both clonality and abnormal bone-marrow morphology are required; increased blasts no longer substitute for clonality; and the former “not otherwise specified” qualifier is omitted.","locator":"MYELOPROLIFERATIVE NEOPLASMS — CEL definition"},{"id":"khoury-2022-leukemia-36-1703-C0023","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["MPN-U"],"text":"According to WHO 5th Edition 2022, MPN-U (MPN-NOS) is reserved for cases with clinical, laboratory, morphologic and molecular features of MPN that either fail criteria for a specific MPN type or overlap distinct MPN types.","locator":"MYELOPROLIFERATIVE NEOPLASMS — MPN-NOS"},{"id":"khoury-2022-leukemia-36-1703-C0024","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["KMT2A"],"diseases":["JMML"],"text":"According to WHO 5th Edition 2022, JMML diagnosis integrates clinical, laboratory and molecular criteria. Updated criteria exclude KMT2A rearrangements, no longer use monosomy 7 as a cytogenetic diagnostic criterion, and emphasize molecular studies demonstrating RAS-pathway activation.","locator":"MYELOPROLIFERATIVE NEOPLASMS — JMML diagnostic updates"},{"id":"khoury-2022-leukemia-36-1703-C0027","paper":"khoury-2022-leukemia-36-1703","category":"prognosis","tier":"restated secondary","genes":["PTPN11"],"diseases":["JMML"],"text":"JMML initiated by somatic PTPN11 mutation is described as among the most aggressive genetic types.","locator":"MYELOPROLIFERATIVE NEOPLASMS — JMML genetic risk"},{"id":"khoury-2022-leukemia-36-1703-C0028","paper":"khoury-2022-leukemia-36-1703","category":"prognosis","tier":"restated secondary","genes":["NF1"],"diseases":["JMML"],"text":"JMML associated with germline pathogenic NF1 variants is described as among the most aggressive genetic types.","locator":"MYELOPROLIFERATIVE NEOPLASMS — JMML genetic risk"},{"id":"khoury-2022-leukemia-36-1703-C0029","paper":"khoury-2022-leukemia-36-1703","category":"prognosis","tier":"restated secondary","genes":["CBL"],"diseases":["JMML"],"text":"Some JMML cases associated with pathogenic germline CBL variants can undergo spontaneous remission.","locator":"MYELOPROLIFERATIVE NEOPLASMS — JMML genetic risk"},{"id":"khoury-2022-leukemia-36-1703-C0030","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["KIT"],"diseases":["mastocytosis"],"text":"According to WHO 5th Edition 2022, revised minor diagnostic criteria for systemic mastocytosis include any KIT mutation causing ligand-independent activation, CD30 expression, and basal serum tryptase >20 ng/mL; the tryptase value should be adjusted in hereditary alpha-tryptasaemia.","locator":"MASTOCYTOSIS — systemic mastocytosis minor criteria"},{"id":"khoury-2022-leukemia-36-1703-C0033","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["KIT"],"diseases":["mastocytosis"],"text":"According to WHO 5th Edition 2022, KIT p.D816V with VAF ≥10% in bone-marrow cells or peripheral-blood leukocytes qualifies as a B-finding in systemic mastocytosis.","locator":"MASTOCYTOSIS — B-finding"},{"id":"khoury-2022-leukemia-36-1703-C0034","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["mastocytosis"],"text":"According to WHO 5th Edition 2022, bone marrow mastocytosis is a systemic mastocytosis subtype characterized by absence of skin lesions and B-findings and basal serum tryptase <125 ng/mL.","locator":"MASTOCYTOSIS — bone marrow mastocytosis subtype"},{"id":"khoury-2022-leukemia-36-1703-C0035","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["MDS"],"text":"According to WHO 5th Edition 2022, the term “myelodysplastic neoplasms,” abbreviated MDS, replaces “myelodysplastic syndromes.” MDS is defined as a clonal haematopoietic neoplasm with cytopenia(s) and morphologic dysplasia, with a recommended dysplasia threshold of ≥10% in a lineage.","locator":"MYELODYSPLASTIC NEOPLASMS — core definition and dysplasia threshold"},{"id":"khoury-2022-leukemia-36-1703-C0036","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["SF3B1","TP53"],"diseases":["MDS"],"text":"According to WHO 5th Edition 2022, MDS with low blasts and isolated 5q deletion requires <5% bone-marrow blasts and <2% peripheral-blood blasts, with 5q deletion alone or with one additional abnormality other than monosomy 7 or 7q deletion. An SF3B1 mutation or a TP53 mutation that is not multi-hit does not by itself override the MDS-5q diagnosis.","locator":"MYELODYSPLASTIC NEOPLASMS — MDS-5q Table 3"},{"id":"khoury-2022-leukemia-36-1703-C0037","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["SF3B1"],"diseases":["MDS"],"text":"According to WHO 5th Edition 2022, MDS with low blasts and SF3B1 mutation is a genetically defined MDS type in which 5q deletion, monosomy 7 and complex karyotype are exclusionary. Detection of ≥15% ring sideroblasts may substitute for an SF3B1 mutation; for SF3B1-wild-type cases with ≥15% ring sideroblasts, “MDS with low blasts and ring sideroblasts” is an acceptable alternative term.","locator":"MYELODYSPLASTIC NEOPLASMS — MDS-SF3B1 Table 3"},{"id":"khoury-2022-leukemia-36-1703-C0039","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["TP53"],"diseases":["MDS"],"text":"According to WHO 5th Edition 2022, MDS with biallelic TP53 inactivation requires <20% blasts in blood and marrow plus either ≥2 TP53 mutations or one TP53 mutation with TP53 copy-number loss or copy-neutral loss of heterozygosity. Two or more TP53 mutations can generally be considered multi-hit status. MDS-biTP53 supersedes MDS-5q and MDS-SF3B1 in the WHO5 genetic hierarchy.","locator":"MYELODYSPLASTIC NEOPLASMS — MDS-biTP53 Table 3"},{"id":"khoury-2022-leukemia-36-1703-C0044","paper":"khoury-2022-leukemia-36-1703","category":"biomarker","tier":"guideline criterion","genes":["TP53"],"diseases":["MDS"],"text":"According to WHO 5th Edition 2022, clinical assessment of biallelic TP53 alteration in MDS uses sequencing covering at least TP53 exons 4–11, generally coupled with assessment of TP53 copy-number status; copy loss may also be inferred by next-generation sequencing.","locator":"MYELODYSPLASTIC NEOPLASMS — TP53 biallelic-status testing"},{"id":"khoury-2022-leukemia-36-1703-C0045","paper":"khoury-2022-leukemia-36-1703","category":"biomarker","tier":"guideline criterion","genes":["TP53"],"diseases":["MDS"],"text":"In MDS, WHO 5th Edition 2022 notes that TP53 VAF ≥50% may be regarded as presumptive, but not definitive, evidence of trans-allelic copy loss or copy-neutral loss of heterozygosity when a constitutional TP53 variant has been excluded.","locator":"MYELODYSPLASTIC NEOPLASMS — TP53 allelic-state inference"},{"id":"khoury-2022-leukemia-36-1703-C0047","paper":"khoury-2022-leukemia-36-1703","category":"prognosis","tier":"restated secondary","genes":["TP53"],"diseases":["MDS"],"text":"MDS with biallelic TP53 inactivation is regarded as very high risk in IPSS-R.","locator":"MYELODYSPLASTIC NEOPLASMS — MDS-biTP53 risk"},{"id":"khoury-2022-leukemia-36-1703-C0049","paper":"khoury-2022-leukemia-36-1703","category":"treatment","tier":"restated secondary","genes":["TP53"],"diseases":["MDS"],"text":"Published data summarized by the WHO5 paper suggest that MDS with biallelic TP53 inactivation may be regarded as AML-equivalent for therapeutic considerations.","locator":"MYELODYSPLASTIC NEOPLASMS — MDS-biTP53 therapeutic equivalence"},{"id":"khoury-2022-leukemia-36-1703-C0050","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["MDS"],"text":"According to WHO 5th Edition 2022, hypoplastic MDS is a distinct MDS type defined by bone-marrow cellularity ≤25%, adjusted for age.","locator":"MYELODYSPLASTIC NEOPLASMS — hypoplastic MDS"},{"id":"khoury-2022-leukemia-36-1703-C0051","paper":"khoury-2022-leukemia-36-1703","category":"treatment","tier":"restated secondary","genes":["GATA2","DDX41"],"diseases":["MDS","AML"],"text":"Patients with germline pathogenic GATA2 or DDX41 variants who have hypoplastic marrow and evolve to MDS or AML are described as not responding to immunosuppressive treatment.","locator":"MYELODYSPLASTIC NEOPLASMS — hypoplastic marrow with germline predisposition"},{"id":"khoury-2022-leukemia-36-1703-C0053","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["MDS"],"text":"According to WHO 5th Edition 2022, distinction between single-lineage and multilineage dysplasia is optional rather than disease-type defining in MDS.","locator":"MYELODYSPLASTIC NEOPLASMS — lineage dysplasia terminology"},{"id":"khoury-2022-leukemia-36-1703-C0054","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["BCR","ABL1","CEBPA"],"diseases":["MDS","AML"],"text":"According to WHO 5th Edition 2022, a 20% blast cutoff is retained to delineate MDS from AML, but most AML types with defining genetic abnormalities may be diagnosed below 20% blasts. AML with BCR::ABL1 and AML with CEBPA mutation remain exceptions requiring ≥20% blasts. When a genetically defined AML is diagnosed below 20%, morphologic and molecular findings must be correlated to establish that the defining abnormality is driving the disease.","locator":"MYELODYSPLASTIC NEOPLASMS — MDS/AML blast boundary"},{"id":"khoury-2022-leukemia-36-1703-C0055","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["MDS"],"text":"According to WHO 5th Edition 2022, childhood MDS with low blasts replaces the former term refractory cytopenia of childhood and is defined by <5% bone-marrow blasts and <2% peripheral-blood blasts. It comprises hypocellular and NOS subtypes, and diagnosis requires exclusion of non-neoplastic causes of cytopenia, bone-marrow failure syndromes and germline pathogenic variants.","locator":"MYELODYSPLASTIC NEOPLASMS — childhood MDS-LB exclusion prerequisite"},{"id":"khoury-2022-leukemia-36-1703-C0057","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["MDS"],"text":"According to WHO 5th Edition 2022, childhood MDS with increased blasts is defined by 5–19% bone-marrow blasts or 2–19% peripheral-blood blasts.","locator":"MYELODYSPLASTIC NEOPLASMS — childhood MDS-IB blast criteria"},{"id":"khoury-2022-leukemia-36-1703-C0059","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["JAK2","CALR","MPL"],"diseases":["CMML"],"text":"According to WHO 5th Edition 2022, CMML requires all four prerequisite criteria: persistent absolute peripheral-blood monocytosis ≥0.5 × 10^9/L and relative monocytosis ≥10%; <20% blasts/blast equivalents in blood and marrow; absence of diagnostic criteria for CML or another MPN; and absence of a myeloid/lymphoid neoplasm with a tyrosine-kinase fusion. Supporting criteria are dysplasia in ≥1 myeloid lineage, with ≥10% of cells affected; an acquired clonal cytogenetic or molecular abnormality; and abnormal monocyte partitioning with >94% classical monocytes in the absence of active autoimmune/systemic inflammatory disease. With monocytosis ≥1 × 10^9/L, at least one supporting criterion is required; with monocytosis ≥0.5 but <1 × 10^9/L, both dysplasia and clonality are required. A prior MPN excludes CMML; MPN-type marrow features and/or a high burden of JAK2, CALR or MPL mutations support MPN with monocytosis rather than CMML.","locator":"MYELODYSPLASTIC/MYELOPROLIFERATIVE NEOPLASMS — CMML prerequisite monocytosis"},{"id":"khoury-2022-leukemia-36-1703-C0068","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["CMML"],"text":"According to WHO 5th Edition 2022, CMML is subtyped as myelodysplastic CMML when WBC <13 × 10^9/L and myeloproliferative CMML when WBC ≥13 × 10^9/L. Blast-based subgrouping comprises CMML-1 with <5% blasts/promonocytes in blood and <10% in marrow and CMML-2 with 5–19% in blood and 10–19% in marrow; CMML-0 is no longer recognized.","locator":"MYELODYSPLASTIC/MYELOPROLIFERATIVE NEOPLASMS — CMML WBC subtypes"},{"id":"khoury-2022-leukemia-36-1703-C0072","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["aCML"],"text":"According to WHO 5th Edition 2022, atypical chronic myeloid leukaemia is renamed MDS/MPN with neutrophilia.","locator":"MYELODYSPLASTIC/MYELOPROLIFERATIVE NEOPLASMS — MDS/MPN with neutrophilia terminology"},{"id":"khoury-2022-leukemia-36-1703-C0073","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["SF3B1"],"diseases":["MDS/MPN-SF3B1-T"],"text":"According to WHO 5th Edition 2022, MDS/MPN with ring sideroblasts and thrombocytosis is redefined on the basis of SF3B1 mutation and renamed MDS/MPN with SF3B1 mutation and thrombocytosis. For SF3B1-wild-type cases with ≥15% ring sideroblasts, MDS/MPN with ring sideroblasts and thrombocytosis remains acceptable terminology.","locator":"MYELODYSPLASTIC/MYELOPROLIFERATIVE NEOPLASMS — MDS/MPN-SF3B1-T"},{"id":"khoury-2022-leukemia-36-1703-C0075","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["AML"],"text":"According to WHO 5th Edition 2022, AML is organized into two families: AML with defining genetic abnormalities and AML defined by differentiation. The term AML, NOS is no longer applied to the differentiation-defined family.","locator":"ACUTE MYELOID LEUKAEMIA — overall WHO5 grouping"},{"id":"khoury-2022-leukemia-36-1703-C0078","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["PML","RARA","RUNX1","RUNX1T1","
