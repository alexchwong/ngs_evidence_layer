<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cards">
<meta name="theme-color" content="#efeef4">
<title>Evidence cards</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%23191825'/%3E%3Crect x='40' y='46' width='100' height='24' rx='4' fill='%23a31e63'/%3E%3Crect x='40' y='82' width='100' height='16' rx='4' fill='%23efeef4'/%3E%3Crect x='40' y='110' width='72' height='16' rx='4' fill='%236e6a82'/%3E%3C/svg%3E">
<style>
  :root{
    --paper:#efeef4;
    --panel:#f7f6fa;
    --card:#fff;
    --ink:#191825;
    --muted:#6e6a82;
    --rule:#d8d5e3;
    --azure:#2b4c8c;
    --eosin:#a31e63;
    --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
    --display:"New York",Georgia,serif;
    --cat-diagnosis:#4a3f8f;
    --cat-prognosis:#a31e63;
    --cat-treatment:#1d6f63;
    --cat-biomarker:#2b4c8c;
    --cat-germline:#8a5a12;
    --bar:calc(56px + env(safe-area-inset-bottom));
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  /* author display rules outrank the UA sheet's [hidden]; restate it with weight */
  [hidden]{display:none!important}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);color:var(--ink);font-family:var(--sans);
    font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none;
  }
  body.locked{overflow:hidden}
  button{font:inherit;color:inherit;border:0;background:none;padding:0}
  input{font-size:16px} /* keeps iOS from zooming on focus */

  /* ---------- masthead + search ---------- */
  header{
    position:sticky;top:0;z-index:20;background:var(--paper);
    border-bottom:1px solid var(--rule);
    padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
  }
  .titlerow{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  .wordmark{font-family:var(--display);font-size:22px;font-weight:600;margin:0;letter-spacing:-.01em}
  .wordmark em{font-style:italic;color:var(--eosin)}
  .provenance{font-family:var(--mono);font-size:10.5px;color:var(--muted);text-align:right}
  .searchrow{display:flex;gap:8px;margin-top:10px}
  .text-search{
    flex:1;min-width:0;border:1px solid var(--rule);background:var(--card);border-radius:9px;
    padding:9px 12px;font-family:var(--sans);color:var(--ink);-webkit-appearance:none;
  }
  .text-search::placeholder{color:#9a96ab}

  /* ---------- active filter chips ---------- */
  .chips{display:flex;gap:6px;overflow-x:auto;padding:9px 16px 0;
    -webkit-overflow-scrolling:touch;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chips:empty{display:none}
  .chip{
    flex:none;display:flex;align-items:center;gap:6px;background:var(--card);
    border:1px solid var(--rule);border-radius:999px;padding:5px 10px;
    font-size:13px;max-width:60vw;
  }
  .chip .txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .chip .x{font-family:var(--mono);font-size:12px;color:var(--eosin);flex:none}
  .chip.clearall{color:var(--eosin);border-style:dashed}

  /* ---------- results ---------- */
  main{padding:10px 12px calc(var(--bar) + 28px)}
  ol.cards{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
  li.card{
    background:var(--card);border:1px solid var(--rule);border-radius:11px;
    border-left:4px solid var(--spine,var(--rule));overflow:hidden;
  }
  .card-head{
    display:block;width:100%;text-align:left;padding:11px 13px;cursor:pointer;
  }
  .card-meta{
    display:flex;align-items:center;gap:8px;margin-bottom:5px;
    font-family:var(--mono);font-size:10.5px;color:var(--muted);
  }
  .card-meta .cat{color:var(--spine,var(--muted));text-transform:uppercase;letter-spacing:.07em}
  .card-meta .paper{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
  .card-head p{margin:0;font-size:15.5px;line-height:1.5}
  li.card mark{background:#f7dbe8;color:inherit;border-radius:2px;padding:0 1px}
  .detail{border-top:1px solid var(--rule);padding:10px 13px 12px;background:var(--panel);font-size:13.5px}
  .detail dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px}
  .detail dt{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;
    text-transform:uppercase;color:var(--muted);padding-top:2px}
  .detail dd{margin:0;overflow-wrap:anywhere}
  .detail .cid{font-family:var(--mono);font-size:11.5px}
  .tagbtn{
    display:inline-block;border:1px solid var(--rule);background:var(--card);
    border-radius:999px;padding:2px 9px;margin:0 4px 4px 0;font-size:12.5px;
  }
  .tagbtn[aria-pressed="true"]{border-color:var(--eosin);color:var(--eosin)}
  .empty{padding:48px 16px;text-align:center;color:var(--muted)}
  .empty h3{font-family:var(--display);font-size:19px;color:var(--ink);margin:0 0 6px}
  .more{
    display:block;width:100%;margin-top:12px;padding:12px;background:var(--card);
    border:1px solid var(--rule);border-radius:11px;font-family:var(--mono);font-size:12.5px;
  }

  /* ---------- bottom bar ---------- */
  .bar{
    position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;align-items:center;
    gap:12px;padding:8px 16px calc(8px + env(safe-area-inset-bottom));
    background:rgba(239,238,244,.93);backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);border-top:1px solid var(--rule);
  }
  .tally{flex:1;font-family:var(--mono);font-size:12px;color:var(--muted)}
  .tally b{color:var(--ink);font-weight:600}
  .filterbtn{
    background:var(--ink);color:#fff;border-radius:999px;padding:10px 20px;
    font-size:14.5px;font-weight:600;min-height:44px;
  }
  .filterbtn .badge{
    display:inline-block;margin-left:7px;background:var(--eosin);border-radius:999px;
    padding:1px 7px;font-family:var(--mono);font-size:11px;
  }

  /* ---------- filter sheet ---------- */
  .scrim{
    position:fixed;inset:0;z-index:40;background:rgba(25,24,37,.36);
    opacity:0;pointer-events:none;transition:opacity .2s;
  }
  .scrim.open{opacity:1;pointer-events:auto}
  .sheet{
    position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--paper);
    border-radius:16px 16px 0 0;max-height:88vh;display:flex;flex-direction:column;
    transform:translateY(102%);transition:transform .24s cubic-bezier(.32,.72,0,1);
    box-shadow:0 -8px 40px rgba(25,24,37,.18);
  }
  .sheet.open{transform:translateY(0)}
  .grabber{width:38px;height:5px;border-radius:3px;background:var(--rule);margin:8px auto 2px;flex:none}
  .sheet-head{display:flex;align-items:center;justify-content:space-between;
    padding:6px 16px 10px;flex:none}
  .sheet-head h2{font-family:var(--display);font-size:19px;margin:0;font-weight:600}
  .sheet-head button{font-size:15px;color:var(--azure);padding:8px;margin:-8px}
  .tabs{display:flex;gap:6px;overflow-x:auto;padding:0 16px 10px;flex:none;
    scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{
    flex:none;border:1px solid var(--rule);background:var(--card);border-radius:999px;
    padding:7px 14px;font-size:13.5px;min-height:38px;
  }
  .tab[aria-selected="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
  .tab .n{font-family:var(--mono);font-size:11px;color:var(--eosin);margin-left:5px}
  .tab[aria-selected="true"] .n{color:#f0a8c9}
  .facet-search{
    width:calc(100% - 32px);margin:0 16px 8px;border:1px solid var(--rule);
    background:var(--card);border-radius:9px;padding:9px 12px;-webkit-appearance:none;
  }
  .options{list-style:none;margin:0;padding:0 16px calc(20px + env(safe-area-inset-bottom));
    overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1}
  .opt{
    width:100%;display:flex;gap:10px;align-items:center;text-align:left;
    padding:11px 4px;border-bottom:1px solid var(--rule);min-height:46px;
  }
  .opt .box{
    width:20px;height:20px;flex:none;border:1.5px solid var(--rule);border-radius:5px;
    background:var(--card);font-family:var(--mono);font-size:12px;line-height:17px;
    text-align:center;color:#fff;
  }
  .opt[aria-pressed="true"] .box{background:var(--eosin);border-color:var(--eosin)}
  .opt[aria-pressed="true"] .label{font-weight:600;color:var(--eosin)}
  .opt .label{flex:1;min-width:0;overflow-wrap:anywhere;font-size:15px}
  .opt .count{font-family:var(--mono);font-size:12px;color:var(--muted);flex:none}
  .opt[disabled]{opacity:.32}
  .swatch{width:9px;height:9px;border-radius:50%;flex:none}
  .sheet-foot{
    flex:none;display:flex;gap:10px;padding:10px 16px calc(10px + env(safe-area-inset-bottom));
    border-top:1px solid var(--rule);background:var(--panel);
  }
  .sheet-foot button{flex:1;border-radius:9px;padding:12px;font-size:15px;min-height:46px}
  .sheet-foot .clear{border:1px solid var(--rule);background:var(--card)}
  .sheet-foot .apply{background:var(--ink);color:#fff;font-weight:600}

  :focus-visible{outline:2px solid var(--eosin);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  @media (prefers-color-scheme:dark){
    :root{
      --paper:#151420;--panel:#1d1b2a;--card:#232135;--ink:#eceaf4;--muted:#9a95b0;
      --rule:#35324a;--eosin:#f078ac;--azure:#8fb0ee;
      --cat-diagnosis:#a396f0;--cat-prognosis:#f078ac;--cat-treatment:#4fbfa8;
      --cat-biomarker:#8fb0ee;--cat-germline:#d9a44e;
    }
    .bar{background:rgba(21,20,32,.93)}
    li.card mark{background:#5c2442}
    .opt .box{color:#151420}
  }
</style>
</head>
<body>
<header>
  <div class="titlerow">
    <h1 class="wordmark">Evidence <em>cards</em></h1>
    <div class="provenance" id="provenance"></div>
  </div>
  <div class="searchrow">
    <input class="text-search" id="textsearch" type="search" enterkeyhint="search"
           autocapitalize="off" autocorrect="off" spellcheck="false"
           placeholder="Search interpretations" aria-label="Search interpretation text">
  </div>
</header>

<div class="chips" id="chips"></div>

<main>
  <ol class="cards" id="cards"></ol>
  <button class="more" id="more" type="button" hidden></button>
</main>

<div class="bar">
  <div class="tally" id="tally"></div>
  <button class="filterbtn" id="openfilters" type="button">Filters<span class="badge" id="badge" hidden></span></button>
</div>

<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Filters">
  <div class="grabber"></div>
  <div class="sheet-head">
    <h2>Filters</h2>
    <button type="button" id="closefilters">Done</button>
  </div>
  <div class="tabs" id="tabs" role="tablist"></div>
  <input class="facet-search" id="facetsearch" type="search"
         autocapitalize="off" autocorrect="off" spellcheck="false" hidden>
  <ul class="options" id="options"></ul>
  <div class="sheet-foot">
    <button type="button" class="clear" id="clearall">Clear all</button>
    <button type="button" class="apply" id="applyfilters">Show results</button>
  </div>
</section>

ents, multihit TP53 is associated with worse overall survival.","locator":"Results: relation between IPSS-M and treatment"},{"id":"bernard-2022-nejm-evidence-1-na-C0016","paper":"bernard-2022-nejm-evidence-1-na","category":"treatment","tier":"univariable or descriptive","genes":["TP53"],"diseases":["MDS"],"text":"In MDS undergoing stem cell transplantation, multihit TP53 is associated with worse overall survival.","locator":"Results: relation between IPSS-M and treatment"},{"id":"bernard-2022-nejm-evidence-1-na-C0017","paper":"bernard-2022-nejm-evidence-1-na","category":"treatment","tier":"univariable or descriptive","genes":["TP53"],"diseases":["MDS"],"text":"In MDS treated with lenalidomide, multihit TP53 is associated with worse overall survival.","locator":"Results: relation between IPSS-M and treatment"},{"id":"bernard-2022-nejm-evidence-1-na-C0018","paper":"bernard-2022-nejm-evidence-1-na","category":"treatment","tier":"univariable or descriptive","genes":["DDX41"],"diseases":["MDS"],"text":"In MDS treated with hypomethylating agents, DDX41 mutation is associated with favorable overall survival; this treatment-specific association requires further investigation in randomized studies.","locator":"Results: relation between IPSS-M and treatment"},{"id":"bernard-2022-nejm-evidence-1-na-C0019","paper":"bernard-2022-nejm-evidence-1-na","category":"treatment","tier":"restated secondary","genes":[],"diseases":["MDS"],"text":"Patients with higher-risk MDS are considered for disease-modifying therapies intended to prolong survival, including hypomethylating agents and allogeneic transplantation.","locator":"Discussion"},{"id":"bernard-2022-nejm-evidence-1-na-C0020","paper":"bernard-2022-nejm-evidence-1-na","category":"prognosis","tier":"multivariable-adjusted","genes":["TP53","KMT2A","FLT3","SF3B1","NPM1","RUNX1","NRAS","ETV6","IDH2","CBL","EZH2","U2AF1","SRSF2","DNMT3A","ASXL1","KRAS"],"diseases":["MDS"],"text":"According to the IPSS-M framework for MDS, multihit TP53, MT2A, DEK::NUP214, inv(3)/t(3;3) involving GATA2 and MECOM, mutated NPM1, and in-frame bZIP CEBPA mutations are AML-defining recurrent abnormalities at ≥10% blasts; BCR::ABL1 requires ≥20% blasts because of overlap with chronic myeloid leukemia.","locator":"AML classification — Changes to the blast thresholds defining AML; Table 1; Figure 1"},{"id":"d-hner-2022-blood-140-1345-C0002","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"guideline criterion","genes":["IRF2BP2","RARA","NPM1","ZBTB16","STAT5B","STAT3","TBL1XR1","FIP1L1","BCOR","BCR","ABL1"],"diseases":["AML","APL"],"text":"Under the 2022 ICC, IRF2BP2::RARA, NPM1::RARA, ZBTB16::RARA, STAT5B::RARA, STAT3::RARA, TBL1XR1::RARA, FIP1L1::RARA, and BCOR::RARA are recognized recurring RARA-rearranged APL entities and, as AML-defining recurrent abnormalities other than BCR::ABL1, establish AML/APL at ≥10% blasts.","locator":"Table 1 footnote † — other recurring RARA translocations; AML classification — Changes to the blast thresholds defining AML; Table 1; Figure 1"},{"id":"d-hner-2022-blood-140-1345-C0003","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"guideline criterion","genes":["AFF1","KMT2A","AFDN","MLLT10","TET1","ELL","MLLT1"],"diseases":["AML"],"text":"Under the 2022 ICC, AFF1::KMT2A, AFDN::KMT2A, MLLT10::KMT2A, TET1::KMT2A, KMT2A::ELL, and KMT2A::MLLT1 are recognized recurring KMT2A-rearranged AML entities and establish AML at ≥10% blasts.","locator":"Table 1 footnote ‡ — other recurring KMT2A translocations; AML classification — Changes to the blast thresholds defining AML; Table 1; Figure 1"},{"id":"d-hner-2022-blood-140-1345-C0004","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"guideline criterion","genes":["MECOM","MYC","ETV6","RUNX1"],"diseases":["AML"],"text":"Under the 2022 ICC, t(2;3) involving MECOM, MYC/MECOM t(3;8), ETV6::MECOM, and MECOM::RUNX1 are recognized recurring MECOM-rearranged AML entities and establish AML at ≥10% blasts.","locator":"Table 1 footnote § — other recurring MECOM translocations; AML classification — Changes to the blast thresholds defining AML; Table 1; Figure 1"},{"id":"d-hner-2022-blood-140-1345-C0005","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"guideline criterion","genes":["PRDM16","RPN1","RBM15","MRTFA","NPM1","MLF1","NUP98","NSD1","ETV6","MNX1","KAT6A","CREBBP","PICALM","MLLT10","KMD5A","FUS","ERG","RUNX1","CBFA2T3","GLIS2"],"diseases":["AML"],"text":"Under the 2022 ICC, PRDM16::RPN1, RBM15::MRTFA, NPM1::MLF1, NUP98::NSD1, ETV6::MNX1, KAT6A::CREBBP, PICALM::MLLT10, NUP98::KMD5A, FUS::ERG, RUNX1::CBFA2T3, CBFA2T3::GLIS2, and other NUP98 rearrangements are listed as rare recurring AML-defining genetic entities and establish AML at ≥10% blasts.","locator":"Table 1 footnote jj — other rare recurring translocations; AML classification — Changes to the blast thresholds defining AML; Table 1; Figure 1"},{"id":"d-hner-2022-blood-140-1345-C0006","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"guideline criterion","genes":["TP53"],"diseases":["AML","MDS/AML"],"text":"Under the 2022 ICC, when higher-priority recurrent AML-defining abnormalities are absent, a pathogenic somatic TP53 mutation with variant allele fraction ≥10%, with or without loss of the wild-type allele, defines TP53-mutated AML at ≥20% blasts; the corresponding 10%-19% blast category is MDS/AML.","locator":"AML classification — AML with mutated TP53; Table 1; Figure 1; Table 1; Figure 1; AML classification — remaining AML cases"},{"id":"d-hner-2022-blood-140-1345-C0007","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"guideline criterion","genes":["TP53","ASXL1","BCOR","EZH2","RUNX1","SF3B1","SRSF2","STAG2","U2AF1","ZRSR2"],"diseases":["AML","MDS","MDS/AML"],"text":"Under the 2022 ICC, when higher-priority recurrent AML-defining abnormalities and TP53-mutated disease are absent, pathogenic mutations in ASXL1, BCOR, EZH2, RUNX1, SF3B1, SRSF2, STAG2, U2AF1, or ZRSR2 define AML with myelodysplasia-related gene mutations at ≥20% blasts, irrespective of prior MDS; the corresponding 10%-19% blast category is MDS/AML.","locator":"AML classification — AML with myelodysplasia-related gene mutations; Table 1; Figure 1; Table 1; Figure 1; AML classification — remaining AML cases"},{"id":"d-hner-2022-blood-140-1345-C0008","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["AML","MDS/AML"],"text":"Under the 2022 ICC, when higher-priority AML-defining categories are absent, del(5q)/t(5q)/add(5q), monosomy 7/del(7q), trisomy 8, del(12p)/t(12p)/add(12p), i(17q), monosomy 17/add(17p)/del(17p), del(20q), idic(X)(q13), or a complex karyotype of ≥3 unrelated chromosome abnormalities (excluding hyperdiploid karyotypes with ≥3 trisomies/polysomies and no structural abnormality) defines AML with myelodysplasia-related cytogenetic abnormality at ≥20% blasts and MDS/AML at 10%-19% blasts.","locator":"Table 1 footnote ** — AML with myelodysplasia-related cytogenetic abnormalities; Table 1; Figure 1; AML classification — remaining AML cases"},{"id":"d-hner-2022-blood-140-1345-C0009","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["AML"],"text":"Under the 2022 ICC, prior chemotherapy, radiotherapy, or immune intervention for a nonmyeloid neoplasm is recorded as a therapy-related diagnostic qualifier to the genetically defined AML category rather than as a separate AML entity.","locator":"AML classification — Antecedent AML history; Table 1"},{"id":"d-hner-2022-blood-140-1345-C0010","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["AML","MDS"],"text":"Under the 2022 ICC, a prior MDS is appended as a diagnostic qualifier to the AML category only when it was established by standard diagnostics more than 3 months before AML diagnosis.","locator":"AML classification — Antecedent AML history; Table 1"},{"id":"d-hner-2022-blood-140-1345-C0011","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"guideline criterion","genes":["TP53"],"diseases":["AML"],"text":"Under the 2022 ICC, the AML classification hierarchy is: recurrent AML-defining genetic abnormality first; otherwise TP53-mutated AML; otherwise AML with myelodysplasia-related gene mutations; otherwise AML with myelodysplasia-related cytogenetic abnormalities.","locator":"Figure 1 — hierarchical classification of AML; AML classification — hierarchy; Figure 1"},{"id":"d-hner-2022-blood-140-1345-C0012","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["MDS/MPN","CMML"],"text":"Under the 2022 ICC, for a patient with a prior MDS/MPN such as CMML, the MDS/MPN diagnosis is retained until blasts or blast equivalents reach ≥20%.","locator":"Figure 1 legend"},{"id":"d-hner-2022-blood-140-1345-C0013","paper":"d-hner-2022-blood-140-1345","category":"prognosis","tier":"guideline criterion","genes":["RUNX1","RUNX1T1","CBFB","MYH11","KIT","FLT3"],"diseases":["AML"],"text":"Under the 2022 ELN genetic risk classification, which is based mainly on intensively treated patients, RUNX1::RUNX1T1 and CBFB::MYH11 core-binding-factor AML are classified as favorable risk, and concurrent KIT and/or FLT3 mutation does not change that category.","locator":"2022 European LeukemiaNet genetic risk classification at diagnosis; Table 6"},{"id":"d-hner-2022-blood-140-1345-C0014","paper":"d-hner-2022-blood-140-1345","category":"prognosis","tier":"guideline criterion","genes":["NPM1","FLT3"],"diseases":["AML"],"text":"Under the 2022 ELN genetic risk classification, which is based mainly on intensively treated patients, NPM1-mutated AML without FLT3-ITD is classified as favorable risk unless adverse-risk cytogenetic abnormalities are present.","locator":"2022 European LeukemiaNet genetic risk classification at diagnosis; Table 6"},{"id":"d-hner-2022-blood-140-1345-C0015","paper":"d-hner-2022-blood-140-1345","category":"prognosis","tier":"guideline criterion","genes":["CEBPA"],"diseases":["AML"],"text":"Under the 2022 ELN genetic risk classification, which is based mainly on intensively treated patients, in-frame bZIP CEBPA-mutated AML is classified as favorable risk whether the CEBPA mutation is monoallelic or biallelic.","locator":"2022 European LeukemiaNet genetic risk classification at diagnosis; Table 6"},{"id":"d-hner-2022-blood-140-1345-C0016","paper":"d-hner-2022-blood-140-1345","category":"prognosis","tier":"guideline criterion","genes":["NPM1","FLT3"],"diseases":["AML"],"text":"Under the 2022 ELN genetic risk classification, which is based mainly on intensively treated patients, NPM1-mutated AML with FLT3-ITD is classified as intermediate risk irrespective of FLT3-ITD allelic ratio when no adverse-risk genetic lesion is present.","locator":"2022 European LeukemiaNet genetic risk classification at diagnosis; Table 6; 2022 European LeukemiaNet genetic risk classification at diagnosis"},{"id":"d-hner-2022-blood-140-1345-C0017","paper":"d-hner-2022-blood-140-1345","category":"prognosis","tier":"guideline criterion","genes":["NPM1","FLT3"],"diseases":["AML"],"text":"Under the 2022 ELN genetic risk classification, which is based mainly on intensively treated patients, NPM1-wild-type AML with FLT3-ITD is classified as intermediate risk irrespective of FLT3-ITD allelic ratio when no adverse-risk genetic lesion is present.","locator":"2022 European LeukemiaNet genetic risk classification at diagnosis; Table 6; 2022 European LeukemiaNet genetic risk classification at diagnosis"},{"id":"d-hner-2022-blood-140-1345-C0018","paper":"d-hner-2022-blood-140-1345","category":"prognosis","tier":"guideline criterion","genes":["MLLT3","KMT2A"],"diseases":["AML"],"text":"Under the 2022 ELN genetic risk classification, which is based mainly on intensively treated patients, AML with t(9;11)/MLLT3::KMT2A is classified as intermediate risk, and this lesion takes precedence over rare concurrent adverse-risk gene mutations.","locator":"2022 European LeukemiaNet genetic risk classification at diagnosis; Table 6"},{"id":"d-hner-2022-blood-140-1345-C0019","paper":"d-hner-2022-blood-140-1345","category":"prognosis","tier":"guideline criterion","genes":["DEK","NUP214"],"diseases":["AML"],"text":"Under the 2022 ELN genetic risk classification, which is based mainly on intensively treated patients, DEK::NUP214 AML is classified as adverse risk.","locator":"2022 European LeukemiaNet genetic risk classification at diagnosis; Table 6"},{"id":"d-hner-2022-blood-140-1345-C0020","paper":"d-hner-2022-blood-140-1345","category":"prognosis","tier":"guideline criterion","genes":["KMT2A","MLLT3"],"diseases":["AML"],"text":"Under the 2022 ELN genetic risk classification, which is based mainly on intensively treated patients, KMT2A-rearranged AML other than t(9;11)/MLLT3::KMT2A, excluding KMT2A partial tandem duplication, is classified as adverse risk.","locator":"2022 European LeukemiaNet genetic risk classification at diagnosis; Table 6"},{"id":"d-hner-2022-blood-140-1345-C0021","paper":"d-hner-2022-blood-140-1345","category":"prognosis","tier":"guideline criterion","genes":["BCR","ABL1"],"diseases":["AML"],"text":"Under the 2022 ELN genetic risk classification, which is based mainly on intensively treated patients, BCR::ABL1-positive AML is classified as adverse risk.","locator":"2022 European LeukemiaNet genetic risk classification at diagnosis; Table 6"},{"id":"d-hner-2022-blood-140-1345-C0022","paper":"d-hner-2022-blood-140-1345","category":"prognosis","tier":"guideline criterion","genes":["KAT6A","CREBBP"],"diseases":["AML"],"text":"Under the 2022 ELN genetic risk classification, which is based mainly on intensively treated patients, KAT6A::CREBBP AML is classified as adverse risk.","locator":"2022 European LeukemiaNet genetic risk classification at diagnosis; Table 6"},{"id":"d-hner-2022-blood-140-1345-C0023","paper":"d-hner-2022-blood-140-1345","category":"prognosis","tier":"guideline criterion","genes":["GATA2","MECOM"],"diseases":["AML"],"text":"Under the 2022 ELN genetic risk classification, which is based mainly on intensively treated patients, AML with inv(3)/t(3;3) involving GATA2 and MECOM is classified as adverse risk.","locator":"2022 European LeukemiaNet genetic risk classification at diagnosis; Table 6"},{"id":"d-hner-2022-blood-140-1345-C0024","paper":"d-hner-2022-blood-140-1345","category":"prognosis","tier":"guideline criterion","genes":["MECOM"],"diseases":["AML"],"text":"Under the 2022 ELN genetic risk classification, which is based mainly on intensively treated patients, AML with other t(3q26.2;v) MECOM rearrangements is classified as adverse risk.","locator":"2022 European LeukemiaNet genetic risk classification at diagnosis; Table 6"},{"id":"d-hner-2022-blood-140-1345-C0025","paper":"d-hner-2022-blood-140-1345","category":"prognosis","tier":"guideline criterion","genes":["ASXL1","BCOR","EZH2","RUNX1","SF3B1","SRSF2","STAG2","U2AF1","ZRSR2"],"diseases":["AML"],"text":"Under the 2022 ELN genetic risk classification, which is based mainly on intensively treated patients, pathogenic ASXL1, BCOR, EZH2, RUNX1, SF3B1, SRSF2, STAG2, U2AF1, or ZRSR2 mutations are adverse-risk markers in AML, including de novo AML, but should not currently be used as adverse-risk markers when they co-occur with a favorable-risk AML subtype.","locator":"2022 European LeukemiaNet genetic risk classification at diagnosis; Table 6"},{"id":"d-hner-2022-blood-140-1345-C0026","paper":"d-hner-2022-blood-140-1345","category":"prognosis","tier":"guideline criterion","genes":["TP53"],"diseases":["AML"],"text":"Under the 2022 ELN genetic risk classification, which is based mainly on intensively treated patients, TP53 mutation with variant allele fraction ≥10% is an adverse-risk marker in AML irrespective of monoallelic or biallelic status.","locator":"2022 European LeukemiaNet genetic risk classification at diagnosis; Table 6"},{"id":"d-hner-2022-blood-140-1345-C0028","paper":"d-hner-2022-blood-140-1345","category":"prognosis","tier":"guideline criterion","genes":["NPM1"],"diseases":["AML"],"text":"Under the 2022 ELN genetic risk classification, which is based mainly on intensively treated patients, NPM1-mutated AML with adverse-risk cytogenetic abnormalities is classified as adverse risk.","locator":"2022 European LeukemiaNet genetic risk classification at diagnosis; Table 6"},{"id":"d-hner-2022-blood-140-1345-C0029","paper":"d-hner-2022-blood-140-1345","category":"prognosis","tier":"guideline criterion","genes":["IDH1","IDH2","DNMT3A"],"diseases":["AML"],"text":"The 2022 ELN genetic risk classification, which is based mainly on intensively treated patients, does not assign IDH1-, IDH2-, or DNMT3A-mutated AML to a distinct risk group on the available evidence.","locator":"2022 European LeukemiaNet genetic risk classification at diagnosis; Table 6"},{"id":"d-hner-2022-blood-140-1345-C0032","paper":"d-hner-2022-blood-140-1345","category":"biomarker","tier":"guideline criterion","genes":["FLT3"],"diseases":["AML"],"text":"The 2022 ELN recommendations recommend testing for both FLT3 internal tandem duplications and FLT3 tyrosine-kinase-domain mutations at AML diagnosis.","locator":"Diagnostic procedures — Cytogenetic and molecular studies; Table 4 footnote ¶"},{"id":"d-hner-2022-blood-140-1345-C0033","paper":"d-hner-2022-blood-140-1345","category":"biomarker","tier":"guideline criterion","genes":["CEBPA"],"diseases":["AML"],"text":"The 2022 ELN recommendations specify that CEBPA testing in AML should report whether a variant is an in-frame bZIP-region mutation because that molecular definition is used for favorable-risk classification.","locator":"Table 4 footnote #"},{"id":"d-hner-2022-blood-140-1345-C0034","paper":"d-hner-2022-blood-140-1345","category":"biomarker","tier":"guideline criterion","genes":["NPM1","RUNX1","RUNX1T1","CBFB","MYH11"],"diseases":["AML"],"text":"Under the ELN MRD framework incorporated into the 2022 AML recommendations, baseline qPCR or dPCR assessment is recommended in NPM1-mutated, RUNX1::RUNX1T1, and CBFB::MYH11 AML to establish a molecular baseline for subsequent MRD monitoring.","locator":"Diagnostic procedures — Cytogenetic and molecular studies"},{"id":"d-hner-2022-blood-140-1345-C0035","paper":"d-hner-2022-blood-140-1345","category":"biomarker","tier":"guideline criterion","genes":["NPM1","RUNX1","RUNX1T1","CBFB","MYH11"],"diseases":["AML"],"text":"Under the ELN MRD framework incorporated into the 2022 AML recommendations, mutated NPM1, RUNX1::RUNX1T1, and CBFB::MYH11 are robustly validated qPCR targets for molecular MRD monitoring in AML.","locator":"Monitoring of measurable residual disease — Molecular MRD; Table 7"},{"id":"d-hner-2022-blood-140-1345-C0036","paper":"d-hner-2022-blood-140-1345","category":"biomarker","tier":"guideline criterion","genes":["KMT2A","MLLT3","DEK","NUP214","BCR","ABL1","WT1","NPM1"],"diseases":["AML"],"text":"Under the ELN MRD framework incorporated into the 2022 AML recommendations, KMT2A::MLLT3, DEK::NUP214, BCR::ABL1, and WT1 expression can be used as qPCR MRD targets in AML but are less well validated for this role than NPM1 and the core-binding-factor fusion targets.","locator":"Monitoring of measurable residual disease — Molecular MRD; Table 7"},{"id":"d-hner-2022-blood-140-1345-C0037","paper":"d-hner-2022-blood-140-1345","category":"biomarker","tier":"guideline criterion","genes":["DNMT3A","TET2","ASXL1"],"diseases":["AML"],"text":"Under the ELN MRD framework incorporated into the 2022 AML recommendations, DNMT3A, TET2, and ASXL1 mutations consistent with premalignant clonal hematopoiesis should not be interpreted as AML MRD in NGS-based assessment.","locator":"Monitoring of measurable residual disease — Molecular MRD; Table 7 footnote ‡"},{"id":"d-hner-2022-blood-140-1345-C0038","paper":"d-hner-2022-blood-140-1345","category":"biomarker","tier":"guideline criterion","genes":["NPM1","RUNX1","RUNX1T1","CBFB","MYH11"],"diseases":["AML"],"text":"Under the ELN MRD framework incorporated into the 2022 AML recommendations, molecular MRD relapse in NPM1-mutated, RUNX1::RUNX1T1, or CBFB::MYH11 AML assessed by qPCR is defined as conversion from MRD-negative to MRD-positive or a ≥1 log10 rise between two positive samples and should be rapidly confirmed in a second consecutive sample from the same tissue source.","locator":"Table 8 — MRD relapse; Figure 2"},{"id":"d-hner-2022-blood-140-1345-C0039","paper":"d-hner-2022-blood-140-1345","category":"biomarker","tier":"guideline criterion","genes":["NPM1","RUNX1","RUNX1T1","CBFB","MYH11"],"diseases":["AML"],"text":"Under the ELN MRD framework incorporated into the 2022 AML recommendations, after consolidation in NPM1-mutated, RUNX1::RUNX1T1, or CBFB::MYH11 AML, qPCR MRD ≥2% or failure to achieve a 3-4 log transcript reduction is a clinically relevant threshold at which treatment modification, including consideration of allogeneic HCT, may be appropriate.","locator":"Figure 2 — Algorithm of MRD assessment"},{"id":"d-hner-2022-blood-140-1345-C0040","paper":"d-hner-2022-blood-140-1345","category":"biomarker","tier":"guideline criterion","genes":["IDH1","IDH2","FLT3"],"diseases":["AML"],"text":"The 2022 ELN recommendations recommend molecular reassessment at AML relapse for IDH1, IDH2, and FLT3 because actionable abnormalities can emerge or expand and may identify a targeted salvage option.","locator":"Therapy for AML — Relapsed and refractory disease"},{"id":"d-hner-2022-blood-140-1345-C0041","paper":"d-hner-2022-blood-140-1345","category":"biomarker","tier":"guideline criterion","genes":["IDH1"],"diseases":["AML"],"text":"The 2022 ELN recommendations recommend rapid IDH1 mutation screening at initial diagnosis in older patients with AML to identify candidates for ivosidenib-based therapy.","locator":"Therapy for AML — patients not considered candidates for intensive therapy"},{"id":"d-hner-2022-blood-140-1345-C0042","paper":"d-hner-2022-blood-140-1345","category":"germline","tier":"guideline criterion","genes":["CHEK2","DDX41"],"diseases":[],"text":"In the 2022 ELN recommendations, CHEK2 I200T and truncating DDX41 variants identified on tumor profiling are considered overwhelmingly likely to be germline.","locator":"Table 3 footnote"},{"id":"d-hner-2022-blood-140-1345-C0044","paper":"d-hner-2022-blood-140-1345","category":"germline","tier":"guideline criterion","genes":["CEBPA"],"diseases":[],"text":"Germline pathogenic or likely pathogenic CEBPA variants are recognized as a myeloid-neoplasm predisposition disorder.","locator":"Table 2 — Myeloid neoplasms with germline predisposition"},{"id":"d-hner-2022-blood-140-1345-C0045","paper":"d-hner-2022-blood-140-1345","category":"germline","tier":"guideline criterion","genes":["DDX41"],"diseases":[],"text":"Germline pathogenic or likely pathogenic DDX41 variants are recognized as a myeloid-neoplasm predisposition disorder.","locator":"Table 2 — Myeloid neoplasms with germline predisposition"},{"id":"d-hner-2022-blood-140-1345-C0046","paper":"d-hner-2022-blood-140-1345","category":"germline","tier":"guideline criterion","genes":["TP53"],"diseases":[],"text":"Germline pathogenic or likely pathogenic TP53 variants causing Li-Fraumeni syndrome are associated with predisposition to myeloid neoplasia.","locator":"Table 2 — Myeloid neoplasms with germline predisposition"},{"id":"d-hner-2022-blood-140-1345-C0047","paper":"d-hner-2022-blood-140-1345","category":"germline","tier":"guideline criterion","genes":["RUNX1","ANKRD26","ETV6"],"diseases":[],"text":"Germline pathogenic or likely pathogenic RUNX1, ANKRD26, and ETV6 variants are recognized myeloid-neoplasm predisposition disorders associated with a preexisting platelet disorder.","locator":"Table 2 — Myeloid neoplasms with germline predisposition"},{"id":"d-hner-2022-blood-140-1345-C0048","paper":"d-hner-2022-blood-140-1345","category":"germline","tier":"guideline criterion","genes":["GATA2"],"diseases":[],"text":"Germline pathogenic or likely pathogenic GATA2 variants are recognized as a myeloid-neoplasm predisposition disorder.","locator":"Table 2 — Myeloid neoplasms with germline predisposition"},{"id":"d-hner-2022-blood-140-1345-C0049","paper":"d-hner-2022-blood-140-1345","category":"germline","tier":"guideline criterion","genes":["ELANE","HAX1"],"diseases":[],"text":"Germline ELANE and HAX1 variants associated with severe congenital neutropenia are recognized causes of myeloid-neoplasm predisposition.","locator":"Table 2 — Myeloid neoplasms with germline predisposition"},{"id":"d-hner-2022-blood-140-1345-C0050","paper":"d-hner-2022-blood-140-1345","category":"germline","tier":"guideline criterion","genes":["SBDS","DNAJC21","EFL1","SRP54"],"diseases":[],"text":"Germline SBDS, DNAJC21, EFL1, and SRP54 variants associated with Shwachman-Diamond syndrome are recognized causes of myeloid-neoplasm predisposition.","locator":"Table 2 — Myeloid neoplasms with germline predisposition"},{"id":"d-hner-2022-blood-140-1345-C0051","paper":"d-hner-2022-blood-140-1345","category":"germline","tier":"guideline criterion","genes":["ACD","CTC1","DKC1","RTEL1","TERC","TERT","TINF2","NHP2","NOP10","PARN","WRAP53","RPA1"],"diseases":[],"text":"Germline ACD, CTC1, DKC1, RTEL1, TERC, TERT, TINF2, NHP2, NOP10, PARN, WRAP53, and RPA1 variants associated with telomere biology disorders/short telomere syndromes are recognized causes of myeloid-neoplasm predisposition.","locator":"Table 2 — Myeloid neoplasms with germline predisposition"},{"id":"d-hner-2022-blood-140-1345-C0052","paper":"d-hner-2022-blood-140-1345","category":"germline","tier":"guideline criterion","genes":["CBL"],"diseases":[],"text":"Germline CBL variants causing CBL syndrome are associated with myeloid-neoplasm predisposition.","locator":"Table 2 — Myeloid neoplasms with germline predisposition"},{"id":"d-hner-2022-blood-140-1345-C0053","paper":"d-hner-2022-blood-140-1345","category":"germline","tier":"guideline criterion","genes":["PTPN11","NRAS","KRAS"],"diseases":[],"text":"Germline PTPN11, NRAS, and KRAS variants associated with Noonan syndrome are recognized causes of myeloid-neoplasm predisposition.","locator":"Table 2 — Myeloid neoplasms with germline predisposition"},{"id":"d-hner-2022-blood-140-1345-C0054","paper":"d-hner-2022-blood-140-1345","category":"germline","tier":"guideline criterion","genes":["NF1"],"diseases":[],"text":"Germline NF1 variants causing neurofibromatosis type I are associated with myeloid-neoplasm predisposition.","locator":"Table 2 — Myeloid neoplasms with germline predisposition"},{"id":"d-hner-2022-blood-140-1345-C0055","paper":"d-hner-2022-blood-140-1345","category":"germline","tier":"guideline criterion","genes":["SAMD9","SAMD9L"],"diseases":[],"text":"Germline pathogenic or likely pathogenic SAMD9 and SAMD9L variants are recognized as myeloid-neoplasm predisposition disorders.","locator":"Table 2 — Myeloid neoplasms with germline predisposition"},{"id":"d-hner-2022-blood-140-1345-C0056","paper":"d-hner-2022-blood-140-1345","category":"germline","tier":"guideline criterion","genes":["BLM"],"diseases":[],"text":"Germline BLM variants causing Bloom syndrome are associated with myeloid-neoplasm predisposition.","locator":"Table 2 — Myeloid neoplasms with germline predisposition"},{"id":"d-hner-2022-blood-140-1345-C0057","paper":"d-hner-2022-blood-140-1345","category":"germline","tier":"guideline criterion","genes":["CHEK2"],"diseases":[],"text":"Germline pathogenic or likely pathogenic CHEK2 variants are recognized as a myeloid-neoplasm predisposition disorder.","locator":"Table 2 — Myeloid neoplasms with germline predisposition"},{"id":"d-hner-2022-blood-140-1345-C0058","paper":"d-hner-2022-blood-140-1345","category":"germline","tier":"guideline criterion","genes":["MPL"],"diseases":[],"text":"Germline pathogenic or likely pathogenic MPL variants are recognized as a myeloid-neoplasm predisposition disorder.","locator":"Table 2 — Myeloid neoplasms with germline predisposition"},{"id":"d-hner-2022-blood-140-1345-C0059","paper":"d-hner-2022-blood-140-1345","category":"germline","tier":"guideline criterion","genes":["RECQL4"],"diseases":[],"text":"Germline pathogenic or likely pathogenic RECQL4 variants are recognized as a myeloid-neoplasm predisposition disorder.","locator":"Table 2 — Myeloid neoplasms with germline predisposition"},{"id":"d-hner-2022-blood-140-1345-C0060","paper":"d-hner-2022-blood-140-1345","category":"germline","tier":"guideline criterion","genes":["BRCA1","BRCA2"],"diseases":[],"text":"Germline BRCA1 and BRCA2 variants associated with hereditary breast and ovarian cancer are listed as causes of myeloid-neoplasm predisposition.","locator":"Table 2 — Myeloid neoplasms with germline predisposition"},{"id":"d-hner-2022-blood-140-1345-C0061","paper":"d-hner-2022-blood-140-1345","category":"germline","tier":"guideline criterion","genes":["MLH1","MSH2","MSH6","PMS2"],"diseases":[],"text":"Germline MLH1, MSH2, MSH6, and PMS2 variants associated with Lynch syndrome are listed as causes of myeloid-neoplasm predisposition.","locator":"Table 2 — Myeloid neoplasms with germline predisposition"},{"id":"d-hner-2022-blood-140-1345-C0062","paper":"d-hner-2022-blood-140-1345","category":"germline","tier":"guideline criterion","genes":["NBN"],"diseases":[],"text":"Germline NBN variants causing Nijmegen breakage syndrome are associated with myeloid-neoplasm predisposition.","locator":"Table 2 — Myeloid neoplasms with germline predisposition"},{"id":"d-hner-2022-blood-140-1345-C0063","paper":"d-hner-2022-blood-140-1345","category":"germline","tier":"guideline criterion","genes":["WAS"],"diseases":[],"text":"Germline WAS variants causing Wiskott-Aldrich syndrome are associated with myeloid-neoplasm predisposition.","locator":"Table 2 — Myeloid neoplasms with germline predisposition"},{"id":"d-hner-2022-blood-140-1345-C0071","paper":"d-hner-2022-blood-140-1345","category":"treatment","tier":"guideline criterion","genes":[],"diseases":["AML"],"text":"The 2022 ELN recommendations identify anthracycline plus cytarabine as the standard induction backbone for patients with AML who are fit for intensive therapy.","locator":"Therapy for AML — Patients considered fit for intensive therapy"},{"id":"d-hner-2022-blood-140-1345-C0072","paper":"d-hner-2022-blood-140-1345","category":"treatment","tier":"guideline criterion","genes":["FLT3"],"diseases":["AML"],"text":"The 2022 ELN recommendations identify incorporation of midostaurin into first-line daunorubicin/cytarabine induction and cytarabine consolidation as standard treatment for intensively treated FLT3-mutated AML; this regimen improves overall survival.","locator":"Therapy for AML — Induction therapy; Table 10"},{"id":"d-hner-2022-blood-140-1345-C0074","paper":"d-hner-2022-blood-140-1345","category":"treatment","tier":"guideline criterion","genes":["CD33"],"diseases":["AML"],"text":"The 2022 ELN recommendations list gemtuzumab ozogamicin combined with daunorubicin and cytarabine as an approved frontline treatment option for previously untreated CD33-positive AML.","locator":"Therapy for AML — Gemtuzumab ozogamicin; Table 10"},{"id":"d-hner-2022-blood-140-1345-C0075","paper":"d-hner-2022-blood-140-1345","category":"treatment","tier":"restated secondary","genes":["RUNX1","RUNX1T1","CBFB","MYH11"],"diseases":["AML"],"text":"In RUNX1::RUNX1T1 and CBFB::MYH11 core-binding-factor AML, adding gemtuzumab ozogamicin to frontline intensive therapy provides particular benefit.","locator":"Therapy for AML — Gemtuzumab ozogamicin"},{"id":"d-hner-2022-blood-140-1345-C0076","paper":"d-hner-2022-blood-140-1345","category":"treatment","tier":"restated secondary","genes":["NPM1"],"diseases":["AML"],"text":"In NPM1-mutated AML, adding gemtuzumab ozogamicin reduces relapse risk, although an event-free-survival benefit was not demonstrated in the cited randomized study.","locator":"Therapy for AML — Gemtuzumab ozogamicin"},{"id":"d-hner-2022-blood-140-1345-C0078","paper":"d-hner-2022-blood-140-1345","category":"treatment","tier":"guideline criterion","genes":[],"diseases":["AML"],"text":"The 2022 ELN recommendations generally recommend intermediate-dose cytarabine for consolidation after CR/CRh/CRi following intensive AML treatment; high-dose cytarabine adds toxicity without demonstrated survival benefit.","locator":"Therapy for AML — Consolidation therapy"},{"id":"d-hner-2022-blood-140-1345-C0080","paper":"d-hner-2022-blood-140-1345","category":"treatment","tier":"guideline criterion","genes":[],"diseases":["AML"],"text":"The 2022 ELN recommendations identify azacitidine plus venetoclax as a standard-of-care regimen for older or unfit patients with AML who are not candidates for intensive chemotherapy; the combination improves response and overall survival versus azacitidine alone.","locator":"Therapy for AML — Patients not considered candidates for intensive therapy; Table 11"},{"id":"d-hner-2022-blood-140-1345-C0081","paper":"d-hner-2022-blood-140-1345","category":"treatment","tier":"guideline criterion","genes":[],"diseases":["AML"],"text":"The 2022 ELN recommendations list low-dose cytarabine plus venetoclax as an alternative treatment option for patients with AML unsuitable for intensive chemotherapy who cannot receive a hypomethylating agent.","locator":"Table 11 — Selected treatment options for patients not suitable for intensive chemotherapy"},{"id":"d-hner-2022-blood-140-1345-C0082","paper":"d-hner-2022-blood-140-1345","category":"treatment","tier":"restated secondary","genes":["IDH1"],"diseases":["AML"],"text":"The 2022 ELN recommendations list ivosidenib plus azacitidine as a treatment option for newly diagnosed IDH1-mutated AML unsuitable for intensive chemotherapy; randomized evidence shows improved event-free survival, response, and overall survival versus azacitidine plus placebo.","locator":"Therapy for AML — Patients not considered candidates for intensive therapy; Table 11"},{"id":"d-hner-2022-blood-140-1345-C0083","paper":"d-hner-2022-blood-140-1345","category":"treatment","tier":"guideline criterion","genes":["IDH1"],"diseases":["AML"],"text":"The 2022 ELN recommendations state that very frail patients with IDH1-mutated AML who cannot tolerate hypomethylating-agent-based therapy may be offered ivosidenib monotherapy, which can be continued until progression.","locator":"Table 11 — Selected treatment options for patients not suitable for intensive chemotherapy; Therapy for AML — Patients not considered candidates for intensive therapy"},{"id":"d-hner-2022-blood-140-1345-C0084","paper":"d-hner-2022-blood-140-1345","category":"treatment","tier":"guideline criterion","genes":["IDH2"],"diseases":["AML"],"text":"The 2022 ELN recommendations state that very frail patients with IDH2-mutated AML who cannot tolerate hypomethylating-agent-based therapy may be offered monotherapy with a targeted IDH2 inhibitor.","locator":"Therapy for AML — Patients not considered candidates for intensive therapy"},{"id":"d-hner-2022-blood-140-1345-C0085","paper":"d-hner-2022-blood-140-1345","category":"treatment","tier":"restated secondary","genes":["FLT3"],"diseases":["AML"],"text":"The 2022 ELN recommendations list gilteritinib as a salvage option for relapsed/refractory FLT3-mutated AML after prior intensive chemotherapy; randomized evidence shows improved response and overall survival versus physician-choice salvage therapy.","locator":"Therapy for AML — Relapsed and refractory disease; Table 10"},{"id":"d-hner-2022-blood-140-1345-C0086","paper":"d-hner-2022-blood-140-1345","category":"treatment","tier":"restated secondary","genes":["FLT3"],"diseases":["AML"],"text":"For relapsed/refractory FLT3-ITD-positive AML, quizartinib improves overall survival versus conventional care, although FDA and EMA approval was not granted after review of the cited trial data.","locator":"Therapy for AML — Relapsed and refractory disease"},{"id":"d-hner-2022-blood-140-1345-C0087","paper":"d-hner-2022-blood-140-1345","category":"treatment","tier":"restated secondary","genes":["IDH1"],"diseases":["AML"],"text":"The 2022 ELN recommendations list ivosidenib as a salvage option for relapsed/refractory IDH1-mutated AML, supported by clinically meaningful single-agent antileukemic activity from single-arm evidence.","locator":"Therapy for AML — Relapsed and refractory disease; Table 10"},{"id":"d-hner-2022-blood-140-1345-C0088","paper":"d-hner-2022-blood-140-1345","category":"treatment","tier":"restated secondary","genes":["IDH2"],"diseases":["AML"],"text":"The 2022 ELN recommendations list enasidenib as a salvage option for relapsed/refractory IDH2-mutated AML because clinically useful single-agent antileukemic activity has been demonstrated, although a randomized late-line study did not improve overall survival versus conventional care.","locator":"Therapy for AML — Relapsed and refractory disease; Table 10"},{"id":"d-hner-2022-blood-140-1345-C0089","paper":"d-hner-2022-blood-140-1345","category":"treatment","tier":"guideline criterion","genes":["FLT3"],"diseases":["AML"],"text":"The 2022 ELN recommendations consider use of a FLT3 inhibitor a reasonable posttransplant maintenance strategy for FLT3-mutated AML, based on randomized evidence that sorafenib maintenance reduces relapse after allogeneic HCT.","locator":"Allogeneic HCT — Pre- and posttransplant strategies"},{"id":"d-hner-2022-blood-140-1345-C0090","paper":"d-hner-2022-blood-140-1345","category":"treatment","tier":"guideline criterion","genes":["FLT3"],"diseases":["AML"],"text":"The 2022 ELN recommendations identify gilteritinib as the preferred treatment option for FLT3-mutated AML relapsing after allogeneic HCT with an emergent FLT3-mutant clone.","locator":"Relapse after transplant"},{"id":"d-hner-2022-blood-140-1345-C0091","paper":"d-hner-2022-blood-140-1345","category":"treatment","tier":"guideline criterion","genes":["RUNX1","CEBPA"],"diseases":["AML"],"text":"The 2022 ELN recommendations advise against using related donor stem cells carrying the same deleterious germline RUNX1 or CEBPA variant in a patient with AML.","locator":"Germline predisposition; Allogeneic HCT — Donor selection"},{"id":"d-hner-2022-blood-140-1345-C0093","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["AML"],"text":"Under the 2022 ICC, the former AML with myelodysplasia-related changes (AML-MRC) category is removed, and multilineage dysplasia is no longer an independent criterion for that AML category.","locator":"AML classification — Antecedent AML history"},{"id":"d-hner-2022-blood-140-1345-C0094","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"guideline criterion","genes":["TP53"],"diseases":["AML","MDS/AML"],"text":"Under the 2022 ICC, cases lacking a recurrent AML-defining abnormality, TP53-mutated category, myelodysplasia-related gene mutation category, or myelodysplasia-related cytogenetic category are classified as AML, not otherwise specified at ≥20% blasts, or MDS/AML at 10%-19% blasts, irrespective of multilineage dysplasia.","locator":"AML classification — remaining AML cases; Figure 1; Table 1; Figure 1; AML classification — remaining AML cases"},{"id":"d-hner-2022-blood-140-1345-C0095","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["AML"],"text":"Under the 2022 ICC, when an inherited germline predisposing disorder is identified in a patient with AML, the germline disorder is appended as a diagnostic qualifier to the specific AML category.","locator":"Germline predisposition"},{"id":"d-hner-2022-blood-140-1345-C0096","paper":"d-hner-2022-blood-140-1345","category":"prognosis","tier":"guideline criterion","genes":["NPM1"],"diseases":["AML"],"text":"The 2022 ELN recommendations state that subsequent MRD response may modify the initial ELN genetic risk assignment in NPM1-mutated AML.","locator":"2022 European LeukemiaNet genetic risk classification at diagnosis"},{"id":"d-hner-2022-blood-140-1345-C0097","paper":"d-hner-2022-blood-140-1345","category":"biomarker","tier":"guideline criterion","genes":["FLT3","IDH1","IDH2","NPM1","CEBPA","DDX41","TP53","ASXL1","BCOR","EZH2","RUNX1","SF3B1","SRSF2","STAG2","U2AF1","ZRSR2"],"diseases":["AML"],"text":"The 2022 ELN recommendations recommend mutation testing at AML diagnosis for FLT3, IDH1, IDH2, NPM1, CEBPA, DDX41, TP53, ASXL1, BCOR, EZH2, RUNX1, SF3B1, SRSF2, STAG2, U2AF1, and ZRSR2 because these genes are required for disease/risk classification and/or identification of actionable therapeutic targets as applicable.","locator":"Table 4 — Genetic analyses at diagnosis"},{"id":"d-hner-2022-blood-140-1345-C0098","paper":"d-hner-2022-blood-140-1345","category":"biomarker","tier":"guideline criterion","genes":["PML","RARA","CBFB","MYH11","RUNX1","RUNX1T1","KMT2A","BCR","ABL1"],"diseases":["AML"],"text":"The 2022 ELN recommendations recommend screening at AML diagnosis for PML::RARA, CBFB::MYH11, RUNX1::RUNX1T1, KMT2A rearrangements, and BCR::ABL1 when rapid therapeutic information is needed, chromosome morphology is poor, or typical morphology lacks the suspected cytogenetic abnormality.","locator":"Table 4 — Screening for gene rearrangements; footnote **"},{"id":"d-hner-2022-blood-140-1345-C0099","paper":"d-hner-2022-blood-140-1345","category":"biomarker","tier":"guideline criterion","genes":["ANKRD26","BCORL1","BRAF","CBL","CSF3R","DNMT3A","ETV6","GATA2","JAK2","KIT","KRAS","NRAS","NF1","PHF6","PPM1D","PTPN11","RAD21","SETBP1","TET2","WT1"],"diseases":["AML"],"text":"The 2022 ELN recommendations list ANKRD26, BCORL1, BRAF, CBL, CSF3R, DNMT3A, ETV6, GATA2, JAK2, KIT, KRAS, NRAS, NF1, PHF6, PPM1D, PTPN11, RAD21, SETBP1, TET2, and WT1 as additional genes for possible investigational NGS-based disease monitoring after AML diagnosis; DNMT3A and TET2 mutations consistent with clonal hematopoiesis are specifically excluded from use as AML MRD markers.","locator":"Table 4 — Additional genes recommended to test at diagnosis; footnote ††"},{"id":"d-hner-2022-blood-140-1345-C0106","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"guideline criterion","genes":["BCR","ABL1","KMT2A"],"diseases":["acute leukaemia of ambiguous lineage"],"text":"Under the 2022 ICC, mixed-phenotype acute leukemia with BCR::ABL1 and mixed-phenotype acute leukemia with KMT2A rearrangement are recognized distinct genetic entities within acute leukemia of ambiguous lineage.","locator":"Table 1 — Acute leukemia of ambiguous lineage"},{"id":"d-hner-2022-blood-140-1345-C0107","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"guideline criterion","genes":["BCR","ABL1"],"diseases":["CML","AML"],"text":"Under the 2022 ICC, BCR::ABL1-positive disease with 10%-19% blasts is classified as chronic myeloid leukemia in accelerated phase rather than AML.","locator":"Figure 1 legend; Changes to the blast thresholds defining AML"},{"id":"d-hner-2022-blood-140-1345-C0108","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"guideline criterion","genes":["BCR","ABL1"],"diseases":["CML","AML"],"text":"Under the 2022 ICC, in a patient with a history of chronic myeloid leukemia, BCR::ABL1-positive disease with ≥20% blasts is classified as CML in myeloid blast phase rather than de novo AML with BCR::ABL1.","locator":"Figure 1 legend"},{"id":"d-hner-2022-blood-140-1345-C0109","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["MDS/MPN","AML"],"text":"Under the 2022 ICC, a prior MDS/MPN is appended as a diagnostic qualifier to the AML category only when the MDS/MPN was established by standard diagnostics more than 3 months before AML diagnosis, and the MDS/MPN type should be specified.","locator":"Table 1 — Diagnostic qualifiers"},{"id":"d-hner-2022-blood-140-1345-C0110","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["MPN","MPN blast phase"],"text":"Under the 2022 ICC, patients with a prior myeloproliferative neoplasm are excluded from the AML hierarchy and are classified as accelerated-phase MPN at 10%-19% blasts or MPN blast phase at ≥20% blasts.","locator":"Figure 1 legend"},{"id":"d-hner-2022-blood-140-1345-C0111","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["AML"],"text":"Under the 2022 ICC, myeloblasts, monoblasts, and megakaryoblasts are included in the blast count used for AML classification.","locator":"Figure 1 legend; Table 4 footnote †"},{"id":"d-hner-2022-blood-140-1345-C0112","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["AML"],"text":"Under the 2022 ICC, in AML with monocytic or myelomonocytic differentiation, monoblasts and promonocytes are counted as blast equivalents, whereas abnormal monocytes are not.","locator":"Figure 1 legend; Table 4 footnote †"},{"id":"d-hner-2022-blood-140-1345-C0113","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"guideline criterion","genes":["PML","RARA"],"diseases":["APL","AML"],"text":"Under the 2022 ICC, in PML::RARA or variant RARA-rearranged APL/AML, promyelocytes are counted as blast equivalents for classification.","locator":"Figure 1 legend"},{"id":"d-hner-2022-blood-140-1345-C0114","paper":"d-hner-2022-blood-140-1345","category":"treatment","tier":"guideline criterion","genes":["PML","RARA","RUNX1","RUNX1T1","CBFB","MYH11","MLLT3","KMT2A","DEK","NUP214","GATA2","MECOM","NPM1","CEBPA","IRF2BP2","ZBTB16","STAT5B","STAT3","TBL1XR1","FIP1L1","BCOR","AFF1","AFDN","MLLT10","TET1","ELL","MLLT1","MYC","ETV6","PRDM16","RPN1","RBM15","MRTFA","MLF1","NUP98","NSD1","MNX1","KAT6A","CREBBP","PICALM","KMD5A","FUS","ERG","CBFA2T3","GLIS2"],"diseases":["MDS/MPN","AML"],"text":"The 2022 ELN recommendations advise AML-type therapy for a patient with prior MDS/MPN when an AML-defining recurrent abnormality is detected at ≥10% blasts—including PML::RARA, RUNX1::RUNX1T1, CBFB::MYH11, MLLT3::KMT2A, DEK::NUP214, GATA2/MECOM rearrangement, mutated NPM1, in-frame bZIP CEBPA, or the listed variant RARA, KMT2A, MECOM, and rare recurrent rearrangements involving IRF2BP2, ZBTB16, STAT5B, STAT3, TBL1XR1, FIP1L1, BCOR, AFF1, AFDN, MLLT10, TET1, ELL, MLLT1, MYC, ETV6, PRDM16, RPN1, RBM15, MRTFA, MLF1, NUP98, NSD1, MNX1, KAT6A, CREBBP, PICALM, KMD5A, FUS, ERG, CBFA2T3, or GLIS2—even though the antecedent MDS/MPN diagnosis is otherwise retained until ≥20% blasts.","locator":"Figure 1 legend"},{"id":"d-hner-2022-blood-140-1345-C0115","paper":"d-hner-2022-blood-140-1345","category":"biomarker","tier":"guideline criterion","genes":["NPM1","RUNX1","RUNX1T1","CBFB","MYH11"],"diseases":["AML"],"text":"Under the ELN MRD framework incorporated into the 2022 AML recommendations, at the end of consolidation, molecular CR with qPCR MRD below 2% in NPM1-mutated, RUNX1::RUNX1T1, or CBFB::MYH11 AML is operationally designated MRD-negative.","locator":"Table 8 footnote §"},{"id":"d-hner-2022-blood-140-1345-C0116","paper":"d-hner-2022-blood-140-1345","category":"biomarker","tier":"guideline criterion","genes":["FLT3"],"diseases":["AML"],"text":"The 2022 ELN recommendations advise retaining capillary electrophoresis for FLT3-ITD detection in AML because longer FLT3 internal tandem duplications can be missed by next-generation sequencing.","locator":"Table 4 footnote ¶"},{"id":"d-hner-2022-blood-140-1345-C0117","paper":"d-hner-2022-blood-140-1345","category":"germline","tier":"guideline criterion","genes":["CHEK2","DDX41"],"diseases":[],"text":"The 2022 ELN recommendations advise consideration of germline testing when CHEK2 I200T or a truncating DDX41 variant is identified on tumor profiling, even when identified once.","locator":"Table 3 footnote"},{"id":"d-hner-2022-blood-140-1345-C0122","paper":"d-hner-2022-blood-140-1345","category":"treatment","tier":"restated secondary","genes":["CD33"],"diseases":["AML"],"text":"In patients aged 50-70 years with de novo CD33-positive AML, adding gemtuzumab ozogamicin to frontline therapy provides an event-free-survival benefit in favorable- or intermediate-cytogenetic-risk disease, with no corresponding benefit stated for adverse-risk disease.","locator":"Therapy for AML — Gemtuzumab ozogamicin"},{"id":"d-hner-2022-blood-140-1345-C0124","paper":"d-hner-2022-blood-140-1345","category":"biomarker","tier":"guideline criterion","genes":["RUNX1","RUNX1T1","CBFB","MYH11","KMT2A","MECOM"],"diseases":["AML"],"text":"The 2022 ELN recommendations identify FISH as an alternative method to detect RUNX1::RUNX1T1, CBFB::MYH11, KMT2A rearrangements, and MECOM rearrangements when conventional cytogenetic analysis yields no analyzable metaphases in AML.","locator":"Diagnostic procedures — Cytogenetic and molecular studies; Table 4 footnote §"},{"id":"d-hner-2022-blood-140-1345-C0127","paper":"d-hner-2022-blood-140-1345","category":"treatment","tier":"guideline criterion","genes":[],"diseases":["AML"],"text":"The 2022 ELN recommendations list best supportive care as an appropriate option for patients with AML who cannot tolerate any active antileukemic therapy or who do not wish to receive antileukemic treatment.","locator":"Table 11 — Selected treatment options for patients not suitable for intensive chemotherapy; Therapy for AML — Patients not considered candidates for intensive therapy"},{"id":"d-hner-2024-blood-144-2169-C0001","paper":"d-hner-2024-blood-144-2169","category":"prognosis","tier":"restated secondary","genes":["NPM1","IDH2","FLT3","KRAS","NRAS"],"diseases":["AML"],"text":"Exploratory analyses in NPM1- or IDH2-mutated AML treated with azacitidine/venetoclax found inferior overall survival when FLT3-ITD, KRAS, and/or NRAS mutations co-occurred.","locator":"HMAs plus VEN, paragraph beginning “Within these newly deﬁned higher- and intermediate-beneﬁt groups”"},{"id":"d-hner-2024-blood-144-2169-C0002","paper":"d-hner-2024-blood-144-2169","category":"prognosis","tier":"restated secondary","genes":["RUNX1"],"diseases":["AML"],"text":"Exploratory analyses in RUNX1-mutated AML treated with azacitidine/venetoclax suggest inferior overall survival when an activated kinase pathogenic variant is present.","locator":"HMAs plus VEN, paragraph beginning “Within these newly deﬁned higher- and intermediate-beneﬁt groups”"},{"id":"d-hner-2024-blood-144-2169-C0003","paper":"d-hner-2024-blood-144-2169","category":"prognosis","tier":"restated secondary","genes":["FLT3","KRAS","NRAS"],"diseases":["AML"],"text":"In AML with myelodysplasia-related gene mutations treated with HMA/venetoclax, co-occurring FLT3-ITD, KRAS, and/or NRAS signaling mutations are associated with inferior prognosis.","locator":"Genetic risk classiﬁcation, paragraph spanning “AML with MR mutations…” and HMAs plus VEN signaling-gene context"},{"id":"d-hner-2024-blood-144-2169-C0004","paper":"d-hner-2024-blood-144-2169","category":"prognosis","tier":"restated secondary","genes":["FLT3"],"diseases":["AML"],"text":"FLT3-ITD positivity has an adverse prognostic impact in AML treated with azacitidine/venetoclax.","locator":"HMAs plus VEN, paragraph containing “The adverse prognostic impact of TP53mut or FLT3-ITDpos”"},{"id":"d-hner-2024-blood-144-2169-C0005","paper":"d-hner-2024-blood-144-2169","category":"prognosis","tier":"guideline criterion","genes":["NPM1","IDH2","FLT3","NRAS","KRAS","TP53"],"diseases":["AML"],"text":"According to the proposed 2024 ELN Less-Intensive classification, newly diagnosed AML with mutated NPM1 or IDH2, FLT3-ITD negativity, NRAS/KRAS wild type, and TP53 wild type is favorable risk with HMA-based less-intensive therapy. This framework does not apply after prior HMA therapy and has limited relevance in patients with a prior myeloproliferative neoplasm.","locator":"Table 1, risk row; Genetic risk classification applicability/limitations"},{"id":"d-hner-2024-blood-144-2169-C0006","paper":"d-hner-2024-blood-144-2169","category":"prognosis","tier":"guideline criterion","genes":["IDH1","TP53"],"diseases":["AML"],"text":"According to the proposed 2024 ELN Less-Intensive classification, IDH1-mutated, TP53-wild-type AML is favorable risk specifically with azacitidine/ivosidenib, irrespective of the presence of activating signaling gene mutations. This framework does not apply after prior HMA therapy and has limited relevance in patients with a prior myeloproliferative neoplasm.","locator":"Table 1, risk row; Genetic risk classification applicability/limitations"},{"id":"d-hner-2024-blood-144-2169-C0007","paper":"d-hner-2024-blood-144-2169","category":"prognosis","tier":"guideline criterion","genes":["DDX41"],"diseases":["AML"],"text":"According to the proposed 2024 ELN Less-Intensive classification, DDX41-mutated AML is favorable risk with HMA-based less-intensive therapy. This framework does not apply after prior HMA therapy and has limited relevance in patients with a prior myeloproliferative neoplasm.","locator":"Table 1, risk row; Genetic risk classification applicability/limitations"},{"id":"d-hner-2024-blood-144-2169-C0008","paper":"d-hner-2024-blood-144-2169","category":"prognosis","tier":"guideline criterion","genes":["FLT3","NRAS","KRAS","TP53"],"diseases":["AML"],"text":"According to the proposed 2024 ELN Less-Intensive classification, other cytogenetic and/or molecular abnormalities in newly diagnosed AML are tentatively favorable risk when FLT3-ITD is negative, NRAS and KRAS are wild type, and TP53 is wild type. This framework does not apply after prior HMA therapy and has limited relevance in patients with a prior myeloproliferative neoplasm.","locator":"Table 1, risk row; Genetic risk classification applicability/limitations"},{"id":"d-hner-2024-blood-144-2169-C0009","paper":"d-hner-2024-blood-144-2169","category":"prognosis","tier":"guideline criterion","genes":["FLT3","NRAS","KRAS","TP53"],"diseases":["AML"],"text":"According to the proposed 2024 ELN Less-Intensive classification, other cytogenetic and molecular abnormalities in newly diagnosed AML are tentatively intermediate risk when FLT3-ITD is positive and/or NRAS or KRAS is mutated, with TP53 wild type. This framework does not apply after prior HMA therapy and has limited relevance in patients with a prior myeloproliferative neoplasm.","locator":"Table 1, intermediate-risk row; Genetic risk classification applicability/limitations"},{"id":"d-hner-2024-blood-144-2169-C0010","paper":"d-hner-2024-blood-144-2169","category":"prognosis","tier":"guideline criterion","genes":["TP53"],"diseases":["AML"],"text":"According to the proposed 2024 ELN Less-Intensive classification, TP53-mutated AML is adverse risk with HMA-based less-intensive therapy. This framework does not apply after prior HMA therapy and has limited relevance in patients with a prior myeloproliferative neoplasm.","locator":"Table 1, adverse-risk row; Genetic risk classification applicability/limitations"},{"id":"d-hner-2024-blood-144-2169-C0012","paper":"d-hner-2024-blood-144-2169","category":"prognosis","tier":"guideline criterion","genes":["FLT3","NRAS","KRAS","TP53"],"diseases":["AML"],"text":"According to the proposed 2024 ELN Less-Intensive classification, AML with myelodysplasia-related gene mutations is favorable risk when FLT3-ITD is negative, NRAS and KRAS are wild type, and TP53 is wild type. This framework does not apply after prior HMA therapy and has limited relevance in patients with a prior myeloproliferative neoplasm.","locator":"Table 2, favorable-risk group; Genetic risk classification applicability/limitations"},{"id":"d-hner-2024-blood-144-2169-C0013","paper":"d-hner-2024-blood-144-2169","category":"prognosis","tier":"guideline criterion","genes":["FLT3","NRAS","KRAS","TP53"],"diseases":["AML"],"text":"According to the proposed 2024 ELN Less-Intensive classification, AML with myelodysplasia-related gene mutations is intermediate risk when FLT3-ITD is positive and/or NRAS or KRAS is mutated, with TP53 wild type. This framework does not apply after prior HMA therapy and has limited relevance in patients with a prior myeloproliferative neoplasm.","locator":"Table 2, intermediate-risk group; Genetic risk classification applicability/limitations"},{"id":"d-hner-2024-blood-144-2169-C0014","paper":"d-hner-2024-blood-144-2169","category":"prognosis","tier":"restated secondary","genes":["ASXL1"],"diseases":["AML"],"text":"ASXL1 mutations have been linked to improved outcomes in AML treated with HMA/venetoclax.","locator":"Genetic risk classification, paragraph beginning “secondary AML”"},{"id":"d-hner-2024-blood-144-2169-C0016","paper":"d-hner-2024-blood-144-2169","category":"treatment","tier":"restated secondary","genes":["TP53","FLT3"],"diseases":["AML"],"text":"In TP53-mutated or FLT3-ITD-positive AML, adding venetoclax to azacitidine has been reported not to improve survival beyond azacitidine alone.","locator":"HMAs plus VEN, paragraph containing “failure to improve survival above AZA alone”"},{"id":"d-hner-2024-blood-144-2169-C0017","paper":"d-hner-2024-blood-144-2169","category":"treatment","tier":"restated secondary","genes":["DDX41"],"diseases":["AML"],"text":"DDX41-mutated AML treated with HMA/venetoclax has been reported to have a high response rate.","locator":"HMAs plus VEN, paragraph beginning “DDX41 mutations identify”"},{"id":"d-hner-2024-blood-144-2169-C0018","paper":"d-hner-2024-blood-144-2169","category":"treatment","tier":"restated secondary","genes":["IDH1"],"diseases":["AML"],"text":"For IDH1-mutated AML receiving less-intensive therapy, azacitidine/ivosidenib is an established treatment standard.","locator":"AZA and IVO, paragraph beginning “A randomized phase 3 study established”"},{"id":"d-hner-2024-blood-144-2169-C0019","paper":"d-hner-2024-blood-144-2169","category":"treatment","tier":"restated secondary","genes":["IDH1"],"diseases":["AML"],"text":"In IDH1-mutated AML, azacitidine/ivosidenib improves overall survival compared with azacitidine/placebo.","locator":"AZA and IVO, paragraph beginning “A randomized phase 3 study established”"},{"id":"d-hner-2024-blood-144-2169-C0020","paper":"d-hner-2024-blood-144-2169","category":"treatment","tier":"restated secondary","genes":["NPM1","IDH2"],"diseases":["AML"],"text":"NPM1-mutated or IDH2-mutated AML appears sensitive to venetoclax treatment.","locator":"Genetic risk classification, paragraph beginning “Although patients with NPM1mut or IDH2mut AML”"},{"id":"d-hner-2024-blood-144-2169-C0021","paper":"d-hner-2024-blood-144-2169","category":"germline","tier":"guideline criterion","genes":["DDX41"],"diseases":["AML"],"text":"In AML, identification of a DDX41 mutation at near-heterozygous frequency should prompt consideration of germline DDX41 mutation.","locator":"Table 1, DDX41 footnote"},{"id":"elena-2016-blood-128-1408-C0001","paper":"elena-2016-blood-128-1408","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["CMML"],"text":"According to the FAB classification, chronic myelomonocytic leukemia is classified as myelodysplastic CMML when the leukocyte count is ≤13 × 10^9/L and myeloproliferative CMML when it is >13 × 10^9/L.","locator":"Introduction, paragraph beginning 'Chronic myelomonocytic leukemia (CMML) is a myeloid neoplasm'"},{"id":"elena-2016-blood-128-1408-C0003","paper":"elena-2016-blood-128-1408","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["CMML"],"text":"According to the 2016 WHO revision, chronic myelomonocytic leukemia includes dysplastic and proliferative types.","locator":"Introduction, paragraph beginning 'Chronic myelomonocytic leukemia (CMML) is a myeloid neoplasm'"},{"id":"elena-2016-blood-128-1408-C0005","paper":"elena-2016-blood-128-1408","category":"prognosis","tier":"multivariable-adjusted","genes":["ASXL1","NRAS","RUNX1","SETBP1"],"diseases":["CMML"],"text":"According to the CMML-specific genetic score developed as part of the CPSS-Mol framework, mutations in ASXL1, NRAS, RUNX1, and SETBP1 are independently associated with inferior overall survival in chronic myelomonocytic leukemia.","locator":"Results, Prognostic value of genetic lesions in CMML, multivariable Cox regression paragraph; Results, Development of a clinical/molecular prognostic scoring system in CMML"},{"id":"elena-2016-blood-128-1408-C0006","paper":"elena-2016-blood-128-1408","category":"prognosis","tier":"univariable or descriptive","genes":["EZH2"],"diseases":["CMML"],"text":"In chronic myelomonocytic leukemia, EZH2 mutation is associated with inferior overall survival in univariable analysis, but was not retained as an independent prognostic factor in multivariable analysis.","locator":"Results, Prognostic value of genetic lesions in CMML, univariable analysis and multivariable Cox regression paragraphs"},{"id":"guglielmelli-2017-mipss70-pmf-C0001","paper":"guglielmelli-2017-mipss70-pmf","category":"prognosis","tier":"multivariable-adjusted","genes":["CALR"],"diseases":["PMF"],"text":"According to the MIPSS70 and MIPSS70-plus frameworks, absence of a type 1-like CALR mutation in patients aged 70 years or younger with primary myelofibrosis is associated with inferior overall survival.","locator":"Development and Validation of Mutation-Enhanced IPSS: MIPSS70; Development and Validation of the Cytogenetic-Enhanced MIPSS70 Scoring System: MIPSS70-Plus; Table 2"},{"id":"guglielmelli-2017-mipss70-pmf-C0002","paper":"guglielmelli-2017-mipss70-pmf","category":"prognosis","tier":"multivariable-adjusted","genes":["ASXL1","EZH2","SRSF2","IDH1","IDH2"],"diseases":["PMF"],"text":"According to the MIPSS70 and MIPSS70-plus frameworks, the presence of a high-molecular-risk mutation in ASXL1, EZH2, SRSF2, IDH1, or IDH2 in patients aged 70 years or younger with primary myelofibrosis is associated with inferior overall survival.","locator":"Mutation Analysis; Development and Validation of Mutation-Enhanced IPSS: MIPSS70; Development and Validation of the Cytogenetic-Enhanced MIPSS70 Scoring System: MIPSS70-Plus; Table 2"},{"id":"guglielmelli-2017-mipss70-pmf-C0003","paper":"guglielmelli-2017-mipss70-pmf","category":"prognosis","tier":"multivariable-adjusted","genes":["ASXL1","EZH2","SRSF2","IDH1","IDH2"],"diseases":["PMF"],"text":"According to the MIPSS70 and MIPSS70-plus frameworks, the presence of mutations in two or more of ASXL1, EZH2, SRSF2, IDH1, and IDH2 in patients aged 70 years or younger with primary myelofibrosis identifies a particularly adverse overall-survival group.","locator":"Development and Validation of Mutation-Enhanced IPSS: MIPSS70; Development and Validation of the Cytogenetic-Enhanced MIPSS70 Scoring System: MIPSS70-Plus; Table 2"},{"id":"guglielmelli-2017-mipss70-pmf-C0004","paper":"guglielmelli-2017-mipss70-pmf","category":"prognosis","tier":"univariable or descriptive","genes":["CALR","ASXL1","EZH2","SRSF2","IDH1","IDH2"],"diseases":["PMF"],"text":"According to the MIPSS70 framework, which incorporates CALR, ASXL1, EZH2, SRSF2, IDH1, and IDH2 with clinical factors, patients aged 70 years or younger with primary myelofibrosis are classified into low-, intermediate-, and high-risk overall-survival groups.","locator":"Development and Validation of Mutation-Enhanced IPSS: MIPSS70; Table 3; Figure 1A-B"},{"id":"guglielmelli-2017-mipss70-pmf-C0005","paper":"guglielmelli-2017-mipss70-pmf","category":"prognosis","tier":"univariable or descriptive","genes":["CALR","ASXL1","EZH2","SRSF2","IDH1","IDH2"],"diseases":["PMF"],"text":"According to the MIPSS70-plus framework, which incorporates CALR, ASXL1, EZH2, SRSF2, IDH1, and IDH2 with clinical and cytogenetic factors, patients aged 70 years or younger with primary myelofibrosis are classified into low-, intermediate-, high-, and very-high-risk overall-survival groups.","locator":"Development and Validation of the Cytogenetic-Enhanced MIPSS70 Scoring System: MIPSS70-Plus; Table 3; Figure 1C-D"},{"id":"guglielmelli-2017-mipss70-pmf-C0006","paper":"guglielmelli-2017-mipss70-pmf","category":"prognosis","tier":"univariable or descriptive","genes":["CALR","ASXL1","EZH2","SRSF2","IDH1","IDH2"],"diseases":["PMF"],"text":"According to the MIPSS70 framework, which incorporates CALR, ASXL1, EZH2, SRSF2, IDH1, and IDH2 with clinical factors, overall-survival risk stratification in primary myelofibrosis remains informative when patients older than 70 years are included.","locator":"All Age-Inclusive Application of Novel Prognostic Scoring Systems; Appendix Table A2; Discussion"},{"id":"guglielmelli-2017-mipss70-pmf-C0007","paper":"guglielmelli-2017-mipss70-pmf","category":"prognosis","tier":"univariable or descriptive","genes":["CALR","ASXL1","EZH2","SRSF2","IDH1","IDH2"],"diseases":["PMF"],"text":"According to the MIPSS70-plus framework, which incorporates CALR, ASXL1, EZH2, SRSF2, IDH1, and IDH2 with clinical and cytogenetic factors, overall-survival risk stratification in primary myelofibrosis remains informative when patients older than 70 years are included.","locator":"All Age-Inclusive Application of Novel Prognostic Scoring Systems; Appendix Table A2; Discussion"},{"id":"khoury-2022-leukemia-36-1703-C0001","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["CHIP"],"text":"According to WHO 5th Edition 2022, clonal haematopoiesis is recognized as a precursor myeloid disease state, and CHIP is defined as clonal haematopoiesis with somatic mutations in myeloid malignancy-associated genes detected in blood or bone marrow at VAF ≥2% (≥4% for X-linked gene mutations in males), in the absence of a diagnosed haematologic disorder or unexplained cytopenia.","locator":"CLONAL HAEMATOPOIESIS — CHIP definition"},{"id":"khoury-2022-leukemia-36-1703-C0002","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["CCUS"],"text":"According to WHO 5th Edition 2022, CCUS is defined as CHIP with one or more persistent cytopenias that are otherwise unexplained and that do not meet diagnostic criteria for a defined myeloid neoplasm.","locator":"CLONAL HAEMATOPOIESIS — CCUS definition"},{"id":"khoury-2022-leukemia-36-1703-C0003","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["CCUS","MDS","MDS/MPN"],"text":"According to WHO 5th Edition 2022, cytopenia thresholds harmonized across CCUS, MDS and MDS/MPN are haemoglobin <13 g/dL in males or <12 g/dL in females, absolute neutrophil count <1.8 × 10^9/L, and platelets <150 × 10^9/L.","locator":"CLONAL HAEMATOPOIESIS — harmonized cytopenia thresholds"},{"id":"khoury-2022-leukemia-36-1703-C0004","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["BCR","ABL1"],"diseases":["CML"],"text":"According to WHO 5th Edition 2022, chronic myeloid leukaemia is defined by BCR::ABL1 resulting from t(9;22)(q34;q11).","locator":"MYELOPROLIFERATIVE NEOPLASMS — CML definition"},{"id":"khoury-2022-leukemia-36-1703-C0005","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["CML"],"text":"According to WHO 5th Edition 2022, CML is classified into chronic and blast phases; accelerated phase is omitted. Blast phase is defined by ≥20% myeloid blasts in blood or bone marrow, extramedullary proliferation of blasts, or increased lymphoblasts in blood or marrow. The optimal lymphoblast cutoff and significance of low-level B-lymphoblasts remain uncertain.","locator":"MYELOPROLIFERATIVE NEOPLASMS — CML phase classification"},{"id":"khoury-2022-leukemia-36-1703-C0006","paper":"khoury-2022-leukemia-36-1703","category":"treatment","tier":"restated secondary","genes":["ABL1"],"diseases":["CML"],"text":"In chronic-phase CML, ABL1 kinase mutations are a source of resistance to tyrosine-kinase inhibitor
