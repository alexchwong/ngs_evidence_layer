ionable abnormalities can emerge or expand and may identify a targeted salvage option."},{"id":"d-hner-2022-blood-140-1345-C0041","paper":"d-hner-2022-blood-140-1345","category":"biomarker","tier":"guideline criterion","genes":["IDH1"],"diseases":["AML"],"text":"The 2022 ELN recommendations recommend rapid IDH1 mutation screening at initial diagnosis in older patients with AML to identify candidates for ivosidenib-based therapy."},{"id":"d-hner-2022-blood-140-1345-C0042","paper":"d-hner-2022-blood-140-1345","category":"germline","tier":"guideline criterion","genes":["CHEK2","DDX41"],"diseases":[],"text":"In the 2022 ELN recommendations, CHEK2 I200T and truncating DDX41 variants identified on tumor profiling are considered overwhelmingly likely to be germline."},{"id":"d-hner-2022-blood-140-1345-C0044","paper":"d-hner-2022-blood-140-1345","category":"germline","tier":"guideline criterion","genes":["CEBPA"],"diseases":[],"text":"Germline pathogenic or likely pathogenic CEBPA variants are recognized as a myeloid-neoplasm predisposition disorder."},{"id":"d-hner-2022-blood-140-1345-C0045","paper":"d-hner-2022-blood-140-1345","category":"germline","tier":"guideline criterion","genes":["DDX41"],"diseases":[],"text":"Germline pathogenic or likely pathogenic DDX41 variants are recognized as a myeloid-neoplasm predisposition disorder."},{"id":"d-hner-2022-blood-140-1345-C0046","paper":"d-hner-2022-blood-140-1345","category":"germline","tier":"guideline criterion","genes":["TP53"],"diseases":[],"text":"Germline pathogenic or likely pathogenic TP53 variants causing Li-Fraumeni syndrome are associated with predisposition to myeloid neoplasia."},{"id":"d-hner-2022-blood-140-1345-C0047","paper":"d-hner-2022-blood-140-1345","category":"germline","tier":"guideline criterion","genes":["RUNX1","ANKRD26","ETV6"],"diseases":[],"text":"Germline pathogenic or likely pathogenic RUNX1, ANKRD26, and ETV6 variants are recognized myeloid-neoplasm predisposition disorders associated with a preexisting platelet disorder."},{"id":"d-hner-2022-blood-140-1345-C0048","paper":"d-hner-2022-blood-140-1345","category":"germline","tier":"guideline criterion","genes":["GATA2"],"diseases":[],"text":"Germline pathogenic or likely pathogenic GATA2 variants are recognized as a myeloid-neoplasm predisposition disorder."},{"id":"d-hner-2022-blood-140-1345-C0049","paper":"d-hner-2022-blood-140-1345","category":"germline","tier":"guideline criterion","genes":["ELANE","HAX1"],"diseases":[],"text":"Germline ELANE and HAX1 variants associated with severe congenital neutropenia are recognized causes of myeloid-neoplasm predisposition."},{"id":"d-hner-2022-blood-140-1345-C0050","paper":"d-hner-2022-blood-140-1345","category":"germline","tier":"guideline criterion","genes":["SBDS","DNAJC21","EFL1","SRP54"],"diseases":[],"text":"Germline SBDS, DNAJC21, EFL1, and SRP54 variants associated with Shwachman-Diamond syndrome are recognized causes of myeloid-neoplasm predisposition."},{"id":"d-hner-2022-blood-140-1345-C0051","paper":"d-hner-2022-blood-140-1345","category":"germline","tier":"guideline criterion","genes":["ACD","CTC1","DKC1","RTEL1","TERC","TERT","TINF2","NHP2","NOP10","PARN","WRAP53","RPA1"],"diseases":[],"text":"Germline ACD, CTC1, DKC1, RTEL1, TERC, TERT, TINF2, NHP2, NOP10, PARN, WRAP53, and RPA1 variants associated with telomere biology disorders/short telomere syndromes are recognized causes of myeloid-neoplasm predisposition."},{"id":"d-hner-2022-blood-140-1345-C0052","paper":"d-hner-2022-blood-140-1345","category":"germline","tier":"guideline criterion","genes":["CBL"],"diseases":[],"text":"Germline CBL variants causing CBL syndrome are associated with myeloid-neoplasm predisposition."},{"id":"d-hner-2022-blood-140-1345-C0053","paper":"d-hner-2022-blood-140-1345","category":"germline","tier":"guideline criterion","genes":["PTPN11","NRAS","KRAS"],"diseases":[],"text":"Germline PTPN11, NRAS, and KRAS variants associated with Noonan syndrome are recognized causes of myeloid-neoplasm predisposition."},{"id":"d-hner-2022-blood-140-1345-C0054","paper":"d-hner-2022-blood-140-1345","category":"germline","tier":"guideline criterion","genes":["NF1"],"diseases":[],"text":"Germline NF1 variants causing neurofibromatosis type I are associated with myeloid-neoplasm predisposition."},{"id":"d-hner-2022-blood-140-1345-C0055","paper":"d-hner-2022-blood-140-1345","category":"germline","tier":"guideline criterion","genes":["SAMD9","SAMD9L"],"diseases":[],"text":"Germline pathogenic or likely pathogenic SAMD9 and SAMD9L variants are recognized as myeloid-neoplasm predisposition disorders."},{"id":"d-hner-2022-blood-140-1345-C0056","paper":"d-hner-2022-blood-140-1345","category":"germline","tier":"guideline criterion","genes":["BLM"],"diseases":[],"text":"Germline BLM variants causing Bloom syndrome are associated with myeloid-neoplasm predisposition."},{"id":"d-hner-2022-blood-140-1345-C0057","paper":"d-hner-2022-blood-140-1345","category":"germline","tier":"guideline criterion","genes":["CHEK2"],"diseases":[],"text":"Germline pathogenic or likely pathogenic CHEK2 variants are recognized as a myeloid-neoplasm predisposition disorder."},{"id":"d-hner-2022-blood-140-1345-C0058","paper":"d-hner-2022-blood-140-1345","category":"germline","tier":"guideline criterion","genes":["MPL"],"diseases":[],"text":"Germline pathogenic or likely pathogenic MPL variants are recognized as a myeloid-neoplasm predisposition disorder."},{"id":"d-hner-2022-blood-140-1345-C0059","paper":"d-hner-2022-blood-140-1345","category":"germline","tier":"guideline criterion","genes":["RECQL4"],"diseases":[],"text":"Germline pathogenic or likely pathogenic RECQL4 variants are recognized as a myeloid-neoplasm predisposition disorder."},{"id":"d-hner-2022-blood-140-1345-C0060","paper":"d-hner-2022-blood-140-1345","category":"germline","tier":"guideline criterion","genes":["BRCA1","BRCA2"],"diseases":[],"text":"Germline BRCA1 and BRCA2 variants associated with hereditary breast and ovarian cancer are listed as causes of myeloid-neoplasm predisposition."},{"id":"d-hner-2022-blood-140-1345-C0061","paper":"d-hner-2022-blood-140-1345","category":"germline","tier":"guideline criterion","genes":["MLH1","MSH2","MSH6","PMS2"],"diseases":[],"text":"Germline MLH1, MSH2, MSH6, and PMS2 variants associated with Lynch syndrome are listed as causes of myeloid-neoplasm predisposition."},{"id":"d-hner-2022-blood-140-1345-C0062","paper":"d-hner-2022-blood-140-1345","category":"germline","tier":"guideline criterion","genes":["NBN"],"diseases":[],"text":"Germline NBN variants causing Nijmegen breakage syndrome are associated with myeloid-neoplasm predisposition."},{"id":"d-hner-2022-blood-140-1345-C0063","paper":"d-hner-2022-blood-140-1345","category":"germline","tier":"guideline criterion","genes":["WAS"],"diseases":[],"text":"Germline WAS variants causing Wiskott-Aldrich syndrome are associated with myeloid-neoplasm predisposition."},{"id":"d-hner-2022-blood-140-1345-C0071","paper":"d-hner-2022-blood-140-1345","category":"treatment","tier":"guideline criterion","genes":[],"diseases":["AML"],"text":"The 2022 ELN recommendations identify anthracycline plus cytarabine as the standard induction backbone for patients with AML who are fit for intensive therapy."},{"id":"d-hner-2022-blood-140-1345-C0072","paper":"d-hner-2022-blood-140-1345","category":"treatment","tier":"guideline criterion","genes":["FLT3"],"diseases":["AML"],"text":"The 2022 ELN recommendations identify incorporation of midostaurin into first-line daunorubicin/cytarabine induction and cytarabine consolidation as standard treatment for intensively treated FLT3-mutated AML; this regimen improves overall survival."},{"id":"d-hner-2022-blood-140-1345-C0074","paper":"d-hner-2022-blood-140-1345","category":"treatment","tier":"guideline criterion","genes":["CD33"],"diseases":["AML"],"text":"The 2022 ELN recommendations list gemtuzumab ozogamicin combined with daunorubicin and cytarabine as an approved frontline treatment option for previously untreated CD33-positive AML."},{"id":"d-hner-2022-blood-140-1345-C0075","paper":"d-hner-2022-blood-140-1345","category":"treatment","tier":"restated secondary","genes":["RUNX1","RUNX1T1","CBFB","MYH11"],"diseases":["AML"],"text":"In RUNX1::RUNX1T1 and CBFB::MYH11 core-binding-factor AML, adding gemtuzumab ozogamicin to frontline intensive therapy provides particular benefit."},{"id":"d-hner-2022-blood-140-1345-C0076","paper":"d-hner-2022-blood-140-1345","category":"treatment","tier":"restated secondary","genes":["NPM1"],"diseases":["AML"],"text":"In NPM1-mutated AML, adding gemtuzumab ozogamicin reduces relapse risk, although an event-free-survival benefit was not demonstrated in the cited randomized study."},{"id":"d-hner-2022-blood-140-1345-C0078","paper":"d-hner-2022-blood-140-1345","category":"treatment","tier":"guideline criterion","genes":[],"diseases":["AML"],"text":"The 2022 ELN recommendations generally recommend intermediate-dose cytarabine for consolidation after CR/CRh/CRi following intensive AML treatment; high-dose cytarabine adds toxicity without demonstrated survival benefit."},{"id":"d-hner-2022-blood-140-1345-C0080","paper":"d-hner-2022-blood-140-1345","category":"treatment","tier":"guideline criterion","genes":[],"diseases":["AML"],"text":"The 2022 ELN recommendations identify azacitidine plus venetoclax as a standard-of-care regimen for older or unfit patients with AML who are not candidates for intensive chemotherapy; the combination improves response and overall survival versus azacitidine alone."},{"id":"d-hner-2022-blood-140-1345-C0081","paper":"d-hner-2022-blood-140-1345","category":"treatment","tier":"guideline criterion","genes":[],"diseases":["AML"],"text":"The 2022 ELN recommendations list low-dose cytarabine plus venetoclax as an alternative treatment option for patients with AML unsuitable for intensive chemotherapy who cannot receive a hypomethylating agent."},{"id":"d-hner-2022-blood-140-1345-C0082","paper":"d-hner-2022-blood-140-1345","category":"treatment","tier":"restated secondary","genes":["IDH1"],"diseases":["AML"],"text":"The 2022 ELN recommendations list ivosidenib plus azacitidine as a treatment option for newly diagnosed IDH1-mutated AML unsuitable for intensive chemotherapy; randomized evidence shows improved event-free survival, response, and overall survival versus azacitidine plus placebo."},{"id":"d-hner-2022-blood-140-1345-C0083","paper":"d-hner-2022-blood-140-1345","category":"treatment","tier":"guideline criterion","genes":["IDH1"],"diseases":["AML"],"text":"The 2022 ELN recommendations state that very frail patients with IDH1-mutated AML who cannot tolerate hypomethylating-agent-based therapy may be offered ivosidenib monotherapy, which can be continued until progression."},{"id":"d-hner-2022-blood-140-1345-C0084","paper":"d-hner-2022-blood-140-1345","category":"treatment","tier":"guideline criterion","genes":["IDH2"],"diseases":["AML"],"text":"The 2022 ELN recommendations state that very frail patients with IDH2-mutated AML who cannot tolerate hypomethylating-agent-based therapy may be offered monotherapy with a targeted IDH2 inhibitor."},{"id":"d-hner-2022-blood-140-1345-C0085","paper":"d-hner-2022-blood-140-1345","category":"treatment","tier":"restated secondary","genes":["FLT3"],"diseases":["AML"],"text":"The 2022 ELN recommendations list gilteritinib as a salvage option for relapsed/refractory FLT3-mutated AML after prior intensive chemotherapy; randomized evidence shows improved response and overall survival versus physician-choice salvage therapy."},{"id":"d-hner-2022-blood-140-1345-C0086","paper":"d-hner-2022-blood-140-1345","category":"treatment","tier":"restated secondary","genes":["FLT3"],"diseases":["AML"],"text":"For relapsed/refractory FLT3-ITD-positive AML, quizartinib improves overall survival versus conventional care, although FDA and EMA approval was not granted after review of the cited trial data."},{"id":"d-hner-2022-blood-140-1345-C0087","paper":"d-hner-2022-blood-140-1345","category":"treatment","tier":"restated secondary","genes":["IDH1"],"diseases":["AML"],"text":"The 2022 ELN recommendations list ivosidenib as a salvage option for relapsed/refractory IDH1-mutated AML, supported by clinically meaningful single-agent antileukemic activity from single-arm evidence."},{"id":"d-hner-2022-blood-140-1345-C0088","paper":"d-hner-2022-blood-140-1345","category":"treatment","tier":"restated secondary","genes":["IDH2"],"diseases":["AML"],"text":"The 2022 ELN recommendations list enasidenib as a salvage option for relapsed/refractory IDH2-mutated AML because clinically useful single-agent antileukemic activity has been demonstrated, although a randomized late-line study did not improve overall survival versus conventional care."},{"id":"d-hner-2022-blood-140-1345-C0089","paper":"d-hner-2022-blood-140-1345","category":"treatment","tier":"guideline criterion","genes":["FLT3"],"diseases":["AML"],"text":"The 2022 ELN recommendations consider use of a FLT3 inhibitor a reasonable posttransplant maintenance strategy for FLT3-mutated AML, based on randomized evidence that sorafenib maintenance reduces relapse after allogeneic HCT."},{"id":"d-hner-2022-blood-140-1345-C0090","paper":"d-hner-2022-blood-140-1345","category":"treatment","tier":"guideline criterion","genes":["FLT3"],"diseases":["AML"],"text":"The 2022 ELN recommendations identify gilteritinib as the preferred treatment option for FLT3-mutated AML relapsing after allogeneic HCT with an emergent FLT3-mutant clone."},{"id":"d-hner-2022-blood-140-1345-C0091","paper":"d-hner-2022-blood-140-1345","category":"treatment","tier":"guideline criterion","genes":["RUNX1","CEBPA"],"diseases":["AML"],"text":"The 2022 ELN recommendations advise against using related donor stem cells carrying the same deleterious germline RUNX1 or CEBPA variant in a patient with AML."},{"id":"d-hner-2022-blood-140-1345-C0093","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["AML"],"text":"Under the 2022 ICC, the former AML with myelodysplasia-related changes (AML-MRC) category is removed, and multilineage dysplasia is no longer an independent criterion for that AML category."},{"id":"d-hner-2022-blood-140-1345-C0094","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"guideline criterion","genes":["TP53"],"diseases":["AML","MDS/AML"],"text":"Under the 2022 ICC, cases lacking a recurrent AML-defining abnormality, TP53-mutated category, myelodysplasia-related gene mutation category, or myelodysplasia-related cytogenetic category are classified as AML, not otherwise specified at ≥20% blasts, or MDS/AML at 10%-19% blasts, irrespective of multilineage dysplasia."},{"id":"d-hner-2022-blood-140-1345-C0095","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["AML"],"text":"Under the 2022 ICC, when an inherited germline predisposing disorder is identified in a patient with AML, the germline disorder is appended as a diagnostic qualifier to the specific AML category."},{"id":"d-hner-2022-blood-140-1345-C0096","paper":"d-hner-2022-blood-140-1345","category":"prognosis","tier":"guideline criterion","genes":["NPM1"],"diseases":["AML"],"text":"The 2022 ELN recommendations state that subsequent MRD response may modify the initial ELN genetic risk assignment in NPM1-mutated AML."},{"id":"d-hner-2022-blood-140-1345-C0097","paper":"d-hner-2022-blood-140-1345","category":"biomarker","tier":"guideline criterion","genes":["FLT3","IDH1","IDH2","NPM1","CEBPA","DDX41","TP53","ASXL1","BCOR","EZH2","RUNX1","SF3B1","SRSF2","STAG2","U2AF1","ZRSR2"],"diseases":["AML"],"text":"The 2022 ELN recommendations recommend mutation testing at AML diagnosis for FLT3, IDH1, IDH2, NPM1, CEBPA, DDX41, TP53, ASXL1, BCOR, EZH2, RUNX1, SF3B1, SRSF2, STAG2, U2AF1, and ZRSR2 because these genes are required for disease/risk classification and/or identification of actionable therapeutic targets as applicable."},{"id":"d-hner-2022-blood-140-1345-C0098","paper":"d-hner-2022-blood-140-1345","category":"biomarker","tier":"guideline criterion","genes":["PML","RARA","CBFB","MYH11","RUNX1","RUNX1T1","KMT2A","BCR","ABL1"],"diseases":["AML"],"text":"The 2022 ELN recommendations recommend screening at AML diagnosis for PML::RARA, CBFB::MYH11, RUNX1::RUNX1T1, KMT2A rearrangements, and BCR::ABL1 when rapid therapeutic information is needed, chromosome morphology is poor, or typical morphology lacks the suspected cytogenetic abnormality."},{"id":"d-hner-2022-blood-140-1345-C0099","paper":"d-hner-2022-blood-140-1345","category":"biomarker","tier":"guideline criterion","genes":["ANKRD26","BCORL1","BRAF","CBL","CSF3R","DNMT3A","ETV6","GATA2","JAK2","KIT","KRAS","NRAS","NF1","PHF6","PPM1D","PTPN11","RAD21","SETBP1","TET2","WT1"],"diseases":["AML"],"text":"The 2022 ELN recommendations list ANKRD26, BCORL1, BRAF, CBL, CSF3R, DNMT3A, ETV6, GATA2, JAK2, KIT, KRAS, NRAS, NF1, PHF6, PPM1D, PTPN11, RAD21, SETBP1, TET2, and WT1 as additional genes for possible investigational NGS-based disease monitoring after AML diagnosis; DNMT3A and TET2 mutations consistent with clonal hematopoiesis are specifically excluded from use as AML MRD markers."},{"id":"d-hner-2022-blood-140-1345-C0106","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"guideline criterion","genes":["BCR","ABL1","KMT2A"],"diseases":["acute leukaemia of ambiguous lineage"],"text":"Under the 2022 ICC, mixed-phenotype acute leukemia with BCR::ABL1 and mixed-phenotype acute leukemia with KMT2A rearrangement are recognized distinct genetic entities within acute leukemia of ambiguous lineage."},{"id":"d-hner-2022-blood-140-1345-C0107","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"guideline criterion","genes":["BCR","ABL1"],"diseases":["CML","AML"],"text":"Under the 2022 ICC, BCR::ABL1-positive disease with 10%-19% blasts is classified as chronic myeloid leukemia in accelerated phase rather than AML."},{"id":"d-hner-2022-blood-140-1345-C0108","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"guideline criterion","genes":["BCR","ABL1"],"diseases":["CML","AML"],"text":"Under the 2022 ICC, in a patient with a history of chronic myeloid leukemia, BCR::ABL1-positive disease with ≥20% blasts is classified as CML in myeloid blast phase rather than de novo AML with BCR::ABL1."},{"id":"d-hner-2022-blood-140-1345-C0109","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["MDS/MPN","AML"],"text":"Under the 2022 ICC, a prior MDS/MPN is appended as a diagnostic qualifier to the AML category only when the MDS/MPN was established by standard diagnostics more than 3 months before AML diagnosis, and the MDS/MPN type should be specified."},{"id":"d-hner-2022-blood-140-1345-C0110","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["MPN","MPN blast phase"],"text":"Under the 2022 ICC, patients with a prior myeloproliferative neoplasm are excluded from the AML hierarchy and are classified as accelerated-phase MPN at 10%-19% blasts or MPN blast phase at ≥20% blasts."},{"id":"d-hner-2022-blood-140-1345-C0111","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["AML"],"text":"Under the 2022 ICC, myeloblasts, monoblasts, and megakaryoblasts are included in the blast count used for AML classification."},{"id":"d-hner-2022-blood-140-1345-C0112","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["AML"],"text":"Under the 2022 ICC, in AML with monocytic or myelomonocytic differentiation, monoblasts and promonocytes are counted as blast equivalents, whereas abnormal monocytes are not."},{"id":"d-hner-2022-blood-140-1345-C0113","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"guideline criterion","genes":["PML","RARA"],"diseases":["APL","AML"],"text":"Under the 2022 ICC, in PML::RARA or variant RARA-rearranged APL/AML, promyelocytes are counted as blast equivalents for classification."},{"id":"d-hner-2022-blood-140-1345-C0114","paper":"d-hner-2022-blood-140-1345","category":"treatment","tier":"guideline criterion","genes":["PML","RARA","RUNX1","RUNX1T1","CBFB","MYH11","MLLT3","KMT2A","DEK","NUP214","GATA2","MECOM","NPM1","CEBPA","IRF2BP2","ZBTB16","STAT5B","STAT3","TBL1XR1","FIP1L1","BCOR","AFF1","AFDN","MLLT10","TET1","ELL","MLLT1","MYC","ETV6","PRDM16","RPN1","RBM15","MRTFA","MLF1","NUP98","NSD1","MNX1","KAT6A","CREBBP","PICALM","KMD5A","FUS","ERG","CBFA2T3","GLIS2"],"diseases":["MDS/MPN","AML"],"text":"The 2022 ELN recommendations advise AML-type therapy for a patient with prior MDS/MPN when an AML-defining recurrent abnormality is detected at ≥10% blasts—including PML::RARA, RUNX1::RUNX1T1, CBFB::MYH11, MLLT3::KMT2A, DEK::NUP214, GATA2/MECOM rearrangement, mutated NPM1, in-frame bZIP CEBPA, or the listed variant RARA, KMT2A, MECOM, and rare recurrent rearrangements involving IRF2BP2, ZBTB16, STAT5B, STAT3, TBL1XR1, FIP1L1, BCOR, AFF1, AFDN, MLLT10, TET1, ELL, MLLT1, MYC, ETV6, PRDM16, RPN1, RBM15, MRTFA, MLF1, NUP98, NSD1, MNX1, KAT6A, CREBBP, PICALM, KMD5A, FUS, ERG, CBFA2T3, or GLIS2—even though the antecedent MDS/MPN diagnosis is otherwise retained until ≥20% blasts."},{"id":"d-hner-2022-blood-140-1345-C0115","paper":"d-hner-2022-blood-140-1345","category":"biomarker","tier":"guideline criterion","genes":["NPM1","RUNX1","RUNX1T1","CBFB","MYH11"],"diseases":["AML"],"text":"Under the ELN MRD framework incorporated into the 2022 AML recommendations, at the end of consolidation, molecular CR with qPCR MRD below 2% in NPM1-mutated, RUNX1::RUNX1T1, or CBFB::MYH11 AML is operationally designated MRD-negative."},{"id":"d-hner-2022-blood-140-1345-C0116","paper":"d-hner-2022-blood-140-1345","category":"biomarker","tier":"guideline criterion","genes":["FLT3"],"diseases":["AML"],"text":"The 2022 ELN recommendations advise retaining capillary electrophoresis for FLT3-ITD detection in AML because longer FLT3 internal tandem duplications can be missed by next-generation sequencing."},{"id":"d-hner-2022-blood-140-1345-C0117","paper":"d-hner-2022-blood-140-1345","category":"germline","tier":"guideline criterion","genes":["CHEK2","DDX41"],"diseases":[],"text":"The 2022 ELN recommendations advise consideration of germline testing when CHEK2 I200T or a truncating DDX41 variant is identified on tumor profiling, even when identified once."},{"id":"d-hner-2022-blood-140-1345-C0122","paper":"d-hner-2022-blood-140-1345","category":"treatment","tier":"restated secondary","genes":["CD33"],"diseases":["AML"],"text":"In patients aged 50-70 years with de novo CD33-positive AML, adding gemtuzumab ozogamicin to frontline therapy provides an event-free-survival benefit in favorable- or intermediate-cytogenetic-risk disease, with no corresponding benefit stated for adverse-risk disease."},{"id":"d-hner-2022-blood-140-1345-C0124","paper":"d-hner-2022-blood-140-1345","category":"biomarker","tier":"guideline criterion","genes":["RUNX1","RUNX1T1","CBFB","MYH11","KMT2A","MECOM"],"diseases":["AML"],"text":"The 2022 ELN recommendations identify FISH as an alternative method to detect RUNX1::RUNX1T1, CBFB::MYH11, KMT2A rearrangements, and MECOM rearrangements when conventional cytogenetic analysis yields no analyzable metaphases in AML."},{"id":"d-hner-2022-blood-140-1345-C0127","paper":"d-hner-2022-blood-140-1345","category":"treatment","tier":"guideline criterion","genes":[],"diseases":["AML"],"text":"The 2022 ELN recommendations list best supportive care as an appropriate option for patients with AML who cannot tolerate any active antileukemic therapy or who do not wish to receive antileukemic treatment."},{"id":"d-hner-2024-blood-144-2169-C0001","paper":"d-hner-2024-blood-144-2169","category":"prognosis","tier":"restated secondary","genes":["NPM1","IDH2","FLT3","KRAS","NRAS"],"diseases":["AML"],"text":"Exploratory analyses in NPM1- or IDH2-mutated AML treated with azacitidine/venetoclax found inferior overall survival when FLT3-ITD, KRAS, and/or NRAS mutations co-occurred."},{"id":"d-hner-2024-blood-144-2169-C0002","paper":"d-hner-2024-blood-144-2169","category":"prognosis","tier":"restated secondary","genes":["RUNX1"],"diseases":["AML"],"text":"Exploratory analyses in RUNX1-mutated AML treated with azacitidine/venetoclax suggest inferior overall survival when an activated kinase pathogenic variant is present."},{"id":"d-hner-2024-blood-144-2169-C0003","paper":"d-hner-2024-blood-144-2169","category":"prognosis","tier":"restated secondary","genes":["FLT3","KRAS","NRAS"],"diseases":["AML"],"text":"In AML with myelodysplasia-related gene mutations treated with HMA/venetoclax, co-occurring FLT3-ITD, KRAS, and/or NRAS signaling mutations are associated with inferior prognosis."},{"id":"d-hner-2024-blood-144-2169-C0004","paper":"d-hner-2024-blood-144-2169","category":"prognosis","tier":"restated secondary","genes":["FLT3"],"diseases":["AML"],"text":"FLT3-ITD positivity has an adverse prognostic impact in AML treated with azacitidine/venetoclax."},{"id":"d-hner-2024-blood-144-2169-C0005","paper":"d-hner-2024-blood-144-2169","category":"prognosis","tier":"guideline criterion","genes":["NPM1","IDH2","FLT3","NRAS","KRAS","TP53"],"diseases":["AML"],"text":"According to the proposed 2024 ELN Less-Intensive classification, newly diagnosed AML with mutated NPM1 or IDH2, FLT3-ITD negativity, NRAS/KRAS wild type, and TP53 wild type is favorable risk with HMA-based less-intensive therapy. This framework does not apply after prior HMA therapy and has limited relevance in patients with a prior myeloproliferative neoplasm."},{"id":"d-hner-2024-blood-144-2169-C0006","paper":"d-hner-2024-blood-144-2169","category":"prognosis","tier":"guideline criterion","genes":["IDH1","TP53"],"diseases":["AML"],"text":"According to the proposed 2024 ELN Less-Intensive classification, IDH1-mutated, TP53-wild-type AML is favorable risk specifically with azacitidine/ivosidenib, irrespective of the presence of activating signaling gene mutations. This framework does not apply after prior HMA therapy and has limited relevance in patients with a prior myeloproliferative neoplasm."},{"id":"d-hner-2024-blood-144-2169-C0007","paper":"d-hner-2024-blood-144-2169","category":"prognosis","tier":"guideline criterion","genes":["DDX41"],"diseases":["AML"],"text":"According to the proposed 2024 ELN Less-Intensive classification, DDX41-mutated AML is favorable risk with HMA-based less-intensive therapy. This framework does not apply after prior HMA therapy and has limited relevance in patients with a prior myeloproliferative neoplasm."},{"id":"d-hner-2024-blood-144-2169-C0008","paper":"d-hner-2024-blood-144-2169","category":"prognosis","tier":"guideline criterion","genes":["FLT3","NRAS","KRAS","TP53"],"diseases":["AML"],"text":"According to the proposed 2024 ELN Less-Intensive classification, other cytogenetic and/or molecular abnormalities in newly diagnosed AML are tentatively favorable risk when FLT3-ITD is negative, NRAS and KRAS are wild type, and TP53 is wild type. This framework does not apply after prior HMA therapy and has limited relevance in patients with a prior myeloproliferative neoplasm."},{"id":"d-hner-2024-blood-144-2169-C0009","paper":"d-hner-2024-blood-144-2169","category":"prognosis","tier":"guideline criterion","genes":["FLT3","NRAS","KRAS","TP53"],"diseases":["AML"],"text":"According to the proposed 2024 ELN Less-Intensive classification, other cytogenetic and molecular abnormalities in newly diagnosed AML are tentatively intermediate risk when FLT3-ITD is positive and/or NRAS or KRAS is mutated, with TP53 wild type. This framework does not apply after prior HMA therapy and has limited relevance in patients with a prior myeloproliferative neoplasm."},{"id":"d-hner-2024-blood-144-2169-C0010","paper":"d-hner-2024-blood-144-2169","category":"prognosis","tier":"guideline criterion","genes":["TP53"],"diseases":["AML"],"text":"According to the proposed 2024 ELN Less-Intensive classification, TP53-mutated AML is adverse risk with HMA-based less-intensive therapy. This framework does not apply after prior HMA therapy and has limited relevance in patients with a prior myeloproliferative neoplasm."},{"id":"d-hner-2024-blood-144-2169-C0012","paper":"d-hner-2024-blood-144-2169","category":"prognosis","tier":"guideline criterion","genes":["FLT3","NRAS","KRAS","TP53"],"diseases":["AML"],"text":"According to the proposed 2024 ELN Less-Intensive classification, AML with myelodysplasia-related gene mutations is favorable risk when FLT3-ITD is negative, NRAS and KRAS are wild type, and TP53 is wild type. This framework does not apply after prior HMA therapy and has limited relevance in patients with a prior myeloproliferative neoplasm."},{"id":"d-hner-2024-blood-144-2169-C0013","paper":"d-hner-2024-blood-144-2169","category":"prognosis","tier":"guideline criterion","genes":["FLT3","NRAS","KRAS","TP53"],"diseases":["AML"],"text":"According to the proposed 2024 ELN Less-Intensive classification, AML with myelodysplasia-related gene mutations is intermediate risk when FLT3-ITD is positive and/or NRAS or KRAS is mutated, with TP53 wild type. This framework does not apply after prior HMA therapy and has limited relevance in patients with a prior myeloproliferative neoplasm."},{"id":"d-hner-2024-blood-144-2169-C0014","paper":"d-hner-2024-blood-144-2169","category":"prognosis","tier":"restated secondary","genes":["ASXL1"],"diseases":["AML"],"text":"ASXL1 mutations have been linked to improved outcomes in AML treated with HMA/venetoclax."},{"id":"d-hner-2024-blood-144-2169-C0016","paper":"d-hner-2024-blood-144-2169","category":"treatment","tier":"restated secondary","genes":["TP53","FLT3"],"diseases":["AML"],"text":"In TP53-mutated or FLT3-ITD-positive AML, adding venetoclax to azacitidine has been reported not to improve survival beyond azacitidine alone."},{"id":"d-hner-2024-blood-144-2169-C0017","paper":"d-hner-2024-blood-144-2169","category":"treatment","tier":"restated secondary","genes":["DDX41"],"diseases":["AML"],"text":"DDX41-mutated AML treated with HMA/venetoclax has been reported to have a high response rate."},{"id":"d-hner-2024-blood-144-2169-C0018","paper":"d-hner-2024-blood-144-2169","category":"treatment","tier":"restated secondary","genes":["IDH1"],"diseases":["AML"],"text":"For IDH1-mutated AML receiving less-intensive therapy, azacitidine/ivosidenib is an established treatment standard."},{"id":"d-hner-2024-blood-144-2169-C0019","paper":"d-hner-2024-blood-144-2169","category":"treatment","tier":"restated secondary","genes":["IDH1"],"diseases":["AML"],"text":"In IDH1-mutated AML, azacitidine/ivosidenib improves overall survival compared with azacitidine/placebo."},{"id":"d-hner-2024-blood-144-2169-C0020","paper":"d-hner-2024-blood-144-2169","category":"treatment","tier":"restated secondary","genes":["NPM1","IDH2"],"diseases":["AML"],"text":"NPM1-mutated or IDH2-mutated AML appears sensitive to venetoclax treatment."},{"id":"d-hner-2024-blood-144-2169-C0021","paper":"d-hner-2024-blood-144-2169","category":"germline","tier":"guideline criterion","genes":["DDX41"],"diseases":["AML"],"text":"In AML, identification of a DDX41 mutation at near-heterozygous frequency should prompt consideration of germline DDX41 mutation."},{"id":"elena-2016-blood-128-1408-C0001","paper":"elena-2016-blood-128-1408","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["CMML"],"text":"According to the FAB classification, chronic myelomonocytic leukemia is classified as myelodysplastic CMML when the leukocyte count is ≤13 × 10^9/L and myeloproliferative CMML when it is >13 × 10^9/L."},{"id":"elena-2016-blood-128-1408-C0003","paper":"elena-2016-blood-128-1408","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["CMML"],"text":"According to the 2016 WHO revision, chronic myelomonocytic leukemia includes dysplastic and proliferative types."},{"id":"elena-2016-blood-128-1408-C0005","paper":"elena-2016-blood-128-1408","category":"prognosis","tier":"multivariable-adjusted","genes":["ASXL1","NRAS","RUNX1","SETBP1"],"diseases":["CMML"],"text":"According to the CMML-specific genetic score developed as part of the CPSS-Mol framework, mutations in ASXL1, NRAS, RUNX1, and SETBP1 are independently associated with inferior overall survival in chronic myelomonocytic leukemia."},{"id":"elena-2016-blood-128-1408-C0006","paper":"elena-2016-blood-128-1408","category":"prognosis","tier":"univariable or descriptive","genes":["EZH2"],"diseases":["CMML"],"text":"In chronic myelomonocytic leukemia, EZH2 mutation is associated with inferior overall survival in univariable analysis, but was not retained as an independent prognostic factor in multivariable analysis."},{"id":"guglielmelli-2017-mipss70-pmf-C0001","paper":"guglielmelli-2017-mipss70-pmf","category":"prognosis","tier":"multivariable-adjusted","genes":["CALR"],"diseases":["PMF"],"text":"According to the MIPSS70 and MIPSS70-plus frameworks, absence of a type 1-like CALR mutation in patients aged 70 years or younger with primary myelofibrosis is associated with inferior overall survival."},{"id":"guglielmelli-2017-mipss70-pmf-C0002","paper":"guglielmelli-2017-mipss70-pmf","category":"prognosis","tier":"multivariable-adjusted","genes":["ASXL1","EZH2","SRSF2","IDH1","IDH2"],"diseases":["PMF"],"text":"According to the MIPSS70 and MIPSS70-plus frameworks, the presence of a high-molecular-risk mutation in ASXL1, EZH2, SRSF2, IDH1, or IDH2 in patients aged 70 years or younger with primary myelofibrosis is associated with inferior overall survival."},{"id":"guglielmelli-2017-mipss70-pmf-C0003","paper":"guglielmelli-2017-mipss70-pmf","category":"prognosis","tier":"multivariable-adjusted","genes":["ASXL1","EZH2","SRSF2","IDH1","IDH2"],"diseases":["PMF"],"text":"According to the MIPSS70 and MIPSS70-plus frameworks, the presence of mutations in two or more of ASXL1, EZH2, SRSF2, IDH1, and IDH2 in patients aged 70 years or younger with primary myelofibrosis identifies a particularly adverse overall-survival group."},{"id":"guglielmelli-2017-mipss70-pmf-C0004","paper":"guglielmelli-2017-mipss70-pmf","category":"prognosis","tier":"univariable or descriptive","genes":["CALR","ASXL1","EZH2","SRSF2","IDH1","IDH2"],"diseases":["PMF"],"text":"According to the MIPSS70 framework, which incorporates CALR, ASXL1, EZH2, SRSF2, IDH1, and IDH2 with clinical factors, patients aged 70 years or younger with primary myelofibrosis are classified into low-, intermediate-, and high-risk overall-survival groups."},{"id":"guglielmelli-2017-mipss70-pmf-C0005","paper":"guglielmelli-2017-mipss70-pmf","category":"prognosis","tier":"univariable or descriptive","genes":["CALR","ASXL1","EZH2","SRSF2","IDH1","IDH2"],"diseases":["PMF"],"text":"According to the MIPSS70-plus framework, which incorporates CALR, ASXL1, EZH2, SRSF2, IDH1, and IDH2 with clinical and cytogenetic factors, patients aged 70 years or younger with primary myelofibrosis are classified into low-, intermediate-, high-, and very-high-risk overall-survival groups."},{"id":"guglielmelli-2017-mipss70-pmf-C0006","paper":"guglielmelli-2017-mipss70-pmf","category":"prognosis","tier":"univariable or descriptive","genes":["CALR","ASXL1","EZH2","SRSF2","IDH1","IDH2"],"diseases":["PMF"],"text":"According to the MIPSS70 framework, which incorporates CALR, ASXL1, EZH2, SRSF2, IDH1, and IDH2 with clinical factors, overall-survival risk stratification in primary myelofibrosis remains informative when patients older than 70 years are included."},{"id":"guglielmelli-2017-mipss70-pmf-C0007","paper":"guglielmelli-2017-mipss70-pmf","category":"prognosis","tier":"univariable or descriptive","genes":["CALR","ASXL1","EZH2","SRSF2","IDH1","IDH2"],"diseases":["PMF"],"text":"According to the MIPSS70-plus framework, which incorporates CALR, ASXL1, EZH2, SRSF2, IDH1, and IDH2 with clinical and cytogenetic factors, overall-survival risk stratification in primary myelofibrosis remains informative when patients older than 70 years are included."},{"id":"khoury-2022-leukemia-36-1703-C0001","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["CHIP"],"text":"According to WHO 5th Edition 2022, clonal haematopoiesis is recognized as a precursor myeloid disease state, and CHIP is defined as clonal haematopoiesis with somatic mutations in myeloid malignancy-associated genes detected in blood or bone marrow at VAF ≥2% (≥4% for X-linked gene mutations in males), in the absence of a diagnosed haematologic disorder or unexplained cytopenia."},{"id":"khoury-2022-leukemia-36-1703-C0002","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["CCUS"],"text":"According to WHO 5th Edition 2022, CCUS is defined as CHIP with one or more persistent cytopenias that are otherwise unexplained and that do not meet diagnostic criteria for a defined myeloid neoplasm."},{"id":"khoury-2022-leukemia-36-1703-C0003","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["CCUS","MDS","MDS/MPN"],"text":"According to WHO 5th Edition 2022, cytopenia thresholds harmonized across CCUS, MDS and MDS/MPN are haemoglobin <13 g/dL in males or <12 g/dL in females, absolute neutrophil count <1.8 × 10^9/L, and platelets <150 × 10^9/L."},{"id":"khoury-2022-leukemia-36-1703-C0004","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["BCR","ABL1"],"diseases":["CML"],"text":"According to WHO 5th Edition 2022, chronic myeloid leukaemia is defined by BCR::ABL1 resulting from t(9;22)(q34;q11)."},{"id":"khoury-2022-leukemia-36-1703-C0005","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["CML"],"text":"According to WHO 5th Edition 2022, CML is classified into chronic and blast phases; accelerated phase is omitted. Blast phase is defined by ≥20% myeloid blasts in blood or bone marrow, extramedullary proliferation of blasts, or increased lymphoblasts in blood or marrow. The optimal lymphoblast cutoff and significance of low-level B-lymphoblasts remain uncertain."},{"id":"khoury-2022-leukemia-36-1703-C0006","paper":"khoury-2022-leukemia-36-1703","category":"treatment","tier":"restated secondary","genes":["ABL1"],"diseases":["CML"],"text":"In chronic-phase CML, ABL1 kinase mutations are a source of resistance to tyrosine-kinase inhibitor therapy."},{"id":"khoury-2022-leukemia-36-1703-C0009","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["JAK2"],"diseases":["PV"],"text":"According to WHO 5th Edition 2022, major diagnostic criteria for polycythaemia vera include elevated haemoglobin and/or haematocrit, bone-marrow trilineage hyperplasia (panmyelosis) with pleomorphic mature megakaryocytes, and JAK2 p.V617F or a JAK2 exon 12 mutation. Measurement of increased red-cell mass with 51Cr-labelled red cells is no longer a diagnostic criterion."},{"id":"khoury-2022-leukemia-36-1703-C0011","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["PMF","ET","PV"],"text":"According to WHO 5th Edition 2022, recognition of prefibrotic primary myelofibrosis remains necessary to distinguish it from essential thrombocythaemia, polycythaemia vera and fibrotic primary myelofibrosis."},{"id":"khoury-2022-leukemia-36-1703-C0012","paper":"khoury-2022-leukemia-36-1703","category":"prognosis","tier":"restated secondary","genes":["EZH2","IDH1","IDH2","SRSF2","U2AF1","ASXL1"],"diseases":["PMF"],"text":"In primary myelofibrosis, mutations in EZH2, IDH1, IDH2, SRSF2, U2AF1 and ASXL1 are associated with poorer prognostic risk."},{"id":"khoury-2022-leukemia-36-1703-C0018","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["BCR","ABL1"],"diseases":["CNL"],"text":"According to WHO 5th Edition 2022, chronic neutrophilic leukaemia is a BCR::ABL1-negative MPN characterized by sustained peripheral-blood neutrophilia with WBC ≥25 × 10^9/L and ≥80% segmented neutrophils and bands, bone-marrow hypercellularity due to neutrophilic granulocyte proliferation, and hepatosplenomegaly."},{"id":"khoury-2022-leukemia-36-1703-C0019","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["CEL"],"text":"According to WHO 5th Edition 2022, chronic eosinophilic leukaemia is defined by sustained clonal proliferation of morphologically abnormal eosinophils and eosinophil precursors producing persistent hypereosinophilia in blood and marrow. Sustained hypereosinophilia requires ≥4 weeks; both clonality and abnormal bone-marrow morphology are required; increased blasts no longer substitute for clonality; and the former “not otherwise specified” qualifier is omitted."},{"id":"khoury-2022-leukemia-36-1703-C0023","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["MPN-U"],"text":"According to WHO 5th Edition 2022, MPN-U (MPN-NOS) is reserved for cases with clinical, laboratory, morphologic and molecular features of MPN that either fail criteria for a specific MPN type or overlap distinct MPN types."},{"id":"khoury-2022-leukemia-36-1703-C0024","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["KMT2A"],"diseases":["JMML"],"text":"According to WHO 5th Edition 2022, JMML diagnosis integrates clinical, laboratory and molecular criteria. Updated criteria exclude KMT2A rearrangements, no longer use monosomy 7 as a cytogenetic diagnostic criterion, and emphasize molecular studies demonstrating RAS-pathway activation."},{"id":"khoury-2022-leukemia-36-1703-C0027","paper":"khoury-2022-leukemia-36-1703","category":"prognosis","tier":"restated secondary","genes":["PTPN11"],"diseases":["JMML"],"text":"JMML initiated by somatic PTPN11 mutation is described as among the most aggressive genetic types."},{"id":"khoury-2022-leukemia-36-1703-C0028","paper":"khoury-2022-leukemia-36-1703","category":"prognosis","tier":"restated secondary","genes":["NF1"],"diseases":["JMML"],"text":"JMML associated with germline pathogenic NF1 variants is described as among the most aggressive genetic types."},{"id":"khoury-2022-leukemia-36-1703-C0029","paper":"khoury-2022-leukemia-36-1703","category":"prognosis","tier":"restated secondary","genes":["CBL"],"diseases":["JMML"],"text":"Some JMML cases associated with pathogenic germline CBL variants can undergo spontaneous remission."},{"id":"khoury-2022-leukemia-36-1703-C0030","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["KIT"],"diseases":["mastocytosis"],"text":"According to WHO 5th Edition 2022, revised minor diagnostic criteria for systemic mastocytosis include any KIT mutation causing ligand-independent activation, CD30 expression, and basal serum tryptase >20 ng/mL; the tryptase value should be adjusted in hereditary alpha-tryptasaemia."},{"id":"khoury-2022-leukemia-36-1703-C0033","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["KIT"],"diseases":["mastocytosis"],"text":"According to WHO 5th Edition 2022, KIT p.D816V with VAF ≥10% in bone-marrow cells or peripheral-blood leukocytes qualifies as a B-finding in systemic mastocytosis."},{"id":"khoury-2022-leukemia-36-1703-C0034","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["mastocytosis"],"text":"According to WHO 5th Edition 2022, bone marrow mastocytosis is a systemic mastocytosis subtype characterized by absence of skin lesions and B-findings and basal serum tryptase <125 ng/mL."},{"id":"khoury-2022-leukemia-36-1703-C0035","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["MDS"],"text":"According to WHO 5th Edition 2022, the term “myelodysplastic neoplasms,” abbreviated MDS, replaces “myelodysplastic syndromes.” MDS is defined as a clonal haematopoietic neoplasm with cytopenia(s) and morphologic dysplasia, with a recommended dysplasia threshold of ≥10% in a lineage."},{"id":"khoury-2022-leukemia-36-1703-C0036","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["SF3B1","TP53"],"diseases":["MDS"],"text":"According to WHO 5th Edition 2022, MDS with low blasts and isolated 5q deletion requires <5% bone-marrow blasts and <2% peripheral-blood blasts, with 5q deletion alone or with one additional abnormality other than monosomy 7 or 7q deletion. An SF3B1 mutation or a TP53 mutation that is not multi-hit does not by itself override the MDS-5q diagnosis."},{"id":"khoury-2022-leukemia-36-1703-C0037","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["SF3B1"],"diseases":["MDS"],"text":"According to WHO 5th Edition 2022, MDS with low blasts and SF3B1 mutation is a genetically defined MDS type in which 5q deletion, monosomy 7 and complex karyotype are exclusionary. Detection of ≥15% ring sideroblasts may substitute for an SF3B1 mutation; for SF3B1-wild-type cases with ≥15% ring sideroblasts, “MDS with low blasts and ring sideroblasts” is an acceptable alternative term."},{"id":"khoury-2022-leukemia-36-1703-C0039","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["TP53"],"diseases":["MDS"],"text":"According to WHO 5th Edition 2022, MDS with biallelic TP53 inactivation requires <20% blasts in blood and marrow plus either ≥2 TP53 mutations or one TP53 mutation with TP53 copy-number loss or copy-neutral loss of heterozygosity. Two or more TP53 mutations can generally be considered multi-hit status. MDS-biTP53 supersedes MDS-5q and MDS-SF3B1 in the WHO5 genetic hierarchy."},{"id":"khoury-2022-leukemia-36-1703-C0044","paper":"khoury-2022-leukemia-36-1703","category":"biomarker","tier":"guideline criterion","genes":["TP53"],"diseases":["MDS"],"text":"According to WHO 5th Edition 2022, clinical assessment of biallelic TP53 alteration in MDS uses sequencing covering at least TP53 exons 4–11, generally coupled with assessment of TP53 copy-number status; copy loss may also be inferred by next-generation sequencing."},{"id":"khoury-2022-leukemia-36-1703-C0045","paper":"khoury-2022-leukemia-36-1703","category":"biomarker","tier":"guideline criterion","genes":["TP53"],"diseases":["MDS"],"text":"In MDS, WHO 5th Edition 2022 notes that TP53 VAF ≥50% may be regarded as presumptive, but not definitive, evidence of trans-allelic copy loss or copy-neutral loss of heterozygosity when a constitutional TP53 variant has been excluded."},{"id":"khoury-2022-leukemia-36-1703-C0047","paper":"khoury-2022-leukemia-36-1703","category":"prognosis","tier":"restated secondary","genes":["TP53"],"diseases":["MDS"],"text":"MDS with biallelic TP53 inactivation is regarded as very high risk in IPSS-R."},{"id":"khoury-2022-leukemia-36-1703-C0049","paper":"khoury-2022-leukemia-36-1703","category":"treatment","tier":"restated secondary","genes":["TP53"],"diseases":["MDS"],"text":"Published data summarized by the WHO5 paper suggest that MDS with biallelic TP53 inactivation may be regarded as AML-equivalent for therapeutic considerations."},{"id":"khoury-2022-leukemia-36-1703-C0050","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["MDS"],"text":"According to WHO 5th Edition 2022, hypoplastic MDS is a distinct MDS type defined by bone-marrow cellularity ≤25%, adjusted for age."},{"id":"khoury-2022-leukemia-36-1703-C0051","paper":"khoury-2022-leukemia-36-1703","category":"treatment","tier":"restated secondary","genes":["GATA2","DDX41"],"diseases":["MDS","AML"],"text":"Patients with germline pathogenic GATA2 or DDX41 variants who have hypoplastic marrow and evolve to MDS or AML are described as not responding to immunosuppressive treatment."},{"id":"khoury-2022-leukemia-36-1703-C0053","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["MDS"],"text":"According to WHO 5th Edition 2022, distinction between single-lineage and multilineage dysplasia is optional rather than disease-type defining in MDS."},{"id":"khoury-2022-leukemia-36-1703-C0054","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["BCR","ABL1","CEBPA"],"diseases":["MDS","AML"],"text":"According to WHO 5th Edition 2022, a 20% blast cutoff is retained to delineate MDS from AML, but most AML types with defining genetic abnormalities may be diagnosed below 20% blasts. AML with BCR::ABL1 and AML with CEBPA mutation remain exceptions requiring ≥20% blasts. When a genetically defined AML is diagnosed below 20%, morphologic and molecular findings must be correlated to establish that the defining abnormality is driving the disease."},{"id":"khoury-2022-leukemia-36-1703-C0055","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["MDS"],"text":"According to WHO 5th Edition 2022, childhood MDS with low blasts replaces the former term refractory cytopenia of childhood and is defined by <5% bone-marrow blasts and <2% peripheral-blood blasts. It comprises hypocellular and NOS subtypes, and diagnosis requires exclusion of non-neoplastic causes of cytopenia, bone-marrow failure syndromes and germline pathogenic variants."},{"id":"khoury-2022-leukemia-36-1703-C0057","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["MDS"],"text":"According to WHO 5th Edition 2022, childhood MDS with increased blasts is defined by 5–19% bone-marrow blasts or 2–19% peripheral-blood blasts."},{"id":"khoury-2022-leukemia-36-1703-C0059","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["JAK2","CALR","MPL"],"diseases":["CMML"],"text":"According to WHO 5th Edition 2022, CMML requires all four prerequisite criteria: persistent absolute peripheral-blood monocytosis ≥0.5 × 10^9/L and relative monocytosis ≥10%; <20% blasts/blast equivalents in blood and marrow; absence of diagnostic criteria for CML or another MPN; and absence of a myeloid/lymphoid neoplasm with a tyrosine-kinase fusion. Supporting criteria are dysplasia in ≥1 myeloid lineage, with ≥10% of cells affected; an acquired clonal cytogenetic or molecular abnormality; and abnormal monocyte partitioning with >94% classical monocytes in the absence of active autoimmune/systemic inflammatory disease. With monocytosis ≥1 × 10^9/L, at least one supporting criterion is required; with monocytosis ≥0.5 but <1 × 10^9/L, both dysplasia and clonality are required. A prior MPN excludes CMML; MPN-type marrow features and/or a high burden of JAK2, CALR or MPL mutations support MPN with monocytosis rather than CMML."},{"id":"khoury-2022-leukemia-36-1703-C0068","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["CMML"],"text":"According to WHO 5th Edition 2022, CMML is subtyped as myelodysplastic CMML when WBC <13 × 10^9/L and myeloproliferative CMML when WBC ≥13 × 10^9/L. Blast-based subgrouping comprises CMML-1 with <5% blasts/promonocytes in blood and <10% in marrow and CMML-2 with 5–19% in blood and 10–19% in marrow; CMML-0 is no longer recognized."},{"id":"khoury-2022-leukemia-36-1703-C0072","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["aCML"],"text":"According to WHO 5th Edition 2022, atypical chronic myeloid leukaemia is renamed MDS/MPN with neutrophilia."},{"id":"khoury-2022-leukemia-36-1703-C0073","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["SF3B1"],"diseases":["MDS/MPN-SF3B1-T"],"text":"According to WHO 5th Edition 2022, MDS/MPN with ring sideroblasts and thrombocytosis is redefined on the basis of SF3B1 mutation and renamed MDS/MPN with SF3B1 mutation and thrombocytosis. For SF3B1-wild-type cases with ≥15% ring sideroblasts, MDS/MPN with ring sideroblasts and thrombocytosis remains acceptable terminology."},{"id":"khoury-2022-leukemia-36-1703-C0075","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["AML"],"text":"According to WHO 5th Edition 2022, AML is organized into two families: AML with defining genetic abnormalities and AML defined by differentiation. The term AML, NOS is no longer applied to the differentiation-defined family."},{"id":"khoury-2022-leukemia-36-1703-C0078","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["PML","RARA","RUNX1","RUNX1T1","CBFB","MYH11","DEK","NUP214","RBM15","MRTFA"],"diseases":["AML"],"text":"According to WHO 5th Edition 2022, AML with PML::RARA, RUNX1::RUNX1T1, CBFB::MYH11, DEK::NUP214 or RBM15::MRTFA is classified as AML with a defining genetic abnormality."},{"id":"khoury-2022-leukemia-36-1703-C0083","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["BCR","ABL1"],"diseases":["AML"],"text":"According to WHO 5th Edition 2022, AML with BCR::ABL1 requires ≥20% blasts, principally to avoid overlap with CML."},{"id":"khoury-2022-leukemia-36-1703-C0084","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["CEBPA"],"diseases":["AML"],"text":"According to WHO 5th Edition 2022, AML with CEBPA mutation includes either biallelic CEBPA mutations or a single CEBPA mutation in the basic leucine zipper region and requires ≥20% blasts."},{"id":"khoury-2022-leukemia-36-1703-C0085","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["KMT2A","MECOM","NUP98"],"diseases":["AML"],"text":"According to WHO 5th Edition 2022, AML with KMT2A, MECOM or NUP98 rearrangement may be diagnosed with <20% blasts."},{"id":"khoury-2022-leukemia-36-1703-C0088","paper":"khoury-2022-leukemia-36-1703","category":"biomarker","tier":"restated secondary","genes":["KMT2A","MECOM","NUP98"],"diseases":["AML"],"text":"In AML, KMT2A, MECOM and NUP98 rearrangements, particularly NUP98 rearrangements, may be cryptic on conventional karyotyping."},{"id":"khoury-2022-leukemia-36-1703-C0089","paper":"khoury-2022-leukemia-36-1703","category":"biomarker","tier":"guideline criterion","genes":["KMT2A"],"diseases":["AML"],"text":"According to WHO 5th Edition 2022, identification of the KMT2A fusion partner in AML with KMT2A rearrangement is desirable, although not required, because it may affect disease monitoring."},{"id":"khoury-2022-leukemia-36-1703-C0090","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["NPM1"],"diseases":["AML"],"text":"According to WHO 5th Edition 2022, AML with NPM1 mutation may be diagnosed irrespective of blast count, with judicious clinicopathologic correlation."},{"id":"khoury-2022-leukemia-36-1703-C0091","paper":"khoury-2022-leukemia-36-1703","category":"prognosis","tier":"restated secondary","genes":["NPM1"],"diseases":["MDS","MDS/MPN","AML"],"text":"MDS or MDS/MPN harbouring NPM1 mutation is described as progressing to AML over a short period of time."},{"id":"khoury-2022-leukemia-36-1703-C0092","paper":"khoury-2022-leukemia-36-1703","category":"prognosis","tier":"restated secondary","genes":["NPM1"],"diseases":["CHIP","AML"],"text":"Acquisition of NPM1 mutation in CHIP is similarly associated with rapid progression to AML."},{"id":"khoury-2022-leukemia-36-1703-C0094","paper":"khoury-2022-leukemia-36-1703","category":"prognosis","tier":"restated secondary","genes":["CEBPA"],"diseases":["AML"],"text":"In AML, a single CEBPA mutation in the basic leucine zipper region is associated with favourable prognosis in children and adults up to age 70."},{"id":"khoury-2022-leukemia-36-1703-C0095","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["RUNX1"],"diseases":["AML"],"text":"According to WHO 5th Edition 2022, somatic RUNX1 mutation does not define a standalone AML type because it lacks sufficient specificity across defining molecular contexts."},{"id":"khoury-2022-leukemia-36-1703-C0096","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["ASXL1","BCOR","EZH2","SF3B1","SRSF2","STAG2","U2AF1","ZRSR2"],"diseases":["AML","MDS","MDS/MPN","acute erythroid leukaemia"],"text":"According to WHO 5th Edition 2022, AML, myelodysplasia-related (AML-MR; formerly AML with myelodysplasia-related changes) requires ≥20% blasts with a myeloid immunophenotype plus at least one qualifying MDS-related feature: a history of MDS or MDS/MPN; a defining somatic mutation in ASXL1, BCOR, EZH2, SF3B1, SRSF2, STAG2, U2AF1 or ZRSR2; or a defining cytogenetic abnormality comprising complex karyotype (≥3 abnormalities), 5q deletion/loss, monosomy 7 or 7q deletion/loss, 11q deletion, 12p deletion/loss, monosomy 13 or 13q deletion, 17p deletion/loss, isochromosome 17q or idic(X)(q13). Morphologic dysplasia alone is insufficient. A diagnosis of acute erythroid leukaemia supersedes AML-MR."},{"id":"khoury-2022-leukemia-36-1703-C0114","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["AML with minimal differentiation"],"text":"According to WHO 5th Edition 2022, AML with minimal differentiation requires blasts negative (<3%) for MPO and SBB by cytochemistry and expression of at least two myeloid-associated antigens such as CD13, CD33 and CD117. It also requires ≥20% blasts, absence of a defining genetic AML type, absence of mixed-phenotype acute leukaemia, absence of myeloid neoplasm post cytotoxic therapy and no prior MPN."},{"id":"khoury-2022-leukemia-36-1703-C0115","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["AML without maturation"],"text":"According to WHO 5th Edition 2022, AML without maturation requires ≥3% blasts positive for MPO or SBB, NSE negativity, <10% maturing granulocytic cells and expression of at least two myeloid-associated antigens. It also requires ≥20% blasts, absence of a defining genetic AML type, absence of mixed-phenotype acute leukaemia, absence of myeloid neoplasm post cytotoxic therapy and no prior MPN."},{"id":"khoury-2022-leukemia-36-1703-C0116","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["AML with maturation"],"text":"According to WHO 5th Edition 2022, AML with maturation requires ≥3% blasts positive for MPO or SBB, ≥10% maturing granulocytic cells, <20% monocyte-lineage cells and expression of at least two myeloid-associated antigens. It also requires ≥20% blasts, absence of a defining genetic AML type, absence of mixed-phenotype acute leukaemia, absence of myeloid neoplasm post cytotoxic therapy and no prior MPN."},{"id":"khoury-2022-leukemia-36-1703-C0117","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["acute basophilic leukaemia"],"text":"According to WHO 5th Edition 2022, acute basophilic leukaemia requires basophilic blasts/immature or mature basophils with metachromasia on toluidine blue, blasts negative for MPO, SBB and NSE, and absence of strong CD117-equivalent expression. It also requires ≥20% blasts, absence of a defining genetic AML type, absence of mixed-phenotype acute leukaemia, absence of myeloid neoplasm post cytotoxic therapy and no prior MPN."},{"id":"khoury-2022-leukemia-36-1703-C0118","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["AMML"],"text":"According to WHO 5th Edition 2022, acute myelomonocytic leukaemia requires ≥20% monocytes and precursors, ≥20% maturing granulocytic cells and ≥3% blasts positive for MPO. It also requires ≥20% blasts, absence of a defining genetic AML type, absence of mixed-phenotype acute leukaemia, absence of myeloid neoplasm post cytotoxic therapy and no prior MPN."},{"id":"khoury-2022-leukemia-36-1703-C0119","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["AMoL"],"text":"According to WHO 5th Edition 2022, acute monocytic leukaemia requires ≥80% monocytes and/or their precursors, <20% maturing granulocytic cells, and blasts/promonocytes expressing at least two monocytic markers among CD11c, CD14, CD36 and CD64 or showing NSE positivity. It also requires ≥20% blasts, absence of a defining genetic AML type, absence of mixed-phenotype acute leukaemia, absence of myeloid neoplasm post cytotoxic therapy and no prior MPN."},{"id":"khoury-2022-leukemia-36-1703-C0120","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["acute erythroid leukaemia"],"text":"According to WHO 5th Edition 2022, acute erythroid leukaemia is characterized by erythroid predominance, usually ≥80% of marrow cellularity, with ≥30% proerythroblasts; cases with <80% erythroid cellularity are recognized when they share the same clinicopathologic features. “Pure erythroid leukaemia” is retained as an acceptable related term. The other shared differentiation-defined AML exclusions apply, but the ≥20% blast requirement does not."},{"id":"khoury-2022-leukemia-36-1703-C0122","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["AMKL"],"text":"According to WHO 5th Edition 2022, acute megakaryoblastic leukaemia requires blasts expressing at least one platelet glycoprotein marker—CD41, CD61 or CD42b. It also requires ≥20% blasts, absence of a defining genetic AML type, absence of mixed-phenotype acute leukaemia, absence of myeloid neoplasm post cytotoxic therapy and no prior MPN."},{"id":"khoury-2022-leukemia-36-1703-C0123","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["CBFA2T3","GLIS2"],"diseases":["AML","AMKL"],"text":"According to WHO 5th Edition 2022, AML with other defined genetic alterations provides a classification category for uncommon or emerging genetically defined AML subtypes, including rare genetic fusions; CBFA2T3::GLIS2 is recognized in this category in the acute megakaryoblastic leukaemia context."},{"id":"khoury-2022-leukemia-36-1703-C0125","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["NPM1","RUNX1","RUNX1T1","CBFB","MYH11","PARP1"],"diseases":["AML","MDS","MDS/MPN","CCUS"],"text":"According to WHO 5th Edition 2022, a myeloid neoplasm post cytotoxic therapy (MN-pCT) is diagnosed when criteria for AML, MDS or MDS/MPN are fulfilled in a patient with a documented history of chemotherapy or large-field radiation therapy for an unrelated neoplasm. CCUS is excluded. NPM1-mutated disease and core-binding-factor leukaemias with RUNX1::RUNX1T1 or CBFB::MYH11 still receive the post-cytotoxic designation when the exposure history is present. PARP1 inhibitors qualify as an exposure and methotrexate does not. The specific myeloid diagnosis should be given when possible with “post cytotoxic therapy” appended."},{"id":"khoury-2022-leukemia-36-1703-C0131","paper":"khoury-2022-leukemia-36-1703","category":"prognosis","tier":"restated secondary","genes":["TP53"],"diseases":["AML","MDS"],"text":"In AML or MDS post cytotoxic therapy, biallelic/multi-hit TP53 alterations—including ≥2 TP53 mutations or a TP53 mutation with 17p/TP53 deletion or copy-neutral loss of heterozygosity—are associated with worse outcomes."},{"id":"khoury-2022-leukemia-36-1703-C0132","paper":"khoury-2022-leukemia-36-1703","category":"germline","tier":"restated secondary","genes":["PPM1D"],"diseases":[],"text":"PPM1D and other DNA-damage-response mutations detected in myeloid neoplasms post cytotoxic therapy may warrant additional work-up for germline predisposition."},{"id":"khoury-2022-leukemia-36-1703-C0133","paper":"khoury-2022-leukemia-36-1703","category":"germline","tier":"restated secondary","genes":["NF1","CBL"],"diseases":["JMML"],"text":"JMML can arise in association with germline pathogenic NF1 variants in neurofibromatosis type 1 or pathogenic germline CBL variants."},{"id":"khoury-2022-leukemia-36-1703-C0135","paper":"khoury-2022-leukemia-36-1703","category":"germline","tier":"guideline criterion","genes":["CEBPA","DDX41","TP53","RUNX1","ANKRD26","ETV6","GATA2","SAMD9","SAMD9L","BLM"],"diseases":["germline predisposition syndrome"],"text":"According to WHO 5th Edition 2022, a germline predisposition syndrome involving myeloid neoplasms is classified by coupling the myeloid disease phenotype with the predisposing germline genotype. The framework includes: without a pre-existing platelet disorder or organ dysfunction—germline CEBPA, DDX41 or TP53 pathogenic/likely pathogenic variants; with a pre-existing platelet disorder—germline RUNX1, ANKRD26 or ETV6 pathogenic/likely pathogenic variants; and with potential organ dysfunction—including germline GATA2, SAMD9 or SAMD9L pathogenic/likely pathogenic variants and biallelic germline BLM pathogenic/likely pathogenic variants. SAMD9L-related ataxia-pancytopenia syndrome may occur without ataxia."},{"id":"khoury-2022-leukemia-36-1703-C0145","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["GATA1"],"diseases":["germline predisposition syndrome"],"text":"According to WHO 5th Edition 2022, in the germline predisposition syndrome context, myeloid proliferations associated with constitutional trisomy 21 comprise transient abnormal myelopoiesis, confined to the first 6 months of life, and myeloid leukaemia of Down syndrome; these proliferations are typically associated with somatic GATA1 exon 2 or 3 mutation."},{"id":"khoury-2022-leukemia-36-1703-C0146","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["BCR","ABL1","PDGFRA","PDGFRB","FGFR1","JAK2","FLT3","ETV6","FGFR2","LYN","NTRK3","RANBP2","ALK","RET","FGFR1OP"],"diseases":["myeloid/lymphoid neoplasm with eosinophilia and TK fusion"],"text":"According to WHO 5th Edition 2022, myeloid/lymphoid neoplasms with eosinophilia and tyrosine kinase gene fusions (MLN-TK) are BCR::ABL1-negative neoplasms driven by defining tyrosine-kinase rearrangements; eosinophilia is common but is not required. Defining abnormalities include rearrangements of PDGFRA, PDGFRB, FGFR1, JAK2 or FLT3; ETV6::ABL1; and other defined fusions including ETV6::FGFR2, ETV6::LYN, ETV6::NTRK3, RANBP2::ALK, BCR::RET and FGFR1OP::RET. MLN-TK supersedes other myeloid or lymphoid diagnoses and systemic mastocytosis in the diagnostic hierarchy, must be excluded before diagnosing CEL, and MLN-TK with ETV6::ABL1 should be distinguished from B-ALL with ETV6::ABL1."},{"id":"khoury-2022-leukemia-36-1703-C0149","paper":"khoury-2022-leukemia-36-1703","category":"biomarker","tier":"restated secondary","genes":["FIP1L1","PDGFRA"],"diseases":["myeloid/lymphoid neoplasm with eosinophilia and TK fusion"],"text":"In myeloid/lymphoid neoplasm with eosinophilia and tyrosine kinase fusion (MLN-TK), FIP1L1::PDGFRA commonly results from a cytogenetically cryptic deletion of 4q12."},{"id":"khoury-2022-leukemia-36-1703-C0163","paper":"khoury-2022-leukemia-36-1703","category":"treatment","tier":"restated secondary","genes":["PDGFRA","PDGFRB"],"diseases":["myeloid/lymphoid neoplasm with eosinophilia and TK fusion"],"text":"In myeloid/lymphoid neoplasm with eosinophilia and tyrosine kinase fusion (MLN-TK), PDGFRA- or PDGFRB-rearranged disease is highly sensitive to tyrosine-kinase inhibitor therapy, particularly imatinib, with major alteration of the natural history of the disease."},{"id":"khoury-2022-leukemia-36-1703-C0165","paper":"khoury-2022-leukemia-36-1703","category":"treatment","tier":"restated secondary","genes":["FGFR1","JAK2","FLT3","ETV6","ABL1"],"diseases":["myeloid/lymphoid neoplasm with eosinophilia and TK fusion"],"text":"Myeloid/lymphoid neoplasm with eosinophilia and tyrosine kinase fusion (MLN-TK) involving FGFR1, JAK2, FLT3 or ETV6::ABL1 has variable sensitivity to currently available newer-generation tyrosine-kinase inhibitors."},{"id":"khoury-2022-leukemia-36-1703-C0169","paper":"khoury-2022-leukemia-36-1703","category":"treatment","tier":"restated secondary","genes":["FGFR1","JAK2","FLT3","ETV6","ABL1"],"diseases":["myeloid/lymphoid neoplasm with eosinophilia and TK fusion"],"text":"For myeloid/lymphoid neoplasm with eosinophilia and tyrosine kinase fusion (MLN-TK) with FGFR1, JAK2 or FLT3 fusions or ETV6::ABL1, long-term disease-free survival may in most cases only be achievable with allogeneic haematopoietic stem-cell transplantation."},{"id":"khoury-2022-leukemia-36-1703-C0170","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["BCR","ABL1","KMT2A","ZNF384","BCL11B"],"diseases":["acute leukaemia of ambiguous lineage"],"text":"According to WHO 5th Edition 2022, acute leukaemia of ambiguous lineage is separated into those with defining genetic abnormalities and those defined immunophenotypically. Defining genetic subtypes include MPAL with BCR::ABL1, KMT2A rearrangement or ZNF384 rearrangement, and ALAL with BCL11B rearrangement."},{"id":"khoury-2022-leukemia-36-1703-C0175","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["acute leukaemia of ambiguous lineage"],"text":"According to WHO 5th Edition 2022, lineage assignment in acute leukaemia of ambiguous lineage uses: for B lineage, strong CD19 plus ≥1 strongly expressed CD10, CD22 or CD79a, or weak CD19 plus ≥2 of these markers; for T lineage, cytoplasmic or surface CD3 of sufficient intensity or positive immunocytochemistry with a non-zeta-chain reagent; and for myeloid lineage, sufficiently intense MPO expression or monocytic differentiation demonstrated by at least two of nonspecific esterase, CD11c, CD14, CD64 or lysozyme."},{"id":"khoury-2022-leukemia-36-1703-C0178","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["acute leukaemia of ambiguous lineage"],"text":"For acute leukaemia of ambiguous lineage assessed by flow cytometry, a 3% MPO-positive blast threshold has high sensitivity but poor specificity, >10% appears to improve specificity, and no consensus cutoff has been established."},{"id":"khoury-2022-leukemia-36-1703-C0179","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["BPDCN"],"text":"According to WHO 5th Edition 2022, BPDCN immunophenotypic diagnosis requires either CD123 plus one other plasmacytoid dendritic-cell marker together with CD4 and/or CD56, or any three plasmacytoid dendritic-cell markers with absence of all expected negative markers including CD3, CD14, CD19, CD34, lysozyme and MPO."},{"id":"khoury-2022-leukemia-36-1703-C0180","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["ALK"],"diseases":["histiocytic/dendritic neoplasm"],"text":"According to WHO 5th Edition 2022, ALK-positive histiocytosis is a defined histiocytic/dendritic neoplasm unified by the presence of an ALK gene translocation."},{"id":"khoury-2022-leukemia-36-1703-C0181","paper":"khoury-2022-leukemia-36-1703","category":"treatment","tier":"restated secondary","genes":["ALK"],"diseases":["histiocytic/dendritic neoplasm"],"text":"Within the histiocytic/dendritic neoplasm category, ALK-positive histiocytosis is described as showing a remarkable response to ALK-inhibitor therapy."},{"id":"khoury-2022-leukemia-36-1703-C0182","paper":"khoury-2022-leukemia-36-1703","category":"biomarker","tier":"guideline criterion","genes":["ALK"],"diseases":["histiocytic/dendritic neoplasm"],"text":"WHO 5th Edition 2022 recommends ALK immunostaining when a histiocytic/dendritic neoplasm does not conform to defined entities, to screen for possible ALK-positive histiocytosis."},{"id":"khoury-2022-leukemia-36-1703-C0183","paper":"khoury-2022-leukemia-36-1703","category":"treatment","tier":"restated secondary","genes":["BRAF","ARAF","MAP2K1","NRAS","KRAS"],"diseases":["histiocytic/dendritic neoplasm"],"text":"In the histiocytic/dendritic neoplasm category, alterations in BRAF, ARAF, MAP2K1, NRAS and KRAS have treatment implications because activated MAPK-pathway components can be targeted with therapies including BRAF and MEK inhibitors."},{"id":"khoury-2022-leukemia-36-1703-C0184","paper":"khoury-2022-leukemia-36-1703","category":"biomarker","tier":"guideline criterion","genes":["NF1","NRAS","KRAS","PTPN11","CBL"],"diseases":["JMML"],"text":"Genomic analysis of NF1, NRAS, KRAS, PTPN11 and CBL in myeloid neoplasms from patients suspected of a RASopathy is important and can aid JMML diagnosis in the majority of cases."},{"id":"khoury-2022-leukemia-36-1703-C0185","paper":"khoury-2022-leukemia-36-1703","category":"germline","tier":"guideline criterion","genes":["NF1","NRAS","KRAS","PTPN11","CBL"],"diseases":["germline predisposition syndrome"],"text":"According to WHO 5th Edition 2022, a RASopathy is a germline predisposition syndrome in which the myeloid disease phenotype is coupled to the predisposing germline genotype. In this germline RASopathy context, WHO5 specifically identifies NF1, NRAS, KRAS, PTPN11 and CBL; diagnostic criteria include a pathogenic germline variant in a RAS-pathway gene and/or a classic phenotype suggestive of a RASopathy."},{"id":"khoury-2022-leukemia-36-1703-C0187","paper":"khoury-2022-leukemia-36-1703","category":"biomarker","tier":"restated secondary","genes":["CBFA2T3","GLIS2"],"diseases":["AMKL"],"text":"In acute megakaryoblastic leukaemia, the RAM immunophenotype correlates with CBFA2T3::GLIS2."},{"id":"khoury-2022-leukemia-36-1703-C0194","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["JMML"],"text":"According to WHO 5th Edition 2022, juvenile myelomonocytic leukaemia is categorized under myeloproliferative neoplasms."},{"id":"khoury-2022-leukemia-36-1703-C0196","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["MDS"],"text":"According to WHO 5th Edition 2022, MDS with low blasts is defined by <5% bone-marrow blasts and <2% peripheral-blood blasts."},{"id":"khoury-2022-leukemia-36-1703-C0198","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["MDS"],"text":"According to WHO 5th Edition 2022, MDS with increased blasts is subgrouped as MDS-IB1, defined by 5–9% bone-marrow blasts or 2–4% peripheral-blood blasts, and MDS-IB2, defined by 10–19% bone-marrow blasts, 5–19% peripheral-blood blasts, or Auer rods."},{"id":"khoury-2022-leukemia-36-1703-C0200","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["MDS"],"text":"According to WHO 5th Edition 2022, MDS with fibrosis has 5–19% bone-marrow blasts and 2–19% peripheral-blood blasts."},{"id":"khoury-2022-leukemia-36-1703-C0201","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["MDS"],"text":"According to WHO 5th Edition 2022, MDS, unclassifiable is no longer a recognized MDS category."},{"id":"khoury-2022-leukemia-36-1703-C0202","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["MDS/MPN-U"],"text":"According to WHO 5th Edition 2022, MDS/MPN, unclassifiable is renamed MDS/MPN, not otherwise specified."},{"id":"khoury-2022-leukemia-36-1703-C0207","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["histiocytic/dendritic neoplasm"],"text":"According to WHO 5th Edition 2022, within the histiocytic/dendritic neoplasm category, mature plasmacytoid dendritic-cell proliferation associated with myeloid neoplasm is a clonal low-grade pDC proliferation arising in the context of a defined myeloid neoplasm."},{"id":"khoury-2022-leukemia-36-1703-C0210","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["germline predisposition syndrome"],"text":"According to WHO 5th Edition 2022, for a germline predisposition syndrome, “associated with germline [gene] variant” is a disease attribute that should be appended to the relevant myeloid disease type whose diagnostic criteria are otherwise fulfilled."},{"id":"khoury-2022-leukemia-36-1703-C0212","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["KMT2A","MLLT3"],"diseases":["AML"],"text":"According to WHO 5th Edition 2022, “AML with KMT2A rearrangement” replaces the former term “AML with t(9;11)(p22;q23); KMT2A-MLLT3.”"},{"id":"tefferi-2018-journal-of-clinical-oncology-36-1769-C0001","paper":"tefferi-2018-journal-of-clinical-oncology-36-1769","category":"prognosis","tier":"restated secondary","genes":["ASXL1","SRSF2","EZH2","IDH1","IDH2"],"diseases":["PMF"],"text":"According to the original MIPSS70 and MIPSS70+ frameworks, ASXL1, SRSF2, EZH2, IDH1, and IDH2 mutations are high molecular risk mutations in primary myelofibrosis in transplant-age patients (≤70 years)."},{"id":"tefferi-2018-journal-of-clinical-oncology-36-1769-C0002","paper":"tefferi-2018-journal-of-clinical-oncology-36-1769","category":"prognosis","tier":"restated secondary","genes":["CALR"],"diseases":["PMF"],"text":"According to the original MIPSS70 and MIPSS70+ frameworks, CALR type 1/like mutation is a favorable prognostic mutation in primary myelofibrosis in transplant-age patients (≤70 years)."},{"id":"tefferi-2018-journal-of-clinical-oncology-36-1769-C0003","paper":"tefferi-2018-journal-of-clinical-oncology-36-1769","category":"prognosis","tier":"restated secondary","genes":["U2AF1"],"diseases":["PMF"],"text":"According to MIPSS70+ Version 2.0, U2AF1 Q157 is an additional high molecular risk mutation in primary myelofibrosis."},{"id":"tefferi-2018-journal-of-clinical-oncology-36-1769-C0004","paper":"tefferi-2018-journal-of-clinical-oncology-36-1769","category":"prognosis","tier":"multivariable-adjusted","genes":["ASXL1","SRSF2","EZH2","IDH1","IDH2","U2AF1"],"diseases":["PMF"],"text":"According to MIPSS70+ Version 2.0, in patients aged ≤70 years with primary myelofibrosis, the presence of one high molecular risk mutation among ASXL1, SRSF2, EZH2, IDH1, IDH2, or U2AF1 Q157 is associated with inferior overall survival."},{"id":"tefferi-2018-journal-of-clinical-oncology-36-1769-C0005","paper":"tefferi-2018-journal-of-clinical-oncology-36-1769","category":"prognosis","tier":"multivariable-adjusted","genes":["ASXL1","SRSF2","EZH2","IDH1","IDH2","U2AF1"],"diseases":["PMF"],"text":"According to MIPSS70+ Version 2.0, in patients aged ≤70 years with primary myelofibrosis, the presence of two or more high molecular risk mutations among ASXL1, SRSF2, EZH2, IDH1, IDH2, or U2AF1 Q157 is associated with inferior overall survival."},{"id":"tefferi-2018-journal-of-clinical-oncology-36-1769-C0006","paper":"tefferi-2018-journal-of-clinical-oncology-36-1769","category":"prognosis","tier":"multivariable-adjusted","genes":["CALR"],"diseases":["PMF"],"text":"Acc
