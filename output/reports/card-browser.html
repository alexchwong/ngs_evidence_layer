efined by 10–19% bone-marrow blasts, 5–19% peripheral-blood blasts, or Auer rods."},{"id":"khoury-2022-leukemia-36-1703-C0200","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["MDS"],"text":"According to WHO 5th Edition 2022, MDS with fibrosis has 5–19% bone-marrow blasts and 2–19% peripheral-blood blasts."},{"id":"khoury-2022-leukemia-36-1703-C0201","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["MDS"],"text":"According to WHO 5th Edition 2022, MDS, unclassifiable is no longer a recognized MDS category."},{"id":"khoury-2022-leukemia-36-1703-C0202","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["MDS/MPN-U"],"text":"According to WHO 5th Edition 2022, MDS/MPN, unclassifiable is renamed MDS/MPN, not otherwise specified."},{"id":"khoury-2022-leukemia-36-1703-C0207","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["histiocytic/dendritic neoplasm"],"text":"According to WHO 5th Edition 2022, within the histiocytic/dendritic neoplasm category, mature plasmacytoid dendritic-cell proliferation associated with myeloid neoplasm is a clonal low-grade pDC proliferation arising in the context of a defined myeloid neoplasm."},{"id":"khoury-2022-leukemia-36-1703-C0210","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["germline predisposition syndrome"],"text":"According to WHO 5th Edition 2022, for a germline predisposition syndrome, “associated with germline [gene] variant” is a disease attribute that should be appended to the relevant myeloid disease type whose diagnostic criteria are otherwise fulfilled."},{"id":"khoury-2022-leukemia-36-1703-C0212","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["KMT2A","MLLT3"],"diseases":["AML"],"text":"According to WHO 5th Edition 2022, “AML with KMT2A rearrangement” replaces the former term “AML with t(9;11)(p22;q23); KMT2A-MLLT3.”"},{"id":"koster-2024-vexas-pdf-C0001","paper":"koster-2024-vexas-pdf","category":"diagnosis","tier":"restated secondary","genes":["UBA1"],"diseases":["somatic mutation-associated syndrome"],"text":"Somatic UBA1 p.Met41Thr is a pathogenic variant identified in VEXAS syndrome, a somatic mutation-associated syndrome."},{"id":"koster-2024-vexas-pdf-C0002","paper":"koster-2024-vexas-pdf","category":"diagnosis","tier":"restated secondary","genes":["UBA1"],"diseases":["somatic mutation-associated syndrome"],"text":"Somatic UBA1 p.Met41Val is a pathogenic variant identified in VEXAS syndrome, a somatic mutation-associated syndrome."},{"id":"koster-2024-vexas-pdf-C0003","paper":"koster-2024-vexas-pdf","category":"diagnosis","tier":"restated secondary","genes":["UBA1"],"diseases":["somatic mutation-associated syndrome"],"text":"Somatic UBA1 p.Met41Leu is a pathogenic variant identified in VEXAS syndrome, a somatic mutation-associated syndrome."},{"id":"koster-2024-vexas-pdf-C0004","paper":"koster-2024-vexas-pdf","category":"diagnosis","tier":"restated secondary","genes":["UBA1"],"diseases":["somatic mutation-associated syndrome"],"text":"UBA1 c.118-1G>C is a splice-acceptor variant reported in VEXAS syndrome, a somatic mutation-associated syndrome."},{"id":"koster-2024-vexas-pdf-C0005","paper":"koster-2024-vexas-pdf","category":"diagnosis","tier":"restated secondary","genes":["UBA1"],"diseases":["somatic mutation-associated syndrome"],"text":"UBA1 c.118-2A>C is a splice-acceptor variant reported in VEXAS syndrome, a somatic mutation-associated syndrome."},{"id":"koster-2024-vexas-pdf-C0006","paper":"koster-2024-vexas-pdf","category":"diagnosis","tier":"restated secondary","genes":["UBA1"],"diseases":["somatic mutation-associated syndrome"],"text":"UBA1 p.Ser56Phe is a VEXAS-associated variant in VEXAS syndrome, a somatic mutation-associated syndrome."},{"id":"koster-2024-vexas-pdf-C0007","paper":"koster-2024-vexas-pdf","category":"germline","tier":"restated secondary","genes":["UBA1"],"diseases":[],"text":"UBA1 alterations causing VEXAS syndrome are acquired somatic rather than germline."},{"id":"koster-2024-vexas-pdf-C0019","paper":"koster-2024-vexas-pdf","category":"diagnosis","tier":"restated secondary","genes":["UBA1"],"diseases":["somatic mutation-associated syndrome"],"text":"In a highly suspicious clinical presentation, the constellation of typical abnormal laboratory, peripheral-blood, and bone-marrow cytologic features should support further UBA1 molecular assessment for VEXAS syndrome, a somatic mutation-associated syndrome."},{"id":"koster-2024-vexas-pdf-C0020","paper":"koster-2024-vexas-pdf","category":"germline","tier":"restated secondary","genes":["UBA1"],"diseases":[],"text":"Most reported female patients with UBA1-mutated VEXAS syndrome have had monosomy X or Turner syndrome, but female VEXAS without X-chromosome monosomy has also been reported; monosomy X is not obligatory."},{"id":"koster-2024-vexas-pdf-C0022","paper":"koster-2024-vexas-pdf","category":"diagnosis","tier":"restated secondary","genes":["UBA1"],"diseases":["MDS","somatic mutation-associated syndrome"],"text":"In myelodysplastic syndrome with systemic inflammatory features, UBA1 testing can identify previously unrecognized VEXAS syndrome, a somatic mutation-associated syndrome, and warrants greater consideration."},{"id":"koster-2024-vexas-pdf-C0023","paper":"koster-2024-vexas-pdf","category":"diagnosis","tier":"restated secondary","genes":["UBA1"],"diseases":["somatic mutation-associated syndrome"],"text":"For refractory vasculitis, the combination of recurrent inflammatory manifestations or venous thromboembolism, CRP >20 mg/L with a cytopenia, and failure of at least one DMARD with ongoing glucocorticoid dependence defines a high-yield phenotype for UBA1 testing for VEXAS syndrome, a somatic mutation-associated syndrome."},{"id":"koster-2024-vexas-pdf-C0025","paper":"koster-2024-vexas-pdf","category":"diagnosis","tier":"restated secondary","genes":["UBA1"],"diseases":["somatic mutation-associated syndrome"],"text":"Molecular demonstration of a disease-causing UBA1 variant is the key confirmatory step for diagnosing VEXAS syndrome, a somatic mutation-associated syndrome."},{"id":"koster-2024-vexas-pdf-C0026","paper":"koster-2024-vexas-pdf","category":"biomarker","tier":"restated secondary","genes":["UBA1"],"diseases":["somatic mutation-associated syndrome"],"text":"Because UBA1 Met41 and exon-3 splice-acceptor variants account for nearly all reported VEXAS syndrome cases, a somatic mutation-associated syndrome, these regions should be prioritized in initial molecular screening."},{"id":"koster-2024-vexas-pdf-C0027","paper":"koster-2024-vexas-pdf","category":"biomarker","tier":"restated secondary","genes":["UBA1"],"diseases":["somatic mutation-associated syndrome"],"text":"When testing for mosaic UBA1 variants in VEXAS syndrome, a somatic mutation-associated syndrome, assay sensitivity is material: the review reports detection limits of about 20% VAF for Sanger sequencing, <0.5% for allele-specific ddPCR, and >2%–5% for NGS."},{"id":"koster-2024-vexas-pdf-C0028","paper":"koster-2024-vexas-pdf","category":"biomarker","tier":"restated secondary","genes":["UBA1"],"diseases":["somatic mutation-associated syndrome"],"text":"If initial Sanger sequencing is negative but clinical suspicion for VEXAS syndrome, a somatic mutation-associated syndrome, remains high, more sensitive UBA1 testing with ddPCR or NGS should be considered because lower-VAF cases can be missed by Sanger sequencing."},{"id":"koster-2024-vexas-pdf-C0029","paper":"koster-2024-vexas-pdf","category":"biomarker","tier":"restated secondary","genes":["UBA1"],"diseases":["somatic mutation-associated syndrome"],"text":"If region-specific hotspot ddPCR is negative despite high suspicion for VEXAS syndrome, a somatic mutation-associated syndrome, expanded full-gene UBA1 evaluation can be pursued because clinically relevant non-Met41 variants are increasingly recognized."},{"id":"koster-2024-vexas-pdf-C0032","paper":"koster-2024-vexas-pdf","category":"biomarker","tier":"restated secondary","genes":["DNMT3A","TET2"],"diseases":["somatic mutation-associated syndrome"],"text":"After VEXAS syndrome, a somatic mutation-associated syndrome, is confirmed, the authors recommend NGS assessment for additional somatic myeloid-neoplasm mutations, including DNMT3A and TET2."},{"id":"koster-2024-vexas-pdf-C0033","paper":"koster-2024-vexas-pdf","category":"prognosis","tier":"restated secondary","genes":["UBA1"],"diseases":["somatic mutation-associated syndrome"],"text":"Within VEXAS syndrome, a somatic mutation-associated syndrome, UBA1 p.Met41Val is associated with poorer survival than UBA1 p.Met41Leu or p.Met41Thr."},{"id":"koster-2024-vexas-pdf-C0034","paper":"koster-2024-vexas-pdf","category":"prognosis","tier":"restated secondary","genes":["DNMT3A","TET2"],"diseases":["somatic mutation-associated syndrome"],"text":"In VEXAS syndrome, a somatic mutation-associated syndrome, co-occurring DNMT3A or TET2 mutations are associated with increased mortality."},{"id":"koster-2024-vexas-pdf-C0035","paper":"koster-2024-vexas-pdf","category":"prognosis","tier":"restated secondary","genes":["UBA1"],"diseases":["somatic mutation-associated syndrome"],"text":"UBA1-mutated VEXAS syndrome, a somatic mutation-associated syndrome, is associated with increased mortality, although the true excess mortality versus the general population remains uncertain."},{"id":"koster-2024-vexas-pdf-C0036","paper":"koster-2024-vexas-pdf","category":"prognosis","tier":"restated secondary","genes":["UBA1"],"diseases":["somatic mutation-associated syndrome"],"text":"In UBA1-mutated VEXAS syndrome, a somatic mutation-associated syndrome, thrombocytopenia below 100 K is associated with increased mortality."},{"id":"koster-2024-vexas-pdf-C0037","paper":"koster-2024-vexas-pdf","category":"prognosis","tier":"restated secondary","genes":["UBA1"],"diseases":["somatic mutation-associated syndrome"],"text":"In UBA1-mutated VEXAS syndrome, a somatic mutation-associated syndrome, transfusion-dependent anemia is associated with increased mortality."},{"id":"koster-2024-vexas-pdf-C0038","paper":"koster-2024-vexas-pdf","category":"prognosis","tier":"restated secondary","genes":["UBA1"],"diseases":["somatic mutation-associated syndrome"],"text":"In UBA1-mutated VEXAS syndrome, a somatic mutation-associated syndrome, a concomitant diagnosis of myelodysplastic syndrome is associated with increased mortality."},{"id":"koster-2024-vexas-pdf-C0040","paper":"koster-2024-vexas-pdf","category":"prognosis","tier":"restated secondary","genes":["UBA1"],"diseases":["somatic mutation-associated syndrome"],"text":"UBA1-mutated VEXAS syndrome, a somatic mutation-associated syndrome, is associated with recurrent clotting after an initial thrombotic event."},{"id":"koster-2024-vexas-pdf-C0041","paper":"koster-2024-vexas-pdf","category":"treatment","tier":"restated secondary","genes":[],"diseases":["somatic mutation-associated syndrome"],"text":"For inflammatory-predominant VEXAS syndrome, a somatic mutation-associated syndrome, glucocorticoids are generally needed for disease control; prednisone usually needs to be at least 15–20 mg/day, with higher doses sometimes required for severe disease."},{"id":"koster-2024-vexas-pdf-C0042","paper":"koster-2024-vexas-pdf","category":"diagnosis","tier":"restated secondary","genes":["UBA1"],"diseases":["somatic mutation-associated syndrome"],"text":"Improvement when prednisone is increased above about 20 mg/day with recurrence below 10–20 mg/day should prompt UBA1 testing for VEXAS syndrome, a somatic mutation-associated syndrome, particularly in a man with macrocytosis or other characteristic cytologic findings, if not already confirmed."},{"id":"koster-2024-vexas-pdf-C0043","paper":"koster-2024-vexas-pdf","category":"treatment","tier":"restated secondary","genes":[],"diseases":["MDS"],"text":"For higher-risk myelodysplastic syndrome in patients ineligible for allogeneic stem-cell transplantation, DNA methyltransferase inhibitors such as azacitidine or decitabine are described as standard-of-care treatment."},{"id":"koster-2024-vexas-pdf-C0044","paper":"koster-2024-vexas-pdf","category":"treatment","tier":"restated secondary","genes":["UBA1"],"diseases":["somatic mutation-associated syndrome"],"text":"In UBA1-mutated VEXAS syndrome, a somatic mutation-associated syndrome, ruxolitinib can provide clinical benefit but does not suppress the UBA1-mutant clone; rising UBA1 VAF despite response is cited as evidence that ruxolitinib is not disease modifying."},{"id":"koster-2024-vexas-pdf-C0046","paper":"koster-2024-vexas-pdf","category":"treatment","tier":"restated secondary","genes":["UBA1"],"diseases":["somatic mutation-associated syndrome"],"text":"For UBA1-mutated VEXAS syndrome, a somatic mutation-associated syndrome, allogeneic hematopoietic stem-cell transplantation is the only treatment in the reviewed evidence reported to produce durable clinical and hematologic response with eradication of mutated UBA1 from marrow."},{"id":"koster-2024-vexas-pdf-C0047","paper":"koster-2024-vexas-pdf","category":"treatment","tier":"restated secondary","genes":["UBA1"],"diseases":["somatic mutation-associated syndrome"],"text":"In UBA1-mutated VEXAS syndrome, a somatic mutation-associated syndrome, allogeneic hematopoietic stem-cell transplantation is a feasible option for refractory cytopenias or recalcitrant inflammatory disease, although optimal patient candidacy and timing remain undefined."},{"id":"koster-2024-vexas-pdf-C0049","paper":"koster-2024-vexas-pdf","category":"treatment","tier":"restated secondary","genes":["UBA1","DNMT3A","TET2"],"diseases":["somatic mutation-associated syndrome"],"text":"In confirmed UBA1-mutated VEXAS syndrome, a somatic mutation-associated syndrome, the somatic mutation landscape, including co-occurring DNMT3A or TET2 mutations, can help inform decisions about allogeneic stem-cell transplantation."},{"id":"koster-2024-vexas-pdf-C0050","paper":"koster-2024-vexas-pdf","category":"diagnosis","tier":"restated secondary","genes":["UBA1"],"diseases":["somatic mutation-associated syndrome"],"text":"Compared with classical Sweet's syndrome, inflammatory skin lesions in UBA1-mutated VEXAS syndrome, a somatic mutation-associated syndrome, tend to relapse frequently (>4–6 times/year)."},{"id":"koster-2024-vexas-pdf-C0051","paper":"koster-2024-vexas-pdf","category":"diagnosis","tier":"restated secondary","genes":["UBA1"],"diseases":["somatic mutation-associated syndrome"],"text":"Compared with classical Sweet's syndrome, anemia, thrombocytopenia, and macrocytosis are more common in UBA1-mutated VEXAS syndrome, a somatic mutation-associated syndrome, and can support the differential diagnosis."},{"id":"koster-2024-vexas-pdf-C0052","paper":"koster-2024-vexas-pdf","category":"diagnosis","tier":"restated secondary","genes":["UBA1"],"diseases":["somatic mutation-associated syndrome"],"text":"Among patients with chondritis, UBA1-mutated VEXAS syndrome, a somatic mutation-associated syndrome, tends to have less inner-ear or vestibular involvement, tracheobronchomalacia, and costochondritis than classical relapsing polychondritis."},{"id":"koster-2024-vexas-pdf-C0053","paper":"koster-2024-vexas-pdf","category":"diagnosis","tier":"restated secondary","genes":["UBA1"],"diseases":["somatic mutation-associated syndrome"],"text":"Auricular inflammation involving the ear lobule is reported in UBA1-mutated VEXAS syndrome, a somatic mutation-associated syndrome, and is considered atypical for classical relapsing polychondritis."},{"id":"koster-2024-vexas-pdf-C0054","paper":"koster-2024-vexas-pdf","category":"diagnosis","tier":"restated secondary","genes":["UBA1"],"diseases":["somatic mutation-associated syndrome"],"text":"Pulmonary ground-glass opacities, consolidations, and pleural effusions in UBA1-mutated VEXAS syndrome, a somatic mutation-associated syndrome, tend to respond quickly to moderate-to-high-dose glucocorticoids; lack of response should prompt evaluation for another cause such as infection."},{"id":"koster-2024-vexas-pdf-C0055","paper":"koster-2024-vexas-pdf","category":"diagnosis","tier":"restated secondary","genes":["UBA1"],"diseases":["somatic mutation-associated syndrome"],"text":"UBA1-mutated VEXAS syndrome, a somatic mutation-associated syndrome, is classified in this review as a variable-vessel vasculitis because large-, medium-, and small-vessel vasculitis have all been reported."},{"id":"koster-2024-vexas-pdf-C0057","paper":"koster-2024-vexas-pdf","category":"diagnosis","tier":"restated secondary","genes":["UBA1"],"diseases":["somatic mutation-associated syndrome"],"text":"When UBA1-mutated VEXAS syndrome, a somatic mutation-associated syndrome, presents as ANCA-associated vasculitis, atypical histopathology, non-standard antibody profiles, or failure to respond as expected to standard vasculitis therapy are clues against classical primary ANCA-associated vasculitis."},{"id":"koster-2024-vexas-pdf-C0058","paper":"koster-2024-vexas-pdf","category":"diagnosis","tier":"restated secondary","genes":["UBA1"],"diseases":["somatic mutation-associated syndrome"],"text":"Cutaneous lesions in UBA1-mutated VEXAS syndrome, a somatic mutation-associated syndrome, can show marked leukocytoclasia without true fibrinoid vessel-wall necrosis, so leukocytoclastic vasculitis may be overcalled."},{"id":"koster-2024-vexas-pdf-C0059","paper":"koster-2024-vexas-pdf","category":"diagnosis","tier":"restated secondary","genes":["UBA1"],"diseases":["somatic mutation-associated syndrome"],"text":"Orbital or periorbital edema in UBA1-mutated VEXAS syndrome, a somatic mutation-associated syndrome, is often unilateral and can be mistaken for preseptal cellulitis."},{"id":"koster-2024-vexas-pdf-C0060","paper":"koster-2024-vexas-pdf","category":"diagnosis","tier":"restated secondary","genes":["UBA1"],"diseases":["somatic mutation-associated syndrome"],"text":"Inflammatory arthritis in UBA1-mutated VEXAS syndrome, a somatic mutation-associated syndrome, can resemble rheumatoid arthritis in distribution but tends to be non-erosive."},{"id":"kraft-godley-2020-germline-guide-C0001","paper":"kraft-godley-2020-germline-guide","category":"germline","tier":"univariable or descriptive","genes":["DDX41"],"diseases":[],"text":"In myeloid malignancies, DDX41 p.Arg525His is described as a hotspot acquired mutation occurring in individuals with deleterious germline DDX41 variants."},{"id":"kraft-godley-2020-germline-guide-C0002","paper":"kraft-godley-2020-germline-guide","category":"germline","tier":"restated secondary","genes":["DDX41"],"diseases":[],"text":"Germline DDX41-associated myeloid malignancy can present at advanced age; an age around 70 years does not exclude germline predisposition."},{"id":"kraft-godley-2020-germline-guide-C0003","paper":"kraft-godley-2020-germline-guide","category":"germline","tier":"restated secondary","genes":["GATA2","BRCA1","BRCA2"],"diseases":[],"text":"Germline predisposition involving GATA2, BRCA1, or BRCA2 may arise de novo and therefore be present in the affected individual but absent from the parents."},{"id":"kraft-godley-2020-germline-guide-C0005","paper":"kraft-godley-2020-germline-guide","category":"germline","tier":"restated secondary","genes":["DDX41"],"diseases":[],"text":"A truncating DDX41 variant should raise suspicion of germline origin."},{"id":"kraft-godley-2020-germline-guide-C0006","paper":"kraft-godley-2020-germline-guide","category":"germline","tier":"restated secondary","genes":["RUNX1","TP53"],"diseases":[],"text":"A RUNX1 or TP53 variant detected in hematopoietic tissue should not be assumed to be germline or somatic based on the variant itself, because variants in either gene can occur in both settings."},{"id":"kraft-godley-2020-germline-guide-C0007","paper":"kraft-godley-2020-germline-guide","category":"germline","tier":"univariable or descriptive","genes":["TP53"],"diseases":[],"text":"A TP53 variant detected in hematopoietic tissue is more commonly somatic than germline; however, germline TP53 origin remains possible and may require dedicated germline evaluation."},{"id":"kraft-godley-2020-germline-guide-C0008","paper":"kraft-godley-2020-germline-guide","category":"germline","tier":"univariable or descriptive","genes":["BRCA1","BRCA2"],"diseases":[],"text":"A deleterious BRCA1 or BRCA2 variant detected during sequencing of a hematologic malignancy may warrant consideration of germline origin; the authors report that such variants were more commonly germline in their experience."},{"id":"kraft-godley-2020-germline-guide-C0009","paper":"kraft-godley-2020-germline-guide","category":"germline","tier":"univariable or descriptive","genes":["TP53"],"diseases":[],"text":"Persistence of a TP53 variant at a relatively stable VAF across serial hematopoietic samples can raise suspicion of germline origin, including in patients who do not otherwise meet clinical criteria for Li-Fraumeni syndrome; germline status requires confirmation with appropriate germline testing."},{"id":"kraft-godley-2020-germline-guide-C0031","paper":"kraft-godley-2020-germline-guide","category":"germline","tier":"restated secondary","genes":["BRCA1","BRCA2"],"diseases":[],"text":"BRCA1 and BRCA2 cancer-predisposition pathway mutations are associated with increased risk of hematopoietic malignancies."},{"id":"kraft-godley-2020-germline-guide-C0032","paper":"kraft-godley-2020-germline-guide","category":"germline","tier":"restated secondary","genes":["TP53"],"diseases":[],"text":"TP53-associated Li-Fraumeni syndrome is associated with increased risk of hematopoietic malignancies."},{"id":"kraft-godley-2020-germline-guide-C0033","paper":"kraft-godley-2020-germline-guide","category":"germline","tier":"restated secondary","genes":["MLH1","MSH2","MSH6","PMS2"],"diseases":[],"text":"Lynch syndrome associated with MLH1, MSH2, MSH6, or PMS2 is associated with increased risk of hematopoietic malignancies."},{"id":"liu-2025-germline-myeloid-C0002","paper":"liu-2025-germline-myeloid","category":"germline","tier":"restated secondary","genes":["RUNX1"],"diseases":[],"text":"A heterozygous germline RUNX1 pathogenic/likely pathogenic variant causes familial platelet disorder with predisposition to myeloid malignancy with autosomal dominant inheritance and variable penetrance."},{"id":"liu-2025-germline-myeloid-C0003","paper":"liu-2025-germline-myeloid","category":"germline","tier":"restated secondary","genes":["RUNX1"],"diseases":[],"text":"Germline RUNX1 pathogenic/likely pathogenic variants most often present with thrombocytopenia, although some carriers have impaired platelet function without significant thrombocytopenia."},{"id":"liu-2025-germline-myeloid-C0004","paper":"liu-2025-germline-myeloid","category":"prognosis","tier":"restated secondary","genes":["RUNX1"],"diseases":["MDS","AML","CMML"],"text":"Germline RUNX1 pathogenic/likely pathogenic variants confer an increased lifetime risk of myeloid malignancy, particularly MDS, AML, and CMML."},{"id":"liu-2025-germline-myeloid-C0005","paper":"liu-2025-germline-myeloid","category":"germline","tier":"restated secondary","genes":["ANKRD26"],"diseases":[],"text":"Heterozygous germline ANKRD26 pathogenic/likely pathogenic variants cause autosomal dominant familial thrombocytopenia with variable penetrance."},{"id":"liu-2025-germline-myeloid-C0006","paper":"liu-2025-germline-myeloid","category":"germline","tier":"restated secondary","genes":["ANKRD26"],"diseases":[],"text":"ANKRD26-related germline predisposition typically causes thrombocytopenia with normal platelet size; bleeding may be mild or absent and platelet aggregation is usually normal."},{"id":"liu-2025-germline-myeloid-C0007","paper":"liu-2025-germline-myeloid","category":"prognosis","tier":"restated secondary","genes":["ANKRD26"],"diseases":["MDS","AML","CML"],"text":"ANKRD26-related thrombocytopenia carries an increased lifetime risk of hematologic malignancy, including MDS, AML, and CML."},{"id":"liu-2025-germline-myeloid-C0009","paper":"liu-2025-germline-myeloid","category":"germline","tier":"restated secondary","genes":["ETV6"],"diseases":[],"text":"Heterozygous germline ETV6 pathogenic/likely pathogenic variants cause autosomal dominant familial thrombocytopenia with predisposition to hematologic malignancy and high penetrance."},{"id":"liu-2025-germline-myeloid-C0010","paper":"liu-2025-germline-myeloid","category":"germline","tier":"restated secondary","genes":["ETV6"],"diseases":[],"text":"ETV6-associated germline thrombocytopenia typically features normal platelet size, decreased alpha granules, and abnormal platelet aggregation."},{"id":"liu-2025-germline-myeloid-C0011","paper":"liu-2025-germline-myeloid","category":"prognosis","tier":"restated secondary","genes":["ETV6"],"diseases":["CMML","MDS","AML"],"text":"Germline ETV6 pathogenic/likely pathogenic variants confer an increased lifetime risk of hematologic malignancy, including CMML, MDS, AML, and a prominent risk of lymphoid leukemia."},{"id":"liu-2025-germline-myeloid-C0012","paper":"liu-2025-germline-myeloid","category":"germline","tier":"restated secondary","genes":["CEBPA"],"diseases":[],"text":"Heterozygous germline CEBPA pathogenic/likely pathogenic variants confer autosomal dominant predisposition to AML with variable penetrance."},{"id":"liu-2025-germline-myeloid-C0013","paper":"liu-2025-germline-myeloid","category":"diagnosis","tier":"restated secondary","genes":["CEBPA"],"diseases":["AML"],"text":"CEBPA-associated familial AML is defined by a germline pathogenic/likely pathogenic CEBPA variant in a person with AML and/or in a family with more than one member affected by AML."},{"id":"liu-2025-germline-myeloid-C0014","paper":"liu-2025-germline-myeloid","category":"prognosis","tier":"restated secondary","genes":["CEBPA"],"diseases":["AML"],"text":"In germline CEBPA families, N-terminal variants have higher AML penetrance than C-terminal variants."},{"id":"liu-2025-germline-myeloid-C0015","paper":"liu-2025-germline-myeloid","category":"germline","tier":"restated secondary","genes":["CEBPA"],"diseases":["AML"],"text":"Germline CEBPA-associated AML can occur across a wide age range but tends to present earlier than sporadic CEBPA-altered AML."},{"id":"liu-2025-germline-myeloid-C0016","paper":"liu-2025-germline-myeloid","category":"prognosis","tier":"restated secondary","genes":["CEBPA"],"diseases":["AML"],"text":"CEBPA-associated familial AML has a high long-term risk of a subsequent AML episode."},{"id":"liu-2025-germline-myeloid-C0017","paper":"liu-2025-germline-myeloid","category":"diagnosis","tier":"restated secondary","genes":["CEBPA"],"diseases":["AML"],"text":"A later AML in CEBPA-associated familial AML is often an independent clone with a different somatic CEBPA alteration and therefore should not automatically be interpreted as relapse of the original AML."},{"id":"liu-2025-germline-myeloid-C0018","paper":"liu-2025-germline-myeloid","category":"prognosis","tier":"restated secondary","genes":["CEBPA"],"diseases":["AML"],"text":"CEBPA-associated familial AML has a better prognosis than sporadic CEBPA-associated AML."},{"id":"liu-2025-germline-myeloid-C0019","paper":"liu-2025-germline-myeloid","category":"germline","tier":"restated secondary","genes":["DDX41"],"diseases":[],"text":"Heterozygous germline DDX41 pathogenic/likely pathogenic variants confer autosomal dominant predisposition to hematologic malignancy, most commonly MDS and AML."},{"id":"liu-2025-germline-myeloid-C0020","paper":"liu-2025-germline-myeloid","category":"germline","tier":"restated secondary","genes":["DDX41"],"diseases":[],"text":"DDX41-associated germline predisposition is typically late onset and often occurs without a significant family history."},{"id":"liu-2025-germline-myeloid-C0021","paper":"liu-2025-germline-myeloid","category":"germline","tier":"restated secondary","genes":["DDX41"],"diseases":[],"text":"Carriers of germline DDX41 pathogenic/likely pathogenic variants may have mild cytopenia or macrocytosis before an overt hematopoietic neoplasm develops."},{"id":"liu-2025-germline-myeloid-C0022","paper":"liu-2025-germline-myeloid","category":"prognosis","tier":"restated secondary","genes":["DDX41"],"diseases":["germline predisposition syndrome"],"text":"Among carriers with DDX41-associated germline predisposition syndrome, myeloid neoplasms occur more often in males than females despite similar carrier frequencies."},{"id":"liu-2025-germline-myeloid-C0023","paper":"liu-2025-germline-myeloid","category":"prognosis","tier":"restated secondary","genes":["DDX41"],"diseases":["germline predisposition syndrome"],"text":"In DDX41-associated germline predisposition syndrome, germline DDX41 pathogenic/likely pathogenic variants confer a substantial lifetime risk of hematologic malignancy that rises markedly after age 40."},{"id":"liu-2025-germline-myeloid-C0024","paper":"liu-2025-germline-myeloid","category":"treatment","tier":"restated secondary","genes":["DDX41"],"diseases":["germline predisposition syndrome"],"text":"In DDX41-associated germline predisposition syndrome, severe acute graft-versus-host disease has been reported after allogeneic stem-cell transplantation in patients with deleterious germline DDX41 variants."},{"id":"liu-2025-germline-myeloid-C0025","paper":"liu-2025-germline-myeloid","category":"germline","tier":"restated secondary","genes":["DDX41"],"diseases":[],"text":"A truncating DDX41 variant detected on somatic testing should prompt germline testing because most truncating DDX41 variants are germline."},{"id":"liu-2025-germline-myeloid-C0026","paper":"liu-2025-germline-myeloid","category":"germline","tier":"restated secondary","genes":["DDX41"],"diseases":[],"text":"DDX41 c.3G>A (p.M1?) detected on somatic testing should prompt germline testing because this start-loss variant has been reported exclusively as germline."},{"id":"liu-2025-germline-myeloid-C0028","paper":"liu-2025-germline-myeloid","category":"germline","tier":"restated secondary","genes":["PTPN11","NRAS","KRAS"],"diseases":[],"text":"Germline pathogenic/likely pathogenic variants in PTPN11, NRAS, or KRAS can underlie autosomal dominant Noonan syndrome and predispose to JMML or a JMML-like myeloid proliferation."},{"id":"liu-2025-germline-myeloid-C0029","paper":"liu-2025-germline-myeloid","category":"germline","tier":"restated secondary","genes":["CBL"],"diseases":[],"text":"Germline pathogenic/likely pathogenic CBL variants cause autosomal dominant CBL syndrome and are commonly associated with JMML-like or other myeloproliferative disease."},{"id":"liu-2025-germline-myeloid-C0030","paper":"liu-2025-germline-myeloid","category":"germline","tier":"restated secondary","genes":["NF1"],"diseases":[],"text":"Germline pathogenic/likely pathogenic NF1 variants cause autosomal dominant neurofibromatosis type 1 and predispose to JMML or other myeloproliferative disease."},{"id":"liu-2025-germline-myeloid-C0031","paper":"liu-2025-germline-myeloid","category":"germline","tier":"restated secondary","genes":["PTPN11"],"diseases":[],"text":"In Noonan syndrome, germline PTPN11 pathogenic/likely pathogenic variants can cause a potentially mild JMML-like proliferation, in contrast to the more aggressive myeloid neoplasms associated with somatic PTPN11 variants, which commonly involve different amino acids in PTPN11."},{"id":"liu-2025-germline-myeloid-C0032","paper":"liu-2025-germline-myeloid","category":"prognosis","tier":"restated secondary","genes":["CBL","NF1"],"diseases":["germline predisposition syndrome"],"text":"In a CBL- or NF1-associated germline predisposition syndrome, a JMML-like proliferation can spontaneously regress, with spontaneous regression reported most often in germline CBL disease."},{"id":"liu-2025-germline-myeloid-C0033","paper":"liu-2025-germline-myeloid","category":"prognosis","tier":"restated secondary","genes":["CBL","NF1"],"diseases":["germline predisposition syndrome"],"text":"In a CBL- or NF1-associated germline predisposition syndrome, progression to advanced myeloid disease has been associated with myeloid uniparental disomy that duplicates the mutant allele."},{"id":"liu-2025-germline-myeloid-C0034","paper":"liu-2025-germline-myeloid","category":"germline","tier":"restated secondary","genes":["BLM"],"diseases":[],"text":"Biallelic germline loss-of-function BLM pathogenic/likely pathogenic variants cause autosomal recessive Bloom syndrome and predispose to hematologic malignancy including AML."},{"id":"liu-2025-germline-myeloid-C0035","paper":"liu-2025-germline-myeloid","category":"diagnosis","tier":"restated secondary","genes":["BLM"],"diseases":["germline predisposition syndrome"],"text":"In BLM-associated Bloom syndrome, a germline predisposition syndrome, a high rate of sister chromatid exchanges is pathognomonic."},{"id":"liu-2025-germline-myeloid-C0036","paper":"liu-2025-germline-myeloid","category":"germline","tier":"restated secondary","genes":["GATA2"],"diseases":[],"text":"Heterozygous germline GATA2 pathogenic/likely pathogenic variants cause autosomal dominant GATA2 deficiency; monoMAC, DCML, familial MDS/AML, and Emberger syndrome represent a spectrum of this disorder."},{"id":"liu-2025-germline-myeloid-C0037","paper":"liu-2025-germline-myeloid","category":"germline","tier":"restated secondary","genes":["GATA2"],"diseases":[],"text":"Germline GATA2 pathogenic/likely pathogenic variants frequently cause immunodeficiency with susceptibility to opportunistic infection and can also present with neutropenia or aplastic anemia/bone marrow failure."},{"id":"liu-2025-germline-myeloid-C0038","paper":"liu-2025-germline-myeloid","category":"germline","tier":"restated secondary","genes":["GATA2"],"diseases":[],"text":"Germline GATA2 pathogenic/likely pathogenic variants predispose to myeloid malignancy, most commonly MDS, AML, and CMML, with variable penetrance."},{"id":"liu-2025-germline-myeloid-C0039","paper":"liu-2025-germline-myeloid","category":"prognosis","tier":"restated secondary","genes":["GATA2"],"diseases":["germline predisposition syndrome"],"text":"In GATA2-associated germline predisposition syndrome, the risk of myeloid malignancy in carriers of germline GATA2 pathogenic/likely pathogenic variants rises substantially with age."},{"id":"liu-2025-germline-myeloid-C0040","paper":"liu-2025-germline-myeloid","category":"biomarker","tier":"restated secondary","genes":["GATA2"],"diseases":["germline predisposition syndrome"],"text":"In GATA2-associated germline predisposition syndrome, marrow flow cytometry showing markedly decreased monocytes, B cells, natural killer cells, and dendritic cells can support suspicion of a germline GATA2 alteration."},{"id":"liu-2025-germline-myeloid-C0041","paper":"liu-2025-germline-myeloid","category":"germline","tier":"restated secondary","genes":["SAMD9","SAMD9L"],"diseases":[],"text":"Germline pathogenic/likely pathogenic SAMD9 and SAMD9L variants are associated with autosomal dominant MIRAGE and ataxia-pancytopenia syndromes, respectively, and can present with bone marrow failure, MDS, or AML, usually at a young age."},{"id":"liu-2025-germline-myeloid-C0042","paper":"liu-2025-germline-myeloid","category":"prognosis","tier":"restated secondary","genes":["SAMD9","SAMD9L","SETBP1","NRAS","PTPN11","RUNX1"],"diseases":["MDS","AML"],"text":"In SAMD9- or SAMD9L-associated syndromes, progression to advanced MDS or AML has been associated with additional somatic alterations in SETBP1, NRAS, PTPN11, or RUNX1."},{"id":"liu-2025-germline-myeloid-C0043","paper":"liu-2025-germline-myeloid","category":"prognosis","tier":"restated secondary","genes":["SAMD9","SAMD9L"],"diseases":["germline predisposition syndrome"],"text":"In a SAMD9- or SAMD9L-associated germline predisposition syndrome, a monosomy 7 clone can spontaneously disappear."},{"id":"liu-2025-germline-myeloid-C0044","paper":"liu-2025-germline-myeloid","category":"germline","tier":"restated secondary","genes":["NAF1","RPA1","TERC","TINF2","ZCCHC8"],"diseases":[],"text":"Monoallelic pathogenic/likely pathogenic variants in NAF1, RPA1, TERC, TINF2, or ZCCHC8 can cause autosomal dominant telomere biology disorders that predispose to MDS and AML."},{"id":"liu-2025-germline-myeloid-C0045","paper":"liu-2025-germline-myeloid","category":"diagnosis","tier":"restated secondary","genes":["ACD","CTC1","DKC1","NAF1","NHP2","NOP10","PARN","POT1","RPA1","RTEL1","STN1","TERC","TERT","TINF2","WRAP53","ZCCHC8"],"diseases":["germline predisposition syndrome"],"text":"In a patient with clinical features of a telomere biology disorder, a germline predisposition syndrome, finding a pathogenic/likely pathogenic variant in ACD, CTC1, DKC1, NAF1, NHP2, NOP10, PARN, POT1, RPA1, RTEL1, STN1, TERC, TERT, TINF2, WRAP53, or ZCCHC8 can establish the diagnosis."},{"id":"liu-2025-germline-myeloid-C0046","paper":"liu-2025-germline-myeloid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["germline predisposition syndrome"],"text":"In a patient with suggestive clinical features of a telomere biology disorder, a germline predisposition syndrome, telomere-length assessment of peripheral-blood leukocytes or lymphocytes by flow-FISH can establish the diagnosis."},{"id":"liu-2025-germline-myeloid-C0047","paper":"liu-2025-germline-myeloid","category":"germline","tier":"restated secondary","genes":["TP53"],"diseases":[],"text":"Germline pathogenic/likely pathogenic TP53 variants that reduce TP53 function or act in a dominant-negative manner predispose to Li-Fraumeni syndrome."},{"id":"liu-2025-germline-myeloid-C0048","paper":"liu-2025-germline-myeloid","category":"germline","tier":"restated secondary","genes":["TP53"],"diseases":[],"text":"In Li-Fraumeni syndrome due to germline TP53 variants, myeloid neoplasms commonly present as therapy-related MDS or AML after cytotoxic therapy, although de novo AML can also occur."},{"id":"liu-2025-germline-myeloid-C0050","paper":"liu-2025-germline-myeloid","category":"germline","tier":"restated secondary","genes":["FANCA","FANCC","BRCA2","FANCD2","FANCE","FANCF","FANCG","FANCI","BRIP1","FANCL","FANCM","PALB2","RAD51C","SLX4","ERCC4","BRCA1","UBE2T","XRCC2","REV7","RFWD3","FAAP100"],"diseases":[],"text":"Fanconi anemia due to pathogenic/likely pathogenic variants in FANCA, FANCC, BRCA2, FANCD2, FANCE, FANCF, FANCG, FANCI, BRIP1, FANCL, FANCM, PALB2, RAD51C, SLX4, ERCC4, BRCA1, UBE2T, XRCC2, REV7, RFWD3, or FAAP100 follows autosomal recessive inheritance and predisposes to MDS and AML."},{"id":"liu-2025-germline-myeloid-C0051","paper":"liu-2025-germline-myeloid","category":"prognosis","tier":"restated secondary","genes":["FANCA","FANCB","FANCC","BRCA2","FANCD2","FANCE","FANCF","FANCG","FANCI","BRIP1","FANCL","FANCM","PALB2","RAD51C","SLX4","ERCC4","RAD51","BRCA1","UBE2T","XRCC2","REV7","RFWD3","FAAP100"],"diseases":["AML"],"text":"Fanconi anemia associated with FANCA, FANCB, FANCC, BRCA2, FANCD2, FANCE, FANCF, FANCG, FANCI, BRIP1, FANCL, FANCM, PALB2, RAD51C, SLX4, ERCC4, RAD51, BRCA1, UBE2T, XRCC2, REV7, RFWD3, or FAAP100 carries an age-associated risk of AML, with leukemia incidence peaking in adolescence or early adulthood."},{"id":"liu-2025-germline-myeloid-C0052","paper":"liu-2025-germline-myeloid","category":"diagnosis","tier":"restated secondary","genes":["FANCA","FANCB","FANCC","BRCA2","FANCD2","FANCE","FANCF","FANCG","FANCI","BRIP1","FANCL","FANCM","PALB2","RAD51C","SLX4","ERCC4","RAD51","BRCA1","UBE2T","XRCC2","REV7","RFWD3","FAAP100"],"diseases":["germline predisposition syndrome"],"text":"Fanconi anemia, a germline predisposition syndrome, can be established by germline genetic testing that identifies pathogenic/likely pathogenic variants in FANCA, FANCB, FANCC, BRCA2, FANCD2, FANCE, FANCF, FANCG, FANCI, BRIP1, FANCL, FANCM, PALB2, RAD51C, SLX4, ERCC4, RAD51, BRCA1, UBE2T, XRCC2, REV7, RFWD3, or FAAP100."},{"id":"liu-2025-germline-myeloid-C0053","paper":"liu-2025-germline-myeloid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["germline predisposition syndrome"],"text":"Fanconi anemia, a germline predisposition syndrome, can be diagnosed by chromosomal breakage testing showing hypersensitivity to diepoxybutane or mitomycin C with chromosomal breakage and radial chromosomes."},{"id":"liu-2025-germline-myeloid-C0054","paper":"liu-2025-germline-myeloid","category":"germline","tier":"restated secondary","genes":["SBDS"],"diseases":[],"text":"Autosomal recessive pathogenic/likely pathogenic SBDS variants cause most cases of Shwachman-Diamond syndrome, which predisposes to MDS and AML."},{"id":"liu-2025-germline-myeloid-C0055","paper":"liu-2025-germline-myeloid","category":"germline","tier":"restated secondary","genes":["RPL5","RPL9","RPL11","RPL15","RPL18","RPL26","RPL27","RPL31","RPL35","RPL35A","RPS7","RPS10","RPS15A","RPS17","RPS19","RPS24","RPS26","RPS27","RPS28","RPS29"],"diseases":[],"text":"Pathogenic/likely pathogenic variants in RPL5, RPL9, RPL11, RPL15, RPL18, RPL26, RPL27, RPL31, RPL35, RPL35A, RPS7, RPS10, RPS15A, RPS17, RPS19, RPS24, RPS26, RPS27, RPS28, or RPS29 contribute to autosomal dominant Diamond-Blackfan anemia, in which MDS and AML have been described."},{"id":"liu-2025-germline-myeloid-C0056","paper":"liu-2025-germline-myeloid","category":"germline","tier":"restated secondary","genes":["ELANE"],"diseases":[],"text":"Autosomal dominant pathogenic/likely pathogenic ELANE variants can cause severe congenital neutropenia, which predisposes to MDS and AML."},{"id":"liu-2025-germline-myeloid-C0057","paper":"liu-2025-germline-myeloid","category":"treatment","tier":"restated secondary","genes":["CSF3R"],"diseases":["MDS","AML"],"text":"In severe congenital neutropenia receiving long-term G-CSF, transformation to MDS or AML has been reported as a long-term complication, especially with acquired truncating CSF3R alterations."},{"id":"liu-2025-germline-myeloid-C0061","paper":"liu-2025-germline-myeloid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["MDS"],"text":"According to the International Consensus Classification, progression to MDS in germline predisposition can be supported by progressive cytopenias, increased marrow cellularity, multilineage dysplasia, cytogenetic abnormalities, new genetic alterations, or increased blasts."},{"id":"liu-2025-germline-myeloid-C0062","paper":"liu-2025-germline-myeloid","category":"diagnosis","tier":"restated secondary","genes":["TP53","SF3B1"],"diseases":["MDS"],"text":"In germline predisposition, monosomy 7, monosomy 5, del(7q), del(5q), multi-hit TP53 alterations, or an SF3B1 alteration favor a diagnosis of MDS, but these findings must be interpreted in the context of the specific germline condition."},{"id":"liu-2025-germline-myeloid-C0063","paper":"liu-2025-germline-myeloid","category":"germline","tier":"restated secondary","genes":["BLM"],"diseases":[],"text":"BLM NM_000057.4:c.2207_2212delinsTAGATTC (p.Tyr736LeufsTer5; blmAsh) is a well-established pathogenic founder variant in the Ashkenazi Jewish population."},{"id":"liu-2025-germline-myeloid-C0064","paper":"liu-2025-germline-myeloid","category":"germline","tier":"restated secondary","genes":["CTC1","NHP2","NOP10","STN1","WRAP53","POT1"],"diseases":[],"text":"Biallelic pathogenic/likely pathogenic variants in CTC1, NHP2, NOP10, STN1, WRAP53, or POT1 can cause autosomal recessive telomere biology disorders that predispose to MDS and AML."},{"id":"liu-2025-germline-myeloid-C0065","paper":"liu-2025-germline-myeloid","category":"germline","tier":"restated secondary","genes":["ACD","PARN","RTEL1","TERT"],"diseases":[],"text":"Pathogenic/likely pathogenic variants in ACD, PARN, RTEL1, or TERT can cause telomere biology disorders with either autosomal dominant or autosomal recessive inheritance; these disorders predispose to MDS and AML."},{"id":"liu-2025-germline-myeloid-C0066","paper":"liu-2025-germline-myeloid","category":"germline","tier":"restated secondary","genes":["DKC1"],"diseases":[],"text":"Pathogenic/likely pathogenic DKC1 variants cause X-linked telomere biology disorder with predisposition to MDS and AML."},{"id":"liu-2025-germline-myeloid-C0067","paper":"liu-2025-germline-myeloid","category":"germline","tier":"restated secondary","genes":["FANCB"],"diseases":[],"text":"Pathogenic/likely pathogenic FANCB variants cause X-linked recessive Fanconi anemia with predisposition to MDS and AML."},{"id":"liu-2025-germline-myeloid-C0068","paper":"liu-2025-germline-myeloid","category":"germline","tier":"restated secondary","genes":["RAD51"],"diseases":[],"text":"Pathogenic/likely pathogenic RAD51 (FANCR) variants cause autosomal dominant Fanconi anemia with predisposition to MDS and AML."},{"id":"liu-2025-germline-myeloid-C0069","paper":"liu-2025-germline-myeloid","category":"germline","tier":"restated secondary","genes":["DNAJC21","EFL1"],"diseases":[],"text":"Biallelic pathogenic/likely pathogenic variants in DNAJC21 or EFL1 are associated with Shwachman-Diamond-like inherited disease and predisposition to MDS and AML."},{"id":"liu-2025-germline-myeloid-C0070","paper":"liu-2025-germline-myeloid","category":"germline","tier":"restated secondary","genes":["SRP54"],"diseases":[],"text":"Monoallelic pathogenic/likely pathogenic SRP54 variants are associated with Shwachman-Diamond-like inherited disease and predisposition to MDS and AML."},{"id":"liu-2025-germline-myeloid-C0071","paper":"liu-2025-germline-myeloid","category":"germline","tier":"restated secondary","genes":["GATA1","TSR2"],"diseases":[],"text":"Germline GATA1 or TSR2 variants can cause X-linked Diamond-Blackfan anemia, in which MDS and AML have been described."},{"id":"liu-2025-germline-myeloid-C0072","paper":"liu-2025-germline-myeloid","category":"germline","tier":"restated secondary","genes":["HAX1"],"diseases":[],"text":"Autosomal recessive pathogenic/likely pathogenic HAX1 variants can cause severe congenital neutropenia, which predisposes to MDS and AML."},{"id":"liu-2025-germline-myeloid-C0073","paper":"liu-2025-germline-myeloid","category":"germline","tier":"restated secondary","genes":["G6PC3","GFI1","JAGN1","TCRG1","VPS45A","CLPB"],"diseases":[],"text":"Germline pathogenic/likely pathogenic variants in G6PC3, GFI1, JAGN1, TCRG1, VPS45A, or CLPB are genetic causes of severe congenital neutropenia, which predisposes to MDS and AML."},{"id":"luque-paz-2023-blood-mpn-C0005","paper":"luque-paz-2023-blood-mpn","category":"diagnosis","tier":"restated secondary","genes":["JAK2","CALR","MPL"],"diseases":["MPN"],"text":"Myeloproliferative neoplasm (MPN) without a detectable JAK2, CALR, or MPL disease-driver mutation is termed triple-negative MPN."},{"id":"luque-paz-2023-blood-mpn-C0006","paper":"luque-paz-2023-blood-mpn","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["CHIP"],"text":"Clonal hematopoiesis of indeterminate potential (CHIP) denotes a potentially premalignant state in individuals without a hematologic malignancy."},{"id":"luque-paz-2023-blood-mpn-C0007","paper":"luque-paz-2023-blood-mpn","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["CHIP"],"text":"In most studies summarized by this review, CHIP was defined using a variant allele fraction >2%."},{"id":"luque-paz-2023-blood-mpn-C0008","paper":"luque-paz-2023-blood-mpn","category":"diagnosis","tier":"restated secondary","genes":["JAK2"],"diseases":["CHIP"],"text":"Some highly sensitive PCR studies have expanded CHIP to include JAK2 p.V617F at variant allele fractions as low as 0.01%."},{"id":"luque-paz-2023-blood-mpn-C0009","paper":"luque-paz-2023-blood-mpn","category":"diagnosis","tier":"restated secondary","genes":["JAK2"],"diseases":["CHIP","MPN"],"text":"JAK2 p.V617F can occur in CHIP without myeloproliferative neoplasm (MPN), so detection of JAK2 p.V617F alone does not establish MPN."},{"id":"luque-paz-2023-blood-mpn-C0010","paper":"luque-paz-2023-blood-mpn","category":"diagnosis","tier":"restated secondary","genes":["JAK2"],"diseases":["MPN"],"text":"A very low JAK2 p.V617F variant allele fraction in purified granulocytes does not exclude a myeloproliferative neoplasm (MPN) phenotype."},{"id":"luque-paz-2023-blood-mpn-C0011","paper":"luque-paz-2023-blood-mpn","category":"diagnosis","tier":"restated secondary","genes":["JAK2","MPL"],"diseases":["ET"],"text":"In triple-negative essential thrombocythemia (ET), non-hotspot JAK2 or MPL variants may have no or only weak oncogenic potential; other mutations may drive the phenotype."},{"id":"luque-paz-2023-blood-mpn-C0012","paper":"luque-paz-2023-blood-mpn","category":"biomarker","tier":"restated secondary","genes":["JAK2"],"diseases":["MPN"],"text":"In MPN, detection of 9p uniparental disomy identifies JAK2 p.V617F homozygosity."},{"id":"luque-paz-2023-blood-mpn-C0014","paper":"luque-paz-2023-blood-mpn","category":"diagnosis","tier":"restated secondary","genes":["JAK2","MPL"],"diseases":["ET"],"text":"In triple-negative essential thrombocythemia (ET), sequencing the full coding regions of JAK2 and MPL can detect non-hotspot variants missed by hotspot-focused testing."},{"id":"luque-paz-2023-blood-mpn-C0016","paper":"luque-paz-2023-blood-mpn","category":"prognosis","tier":"restated secondary","genes":["JAK2"],"diseases":["CHIP"],"text":"In JAK2 p.V617F CHIP, variant allele fraction >2% or an increasing variant allele fraction during follow-up is associated with a high rate of conversion to myeloproliferative neoplasm (MPN)."},{"id":"luque-paz-2023-blood-mpn-C0017","paper":"luque-paz-2023-blood-mpn","category":"prognosis","tier":"restated secondary","genes":["JAK2"],"diseases":["CHIP"],"text":"JAK2 p.V617F CHIP only rarely progresses to myeloproliferative neoplasm (MPN)."},{"id":"luque-paz-2023-blood-mpn-C0018","paper":"luque-paz-2023-blood-mpn","category":"prognosis","tier":"restated secondary","genes":["JAK2"],"diseases":["CHIP"],"text":"JAK2 p.V617F CHIP is associated with substantially higher cardiovascular disease risk than other common CHIP mutations."},{"id":"luque-paz-2023-blood-mpn-C0019","paper":"luque-paz-2023-blood-mpn","category":"prognosis","tier":"restated secondary","genes":["IDH1","IDH2","ASXL1","EZH2","NRAS","KRAS","CBL","SRSF2","U2AF1","RUNX1","TP53"],"diseases":["MPN"],"text":"In myeloproliferative neoplasm (MPN), mutations in IDH1, IDH2, ASXL1, EZH2, NRAS, KRAS, CBL, SRSF2, U2AF1, RUNX1, or TP53 are listed as having adverse prognostic impact across MPN subtypes."},{"id":"luque-paz-2023-blood-mpn-C0020","paper":"luque-paz-2023-blood-mpn","category":"prognosis","tier":"restated secondary","genes":["SF3B1"],"diseases":["ET"],"text":"In essential thrombocythemia (ET), SF3B1 mutations in exons 14-16 are listed as having adverse prognostic impact."},{"id":"luque-paz-2023-blood-mpn-C0021","paper":"luque-paz-2023-blood-mpn","category":"prognosis","tier":"restated secondary","genes":["NFE2"],"diseases":["MPN"],"text":"In myeloproliferative neoplasm (MPN), NFE2 mutations are associated with increased risk of leukemic transformation."},{"id":"luque-paz-2023-blood-mpn-C0022","paper":"luque-paz-2023-blood-mpn","category":"prognosis","tier":"restated secondary","genes":["ASXL1","EZH2","IDH1","IDH2","SRSF2"],"diseases":["PMF"],"text":"In primary myelofibrosis (PMF), ASXL1, EZH2, IDH1, IDH2, and SRSF2 mutations are designated high molecular risk (HMR) because of their stronger negative prognostic effect."},{"id":"luque-paz-2023-blood-mpn-C0027","paper":"luque-paz-2023-blood-mpn","category":"prognosis","tier":"restated secondary","genes":["CALR","JAK2","MPL"],"diseases":["MPN"],"text":"CALR-mutated myeloproliferative neoplasm (MPN) has a more favorable prognosis for thrombo-hemorrhagic complications than JAK2- or MPL-mutated MPN."},{"id":"luque-paz-2023-blood-mpn-C0028","paper":"luque-paz-2023-blood-mpn","category":"prognosis","tier":"restated secondary","genes":["CALR","JAK2","MPL"],"diseases":["MPN"],"text":"CALR-mutated myeloproliferative neoplasm (MPN) is associated with better overall survival than JAK2- or MPL-mutated MPN."},{"id":"luque-paz-2023-blood-mpn-C0029","paper":"luque-paz-2023-blood-mpn","category":"prognosis","tier":"restated secondary","genes":["JAK2","CALR","MPL"],"diseases":["PMF"],"text":"Triple-negative primary myelofibrosis (PMF), lacking JAK2, CALR, and MPL disease-driver mutations, has the least favorable outcome among the disease-driver categories described in this review."},{"id":"luque-paz-2023-blood-mpn-C0030","paper":"luque-paz-2023-blood-mpn","category":"prognosis","tier":"restated secondary","genes":["JAK2"],"diseases":["ET","PV"],"text":"In essential thrombocythemia (ET) and polycythemia vera (PV), increasing JAK2 p.V617F variant allele fraction during follow-up is associated with higher risk of progression to myelofibrosis."},{"id":"luque-paz-2023-blood-mpn-C0031","paper":"luque-paz-2023-blood-mpn","category":"prognosis","tier":"restated secondary","genes":["JAK2","TET2"],"diseases":["MPN"],"text":"In myeloproliferative neoplasm (MPN) carrying both JAK2 p.V617F and TET2 mutations, the order of mutation acquisition has been reported to influence thrombotic risk."},{"id":"luque-paz-2023-blood-mpn-C0032","paper":"luque-paz-2023-blood-mpn","category":"prognosis","tier":"restated secondary","genes":["TP53"],"diseases":["MPN"],"text":"Low-variant-allele-fraction TP53-mutated subclones detected at myeloproliferative neoplasm (MPN) diagnosis are compatible with stable disease during follow-up."},{"id":"luque-paz-2023-blood-mpn-C0033","paper":"luque-paz-2023-blood-mpn","category":"prognosis","tier":"restated secondary","genes":["TP53"],"diseases":["MPN"],"text":"In myeloproliferative neoplasm (MPN), leukemic transformation is frequently associated with an increase in TP53 variant allele fraction to >50%."},{"id":"luque-paz-2023-blood-mpn-C0036","paper":"luque-paz-2023-blood-mpn","category":"treatment","tier":"restated secondary","genes":["JAK2","CALR"],"diseases":["MPN"],"text":"In myeloproliferative neoplasm (MPN), JAK2 p.V617F is associated with a higher rate of molecular response to pegylated interferon-alpha than CALR mutation."},{"id":"luque-paz-2023-blood-mpn-C0037","paper":"luque-paz-2023-blood-mpn","category":"treatment","tier":"restated secondary","genes":["TET2","DNMT3A"],"diseases":["MPN"],"text":"In myeloproliferative neoplasm (MPN), additional TET2 or DNMT3A mutations are associated with lower molecular responsiveness to pegylated interferon-alpha."},{"id":"luque-paz-2023-blood-mpn-C0038","paper":"luque-paz-2023-blood-mpn","category":"treatment","tier":"restated secondary","genes":["JAK2","DNMT3A"],"diseases":["MPN"],"text":"In myeloproliferative neoplasm (MPN), pegylated interferon-alpha has been reported to promote expansion of subclones carrying both JAK2 p.V617F and DNMT3A mutations."},{"id":"luque-paz-2023-blood-mpn-C0039","paper":"luque-paz-2023-blood-mpn","category":"germline","tier":"restated secondary","genes":["JAK2","MPL"],"diseases":[],"text":"In MPN/MPN-like phenotypes, JAK2 p.V617I and MPL p.S505N have each been reported as either germline or somatic; detection of either variant therefore does not by itself establish germline origin."},{"id":"luque-paz-2023-blood-mpn-C0040","paper":"luque-paz-2023-blood-mpn","category":"germline","tier":"restated secondary","genes":["RBBP6"],"diseases":["MPN"],"text":"Germline RBBP6 mutations are described as a rare familial predisposition to myeloproliferative neoplasm (MPN)."},{"id":"luque-paz-2023-blood-mpn-C0041","paper":"luque-paz-2023-blood-mpn","category":"germline","tier":"restated secondary","genes":["EPOR"],"diseases":["MPN"],"text":"The germline EPOR p.P488S variant was reported to increase the risk of acquiring myeloproliferative neoplasm (MPN) in one family."},{"id":"luque-paz-2023-blood-mpn-C0042","paper":"luque-paz-2023-blood-mpn","category":"germline","tier":"restated secondary","genes":["EPOR","EPO","THPO","MPL"],"diseases":[],"text":"Germline mutations in EPOR, EPO, THPO, or MPL can cause familial erythrocytosis or thrombocytosis, most often with autosomal-dominant inheritance and potentially very high penetrance."},{"id":"luque-paz-2023-blood-mpn-C0043","paper":"luque-paz-2023-blood-mpn","category":"germline","tier":"restated secondary","genes":["VHL"],"diseases":[],"text":"Biallelic germline VHL mutations cause Chuvash polycythemia with autosomal-recessive inheritance."},{"id":"malcovati-2017-ccus-foundation-C0002","paper":"malcovati-2017-ccus-foundation","category":"diagnosis","tier":"multivariable-adjusted","genes":["SF3B1"],"diseases":["myeloid neoplasm, unspecified"],"text":"In unexplained cytopenia, SF3B1 mutation strongly supports an underlying myeloid neoplasm, unspecified by subtype, including when SF3B1 is the only detected mutation."},{"id":"malcovati-2017-ccus-foundation-C0003","paper":"malcovati-2017-ccus-foundation","category":"diagnosis","tier":"univariable or descriptive","genes":["SRSF2","U2AF1","ZRSR2","JAK2","RUNX1"],"diseases":["myeloid neoplasm, unspecified"],"text":"In unexplained cytopenia, SRSF2, U2AF1, ZRSR2, JAK2, or RUNX1 mutation strongly supports an underlying myeloid neoplasm, unspecified by subtype, whether detected alone or with other mutations."},{"id":"malcovati-2017-ccus-foundation-C0004","paper":"malcovati-2017-ccus-foundation","category":"diagnosis","tier":"univariable or descriptive","genes":["TET2","DNMT3A","ASXL1"],"diseases":["myeloid neoplasm, unspecified"],"text":"In unexplained cytopenia, an isolated TET2, DNMT3A, or ASXL1 mutation provides substantially less support for an underlying myeloid neoplasm, unspecified by subtype, than the same mutation occurring with additional genetic lesions."},{"id":"malcovati-2017-ccus-foundation-C0005","paper":"malcovati-2017-ccus-foundation","category":"diagnosis","tier":"univariable or descriptive","genes":["TP53","TET2","ASXL1"],"diseases":["myeloid neoplasm, unspecified"],"text":"In unexplained cytopenia, TP53 mutation is more supportive of an underlying myeloid neoplasm, unspecified by subtype, when co-mutated—most often with TET2 or ASXL1—than when TP53 is isolated."},{"id":"malcovati-2017-ccus-foundation-C0006","paper":"malcovati-2017-ccus-foundation","category":"diagnosis","tier":"univariable or descriptive","genes":["TET2","DNMT3A","ASXL1","RUNX1","EZH2","CBL","TP53","NRAS","CUX1","IDH2"],"diseases":["myeloid neoplasm, unspecified"],"text":"In unexplained cytopenia, co-mutation patterns in which TET2, DNMT3A, or ASXL1 co-occurs with RUNX1, EZH2, CBL, TP53, NRAS, CUX1, or IDH2 are highly predictive of an underlying myeloid neoplasm, unspecified by subtype."},{"id":"malcovati-2017-ccus-foundation-C0007","paper":"malcovati-2017-ccus-foundation","category":"diagnosis","tier":"univariable or descriptive","genes":["SF3B1"],"diseases":["MDS","MDS/MPN","AML"],"text":"In unexplained cytopenia, SF3B1 mutation is highly specific for a myeloid neoplasm with myelodysplasia—MDS, MDS/MPN, or AML with myelodysplasia-related changes—even when SF3B1 is the only detected mutation."},{"id":"malcovati-2017-ccus-foundation-C0008","paper":"malcovati-2017-ccus-foundation","category":"diagnosis","tier":"univariable or descriptive","genes":["ZRSR2"],"diseases":["MDS","MDS/MPN","AML"],"text":"In unexplained cytopenia, ZRSR2 mutation is highly specific for a myeloid neoplasm with myelodysplasia—MDS, MDS/MPN, or AML with myelodysplasia-related changes."},{"id":"malcovati-2017-ccus-foundation-C0009","paper":"malcovati-2017-ccus-foundation","category":"diagnosis","tier":"univariable or descriptive","genes":["TET2","ASXL1","DNMT3A","RUNX1","EZH2","CBL","BCOR","CUX1","TP53","IDH1","IDH2"],"diseases":["MDS","MDS/MPN","AML"],"text":"In unexplained cytopenia, co-mutation patterns in which TET2, ASXL1, or DNMT3A co-occurs with RUNX1, EZH2, CBL, BCOR, CUX1, TP53, IDH1, or IDH2 are highly specific for a myeloid neoplasm with myelodysplasia—MDS, MDS/MPN, or AML with myelodysplasia-related changes."},{"id":"malcovati-2017-ccus-foundation-C0010","paper":"malcovati-2017-ccus-foundation","category":"diagnosis","tier":"univariable or descriptive","genes":["SRSF2","U2AF1","JAK2"],"diseases":["MDS","MDS/MPN","AML","PMF"],"text":"In unexplained cytopenia, SRSF2 or U2AF1 mutation is highly specific for a myeloid neoplasm with myelodysplasia—MDS, MDS/MPN, or AML with myelodysplasia-related changes—except when co-occurring with JAK2 in primary myelofibrosis."},{"id":"malcovati-2017-ccus-foundation-C0011","paper":"malcovati-2017-ccus-foundation","category":"diagnosis","tier":"univariable or descriptive","genes":["SF3B1","SRSF2","U2AF1","ZRSR2","TET2","ASXL1","DNMT3A","RUNX1","EZH2","CBL","BCOR","CUX1","TP53","IDH1","IDH2"],"diseases":["CCUS","MDS"],"text":"In patients with CCUS and inconclusive dysplasia, the authors propose that highly specific mutation patterns—SF3B1, SRSF2, U2AF1, or ZRSR2 mutation, or TET2, ASXL1, or DNMT3A co-mutated with RUNX1, EZH2, CBL, BCOR, CUX1, TP53, IDH1, or IDH2—may provide presumptive evidence of MDS even when definitive morphologic criteria are absent."},{"id":"malcovati-2017-ccus-foundation-C0012","paper":"malcovati-2017-ccus-foundation","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["MDS"],"text":"In MDS with del(5q), del(5q) can be the sole founding and disease-defining genetic lesion; an accompanying sequence mutation is not required."},{"id":"malcovati-2017-ccus-foundation-C0013","paper":"malcovati-2017-ccus-foundation","category":"prognosis","tier":"univariable or descriptive","genes":["SF3B1","SRSF2","U2AF1","ZRSR2","TET2","ASXL1","DNMT3A"],"diseases":["CCUS"],"text":"In CCUS, spliceosome mutations in SF3B1, SRSF2, U2AF1, or ZRSR2, or TET2, ASXL1, or DNMT3A mutations with additional mutations, identify a very high risk of progression to a myeloid neoplasm."},{"id":"marando-2025-cmml-C0005","paper":"marando-2025-cmml","category":"diagnosis","tier":"restated secondary","genes":["ASXL1"],"diseases":["CMML"],"text":"Truncating ASXL1 variants are associated with proliferative disease features in chronic myelomonocytic leukemia."},{"id":"marando-2025-cmml-C0006","paper":"marando-2025-cmml","category":"diagnosis","tier":"restated secondary","genes":["NRAS","CBL","PTPN11","KRAS","NF1","BRAF"],"diseases":["CMML"],"text":"In chronic myelomonocytic leukemia, signaling pathway mutations are usually associated with the proliferative CMML phenotype; this signaling-mutation group is largely dominated by oncogenic RAS-pathway mutations involving NRAS, CBL, PTPN11, KRAS, NF1, and BRAF."},{"id":"marando-2025-cmml-C0009","paper":"marando-2025-cmml","category":"prognosis","tier":"restated secondary","genes":["ASXL1"],"diseases":["CMML"],"text":"ASXL1 mutations reproducibly predict inferior outcomes in chronic myelomonocytic leukemia."},{"id":"marando-2025-cmml-C0010","paper":"marando-2025-cmml","category":"prognosis","tier":"restated secondary","genes":["ASXL1"],"diseases":["CMML"],"text":"Truncating ASXL1 variants are associated with adverse outcomes in chronic myelomonocytic leukemia."},{"id":"marando-2025-cmml-C0011","paper":"marando-2025-cmml","category":"prognosis","tier":"restated secondary","genes":["FLT3"],"diseases":["CMML"],"text":"In chronic myelomonocytic leukemia, FLT3 internal tandem duplication usually heralds transformation to acute myeloid leukemia."},{"id":"marando-2025-cmml-C0012","paper":"marando-2025-cmml","category":"treatment","tier":"restated secondary","genes":["ASXL1"],"diseases":["CMML"],"text":"Truncating ASXL1 variants are associated with resistance to epigenetic therapies in chronic myelomonocytic leukemia."},{"id":"marando-2025-cmml-C0013","paper":"marando-2025-cmml","category":"treatment","tier":"restated secondary","genes":["TET2","ASXL1"],"diseases":["CMML"],"text":"In chronic myelomonocytic leukemia, TET2 mutation in the absence of ASXL1 mutation is described as the best predictor of response to DNA methyltransferase inhibitors."},{"id":"marando-2025-cmml-C0017","paper":"marando-2025-cmml","category":"treatment","tier":"restated secondary","genes":["NRAS","KRAS"],"diseases":["AML"],"text":"In acute myeloid leukemia, venetoclax can favor outgrowth of monocytic subpopulations arising from low-variant-allele-fraction NRAS- or KRAS-mutated clones."},{"id":"marando-2025-cmml-C0021","paper":"marando-2025-cmml","category":"treatment","tier":"restated secondary","genes":["IDH1","IDH2","FLT3"],"diseases":["CMML"],"text":"IDH1, IDH2, and FLT3 are targetable in chronic myelomonocytic leukemia, but these mutations are very infrequent and corresponding inhibitors are rarely prescribed in CMML."},{"id":"marando-2025-cmml-C0022","paper":"marando-2025-cmml","category":"germline","tier":"restated secondary","genes":["NRAS","CBL","PTPN11","KRAS","NF1"],"diseases":["JMML"],"text":"In juvenile myelomonocytic leukemia, RAS-pathway alterations involving NRAS, CBL, PTPN11, KRAS, or NF1 may be germline or somatic."},{"id":"marchand-2024-lgl-pdf-C0019","paper":"marchand-2024-lgl-pdf","category":"diagnosis","tier":"restated secondary","genes":["STAT3","STAT5B"],"diseases":["T-LGLL"],"text":"In suspected T-LGLL, recurrent STAT3 or STAT5B mutations can provide molecular support for the diagnosis in the appropriate clinicophenotypic and clonal context. STAT3 mutations are typically gain-of-function SH2-domain missense variants, most commonly D661Y and Y640F; STAT5B mutations are particularly enriched in CD4-positive T-LGLL."},{"id":"marchand-2024-lgl-pdf-C0020","paper":"marchand-2024-lgl-pdf","category":"diagnosis","tier":"restated secondary","genes":["STAT3","STAT5B","TET2","CCL22"],"diseases":["NK-LGLL"],"text":"In suspected NK-LGLL, recurrent STAT3, STAT5B, TET2 or CCL22 mutations can provide molecular support for clonality and diagnosis in the appropriate clinicophenotypic context. STAT3 mutations are typically gain-of-function SH2-domain variants including D661Y and Y640F, while CCL22 mutations are described as recurrent gain-of-function alterations. TET2 mutations are less specific because they may arise from clonal hematopoiesis or an associated myeloid clone."},{"id":"marchand-2024-lgl-pdf-C0026","paper":"marchand-2024-lgl-pdf","category":"prognosis","tier":"restated secondary","genes":["STAT3"],"diseases":["T-LGLL","NK-LGLL"],"text":"In T-LGLL and NK-LGLL, STAT3 mutation is associated with reduced overall survival."},{"id":"marchand-2024-lgl-pdf-C0027","paper":"marchand-2024-lgl-pdf","category":"treatment","tier":"restated secondary","genes":[],"diseases":["T-LGLL","NK-LGLL"],"text":"For both T-LGLL and NK-LGLL, recommended first-line single-agent immunosuppressive options are cyclophosphamide, methotrexate, or cyclosporine."},{"id":"marchand-2024-lgl-pdf-C0029","paper":"marchand-2024-lgl-pdf","category":"treatment","tier":"restated secondary","genes":[],"diseases":["T-LGLL","NK-LGLL"],"text":"For T-LGLL or NK-LGLL with rheumatoid arthritis, methotrexate is an appropriate treatment option because it is active against both conditions."},{"id":"marchand-2024-lgl-pdf-C0030","paper":"marchand-2024-lgl-pdf","category":"treatment","tier":"restated secondary","genes":[],"diseases":["T-LGLL","NK-LGLL"],"text":"For T-LGLL and NK-LGLL, cyclophosphamide and methotrexate are generally considered the preferred first-line treatment options."},{"id":"marchand-2024-lgl-pdf-C0031","paper":"marchand-2024-lgl-pdf","category":"treatment","tier":"restated secondary","genes":[],"diseases":["T-LGLL","NK-LGLL"],"text":"For T-LGLL or NK-LGLL overlapping with aplastic anemia, cyclosporine is usually considered a treatment option."},{"id":"marchand-2024-lgl-pdf-C0032","paper":"marchand-2024-lgl-pdf","category":"treatment","tier":"restated secondary","genes":[],"diseases":["T-LGLL","NK-LGLL"],"text":"For T-LGLL or NK-LGLL that has failed both cyclophosphamide and methotrexate, cyclosporine is usually considered a subsequent treatment option."},{"id":"marchand-2024-lgl-pdf-C0034","paper":"marchand-2024-lgl-pdf","category":"treatment","tier":"restated secondary","genes":["STAT3"],"diseases":["T-LGLL","NK-LGLL"],"text":"In relapsed or refractory T-LGLL and NK-LGLL treated with ruxolitinib, STAT3-mutated disease is associated with better event-free survival than STAT3-wild-type disease."},{"id":"paolino-2024-ikzf1-all-C0001","paper":"paolino-2024-ikzf1-all","category":"diagnosis","tier":"restated secondary","genes":["IKZF1"],"diseases":["B-ALL"],"text":"In B-ALL, heterozygous IKZF1 N159Y is associated with a subtype-defining characteristic gene-expression pattern."},{"id":"paolino-2024-ikzf1-all-C0002","paper":"paolino-2024-ikzf1-all","category":"diagnosis","tier":"restated secondary","genes":["IKZF1","CDKN2A","CDKN2B","PAX5","ERG"],"diseases":["B-ALL"],"text":"In B-ALL, IKZF1plus is defined by an IKZF1 deletion with a co-occurring deletion of CDKN2A, CDKN2B, PAX5, or PAR1 and absence of an ERG deletion."},{"id":"paolino-2024-ikzf1-all-C0003","paper":"paolino-2024-ikzf1-all","category":"diagnosis","tier":"restated secondary","genes":["BCR","ABL1"],"diseases":["B-ALL"],"text":"Ph-like B-ALL is defined by a gene-expression profile resembling BCR::ABL1-positive B-ALL in the absence of BCR::ABL1."},{"id":"paolino-2024-ikzf1-all-C0004","paper":"paolino-2024-ikzf1-all","category":"diagnosis","tier":"restated secondary","genes":["DUX4"],"diseases":["B-ALL"],"text":"DUX4 rearrangements define a distinct molecular subgroup of B-ALL."},{"id":"paolino-2024-ikzf1-all-C0005","paper":"paolino-2024-ikzf1-all","category":"diagnosis","tier":"restated secondary","genes":["CRLF2","EPOR","ABL1","ABL2","CSF1R","PDGFRA","PDGFRB","NTRK3","PTK2B","DGKH"],"diseases":["B-ALL"],"text":"Ph-like B-ALL can be driven by kinase-activating lesions including CRLF2 rearrangements, EPOR fusions, ABL-class fusions involving ABL1, ABL2, CSF1R, PDGFRA, or PDGFRB, activating RAS-pathway mutations, and rarer fusions involving NTRK3, PTK2B, or DGKH."},{"id":"paolino-2024-ikzf1-all-C0007","paper":"paolino-2024-ikzf1-all","category":"prognosis","tier":"restated secondary","genes":["IKZF1"],"diseases":["B-ALL"],"text":"Partial IKZF1 deletion is independently associated with increased relapse risk in B-ALL."},{"id":"paolino-2024-ikzf1-all-C0008","paper":"paolino-2024-ikzf1-all","category":"prognosis","tier":"restated secondary","genes":["IKZF1"],"diseases":["B-ALL"],"text":"In newly diagnosed Ph-negative B-ALL, IKZF1 deletion is independently associated with adverse prognosis, including after adjustment for age, presenting white-cell count, co-occurring genomic abnormalities, and end-induction MRD."},{"id":"paolino-2024-ikzf1-all-C0009","paper":"paolino-2024-ikzf1-all","category":"prognosis","tier":"restated secondary","genes":["IKZF1","KMT2A"],"diseases":["B-ALL"],"text":"In children with Ph-negative, KMT2A-wild-type B-ALL, IKZF1 deletion is associated with increased relapse risk."},{"id":"paolino-2024-ikzf1-all-C0010","paper":"paolino-2024-ikzf1-all","category":"prognosis","tier":"restated secondary","genes":["IKZF1","CDKN2A","CDKN2B","PAX5","ERG"],"diseases":["B-ALL"],"text":"In pediatric B-ALL, IKZF1plus—an IKZF1 deletion with deletion of CDKN2A, CDKN2B, PAX5, or PAR1 and no ERG deletion—is associated with worse event-free survival and relapse than IKZF1 deletion alone or absence of IKZF1 deletion."},{"id":"paolino-2024-ikzf1-all-C0011","paper":"paolino-2024-ikzf1-all","category":"prognosis","tier":"restated secondary","genes":["IKZF1","BCR","ABL1"],"diseases":["B-ALL"],"text":"IKZF1 deletion is an independent adverse prognostic factor in adult and pediatric BCR::ABL1-positive B-ALL."},{"id":"paolino-2024-ikzf1-all-C0012","paper":"paolino-2024-ikzf1-all","category":"prognosis","tier":"restated secondary","genes":["IKZF1","BCR","ABL1"],"diseases":["B-ALL"],"text":"In pediatric BCR::ABL1-positive B-ALL treated with imatinib, co-existing IKZF1 deletion remains associated with inferior disease-free survival."},{"id":"paolino-2024-ikzf1-all-C0013","paper":"paolino-2024-ikzf1-all","category":"prognosis","tier":"restated secondary","genes":["IKZF1"],"diseases":["B-ALL"],"text":"In children and young adults with Ph-like B-ALL, IKZF1 deletion is associated with inferior event-free survival compared with Ph-like B-ALL without IKZF1 deletion."},{"id":"paolino-2024-ikzf1-all-C0014","paper":"paolino-2024-ikzf1-all","category":"prognosis","tier":"restated secondary","genes":["ETV6","RUNX1","IKZF1"],"diseases":["B-ALL"],"text":"In ETV6::RUNX1-positive B-ALL, co-occurring IKZF1 deletion is associated with inferior event-free survival, but MRD-guided treatment stratification can negate this adverse association."},{"id":"paolino-2024-ikzf1-all-C0015","paper":"paolino-2024-ikzf1-all","category":"prognosis","tier":"restated secondary","genes":["IKZF1"],"diseases":["B-ALL"],"text":"In high-hyperdiploid B-ALL, IKZF1 deletion is associated with inferior event-free survival even with MRD-guided treatment protocols."},{"id":"paolino-2024-ikzf1-all-C0018","paper":"paolino-2024-ikzf1-all","category":"prognosis","tier":"restated secondary","genes":["TCF3","HLF","BCR","ABL1","KMT2A"],"diseases":["B-ALL"],"text":"In B-ALL, hypodiploidy (<40 chromosomes), iAMP21, TCF3::HLF, BCR::ABL1, KMT2A translocations, and Ph-like-associated alterations are described as high-risk genomic features used in initial genomic risk stratification."},{"id":"paolino-2024-ikzf1-all-C0021","paper":"paolino-2024-ikzf1-all","category":"biomarker","tier":"restated secondary","genes":["IKZF1"],"diseases":["B-ALL"],"text":"Clinical IKZF1 deletion assessment in B-ALL should use an assay or assay combination capable of detecting both whole-gene and exon-level intragenic IKZF1 deletions with clinically relevant turnaround time."},{"id":"paolino-2024-ikzf1-all-C0022","paper":"paolino-2024-ikzf1-all","category":"biomarker","tier":"restated secondary","genes":["IKZF1"],"diseases":["B-ALL"],"text":"MLPA is described as the gold-standard assay for IKZF1 deletion detection in B-ALL and can detect whole-gene, single-exon, and multi-exon deletions."},{"id":"paolino-2024-ikzf1-all-C0023","paper":"paolino-2024-ikzf1-all","category":"biomarker","tier":"restated secondary","genes":["IKZF1"],"diseases":["B-ALL"],"text":"For IKZF1 assessment in B-ALL, most FISH probes are best suited to detecting whole-gene rather than intragenic IKZF1 deletions."},{"id":"paolino-2024-ikzf1-all-C0024","paper":"paolino-2024-ikzf1-all","category":"biomarker","tier":"restated secondary","genes":["IKZF1"],"diseases":["B-ALL"],"text":"DNA microarrays can detect whole-gene and intragenic IKZF1 deletions in B-ALL, with resolution dependent on probe coverage and assay design."},{"id":"paolino-2024-ikzf1-all-C0025","paper":"paolino-2024-ikzf1-all","category":"biomarker","tier":"restated secondary","genes":["IKZF1"],"diseases":["B-ALL"],"text":"PCR assays targeting recurrent IKZF1 intragenic-deletion breakpoints are highly sensitive in B-ALL but may miss rare deletions with unusual breakpoints."},{"id":"paolino-2024-ikzf1-all-C0026","paper":"paolino-2024-ikzf1-all","category":"biomarker","tier":"restated secondary","genes":["IKZF1"],"diseases":["B-ALL"],"text":"PCR assays targeting recurrent IKZF1 intragenic deletions have additional utility for MRD assessment in B-ALL."},{"id":"paolino-2024-ikzf1-all-C0027","paper":"paolino-2024-ikzf1-all","category":"biomarker","tier":"restated secondary","genes":["IKZF1"],"diseases":["B-ALL"],"text":"In B-ALL, targeted DNA sequencing validated for copy-number detection and with adequate IKZF1 coverage can detect whole-gene and intragenic IKZF1 deletions; sensitivity and detectable deletion size are assay-dependent."},{"id":"paolino-2024-ikzf1-all-C0031","paper":"paolino-2024-ikzf1-all","category":"biomarker","tier":"restated secondary","genes":["IKZF1"],"diseases":["B-ALL"],"text":"In most diagnostic B-ALL specimens with high blast burden, the ability to detect very-low-level subclonal IKZF1 deletions is considered non-essential."},{"id":"paolino-2024-ikzf1-all-C0037","paper":"paolino-2024-ikzf1-all","category":"biomarker","tier":"restated secondary","genes":["IKZF1"],"diseases":["B-ALL"],"text":"Total RNA sequencing without poly(A) enrichment can capture the underlying genomic breakpoints of most intragenic IKZF1 deletions in B-ALL."},{"id":"paolino-2024-ikzf1-all-C0041","paper":"paolino-2024-ikzf1-all","category":"treatment","tier":"restated secondary","genes":["IKZF1"],"diseases":["B-ALL"],"text":"In Ph-negative IKZF1-deleted B-ALL, intensified chemotherapy was associated with reduced relapse compared with the preceding treatment protocol."},{"id":"paolino-2024-ikzf1-all-C0042","paper":"paolino-2024-ikzf1-all","category":"treatment","tier":"restated secondary","genes":["IKZF1"],"diseases":["B-ALL"],"text":"In children with IKZF1-deleted B-ALL and medium-risk MRD, extending maintenance to a third year with methotrexate and intermittent 6-mercaptopurine was associated with improved event-free and overall survival compared with the preceding treatment protocol."},{"id":"paolino-2024-ikzf1-all-C0044","paper":"paolino-2024-ikzf1-all","category":"treatment","tier":"restated secondary","genes":["BCR","ABL1","IKZF1"],"diseases":["B-ALL"],"text":"In BCR::ABL1-positive B-ALL, the therapeutic benefit of tyrosine kinase inhibition extends to patients with concomitant IKZF1 deletion."},{"id":"paolino-2024-ikzf1-all-C0045","paper":"paolino-2024-ikzf1-all","category":"treatment","tier":"restated secondary","genes":["ABL1","ABL2","CSF1R","PDGFRB"],"diseases":["B-ALL"],"text":"Ph-like B-ALL with ABL-class rearrangements involving ABL1, ABL2, CSF1R, or PDGFRB is sensitive to imatinib or dasatinib."},{"id":"paolino-2024-ikzf1-all-C0048","paper":"paolino-2024-ikzf1-all","category":"treatment","tier":"restated secondary","genes":["IKZF1"],"diseases":["B-ALL"],"text":"Direct therapeutic restoration of IKZF1/IKAROS function is not currently possible in B-ALL."},{"id":"paolino-2024-ikzf1-all-C0050","paper":"paolino-2024-ikzf1-all","category":"germline","tier":"restated secondary","genes":["IKZF1"],"diseases":["acute lymphoblastic leukaemia/lymphoma"],"text":"Germline IKZF1 variants are associated with predisposition to acute lymphoblastic leukemia."},{"id":"passamonti-2017-mysec-pm-secondary-C0002","paper":"passamonti-2017-mysec-pm-secondary","category":"prognosis","tier":"restated secondary","genes":["JAK2","MPL","CALR"],"diseases":["post-PV/post-ET MF"],"text":"Among patients with post-PV/post-ET MF, JAK2-mutated post-ET MF and triple-negative disease lacking JAK2, MPL and CALR mutations were reported to have a higher incidence of blast phase than CALR-mutated disease."},{"id":"passamonti-2017-mysec-pm-secondary-C0003","paper":"passamonti-2017-mysec-pm-secondary","category":"prognosis","tier":"multivariable-adjusted","genes":["JAK2","MPL","CALR"],"diseases":["post-PV/post-ET MF"],"text":"In post-PV/post-ET MF, CALR-unmutated genotypes—JAK2-mutated, MPL-mutated, or triple-negative for JAK2, MPL and CALR—are associated with worse survival than CALR-mutated disease."},{"id":"tefferi-2018-journal-of-clinical-oncology-36-1769-C0001","paper":"tefferi-2018-journal-of-clinical-oncology-36-1769","category":"prognosis","tier":"restated secondary","genes":["ASXL1","SRSF2","EZH2","IDH1","IDH2"],"diseases":["PMF"],"text":"According to the original MIPSS70 and MIPSS70+ frameworks, ASXL1, SRSF2, EZH2, IDH1, and IDH2 mutations are high molecular risk mutations in primary myelofibrosis in transplant-age patients (≤70 years)."},{"id":"tefferi-2018-journal-of-clinical-oncology-36-1769-C0002","paper":"tefferi-2018-journal-of-clinical-oncology-36-1769","category":"prognosis","tier":"restated secondary","genes":["CALR"],"diseases":["PMF"],"text":"According to the original MIPSS70 and MIPSS70+ frameworks, CALR type 1/like mutation is a favorable prognostic mutatio
