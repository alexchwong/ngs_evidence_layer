:["AML"],"text":"del(20q) is sufficient for the myelodysplasia-related cytogenetic AML category when higher-priority categories are absent. In this branch, 10%-19% blasts is MDS/AML and at least 20% blasts is AML."},{"id":"d-hner-2022-blood-140-1345-C0028","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"univariable or descriptive","genes":[],"diseases":["AML"],"text":"idic(X)(q13) is sufficient for the myelodysplasia-related cytogenetic AML category when higher-priority categories are absent. In this branch, 10%-19% blasts is MDS/AML and at least 20% blasts is AML."},{"id":"d-hner-2022-blood-140-1345-C0029","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["AML"],"text":"Remaining cases without a higher-priority AML-defining category are classified as AML, not otherwise specified, when blasts are at least 20%, irrespective of the presence or absence of multilineage dysplasia."},{"id":"d-hner-2022-blood-140-1345-C0030","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"univariable or descriptive","genes":[],"diseases":["AML"],"text":"When a germline predisposing disorder is identified, it is appended as a diagnostic qualifier to the specific genetically defined AML disease category rather than replacing that primary category."},{"id":"d-hner-2022-blood-140-1345-C0031","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"restated secondary","genes":["CEBPA"],"diseases":["AML"],"text":"In germline CEBPA-mutation carriers, distinct acquired CEBPA mutations can re-emerge as independent primary AMLs rather than representing relapse, so recurrence may require distinction between a new primary AML and relapse."},{"id":"d-hner-2022-blood-140-1345-C0032","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"univariable or descriptive","genes":[],"diseases":["AML"],"text":"Prior cytotoxic chemotherapy, radiotherapy, or immune intervention for a nonmyeloid neoplasm is recorded as a therapy-related diagnostic qualifier rather than defining a separate AML disease entity."},{"id":"d-hner-2022-blood-140-1345-C0033","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["AML"],"text":"Progression from MDS is appended as a diagnostic qualifier when the antecedent MDS was confirmed by standard diagnostics more than 3 months before AML diagnosis."},{"id":"d-hner-2022-blood-140-1345-C0034","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["MDS/MPN"],"text":"Progression from MDS/MPN is appended as a diagnostic qualifier, with the MDS/MPN type specified, when the antecedent MDS/MPN was confirmed by standard diagnostics more than 3 months before AML diagnosis."},{"id":"d-hner-2022-blood-140-1345-C0035","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"univariable or descriptive","genes":[],"diseases":["AML"],"text":"Multiparameter flow-cytometric immunophenotyping is required to diagnose AML accurately by identifying cell-surface and intracellular markers."},{"id":"d-hner-2022-blood-140-1345-C0036","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"univariable or descriptive","genes":[],"diseases":["AML"],"text":"In acute myeloid leukemia (AML), when bone-marrow aspirate is unobtainable and circulating blasts are absent, myeloid phenotype may be confirmed on a core biopsy by immunohistochemistry."},{"id":"d-hner-2022-blood-140-1345-C0037","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"univariable or descriptive","genes":[],"diseases":["AML"],"text":"Conventional cytogenetic analysis is mandatory in the evaluation of AML."},{"id":"d-hner-2022-blood-140-1345-C0038","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"univariable or descriptive","genes":[],"diseases":["AML"],"text":"In acute myeloid leukemia (AML), if conventional cytogenetics yields no analyzable metaphases, FISH is an alternative for detecting specified recurrent fusions and myelodysplasia-related chromosome abnormalities."},{"id":"d-hner-2022-blood-140-1345-C0039","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"univariable or descriptive","genes":["ABL1","BCR","KMT2A"],"diseases":["acute leukaemia of ambiguous lineage"],"text":"In acute leukemia of ambiguous lineage, BCR::ABL1 and KMT2A rearrangements define genetically specified mixed-phenotype acute leukemia (MPAL) entities."},{"id":"d-hner-2022-blood-140-1345-C0041","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"univariable or descriptive","genes":[],"diseases":["acute leukaemia of ambiguous lineage"],"text":"In acute leukemia of ambiguous lineage, for MPAL, myeloid lineage can be assigned by MPO positivity, by monocytic differentiation with at least 2 of non-specific esterase, CD11c, CD14, CD64, or lysozyme, or by at least 2 of CD177, CD33, and CD13."},{"id":"d-hner-2022-blood-140-1345-C0042","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"univariable or descriptive","genes":[],"diseases":["acute leukaemia of ambiguous lineage"],"text":"In acute leukemia of ambiguous lineage, for MPAL, T-lineage is assigned by strong cytoplasmic CD3 or surface CD3 expression."},{"id":"d-hner-2022-blood-140-1345-C0043","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"univariable or descriptive","genes":[],"diseases":["acute leukaemia of ambiguous lineage"],"text":"In acute leukemia of ambiguous lineage, for MPAL, B-lineage is assigned by strong CD19 plus at least 1 strongly expressed cytoplasmic CD79a, cCD22, or CD10, or by weak CD19 plus at least 2 of those markers strongly expressed."},{"id":"d-hner-2022-blood-140-1345-C0044","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["AML"],"text":"Myeloblasts, monoblasts, and megakaryoblasts are included in the marrow or blood blast count used for AML classification."},{"id":"d-hner-2022-blood-140-1345-C0045","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"univariable or descriptive","genes":[],"diseases":["AML"],"text":"In AML with monocytic or myelomonocytic differentiation, monoblasts and promonocytes are counted as blast equivalents, whereas abnormal monocytes are not."},{"id":"d-hner-2022-blood-140-1345-C0046","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"univariable or descriptive","genes":["PML","RARA"],"diseases":["AML"],"text":"In AML with PML::RARA or a variant RARA rearrangement, promyelocytes are counted as blast equivalents for classification."},{"id":"d-hner-2022-blood-140-1345-C0047","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"guideline criterion","genes":["ABL1","BCR"],"diseases":["CML"],"text":"Cases with a history of CML and at least 20% blasts are classified as CML in myeloid blast phase rather than AML with BCR::ABL1."},{"id":"d-hner-2022-blood-140-1345-C0048","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["MDS/AML","AML"],"text":"Remaining cases without a higher-priority AML-defining category are designated MDS/AML otherwise not specified when marrow or blood blasts are 10%-19%."},{"id":"d-hner-2022-blood-140-1345-C0049","paper":"d-hner-2022-blood-140-1345","category":"prognosis","tier":"restated secondary","genes":["CEBPA"],"diseases":["AML"],"text":"In-frame mutations affecting the CEBPA bZIP region confer favorable outcome in AML irrespective of whether they are monoallelic or biallelic and are assigned to the favorable ELN risk group. The 2022 ELN risk system is based mainly on intensively treated patients and may require modification for less-intensive therapy."},{"id":"d-hner-2022-blood-140-1345-C0050","paper":"d-hner-2022-blood-140-1345","category":"prognosis","tier":"restated secondary","genes":["TP53"],"diseases":["AML"],"text":"TP53-mutant AML/MDS is associated with a very poor prognosis."},{"id":"d-hner-2022-blood-140-1345-C0051","paper":"d-hner-2022-blood-140-1345","category":"prognosis","tier":"guideline criterion","genes":["ASXL1","BCOR","EZH2","RUNX1","SF3B1","SRSF2","STAG2","U2AF1","ZRSR2"],"diseases":["AML"],"text":"In acute myeloid leukemia (AML), pathogenic mutations in ASXL1, BCOR, EZH2, RUNX1, SF3B1, SRSF2, STAG2, U2AF1, or ZRSR2 are adverse-risk myelodysplasia-related gene lesions, including in de novo AML, but should not currently be used as adverse prognostic markers when they co-occur with a favorable-risk AML subtype; the 2022 ELN risk system is based mainly on intensively treated patients and may require modification for less-intensive therapy."},{"id":"d-hner-2022-blood-140-1345-C0052","paper":"d-hner-2022-blood-140-1345","category":"prognosis","tier":"univariable or descriptive","genes":["CBFB","MYH11","RUNX1","RUNX1T1"],"diseases":["AML"],"text":"In acute myeloid leukemia (AML), RUNX1::RUNX1T1 and CBFB::MYH11 core-binding-factor AML are classified as favorable risk in the 2022 ELN genetic risk system; this risk system is based mainly on intensively treated patients and may require modification for less-intensive therapy."},{"id":"d-hner-2022-blood-140-1345-C0053","paper":"d-hner-2022-blood-140-1345","category":"prognosis","tier":"univariable or descriptive","genes":["FLT3","NPM1"],"diseases":["AML"],"text":"NPM1-mutated AML without FLT3-ITD is in the favorable ELN risk category when adverse-risk cytogenetic abnormalities are absent. The 2022 ELN risk system is based mainly on intensively treated patients and may require modification for less-intensive therapy."},{"id":"d-hner-2022-blood-140-1345-C0054","paper":"d-hner-2022-blood-140-1345","category":"prognosis","tier":"univariable or descriptive","genes":["FLT3","NPM1"],"diseases":["AML"],"text":"NPM1-mutated AML with FLT3-ITD is intermediate risk in the 2022 ELN system irrespective of the FLT3-ITD allelic ratio, unless adverse-risk genetic lesions apply. The 2022 ELN risk system is based mainly on intensively treated patients and may require modification for less-intensive therapy."},{"id":"d-hner-2022-blood-140-1345-C0055","paper":"d-hner-2022-blood-140-1345","category":"prognosis","tier":"univariable or descriptive","genes":["FLT3","NPM1"],"diseases":["AML"],"text":"Wild-type NPM1 AML with FLT3-ITD and no adverse-risk genetic lesions is intermediate risk irrespective of the FLT3-ITD allelic ratio. The 2022 ELN risk system is based mainly on intensively treated patients and may require modification for less-intensive therapy."},{"id":"d-hner-2022-blood-140-1345-C0056","paper":"d-hner-2022-blood-140-1345","category":"prognosis","tier":"univariable or descriptive","genes":["KMT2A","MLLT3"],"diseases":["AML"],"text":"AML with t(9;11)(p21.3;q23.3)/MLLT3::KMT2A is intermediate risk, and this abnormality takes precedence over rare concurrent adverse-risk gene mutations. The 2022 ELN risk system is based mainly on intensively treated patients and may require modification for less-intensive therapy."},{"id":"d-hner-2022-blood-140-1345-C0057","paper":"d-hner-2022-blood-140-1345","category":"prognosis","tier":"univariable or descriptive","genes":["ABL1","BCR","CREBBP","DEK","KAT6A","NUP214"],"diseases":["AML"],"text":"In acute myeloid leukemia (AML), DEK::NUP214, BCR::ABL1, and KAT6A::CREBBP rearrangements are in the adverse 2022 ELN genetic risk category; this risk system is based mainly on intensively treated patients and may require modification for less-intensive therapy."},{"id":"d-hner-2022-blood-140-1345-C0058","paper":"d-hner-2022-blood-140-1345","category":"prognosis","tier":"univariable or descriptive","genes":["KMT2A","MLLT3"],"diseases":["AML"],"text":"KMT2A-rearranged AML other than t(9;11)/MLLT3::KMT2A is adverse risk; KMT2A partial tandem duplication is excluded from this adverse-risk entry. The 2022 ELN risk system is based mainly on intensively treated patients and may require modification for less-intensive therapy."},{"id":"d-hner-2022-blood-140-1345-C0061","paper":"d-hner-2022-blood-140-1345","category":"prognosis","tier":"univariable or descriptive","genes":["GATA2","MECOM"],"diseases":["AML"],"text":"In acute myeloid leukemia (AML), MECOM-rearranged disease, including inv(3)/t(3;3) involving GATA2 and MECOM and other t(3q26.2;v) MECOM rearrangements, is classified as adverse risk; the 2022 ELN risk system is based mainly on intensively treated patients and may require modification for less-intensive therapy."},{"id":"d-hner-2022-blood-140-1345-C0062","paper":"d-hner-2022-blood-140-1345","category":"prognosis","tier":"univariable or descriptive","genes":["TP53"],"diseases":["AML"],"text":"TP53 mutation with VAF at least 10%, irrespective of monoallelic or biallelic status, is an adverse ELN genetic risk marker in AML. The 2022 ELN risk system is based mainly on intensively treated patients and may require modification for less-intensive therapy."},{"id":"d-hner-2022-blood-140-1345-C0063","paper":"d-hner-2022-blood-140-1345","category":"prognosis","tier":"restated secondary","genes":["DNMT3A","IDH1","IDH2"],"diseases":["AML"],"text":"In acute myeloid leukemia (AML), mutations in IDH1, IDH2, or DNMT3A are not assigned to a distinct 2022 ELN prognostic group on current evidence; the ELN risk system was developed mainly from intensively treated patients and may require modification for less-intensive therapy."},{"id":"d-hner-2022-blood-140-1345-C0064","paper":"d-hner-2022-blood-140-1345","category":"prognosis","tier":"restated secondary","genes":["NPM1"],"diseases":["AML"],"text":"For NPM1-mutated AML, ELN risk assignment can change during therapy according to MRD response, including reclassification between favorable and intermediate risk based on MRD status. The 2022 ELN risk system is based mainly on intensively treated patients and may require modification for less-intensive therapy."},{"id":"d-hner-2022-blood-140-1345-C0065","paper":"d-hner-2022-blood-140-1345","category":"prognosis","tier":"restated secondary","genes":["CBFB","MYH11","NPM1","RUNX1","RUNX1T1"],"diseases":["AML"],"text":"In acute myeloid leukemia (AML), molecular MRD for NPM1, RUNX1::RUNX1T1, or CBFB::MYH11 that remains below 2% at the end of consolidation is associated with a very low relapse rate and is not prognostic of relapse at that level; it is operationally considered MRD negative."},{"id":"d-hner-2022-blood-140-1345-C0066","paper":"d-hner-2022-blood-140-1345","category":"prognosis","tier":"restated secondary","genes":["IDH1"],"diseases":["AML"],"text":"Among responders with relapsed/refractory IDH1-mutated AML treated with ivosidenib, molecular clearance was associated with longer remission duration and prolonged survival."},{"id":"d-hner-2022-blood-140-1345-C0067","paper":"d-hner-2022-blood-140-1345","category":"prognosis","tier":"univariable or descriptive","genes":["FLT3"],"diseases":["AML"],"text":"In acute myeloid leukemia (AML), the FLT3-ITD allelic ratio is no longer used in the 2022 ELN risk classification; FLT3-ITD without adverse-risk genetic lesions is intermediate risk irrespective of allelic ratio. The 2022 ELN risk system is based mainly on intensively treated patients and may require modification for less-intensive therapy."},{"id":"d-hner-2022-blood-140-1345-C0068","paper":"d-hner-2022-blood-140-1345","category":"prognosis","tier":"restated secondary","genes":["CEBPA"],"diseases":["AML"],"text":"In CEBPA-mutated AML, the paper reports longer leukemia survival for patients with a germline CEBPA mutation than for patients with two acquired CEBPA mutations."},{"id":"d-hner-2022-blood-140-1345-C0069","paper":"d-hner-2022-blood-140-1345","category":"prognosis","tier":"univariable or descriptive","genes":["CBFB","FLT3","KIT","MYH11","RUNX1","RUNX1T1"],"diseases":["AML"],"text":"In acute myeloid leukemia (AML) with RUNX1::RUNX1T1 or CBFB::MYH11, concurrent KIT and/or FLT3 mutation does not alter the favorable ELN risk categorization; the 2022 ELN risk system is based mainly on intensively treated patients and may require modification for less-intensive therapy."},{"id":"d-hner-2022-blood-140-1345-C0070","paper":"d-hner-2022-blood-140-1345","category":"prognosis","tier":"guideline criterion","genes":["NPM1"],"diseases":["AML"],"text":"NPM1-mutated AML with adverse-risk cytogenetic abnormalities is categorized as adverse risk and has poor outcome. The 2022 ELN risk system is based mainly on intensively treated patients and may require modification for less-intensive therapy."},{"id":"d-hner-2022-blood-140-1345-C0071","paper":"d-hner-2022-blood-140-1345","category":"prognosis","tier":"restated secondary","genes":["IDH1","IDH2"],"diseases":["AML"],"text":"In acute myeloid leukemia (AML), the emerging use of targeted inhibitors may affect prognostic outcomes in IDH1- or IDH2-mutated disease, so prognosis based on historical data may change with targeted therapy."},{"id":"d-hner-2022-blood-140-1345-C0072","paper":"d-hner-2022-blood-140-1345","category":"treatment","tier":"guideline criterion","genes":[],"diseases":["AML"],"text":"For patients fit for intensive AML therapy, anthracycline plus cytarabine remains the standard backbone of induction chemotherapy."},{"id":"d-hner-2022-blood-140-1345-C0073","paper":"d-hner-2022-blood-140-1345","category":"treatment","tier":"guideline criterion","genes":[],"diseases":["AML"],"text":"After CR, CRh, or CRi following intensive AML therapy, consolidation should ideally include intermediate-dose cytarabine."},{"id":"d-hner-2022-blood-140-1345-C0074","paper":"d-hner-2022-blood-140-1345","category":"treatment","tier":"guideline criterion","genes":[],"diseases":["AML"],"text":"For older or unfit AML patients not candidates for intensive chemotherapy, azacitidine plus venetoclax is a standard-of-care lower-intensity regimen that improved response and median overall survival versus azacitidine alone."},{"id":"d-hner-2022-blood-140-1345-C0075","paper":"d-hner-2022-blood-140-1345","category":"treatment","tier":"univariable or descriptive","genes":[],"diseases":["AML"],"text":"For patients unable to receive a hypomethylating agent, low-dose cytarabine plus venetoclax is an alternative nonintensive AML treatment option."},{"id":"d-hner-2022-blood-140-1345-C0076","paper":"d-hner-2022-blood-140-1345","category":"treatment","tier":"univariable or descriptive","genes":[],"diseases":["AML"],"text":"Best supportive care, including hydroxyurea, is an option for AML patients who cannot tolerate any antileukemic therapy or do not wish treatment."},{"id":"d-hner-2022-blood-140-1345-C0077","paper":"d-hner-2022-blood-140-1345","category":"treatment","tier":"restated secondary","genes":[],"diseases":["AML"],"text":"CPX-351 is a treatment option for therapy-related AML or AML with myelodysplasia-related changes; in newly diagnosed patients aged 60-75 with secondary-type disease features it improved response and overall survival versus 7+3. Randomized data are lacking below age 60 and after prior MPN, and no benefit over 7+3 was shown for antecedent MDS with prior hypomethylating-agent exposure."},{"id":"d-hner-2022-blood-140-1345-C0078","paper":"d-hner-2022-blood-140-1345","category":"treatment","tier":"univariable or descriptive","genes":[],"diseases":["AML"],"text":"Oral azacitidine is approved as continued postremission treatment for AML in first CR/CRi after intensive induction when patients cannot complete intensive curative therapy including allogeneic HCT. Supporting data are lacking for patients younger than 55, CBF-AML, and use after GO- or CPX-351-based induction/consolidation; few trial patients had adverse-risk cytogenetics."},{"id":"d-hner-2022-blood-140-1345-C0079","paper":"d-hner-2022-blood-140-1345","category":"treatment","tier":"guideline criterion","genes":["FLT3"],"diseases":["AML"],"text":"For FLT3-mutated AML treated intensively, midostaurin should be incorporated into first-line induction and consolidation therapy."},{"id":"d-hner-2022-blood-140-1345-C0080","paper":"d-hner-2022-blood-140-1345","category":"treatment","tier":"restated secondary","genes":["FLT3"],"diseases":["AML"],"text":"In patients aged 18-59 with FLT3-mutated AML, adding midostaurin to daunorubicin/cytarabine induction and high-dose cytarabine consolidation improved 4-year overall survival from 44.3% to 51.4%."},{"id":"d-hner-2022-blood-140-1345-C0081","paper":"d-hner-2022-blood-140-1345","category":"treatment","tier":"restated secondary","genes":["FLT3"],"diseases":["AML"],"text":"In FLT3-ITD-positive AML aged 18-75, preliminary meeting-abstract results from a phase 3 trial reported prolonged overall survival with quizartinib added to intensive induction/consolidation followed by maintenance versus placebo; peer-reviewed results were not yet available."},{"id":"d-hner-2022-blood-140-1345-C0082","paper":"d-hner-2022-blood-140-1345","category":"treatment","tier":"univariable or descriptive","genes":["CD33"],"diseases":["AML"],"text":"Gemtuzumab ozogamicin dosed with daunorubicin and cytarabine is approved for previously untreated CD33-positive AML."},{"id":"d-hner-2022-blood-140-1345-C0084","paper":"d-hner-2022-blood-140-1345","category":"treatment","tier":"restated secondary","genes":["NPM1"],"diseases":["AML"],"text":"In NPM1-mutated AML, adding gemtuzumab ozogamicin reduced relapse probability and increased mutant NPM1 molecular clearance but did not improve event-free survival."},{"id":"d-hner-2022-blood-140-1345-C0085","paper":"d-hner-2022-blood-140-1345","category":"treatment","tier":"restated secondary","genes":["IDH1"],"diseases":["AML"],"text":"For newly diagnosed IDH1-mutated AML not treated intensively, ivosidenib plus azacitidine improved EFS, CR/CRh, and median overall survival versus azacitidine plus placebo."},{"id":"d-hner-2022-blood-140-1345-C0086","paper":"d-hner-2022-blood-140-1345","category":"treatment","tier":"guideline criterion","genes":["IDH1","IDH2"],"diseases":["AML"],"text":"In acute myeloid leukemia (AML), patients with IDH1- or IDH2-mutated disease who are too frail for HMA-based treatment may be offered monotherapy with a targeted IDH1 or IDH2 inhibitor."},{"id":"d-hner-2022-blood-140-1345-C0087","paper":"d-hner-2022-blood-140-1345","category":"treatment","tier":"restated secondary","genes":["FLT3"],"diseases":["AML"],"text":"For relapsed/refractory FLT3-mutated AML, gilteritinib is an approved salvage option that improved response rate and median overall survival versus physician-choice salvage therapy; randomized validation was after prior intensive chemotherapy."},{"id":"d-hner-2022-blood-140-1345-C0088","paper":"d-hner-2022-blood-140-1345","category":"treatment","tier":"restated secondary","genes":["FLT3"],"diseases":["AML"],"text":"Quizartinib improved overall survival versus conventional care in relapsed/refractory FLT3-ITD-positive AML, but neither FDA nor EMA granted approval after review of the trial data."},{"id":"d-hner-2022-blood-140-1345-C0089","paper":"d-hner-2022-blood-140-1345","category":"treatment","tier":"restated secondary","genes":["IDH1"],"diseases":["AML"],"text":"For relapsed/refractory IDH1-mutated AML, ivosidenib salvage is a treatment option with single-agent CR rates around 20% and overall response including hematologic improvement around 40%."},{"id":"d-hner-2022-blood-140-1345-C0090","paper":"d-hner-2022-blood-140-1345","category":"treatment","tier":"restated secondary","genes":["IDH2"],"diseases":["AML"],"text":"For relapsed/refractory IDH2-mutated AML, enasidenib has clinically useful single-agent activity, although a randomized late-line study in patients at least 60 years did not improve overall survival versus conventional care."},{"id":"d-hner-2022-blood-140-1345-C0091","paper":"d-hner-2022-blood-140-1345","category":"treatment","tier":"restated secondary","genes":["FLT3"],"diseases":["AML"],"text":"After allogeneic HCT for FLT3-mutated AML, randomized studies show sorafenib maintenance reduces relapse risk, making a FLT3 inhibitor a reasonable posttransplant maintenance option."},{"id":"d-hner-2022-blood-140-1345-C0092","paper":"d-hner-2022-blood-140-1345","category":"treatment","tier":"guideline criterion","genes":["FLT3"],"diseases":["AML"],"text":"For relapse after allogeneic HCT in FLT3-mutated AML with an emergent FLT3-mutant clone, gilteritinib is the preferred treatment option; in the pivotal study it improved survival in early relapse and was at least equivalent to intensive chemotherapy for relapse beyond 6 months."},{"id":"d-hner-2022-blood-140-1345-C0093","paper":"d-hner-2022-blood-140-1345","category":"treatment","tier":"guideline criterion","genes":["CEBPA","RUNX1"],"diseases":["AML"],"text":"In acute myeloid leukemia (AML), related donors carrying deleterious germline RUNX1 or CEBPA variants should not be used as stem-cell donors for allogeneic transplantation."},{"id":"d-hner-2022-blood-140-1345-C0094","paper":"d-hner-2022-blood-140-1345","category":"treatment","tier":"univariable or descriptive","genes":["CEBPA"],"diseases":["AML"],"text":"Because germline CEBPA predisposition remains after chemotherapy and can lead to independent AML, some experts advocate allogeneic HCT in first remission for affected patients."},{"id":"d-hner-2022-blood-140-1345-C0095","paper":"d-hner-2022-blood-140-1345","category":"treatment","tier":"restated secondary","genes":["TP53"],"diseases":["AML"],"text":"Magrolimab has shown preliminary activity with azacitidine in newly diagnosed AML/MDS including TP53-mutated disease, but CD47-SIRP-alpha inhibitors remained in early clinical evaluation."},{"id":"d-hner-2022-blood-140-1345-C0096","paper":"d-hner-2022-blood-140-1345","category":"treatment","tier":"univariable or descriptive","genes":["KMT2A","NPM1"],"diseases":["AML"],"text":"In acute myeloid leukemia (AML), menin inhibitors are under clinical evaluation for KMT2A-rearranged or NPM1-mutated disease rather than being established standard therapy."},{"id":"d-hner-2022-blood-140-1345-C0097","paper":"d-hner-2022-blood-140-1345","category":"treatment","tier":"guideline criterion","genes":["IDH1"],"diseases":["AML"],"text":"In IDH1-mutated AML treated with ivosidenib, differentiation syndrome can occur; recommended management includes dexamethasone, hydroxyurea for co-occurring leukocytosis, and dose interruption or reduction."},{"id":"d-hner-2022-blood-140-1345-C0098","paper":"d-hner-2022-blood-140-1345","category":"treatment","tier":"guideline criterion","genes":["IDH2"],"diseases":["AML"],"text":"In IDH2-mutated AML treated with enasidenib, differentiation syndrome can occur; recommended management includes dexamethasone, hydroxyurea for co-occurring leukocytosis, and dose interruption or reduction."},{"id":"d-hner-2022-blood-140-1345-C0099","paper":"d-hner-2022-blood-140-1345","category":"treatment","tier":"univariable or descriptive","genes":["AFDN","AFF1","BCOR","CBFA2T3","CBFB","CEBPA","CREBBP","DEK","ELL","ERG","ETV6","FIP1L1","FUS","GATA2","GLIS2","IRF2BP2","KAT6A","KMD5A","KMT2A","MECOM","MLF1","MLLT1","MLLT10","MLLT3","MNX1","MRTFA","MYC","MYH11","NPM1","NSD1","NUP214","NUP98","PICALM","PML","PRDM16","RARA","RBM15","RPN1","RUNX1","RUNX1T1","STAT3","STAT5B","TBL1XR1","TET1","ZBTB16"],"diseases":["MDS/MPN"],"text":"For AFDN, AFF1, BCOR, CBFA2T3, CBFB, CEBPA, CREBBP, DEK, ELL, ERG, ETV6, FIP1L1, FUS, GATA2, GLIS2, IRF2BP2, KAT6A, KMD5A, KMT2A, MECOM, MLF1, MLLT1, MLLT10, MLLT3, MNX1, MRTFA, MYC, MYH11, NPM1, NSD1, NUP214, NUP98, PICALM, PML, PRDM16, RARA, RBM15, RPN1, RUNX1, RUNX1T1, STAT3, STAT5B, TBL1XR1, TET1, ZBTB16, in patients with an established MDS/MPN, detection of any AML-defining recurrent genetic abnormality that uses the 10% blast threshold, together with at least 10% blasts/blast equivalents, is an indication for AML-type therapy even though the MDS/MPN diagnostic label is retained until at least 20% blasts/blast equivalents."},{"id":"d-hner-2022-blood-140-1345-C0100","paper":"d-hner-2022-blood-140-1345","category":"treatment","tier":"univariable or descriptive","genes":["FLT3"],"diseases":["AML"],"text":"Patients who received midostaurin during FLT3-mutated AML induction and consolidation may continue midostaurin during maintenance in line with the phase 3 regimen, although the independent value of maintenance remains uncertain."},{"id":"d-hner-2022-blood-140-1345-C0101","paper":"d-hner-2022-blood-140-1345","category":"treatment","tier":"univariable or descriptive","genes":[],"diseases":["AML"],"text":"FLAG-IDA and mitoxantrone-based cytarabine regimens are alternative active induction options for patients fit for intensive AML therapy."},{"id":"d-hner-2022-blood-140-1345-C0102","paper":"d-hner-2022-blood-140-1345","category":"treatment","tier":"restated secondary","genes":[],"diseases":["AML"],"text":"High-dose cytarabine at 3000 mg/m2 has greater toxicity without improved survival compared with lower/intermediate dosing, arguing against its continued routine use for AML consolidation."},{"id":"d-hner-2022-blood-140-1345-C0103","paper":"d-hner-2022-blood-140-1345","category":"treatment","tier":"restated secondary","genes":[],"diseases":["AML"],"text":"In acute myeloid leukemia (AML), for patients not candidates for intensive chemotherapy, phase 1b/2 studies suggest decitabine plus venetoclax has clinical outcomes similar to azacitidine plus venetoclax, although it was not evaluated in randomized trials in this report."},{"id":"d-hner-2022-blood-140-1345-C0104","paper":"d-hner-2022-blood-140-1345","category":"treatment","tier":"restated secondary","genes":[],"diseases":["AML"],"text":"For patients with refractory or relapsed AML who are candidates for intensive therapy, intermediate-dose cytarabine with or without an anthracycline is a common salvage regimen."},{"id":"d-hner-2022-blood-140-1345-C0105","paper":"d-hner-2022-blood-140-1345","category":"treatment","tier":"restated secondary","genes":[],"diseases":["AML"],"text":"For patients with refractory or relapsed AML who are candidates for intensive therapy, FLAG-IDA is a common intensive salvage regimen."},{"id":"d-hner-2022-blood-140-1345-C0106","paper":"d-hner-2022-blood-140-1345","category":"treatment","tier":"restated secondary","genes":[],"diseases":["AML"],"text":"For patients with refractory or relapsed AML who are candidates for intensive therapy, mitoxantrone-etoposide-cytarabine (MEC) is a common intensive salvage regimen."},{"id":"d-hner-2022-blood-140-1345-C0107","paper":"d-hner-2022-blood-140-1345","category":"treatment","tier":"restated secondary","genes":[],"diseases":["AML"],"text":"For patients with refractory or relapsed AML who are candidates for intensive therapy, CLAG-M is a common intensive salvage regimen."},{"id":"d-hner-2022-blood-140-1345-C0108","paper":"d-hner-2022-blood-140-1345","category":"treatment","tier":"univariable or descriptive","genes":[],"diseases":["AML"],"text":"For AML not responding to a first cycle of 7+3 induction, a regimen containing higher doses of cytarabine is generally considered the preferred re-induction option."},{"id":"d-hner-2022-blood-140-1345-C0109","paper":"d-hner-2022-blood-140-1345","category":"treatment","tier":"guideline criterion","genes":[],"diseases":["AML"],"text":"Single-agent intermediate-dose cytarabine should not be used for AML relapsing within 6 months after prior consolidation with higher-dose cytarabine."},{"id":"d-hner-2022-blood-140-1345-C0110","paper":"d-hner-2022-blood-140-1345","category":"treatment","tier":"restated secondary","genes":[],"diseases":["AML"],"text":"Although glasdegib plus low-dose cytarabine improved survival versus low-dose cytarabine alone, its relatively low CR/CRi rate of 24% does not favor its use as an alternative nonintensive AML option."},{"id":"d-hner-2022-blood-140-1345-C0111","paper":"d-hner-2022-blood-140-1345","category":"treatment","tier":"restated secondary","genes":["CD33"],"diseases":["AML"],"text":"For CD33-positive AML, frontline gemtuzumab ozogamicin is an option particularly in favorable or intermediate cytogenetic-risk disease; randomized evidence in patients aged 50-70 with de novo AML showed EFS benefit limited to those risk groups."},{"id":"d-hner-2022-blood-140-1345-C0112","paper":"d-hner-2022-blood-140-1345","category":"biomarker","tier":"guideline criterion","genes":["CBFB","MYH11","NPM1","RUNX1","RUNX1T1"],"diseases":["AML"],"text":"In acute myeloid leukemia (AML) with mutated NPM1, RUNX1::RUNX1T1, or CBFB::MYH11, baseline molecular assessment by qPCR or dPCR is recommended to facilitate MRD monitoring after treatment."},{"id":"d-hner-2022-blood-140-1345-C0115","paper":"d-hner-2022-blood-140-1345","category":"biomarker","tier":"guideline criterion","genes":["ANKRD26","BCORL1","BRAF","CBL","CSF3R","DNMT3A","ETV6","GATA2","JAK2","KIT","KRAS","NF1","NRAS","PHF6","PPM1D","PTPN11","RAD21","SETBP1","TET2","WT1"],"diseases":["AML"],"text":"In acute myeloid leukemia (AML), ANKRD26, BCORL1, BRAF, CBL, CSF3R, DNMT3A, ETV6, GATA2, JAK2, KIT, KRAS, NRAS, NF1, PHF6, PPM1D, PTPN11, RAD21, SETBP1, TET2, and WT1 are additional genes recommended for testing at diagnosis that may support subsequent investigational NGS-based disease monitoring; mutations consistent with clonal hematopoiesis are excluded from that MRD role."},{"id":"d-hner-2022-blood-140-1345-C0116","paper":"d-hner-2022-blood-140-1345","category":"biomarker","tier":"univariable or descriptive","genes":["CBFB","MYH11","NPM1","RUNX1","RUNX1T1"],"diseases":["AML"],"text":"In acute myeloid leukemia (AML), molecular MRD monitoring by RT-qPCR has robust validation for NPM1, CBFB::MYH11, and RUNX1::RUNX1T1."},{"id":"d-hner-2022-blood-140-1345-C0117","paper":"d-hner-2022-blood-140-1345","category":"biomarker","tier":"univariable or descriptive","genes":["ABL1","BCR","DEK","KMT2A","MLLT3","NUP214","WT1"],"diseases":["AML"],"text":"In acute myeloid leukemia (AML), KMT2A::MLLT3, DEK::NUP214, BCR::ABL1, and WT1 are less-validated RT-qPCR targets for molecular MRD monitoring."},{"id":"d-hner-2022-blood-140-1345-C0118","paper":"d-hner-2022-blood-140-1345","category":"biomarker","tier":"guideline criterion","genes":["ASXL1","DNMT3A","TET2"],"diseases":["AML"],"text":"In acute myeloid leukemia (AML), DNMT3A, TET2, and ASXL1 mutations consistent with premalignant clonal hematopoiesis should be excluded from NGS-based MRD interpretation."},{"id":"d-hner-2022-blood-140-1345-C0119","paper":"d-hner-2022-blood-140-1345","category":"biomarker","tier":"univariable or descriptive","genes":["NPM1"],"diseases":["AML"],"text":"In NPM1-mutated AML, molecular MRD by qPCR/dPCR/NGS is assessed at diagnosis, after two cycles, at end of treatment, and during follow-up; molecular MRD at least 2% or failure to reduce transcript levels by 3-4 logs after consolidation may be used as a clinically relevant biomarker prompting consideration of treatment modification. For less-intensive therapy, assessment time points and treatment-decision thresholds were not yet established."},{"id":"d-hner-2022-blood-140-1345-C0120","paper":"d-hner-2022-blood-140-1345","category":"biomarker","tier":"univariable or descriptive","genes":["CBFB","MYH11","RUNX1","RUNX1T1"],"diseases":["AML"],"text":"In core-binding-factor acute myeloid leukemia (AML), qPCR MRD using RUNX1::RUNX1T1 or CBFB::MYH11 is assessed during therapy and follow-up; molecular MRD at least 2% or failure to reduce transcript levels by 3 to 4 logs after consolidation may prompt treatment modification, while assessment time points and treatment-decision thresholds for less-intensive therapy were not yet established."},{"id":"d-hner-2022-blood-140-1345-C0121","paper":"d-hner-2022-blood-140-1345","category":"biomarker","tier":"guideline criterion","genes":["CBFB","MYH11","NPM1","RUNX1","RUNX1T1"],"diseases":["AML"],"text":"In acute myeloid leukemia (AML), molecular MRD relapse assessed by real-time qPCR should be based on NPM1, RUNX1::RUNX1T1, or CBFB::MYH11 and is defined by conversion from MRD negative to positive or, for persistent low-level positivity, at least a 1-log10 increase between two positive qPCR samples, with rapid confirmation in a second sample from the same tissue source."},{"id":"d-hner-2022-blood-140-1345-C0122","paper":"d-hner-2022-blood-140-1345","category":"biomarker","tier":"guideline criterion","genes":["IDH1"],"diseases":["AML"],"text":"Rapid IDH1 mutation screening at initial diagnosis is recommended in older AML patients to identify those suitable for ivosidenib-based therapy."},{"id":"d-hner-2022-blood-140-1345-C0123","paper":"d-hner-2022-blood-140-1345","category":"biomarker","tier":"guideline criterion","genes":["FLT3","IDH1","IDH2"],"diseases":["AML"],"text":"In relapsed acute myeloid leukemia (AML), molecular re-evaluation for emergent or expanded IDH1, IDH2, and FLT3 abnormalities is important to identify patients who may be eligible for targeted salvage therapy."},{"id":"d-hner-2022-blood-140-1345-C0124","paper":"d-hner-2022-blood-140-1345","category":"biomarker","tier":"restated secondary","genes":["CEBPA"],"diseases":["AML"],"text":"In germline CEBPA-mutation carriers, an acquired CEBPA mutation can serve as a molecular marker of AML; distinct acquired mutations may re-emerge with independent primary AMLs rather than relapse."},{"id":"d-hner-2022-blood-140-1345-C0125","paper":"d-hner-2022-blood-140-1345","category":"biomarker","tier":"guideline criterion","genes":["FLT3"],"diseases":["AML"],"text":"In acute myeloid leukemia (AML), fLT3 mutation testing should assess both ITD and TKD mutations; because longer FLT3-ITDs may be missed by NGS, continued capillary-electrophoresis testing is recommended."},{"id":"d-hner-2022-blood-140-1345-C0126","paper":"d-hner-2022-blood-140-1345","category":"biomarker","tier":"guideline criterion","genes":["ABL1","BCR","CBFB","DEK","KMT2A","MLLT3","MYH11","NPM1","NUP214","RUNX1","RUNX1T1","WT1"],"diseases":["AML"],"text":"For ABL1, BCR, CBFB, DEK, KMT2A, MLLT3, MYH11, NUP214, RUNX1, RUNX1T1, WT1, in acute myeloid leukemia (AML), for qPCR/dPCR molecular MRD targets including NPM1 and recurrent fusion transcripts, the assay should reach a limit of detection of at least 10^-3; blood or marrow may be used, but peripheral-blood sensitivity is generally about one order of magnitude lower than marrow."},{"id":"d-hner-2022-blood-140-1345-C0127","paper":"d-hner-2022-blood-140-1345","category":"biomarker","tier":"univariable or descriptive","genes":["ASXL1","BCOR","CEBPA","DDX41","EZH2","FLT3","IDH1","IDH2","NPM1","RUNX1","SF3B1","SRSF2","STAG2","TP53","U2AF1","ZRSR2"],"diseases":["AML"],"text":"In acute myeloid leukemia (AML), diagnostic mutation testing should include FLT3, IDH1, IDH2, NPM1, CEBPA, DDX41, TP53, ASXL1, BCOR, EZH2, RUNX1, SF3B1, SRSF2, STAG2, U2AF1, and ZRSR2 because these results are required for diagnosis and/or identification of actionable therapeutic targets."},{"id":"d-hner-2022-blood-140-1345-C0128","paper":"d-hner-2022-blood-140-1345","category":"biomarker","tier":"guideline criterion","genes":["ABL1","BCR","CBFB","KMT2A","MYH11","PML","RARA","RUNX1","RUNX1T1"],"diseases":["AML"],"text":"In acute myeloid leukemia (AML), screening for PML::RARA, CBFB::MYH11, RUNX1::RUNX1T1, KMT2A rearrangements, and BCR::ABL1 is recommended when rapid information is needed for suitable therapy, chromosome morphology is poor, or typical morphology is present without the suspected cytogenetic abnormality."},{"id":"d-hner-2022-blood-140-1345-C0129","paper":"d-hner-2022-blood-140-1345","category":"biomarker","tier":"guideline criterion","genes":["CEBPA"],"diseases":["AML"],"text":"In acute myeloid leukemia (AML), cEBPA mutation reports should specify the mutation type because only in-frame bZIP-region mutations, whether monoallelic or biallelic, are associated with favorable outcome."},{"id":"d-hner-2022-blood-140-1345-C0130","paper":"d-hner-2022-blood-140-1345","category":"biomarker","tier":"univariable or descriptive","genes":["ABL1","BCR","CBFB","DEK","KMT2A","MLLT3","MYH11","NPM1","NUP214","RUNX1","RUNX1T1","WT1"],"diseases":["AML"],"text":"For the listed AML RT-qPCR molecular targets—ABL1, BCR, CBFB, DEK, KMT2A, MLLT3, MYH11, NPM1, NUP214, RUNX1, RUNX1T1, and WT1—MRD positivity is defined as cycle threshold below 40 and negativity as cycle threshold at least 40 in at least 2 of 3 replicates."},{"id":"d-hner-2022-blood-140-1345-C0131","paper":"d-hner-2022-blood-140-1345","category":"biomarker","tier":"guideline criterion","genes":["CLEC12A","IL3RA","PTPRC"],"diseases":["AML"],"text":"In acute myeloid leukemia (AML), residual leukemic stem cells may be immunophenotypically defined using aberrant PTPRC (CD45RA), CLEC12A (CLL-1), or IL3RA (CD123) on CD34-positive/CD38-low cells; LSC-MRD assessment remains investigational and is recommended for evaluation in clinical studies."},{"id":"d-hner-2022-blood-140-1345-C0132","paper":"d-hner-2022-blood-140-1345","category":"biomarker","tier":"guideline criterion","genes":["CBFB","MYH11","NPM1","RUNX1","RUNX1T1"],"diseases":["AML"],"text":"In acute myeloid leukemia (AML), CR/CRh/CRi with low-level molecular MRD below 2% for NPM1, RUNX1::RUNX1T1, or CBFB::MYH11 is designated MRD negative and included in the response-without-MRD category."},{"id":"d-hner-2022-blood-140-1345-C0133","paper":"d-hner-2022-blood-140-1345","category":"biomarker","tier":"guideline criterion","genes":["ABL1","BCR","CBFB","DEK","KMT2A","MLLT3","MYH11","NPM1","NUP214","RUNX1","RUNX1T1","WT1"],"diseases":["AML"],"text":"For response without molecular MRD assessed using the listed AML RT-qPCR targets—ABL1, BCR, CBFB, DEK, KMT2A, MLLT3, MYH11, NPM1, NUP214, RUNX1, RUNX1T1, and WT1—the response should be confirmed by a subsequent MRD assessment at least 4 weeks apart."},{"id":"d-hner-2022-blood-140-1345-C0134","paper":"d-hner-2022-blood-140-1345","category":"germline","tier":"guideline criterion","genes":["DDX41"],"diseases":[],"text":"Germline predisposition should be considered regardless of age because DDX41 predisposition alleles can drive hematopoietic malignancy at older ages."},{"id":"d-hner-2022-blood-140-1345-C0135","paper":"d-hner-2022-blood-140-1345","category":"germline","tier":"guideline criterion","genes":["CHEK2","DDX41"],"diseases":[],"text":"Certain alleles identified on tumor profiling, including CHEK2 I200T and truncating DDX41 variants, are overwhelmingly likely to be germline and should prompt consideration of germline testing even when identified once."},{"id":"d-hner-2022-blood-140-1345-C0137","paper":"d-hner-2022-blood-140-1345","category":"germline","tier":"univariable or descriptive","genes":["BRCA1","BRCA2","CHEK2","PALB2","TP53"],"diseases":[],"text":"Deleterious germline variants in BRCA1, BRCA2, PALB2, TP53, or CHEK2 are described in therapy-related acute myeloid leukemia as familial cancer-predisposition alleles relevant to screening, counseling, donor selection, surveillance, and cascade testing."},{"id":"d-hner-2022-blood-140-1345-C0138","paper":"d-hner-2022-blood-140-1345","category":"germline","tier":"restated secondary","genes":["CEBPA","DDX41"],"diseases":[],"text":"Table 2 identifies CEBPA and DDX41 as genes associated with germline predisposition due to pathogenic/likely pathogenic variants in CEBPA or DDX41, respectively."},{"id":"d-hner-2022-blood-140-1345-C0140","paper":"d-hner-2022-blood-140-1345","category":"germline","tier":"restated secondary","genes":["TP53"],"diseases":[],"text":"Table 2 identifies TP53 as a gene associated with Li-Fraumeni syndrome."},{"id":"d-hner-2022-blood-140-1345-C0141","paper":"d-hner-2022-blood-140-1345","category":"germline","tier":"restated secondary","genes":["RUNX1"],"diseases":[],"text":"Table 2 identifies RUNX1 as a gene associated with germline predisposition due to RUNX1 pathogenic/likely pathogenic variants, with lifelong thrombocytopenia/qualitative platelet defects."},{"id":"d-hner-2022-blood-140-1345-C0142","paper":"d-hner-2022-blood-140-1345","category":"germline","tier":"restated secondary","genes":["ANKRD26","ETV6"],"diseases":[],"text":"Table 2 identifies ANKRD26 and ETV6 as genes associated with germline predisposition due to pathogenic/likely pathogenic variants in ANKRD26 or ETV6, respectively, with lifelong thrombocytopenia."},{"id":"d-hner-2022-blood-140-1345-C0144","paper":"d-hner-2022-blood-140-1345","category":"germline","tier":"restated secondary","genes":["GATA2"],"diseases":[],"text":"Table 2 identifies GATA2 as a gene associated with germline predisposition due to GATA2 pathogenic/likely pathogenic variants, associated with immunodeficiency and other phenotypes."},{"id":"d-hner-2022-blood-140-1345-C0145","paper":"d-hner-2022-blood-140-1345","category":"germline","tier":"restated secondary","genes":["ELANE","HAX1"],"diseases":[],"text":"ELANE and HAX1 are listed in Table 2 among genes associated with severe congenital neutropenia and myeloid-neoplasm predisposition."},{"id":"d-hner-2022-blood-140-1345-C0146","paper":"d-hner-2022-blood-140-1345","category":"germline","tier":"restated secondary","genes":["DNAJC21","EFL1","SBDS","SRP54"],"diseases":[],"text":"SBDS, DNAJC21, EFL1, and SRP54 are listed in Table 2 as genes associated with Shwachman-Diamond syndrome and myeloid-neoplasm predisposition."},{"id":"d-hner-2022-blood-140-1345-C0147","paper":"d-hner-2022-blood-140-1345","category":"germline","tier":"restated secondary","genes":["ACD","APOLLO","CTC1","DKC1","MDM4","NHP2","NOP10","NPM1","PARN","RPA1","RTEL1","TERC","TERT","TINF2","WRAP53"],"diseases":[],"text":"ACD, CTC1, DKC1, MDM4, RTEL1, TERC, TERT, TINF2, NHP2, NOP10, NPM1, PARN, WRAP53, RPA1, and APOLLO are listed in Table 2 as genes associated with telomere biology disorders/short telomere syndromes and myeloid-neoplasm predisposition."},{"id":"d-hner-2022-blood-140-1345-C0148","paper":"d-hner-2022-blood-140-1345","category":"germline","tier":"restated secondary","genes":["CBL"],"diseases":[],"text":"Table 2 identifies CBL as a gene associated with CBL syndrome with myeloid-neoplasm predisposition."},{"id":"d-hner-2022-blood-140-1345-C0149","paper":"d-hner-2022-blood-140-1345","category":"germline","tier":"restated secondary","genes":["KRAS","NRAS","PTPN11"],"diseases":[],"text":"PTPN11, NRAS, and KRAS are listed in Table 2 as genes associated with Noonan syndrome and myeloid-neoplasm predisposition."},{"id":"d-hner-2022-blood-140-1345-C0150","paper":"d-hner-2022-blood-140-1345","category":"germline","tier":"restated secondary","genes":["NF1"],"diseases":[],"text":"Table 2 identifies NF1 as a gene associated with neurofibromatosis type I with myeloid-neoplasm predisposition."},{"id":"d-hner-2022-blood-140-1345-C0151","paper":"d-hner-2022-blood-140-1345","category":"germline","tier":"restated secondary","genes":["SAMD9"],"diseases":[],"text":"Table 2 identifies SAMD9 as a gene associated with germline predisposition due to SAMD9 pathogenic/likely pathogenic variants, including MIRAGE syndrome/monosomy 7 MDS presentations."},{"id":"d-hner-2022-blood-140-1345-C0152","paper":"d-hner-2022-blood-140-1345","category":"germline","tier":"restated secondary","genes":["SAMD9L"],"diseases":[],"text":"Table 2 identifies SAMD9L as a gene associated with germline predisposition due to SAMD9L pathogenic/likely pathogenic variants, including ataxia-pancytopenia/monosomy 7 MDS presentations."},{"id":"d-hner-2022-blood-140-1345-C0153","paper":"d-hner-2022-blood-140-1345","category":"germline","tier":"restated secondary","genes":["BLM"],"diseases":[],"text":"Table 2 identifies BLM as a gene associated with Bloom syndrome with myeloid-neoplasm predisposition."},{"id":"d-hner-2022-blood-140-1345-C0154","paper":"d-hner-2022-blood-140-1345","category":"germline","tier":"restated secondary","genes":["CHEK2","MPL","RECQL4"],"diseases":[],"text":"Table 2 identifies CHEK2, MPL, and RECQL4 as genes associated with germline predisposition due to pathogenic/likely pathogenic variants in CHEK2, MPL, or RECQL4, respectively."},{"id":"d-hner-2022-blood-140-1345-C0157","paper":"d-hner-2022-blood-140-1345","category":"germline","tier":"restated secondary","genes":["BRCA1","BRCA2"],"diseases":[],"text":"BRCA1 and BRCA2 are listed in Table 2 as genes associated with hereditary breast and ovarian cancer syndrome with myeloid-neoplasm predisposition."},{"id":"d-hner-2022-blood-140-1345-C0158","paper":"d-hner-2022-blood-140-1345","category":"germline","tier":"restated secondary","genes":["MLH1","MSH2","MSH6","PMS2"],"diseases":[],"text":"MLH1, MSH2, MSH6, and PMS2 are listed in Table 2 as genes associated with Lynch syndrome with myeloid-neoplasm predisposition."},{"id":"d-hner-2022-blood-140-1345-C0159","paper":"d-hner-2022-blood-140-1345","category":"germline","tier":"restated secondary","genes":["NBN"],"diseases":[],"text":"Table 2 identifies NBN as a gene associated with Nijmegen breakage syndrome with myeloid-neoplasm predisposition."},{"id":"d-hner-2022-blood-140-1345-C0160","paper":"d-hner-2022-blood-140-1345","category":"germline","tier":"restated secondary","genes":["WAS"],"diseases":[],"text":"Table 2 identifies WAS as a gene associated with Wiskott-Aldrich syndrome with myeloid-neoplasm predisposition."},{"id":"d-hner-2022-blood-140-1345-C0163","paper":"d-hner-2022-blood-140-1345","category":"germline","tier":"restated secondary","genes":["JAK2"],"diseases":[],"text":"Table 2 identifies JAK2 as a gene associated with germline predisposition due to JAK2 pathogenic/likely pathogenic variants, associated with thrombocythemia; Table 2 lists this among emerging disorders based on limited published cases."},{"id":"d-hner-2022-blood-140-1345-C0165","paper":"d-hner-2022-blood-140-1345","category":"germline","tier":"restated secondary","genes":["MECOM"],"diseases":[],"text":"Table 2 identifies MECOM as a gene associated with germline predisposition due to MECOM/EVI1 pathogenic/likely pathogenic variants, associated with radioulnar synostosis/other congenital abnormalities; Table 2 lists this among emerging disorders based on limited published cases."},{"id":"d-hner-2022-blood-140-1345-C0166","paper":"d-hner-2022-blood-140-1345","category":"germline","tier":"restated secondary","genes":["NPM1"],"diseases":[],"text":"Table 2 identifies NPM1 as a gene associated with germline predisposition due to NPM1 pathogenic/likely pathogenic variants, associated with bone-marrow failure and B-cell deficiency; Table 2 lists this among emerging disorders based on limited published cases."},{"id":"d-hner-2022-blood-140-1345-C0170","paper":"d-hner-2022-blood-140-1345","category":"germline","tier":"restated secondary","genes":["CEBPA"],"diseases":[],"text":"Germline 5-prime CEBPA mutations have penetrance close to 100%, whereas germline 3-prime CEBPA mutations have lower penetrance; this distinction is clinically relevant to inherited CEBPA predisposition."},{"id":"d-hner-2022-blood-140-1345-C0171","paper":"d-hner-2022-blood-140-1345","category":"germline","tier":"univariable or descriptive","genes":["BCOR","RUNX1"],"diseases":[],"text":"In germline RUNX1 predisposition, about 30% of patients have clonal hematopoiesis before leukemia development, with BCOR mutations predominating in that clonal hematopoiesis."},{"id":"d-hner-2022-blood-140-1345-C0172","paper":"d-hner-2022-blood-140-1345","category":"germline","tier":"univariable or descriptive","genes":["ANKRD26","ETV6","RUNX1"],"diseases":[],"text":"Among the RUNX1, ANKRD26, and ETV6 platelet-disorder predisposition syndromes, germline ANKRD26 mutation carriers generally have the lowest platelet counts."},{"id":"d-hner-2022-blood-140-1345-C0173","paper":"d-hner-2022-blood-140-1345","category":"germline","tier":"univariable or descriptive","genes":["ETV6"],"diseases":[],"text":"Germline ETV6 mutations predispose to B-cell ALL and myeloid malignancies."},{"id":"d-hner-2022-blood-140-1345-C0174","paper":"d-hner-2022-blood-140-1345","category":"germline","tier":"univariable or descriptive","genes":["RUNX1"],"diseases":[],"text":"Germline RUNX1 mutations predispose to myeloid malignancies, T-cell ALL, and B-cell malignancies."},{"id":"d-hner-2022-blood-140-1345-C0175","paper":"d-hner-2022-blood-140-1345","category":"germline","tier":"restated secondary","genes":["ANKRD26"],"diseases":[],"text":"Germline ANKRD26 mutations have been associated only with myeloid malignancies to date."},{"id":"d-hner-2022-blood-140-1345-C0176","paper":"d-hner-2022-blood-140-1345","category":"germline","tier":"univariable or descriptive","genes":["ASXL1","FLT3","GATA2","PHF6","RUNX1","SRSF2","WT1"],"diseases":[],"text":"When leukemia develops in germline RUNX1 predisposition, somatic mutation of the wild-type RUNX1 allele is common, together with acquired mutations in ASXL1, FLT3, GATA2, PHF6, SRSF2, and WT1."},{"id":"d-hner-2022-blood-140-1345-C0177","paper":"d-hner-2022-blood-140-1345","category":"germline","tier":"univariable or descriptive","genes":["DDX41"],"diseases":[],"text":"For DDX41 germline predisposition, the DDX41 R525H hotspot occurs commonly in myeloid malignancies as a somatic mutation."},{"id":"d-hner-2022-blood-140-1345-C0178","paper":"d-hner-2022-blood-140-1345","category":"germline","tier":"univariable or descriptive","genes":["CEBPA"],"diseases":[],"text":"In germline CEBPA predisposition, second-allele CEBPA mutations are common and typically occur at the 3-prime end."},{"id":"d-hner-2024-blood-144-2169-C0001","paper":"d-hner-2024-blood-144-2169","category":"prognosis","tier":"guideline criterion","genes":["NPM1","FLT3","NRAS","KRAS","TP53"],"diseases":["AML"],"text":"Under the 2024 ELN Less-Intensive classification, NPM1-mutated AML is favorable risk when FLT3-ITD is negative and NRAS, KRAS, and TP53 are wild type."},{"id":"d-hner-2024-blood-144-2169-C0002","paper":"d-hner-2024-blood-144-2169","category":"prognosis","tier":"guideline criterion","genes":["IDH2","FLT3","NRAS","KRAS","TP53"],"diseases":["AML"],"text":"Under the 2024 ELN Less-Intensive classification, IDH2-mutated AML is favorable risk when FLT3-ITD is negative and NRAS, KRAS, and TP53 are wild type."},{"id":"d-hner-2024-blood-144-2169-C0003","paper":"d-hner-2024-blood-144-2169","category":"prognosis","tier":"guideline criterion","genes":["IDH1","TP53"],"diseases":["AML"],"text":"Under the 2024 ELN Less-Intensive classification, TP53-wild-type IDH1-mutated AML is favorable risk specifically with azacitidine plus ivosidenib; this favorable assignment applies irrespective of activating signaling-gene mutations."},{"id":"d-hner-2024-blood-144-2169-C0004","paper":"d-hner-2024-blood-144-2169","category":"prognosis","tier":"guideline criterion","genes":["DDX41"],"diseases":["AML"],"text":"Under the 2024 ELN Less-Intensive classification, DDX41-mutated AML is favorable risk."},{"id":"d-hner-2024-blood-144-2169-C0005","paper":"d-hner-2024-blood-144-2169","category":"prognosis","tier":"guideline criterion","genes":["FLT3","NRAS","KRAS","TP53"],"diseases":["AML"],"text":"For other cytogenetic and/or molecular abnormalities, the 2024 ELN Less-Intensive classification tentatively assigns favorable risk when FLT3-ITD is negative and NRAS, KRAS, and TP53 are wild type; data are unavailable for many such abnormalities."},{"id":"d-hner-2024-blood-144-2169-C0006","paper":"d-hner-2024-blood-144-2169","category":"prognosis","tier":"guideline criterion","genes":["FLT3","NRAS","KRAS","TP53"],"diseases":["AML"],"text":"For other cytogenetic and molecular abnormalities, the 2024 ELN Less-Intensive classification tentatively assigns intermediate risk when FLT3-ITD and/or NRAS/KRAS mutation is present and TP53 is wild type; data are unavailable for many such abnormalities."},{"id":"d-hner-2024-blood-144-2169-C0007","paper":"d-hner-2024-blood-144-2169","category":"prognosis","tier":"guideline criterion","genes":["TP53"],"diseases":["AML"],"text":"Under the 2024 ELN Less-Intensive classification, TP53-mutated AML is adverse risk."},{"id":"d-hner-2024-blood-144-2169-C0008","paper":"d-hner-2024-blood-144-2169","category":"germline","tier":"guideline criterion","genes":["DDX41"],"diseases":[],"text":"A DDX41 mutation at near-heterozygous frequency should prompt consideration of a germline DDX41 mutation."},{"id":"d-hner-2024-blood-144-2169-C0009","paper":"d-hner-2024-blood-144-2169","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["AML"],"text":"Do not apply the 2024 ELN Less-Intensive classification to AML patients who have received prior HMA treatment."},{"id":"d-hner-2024-blood-144-2169-C0010","paper":"d-hner-2024-blood-144-2169","category":"prognosis","tier":"restated secondary","genes":["NPM1","FLT3","KRAS","NRAS"],"diseases":["AML"],"text":"In NPM1-mutated AML treated with HMA/VEN, co-occurring FLT3-ITD, KRAS, or NRAS mutations are associated with inferior prognosis; median OS was 39 months without these signaling mutations versus 9.9 months when one or more were present."},{"id":"d-hner-2024-blood-144-2169-C0011","paper":"d-hner-2024-blood-144-2169","category":"prognosis","tier":"restated secondary","genes":["IDH2","FLT3","KRAS","NRAS"],"diseases":["AML"],"text":"In IDH2-mutated AML treated with HMA/VEN, co-occurring activated signaling mutations are associated with inferior prognosis; median OS was 36.9 months without versus 12.2 months with an activated kinase pathogenic variant."},{"id":"d-hner-2024-blood-144-2169-C0012","paper":"d-hner-2024-blood-144-2169","category":"treatment","tier":"restated secondary","genes":["IDH1"],"diseases":["AML"],"text":"Azacitidine plus ivosidenib is a treatment standard for IDH1-mutated AML and improved overall survival versus azacitidine/placebo (24.0 vs 7.9 months) in the cited randomized phase 3 study."},{"id":"dinardo-2020-genotype-specific-venetoclax-C0001","paper":"dinardo-2020-genotype-specific-venetoclax","category":"treatment","tier":"restated secondary","genes":["SRSF2"],"diseases":["AML"],"text":"In relapsed or refractory AML treated with venetoclax monotherapy, SRSF2 mutation was associated with blast reduction."},{"id":"dinardo-2020-genotype-specific-venetoclax-C0002","paper":"dinardo-2020-genotype-specific-venetoclax","category":"treatment","tier":"restated secondary","genes":["ZRSR2"],"diseases":["AML"],"text":"In relapsed or refractory AML treated with venetoclax monotherapy, ZRSR2 mutation was associated with blast reduction."},{"id":"dinardo-2020-genotype-specific-venetoclax-C0003","paper":"dinardo-2020-genotype-specific-venetoclax","category":"treatment","tier":"restated secondary","genes":["IDH1"],"diseases":["AML"],"text":"In relapsed or refractory AML treated with venetoclax monotherapy, IDH1 mutation was associated with blast reduction."},{"id":"dinardo-2020-genotype-specific-venetoclax-C0004","paper":"dinardo-2020-genotype-specific-venetoclax","category":"treatment","tier":"restated secondary","genes":["IDH2"],"diseases":["AML"],"text":"In relapsed or refractory AML treated with venetoclax monotherapy, IDH2 mutation was associated with blast reduction."},{"id":"dinardo-2020-genotype-specific-venetoclax-C0005","paper":"dinardo-2020-genotype-specific-venetoclax","category":"treatment","tier":"restated secondary","genes":["FLT3"],"diseases":["AML"],"text":"In relapsed or refractory AML treated with venetoclax monotherapy, FLT3-ITD was linked to primary and adaptive resistance."},{"id":"dinardo-2020-genotype-specific-venetoclax-C0006","paper":"dinardo-2020-genotype-specific-venetoclax","category":"treatment","tier":"restated secondary","genes":["PTPN11"],"diseases":["AML"],"text":"In relapsed or refractory AML treated with venetoclax monotherapy, PTPN11 variants were linked to primary and adaptive resistance."},{"id":"dinardo-2020-genotype-specific-venetoclax-C0007","paper":"dinardo-2020-genotype-specific-venetoclax","category":"treatment","tier":"univariable or descriptive","genes":["NPM1"],"diseases":["AML"],"text":"In this cohort of older AML treated with venetoclax combinations, NPM1-mutated AML was among the genotypes with CR/CRi rates exceeding 80%."},{"id":"dinardo-2020-genotype-specific-venetoclax-C0008","paper":"dinardo-2020-genotype-specific-venetoclax","category":"treatment","tier":"univariable or descriptive","genes":["IDH1"],"diseases":["AML"],"text":"In this cohort of older AML treated with venetoclax combinations, IDH1-mutated AML was among the genotypes with CR/CRi rates exceeding 80%."},{"id":"dinardo-2020-genotype-specific-venetoclax-C0009","paper":"dinardo-2020-genotype-specific-venetoclax","category":"treatment","tier":"univariable or descriptive","genes":["IDH2"],"diseases":["AML"],"text":"In this cohort of older AML treated with venetoclax combinations, IDH2-mutated AML was among the genotypes with CR/CRi rates exceeding 80%."},{"id":"dinardo-2020-genotype-specific-venetoclax-C0010","paper":"dinardo-2020-genotype-specific-venetoclax","category":"treatment","tier":"univariable or descriptive","genes":["DNMT3A"],"diseases":["AML"],"text":"In this cohort of older AML treated with venetoclax combinations, DNMT3A-mutated AML was among the genotypes with CR/CRi rates exceeding 80%."},{"id":"dinardo-2020-genotype-specific-venetoclax-C0011","paper":"dinardo-2020-genotype-specific-venetoclax","category":"prognosis","tier":"univariable or descriptive","genes":["NPM1"],"diseases":["AML"],"text":"In older AML treated with venetoclax combinations, NPM1 mutation was associated with durable remission and prolonged overall survival; median OS was not reached and 2-year OS was 71.8%."},{"id":"dinardo-2020-genotype-specific-venetoclax-C0012","paper":"dinardo-2020-genotype-specific-venetoclax","category":"prognosis","tier":"univariable or descriptive","genes":["IDH2"],"diseases":["AML"],"text":"In older AML treated with venetoclax combinations, IDH2 mutation was associated with durable remission and prolonged overall survival; median OS was not reached and 2-year OS was 79.5%."},{"id":"dinardo-2020-genotype-specific-venetoclax-C0013","paper":"dinardo-2020-genotype-specific-venetoclax","category":"prognosis","tier":"univariable or descriptive","genes":["IDH1"],"diseases":["AML"],"text":"In this venetoclax-treated AML cohort, IDH1 mutation was not associated with significantly different overall survival from IDH1-wild-type AML (median 18.3 vs 12.7 months; P=.79)."},{"id":"dinardo-2020-genotype-specific-venetoclax-C0014","paper":"dinardo-2020-genotype-specific-venetoclax","category":"biomarker","tier":"univariable or descriptive","genes":["NPM1"],"diseases":["AML"],"text":"Among four assessed durable responders with NPM1-mutated AML receiving venetoclax combinations, NPM1 MRD became undetectable by sensitive RT-qPCR and remained undetectable for at least 24 months."},{"id":"dinardo-2020-genotype-specific-venetoclax-C0015","paper":"dinardo-2020-genotype-specific-venetoclax","category":"biomarker","tier":"univariable or descriptive","genes":["IDH2"],"diseases":["AML"],"text":"In older/unfit AML treated with frontline venetoclax combinations, IDH2 mutations can remain detectable during durable clinical remission."},{"id":"dinardo-2020-genotype-specific-venetoclax-C0016","paper":"dinardo-2020-genotype-specific-venetoclax","category":"treatment","tier":"univariable or descriptive","genes":["FLT3"],"diseases":["AML"],"text":"In AML treated with venetoclax combinations, adaptive resistance was associated with FLT3-ITD clonal expansion or acquisition at relapse; this occurred within 1-6 months of initial remission in five cases, despite initial responses being comparable to the overall cohort."},{"id":"dinardo-2020-genotype-specific-venetoclax-C0018","paper":"dinardo-2020-genotype-specific-venetoclax","category":"treatment","tier":"univariable or descriptive","genes":["TP53"],"diseases":["AML"],"text":"Biallelic TP53 disruption was strongly associated with primary or adaptive resistance to venetoclax combined with a DNMT inhibitor or cytarabine, whereas a monoallelic TP53 mutation or del(17p) did not by itself preclude an initial remission."},{"id":"dinardo-2020-genotype-specific-venetoclax-C0019","paper":"dinardo-2020-genotype-specific-venetoclax","category":"treatment","tier":"univariable or descriptive","genes":["RUNX1"],"diseases":["AML"],"text":"RUNX1 mutations were frequent in primary refractory AML, but RUNX1-mutated cases also occurred among long remissions; the study therefore did not establish RUNX1 mutation as a driver of venetoclax resistance."},{"id":"dinardo-2020-genotype-specific-venetoclax-C0020","paper":"dinardo-2020-genotype-specific-venetoclax","category":"biomarker","tier":"univariable or descriptive","genes":["NPM1"],"diseases":["AML"],"text":"In one morphologically refractory NPM1-mutated AML case treated with venetoclax-azacitidine, NPM1 RT-qPCR fell from 100% to 7.3% during cycle 1 despite no blast response, demonstrating that molecular and morphologic response can be discordant."},{"id":"dinardo-2020-genotype-specific-venetoclax-C0021","paper":"dinardo-2020-genotype-specific-venetoclax","category":"biomarker","tier":"univariable or descriptive","genes":["TP53"],"diseases":["AML"],"text":"For AML receiving venetoclax-based therapy, the authors recommend assessing TP53 genetic integrity at diagnosis and again in remission to identify patients likely to develop treatment resistance."},{"id":"dinardo-2020-genotype-specific-venetoclax-C0022","paper":"dinardo-2020-genotype-specific-venetoclax","category":"treatment","tier":"univariable or descriptive","genes":["NPM1"],"diseases":["AML"],"text":"For elderly NPM1-mutated AML, the study's >70% 2-year overall survival with venetoclax plus a DNMT inhibitor or LDAC led the authors to suggest venetoclax as a preferred therapeutic option for this subgroup."},{"id":"dinardo-2020-genotype-specific-venetoclax-C0023","paper":"dinardo-2020-genotype-specific-venetoclax","category":"treatment","tier":"univariable or descriptive","genes":["IDH1","IDH2"],"diseases":["AML"],"text":"For IDH1- or IDH2-mutated AML responding to venetoclax combinations, persistent IDH-mutant clones led the authors to suggest postremission IDH-inhibitor maintenance approaches aimed at eradicating residual molecular disease."},{"id":"dinardo-2020-genotype-specific-venetoclax-C0024","paper":"dinardo-2020-genotype-specific-venetoclax","category":"treatment","tier":"univariable or descriptive","genes":["FLT3"],"diseases":["AML"],"text":"For FLT3-ITD-mutated AML treated with venetoclax-based therapy, the authors suggest adding a targeted FLT3 inhibitor to help prevent relapse."},{"id":"dinardo-2020-genotype-specific-venetoclax-C0025","paper":"dinardo-2020-genotype-specific-venetoclax","category":"treatment","tier":"restated secondary","genes":["FLT3"],"diseases":["AML"],"text":"Emergent FLT3-TKD is stated to predict resistance to type 2 FLT3 inhibitors such as sorafenib or quizartinib."},{"id":"dinardo-2020-genotype-specific-venetoclax-C0026","paper":"dinardo-2020-genotype-specific-venetoclax","category":"treatment","tier":"restated secondary","genes":["FLT3"],"diseases":["AML"],"text":"Emergent FLT3 N676K is stated to confer resistance to midostaurin."},{"id":"dohner-2020-npm1-flt3-interaction-C0001","paper":"dohner-2020-npm1-flt3-interaction","category":"prognosis","tier":"restated secondary","genes":["NPM1","FLT3"],"diseases":["AML"],"text":"Under the 2017 ELN categorization used in this analysis, NPM1-mutated AML with low FLT3-ITD allelic ratio (>0.05 to <0.5) is favorable risk."},{"id":"dohner-2020-npm1-flt3-interaction-C0002","paper":"dohner-2020-npm1-flt3-interaction","category":"prognosis","tier":"restated secondary","genes":["NPM1","FLT3","RUNX1","ASXL1","TP53"],"diseases":["AML"],"text":"Under the 2017 ELN categorization used in this analysis, NPM1-mutated AML with high FLT3-ITD allelic ratio (>=0.5) and without concurrent RUNX1, ASXL1, or TP53 high-risk mutations is intermediate risk."},{"id":"dohner-2020-npm1-flt3-interaction-C0003","paper":"dohner-2020-npm1-flt3-interaction","category":"prognosis","tier":"restated secondary","genes":["NPM1","FLT3","RUNX1","ASXL1","TP53"],"diseases":["AML"],"text":"Under the 2017 ELN categorization used in this analysis, NPM1-wild-type AML with low FLT3-ITD allelic ratio (>0.05 to <0.5), without RUNX1, ASXL1, or TP53 high-risk mutations and without adverse-risk cytogenetics, is intermediate risk."},{"id":"dohner-2020-npm1-flt3-interaction-C0004","paper":"dohner-2020-npm1-flt3-interaction","category":"prognosis","tier":"restated secondary","genes":["NPM1","FLT3"],"diseases":["AML"],"text":"Under the 2017 ELN categorization used in this analysis, NPM1-wild-type AML with high FLT3-ITD allelic ratio (>=0.5) is adverse risk."},{"id":"dohner-2020-npm1-flt3-interaction-C0005","paper":"dohner-2020-npm1-flt3-interaction","category":"prognosis","tier":"restated secondary","genes":["NPM1","FLT3","RUNX1","ASXL1","TP53"],"diseases":["AML"],"text":"Under the 2017 ELN categorization used in this analysis, NPM1-mutated AML with high FLT3-ITD allelic ratio (>=0.5) and a high-risk RUNX1, ASXL1, or TP53 mutation is adverse risk."},{"id":"dohner-2020-npm1-flt3-interaction-C0006","paper":"dohner-2020-npm1-flt3-interaction","category":"prognosis","tier":"restated secondary","genes":["NPM1","FLT3","RUNX1","ASXL1","TP53"],"diseases":["AML"],"text":"Under the 2017 ELN categorization used in this analysis, NPM1-wild-type AML with low FLT3-ITD allelic ratio (>0.05 to <0.5) and a high-risk RUNX1, ASXL1, or TP53 mutation and/or adverse-risk cytogenetics is adverse risk."},{"id":"dohner-2020-npm1-flt3-interaction-C0007","paper":"dohner-2020-npm1-flt3-interaction","category":"prognosis","tier":"multivariable-adjusted","genes":["NPM1","FLT3","RUNX1","ASXL1","TP53"],"diseases":["AML"],"text":"Among the 318 RATIFY patients aged 18-60 with FLT3-ITD AML for whom complete 2017 ELN genetic risk categorization using NPM1/FLT3-ITD status together with RUNX1, ASXL1, TP53 and cytogenetic risk features was possible, 5-year overall survival was 0.62 for favorable risk, 0.43 for intermediate risk, and 0.33 for adverse risk; the ELN classification remained a significant prognostic variable in multivariable analysis."},{"id":"dohner-2020-npm1-flt3-interaction-C0008","paper":"dohner-2020-npm1-flt3-interaction","category":"prognosis","tier":"univariable or descriptive","genes":["NPM1","FLT3"],"diseases":["AML"],"text":"Among RATIFY patients aged 18-60 with FLT3-ITD AML whose 2017 ELN risk group could be assigned, the NPM1-mutated/low-allelic-ratio subgroup (>0.05 to <0.5) had favorable prognosis; 5-year overall survival was 62.5% across treatment arms and 73.0% with midostaurin."},{"id":"dohner-2020-npm1-flt3-interaction-C0009","paper":"dohner-2020-npm1-flt3-interaction","category":"treatment","tier":"univariable or descriptive","genes":["NPM1","FLT3"],"diseases":["AML"],"text":"Among RATIFY patients aged 18-60 with FLT3-ITD AML for whom complete 2017 ELN risk categorization was possible, midostaurin had a beneficial overall-survival effect across favorable, intermediate, and adverse risk groups, with no evidence that ELN risk group modified the treatment effect; the authors also observed activity irrespective of FLT3-ITD allelic burden and NPM1 mutational status."},{"id":"dohner-2020-npm1-flt3-interaction-C0010","paper":"dohner-2020-npm1-flt3-interaction","category":"treatment","tier":"multivariable-adjusted","genes":["FLT3"],"diseases":["AML"],"text":"Among RATIFY patients aged 18-60 with FLT3-ITD AML for whom complete 2017 ELN risk categorization was possible, adding midostaurin did not significantly increase complete-remission rates after one or two induction cycles, including across the three ELN risk groups."},{"id":"dohner-2020-npm1-flt3-interaction-C0011","paper":"dohner-2020-npm1-flt3-interaction","category":"treatment","tier":"multivariable-adjusted","genes":["NPM1","FLT3","RUNX1","ASXL1","TP53"],"diseases":["AML"],"text":"Among the 318 RATIFY patients aged 18-60 with FLT3-ITD AML, the 2017 ELN adverse-risk genetic subgroup—NPM1-wild-type/high-allelic-ratio FLT3-ITD; NPM1-mutated/high-allelic-ratio FLT3-ITD with RUNX1, ASXL1, or TP53 high-risk markers; or NPM1-wild-type/low-allelic-ratio FLT3-ITD with those markers and/or adverse-risk cytogenetics—showed a strong favorable association between allogeneic HCT in first complete remission and overall survival (HR 0.39, 95% CI 0.21-0.73; P=.003). This subgroup analysis was not powered for definitive treatment comparisons."},{"id":"dohner-2020-npm1-flt3-interaction-C0012","paper":"dohner-2020-npm1-flt3-interaction","category":"treatment","tier":"univariable or descriptive","genes":["NPM1","FLT3"],"diseases":["AML"],"text":"For RATIFY patients aged 18-60 with NPM1-mutated AML and low FLT3-ITD allelic ratio (>0.05 to <0.5), corresponding to 2017 ELN favorable risk in this analysis, the authors identify conventional consolidation plus midostaurin as a postremission treatment option."},{"id":"dohner-2020-npm1-flt3-interaction-C0013","paper":"dohner-2020-npm1-flt3-interaction","category":"treatment","tier":"univariable or descriptive","genes":["NPM1","FLT3"],"diseases":["AML"],"text":"For RATIFY patients aged 18-60 with NPM1-mutated AML and low FLT3-ITD allelic ratio (>0.05 to <0.5), corresponding to 2017 ELN favorable risk in this analysis, the authors state that allogeneic HCT may be delayed until first relapse."},{"id":"dohner-2020-npm1-flt3-interaction-C0014","paper":"dohner-2020-npm1-flt3-interaction","category":"biomarker","tier":"restated secondary","genes":["NPM1","FLT3"],"diseases":["AML"],"text":"For RATIFY patients aged 18-60 with NPM1-mutated AML and low FLT3-ITD allelic ratio (>0.05 to <0.5), corresponding to 2017 ELN favorable risk in this analysis, NPM1 mutation provides a target for measurable-residual-disease monitoring that can refine prognostic assessment and inform postremission therapy."},{"id":"dohner-2020-npm1-flt3-interaction-C0015","paper":"dohner-2020-npm1-flt3-interaction","category":"biomarker","tier":"univariable or descriptive","genes":["FLT3"],"diseases":["AML"],"text":"For newly diagnosed FLT3-ITD AML patients eligible for intensive therapy, the authors recommend a complete 2017 ELN work-up including assessment of FLT3-ITD allelic burden."},{"id":"dohner-2020-npm1-flt3-interaction-C0016","paper":"dohner-2020-npm1-flt3-interaction","category":"treatment","tier":"restated secondary","genes":["FLT3"],"diseases":["AML"],"text":"For FLT3-mutated AML, the paper reports that midostaurin was approved in combination with intensive chemotherapy by the US Food and Drug Administration and the European Medicines Agency."},{"id":"dohner-2020-npm1-flt3-interaction-C0017","paper":"dohner-2020-npm1-flt3-interaction","category":"treatment","tier":"restated secondary","genes":["FLT3"],"diseases":["AML"],"text":"The paper reports European Medicines Agency approval of midostaurin as maintenance therapy for adults with AML harboring an activating FLT3 mutation."},{"id":"elena-2016-blood-128-1408-C0001","paper":"elena-2016-blood-128-1408","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["CMML"],"text":"In CMML, the FAB classification distinguishes myelodysplastic from myeloproliferative disease using a leukocyte-count threshold of 13 × 10^9/L (≤13 × 10^9/L vs >13 × 10^9/L, respectively)."},{"id":"elena-2016-blood-128-1408-C0002","paper":"elena-2016-blood-128-1408","category":"diagnosis","tier":"univariable or descriptive","genes":["JAK2","NRAS","SETBP1"],"diseases":["CMML"],"text":"In CMML, JAK2, NRAS, and SETBP1 mutations were significantly associated with the myeloproliferative subtype (CMML-MP)."},{"id":"elena-2016-blood-128-1408-C0003","paper":"elena-2016-blood-128-1408","category":"diagnosis","tier":"univariable or descriptive","genes":["TET2","SF3B1"],"diseases":["CMML"],"text":"In CMML, TET2 and SF3B1 mutations were significantly associated with the myelodysplastic subtype (CMML-MD; P=.007 and P=.03, respectively)."},{"id":"elena-2016-blood-128-1408-C0004","paper":"elena-2016-blood-128-1408","category":"prognosis","tier":"multivariable-adjusted","genes":["RUNX1","NRAS","SETBP1","ASXL1"],"diseases":["CMML"],"text":"In CMML, RUNX1, NRAS, SETBP1, and ASXL1 mutations each retained independent adverse prognostic value for overall survival in multivariable analysis (HR 2.32, 2.19, 2.00, and 1.77, respectively)."},{"id":"elena-2016-blood-128-1408-C0005","paper":"elena-2016-blood-128-1408","category":"prognosis","tier":"univariable or descriptive","genes":["EZH2"],"diseases":["CMML"],"text":"In CMML, EZH2 mutation was associated with worse overall survival in univariable analysis (HR 2.07, P=.023)."},{"id":"fabre-2022-chip-dnmt3a-C0003","paper":"fabre-2022-chip-dnmt3a","category":"prognosis","tier":"restated secondary","genes":["SRSF2"],"diseases":["CHIP"],"text":"In clonal haematopoiesis, SRSF2 was among the driver genes associated with the highest risk of AML progression/leukaemogenesis in the cited gene-level risk analysis."},{"id":"fabre-2022-chip-dnmt3a-C0004","paper":"fabre-2022-chip-dnmt3a","category":"prognosis","tier":"restated secondary","genes":["U2AF1"],"diseases":["CHIP"],"text":"In clonal haematopoiesis, U2AF1 was among the driver genes associated with the highest risk of AML progression/leukaemogenesis in the cited gene-level risk analysis."},{"id":"fabre-2022-chip-dnmt3a-C0005","paper":"fabre-2022-chip-dnmt3a","category":"prognosis","tier":"restated secondary","genes":["DNMT3A"],"diseases":["CHIP"],"text":"In clonal haematopoiesis, DNMT3A-mutant clones were associated with a lower AML progression risk in the cited cross-gene risk analysis."},{"id":"fabre-2022-chip-dnmt3a-C0006","paper":"fabre-2022-chip-dnmt3a","category":"prognosis","tier":"restated secondary","genes":["SRSF2"],"diseases":["CHIP"],"text":"SRSF2-P95H-mutant clonal haematopoiesis is associated with a high risk of progression to myeloid cancers."},{"id":"feurstein-2021-myeloid-germline-C0001","paper":"feurstein-2021-myeloid-germline","category":"germline","tier":"restated secondary","genes":["DDX41"],"diseases":["MDS","AML"],"text":"Heterozygous germline DDX41 variants are associated with increased lifetime risk of MDS and AML."},{"id":"feurstein-2021-myeloid-germline-C0002","paper":"feurstein-2021-myeloid-germline","category":"prognosis","tier":"univariable or descriptive","genes":["DDX41"],"diseases":["MDS","AML"],"text":"For germline DDX41 predisposition to MDS and AML, penetrance of heterozygous variants was estimated at approximately 62%."},{"id":"feurstein-2021-myeloid-germline-C0003","paper":"feurstein-2021-myeloid-germline","category":"germline","tier":"univariable or descriptive","genes":["DDX41"],"diseases":[],"text":"For DDX41 germline variant interpretation, the paper calculates a BA1 MAF threshold of 0.00109 (0.1%) using AML prevalence, estimated penetrance, allelic heterogeneity, and an assumption of 100% genetic heterogeneity."},{"id":"feurstein-2021-myeloid-germline-C0004","paper":"feurstein-2021-myeloid-germline","category":"germline","tier":"univariable or descriptive","genes":["DDX41"],"diseases":[],"text":"For DDX41, using a maximum genetic heterogeneity contribution of 10%, the paper gives a BS1 MAF range of 0.000109 (0.01%) to 0.00109 (0.1%)."},{"id":"feurstein-2021-myeloid-germline-C0005","paper":"feurstein-2021-myeloid-germline","category":"germline","tier":"univariable or descriptive","genes":["DDX41"],"diseases":[],"text":"Because DDX41 has founder variants, the proposed BA1/BS1 MAF cutoffs should be applied using the total gnomAD population rather than subpopulation MAFs."},{"id":"feurstein-2021-myeloid-germline-C0006","paper":"feurstein-2021-myeloid-germline","category":"germline","tier":"univariable or descriptive","genes":["DDX41"],"diseases":[],"text":"When DDX41 BS1 is calibrated from the recurrent p.Asp140Glyfs*2 variant, the paper proposes a conservative BS1 threshold of 0.000219, 2.5-fold above its gnomAD MAF of 0.0000875."},{"id":"feurstein-2021-myeloid-germline-C0007","paper":"feurstein-2021-myeloid-germline","category":"germline","tier":"univariable or descriptive","genes":["DDX41"],"d
