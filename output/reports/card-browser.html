<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Evidence cards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#efeef4;
    --panel:#f7f6fa;
    --ink:#191825;
    --muted:#6e6a82;
    --rule:#d8d5e3;
    --azure:#2b4c8c;
    --eosin:#a31e63;
    --focus:#a31e63;
    --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --display:"Newsreader",Georgia,serif;
    --cat-diagnosis:#4a3f8f;
    --cat-prognosis:#a31e63;
    --cat-treatment:#1d6f63;
    --cat-biomarker:#2b4c8c;
    --cat-germline:#8a5a12;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);color:var(--ink);font-family:var(--sans);
    font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;
  }
  a{color:var(--azure)}
  button{font:inherit;color:inherit}

  /* ---------- masthead ---------- */
  header.masthead{
    border-bottom:1px solid var(--rule);
    padding:22px 28px 16px;
    display:flex;flex-wrap:wrap;gap:18px;align-items:baseline;justify-content:space-between;
  }
  .wordmark{font-family:var(--display);font-size:31px;line-height:1;letter-spacing:-.01em;font-weight:500;margin:0}
  .wordmark em{font-style:italic;color:var(--eosin)}
  .provenance{font-family:var(--mono);font-size:11.5px;color:var(--muted);letter-spacing:.02em}

  /* ---------- shell ---------- */
  .shell{display:grid;grid-template-columns:288px minmax(0,1fr);gap:0;align-items:start}
  body.full-mode.detail-open .shell{grid-template-columns:270px minmax(0,1fr) minmax(340px,420px)}
  .rail{
    border-right:1px solid var(--rule);padding:20px 20px 60px;
    position:sticky;top:0;max-height:100vh;overflow-y:auto;background:var(--panel);
  }
  .main{padding:20px 28px 90px;min-width:0}

  /* ---------- full detail pane ---------- */
  .detail{display:none}
  body.full-mode.detail-open .detail{
    display:block;border-left:1px solid var(--rule);background:#fff;padding:18px 20px 60px;
    position:sticky;top:0;max-height:100vh;overflow-y:auto;min-width:0;
  }
  .detail-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px}
  .detail-id{font-family:var(--mono);font-size:12px;color:var(--muted);overflow-wrap:anywhere}
  .detail-close{border:1px solid var(--rule);background:#fff;border-radius:2px;cursor:pointer;padding:3px 8px;font-family:var(--mono);font-size:12px}
  .detail-close:hover{border-color:var(--eosin);color:var(--eosin)}
  .detail-section{border-top:1px solid var(--rule);padding-top:14px;margin-top:16px}
  .detail-section:first-of-type{border-top:0;padding-top:0;margin-top:0}
  .detail-section h2{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
  .detail-interpretation{font-family:var(--display);font-size:20px;line-height:1.45;margin:0}
  .meta-grid{display:grid;grid-template-columns:minmax(100px,130px) minmax(0,1fr);gap:6px 12px;margin:0;font-size:13px}
  .meta-grid dt{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin:0}
  .meta-grid dd{margin:0;overflow-wrap:anywhere}
  .evidence-fragment{margin:12px 0 0;padding:10px 12px;background:var(--panel);border-left:3px solid var(--azure)}
  .fragment-label{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-bottom:6px}
  .evidence-fragment blockquote{margin:0;font-size:13.5px;line-height:1.55}
  .support-list{margin:0;padding-left:18px;font-size:13px}
  .support-list code{font-family:var(--mono);font-size:11px}
  .detail-citation{font-size:13px;line-height:1.55;margin:0}
  details.raw{margin-top:16px;border-top:1px solid var(--rule);padding-top:12px}
  details.raw summary{cursor:pointer;font-family:var(--mono);font-size:10.5px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
  pre.raw-json{white-space:pre-wrap;overflow-wrap:anywhere;font-family:var(--mono);font-size:10px;line-height:1.45;background:var(--panel);padding:10px;margin:10px 0 0;border:1px solid var(--rule)}

  /* ---------- filters ---------- */
  .facet{margin-bottom:26px}
  .facet h2{
    font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.12em;
    text-transform:uppercase;color:var(--muted);margin:0 0 9px;
    display:flex;justify-content:space-between;align-items:baseline;gap:8px;
  }
  .facet h2 .clear{
    border:0;background:none;padding:0;cursor:pointer;color:var(--eosin);
    font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:none;
    visibility:hidden;
  }
  .facet.active h2 .clear{visibility:visible}
  .facet-search{
    width:100%;border:1px solid var(--rule);background:#fff;border-radius:2px;
    padding:6px 8px;font-family:var(--mono);font-size:12px;color:var(--ink);margin-bottom:8px;
  }
  .facet-search::placeholder{color:#9a96ab}
  .options{list-style:none;margin:0;padding:0;max-height:264px;overflow-y:auto}
  .options.short{max-height:none}
  .opt{
    width:100%;display:flex;gap:8px;align-items:baseline;text-align:left;
    border:0;background:none;cursor:pointer;padding:3px 4px;border-radius:2px;
    font-size:13.5px;line-height:1.35;color:var(--ink);
  }
  .opt:hover{background:#e9e6f1}
  .opt .tick{
    font-family:var(--mono);font-size:11px;color:var(--muted);width:12px;flex:none;
  }
  .opt[aria-pressed="true"]{background:#fff}
  .opt[aria-pressed="true"] .label{color:var(--eosin);font-weight:600}
  .opt[aria-pressed="true"] .tick{color:var(--eosin)}
  .opt .label{flex:1;min-width:0;overflow-wrap:anywhere}
  .opt .count{font-family:var(--mono);font-size:11px;color:var(--muted);flex:none}
  .opt[disabled]{opacity:.35;cursor:default}
  .opt[disabled]:hover{background:none}
  .swatch{width:8px;height:8px;border-radius:50%;flex:none;align-self:center}

  /* ---------- results ---------- */
  .toolbar{
    display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;
    padding-bottom:12px;border-bottom:1px solid var(--rule);margin-bottom:4px;
  }
  .tally{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.03em}
  .tally b{color:var(--ink);font-weight:500}
  .text-search{
    flex:1;min-width:200px;max-width:380px;border:1px solid var(--rule);background:#fff;
    border-radius:2px;padding:7px 10px;font-family:var(--sans);font-size:13.5px;
  }
  .reset{
    border:1px solid var(--rule);background:#fff;border-radius:2px;padding:6px 11px;
    font-family:var(--mono);font-size:11.5px;letter-spacing:.04em;cursor:pointer;
  }
  .reset:hover{border-color:var(--eosin);color:var(--eosin)}

  ol.cards{list-style:none;margin:0;padding:0}
  li.card{
    display:grid;grid-template-columns:232px minmax(0,1fr);gap:22px;
    padding:15px 0 15px 13px;border-bottom:1px solid var(--rule);
    border-left:3px solid var(--spine,var(--rule));
  }
  body.full-mode li.card{cursor:pointer}
  body.full-mode li.card:hover{background:#f7f4fa}
  body.full-mode li.card.selected{background:#fff;border-left-width:5px;padding-left:11px}
  li.card .cid{
    font-family:var(--mono);font-size:11.5px;line-height:1.5;color:var(--muted);
    letter-spacing:-.01em;overflow-wrap:anywhere;padding-top:2px;
  }
  li.card p{margin:0;font-size:15.5px;line-height:1.6}
  li.card mark{background:#f7dbe8;color:inherit;padding:0 1px}
  .empty{padding:56px 0;max-width:44ch}
  .empty h3{font-family:var(--display);font-size:22px;font-weight:500;margin:0 0 6px}
  .empty p{margin:0;color:var(--muted)}

  .railtoggle{display:none}

  @media (max-width:1150px){
    body.full-mode.detail-open .shell{grid-template-columns:288px minmax(0,1fr)}
    body.full-mode.detail-open .detail{
      position:fixed;z-index:20;right:0;top:0;width:min(440px,92vw);height:100vh;max-height:none;
      box-shadow:-12px 0 34px rgba(25,24,37,.16);
    }
  }

  @media (max-width:900px){
    .shell, body.full-mode.detail-open .shell{grid-template-columns:1fr}
    .rail{
      position:static;max-height:none;border-right:0;border-bottom:1px solid var(--rule);
      padding-bottom:24px;
    }
    .rail[hidden]{display:none}
    .railtoggle{
      display:block;margin:16px 28px 0;border:1px solid var(--rule);background:#fff;
      border-radius:2px;padding:8px 12px;font-family:var(--mono);font-size:12px;cursor:pointer;
    }
    .main{padding:16px 20px 70px}
    li.card{grid-template-columns:1fr;gap:5px}
    header.masthead{padding:18px 20px 14px}
  }
  :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="masthead">
  <h1 class="wordmark">Evidence <em>cards</em></h1>
  <div class="provenance" id="provenance"></div>
</header>

<button class="railtoggle" id="railtoggle" aria-expanded="false" aria-controls="rail">Filters</button>

<div class="shell">
  <aside class="rail" id="rail" aria-label="Filters"></aside>
  <main class="main">
    <div class="toolbar">
      <div class="tally" id="tally"></div>
      <input class="text-search" id="textsearch" type="search" placeholder="Search interpretation text" aria-label="Search interpretation text">
      <button class="reset" id="reset" type="button">Clear all filters</button>
    </div>
    <ol class="cards" id="cards"></ol>
  </main>
  <aside class="detail" id="detail" aria-label="Card details"></aside>
</div>

utation is an independent risk factor for future thrombosis in the original IPSET-thrombosis model."},{"id":"barbui-2015-blood-cancer-journal-5-e369-C0002","paper":"barbui-2015-blood-cancer-journal-5-e369","category":"prognosis","tier":"restated secondary","genes":["CALR"],"diseases":["ET"],"text":"In essential thrombocythemia, CALR mutation does not modify thrombosis-risk prediction by the IPSET-thrombosis model."},{"id":"barbui-2015-blood-cancer-journal-5-e369-C0003","paper":"barbui-2015-blood-cancer-journal-5-e369","category":"prognosis","tier":"univariable or descriptive","genes":["JAK2"],"diseases":["ET"],"text":"Among patients with essential thrombocythemia who are conventionally low risk, defined as age ≤60 years with no history of thrombosis, JAK2 (JAK2V617F)-unmutated patients have lower thrombosis risk than JAK2 (JAK2V617F)-mutated patients, whether or not cardiovascular risk factors are present."},{"id":"barbui-2015-blood-cancer-journal-5-e369-C0004","paper":"barbui-2015-blood-cancer-journal-5-e369","category":"prognosis","tier":"univariable or descriptive","genes":["JAK2"],"diseases":["ET"],"text":"Among patients with essential thrombocythemia who are conventionally high risk, defined by age >60 years and/or a history of thrombosis, the combination of JAK2 (JAK2V617F) mutation and cardiovascular risk factors is associated with higher thrombosis risk than the absence of both additional risk factors."},{"id":"barbui-2015-blood-cancer-journal-5-e369-C0006","paper":"barbui-2015-blood-cancer-journal-5-e369","category":"prognosis","tier":"univariable or descriptive","genes":["JAK2"],"diseases":["ET"],"text":"Among patients with essential thrombocythemia whose conventional high-risk status is defined by a history of thrombosis, regardless of age, JAK2 (JAK2V617F) mutation and/or cardiovascular risk factors provide only limited additional thrombosis-risk information."},{"id":"barbui-2015-blood-cancer-journal-5-e369-C0007","paper":"barbui-2015-blood-cancer-journa , RUNX1, SF3B1, SRSF2, TP53, U2AF1, BCOR, BCORL1, CEBPA, ETNK1, GATA2, GNB1, IDH1, NF1, PHF6, PPM1D, PRPF8, PTPN11, SETBP1, STAG2, and WT1 with hematologic and cytogenetic variables to provide patient-specific risk stratification with better prognostic discrimination than IPSS-R across leukemia-free survival, overall survival, and AML transformation."},{"id":"bernard-2022-nejm-evidence-1-na-C0002","paper":"bernard-2022-nejm-evidence-1-na","category":"prognosis","tier":"univariable or descriptive","genes":["ASXL1","CBL","DNMT3A","ETV6","EZH2","FLT3","IDH2","KRAS","KMT2A","NPM1","NRAS","RUNX1","SF3B1","SRSF2","TP53","U2AF1","BCOR","BCORL1","CEBPA","ETNK1","GATA2","GNB1","IDH1","NF1","PHF6","PPM1D","PRPF8","PTPN11","SETBP1","STAG2","WT1"],"diseases":["MDS"],"text":"In secondary/therapy-related MDS, the IPSS-M, which incorporates ASXL1, CBL, DNMT3A, ETV6, EZH2, FLT3, IDH2, KRAS, KMT2A, NPM1, NRAS, RUNX1, SF3B1, SRSF2, TP53, U2AF1, BCOR, BCORL1, CEBPA, ETNK1, GATA2, GNB1, IDH1, NF1, PHF6, PPM1D, PRPF8, PTPN11, SETBP1, STAG2, and WT1, captures heterogeneous prognosis: outcomes within IPSS-M risk categories track those observed in primary MDS."},{"id":"bernard-2022-nejm-evidence-1-na-C0003","paper":"bernard-2022-nejm-evidence-1-na","category":"prognosis","tier":"univariable or descriptive","genes":["ASXL1","CBL","DNMT3A","ETV6","EZH2","FLT3","IDH2","KRAS","KMT2A","NPM1","NRAS","RUNX1","SF3B1","SRSF2","TP53","U2AF1","BCOR","BCORL1","CEBPA","ETNK1","GATA2","GNB1","IDH1","NF1","PHF6","PPM1D","PRPF8","PTPN11","SETBP1","STAG2","WT1"],"diseases":["MDS"],"text":"In MDS, the IPSS-M, which incorporates ASXL1, CBL, DNMT3A, ETV6, EZH2, FLT3, IDH2, KRAS, KMT2A, NPM1, NRAS, RUNX1, SF3B1, SRSF2, TP53, U2AF1, BCOR, BCORL1, CEBPA, ETNK1, GATA2, GNB1, IDH1, NF1, PHF6, PPM1D, PRPF8, PTPN11, SETBP1, STAG2, and WT1, has better prognostic discrimination than IPSS-R in both untreated patients and patients subsequently treated, across leukemia-free survival, overall survival, and AML transformation."},{"id":"bernard-2022-nejm-evidence-1-na-C0004","paper":"bernard-2022-nejm-evidence-1-na","category":"prognosis","tier":"multivariable-adjusted","genes":["TP53"],"diseases":["MDS"],"text":"In MDS, multihit TP53, but not monoallelic TP53 mutation, is associated with adverse prognosis."},{"id":"bernard-2022-nejm-evidence-1-na-C0005","paper":"bernard-2022-nejm-evidence-1-na","category":"prognosis","tier":"multivariable-adjusted","genes":["FLT3"],"diseases":["MDS"],"text":"In MDS, FLT3 internal tandem duplication or tyrosine kinase domain mutations are associated with adverse prognosis, with a particularly strong association with AML transformation."},{"id":"bernard-2022-nejm-evidence-1-na-C0006","paper":"bernard-2022-nejm-evidence-1-na","category":"prognosis","tier":"multivariable-adjusted","genes":["KMT2A"],"diseases":["MDS"],"text":"In MDS, KMT2A (MLL) partial tandem duplication is associated with adverse prognosis, including high risk of AML transformation and poor overall survival."},{"id":"bernard-2022-nejm-evidence-1-na-C0007","paper":"bernard-2022-nejm-evidence-1-na","category":"prognosis","tier":"multivariable-adjusted","genes":["ASXL1","BCOR","EZH2","NRAS","RUNX1","STAG2","U2AF1"],"diseases":["MDS"],"text":"In MDS, mutations in ASXL1, BCOR, EZH2, NRAS, RUNX1, STAG2, or U2AF1 are each associated with adverse outcomes across leukemia-free survival, overall survival, and AML transformation."},{"id":"bernard-2022-nejm-evidence-1-na-C0008","paper":"bernard-2022-nejm-evidence-1-na","category":"prognosis","tier":"multivariable-adjusted","genes":["DDX41"],"diseases":["MDS"],"text":"In MDS, DDX41 mutation is associated with increased risk of AML transformation."},{"id":"bernard-2022-nejm-evidence-1-na-C0009","paper":"bernard-2022-nejm-evidence-1-na","category":"prognosis","tier":"multivariable-adjusted","genes":["DDX41"],"diseases":["MDS"],"text":"In MDS, DDX41 mutation is associated with favorable overall survival, particularly in MDS with excess blasts."},{"id":"bernard-2022-nejm-evidence-1-na-C0010","paper":"bernard-2022-nejm-evidence-1-na","category":"prognosis","tier":"univariable or descriptive","genes":["SF3B1","BCOR","BCORL1","NRAS","RUNX1","SRSF2","STAG2"],"diseases":["MDS"],"text":"In MDS, the favorable prognostic association of SF3B1 mutation is confined to cases without isolated del(5q) and without comutation in BCOR, BCORL1, NRAS, RUNX1, SRSF2, or STAG2; the favorable association is not observed in those excluded contexts."},{"id":"bernard-2022-nejm-evidence-1-na-C0011","paper":"bernard-2022-nejm-evidence-1-na","category":"biomarker","tier":"multivariable-adjusted","genes":["TP53"],"diseases":["MDS"],"text":"For MDS risk assessment at diagnosis, determining TP53 allelic state is important because the adverse prognostic signal is specific to multihit TP53 rather than monoallelic TP53 mutation."},{"id":"bernard-2022-nejm-evidence-1-na-C0012","paper":"bernard-2022-nejm-evidence-1-na","category":"biomarker","tier":"multivariable-adjusted","genes":["KMT2A"],"diseases":["MDS"],"text":"For MDS risk assessment at diagnosis, specifically assessing KMT2A (MLL) partial tandem duplication is important because it contributes to adverse risk estimation and is not routinely included in myeloid panel tests."},{"id":"bernard-2022-nejm-evidence-1-na-C0013","paper":"bernard-2022-nejm-evidence-1-na","category":"biomarker","tier":"multivariable-adjusted","genes":["FLT3"],"diseases":["MDS"],"text":"For MDS risk assessment at diagnosis, FLT3 mutation screening is important because FLT3 mutation is a strong predictor of adverse outcomes."},{"id":"bernard-2022-nejm-evidence-1-na-C0014","paper":"bernard-2022-nejm-evidence-1-na","category":"germline","tier":"univariable or descriptive","genes":["DDX41"],"diseases":["MDS"],"text":"In MDS, a DDX41 pattern with a clonal variant and a subclonal second variant can suggest germline DDX41 followed by a secondary somatic hit."},{"id":"bernard-2022-nejm-evidence-1-na-C0015","paper":"bernard-2022-nejm-evidence-1-na","category":"treatment","tier":"univariable or descriptive","genes":["TP53"],"diseases":["MDS"],"text":"In MDS treated with hypomethylating agents, multihit TP53 is associated with worse overall survival."},{"id":"bernard-2022-nejm-evidence-1-na-C0016","paper":"bernard-2022-nejm-evidence-1-na","category":"treatment","tier":"univariable or descriptive","genes":["TP53"],"diseases":["MDS"],"text":"In MDS undergoing stem cell transplantation, multihit TP53 is associated with worse overall survival."},{"id":"bernard-2022-nejm-evidence-1-na-C0017","paper":"bernard-2022-nejm-evidence-1-na","category":"treatment","tier":"univariable or descriptive","genes":["TP53"],"diseases":["MDS"],"text":"In MDS treated with lenalidomide, multihit TP53 is associated with worse overall survival."},{"id":"bernard-2022-nejm-evidence-1-na-C0018","paper":"bernard-2022-nejm-evidence-1-na","category":"treatment","tier":"univariable or descriptive","genes":["DDX41"],"diseases":["MDS"],"text":"In MDS treated with hypomethylating agents, DDX41 mutation is associated with favorable overall survival; this treatment-specific association requires further investigation in randomized studies."},{"id":"bernard-2022-nejm-evidence-1-na-C0019","paper":"bernard-2022-nejm-evidence-1-na","category":"treatment","tier":"restated secondary","genes":[],"diseases":["MDS"],"text":"Patients with higher-risk MDS are considered for disease-modifying therapies intended to prolong survival, including hypomethylating agents and allogeneic transplantation."},{"id":"bernard-2022-nejm-evidence-1-na-C0020","paper":"bernard-2022-nejm-evidence-1-na","category":"prognosis","tier":"multivariable-adjusted","genes":["TP53","KMT2A","FLT3","SF3B1","NPM1","RUNX1","NRAS","ETV6","IDH2","CBL","EZH2","U2AF1","SRSF2","DNMT3A","ASXL1","KRAS"],"diseases":["MDS"],"text":"According to the IPSS-M framework for MDS, multihit TP53, KMT2A (MLL) partial tandem duplication, FLT3 ITD/TKD, SF3B1 mutation with isolated del(5q), and mutations in NPM1, RUNX1, NRAS, ETV6, IDH2, CBL, EZH2, U2AF1, SRSF2, DNMT3A, ASXL1, and KRAS are main-effect molecular findings that individually contribute adverse prognostic weight. SF3B1a—SF3B1 mutation without BCOR, BCORL1, RUNX1, NRAS, STAG2, SRSF2, or del(5q)—is a main-effect finding that individually contributes favourable prognostic weight. A main-effect finding is modelled individually in IPSS-M, so its gene-specific prognostic contribution is incorporated directly rather than through the residual mutation count."},{"id":"bernard-2022-nejm-evidence-1-na-C0022","paper":"bernard-2022-nejm-evidence-1-na","category":"prognosis","tier":"multivariable-adjusted","genes":["BCOR","BCORL1","CEBPA","ETNK1","GATA2","GNB1","IDH1","NF1","PHF6","PPM1D","PRPF8","PTPN11","SETBP1","STAG2","WT1"],"diseases":["MDS"],"text":"In MDS, mutations in BCOR, BCORL1, CEBPA, ETNK1, GATA2, GNB1, IDH1, NF1, PHF6, PPM1D, PRPF8, PTPN11, SETBP1, STAG2, or WT1 are associated with adverse prognostic effects of similar magnitude. Their adverse effects are cumulative across this gene group, but the source observed saturation of additive risk beyond two mutated genes, so additional mutations beyond two did not add further adverse prognostic value."},{"id":"cloos-2026-blood-147-1147-C0001","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["NPM1","FLT3","PML","RARA","RUNX1","RUNX1T1","CBFB","MYH11","KMT2A"],"diseases":["AML"],"text":"According to ELN-DAVID 2025, validated leukemia-specific MRD assays targeting NPM1, FLT3-ITD, PML::RARA, RUNX1::RUNX1T1, CBFB::MYH11, or KMT2A rearrangements are preferred over less-specific molecular markers for acute myeloid leukemia."},{"id":"cloos-2026-blood-147-1147-C0002","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["WT1","MECOM"],"diseases":["AML"],"text":"According to ELN-DAVID 2025, WT1 and EVI1/MECOM expression are less-specific MRD markers in acute myeloid leukemia, so validated leukemia-specific MRD assays are preferred when available."},{"id":"cloos-2026-blood-147-1147-C0003","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["NPM1","FLT3","PML","RARA"],"diseases":["AML"],"text":"According to ELN-DAVID 2025, when a rare NPM1 mutation, very large FLT3-ITD, or uncommon noncanonical PML::RARA transcript will be used for acute myeloid leukemia MRD monitoring, analyte detectability with the established MRD assay should first be confirmed at diagnosis."},{"id":"cloos-2026-blood-147-1147-C0004","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["NPM1"],"diseases":["AML"],"text":"According to ELN-DAVID 2025, in NPM1-mutated acute myeloid leukemia assessed by peripheral-blood qPCR after 2 intensive-chemotherapy cycles or before alloHCT, mutNPM1/ABL1 <0.001% or undetectable MRD is MRD-negative with an optimal response."},{"id":"cloos-2026-blood-147-1147-C0005","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["NPM1"],"diseases":["AML"],"text":"According to ELN-DAVID 2025, in NPM1-mutated acute myeloid leukemia assessed by peripheral-blood qPCR after 2 intensive-chemotherapy cycles or before alloHCT, detectable mutNPM1/ABL1 from ≥0.001% to <0.01% is MRD-LL with a warning response."},{"id":"cloos-2026-blood-147-1147-C0006","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["NPM1"],"diseases":["AML"],"text":"According to ELN-DAVID 2025, in NPM1-mutated acute myeloid leukemia assessed by peripheral-blood qPCR after 2 intensive-chemotherapy cycles or before alloHCT, detectable mutNPM1/ABL1 ≥0.01% is MRD-positive but remains a warning response rather than high risk of treatment failure."},{"id":"cloos-2026-blood-147-1147-C0007","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["NPM1"],"diseases":["AML"],"text":"According to ELN-DAVID 2025, in NPM1-mutated acute myeloid leukemia assessed by bone-marrow qPCR at end of treatment after consolidation or alloHCT, mutNPM1/ABL1 <0.001% or undetectable MRD is MRD-negative with an optimal response."},{"id":"cloos-2026-blood-147-1147-C0008","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["NPM1"],"diseases":["AML"],"text":"According to ELN-DAVID 2025, in NPM1-mutated acute myeloid leukemia assessed by bone-marrow qPCR at end of treatment after consolidation or alloHCT, detectable mutNPM1/ABL1 from ≥0.001% to <0.1% is MRD-LL with a warning response."},{"id":"cloos-2026-blood-147-1147-C0009","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["NPM1"],"diseases":["AML"],"text":"According to ELN-DAVID 2025, in NPM1-mutated acute myeloid leukemia assessed by bone-marrow qPCR at end of treatment after consolidation or alloHCT, detectable mutNPM1/ABL1 ≥0.1% is MRD-positive and indicates high risk of treatment failure."},{"id":"cloos-2026-blood-147-1147-C0010","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["NPM1"],"diseases":["AML"],"text":"According to ELN-DAVID 2025, during peripheral-blood qPCR follow-up of NPM1-mutated acute myeloid leukemia, mutNPM1/ABL1 <0.001% or undetectable MRD is MRD-negative with an optimal response."},{"id":"cloos-2026-blood-147-1147-C0011","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["NPM1"],"diseases":["AML"],"text":"According to ELN-DAVID 2025, during peripheral-blood qPCR follow-up of NPM1-mutated acute myeloid leukemia, detectable mutNPM1/ABL1 from ≥0.001% to <0.01% is MRD-LL with a warning response."},{"id":"cloos-2026-blood-147-1147-C0012","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["NPM1"],"diseases":["AML"],"text":"According to ELN-DAVID 2025, during follow-up of NPM1-mutated acute myeloid leukemia, conversion from undetectable to detectable peripheral-blood mutNPM1/ABL1 ≥0.01% meets the definition of MRD relapse."},{"id":"cloos-2026-blood-147-1147-C0013","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["NPM1"],"diseases":["AML"],"text":"According to ELN-DAVID 2025, during bone-marrow qPCR follow-up of NPM1-mutated acute myeloid leukemia, mutNPM1/ABL1 <0.001% or undetectable MRD is MRD-negative with an optimal response."},{"id":"cloos-2026-blood-147-1147-C0014","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["NPM1"],"diseases":["AML"],"text":"According to ELN-DAVID 2025, during bone-marrow qPCR follow-up of NPM1-mutated acute myeloid leukemia, detectable mutNPM1/ABL1 from ≥0.001% to <0.1% is MRD-LL with a warning response."},{"id":"cloos-2026-blood-147-1147-C0015","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["NPM1"],"diseases":["AML"],"text":"According to ELN-DAVID 2025, during follow-up of NPM1-mutated acute myeloid leukemia, conversion from undetectable to detectable bone-marrow mutNPM1/ABL1 ≥0.1% meets the definition of MRD relapse."},{"id":"cloos-2026-blood-147-1147-C0016","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["NPM1"],"diseases":["AML"],"text":"According to ELN-DAVID 2025, suspected NPM1 qPCR MRD relapse in acute myeloid leukemia should be confirmed within 4 weeks, preferably with paired peripheral-blood and bone-marrow samples; bone-marrow mutNPM1/ABL1 ≥1% may indicate imminent clinical relapse and may not permit time for confirmation."},{"id":"cloos-2026-blood-147-1147-C0017","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["NPM1"],"diseases":["AML"],"text":"According to ELN-DAVID 2025, in NPM1-mutated acute myeloid leukemia that has never become MRD-negative, a ≥1-log10 increase from the measured nadir within the same tissue defines MRD relapse regardless of the usual threshold."},{"id":"cloos-2026-blood-147-1147-C0021","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["NPM1"],"diseases":["AML"],"text":"According to ELN-DAVID 2025, NPM1 qPCR-MRD is prognostic in acute myeloid leukemia treated with a hypomethylating agent plus venetoclax."},{"id":"cloos-2026-blood-147-1147-C0022","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["NPM1"],"diseases":["AML"],"text":"In NPM1-mutated acute myeloid leukemia, ELN-defined NPM1 MRD relapse is strongly associated with impending clinical relapse."},{"id":"cloos-2026-blood-147-1147-C0024","paper":"cloos-2026-blood-147-1147","category":"treatment","tier":"guideline criterion","genes":["NPM1"],"diseases":["AML"],"text":"According to ELN-DAVID 2025, allogeneic hematopoietic cell transplantation should be strongly considered for NPM1-mutated acute myeloid leukemia with MRD relapse."},{"id":"cloos-2026-blood-147-1147-C0025","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["NPM1","FLT3"],"diseases":["AML"],"text":"According to ELN-DAVID 2025, for favorable-risk NPM1-mutated acute myeloid leukemia without FLT3-ITD, peripheral-blood NPM1 qPCR is recommended after 2 treatment cycles or before HCT."},{"id":"cloos-2026-blood-147-1147-C0026","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["NPM1","FLT3"],"diseases":["AML"],"text":"According to ELN-DAVID 2025, for favorable-risk NPM1-mutated acute myeloid leukemia without FLT3-ITD, bone-marrow NPM1 qPCR is recommended at end of treatment."},{"id":"cloos-2026-blood-147-1147-C0027","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["NPM1","FLT3"],"diseases":["AML"],"text":"According to ELN-DAVID 2025, for favorable-risk NPM1-mutated acute myeloid leukemia without FLT3-ITD, follow-up NPM1 qPCR is recommended in peripheral blood every 4-6 weeks for 24 months or in bone marrow every 3 months for at least 24 months."},{"id":"cloos-2026-blood-147-1147-C0028","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["RUNX1","RUNX1T1","CBFB","MYH11"],"diseases":["AML"],"text":"According to ELN-DAVID 2025, in core-binding-factor acute myeloid leukemia with RUNX1::RUNX1T1 or CBFB::MYH11, the baseline fusion-transcript level should be established in bone marrow at diagnosis so subsequent log reduction can be assessed."},{"id":"cloos-2026-blood-147-1147-C0029","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["RUNX1","RUNX1T1","CBFB","MYH11"],"diseases":["AML"],"text":"According to ELN-DAVID 2025, in RUNX1::RUNX1T1- or CBFB::MYH11-positive core-binding-factor acute myeloid leukemia after 2 intensive-chemotherapy cycles or before alloHCT, a ≥3-log10 reduction from diagnostic transcript levels in bone marrow is an optimal MRD response."},{"id":"cloos-2026-blood-147-1147-C0030","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["RUNX1","RUNX1T1","CBFB","MYH11"],"diseases":["AML"],"text":"According to ELN-DAVID 2025, in RUNX1::RUNX1T1- or CBFB::MYH11-positive core-binding-factor acute myeloid leukemia after 2 intensive-chemotherapy cycles or before alloHCT, a <3-log10 reduction from diagnostic transcript levels in bone marrow is MRD-positive with a warning response."},{"id":"cloos-2026-blood-147-1147-C0031","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["RUNX1","RUNX1T1","CBFB","MYH11"],"diseases":["AML"],"text":"According to ELN-DAVID 2025, in RUNX1::RUNX1T1- or CBFB::MYH11-positive core-binding-factor acute myeloid leukemia at end of treatment after consolidation or alloHCT, <0.001% fusion transcript or undetectable bone-marrow qPCR MRD is MRD-negative with an optimal response."},{"id":"cloos-2026-blood-147-1147-C0032","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["RUNX1","RUNX1T1","CBFB","MYH11"],"diseases":["AML"],"text":"According to ELN-DAVID 2025, in RUNX1::RUNX1T1- or CBFB::MYH11-positive core-binding-factor acute myeloid leukemia at end of treatment, detectable MRD ≥0.001% with a ≥3-log10 reduction from diagnostic levels is MRD-LL with a warning response."},{"id":"cloos-2026-blood-147-1147-C0033","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["RUNX1","RUNX1T1","CBFB","MYH11"],"diseases":["AML"],"text":"According to ELN-DAVID 2025, in RUNX1::RUNX1T1- or CBFB::MYH11-positive core-binding-factor acute myeloid leukemia at end of treatment, a <3-log10 reduction from diagnostic levels is MRD-positive and indicates high risk of treatment failure."},{"id":"cloos-2026-blood-147-1147-C0034","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["RUNX1","RUNX1T1","CBFB","MYH11"],"diseases":["AML"],"text":"According to ELN-DAVID 2025, during follow-up of RUNX1::RUNX1T1- or CBFB::MYH11-positive core-binding-factor acute myeloid leukemia, <0.001% fusion transcript or undetectable qPCR MRD is MRD-negative with an optimal response."},{"id":"cloos-2026-blood-147-1147-C0035","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["RUNX1","RUNX1T1","CBFB","MYH11"],"diseases":["AML"],"text":"According to ELN-DAVID 2025, during follow-up of RUNX1::RUNX1T1- or CBFB::MYH11-positive core-binding-factor acute myeloid leukemia, detectable qPCR MRD with a ≥3-log10 reduction from diagnostic levels or detectable MRD <0.1% is MRD-LL with a warning response."},{"id":"cloos-2026-blood-147-1147-C0036","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["RUNX1","RUNX1T1","CBFB","MYH11"],"diseases":["AML"],"text":"According to ELN-DAVID 2025, during follow-up of RUNX1::RUNX1T1- or CBFB::MYH11-positive core-binding-factor acute myeloid leukemia, conversion from undetectable to detectable qPCR MRD ≥0.1% meets the definition of MRD relapse."},{"id":"cloos-2026-blood-147-1147-C0037","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["RUNX1","RUNX1T1","CBFB","MYH11"],"diseases":["AML"],"text":"According to ELN-DAVID 2025, suspected RUNX1::RUNX1T1 or CBFB::MYH11 qPCR MRD relapse in core-binding-factor acute myeloid leukemia should be confirmed within 4 weeks with a second consecutive sample, preferably paired peripheral blood and bone marrow."},{"id":"cloos-2026-blood-147-1147-C0038","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["RUNX1","RUNX1T1","CBFB","MYH11"],"diseases":["AML"],"text":"According to ELN-DAVID 2025, MRD log reduction in RUNX1::RUNX1T1- or CBFB::MYH11-positive core-binding-factor acute myeloid leukemia should be assessed using the same tissue type across measurements."},{"id":"cloos-2026-blood-147-1147-C0040","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["PML","RARA"],"diseases":["APL"],"text":"According to ELN-DAVID 2025, in PML::RARA-positive acute promyelocytic leukemia at end of treatment, bone-marrow qPCR with PML::RARA/ABL1 <0.001% or undetectable MRD is MRD-negative with an optimal response; 0.001% assay sensitivity may not be achievable in every patient."},{"id":"cloos-2026-blood-147-1147-C0041","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["PML","RARA"],"diseases":["APL"],"text":"According to ELN-DAVID 2025, in PML::RARA-positive acute promyelocytic leukemia at end of treatment, detectable bone-marrow PML::RARA/ABL1 ≥0.001% is MRD-positive but is classified as a warning response rather than definitive treatment failure."},{"id":"cloos-2026-blood-147-1147-C0042","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["PML","RARA"],"diseases":["APL"],"text":"According to ELN-DAVID 2025, during follow-up of PML::RARA-positive acute promyelocytic leukemia, bone-marrow PML::RARA/ABL1 <0.001% or undetectable qPCR MRD is MRD-negative with an optimal response."},{"id":"cloos-2026-blood-147-1147-C0043","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["PML","RARA"],"diseases":["APL"],"text":"According to ELN-DAVID 2025, during follow-up of PML::RARA-positive acute promyelocytic leukemia, conversion from undetectable to detectable bone-marrow PML::RARA/ABL1 ≥0.001% meets the definition of MRD relapse."},{"id":"cloos-2026-blood-147-1147-C0044","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["PML","RARA"],"diseases":["APL"],"text":"According to ELN-DAVID 2025, PML::RARA-positive acute promyelocytic leukemia should undergo MRD monitoring at end of treatment, not during ongoing treatment."},{"id":"cloos-2026-blood-147-1147-C0045","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["PML","RARA"],"diseases":["APL"],"text":"According to ELN-DAVID 2025, PML::RARA-positive acute promyelocytic leukemia with MRD positivity at end of treatment should undergo regular post-treatment MRD monitoring to document stability or conversion to MRD negativity."},{"id":"cloos-2026-blood-147-1147-C0046","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["PML","RARA"],"diseases":["APL"],"text":"According to ELN-DAVID 2025, bone marrow is the preferred specimen for PML::RARA MRD monitoring during follow-up of acute promyelocytic leukemia; peripheral blood is not recommended because it typically becomes MRD-positive only near hematologic relapse."},{"id":"cloos-2026-blood-147-1147-C0047","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["PML","RARA"],"diseases":["APL"],"text":"According to ELN-DAVID 2025, suspected PML::RARA qPCR MRD relapse in acute promyelocytic leukemia should be confirmed within 4 weeks with a second consecutive sample, preferably paired peripheral blood and bone marrow."},{"id":"cloos-2026-blood-147-1147-C0048","paper":"cloos-2026-blood-147-1147","category":"treatment","tier":"guideline criterion","genes":["PML","RARA"],"diseases":["APL"],"text":"According to ELN-DAVID 2025, PML::RARA-positive acute promyelocytic leukemia with MRD relapse warrants strong consideration of immediate intervention."},{"id":"cloos-2026-blood-147-1147-C0049","paper":"cloos-2026-blood-147-1147","category":"treatment","tier":"guideline criterion","genes":["KMT2A"],"diseases":["AML"],"text":"For KMT2A-rearranged acute myeloid leukemia with persistent fusion-gene MRD in remission, ELN-DAVID 2025 states that the role of clinical intervention at specific thresholds and treatment time points remains to be established."},{"id":"cloos-2026-blood-147-1147-C0050","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["KMT2A","MLLT3"],"diseases":["AML"],"text":"According to ELN-DAVID 2025, KMT2A::MLLT3 acute myeloid leukemia should be monitored by qPCR when available or by MFC for MRD assessment."},{"id":"cloos-2026-blood-147-1147-C0051","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["KMT2A","MLLT3"],"diseases":["AML"],"text":"According to ELN-DAVID 2025, KMT2A::MLLT3 acute myeloid leukemia should undergo bone-marrow qPCR and MFC MRD assessment after 2 cycles or before HCT and at end of treatment."},{"id":"cloos-2026-blood-147-1147-C0052","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["KMT2A","MLLT3"],"diseases":["AML"],"text":"According to ELN-DAVID 2025, during follow-up of KMT2A::MLLT3 acute myeloid leukemia, qPCR may use peripheral blood or bone marrow, while MFC is recommended in bone marrow every 3 months for 12 months."},{"id":"cloos-2026-blood-147-1147-C0055","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["FLT3"],"diseases":["AML"],"text":"According to ELN-DAVID 2025, FLT3-ITD MRD assessment by UHS-NGS is recommended after 2 treatment cycles and before alloHCT in FLT3-ITD-mutated acute myeloid leukemia."},{"id":"cloos-2026-blood-147-1147-C0057","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["FLT3"],"diseases":["AML"],"text":"According to ELN-DAVID 2025, FLT3-ITD UHS-NGS MRD positivity in acute myeloid leukemia is defined as a result above the assay limit of detection, and the assay should achieve at least 0.01% sensitivity."},{"id":"cloos-2026-blood-147-1147-C0058","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["FLT3"],"diseases":["AML"],"text":"According to ELN-DAVID 2025, in FLT3-ITD-mutated acute myeloid leukemia after 2 intensive-chemotherapy cycles or before alloHCT, using bone marrow preferentially over peripheral blood, FLT3-ITD below the UHS-NGS limit of detection is MRD-negative with an optimal response."},{"id":"cloos-2026-blood-147-1147-C0059","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["FLT3"],"diseases":["AML"],"text":"According to ELN-DAVID 2025, in FLT3-ITD-mutated acute myeloid leukemia after 2 intensive-chemotherapy cycles or before alloHCT, using bone marrow preferentially over peripheral blood, FLT3-ITD at or above the UHS-NGS limit of detection is MRD-positive and indicates high risk of treatment failure."},{"id":"cloos-2026-blood-147-1147-C0060","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["FLT3"],"diseases":["AML"],"text":"According to ELN-DAVID 2025, in FLT3-ITD-mutated acute myeloid leukemia at end of treatment after consolidation or alloHCT, using bone marrow preferentially over peripheral blood, FLT3-ITD below the UHS-NGS limit of detection is MRD-negative with an optimal response. Use of FLT3-ITD UHS-NGS at end of treatment is based on limited evidence and expert consensus."},{"id":"cloos-2026-blood-147-1147-C0061","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["FLT3"],"diseases":["AML"],"text":"According to ELN-DAVID 2025, in FLT3-ITD-mutated acute myeloid leukemia at end of treatment after consolidation or alloHCT, using bone marrow preferentially over peripheral blood, FLT3-ITD at or above the UHS-NGS limit of detection is MRD-positive and indicates high risk of treatment failure. Use of FLT3-ITD UHS-NGS at end of treatment is based on limited evidence and expert consensus."},{"id":"cloos-2026-blood-147-1147-C0062","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["FLT3"],"diseases":["AML"],"text":"According to ELN-DAVID 2025, during follow-up of FLT3-ITD-mutated acute myeloid leukemia, FLT3-ITD below the UHS-NGS limit of detection is MRD-negative with an optimal response. Use of FLT3-ITD UHS-NGS during follow-up is based on limited evidence and expert consensus."},{"id":"cloos-2026-blood-147-1147-C0063","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["FLT3"],"diseases":["AML"],"text":"According to ELN-DAVID 2025, during follow-up of FLT3-ITD-mutated acute myeloid leukemia, FLT3-ITD at or above the UHS-NGS limit of detection meets the definition of MRD relapse. Use of FLT3-ITD UHS-NGS during follow-up is based on limited evidence and expert consensus."},{"id":"cloos-2026-blood-147-1147-C0064","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["FLT3"],"diseases":["AML"],"text":"According to ELN-DAVID 2025, FLT3-ITD UHS-NGS MRD relapse in acute myeloid leukemia may not require repeat confirmation because it is associated with imminent relapse."},{"id":"cloos-2026-blood-147-1147-C0065","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["FLT3"],"diseases":["AML"],"text":"According to ELN-DAVID 2025, in FLT3-ITD-mutated acute myeloid leukemia, low-level FLT3-ITD UHS-NGS MRD at or above the assay limit of detection but <0.01% VAF should be promptly confirmed in a repeat sample, particularly when the FLT3-ITD clone differs from that detected at diagnosis."},{"id":"cloos-2026-blood-147-1147-C0066","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["FLT3"],"diseases":["AML"],"text":"According to ELN-DAVID 2025, when multiple FLT3-ITD clones are detected by UHS-NGS MRD in acute myeloid leukemia, the major FLT3-ITD clone should currently be used to determine the MRD level."},{"id":"cloos-2026-blood-147-1147-C0067","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["FLT3"],"diseases":["AML"],"text":"FLT3-ITD UHS-NGS MRD positivity identifies patients with acute myeloid leukemia at increased risk of relapse and death."},{"id":"cloos-2026-blood-147-1147-C0068","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["FLT3"],"diseases":["AML"],"text":"According to ELN-DAVID 2025, FLT3-ITD UHS-NGS should not be the sole MRD test during follow-up of FLT3-ITD-mutated acute myeloid leukemia when other MRD markers are available, because FLT3-ITD-negative relapses can occur."},{"id":"cloos-2026-blood-147-1147-C0069","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["NPM1","FLT3"],"diseases":["AML"],"text":"According to ELN-DAVID 2025, in acute myeloid leukemia with both NPM1 mutation and FLT3-ITD, NPM1 MRD testing can serve as a stand-alone marker when FLT3-ITD UHS-NGS is unavailable."},{"id":"cloos-2026-blood-147-1147-C0071","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["FLT3"],"diseases":["AML"],"text":"According to ELN-DAVID 2025, no warning category is defined for FLT3-ITD UHS-NGS MRD at any time point in acute myeloid leukemia because current evidence does not support a safe or stable low-level FLT3-ITD MRD state."},{"id":"cloos-2026-blood-147-1147-C0072","paper":"cloos-2026-blood-147-1147","category":"treatment","tier":"guideline criterion","genes":["FLT3"],"diseases":["AML"],"text":"According to ELN-DAVID 2025, sorafenib maintenance after alloHCT is effective and recommended for FLT3-mutated acute myeloid leukemia irrespective of pretransplant MFC-MRD status."},{"id":"cloos-2026-blood-147-1147-C0073","paper":"cloos-2026-blood-147-1147","category":"treatment","tier":"guideline criterion","genes":["FLT3","NPM1"],"diseases":["AML"],"text":"According to ELN-DAVID 2025, gilteritinib maintenance after alloHCT is effective and recommended for FLT3-ITD-mutated acute myeloid leukemia with FLT3-ITD UHS-NGS MRD positivity before alloHCT or around day 30 after alloHCT; benefit was especially evident with a single FLT3-ITD clone and co-mutated NPM1."},{"id":"cloos-2026-blood-147-1147-C0074","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["ANKRD26","CEBPA","DDX41","ETV6","GATA2","RUNX1","TP53"],"diseases":["AML"],"text":"According to ELN-DAVID 2025, mutations in germline-predisposition genes ANKRD26, CEBPA, DDX41, ETV6, GATA2, RUNX1, or TP53 should not be counted as MRD at remission assessment after intensive chemotherapy or before alloHCT in acute myeloid leukemia, because persistence of these mutations is not prognostic at these time points."},{"id":"cloos-2026-blood-147-1147-C0076","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["DNMT3A","TET2","ASXL1"],"diseases":["AML"],"text":"According to ELN-DAVID 2025, age-related clonal-haematopoiesis mutations in DNMT3A, TET2, or ASXL1 should not be counted as MRD at remission assessment after intensive chemotherapy or before alloHCT in acute myeloid leukemia, because persistence of these mutations is not prognostic at these time points."},{"id":"cloos-2026-blood-147-1147-C0078","paper":"cloos-2026-blood-147-1147","category":"treatment","tier":"guideline criterion","genes":["FLT3"],"diseases":["AML"],"text":"For acute myeloid leukemia receiving standard-of-care FLT3-inhibitor maintenance, ELN-DAVID 2025 states that data are very limited to support stopping the FLT3 inhibitor based on MRD results."},{"id":"cloos-2026-blood-147-1147-C0079","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["NPM1"],"diseases":["AML"],"text":"According to ELN-DAVID 2025, cDNA is currently the recommended material for NPM1 MRD testing in acute myeloid leukemia."},{"id":"cloos-2026-blood-147-1147-C0080","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["NPM1","FLT3"],"diseases":["AML"],"text":"According to ELN-DAVID 2025, acute myeloid leukemia with both NPM1 mutation and FLT3-ITD should undergo NPM1 qPCR MRD assessment and, when available, FLT3-ITD UHS-NGS MRD assessment."},{"id":"cloos-2026-blood-147-1147-C0081","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["NPM1","FLT3"],"diseases":["AML"],"text":"According to ELN-DAVID 2025, in acute myeloid leukemia with both NPM1 mutation and FLT3-ITD, peripheral-blood NPM1 qPCR is recommended after 2 treatment cycles or before HCT."},{"id":"cloos-2026-blood-147-1147-C0082","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["NPM1","FLT3"],"diseases":["AML"],"text":"According to ELN-DAVID 2025, in acute myeloid leukemia with both NPM1 mutation and FLT3-ITD, bone-marrow NPM1 qPCR is recommended at end of treatment."},{"id":"cloos-2026-blood-147-1147-C0083","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["FLT3","NPM1"],"diseases":["AML"],"text":"According to ELN-DAVID 2025, FLT3-ITD-mutated, NPM1-wild-type acute myeloid leukemia should use FLT3-ITD UHS-NGS for MRD assessment when available, with MFC as the alternative when UHS-NGS is unavailable."},{"id":"cloos-2026-blood-147-1147-C0084","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["NPM1"],"diseases":["AML"],"text":"According to ELN-DAVID 2025, NPM1 is a particularly well-validated molecular marker for serial UHS-NGS MRD monitoring after alloHCT in acute myeloid leukemia."},{"id":"cloos-2026-blood-147-1147-C0086","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["NPM1"],"diseases":["AML"],"text":"According to ELN-DAVID 2025, after 2 intensive-chemotherapy cycles in NPM1-mutated acute myeloid leukemia, peripheral blood is preferred over bone marrow for qPCR MRD assessment because bone-marrow positivity is common at that time point and does not sufficiently discriminate risk groups."},{"id":"cloos-2026-blood-147-1147-C0087","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["RUNX1","RUNX1T1","CBFB","MYH11"],"diseases":["AML"],"text":"According to ELN-DAVID 2025, during the first 12 months of follow-up for RUNX1::RUNX1T1- or CBFB::MYH11-positive acute myeloid leukemia, peripheral-blood qPCR every 4-6 weeks is preferred because relapse can occur rapidly; bone marrow remains an allowed specimen."},{"id":"cloos-2026-blood-147-1147-C0088","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["PML","RARA"],"diseases":["APL"],"text":"According to ELN-DAVID 2025, no warning category is defined for PML::RARA MRD during follow-up of acute promyelocytic leukemia because current evidence does not support a safe or stable low-level PML::RARA MRD state."},{"id":"cloos-2026-blood-147-1147-C0093","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["NPM1"],"diseases":["AML"],"text":"According to ELN-DAVID 2025, a warning NPM1 qPCR MRD response during follow-up of NPM1-mutated acute myeloid leukemia should prompt repeat MRD assessment after about 4 weeks, whether the warning result is from peripheral blood or bone marrow."},{"id":"cloos-2026-blood-147-1147-C0095","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["RUNX1","RUNX1T1","CBFB","MYH11"],"diseases":["AML"],"text":"According to ELN-DAVID 2025, a warning qPCR MRD response during follow-up of RUNX1::RUNX1T1- or CBFB::MYH11-positive core-binding-factor acute myeloid leukemia should prompt repeat MRD assessment after about 4 weeks."},{"id":"cloos-2026-blood-147-1147-C0096","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["RUNX1","RUNX1T1","CBFB","MYH11"],"diseases":["AML"],"text":"According to ELN-DAVID 2025, bone marrow is preferred for qPCR MRD assessment after cycle 2 and at end of treatment in RUNX1::RUNX1T1- or CBFB::MYH11-positive core-binding-factor acute myeloid leukemia."},{"id":"cloos-2026-blood-147-1147-C0097","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["PML","RARA"],"diseases":["APL"],"text":"According to ELN-DAVID 2025, chemotherapy-treated high-risk PML::RARA-positive acute promyelocytic leukemia should undergo follow-up MRD monitoring even when MRD is negative at end of treatment."},{"id":"cloos-2026-blood-147-1147-C0098","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["PML","RARA"],"diseases":["APL"],"text":"According to ELN-DAVID 2025, routine follow-up PML::RARA MRD assessment is generally not recommended after ATO-based treatment for acute promyelocytic leukemia because relapse risk is very low."},{"id":"cloos-2026-blood-147-1147-C0099","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["PML","RARA"],"diseases":["APL"],"text":"According to ELN-DAVID 2025, an end-of-treatment PML::RARA qPCR warning response in acute promyelocytic leukemia should prompt repeat MRD assessment after about 4 weeks."},{"id":"cloos-2026-blood-147-1147-C0100","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["NPM1","FLT3"],"diseases":["AML"],"text":"According to ELN-DAVID 2025, in acute myeloid leukemia with both NPM1 mutation and FLT3-ITD, FLT3-ITD UHS-NGS after 2 cycles or before HCT should preferentially use bone marrow rather than peripheral blood."},{"id":"cloos-2026-blood-147-1147-C0103","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["NPM1"],"diseases":["AML"],"text":"According to ELN-DAVID 2025, dPCR is an available validated alternative to qPCR for NPM1 MRD assessment in acute myeloid leukemia."},{"id":"cloos-2026-blood-147-1147-C0105","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["RUNX1","RUNX1T1","CBFB","MYH11"],"diseases":["AML"],"text":"According to ELN-DAVID 2025, laboratories may use their own clinically validated qPCR MRD thresholds for RUNX1::RUNX1T1- or CBFB::MYH11-positive core-binding-factor acute myeloid leukemia as an alternative to the recommended ≥3-log10 reduction rule."},{"id":"cloos-2026-blood-147-1147-C0106","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["NPM1","FLT3"],"diseases":["AML"],"text":"According to ELN-DAVID 2025, at diagnosis of favorable-risk NPM1-mutated acute myeloid leukemia without FLT3-ITD, qPCR may use peripheral blood when blasts are ≥20% or bone marrow."},{"id":"cloos-2026-blood-147-1147-C0107","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["PML","RARA"],"diseases":["APL"],"text":"According to ELN-DAVID 2025, at diagnosis of PML::RARA-positive acute promyelocytic leukemia, qPCR may use peripheral blood when blasts are ≥20% or bone marrow."},{"id":"cloos-2026-blood-147-1147-C0108","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["CEBPA"],"diseases":["AML"],"text":"According to ELN-DAVID 2025, at diagnosis of acute myeloid leukemia with a bZIP in-frame CEBPA mutation, MFC MRD assessment may use peripheral blood when blasts are ≥20% or bone marrow."},{"id":"cloos-2026-blood-147-1147-C0109","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["FLT3","NPM1"],"diseases":["AML"],"text":"According to ELN-DAVID 2025, at diagnosis of FLT3-ITD-mutated, NPM1-wild-type acute myeloid leukemia, the MRD specimen may be peripheral blood when blasts are ≥20% or bone marrow."},{"id":"cloos-2026-blood-147-1147-C0110","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["FLT3","NPM1"],"diseases":["AML"],"text":"According to ELN-DAVID 2025, at diagnosis of acute myeloid leukemia with both FLT3-ITD and NPM1 mutation, the MRD specimen may be peripheral blood when blasts are ≥20% or bone marrow."},{"id":"cloos-2026-blood-147-1147-C0111","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["KMT2A","MLLT3"],"diseases":["AML"],"text":"According to ELN-DAVID 2025, at diagnosis of KMT2A::MLLT3 acute myeloid leukemia, the MRD specimen may be peripheral blood when blasts are ≥20% or bone marrow."},{"id":"cloos-2026-blood-147-1147-C0112","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["FLT3","NPM1"],"diseases":["AML"],"text":"According to ELN-DAVID 2025, during follow-up of FLT3-ITD-mutated, NPM1-wild-type acute myeloid leukemia, FLT3-ITD UHS-NGS may use peripheral blood or bone marrow; follow-up use is based on limited evidence and expert opinion."},{"id":"cloos-2026-blood-147-1147-C0113","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["FLT3","NPM1"],"diseases":["AML"],"text":"According to ELN-DAVID 2025, during follow-up of FLT3-ITD-mutated, NPM1-wild-type acute myeloid leukemia when MFC is used, bone-marrow MFC is recommended every 3 months for 12 months."},{"id":"cloos-2026-blood-147-1147-C0114","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["FLT3","NPM1"],"diseases":["AML"],"text":"According to ELN-DAVID 2025, for FLT3-ITD-mutated, NPM1-wild-type acute myeloid leukemia after 2 cycles or before HCT, bone marrow is the recommended specimen when MFC is used as the alternative MRD assay."},{"id":"cloos-2026-blood-147-1147-C0115","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["FLT3","NPM1"],"diseases":["AML"],"text":"According to ELN-DAVID 2025, for FLT3-ITD-mutated, NPM1-wild-type acute myeloid leukemia at end of treatment, bone marrow is the recommended specimen when MFC is used as the alternative MRD assay."},{"id":"cloos-2026-blood-147-1147-C0116","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["FLT3","NPM1"],"diseases":["AML"],"text":"According to ELN-DAVID 2025, during follow-up of acute myeloid leukemia with both FLT3-ITD and NPM1 mutation, NPM1 qPCR may use peripheral blood or bone marrow."},{"id":"cloos-2026-blood-147-1147-C0118","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["KMT2A"],"diseases":["AML"],"text":"According to ELN-DAVID 2025, adverse-risk acute myeloid leukemia with a KMT2A fusion should use qPCR when available or MFC as the MRD assay strategy."},{"id":"cloos-2026-blood-147-1147-C0119","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["KMT2A"],"diseases":["AML"],"text":"According to ELN-DAVID 2025, at diagnosis of adverse-risk acute myeloid leukemia with a KMT2A fusion, the MRD specimen may be peripheral blood when blasts are ≥20% or bone marrow."},{"id":"cloos-2026-blood-147-1147-C0120","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["KMT2A"],"diseases":["AML"],"text":"According to ELN-DAVID 2025, adverse-risk acute myeloid leukemia with a KMT2A fusion should undergo bone-marrow qPCR and MFC MRD assessment after 2 cycles or before HCT."},{"id":"cloos-2026-blood-147-1147-C0121","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["KMT2A"],"diseases":["AML"],"text":"According to ELN-DAVID 2025, adverse-risk acute myeloid leukemia with a KMT2A fusion should undergo bone-marrow qPCR and MFC MRD assessment at end of treatment."},{"id":"cloos-2026-blood-147-1147-C0122","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["KMT2A"],"diseases":["AML"],"text":"According to ELN-DAVID 2025, during follow-up of adverse-risk acute myeloid leukemia with a KMT2A fusion, bone-marrow MFC is recommended every 3 months for 12 months."},{"id":"cloos-2026-blood-147-1147-C0123","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["NPM1"],"diseases":["AML"],"text":"According to ELN-DAVID 2025, if NPM1 mutation is present in ELN adverse-risk acute myeloid leukemia, the NPM1 MRD recommendations used for the ELN intermediate-risk molecular subgroup should be applied."},{"id":"cloos-2026-blood-147-1147-C0124","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["FLT3"],"diseases":["AML"],"text":"According to ELN-DAVID 2025, if FLT3-ITD is present in ELN adverse-risk acute myeloid leukemia, the FLT3-ITD MRD recommendations used for the ELN intermediate-risk molecular subgroup should be applied."},{"id":"cloos-2026-blood-147-1147-C0125","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["RUNX1","RUNX1T1","CBFB","MYH11"],"diseases":["AML"],"text":"According to ELN-DAVID 2025, in RUNX1::RUNX1T1- or CBFB::MYH11-positive core-binding-factor acute myeloid leukemia that has never become MRD-negative, a ≥1-log10 increase from the measured nadir within the same tissue defines MRD relapse regardless of the usual 0.1% threshold."},{"id":"cloos-2026-blood-147-1147-C0126","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["PML","RARA"],"diseases":["APL"],"text":"According to ELN-DAVID 2025, in PML::RARA-positive acute promyelocytic leukemia that has never become MRD-negative, a ≥1-log10 increase from the measured nadir within the same tissue defines MRD relapse regardless of the usual 0.001% threshold."},{"id":"cloos-2026-blood-147-1147-C0127","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["RUNX1","RUNX1T1","CBFB","MYH11"],"diseases":["AML"],"text":"According to ELN-DAVID 2025, an end-of-treatment qPCR warning response in RUNX1::RUNX1T1- or CBFB::MYH11-positive core-binding-factor acute myeloid leukemia should prompt repeat MRD assessment after about 4 weeks."},{"id":"cloos-2026-blood-147-1147-C0128","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["FLT3"],"diseases":["AML"],"text":"According to ELN-DAVID 2025, when multiple FLT3-ITD clones are present in UHS-NGS MRD testing for acute myeloid leukemia, the VAF and sequence of each FLT3-ITD clone should be reported."},{"id":"d-hner-2022-blood-140-1345-C0001","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"guideline criterion","genes":["PML","RARA","RUNX1","RUNX1T1","CBFB","MYH11","MLLT3","KMT2A","DEK","NUP214","GATA2","MECOM","NPM1","CEBPA","BCR","ABL1"],"diseases":["AML"],"text":"Under the 2022 International Consensus Classification (ICC), PML::RARA, RUNX1::RUNX1T1, CBFB::MYH11, MLLT3::KMT2A, DEK::NUP214, inv(3)/t(3;3) involving GATA2 and MECOM, mutated NPM1, and in-frame bZIP CEBPA mutations are AML-defining recurrent abnormalities at ≥10% blasts; BCR::ABL1 requires ≥20% blasts because of overlap with chronic myeloid leukemia."},{"id":"d-hner-2022-blood-140-1345-C0002","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"guideline criterion","genes":["IRF2BP2","RARA","NPM1","ZBTB16","STAT5B","STAT3","TBL1XR1","FIP1L1","BCOR","BCR","ABL1"],"diseases":["AML","APL"],"text":"Under the 2022 ICC, IRF2BP2::RARA, NPM1::RARA, ZBTB16::RARA, STAT5B::RARA, STAT3::RARA, TBL1XR1::RARA, FIP1L1::RARA, and BCOR::RARA are recognized recurring RARA-rearranged APL entities and, as AML-defining recurrent abnormalities other than BCR::ABL1, establish AML/APL at ≥10% blasts."},{"id":"d-hner-2022-blood-140-1345-C0003","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"guideline criterion","genes":["AFF1","KMT2A","AFDN","MLLT10","TET1","ELL","MLLT1"],"diseases":["AML"],"text":"Under the 2022 ICC, AFF1::KMT2A, AFDN::KMT2A, MLLT10::KMT2A, TET1::KMT2A, KMT2A::ELL, and KMT2A::MLLT1 are recognized recurring KMT2A-rearranged AML entities and establish AML at ≥10% blasts."},{"id":"d-hner-2022-blood-140-1345-C0004","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"guideline criterion","genes":["MECOM","MYC","ETV6","RUNX1"],"diseases":["AML"],"text":"Under the 2022 ICC, t(2;3) involving MECOM, MYC/MECOM t(3;8), ETV6::MECOM, and MECOM::RUNX1 are recognized recurring MECOM-rearranged AML entities and establish AML at ≥10% blasts."},{"id":"d-hner-2022-blood-140-1345-C0005","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"guideline criterion","genes":["PRDM16","RPN1","RBM15","MRTFA","NPM1","MLF1","NUP98","NSD1","ETV6","MNX1","KAT6A","CREBBP","PICALM","MLLT10","KMD5A","FUS","ERG","RUNX1","CBFA2T3","GLIS2"],"diseases":["AML"],"text":"Under the 2022 ICC, PRDM16::RPN1, RBM15::MRTFA, NPM1::MLF1, NUP98::NSD1, ETV6::MNX1, KAT6A::CREBBP, PICALM::MLLT10, NUP98::KMD5A, FUS::ERG, RUNX1::CBFA2T3, CBFA2T3::GLIS2, and other NUP98 rearrangements are listed as rare recurring AML-defining genetic entities and establish AML at ≥10% blasts."},{"id":"d-hner-2022-blood-140-1345-C0006","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"guideline criterion","genes":["TP53"],"diseases":["AML","MDS/AML"],"text":"Under the 2022 ICC, when higher-priority recurrent AML-defining abnormalities are absent, a pathogenic somatic TP53 mutation with variant allele fraction ≥10%, with or without loss of the wild-type allele, defines TP53-mutated AML at ≥20% blasts; the corresponding 10%-19% blast category is MDS/AML."},{"id":"d-hner-2022-blood-140-1345-C0007","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"guideline criterion","genes":["TP53","ASXL1","BCOR","EZH2","RUNX1","SF3B1","SRSF2","STAG2","U2AF1","ZRSR2"],"diseases":["AML","MDS","MDS/AML"],"text":"Under the 2022 ICC, when higher-priority recurrent AML-defining abnormalities and TP53-mutated disease are absent, pathogenic mutations in ASXL1, BCOR, EZH2, RUNX1, SF3B1, SRSF2, STAG2, U2AF1, or ZRSR2 define AML with myelodysplasia-related gene mutations at ≥20% blasts, irrespective of prior MDS; the corresponding 10%-19% blast category is MDS/AML."},{"id":"d-hner-2022-blood-140-1345-C0008","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["AML","MDS/AML"],"text":"Under the 2022 ICC, when higher-priority AML-defining categories are absent, del(5q)/t(5q)/add(5q), monosomy 7/del(7q), trisomy 8, del(12p)/t(12p)/add(12p), i(17q), monosomy 17/add(17p)/del(17p), del(20q), idic(X)(q13), or a complex karyotype of ≥3 unrelated chromosome abnormalities (excluding hyperdiploid karyotypes with ≥3 trisomies/polysomies and no structural abnormality) defines AML with myelodysplasia-related cytogenetic abnormality at ≥20% blasts and MDS/AML at 10%-19% blasts."},{"id":"d-hner-2022-blood-140-1345-C0009","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["AML"],"text":"Under the 2022 ICC, prior chemotherapy, radiotherapy, or immune intervention for a nonmyeloid neoplasm is recorded as a therapy-related diagnostic qualifier to the genetically defined AML category rather than as a separate AML entity."},{"id":"d-hner-2022-blood-140-1345-C0010","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["AML","MDS"],"text":"Under the 2022 ICC, a prior MDS is appended as a diagnostic qualifier to the AML category only when it was established by standard diagnostics more than 3 months before AML diagnosis."},{"id":"d-hner-2022-blood-140-1345-C0011","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"guideline criterion","genes":["TP53"],"diseases":["AML"],"text":"Under the 2022 ICC, the AML classification hierarchy is: recurrent AML-defining genetic abnormality first; otherwise TP53-mutated AML; otherwise AML with myelodysplasia-related gene mutations; otherwise AML with myelodysplasia-related cytogenetic abnormalities."},{"id":"d-hner-2022-blood-140-1345-C0012","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["MDS/MPN","CMML"],"text":"Under the 2022 ICC, for a patient with a prior MDS/MPN such as CMML, the MDS/MPN diagnosis is retained until blasts or blast equivalents reach ≥20%."},{"id":"d-hner-2022-blood-140-1345-C0013","paper":"d-hner-2022-blood-140-1345","category":"prognosis","tier":"guideline criterion","genes":["RUNX1","RUNX1T1","CBFB","MYH11","KIT","FLT3"],"diseases":["AML"],"text":"Under the 2022 ELN genetic risk classification, which is based mainly on intensively treated patients, RUNX1::RUNX1T1 and CBFB::MYH11 core-binding-factor AML are classified as favorable risk, and concurrent KIT and/or FLT3 mutation does not change that category."},{"id":"d-hner-2022-blood-140-1345-C0014","paper":"d-hner-2022-blood-140-1345","category":"prognosis","tier":"guideline criterion","genes":["NPM1","FLT3"],"diseases":["AML"],"text":"Under the 2022 ELN genetic risk classification, which is based mainly on intensively treated patients, NPM1-mutated AML without FLT3-ITD is classified as favorable risk unless adverse-risk cytogenetic abnormalities are present."},{"id":"d-hner-2022-blood-140-1345-C0015","paper":"d-hner-2022-blood-140-1345","category":"prognosis","tier":"guideline criterion","genes":["CEBPA"],"diseases":["AML"],"text":"Under the 2022 ELN genetic risk classification, which is based mainly on intensively treated patients, in-frame bZIP CEBPA-mutated AML is classified as favorable risk whether the CEBPA mutation is monoallelic or biallelic."},{"id":"d-hner-2022-blood-140-1345-C0016","paper":"d-hner-2022-blood-140-1345","category":"prognosis","tier":"guideline criterion","genes":["NPM1","FLT3"],"diseases":["AML"],"text":"Under the 2022 ELN genetic risk classification, which is based mainly on intensively treated patients, NPM1-mutated AML with FLT3-ITD is classified as intermediate risk irrespective of FLT3-ITD allelic ratio when no adverse-risk genetic lesion is present."},{"id":"d-hner-2022-blood-140-1345-C0017","paper":"d-hner-2022-blood-140-1345","category":"prognosis","tier":"guideline criterion","genes":["NPM1","FLT3"],"diseases":["AML"],"text":"Under the 2022 ELN genetic risk classification, which is based mainly on intensively treated patients, NPM1-wild-type AML with FLT3-ITD is classified as intermediate risk irrespective of FLT3-ITD allelic ratio when no adverse-risk genetic lesion is present."},{"id":"d-hner-2022-blood-140-1345-C0018","paper":"d-hner-2022-blood-140-1345","category":"prognosis","tier":"guideline criterion","genes":["MLLT3","KMT2A"],"diseases":["AML"],"text":"Under the 2022 ELN genetic risk classification, which is based mainly on intensively treated patients, AML with t(9;11)/MLLT3::KMT2A is classified as intermediate risk, and this lesion takes precedence over rare concurrent adverse-risk gene mutations."},{"id":"d-hner-2022-blood-140-1345-C0019","paper":"d-hner-2022-blood-140-1345","category":"prognosis","tier":"guideline criterion","genes":["DEK","NUP214"],"diseases":["AML"],"text":"Under the 2022 ELN genetic risk classification, which is based mainly on intensively treated patients, DEK::NUP214 AML is classified as adverse risk."},{"id":"d-hner-2022-blood-140-1345-C0020","paper":"d-hner-2022-blood-140-1345","category":"prognosis","tier":"guideline criterion","genes":["KMT2A","MLLT3"],"diseases":["AML"],"text":"Under the 2022 ELN genetic risk classification, which is based mainly on intensively treated patients, KMT2A-rearranged AML other than t(9;11)/MLLT3::KMT2A, excluding KMT2A partial tandem duplication, is classified as adverse risk."},{"id":"d-hner-2022-blood-140-1345-C0021","paper":"d-hner-2022-blood-140-1345","category":"prognosis","tier":"guideline criterion","genes":["BCR","ABL1"],"diseases":["AML"],"text":"Under the 2022 ELN genetic risk classification, which is based mainly on intensively treated patients, BCR::ABL1-positive AML is classified as adverse risk."},{"id":"d-hner-2022-blood-140-1345-C0022","paper":"d-hner-2022-blood-140-1345","category":"prognosis","tier":"guideline criterion","genes":["KAT6A","CREBBP"],"diseases":["AML"],"text":"Under the 2022 ELN genetic risk classification, which is based mainly on intensively treated patients, KAT6A::CREBBP AML is classified as adverse risk."},{"id":"d-hner-2022-blood-140-1345-C0023","paper":"d-hner-2022-blood-140-1345","category":"prognosis","tier":"guideline criterion","genes":["GATA2","MECOM"],"diseases":["AML"],"text":"Under the 2022 ELN genetic risk classification, which is based mainly on intensively treated patients, AML with inv(3)/t(3;3) involving GATA2 and MECOM is classified as adverse risk."},{"id":"d-hner-2022-blood-140-1345-C0024","paper":"d-hner-2022-blood-140-1345","category":"prognosis","tier":"guideline criterion","genes":["MECOM"],"diseases":["AML"],"text":"Under the 2022 ELN genetic risk classification, which is based mainly on intensively treated patients, AML with other t(3q26.2;v) MECOM rearrangements is classified as adverse risk."},{"id":"d-hner-2022-blood-140-1345-C0025","paper":"d-hner-2022-blood-140-1345","category":"prognosis","tier":"guideline criterion","genes":["ASXL1","BCOR","EZH2","RUNX1","SF3B1","SRSF2","STAG2","U2AF1","ZRSR2"],"diseases":["AML"],"text":"Under the 2022 ELN genetic risk classification, which is based mainly on intensively treated patients, pathogenic ASXL1, BCOR, EZH2, RUNX1, SF3B1, SRSF2, STAG2, U2AF1, or ZRSR2 mutations are adverse-risk markers in AML, including de novo AML, but should not currently be used as adverse-risk markers when they co-occur with a favorable-risk AML subtype."},{"id":"d-hner-2022-blood-140-1345-C0026","paper":"d-hner-2022-blood-140-1345","category":"prognosis","tier":"guideline criterion","genes":["TP53"],"diseases":["AML"],"text":"Under the 2022 ELN genetic risk classification, which is based mainly on intensively treated patients, TP53 mutation with variant allele fraction ≥10% is an adverse-risk marker in AML irrespective of monoallelic or biallelic status."},{"id":"d-hner-2022-blood-140-1345-C0028","paper":"d-hner-2022-blood-140-1345","category":"prognosis","tier":"guideline criterion","genes":["NPM1"],"diseases":["AML"],"text":"Under the 2022 ELN genetic risk classification, which is based mainly on intensively treated patients, NPM1-mutated AML with adverse-risk cytogenetic abnormalities is classified as adverse risk."},{"id":"d-hner-2022-blood-140-1345-C0029","paper":"d-hner-2022-blood-140-1345","category":"prognosis","tier":"guideline criterion","genes":["IDH1","IDH2","DNMT3A"],"diseases":["AML"],"text":"The 2022 ELN genetic risk classification, which is based mainly on intensively treated patients, does not assign IDH1-, IDH2-, or DNMT3A-mutated AML to a distinct risk group on the available evidence."},{"id":"d-hner-2022-blood-140-1345-C0032","paper":"d-hner-2022-blood-140-1345","category":"biomarker","tier":"guideline criterion","genes":["FLT3"],"diseases":["AML"],"text":"The 2022 ELN recommendations recommend testing for both FLT3 internal tandem duplications and FLT3 tyrosine-kinase-domain mutations at AML diagnosis."},{"id":"d-hner-2022-blood-140-1345-C0033","paper":"d-hner-2022-blood-140-1345","category":"biomarker","tier":"guideline criterion","genes":["CEBPA"],"diseases":["AML"],"text":"The 2022 ELN recommendations specify that CEBPA testing in AML should report whether a variant is an in-frame bZIP-region mutation because that molecular definition is used for favorable-risk classification."},{"id":"d-hner-2022-blood-140-1345-C0034","paper":"d-hner-2022-blood-140-1345","category":"biomarker","tier":"guideline criterion","genes":["NPM1","RUNX1","RUNX1T1","CBFB","MYH11"],"diseases":["AML"],"text":"Under the ELN MRD framework incorporated into the 2022 AML recommendations, baseline qPCR or dPCR assessment is recommended in NPM1-mutated, RUNX1::RUNX1T1, and CBFB::MYH11 AML to establish a molecular baseline for subsequent MRD monitoring."},{"id":"d-hner-2022-blood-140-1345-C0035","paper":"d-hner-2022-blood-140-1345","category":"biomarker","tier":"guideline criterion","genes":["NPM1","RUNX1","RUNX1T1","CBFB","MYH11"],"diseases":["AML"],"text":"Under the ELN MRD framework incorporated into the 2022 AML recommendations, mutated NPM1, RUNX1::RUNX1T1, and CBFB::MYH11 are robustly validated qPCR targets for molecular MRD monitoring in AML."},{"id":"d-hner-2022-blood-140-1345-C0036","paper":"d-hner-2022-blood-140-1345","category":"biomarker","tier":"guideline criterion","genes":["KMT2A","MLLT3","DEK","NUP214","BCR","ABL1","WT1","NPM1"],"diseases":["AML"],"text":"Under the ELN MRD framework incorporated into the 2022 AML recommendations, KMT2A::MLLT3, DEK::NUP214, BCR::ABL1, and WT1 expression can be used as qPCR MRD targets in AML but are less well validated for this role than NPM1 and the core-binding-factor fusion targets."},{"id":"d-hner-2022-blood-140-1345-C0037","paper":"d-hner-2022-blood-140-1345","category":"biomarker","tier":"guideline criterion","genes":["DNMT3A","TET2","ASXL1"],"diseases":["AML"],"text":"Under the ELN MRD framework incorporated into the 2022 AML recommendations, DNMT3A, TET2, and ASXL1 mutations consistent with premalignant clonal hematopoiesis should not be interpreted as AML MRD in NGS-based assessment."},{"id":"d-hner-2022-blood-140-1345-C0038","paper":"d-hner-2022-blood-140-1345","category":"biomarker","tier":"guideline criterion","genes":["NPM1","RUNX1","RUNX1T1","CBFB","MYH11"],"diseases":["AML"],"text":"Under the ELN MRD framework incorporated into the 2022 AML recommendations, molecular MRD relapse in NPM1-mutated, RUNX1::RUNX1T1, or CBFB::MYH11 AML assessed by qPCR is defined as conversion from MRD-negative to MRD-positive or a ≥1 log10 rise between two positive samples and should be rapidly confirmed in a second consecutive sample from the same tissue source."},{"id":"d-hner-2022-blood-140-1345-C0039","paper":"d-hner-2022-blood-140-1345","category":"biomarker","tier":"guideline criterion","genes":["NPM1","RUNX1","RUNX1T1","CBFB","MYH11"],"diseases":["AML"],"text":"Under the ELN MRD framework incorporated into the 2022 AML recommendations, after consolidation in NPM1-mutated, RUNX1::RUNX1T1, or CBFB::MYH11 AML, qPCR MRD ≥2% or failure to achieve a 3-4 log transcript reduction is a clinically relevant threshold at which treatment modification, including consideration of allogeneic HCT, may be appropriate."},{"id":"d-hner-2022-blood-140-1345-C0040","paper":"d-hner-2022-blood-140-1345","category":"biomarker","tier":"guideline criterion","genes":["IDH1","IDH2","FLT3"],"diseases":["AML"],"text":"The 2022 ELN recommendations recommend molecular reassessment at AML relapse for IDH1, IDH2, and FLT3 because act
