<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Evidence cards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#efeef4;
    --panel:#f7f6fa;
    --ink:#191825;
    --muted:#6e6a82;
    --rule:#d8d5e3;
    --azure:#2b4c8c;
    --eosin:#a31e63;
    --focus:#a31e63;
    --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --display:"Newsreader",Georgia,serif;
    --cat-diagnosis:#4a3f8f;
    --cat-prognosis:#a31e63;
    --cat-treatment:#1d6f63;
    --cat-biomarker:#2b4c8c;
    --cat-germline:#8a5a12;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);color:var(--ink);font-family:var(--sans);
    font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;
  }
  a{color:var(--azure)}
  button{font:inherit;color:inherit}

  /* ---------- masthead ---------- */
  header.masthead{
    border-bottom:1px solid var(--rule);
    padding:22px 28px 16px;
    display:flex;flex-wrap:wrap;gap:18px;align-items:baseline;justify-content:space-between;
  }
  .wordmark{font-family:var(--display);font-size:31px;line-height:1;letter-spacing:-.01em;font-weight:500;margin:0}
  .wordmark em{font-style:italic;color:var(--eosin)}
  .provenance{font-family:var(--mono);font-size:11.5px;color:var(--muted);letter-spacing:.02em}

  /* ---------- shell ---------- */
  .shell{display:grid;grid-template-columns:288px minmax(0,1fr);gap:0;align-items:start}
  body.full-mode.detail-open .shell{grid-template-columns:1fr 3fr 1fr}
  body.full-mode.detail-open .rail{grid-column:1}
  body.full-mode.detail-open .detail{grid-column:2;grid-row:1}
  body.full-mode.detail-open .main{grid-column:3;grid-row:1;padding-left:20px;padding-right:20px}
  .rail{
    border-right:1px solid var(--rule);padding:20px 20px 60px;
    position:sticky;top:0;max-height:100vh;overflow-y:auto;background:var(--panel);
  }
  .main{padding:20px 28px 90px;min-width:0}

  /* ---------- full detail pane ---------- */
  .detail{display:none}
  body.full-mode.detail-open .detail{
    display:block;border-left:1px solid var(--rule);border-right:1px solid var(--rule);
    background:#fff;padding:18px 24px 60px;position:sticky;top:0;max-height:100vh;
    overflow-y:auto;min-width:0;
  }
  .detail-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px}
  .detail-id{font-family:var(--mono);font-size:12px;color:var(--muted);overflow-wrap:anywhere}
  .detail-close{border:1px solid var(--rule);background:#fff;border-radius:2px;cursor:pointer;padding:3px 8px;font-family:var(--mono);font-size:12px}
  .detail-close:hover{border-color:var(--eosin);color:var(--eosin)}
  .detail-section{border-top:1px solid var(--rule);padding-top:14px;margin-top:16px}
  .detail-section:first-of-type{border-top:0;padding-top:0;margin-top:0}
  .detail-section h2{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
  .detail-interpretation{font-family:var(--display);font-size:20px;line-height:1.45;margin:0}
  .meta-grid{display:grid;grid-template-columns:minmax(100px,130px) minmax(0,1fr);gap:6px 12px;margin:0;font-size:13px}
  .meta-grid dt{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin:0}
  .meta-grid dd{margin:0;overflow-wrap:anywhere}
  .evidence-fragment{margin:12px 0 0;padding:10px 12px;background:var(--panel);border-left:3px solid var(--azure)}
  .fragment-label{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-bottom:6px}
  .evidence-fragment blockquote{margin:0;font-size:13.5px;line-height:1.55}
  .support-list{margin:0;padding-left:18px;font-size:13px}
  .support-list code{font-family:var(--mono);font-size:11px}
  .detail-citation{font-size:13px;line-height:1.55;margin:0}
  details.raw{margin-top:16px;border-top:1px solid var(--rule);padding-top:12px}
  details.raw summary{cursor:pointer;font-family:var(--mono);font-size:10.5px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
  pre.raw-json{white-space:pre-wrap;overflow-wrap:anywhere;font-family:var(--mono);font-size:10px;line-height:1.45;background:var(--panel);padding:10px;margin:10px 0 0;border:1px solid var(--rule)}

  /* ---------- filters ---------- */
  .facet{margin-bottom:26px}
  .facet h2{
    font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.12em;
    text-transform:uppercase;color:var(--muted);margin:0 0 9px;
    display:flex;justify-content:space-between;align-items:baseline;gap:8px;
  }
  .facet h2 .clear{
    border:0;background:none;padding:0;cursor:pointer;color:var(--eosin);
    font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:none;
    visibility:hidden;
  }
  .facet.active h2 .clear{visibility:visible}
  .facet-search{
    width:100%;border:1px solid var(--rule);background:#fff;border-radius:2px;
    padding:6px 8px;font-family:var(--mono);font-size:12px;color:var(--ink);margin-bottom:8px;
  }
  .facet-search::placeholder{color:#9a96ab}
  .options{list-style:none;margin:0;padding:0;max-height:264px;overflow-y:auto}
  .options.short{max-height:none}
  .opt{
    width:100%;display:flex;gap:8px;align-items:baseline;text-align:left;
    border:0;background:none;cursor:pointer;padding:3px 4px;border-radius:2px;
    font-size:13.5px;line-height:1.35;color:var(--ink);
  }
  .opt:hover{background:#e9e6f1}
  .opt .tick{
    font-family:var(--mono);font-size:11px;color:var(--muted);width:12px;flex:none;
  }
  .opt[aria-pressed="true"]{background:#fff}
  .opt[aria-pressed="true"] .label{color:var(--eosin);font-weight:600}
  .opt[aria-pressed="true"] .tick{color:var(--eosin)}
  .opt .label{flex:1;min-width:0;overflow-wrap:anywhere}
  .opt .count{font-family:var(--mono);font-size:11px;color:var(--muted);flex:none}
  .opt[disabled]{opacity:.35;cursor:default}
  .opt[disabled]:hover{background:none}
  .swatch{width:8px;height:8px;border-radius:50%;flex:none;align-self:center}

  /* ---------- results ---------- */
  .toolbar{
    display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;
    padding-bottom:12px;border-bottom:1px solid var(--rule);margin-bottom:4px;
  }
  .tally{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.03em}
  .tally b{color:var(--ink);font-weight:500}
  .text-search{
    flex:1;min-width:200px;max-width:380px;border:1px solid var(--rule);background:#fff;
    border-radius:2px;padding:7px 10px;font-family:var(--sans);font-size:13.5px;
  }
  .reset{
    border:1px solid var(--rule);background:#fff;border-radius:2px;padding:6px 11px;
    font-family:var(--mono);font-size:11.5px;letter-spacing:.04em;cursor:pointer;
  }
  .reset:hover{border-color:var(--eosin);color:var(--eosin)}

  ol.cards{list-style:none;margin:0;padding:0}
  li.card{
    display:grid;grid-template-columns:232px minmax(0,1fr);gap:22px;
    padding:15px 0 15px 13px;border-bottom:1px solid var(--rule);
    border-left:3px solid var(--spine,var(--rule));
  }
  body.full-mode li.card{cursor:pointer}
  body.full-mode li.card:hover{background:#f7f4fa}
  body.full-mode li.card.selected{background:#fff;border-left-width:5px;padding-left:11px}
  body.full-mode.detail-open li.card{display:block;padding-top:13px;padding-bottom:13px}
  body.full-mode.detail-open li.card .cid{display:block;margin-bottom:5px}
  body.full-mode.detail-open li.card p{font-size:14px;line-height:1.5}
  li.card .cid{
    font-family:var(--mono);font-size:11.5px;line-height:1.5;color:var(--muted);
    letter-spacing:-.01em;overflow-wrap:anywhere;padding-top:2px;
  }
  li.card p{margin:0;font-size:15.5px;line-height:1.6}
  li.card mark{background:#f7dbe8;color:inherit;padding:0 1px}
  .empty{padding:56px 0;max-width:44ch}
  .empty h3{font-family:var(--display);font-size:22px;font-weight:500;margin:0 0 6px}
  .empty p{margin:0;color:var(--muted)}

  .railtoggle{display:none}

  @media (max-width:1150px){
    body.full-mode.detail-open .rail{padding-left:14px;padding-right:14px}
    body.full-mode.detail-open .detail{padding-left:18px;padding-right:18px}
    body.full-mode.detail-open .main{padding-left:14px;padding-right:14px}
  }

  @media (max-width:900px){
    .shell, body.full-mode.detail-open .shell{grid-template-columns:1fr}
    body.full-mode.detail-open .rail{grid-column:1;grid-row:1}
    body.full-mode.detail-open .detail{
      grid-column:1;grid-row:2;position:static;max-height:none;border-right:0;
    }
    body.full-mode.detail-open .main{grid-column:1;grid-row:3;padding:16px 20px 70px}
    .rail{
      position:static;max-height:none;border-right:0;border-bottom:1px solid var(--rule);
      padding-bottom:24px;
    }
    .rail[hidden]{display:none}
    .railtoggle{
      display:block;margin:16px 28px 0;border:1px solid var(--rule);background:#fff;
      border-radius:2px;padding:8px 12px;font-family:var(--mono);font-size:12px;cursor:pointer;
    }
    .main{padding:16px 20px 70px}
    li.card{grid-template-columns:1fr;gap:5px}
    header.masthead{padding:18px 20px 14px}
  }
  :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

  /* ---------- citation copy ---------- */
  .copyrow{display:flex;gap:14px;align-items:baseline;margin-top:8px}
  .copybtn{
    border:0;background:none;padding:0;cursor:pointer;
    font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;
    color:var(--muted);text-decoration:underline;text-underline-offset:2px;
  }
  .copybtn:hover{color:var(--azure)}
  .copybtn.copied{color:var(--cat-treatment);text-decoration:none}

</style>
</head>
<body>
<header class="masthead">
  <h1 class="wordmark">Evidence <em>cards</em></h1>
  <div class="provenance" id="provenance"></div>
</header>
<button class="railtoggle" id="railtoggle" aria-expanded="false" aria-controls="rail">Filters</button>
<div class="shell">
  <aside class="rail" id="rail" aria-label="Filters"></aside>
  <main class="main">
    <div class="toolbar">
      <div class="tally" id="tally"></div>
      <input class="text-search" id="textsearch" type="search" placeholder="Search interpretation text" aria-label="Search interpretation text">
      <button class="reset" id="reset" type="button">Clear all filters</button>
    </div>
    <ol class="cards" id="cards"></ol>
  </main>
  <aside class="detail" id="detail" aria-label="Card details"></aside>
</div>

5;5(11):e369-e369.","journal":"Blood Cancer Journal","year":2015,"type":"primary study"},{"key":"bluteau-2014-ankrd26","nickname":"Bluteau ANKRD26 Thrombocytopenia 2014","display":"Bluteau D, Balduini A, Balayn N, Currao M, Nurden P, Deswarte C, et al. Thrombocytopenia-associated mutations in the ANKRD26 regulatory region induce MAPK hyperactivation. Journal of Clinical Investigation. 2014;124(2):580-591.","journal":"Journal of Clinical Investigation","year":2014,"type":"primary study"}],"cards":[{"id":"alaggio-2022-leukemia-who5-lymphoid-C0001","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["B-ALL"],"text":"According to WHO-HAEM5, B-ALL can be diagnosed at the family/class level as B-ALL, not further classified, using morphology and immunophenotype alone."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0002","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["B-ALL"],"text":"According to WHO-HAEM5, B-ALL, NOS is reserved for B-ALL cases that remain unclassifiable after comprehensive testing."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0003","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["B-ALL"],"text":"According to WHO-HAEM5, B-ALL with high hyperdiploidy is a recognized B-ALL entity."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0004","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["B-ALL"],"text":"According to WHO-HAEM5, B-ALL with hypodiploidy is a recognized B-ALL entity."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0005","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":["BCR","ABL1","KMT2A","ETV6","RUNX1","TCF3","PBX1","IGH","IL3"],"diseases":["B-ALL"],"text":"According to WHO-HAEM5, B-ALL with BCR::ABL1 fusion, KMT2A rearrangement, ETV6::RUNX1 fusion, TCF3::PBX1 fusion, and IGH::IL3 fusion are genetically defined B-ALL entities."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0006","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["B-ALL"],"text":"According to WHO-HAEM5, B-ALL with iAMP21 is a recognized genetically defined B-ALL entity."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0007","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":["TCF3","HLF"],"diseases":["B-ALL"],"text":"According to WHO-HAEM5, B-ALL with TCF3::HLF fusion is a distinct B-ALL entity from B-ALL with TCF3::PBX1 fusion."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0008","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"prognosis","tier":"restated secondary","genes":["TCF3","HLF"],"diseases":["B-ALL"],"text":"B-ALL with TCF3::HLF fusion is characterized by particularly aggressive behaviour."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0009","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["B-ALL"],"text":"According to WHO-HAEM5, B-ALL with BCR::ABL1-like features is a B-ALL entity, upgraded from provisional status, defined by gene-expression and phenotypic similarity to B-ALL with BCR::ABL1 fusion."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0010","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["B-ALL"],"text":"According to WHO-HAEM5, B-ALL with ETV6::RUNX1-like features is a new B-ALL entity."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0013","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["MBL"],"text":"According to WHO-HAEM5, low-count MBL is defined by a clonal CLL/SLL-phenotype B-cell count below 0.5 × 10^9/L with no other features diagnostic of a B-lymphoproliferative disorder."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0014","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["MBL"],"text":"According to WHO-HAEM5, CLL/SLL-type MBL is defined by a monoclonal CLL/SLL-phenotype B-cell count at least 0.5 × 10^9/L and a total B-cell count below 5 × 10^9/L, with no other features diagnostic of CLL/SLL."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0015","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["MBL"],"text":"According to WHO-HAEM5, non-CLL/SLL-type MBL is any monoclonal non-CLL/SLL-phenotype B-cell expansion without symptoms or features diagnostic of another mature B-cell neoplasm."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0016","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["CLL/SLL"],"text":"For CLL/SLL diagnosis, WHO-HAEM5 regards CD5, CD19, CD20, CD23, and surface or cytoplasmic kappa and lambda light chains as essential markers."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0019","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":["IGH","CCND1"],"diseases":["mantle cell lymphoma"],"text":"According to WHO-HAEM5, cases formerly labelled B-prolymphocytic leukaemia that carry IGH::CCND1 are classified as a mantle cell lymphoma variant rather than B-PLL."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0020","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["CLL/SLL"],"text":"According to WHO-HAEM5, CLL/SLL with at least 15% prolymphocytes is classified as prolymphocytic progression of CLL/SLL, whereas CLL/SLL with less than 15% prolymphocytes remains CLL/SLL."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0021","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["SBLPN"],"text":"According to WHO-HAEM5, former B-prolymphocytic leukaemia cases not reclassified as mantle cell lymphoma or CLL/SLL progression are incorporated into splenic B-cell lymphoma/leukaemia with prominent nucleoli (SBLPN)."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0022","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":["BRAF"],"diseases":["HCL"],"text":"In hairy cell leukaemia, BRAF p.V600E is a hallmark somatic mutation, whereas other members of the splenic B-cell lymphoma/leukaemia family usually lack BRAF mutations, supporting diagnostic distinction."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0023","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["SDRPL"],"text":"A CD200 mean fluorescence intensity/CD180 mean fluorescence intensity ratio below 0.5 on flow cytometry favours splenic diffuse red pulp small B-cell lymphoma (SDRPL) over hairy cell leukaemia (HCL), splenic marginal zone lymphoma (SMZL), and splenic B-cell lymphoma/leukaemia with prominent nucleoli (SBLPN)."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0024","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":["MYD88"],"diseases":["IgM LPL/WM"],"text":"According to WHO-HAEM5, IgM LPL/WM has two molecular subsets based on the presence or absence of MYD88 p.L265P."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0025","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":["MYD88"],"diseases":["LPL"],"text":"In lymphoplasmacytic lymphoma (LPL), demonstration of MYD88 p.L265P may aid differential diagnosis from nodal marginal zone lymphoma, extranodal MZL of MALT with plasmacytoid differentiation, and plasma cell myeloma."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0026","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"prognosis","tier":"restated secondary","genes":["CXCR4"],"diseases":["LPL"],"text":"In lymphoplasmacytic lymphoma (LPL), CXCR4-mutated disease is associated with shorter time to treatment."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0027","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"treatment","tier":"restated secondary","genes":["CXCR4"],"diseases":["LPL"],"text":"In lymphoplasmacytic lymphoma (LPL), CXCR4 mutation is associated particularly with resistance to ibrutinib therapy."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0029","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"treatment","tier":"restated secondary","genes":["BIRC3","MALT1"],"diseases":["extranodal MZL of MALT"],"text":"In gastric extranodal MZL of MALT, BIRC3::MALT1 identifies disease that does not respond to Helicobacter pylori eradication."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0030","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":["IGH","BCL2"],"diseases":["follicular lymphoma"],"text":"According to WHO-HAEM5, classic follicular lymphoma encompasses the usual follicular-pattern follicular lymphomas composed of centrocytes and centroblasts that commonly harbour t(14;18)/IGH::BCL2, and is distinguished from follicular large B-cell lymphoma and follicular lymphoma with uncommon features."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0031","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["follicular lymphoma"],"text":"According to WHO-HAEM5, histological grading is optional rather than mandatory for classic follicular lymphoma."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0032","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":["IRF4"],"diseases":["follicular lymphoma"],"text":"Follicular lymphoma with blastoid or large-centrocyte cytology should be distinguished from large B-cell lymphoma with IRF4 rearrangement."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0033","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":["CCND1"],"diseases":["in situ mantle cell neoplasm"],"text":"According to WHO-HAEM5, in situ mantle cell neoplasm represents mantle-zone colonization by B cells carrying an IG::CCND1 fusion with cyclin D1 overexpression."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0034","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":["IGH","CCND1"],"diseases":["mantle cell lymphoma"],"text":"In mantle cell lymphoma, IGH::CCND1 fusion associated with t(11;14) is the genetic hallmark and is present in at least 95% of cases."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0035","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":["IGK","IGL","CCND1"],"diseases":["mantle cell lymphoma"],"text":"In cyclin D1-positive mantle cell lymphoma with no detectable CCND1 rearrangement by FISH, cryptic rearrangements of IGK or IGL enhancers with CCND1 can account for cyclin D1 overexpression."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0036","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":["CCND2","CCND3","CCNE"],"diseases":["mantle cell lymphoma"],"text":"In cyclin D1-negative, CCND1-rearrangement-negative mantle cell lymphoma, rearrangements of CCND2, CCND3, or CCNE are alternative cell-cycle lesions."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0037","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"prognosis","tier":"restated secondary","genes":["TP53"],"diseases":["mantle cell lymphoma"],"text":"TP53 mutation is a best-established biomarker of high-risk mantle cell lymphoma."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0038","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":["SOX11"],"diseases":["leukaemic non-nodal mantle cell lymphoma"],"text":"Leukaemic non-nodal mantle cell lymphoma is characteristically SOX11-negative, with a low Ki67 index and frequent lack of CD5 expression."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0039","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["DLBCL, NOS"],"text":"According to WHO-HAEM5, DLBCL, NOS continues to include germinal-centre B-cell-like and activated B-cell-like subtypes."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0040","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["DLBCL, NOS"],"text":"According to WHO-HAEM5, proposed NGS-based molecular classifications are not incorporated into DLBCL, NOS because no unified genetic framework is established and their outcome and targeted-treatment implications remain unclear."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0041","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":["MYC","BCL2"],"diseases":["DLBCL/HGBL-MYC/BCL2"],"text":"According to WHO-HAEM5, DLBCL/HGBL-MYC/BCL2 is defined by dual MYC and BCL2 rearrangements and can have large-cell, intermediate-cell, or blastoid morphology."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0042","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":["MYC","BCL6"],"diseases":["DLBCL, NOS","HGBL, NOS"],"text":"According to WHO-HAEM5, lymphoid neoplasms with dual MYC and BCL6 rearrangements are excluded from DLBCL/HGBL-MYC/BCL2 and are classified as DLBCL, NOS or HGBL, NOS according to cytomorphology."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0043","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":["MYC"],"diseases":["HGBL-11q"],"text":"According to WHO-HAEM5, HGBL-11q is a MYC-rearrangement-negative mature B-cell lymphoma with Burkitt-like, intermediate, or blastoid morphology and a characteristic 11q gain/loss pattern."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0044","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":["MYC"],"diseases":["HGBL-11q"],"text":"B-cell lymphomas with a Burkitt-like appearance that lack MYC rearrangement should be tested for the characteristic 11q gain/loss pattern of HGBL-11q."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0045","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":["MYD88","CD79B"],"diseases":["primary large B-cell lymphoma of immune-privileged sites"],"text":"In primary large B-cell lymphoma of immune-privileged sites, concomitant MYD88 and CD79B mutations are a distinctive shared mutational profile across primary CNS, vitreoretinal, and testicular large B-cell lymphomas."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0046","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["fluid overload-associated large B-cell lymphoma"],"text":"According to WHO-HAEM5, fluid overload-associated large B-cell lymphoma is distinct from primary effusion lymphoma; fluid overload-associated large B-cell lymphoma is KSHV/HHV8-negative and usually presents as an isolated body-cavity effusion in adults without underlying immunodeficiency."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0047","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["DLBCL, NOS"],"text":"According to WHO-HAEM5, cases resembling mediastinal grey zone lymphoma but occurring outside and without mediastinal involvement are better classified as DLBCL, NOS."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0048","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":["MYC"],"diseases":["Burkitt lymphoma"],"text":"According to WHO-HAEM5, Burkitt lymphoma is an aggressive mature B-cell neoplasm with germinal-centre phenotype, very high Ki67, and an IG::MYC juxtaposition."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0049","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["Burkitt lymphoma"],"text":"According to WHO-HAEM5, Burkitt lymphoma should be classified into EBV-positive and EBV-negative subtypes rather than the traditional endemic, sporadic, and immunodeficiency-associated epidemiological variants."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0051","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["lymphoid neoplasm"],"text":"For a lymphoid neoplasm arising in immune deficiency/dysregulation, WHO-HAEM5 uses a three-part nomenclature comprising histological diagnosis, oncogenic-virus status, and the immune-deficiency/dysregulation setting."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0052","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["classic Hodgkin lymphoma"],"text":"For classic Hodgkin lymphoma, WHO-HAEM5 advises caution in immune-deficiency/dysregulation settings and in purely extranodal CHL-like proliferations because EBV-positive HRS-like cells can occur in mimics."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0053","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["nodular lymphocyte predominant Hodgkin lymphoma"],"text":"According to WHO-HAEM5, nodular lymphocyte predominant Hodgkin lymphoma remains the formal terminology, while “nodular lymphocyte predominant B-cell lymphoma” is an acceptable alternative name in preparation for possible future adoption."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0054","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["MGRS"],"text":"According to WHO-HAEM5, monoclonal gammopathy of renal significance (MGRS) is a plasma-cell or B-cell proliferation below accepted malignancy criteria that secretes a monoclonal immunoglobulin or fragment causing kidney injury."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0055","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["TEMPI syndrome"],"text":"According to WHO-HAEM5, TEMPI syndrome is included among plasma-cell-neoplasm-associated paraneoplastic syndromes."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0056","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["TEMPI syndrome"],"text":"According to WHO-HAEM5, TEMPI syndrome is diagnosed primarily using clinical and imaging investigations."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0057","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["T-ALL"],"text":"Indolent T-lymphoblastic proliferation may mimic T-ALL because of TdT expression, but typically lacks architectural destruction, marked cytologic atypia, and monoclonal TCR gene rearrangement."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0058","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["T-ALL"],"text":"According to WHO-HAEM5, genetically defined T-ALL types are not recognized because current genetic evidence is insufficient to establish clinically relevant genetic subtypes."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0059","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["acute lymphoblastic leukaemia/lymphoma"],"text":"Within acute lymphoblastic leukaemia/lymphoma classification, WHO-HAEM5 does not separately list NK-lymphoblastic leukaemia/lymphoma because reliable diagnostic criteria are lacking and there is substantial overlap with other CD56-positive acute neoplasms."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0060","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":["TCL1A","MTCP1"],"diseases":["T-PLL"],"text":"Unified diagnostic criteria for T-PLL include T-lymphocytosis above 5 × 10^9/L with appropriate phenotype and T-cell monoclonality plus genetic aberrations with breakpoints affecting TCL1A or MTCP1, or TCL1 expression."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0061","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"prognosis","tier":"restated secondary","genes":["STAT3"],"diseases":["T-LGLL"],"text":"In T-LGLL, STAT3 mutation is associated with poorer overall survival."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0062","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"prognosis","tier":"restated secondary","genes":["STAT5B"],"diseases":["T-LGLL"],"text":"In T-LGLL, STAT5B mutation is associated with poor prognosis in CD8-positive disease but has no prognostic impact in CD4-positive or gamma/delta T-LGLL."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0063","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["primary cutaneous T-cell lymphoma"],"text":"Because forms of primary cutaneous T-cell lymphoma overlap morphologically and immunophenotypically, WHO-HAEM5 regards clinical correlation, dermatological examination, and photographic documentation as indispensable to correct diagnosis."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0064","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":["JAK3"],"diseases":["indolent NK-cell lymphoproliferative disorder of the gastrointestinal tract"],"text":"In indolent NK-cell lymphoproliferative disorder of the gastrointestinal tract, recurrent somatic JAK3 mutations support its neoplastic classification rather than a reactive process."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0065","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["indolent NK-cell lymphoproliferative disorder of the gastrointestinal tract"],"text":"Indolent NK-cell lymphoproliferative disorder of the gastrointestinal tract should not be misdiagnosed as extranodal NK/T-cell lymphoma; lack of EBV is a crucial differential feature supporting the indolent NK-cell lymphoproliferative disorder diagnosis."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0066","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"prognosis","tier":"restated secondary","genes":["TP63","TP53"],"diseases":["ALK-negative anaplastic large cell lymphoma"],"text":"In ALK-negative anaplastic large cell lymphoma, TP63 rearrangement and loss of TP53 are associated with poor outcome."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0069","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["nodal TFH cell lymphoma"],"text":"According to WHO-HAEM5, the TFH phenotype in nodal TFH cell lymphoma is defined by at least two TFH markers in addition to CD4."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0070","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["nodal TFH cell lymphoma"],"text":"For difficult nodal TFH cell lymphoma diagnoses, WHO-HAEM5 recommends an integrated approach using clinical, morphologic, and immunophenotypic features, with genomic input for clonality and mutational profiles."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0072","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["EBV-positive nodal T/NK-cell lymphoma"],"text":"According to WHO-HAEM5, EBV-positive nodal T/NK-cell lymphoma is a distinct entity rather than a peripheral T-cell lymphoma, NOS subtype, and EBV positivity is required by definition."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0073","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"germline","tier":"restated secondary","genes":["ATM"],"diseases":[],"text":"Ataxia telangiectasia is a lymphoid-neoplasm-relevant inherited predisposition syndrome linked to germline ATM mutations."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0074","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"germline","tier":"restated secondary","genes":["NBN"],"diseases":[],"text":"Nijmegen breakage syndrome is a lymphoid-neoplasm-relevant inherited predisposition syndrome linked to germline NBN mutations."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0075","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":["ATM"],"diseases":["lymphoid neoplasm"],"text":"In a lymphoid neoplasm arising in a patient with ataxia telangiectasia due to germline ATM predisposition, leukaemias and lymphomas should be diagnosed by conventional criteria and designated “AT-related”."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0076","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":["NBN"],"diseases":["lymphoid neoplasm"],"text":"In a lymphoid neoplasm arising in a patient with Nijmegen breakage syndrome due to germline NBN predisposition, leukaemias and lymphomas should be diagnosed by conventional criteria and designated “NBS-related”."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0077","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"treatment","tier":"restated secondary","genes":["ATM"],"diseases":["lymphoid neoplasm"],"text":"In a lymphoid neoplasm associated with germline ATM predisposition causing ataxia telangiectasia, recognition of the syndrome is clinically important for treatment planning because of increased toxicities."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0078","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"treatment","tier":"restated secondary","genes":["NBN"],"diseases":["lymphoid neoplasm"],"text":"In a lymphoid neoplasm associated with germline NBN predisposition causing Nijmegen breakage syndrome, recognition of the syndrome is clinically important for treatment planning because of increased toxicities."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0079","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"germline","tier":"restated secondary","genes":["ATM"],"diseases":[],"text":"Recognition of germline ATM predisposition causing ataxia telangiectasia is clinically important for surveillance of carriers and counselling of relatives."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0080","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"germline","tier":"restated secondary","genes":["NBN"],"diseases":[],"text":"Recognition of germline NBN predisposition causing Nijmegen breakage syndrome is clinically important for surveillance of carriers and counselling of relatives."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0081","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":["ALK"],"diseases":["ALK-positive anaplastic large cell lymphoma","ALK-negative anaplastic large cell lymphoma"],"text":"According to WHO-HAEM5, ALK-positive anaplastic large cell lymphoma and ALK-negative anaplastic large cell lymphoma are distinct entities based on their distinct pathogenesis and clinical course."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0082","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":["ID3","TCF3"],"diseases":["HGBL-11q"],"text":"Genomic alterations affecting the ID3-TCF3 complex, a molecular hallmark of Burkitt lymphoma, are rare or absent in HGBL-11q, supporting molecular distinction between HGBL-11q and Burkitt lymphoma."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0084","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["CLL/SLL"],"text":"For CLL/SLL transformation, WHO-HAEM5 recommends the term “Richter transformation” rather than “Richter Syndrome”."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0085","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["SBLPN"],"text":"According to WHO-HAEM5, splenic B-cell lymphoma/leukaemia with prominent nucleoli (SBLPN) replaces and absorbs cases formerly classified as hairy cell leukaemia variant."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0086","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["LPL"],"text":"According to WHO-HAEM5, lymphoplasmacytic lymphoma (LPL) has two subtypes: IgM LPL/Waldenström macroglobulinaemia type and non-WM type LPL; non-WM type LPL includes cases with IgG or IgA monoclonal proteins, non-secretory LPL, and IgM LPL without bone marrow involvement."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0087","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["paediatric MZL"],"text":"According to WHO-HAEM5, paediatric marginal zone lymphoma is a separate entity rather than a subtype of nodal marginal zone lymphoma."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0088","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["primary cutaneous MZL"],"text":"According to WHO-HAEM5, primary cutaneous marginal zone lymphoma is a separate entity."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0090","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["follicular lymphoma"],"text":"According to WHO-HAEM5, follicular large B-cell lymphoma largely corresponds to WHO-HAEM4R follicular lymphoma grade 3B."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0091","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["follicular lymphoma"],"text":"According to WHO-HAEM5, follicular lymphoma with uncommon features comprises two subsets: blastoid or large-centrocyte cytology, and predominantly diffuse growth pattern."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0092","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["primary large B-cell lymphoma of immune-privileged sites"],"text":"According to WHO-HAEM5, primary large B-cell lymphoma of immune-privileged sites is an umbrella entity combining primary large B-cell lymphomas of the CNS, vitreoretina, and testis in immunocompetent patients."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0093","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":["B2M"],"diseases":["primary large B-cell lymphoma of immune-privileged sites"],"text":"In primary large B-cell lymphoma of immune-privileged sites, genetic inactivation of B2M, together with MHC class I/II inactivation and subsequent loss of protein expression, is a distinctive immune-evasion molecular feature."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0094","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["primary cutaneous gamma/delta T-cell lymphoma"],"text":"According to WHO-HAEM5, primary cutaneous gamma/delta T-cell lymphoma is listed as a separate entity rather than within the WHO-HAEM4R group “cutaneous peripheral T-cell lymphoma, rare subtypes”."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0095","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["primary cutaneous peripheral T-cell lymphoma, NOS"],"text":"According to WHO-HAEM5, primary cutaneous peripheral T-cell lymphoma, NOS is a new entity for rare primary cutaneous T-cell lymphoma cases that do not fit other recognized cutaneous T-cell lymphoma entities."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0096","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["indolent T-cell lymphoma of the gastrointestinal tract"],"text":"According to WHO-HAEM5, indolent T-cell lymphoproliferative disorder of the gastrointestinal tract is renamed indolent T-cell lymphoma of the gastrointestinal tract."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0097","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["indolent NK-cell lymphoproliferative disorder of the gastrointestinal tract"],"text":"According to WHO-HAEM5, indolent NK-cell lymphoproliferative disorder of the gastrointestinal tract is a new entity."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0098","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["breast implant-associated anaplastic large cell lymphoma"],"text":"According to WHO-HAEM5, breast implant-associated anaplastic large cell lymphoma is an entity distinct from other ALK-negative anaplastic large cell lymphoma."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0099","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["nodal TFH cell lymphoma, angioimmunoblastic-type"],"text":"According to WHO-HAEM5, angioimmunoblastic T-cell lymphoma is renamed nodal TFH cell lymphoma, angioimmunoblastic-type."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0100","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["nodal TFH cell lymphoma, follicular-type"],"text":"According to WHO-HAEM5, follicular T-cell lymphoma is renamed nodal TFH cell lymphoma, follicular-type."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0101","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["nodal TFH cell lymphoma, NOS"],"text":"According to WHO-HAEM5, peripheral T-cell lymphoma with TFH phenotype is renamed nodal TFH cell lymphoma, NOS."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0102","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["nodal TFH cell lymphoma, NOS"],"text":"According to WHO-HAEM5, nodal TFH cell lymphoma, NOS is recommended for CD4-positive lymphomas with a TFH phenotype that do not meet criteria for nodal TFH cell lymphoma, angioimmunoblastic-type or follicular-type."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0103","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["nodal TFH cell lymphoma","nodal TFH cell lymphoma, NOS"],"text":"On core biopsies, WHO-HAEM5 recommends the generic term nodal TFH cell lymphoma rather than nodal TFH cell lymphoma, NOS to reduce misclassification from inadequate sampling."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0104","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["peripheral T-cell lymphoma, NOS"],"text":"According to WHO-HAEM5, peripheral T-cell lymphoma, NOS remains a diagnosis of exclusion, with nodal TFH cell lymphoma among the important differential diagnoses."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0105","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["extranodal NK/T-cell lymphoma"],"text":"According to WHO-HAEM5, extranodal NK/T-cell lymphoma drops the former “nasal-type” qualifier because the disease can present at multiple extranodal sites."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0107","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["CLL/SLL"],"text":"For differential diagnosis of CLL/SLL from other small B-cell lymphomas/leukaemias, WHO-HAEM5 identifies CD10, CD43, CD79b, CD81, CD200, and ROR1 as useful additional targets."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0108","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["primary cutaneous CD8-positive aggressive epidermotropic cytotoxic T-cell lymphoma"],"text":"According to WHO-HAEM5, primary cutaneous CD8-positive aggressive epidermotropic cytotoxic T-cell lymphoma is listed as a separate entity rather than within the WHO-HAEM4R group “cutaneous peripheral T-cell lymphoma, rare subtypes”."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0109","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["primary cutaneous acral CD8-positive lymphoproliferative disorder"],"text":"According to WHO-HAEM5, primary cutaneous acral CD8-positive lymphoproliferative disorder is listed as a separate entity rather than within the WHO-HAEM4R group “cutaneous peripheral T-cell lymphoma, rare subtypes”."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0110","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["primary cutaneous CD4-positive small/medium T-cell lymphoproliferative disorder"],"text":"According to WHO-HAEM5, primary cutaneous CD4-positive small/medium T-cell lymphoproliferative disorder is listed as a separate entity rather than within the WHO-HAEM4R group “cutaneous peripheral T-cell lymphoma, rare subtypes”."},{"id":"arber-2022-blood-140-1200-C0001","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["CML"],"text":"According to the ICC, accelerated-phase CML is defined by any of the following: 10%-19% blasts in peripheral blood or bone marrow; peripheral-blood basophils >=20%; or a major-route additional clonal cytogenetic abnormality in Philadelphia-positive cells at diagnosis or acquired during treatment (second Philadelphia chromosome, trisomy 8, i(17q), trisomy 19, complex karyotype, or 3q26.2 abnormality)."},{"id":"arber-2022-blood-140-1200-C0002","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["CML"],"text":"According to the ICC, blast-phase CML is defined by >=20% blasts in peripheral blood or bone marrow or by myeloid sarcoma (extramedullary blast proliferation)."},{"id":"arber-2022-blood-140-1200-C0003","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["CML"],"text":"In CML, morphologically apparent lymphoblasts >5% warrant consideration of lymphoblastic crisis; immunophenotypic analysis is required to confirm lymphoid lineage."},{"id":"arber-2022-blood-140-1200-C0004","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["JAK2"],"diseases":["PV"],"text":"According to the ICC, polycythemia vera requires either all 3 major criteria or the first 2 major criteria plus the minor criterion. Major criteria are: elevated hemoglobin (>16.5 g/dL in men or >16.0 g/dL in women), elevated hematocrit (>49% in men or >48% in women), or red-cell mass >25% above predicted; JAK2 V617F or JAK2 exon 12 mutation; and age-adjusted hypercellular marrow with trilineage proliferation (panmyelosis). The minor criterion is a subnormal serum erythropoietin level."},{"id":"arber-2022-blood-140-1200-C0005","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["JAK2"],"diseases":["PV"],"text":"In patients with sustained absolute erythrocytosis (hemoglobin >18.5 g/dL in men or >16.5 g/dL in women and hematocrit >55.5% in men or >49.5% in women) plus JAK2 V617F or JAK2 exon 12 mutation, a bone marrow biopsy may not be required for polycythemia vera diagnosis."},{"id":"arber-2022-blood-140-1200-C0006","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["JAK2"],"diseases":["PV"],"text":"In JAK2 exon 12-mutated polycythemia vera with isolated erythrocytosis and erythroid-predominant marrow, the usual panmyelosis diagnostic criterion may not apply."},{"id":"arber-2022-blood-140-1200-C0007","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["post-PV/post-ET MF"],"text":"According to the ICC, post-polycythemia vera myelofibrosis requires both required criteria—previous established polycythemia vera and bone-marrow fibrosis grade 2 or 3—plus at least 2 additional criteria: anemia or sustained loss of requirement for phlebotomy/cytoreductive treatment for erythrocytosis; leukoerythroblastosis; increased or newly palpable splenomegaly; or development of at least 2 of >10% weight loss in 6 months, night sweats, and unexplained fever >37.5°C."},{"id":"arber-2022-blood-140-1200-C0008","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["ABL1","BCR","CALR","JAK2","MPL"],"diseases":["ET"],"text":"According to the ICC, essential thrombocythemia requires all 4 major criteria or the first 3 major criteria plus the minor criterion. Major criteria are platelet count >=450 x 10^9/L; characteristic megakaryocytic-lineage proliferation with enlarged mature hyperlobulated megakaryocytes and no significant granulocytic/erythroid proliferation or relevant fibrosis; exclusion of BCR::ABL1-positive CML, polycythemia vera, primary myelofibrosis, and other myeloid neoplasms; and JAK2, CALR, or MPL mutation. The minor criterion is another clonal marker or absence of reactive thrombocytosis."},{"id":"arber-2022-blood-140-1200-C0009","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["ET"],"text":"Small dense megakaryocyte clusters can occur infrequently in essential thrombocythemia and therefore do not by themselves exclude that diagnosis."},{"id":"arber-2022-blood-140-1200-C0010","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["post-PV/post-ET MF"],"text":"According to the ICC, post-essential thrombocythemia myelofibrosis requires both required criteria—previous established essential thrombocythemia and bone-marrow fibrosis grade 2 or 3—plus at least 2 additional criteria: anemia with a >2 g/dL decrease from baseline hemoglobin; leukoerythroblastosis; increased or newly palpable splenomegaly; elevated LDH; or development of at least 2 of >10% weight loss in 6 months, night sweats, and unexplained fever >37.5°C."},{"id":"arber-2022-blood-140-1200-C0011","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["ABL1","BCR","CALR","JAK2","MPL"],"diseases":["PMF"],"text":"According to the ICC, pre-fibrotic/early primary myelofibrosis requires all 3 major criteria and at least 1 minor criterion confirmed on 2 consecutive determinations. Major criteria are characteristic megakaryocytic proliferation/atypia with marrow fibrosis <grade 2, increased age-adjusted cellularity, granulocytic proliferation and often decreased erythropoiesis; JAK2, CALR, or MPL mutation, another clonal marker, or absence of reactive reticulin fibrosis; and exclusion of BCR::ABL1-positive CML, polycythemia vera, essential thrombocythemia, MDS, and other myeloid neoplasms. Minor criteria are unexplained anemia, leukocytosis >=11 x 10^9/L, palpable splenomegaly, or elevated LDH."},{"id":"arber-2022-blood-140-1200-C0012","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["ABL1","BCR","CALR","JAK2","MPL"],"diseases":["PMF"],"text":"According to the ICC, overt primary myelofibrosis requires all 3 major criteria and at least 1 minor criterion confirmed on 2 consecutive determinations. Major criteria are megakaryocytic proliferation/atypia with reticulin and/or collagen fibrosis grade 2 or 3; JAK2, CALR, or MPL mutation, another clonal marker, or absence of reactive myelofibrosis; and exclusion of essential thrombocythemia, polycythemia vera, BCR::ABL1-positive CML, MDS, and other myeloid neoplasms. Minor criteria are unexplained anemia, leukocytosis >=11 x 10^9/L, palpable splenomegaly, elevated LDH, or leukoerythroblastosis."},{"id":"arber-2022-blood-140-1200-C0013","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["ASXL1","EZH2","IDH1","IDH2","SF3B1","SRSF2","TET2"],"diseases":["PMF"],"text":"In suspected primary myelofibrosis, detection of ASXL1, EZH2, IDH1, IDH2, SF3B1, SRSF2, or TET2 mutation can support the clonal nature of disease when canonical MPN-driver mutations are absent."},{"id":"arber-2022-blood-140-1200-C0014","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["PMF"],"text":"In primary myelofibrosis with monocytosis, a history of MPN excludes CMML, while a higher variant allele frequency of MPN-associated driver mutations supports PMF with monocytosis rather than CMML."},{"id":"arber-2022-blood-140-1200-C0015","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["ABL1","BCR","CSF3R"],"diseases":["CNL"],"text":"According to the ICC, chronic neutrophilic leukemia requires neutrophilic leukocytosis with segmented/band neutrophils >=80%, neutrophil precursors <10%, monocytes <10%, no significant dysgranulopoiesis, and hypercellular marrow with increased normally maturing neutrophil granulocytes; exclusion of BCR::ABL1-positive CML, polycythemia vera, essential thrombocythemia, primary myelofibrosis, and myeloid/lymphoid neoplasms with eosinophilia and TK fusions; and either CSF3R T618I/another activating CSF3R mutation or, if CSF3R is absent, persistent neutrophilia for >=3 months with splenomegaly and no reactive cause (with myeloid clonality demonstrated if a plasma-cell neoplasm is present). The WBC threshold is >=13 x 10^9/L with an activating CSF3R mutation and >=25 x 10^9/L without one; absence of CSF3R does not exclude CNL."},{"id":"arber-2022-blood-140-1200-C0016","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["CNL"],"text":"Significant monocytosis, basophilia, eosinophilia, or dysgranulopoiesis should prompt critical review of a proposed chronic neutrophilic leukemia diagnosis."},{"id":"arber-2022-blood-140-1200-C0017","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["CNL"],"text":"In chronic neutrophilic leukemia, 10%-19% blasts in peripheral blood or bone marrow represents accelerated phase, whereas >=20% blasts represents blast phase."},{"id":"arber-2022-blood-140-1200-C0018","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["ABL1","BCR","FGFR1","FLT3","JAK2","PDGFRA","PDGFRB"],"diseases":["CEL"],"text":"According to the ICC, chronic eosinophilic leukemia, NOS requires all 6 criteria: peripheral-blood eosinophils >=1.5 x 10^9/L and >=10% of leukocytes; <20% blasts in blood and marrow without another AML-defining recurrent genetic abnormality; absence of BCR::ABL1 and other ABL1, PDGFRA, PDGFRB, FGFR1, JAK2, or FLT3 TK fusions; failure to meet criteria for another well-defined MPN, CMML, or systemic mastocytosis; characteristic marrow abnormalities or increased blasts (>=5% marrow and/or >=2% blood); and a clonal cytogenetic abnormality and/or somatic mutation. If clonality or increased blasts are absent, supportive marrow findings can suffice when persistent eosinophilia is present and other causes are excluded."},{"id":"arber-2022-blood-140-1200-C0020","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["ABL1","BCR","CALR","JAK2","MPL"],"diseases":["MPN-U"],"text":"According to the ICC, myeloproliferative neoplasm, unclassifiable (MPN-U) requires all 3 criteria: clinical and hematologic features of an MPN (with reactive causes excluded if marrow fibrosis is present); JAK2, CALR, or MPL mutation or another clonal marker; and failure to meet criteria for another MPN, MDS, MDS/MPN, or BCR::ABL1-positive CML."},{"id":"arber-2022-blood-140-1200-C0021","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["MPN-U"],"text":"Myeloproliferative neoplasm, unclassifiable (MPN-U) is an appropriate ICC category for very early-phase MPN lacking fully developed subtype criteria or for splanchnic/portal-vein thrombosis with MPN features that do not meet a specific MPN subtype."},{"id":"arber-2022-blood-140-1200-C0022","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["ASXL1","EZH2","IDH1","IDH2","SF3B1","SRSF2","TET2"],"diseases":["MPN-U"],"text":"In myeloproliferative neoplasm, unclassifiable (MPN-U), ASXL1, EZH2, IDH1, IDH2, SF3B1, SRSF2, or TET2 mutations detected by sensitive molecular methods can support the clonal nature of disease."},{"id":"arber-2022-blood-140-1200-C0023","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["ETV6","FIP1L1","PDGFRA","PDGFRB"],"diseases":["myeloid/lymphoid neoplasm with eosinophilia and TK fusion"],"text":"The ICC recognizes PDGFRA-rearranged and PDGFRB-rearranged disease within the category of myeloid/lymphoid neoplasms with eosinophilia and tyrosine kinase gene fusions, most commonly FIP1L1::PDGFRA and ETV6::PDGFRB respectively."},{"id":"arber-2022-blood-140-1200-C0024","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["FGFR1"],"diseases":["myeloid/lymphoid neoplasm with eosinophilia and TK fusion"],"text":"The ICC recognizes myeloid/lymphoid neoplasm with eosinophilia and tyrosine kinase gene fusion involving FGFR1, most commonly ZMYM2::FGFR1."},{"id":"arber-2022-blood-140-1200-C0025","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["JAK2","PCM1"],"diseases":["myeloid/lymphoid neoplasm with eosinophilia and TK fusion"],"text":"The ICC recognizes PCM1::JAK2-rearranged myeloid/lymphoid neoplasm with eosinophilia and tyrosine kinase gene fusion as a formal member of this category."},{"id":"arber-2022-blood-140-1200-C0026","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["BCR","ETV6","JAK2","PCM1"],"diseases":["myeloid/lymphoid neoplasm with eosinophilia and TK fusion"],"text":"ETV6::JAK2 and BCR::JAK2 neoplasms are considered genetic variants of PCM1::JAK2 myeloid/lymphoid neoplasm with eosinophilia and tyrosine kinase gene fusion in the ICC."},{"id":"arber-2022-blood-140-1200-C0027","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["ETV6","FLT3"],"diseases":["myeloid/lymphoid neoplasm with eosinophilia and TK fusion"],"text":"The ICC recognizes FLT3-rearranged myeloid/lymphoid neoplasm with eosinophilia and tyrosine kinase gene fusion, most commonly ETV6::FLT3."},{"id":"arber-2022-blood-140-1200-C0028","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["ABL1","ETV6"],"diseases":["myeloid/lymphoid neoplasm with eosinophilia and TK fusion"],"text":"The ICC recognizes ETV6::ABL1-rearranged myeloid/lymphoid neoplasm with eosinophilia and tyrosine kinase gene fusion."},{"id":"arber-2022-blood-140-1200-C0029","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["ABL1","BCR"],"diseases":["myeloid/lymphoid neoplasm with eosinophilia and TK fusion"],"text":"When acute lymphoblastic leukemia carries a tyrosine-kinase fusion, involvement of background myeloid cells supports classification as myeloid/lymphoid neoplasm with eosinophilia and tyrosine kinase gene fusion rather than lymphoid-restricted BCR::ABL1-like B-ALL or de novo T-ALL."},{"id":"arber-2022-blood-140-1200-C0030","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["mastocytosis"],"text":"The ICC classifies mastocytosis into cutaneous mastocytosis, generally skin-confined, and systemic mastocytosis, defined by extracutaneous involvement with or without skin disease."},{"id":"arber-2022-blood-140-1200-C0031","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["mastocytosis"],"text":"The ICC recognizes five systemic mastocytosis subtypes: indolent, smoldering, aggressive, mast cell leukemia, and systemic mastocytosis with an associated myeloid neoplasm."},{"id":"arber-2022-blood-140-1200-C0032","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["mastocytosis"],"text":"Bone-marrow mastocytosis is described as an indolent systemic mastocytosis variant characterized by limited bone-marrow infiltration, no skin lesions, and normal or slightly elevated serum tryptase levels."},{"id":"arber-2022-blood-140-1200-C0033","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["KIT"],"diseases":["mastocytosis"],"text":"According to the ICC, systemic mastocytosis is established by the major criterion—multifocal dense aggregates of >=15 tryptase- and/or CD117-positive mast cells in marrow and/or another extracutaneous organ—or, when the major criterion is absent, by at least 3 of 4 minor criteria: >25% spindle-shaped/atypical immature mast cells; mast-cell expression of CD25, CD2, and/or CD30; KIT D816V or another activating KIT mutation; and persistent serum tryptase >20 ng/mL (not counted in SM with an associated myeloid neoplasm). A TK fusion associated with myeloid/lymphoid neoplasm with eosinophilia excludes systemic mastocytosis."},{"id":"arber-2022-blood-140-1200-C0034","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["mastocytosis"],"text":"In systemic mastocytosis, mast cell leukemia is defined by atypical immature mast cells accounting for >=20% of bone marrow cellularity, with provision for diagnosis when the aspirate is a dry tap or otherwise suboptimal."},{"id":"arber-2022-blood-140-1200-C0035","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["mastocytosis"],"text":"In systemic mastocytosis, the amount of circulating mast cells does not justify a separate leukemic versus aleukemic mast cell leukemia subcategory in the ICC."},{"id":"arber-2022-blood-140-1200-C0036","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["KIT"],"diseases":["mastocytosis"],"text":"Rare cases of systemic mastocytosis can show mature, round, well-granulated mast cells; these cases typically lack KIT D816V and are often CD25-negative, CD2-negative, and CD30-positive, with variable serum tryptase."},{"id":"arber-2022-blood-140-1200-C0037","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["mastocytosis"],"text":"According to the ICC, systemic mastocytosis with an associated myeloid neoplasm requires meeting diagnostic criteria for systemic mastocytosis and for an associated myeloid neoplasm, with the associated neoplasm fully classified."},{"id":"arber-2022-blood-140-1200-C0038","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["KIT"],"diseases":["mastocytosis"],"text":"Monocytosis, eosinophilia, splenomegaly, elevated LDH, high KIT D816V variant allele frequency, and additional myeloid-malignancy mutations, particularly in combination, can raise suspicion for an associated myeloid neoplasm in systemic mastocytosis."},{"id":"arber-2022-blood-140-1200-C0039","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["KIT"],"diseases":["mastocytosis"],"text":"In rare systemic mastocytosis cases with both a KIT mutation and a myeloid/lymphoid-neoplasm tyrosine-kinase fusion, the ICC recommends assigning the fusion-defined myeloid/lymphoid neoplasm as the associated myeloid neoplasm only when both abnormalities are present."},{"id":"arber-2022-blood-140-1200-C0040","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["MDS/MPN"],"text":"According to the ICC, cytopenia together with cytosis is a key characteristic of MDS/MPN; cytopenia thresholds are hemoglobin <13 g/dL in males or <12 g/dL in females, ANC <1.8 x 10^9/L, or platelets <150 x 10^9/L."},{"id":"arber-2022-blood-140-1200-C0041","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["ABL1","BCR"],"diseases":["CMML"],"text":"According to the ICC, CMML requires persistent monocytosis (absolute monocytes >=0.5 x 10^9/L and >=10% of WBCs), cytopenia using MDS thresholds except that some early cases may have borderline/no cytopenia, <20% blasts including promonocytes in blood and marrow, marrow morphology consistent with CMML, and absence of BCR::ABL1 or TK-fusion myeloid/lymphoid neoplasms. Clonality is established by abnormal cytogenetics and/or a myeloid-neoplasm-associated mutation with allele frequency >=10%; without demonstrable clonality, monocytes must be >=1.0 x 10^9/L and >10% of WBCs together with increased blasts, morphologic dysplasia, or an abnormal CMML immunophenotype."},{"id":"arber-2022-blood-140-1200-C0042","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["CMML"],"text":"According to the ICC, CMML uses a 2-tier blast classification: CMML-1 has <5% blasts in peripheral blood and <10% in bone marrow; CMML-2 has 5%-19% blasts in blood, 10%-19% in marrow, or Auer rods. The former CMML-0 category is eliminated."},{"id":"arber-2022-blood-140-1200-C0043","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["NPM1"],"diseases":["CMML"],"text":"Development of an NPM1 mutation in established CMML should be noted but does not by itself define de novo AML."},{"id":"arber-2022-blood-140-1200-C0044","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["CMML"],"text":"The ICC myeloproliferative subtype of CMML (CMML-MP) is defined by WBC >13 x 10^9/L."},{"id":"arber-2022-blood-140-1200-C0046","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["ABL1","ASXL1","BCR","CALR","JAK2","MPL","SETBP1"],"diseases":["aCML"],"text":"According to the ICC, atypical chronic myeloid leukemia (aCML) requires WBC >=13 x 10^9/L due to neutrophils and precursors with promyelocytes/myelocytes/metamyelocytes >=10%; cytopenia using MDS thresholds; <20% blasts; prominent dysgranulopoiesis; monocytes <10% and eosinophils <10% of leukocytes; hypercellular marrow with granulocytic proliferation/dysplasia; and absence of BCR::ABL1 and TK-fusion myeloid/lymphoid neoplasms. Absence of JAK2, CALR, and MPL supports the diagnosis, and SETBP1 mutation, often with ASXL1, provides additional support."},{"id":"arber-2022-blood-140-1200-C0047","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["CALR","JAK2","MPL"],"diseases":["aCML"],"text":"A history of MPN and/or JAK2, CALR, or MPL mutation tends to exclude atypical chronic myeloid leukemia (aCML)."},{"id":"arber-2022-blood-140-1200-C0048","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["CSF3R"],"diseases":["aCML","CNL"],"text":"Detection of a CSF3R mutation in suspected atypical chronic myeloid leukemia (aCML) should prompt careful morphologic review to exclude chronic neutrophilic leukemia."},{"id":"arber-2022-blood-140-1200-C0049","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["ABL1","BCR","CALR","JAK2","MPL","SF3B1"],"diseases":["MDS/MPN-SF3B1-T"],"text":"According to the ICC, MDS/MPN with SF3B1 mutation and thrombocytosis requires thrombocytosis >=450 x 10^9/L and anemia present at initial diagnosis, <1% blood blasts and <5% marrow blasts, and SF3B1 mutation with VAF >10%; no recent cytotoxic/growth-factor therapy explaining the phenotype; no prior MPN, MDS, or other MDS/MPN; and absence of BCR::ABL1, TK-fusion myeloid/lymphoid neoplasms, t(3;3), inv(3), and del(5q) meeting MDS-del(5q) criteria. Ring sideroblasts are not required when SF3B1 VAF is >10%; JAK2 V617F, CALR, or MPL W515 co-mutation is not required but supports the diagnosis."},{"id":"arber-2022-blood-140-1200-C0050","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["ABL1","BCR","SF3B1"],"diseases":["MDS/MPN-SF3B1-T"],"text":"According to the ICC, MDS/MPN with ring sideroblasts and thrombocytosis, NOS requires thrombocytosis >=450 x 10^9/L and anemia present at initial diagnosis, erythroid dysplasia with >=15% ring sideroblasts, <1% blood blasts and <5% marrow blasts, and clonality by cytogenetic abnormality and/or somatic mutation (or, if clonality is absent, no recent cytotoxic/growth-factor therapy explaining the phenotype); no prior MPN, MDS, or other MDS/MPN; and absence of SF3B1 mutation, BCR::ABL1, TK-fusion myeloid/lymphoid neoplasms, t(3;3), inv(3), and del(5q) meeting MDS-del(5q) criteria."},{"id":"arber-2022-blood-140-1200-C0051","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["SF3B1"],"diseases":["MDS"],"text":"MDS with SF3B1 mutation that later develops thrombocytosis is classified as thrombocytotic progression of MDS-SF3B1 rather than MDS/MPN with thrombocytosis."},{"id":"arber-2022-blood-140-1200-C0052","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["ABL1","BCR"],"diseases":["MDS/MPN-U"],"text":"According to the ICC, MDS/MPN NOS requires mixed myelodysplastic and myeloproliferative features that do not meet another MDS/MPN, MDS, or MPN category; cytopenia using MDS thresholds; <20% blasts in blood and marrow; platelets >=450 x 10^9/L and/or WBC >=13 x 10^9/L; evidence of clonality when demonstrable (or persistent findings with other causes excluded if clonality cannot be determined); and absence of BCR::ABL1, TK-fusion myeloid/lymphoid neoplasms, t(3;3), inv(3), and del(5q) meeting corresponding MDS criteria."},{"id":"arber-2022-blood-140-1200-C0053","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["CALR","JAK2","MPL"],"diseases":["MDS/MPN-U"],"text":"A history of MPN and/or JAK2, CALR, or MPL mutation, particularly at high VAF, tends to exclude MDS/MPN NOS."},{"id":"arber-2022-blood-140-1200-C0054","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["MDS/MPN-U"],"text":"Hypereosinophilia in a case being considered as MDS/MPN NOS favors chronic eosinophilic leukemia, NOS instead."},{"id":"arber-2022-blood-140-1200-C0055","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["MDS/MPN-U"],"text":"The ICC MDS/MPN NOS category should not be used to classify advanced-stage MPN or triple-negative MPN merely because they are otherwise difficult to classify."},{"id":"arber-2022-blood-140-1200-C0056","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["ABL1","BCR","CALR","JAK2","MPL","SETBP1","SRSF2"],"diseases":["MDS/MPN-U"],"text":"According to the ICC, MDS/MPN with i(17q) is a provisional subtype of MDS/MPN, NOS. Diagnosis requires leukocytosis >=13 x 10^9/L, cytopenia using MDS thresholds, <20% blasts in blood and bone marrow, dysgranulopoiesis with nonsegmented or pseudo-Pelger-Huet neutrophils, and i(17q) either isolated or with one additional abnormality other than -7/del(7q). BCR::ABL1, myeloid/lymphoid-neoplasm tyrosine-kinase gene fusions, and JAK2/CALR/MPL mutations should be absent, and recent cytotoxic or growth-factor therapy must not explain the phenotype. SRSF2 and SETBP1 co-mutations further support the diagnosis."},{"id":"arber-2022-blood-140-1200-C0057","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["CCUS","MDS"],"text":"For clonal cytopenias spanning CCUS to MDS, the ICC defines cytopenia as acquired sustained hemoglobin <12 g/dL in females or <13 g/dL in males, ANC <1.8 x 10^9/L, and/or platelets <150 x 10^9/L not explained by another condition."},{"id":"arber-2022-blood-140-1200-C0058","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["CHIP"],"text":"CHIP is defined by a somatic mutation in a myeloid-neoplasm driver gene at VAF >=2% or a non-MDS-defining clonal cytogenetic abnormality in a patient without a myeloid neoplasm or unexplained cytopenia."},{"id":"arber-2022-blood-140-1200-C0059","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["CCUS"],"text":"According to the ICC, CCUS has persistent idiopathic cytopenia for >=4 months; it is distinguished from MDS by absence of dysplasia or increased blasts in blood and marrow, and a VAF threshold >=2% is recommended for the clonal abnormality in CCUS and other premalignant clonal cytopenias."},{"id":"arber-2022-blood-140-1200-C0060","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["UBA1"],"diseases":["MDS"],"text":"VEXAS syndrome is associated with somatic UBA1 mutation and should be kept separate from MDS unless morphologic MDS criteria are met."},{"id":"arber-2022-blood-140-1200-C0061","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["ABL1","BCR"],"diseases":["MDS"],"text":"According to the ICC, MDS is a clonal hematopoietic neoplasm defined by persistent unexplained cytopenia and morphologic dysplasia, generally chronic for about >=4 months and not explained by drug, toxin, or comorbidity; a 10% dysplasia threshold is recommended for each lineage, and demonstrable clonality is not required when qualifying dysplasia and cytopenia are present. BCR::ABL1 or a TK-fusion myeloid/lymphoid neoplasm excludes MDS. At initial diagnosis, persistent WBC >=13 x 10^9/L, platelets >=450 x 10^9/L (except MDS-del(5q) or inv(3)/t(3;3)), or monocytes >=0.5 x 10^9/L and >=10% of leukocytes instead favors MDS/MPN or MPN classification."},{"id":"arber-2022-blood-140-1200-C0062","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["RUNX1","SF3B1","TP53"],"diseases":["MDS"],"text":"According to the ICC, MDS with mutated SF3B1 requires SF3B1 mutation VAF >=10%, at least one cytopenia, no ICC-defined cytosis at diagnosis, <5% marrow blasts and <2% blood blasts, and absence of multihit TP53, RUNX1 mutation, isolated del(5q), -7/del(7q), 3q26.2 abnormalities, and complex karyotype. Dysplasia is typically present but is not required, and ring sideroblasts are not required."},{"id":"arber-2022-blood-140-1200-C0063","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["SF3B1"],"diseases":["MDS"],"text":"SF3B1-unmutated MDS with ring sideroblasts is classified as MDS, NOS irrespective of ring-sideroblast number."},{"id":"arber-2022-blood-140-1200-C0064","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["CCUS","MDS
