-2019-operational-germline-testing","category":"germline","tier":"restated secondary","genes":["MECOM"],"diseases":[],"ancestors":[],"locator":"Table 1, lines 207-211","secondary":null,"text":"Germline MECOM is listed among bone marrow failure syndromes associated with MDS and AML.","baseSha256":"e83a9203e2efbc7abf1ae387527749c04ac95927ce2a0df61468da068bccc45b","audit":{"verdict":"pass","basis":"phase3"}},{"id":"baliakas-2019-operational-germline-testing-C0069","shortId":"C0069","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"restated secondary","genes":["MECOM"],"diseases":[],"ancestors":[],"locator":"Table 1, lines 207-211","secondary":null,"text":"Germline MECOM-associated bone marrow failure can include skeletal, cardiac and neurological abnormalities.","baseSha256":"8fd76caafbbe9df45f9f665b4acd1336948043c61ee2caef79a33c8b022013be","audit":{"verdict":"pass","basis":"phase3"}},{"id":"baliakas-2019-operational-germline-testing-C0070","shortId":"C0070","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"restated secondary","genes":["ERCC6L2"],"diseases":[],"ancestors":[],"locator":"Table 1, lines 207-211","secondary":null,"text":"ERCC6L2 is listed under other germline bone marrow failure syndromes predisposing to myeloid neoplasms.","baseSha256":"761ff055582ff8ad0f3f0875f0278fc2b00a2c920fcddf5bd7617faeefd8cfb6","audit":{"verdict":"pass","basis":"phase3"}},{"id":"baliakas-2019-operational-germline-testing-C0072","shortId":"C0072","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"guideline criterion","genes":["TERC","RUNX1"],"diseases":[],"ancestors":[],"locator":"Criteria A footnote 1, line 77","secondary":null,"text":"Poor stem-cell mobilisation in a sibling donor candidate is a clinical clue to hereditary myeloid predisposition and has been reported in rare cases with germline TERC and RUNX1 variants.","baseSha256":"d4d4b5fa75d660867184d673f4cdf066960fc025be912766184a2b293f535a02","audit":{"verdict":"pass","basis":"phase4_adjudicated"}},{"id":"baliakas-2019-operational-germline-testing-C0073","shortId":"C0073","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"guideline criterion","genes":["BRCA2"],"diseases":[],"ancestors":[],"locator":"Criterion A3 and footnote 2, lines 74 and 78","secondary":null,"text":"Under Nordic criterion A3, germline evaluation is indicated for a patient with MDS or AML who has two first- or second-degree relatives with solid tumours, with at least one diagnosed before age 50; BRCA2-related tumour patterns are included among the suggestive cancers.","baseSha256":"c05a6edbcd15cb04ca07f868049ace6231a01375349b790603ecd5f7274b5f09","audit":{"verdict":"pass","basis":"phase4_adjudicated"}},{"id":"baliakas-2019-operational-germline-testing-C0075","shortId":"C0075","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"guideline criterion","genes":["RUNX1","GATA2","TP53","ETV6","CEBPA"],"diseases":[],"ancestors":[],"locator":"Criterion B discussion, line 221","secondary":null,"text":"In patients with MDS or AML, a RUNX1, GATA2, TP53, ETV6, or CEBPA variant detected on a somatic NGS panel at VAF 40–60% or >90% can suggest germline origin; the Nordic 2019 guidelines recommend confirmation in extra-haematological tissue after consent.","baseSha256":"cdd486b94e44da4250b68bd5f84d2b875052f0ed4d5959ba66eb0f0014c017c8","audit":{"verdict":"pass","basis":"phase4_adjudicated"}},{"id":"baliakas-2019-operational-germline-testing-C0078","shortId":"C0078","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"restated secondary","genes":["DDX41"],"diseases":[],"ancestors":[],"locator":"Criterion B discussion, line 221","secondary":null,"text":"A truncating DDX41 variant is usually of germline origin according to the Nordic 2019 guidelines.","baseSha256":"d391446d9fad1ce52bf8fd4e88676c5d2fb5f38745b3245c1dfe691152846e4a","audit":{"verdict":"pass","basis":"phase3"}},{"id":"baliakas-2019-operational-germline-testing-C0079","shortId":"C0079","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"guideline criterion","genes":["GATA2","SAMD9","SAMD9L"],"diseases":[],"ancestors":[],"locator":"Criterion C discussion, line 227","secondary":null,"text":"Under the Nordic 2019 recommendations, patients diagnosed with MDS or AML before age 50 who lack a suggestive personal or family history but have monosomy 7, del(7q), or another chromosome 7 aberration with loss of 7q material should be referred for genetic counselling/testing; these abnormalities are particularly common in GATA2-, SAMD9-, and SAMD9L-related germline disorders.","baseSha256":"d45cc9fdc884fce74e78af55ed03b6dd7346a8affd6dcca044febe6c9ff36deb","audit":{"verdict":"pass","basis":"phase4_adjudicated"}},{"id":"baliakas-2019-operational-germline-testing-C0080","shortId":"C0080","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"guideline criterion","genes":["GATA2","ANKRD26"],"diseases":[],"ancestors":[],"locator":"Diagnostic algorithm, line 245; Table 1 line 115","secondary":null,"text":"For suspected GATA2- or ANKRD26-related germline predisposition, the Nordic 2019 guidelines state that testing should include noncoding regulatory regions.","baseSha256":"6edb02fcf26277f399aafb265f5f20560db22f85f478d86b36d0c38f6229f115","audit":{"verdict":"pass","basis":"phase3"}},{"id":"baliakas-2019-operational-germline-testing-C0081","shortId":"C0081","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"restated secondary","genes":["RUNX1","ANKRD26","ETV6"],"diseases":[],"ancestors":[],"locator":"Baseline work-up, line 291","secondary":null,"text":"Asymptomatic carriers of germline RUNX1, ANKRD26, or ETV6 variants may have thrombocytopenia or a bleeding tendency at baseline, including bleeding tendency without thrombocytopenia.","baseSha256":"348eaf3630c43848048e8db3c05640537bbd1d268c6199270c0509b508a7f56b","audit":{"verdict":"pass","basis":"phase3"}},{"id":"barbui-2015-blood-cancer-journal-5-e369-C0001","shortId":"C0001","paper":"barbui-2015-blood-cancer-journal-5-e369","category":"prognosis","tier":"restated secondary","genes":["JAK2"],"diseases":["ET"],"ancestors":["MPN"],"locator":"Opening paragraph, sentence beginning 'In the recent International Prognostic Score for Thrombosis in ET'","secondary":{"authors":["Barbui T","Finazzi G","Carobbio A","Thiele J","Passamonti F","Rumi E"],"citation_incomplete":["issue"],"display":"Barbui T, Finazzi G, Carobbio A, Thiele J, Passamonti F, Rumi E et al. Development and validation of an International Prognostic Score of thrombosis in World Health Organization–essential thrombocythemia (IPSET-thrombosis). Blood 2012; 120: 5128–5133.","journal":"Blood","pages":"5128–5133","title":"Development and validation of an International Prognostic Score of thrombosis in World Health Organization–essential thrombocythemia (IPSET-thrombosis).","volume":"120","year":2012},"text":"In essential thrombocythemia, JAK2 (JAK2V617F) mutation is an independent risk factor for future thrombosis in the original IPSET-thrombosis model.","baseSha256":"cd607e5057f69021e01afd9affd222cf174959f40af4611097c1b18a71860e3c","audit":{"verdict":"pass","basis":"phase3"}},{"id":"barbui-2015-blood-cancer-journal-5-e369-C0002","shortId":"C0002","paper":"barbui-2015-blood-cancer-journal-5-e369","category":"prognosis","tier":"restated secondary","genes":["CALR"],"diseases":["ET"],"ancestors":["MPN"],"locator":"Opening paragraph, sentence ending 'was not further affected by the recently discovered CALR mutation'","secondary":{"authors":["Finazzi G","Carobbio A","Guglielmelli P"],"citation_incomplete":["issue"],"display":"Finazzi G, Carobbio A, Guglielmelli P. Calreticulin mutation does not modify the IPSET score for predicting the risk of thrombosis among 1150 patients with essential thrombocythemia. Blood 2014; 124: 2611–2612.","journal":"Blood","pages":"2611–2612","title":"Calreticulin mutation does not modify the IPSET score for predicting the risk of thrombosis among 1150 patients with essential thrombocythemia.","volume":"124","year":2014},"text":"In essential thrombocythemia, CALR mutation does not modify thrombosis-risk prediction by the IPSET-thrombosis model.","baseSha256":"4253c2a8a8c0db4292e16feddde5e1dacad877789a647037a81aae8deb582131","audit":{"verdict":"pass","basis":"phase3"}},{"id":"barbui-2015-blood-cancer-journal-5-e369-C0003","shortId":"C0003","paper":"barbui-2015-blood-cancer-journal-5-e369","category":"prognosis","tier":"univariable or descriptive","genes":["JAK2"],"diseases":["ET"],"ancestors":["MPN"],"locator":"Opening paragraph conventional-risk definition; discussion paragraph beginning 'The current study quantifies'","secondary":null,"text":"Among patients with essential thrombocythemia who are conventionally low risk, defined as age ≤60 years with no history of thrombosis, JAK2 (JAK2V617F)-unmutated patients have lower thrombosis risk than JAK2 (JAK2V617F)-mutated patients, whether or not cardiovascular risk factors are present.","baseSha256":"27aa033814fe8390753ebd8a39697dab663411cfdebaa8e9bb5394e066a192a0","audit":{"verdict":"pass","basis":"phase3"}},{"id":"barbui-2015-blood-cancer-journal-5-e369-C0004","shortId":"C0004","paper":"barbui-2015-blood-cancer-journal-5-e369","category":"prognosis","tier":"univariable or descriptive","genes":["JAK2"],"diseases":["ET"],"ancestors":["MPN"],"locator":"Opening paragraph conventional-risk definition; results subsection '(ii) Conventionally assigned high-risk group'","secondary":null,"text":"Among patients with essential thrombocythemia who are conventionally high risk, defined by age >60 years and/or a history of thrombosis, the combination of JAK2 (JAK2V617F) mutation and cardiovascular risk factors is associated with higher thrombosis risk than the absence of both additional risk factors.","baseSha256":"809c5c5c56cc28f5c9f75ded15fc11fbc9fb6e492fcfc31c2632734155d20ee1","audit":{"verdict":"pass","basis":"phase3"}},{"id":"barbui-2015-blood-cancer-journal-5-e369-C0006","shortId":"C0006","paper":"barbui-2015-blood-cancer-journal-5-e369","category":"prognosis","tier":"univariable or descriptive","genes":["JAK2"],"diseases":["ET"],"ancestors":["MPN"],"locator":"Results paragraph beginning 'Additional analysis revealed limited enhancement'","secondary":null,"text":"Among patients with essential thrombocythemia whose conventional high-risk status is defined by a history of thrombosis, regardless of age, JAK2 (JAK2V617F) mutation and/or cardiovascular risk factors provide only limited additional thrombosis-risk information.","baseSha256":"0a26fea50e5f3c9bc8cb3946b25a54b00af1a190800b5f41cfad79575328693a","audit":{"verdict":"pass","basis":"phase3"}},{"id":"barbui-2015-blood-cancer-journal-5-e369-C0007","shortId":"C0007","paper":"barbui-2015-blood-cancer-journal-5-e369","category":"prognosis","tier":"univariable or descriptive","genes":["JAK2"],"diseases":["ET"],"ancestors":["MPN"],"locator":"Figure 1c legend and revised four-category risk scheme","secondary":null,"text":"The proposed 2015 revision of IPSET-thrombosis classifies essential thrombocythemia with no thrombosis history, age ≤60 years, and JAK2 (JAK2V617F)-unmutated status as very low risk.","baseSha256":"7a01dde573bdc77f04c5cace73b1dccb082ef57c2d90201fe1e90bf6017ca4d5","audit":{"verdict":"pass","basis":"phase3"}},{"id":"barbui-2015-blood-cancer-journal-5-e369-C0008","shortId":"C0008","paper":"barbui-2015-blood-cancer-journal-5-e369","category":"prognosis","tier":"univariable or descriptive","genes":["JAK2"],"diseases":["ET"],"ancestors":["MPN"],"locator":"Figure 1c legend and revised four-category risk scheme","secondary":null,"text":"The proposed 2015 revision of IPSET-thrombosis classifies essential thrombocythemia with no thrombosis history, age ≤60 years, and JAK2 (JAK2V617F) mutation as low risk.","baseSha256":"960892b66e787617c6949c11c isk assessment at diagnosis, specifically assessing KMT2A (MLL) partial tandem duplication is important because it contributes to adverse risk estimation and is not routinely included in myeloid panel tests.","baseSha256":"e4c53437cc4b14789511c66f013443c941861fb58475e73fc90a432f692e7b5e","audit":{"verdict":"pass","basis":"phase3"}},{"id":"bernard-2022-nejm-evidence-1-na-C0013","shortId":"C0013","paper":"bernard-2022-nejm-evidence-1-na","category":"biomarker","tier":"multivariable-adjusted","genes":["FLT3"],"diseases":["MDS"],"ancestors":[],"locator":"Discussion","secondary":null,"text":"For MDS risk assessment at diagnosis, FLT3 mutation screening is important because FLT3 mutation is a strong predictor of adverse outcomes.","baseSha256":"2d57441ac0ed9c8a70d58bb4253cdb5a2e7cd2b3e636d6a1c755af48567c21bf","audit":{"verdict":"pass","basis":"phase3"}},{"id":"bernard-2022-nejm-evidence-1-na-C0014","shortId":"C0014","paper":"bernard-2022-nejm-evidence-1-na","category":"germline","tier":"univariable or descriptive","genes":["DDX41"],"diseases":["MDS"],"ancestors":[],"locator":"Results: association between gene mutations and clinical end points","secondary":null,"text":"In MDS, a DDX41 pattern with a clonal variant and a subclonal second variant can suggest germline DDX41 followed by a secondary somatic hit.","baseSha256":"b2cab95572090f33f427f03721fea61607b6feeb82203c2178a1afaaafb08544","audit":{"verdict":"pass","basis":"phase3"}},{"id":"bernard-2022-nejm-evidence-1-na-C0015","shortId":"C0015","paper":"bernard-2022-nejm-evidence-1-na","category":"treatment","tier":"univariable or descriptive","genes":["TP53"],"diseases":["MDS"],"ancestors":[],"locator":"Results: relation between IPSS-M and treatment","secondary":null,"text":"In MDS treated with hypomethylating agents, multihit TP53 is associated with worse overall survival.","baseSha256":"8ae9831368c9999cf4786ec5e8d0f3b0366057959e97f71cd23b3d92d33c8731","audit":{"verdict":"pass","basis":"phase3"}},{"id":"bernard-2022-nejm-evidence-1-na-C0016","shortId":"C0016","paper":"bernard-2022-nejm-evidence-1-na","category":"treatment","tier":"univariable or descriptive","genes":["TP53"],"diseases":["MDS"],"ancestors":[],"locator":"Results: relation between IPSS-M and treatment","secondary":null,"text":"In MDS undergoing stem cell transplantation, multihit TP53 is associated with worse overall survival.","baseSha256":"6858dce9ae44e3487245dc8fc2f9a36b7bf3c5ee63365190ba51b5e6b72fbfd2","audit":{"verdict":"pass","basis":"phase3"}},{"id":"bernard-2022-nejm-evidence-1-na-C0017","shortId":"C0017","paper":"bernard-2022-nejm-evidence-1-na","category":"treatment","tier":"univariable or descriptive","genes":["TP53"],"diseases":["MDS"],"ancestors":[],"locator":"Results: relation between IPSS-M and treatment","secondary":null,"text":"In MDS treated with lenalidomide, multihit TP53 is associated with worse overall survival.","baseSha256":"9ffa817756fda5603f24935dca30dc3ccc99dae36cde3768b001ea6fe2d98aac","audit":{"verdict":"pass","basis":"phase3"}},{"id":"bernard-2022-nejm-evidence-1-na-C0018","shortId":"C0018","paper":"bernard-2022-nejm-evidence-1-na","category":"treatment","tier":"univariable or descriptive","genes":["DDX41"],"diseases":["MDS"],"ancestors":[],"locator":"Results: relation between IPSS-M and treatment","secondary":null,"text":"In MDS treated with hypomethylating agents, DDX41 mutation is associated with favorable overall survival; this treatment-specific association requires further investigation in randomized studies.","baseSha256":"a85dc55c9774d01fb377c7d7f2ef2f71b5559ab1bc0c335de308ac6df186b4d3","audit":{"verdict":"pass","basis":"phase3"}},{"id":"bernard-2022-nejm-evidence-1-na-C0019","shortId":"C0019","paper":"bernard-2022-nejm-evidence-1-na","category":"treatment","tier":"restated secondary","genes":[],"diseases":["MDS"],"ancestors":[],"locator":"Discussion","secondary":null,"text":"Patients with higher-risk MDS are considered for disease-modifying therapies intended to prolong survival, including hypomethylating agents and allogeneic transplantation.","baseSha256":"47fa179beee1a876c5058239ddd5ef20e973bc735ac3e90bbaf5ab8bc738a5e9","audit":{"verdict":"pass","basis":"phase3"}},{"id":"bernard-2022-nejm-evidence-1-na-C0020","shortId":"C0020","paper":"bernard-2022-nejm-evidence-1-na","category":"prognosis","tier":"multivariable-adjusted","genes":["TP53","KMT2A","FLT3","SF3B1","NPM1","RUNX1","NRAS","ETV6","IDH2","CBL","EZH2","U2AF1","SRSF2","DNMT3A","ASXL1","KRAS"],"diseases":["MDS"],"ancestors":[],"locator":"Results — Feature Selection for IPSS-M Model Development; Table 1 — IPSS-M Risk Score Construction","secondary":null,"text":"According to the IPSS-M framework for MDS, multihit TP53, KMT2A (MLL) partial tandem duplication, FLT3 ITD/TKD, SF3B1 mutation with isolated del(5q), and mutations in NPM1, RUNX1, NRAS, ETV6, IDH2, CBL, EZH2, U2AF1, SRSF2, DNMT3A, ASXL1, and KRAS are main-effect molecular findings that individually contribute adverse prognostic weight. SF3B1a—SF3B1 mutation without BCOR, BCORL1, RUNX1, NRAS, STAG2, SRSF2, or del(5q)—is a main-effect finding that individually contributes favourable prognostic weight. A main-effect finding is modelled individually in IPSS-M, so its gene-specific prognostic contribution is incorporated directly rather than through the residual mutation count.","baseSha256":"9f2150853e622f810c6e70a9ff8dae1335f995114307e975b5340e0766eadb14","audit":{"verdict":"pass","basis":"phase4_adjudicated"}},{"id":"bernard-2022-nejm-evidence-1-na-C0022","shortId":"C0022","paper":"bernard-2022-nejm-evidence-1-na","category":"prognosis","tier":"multivariable-adjusted","genes":["BCOR","BCORL1","CEBPA","ETNK1","GATA2","GNB1","IDH1","NF1","PHF6","PPM1D","PRPF8","PTPN11","SETBP1","STAG2","WT1"],"diseases":["MDS"],"ancestors":[],"locator":"Results — Feature Selection for IPSS-M Model Development; Table 1 — gene residuals","secondary":null,"text":"In MDS, mutations in BCOR, BCORL1, CEBPA, ETNK1, GATA2, GNB1, IDH1, NF1, PHF6, PPM1D, PRPF8, PTPN11, SETBP1, STAG2, or WT1 are associated with adverse prognostic effects of similar magnitude. Their adverse effects are cumulative across this gene group, but the source observed saturation of additive risk beyond two mutated genes, so additional mutations beyond two did not add further adverse prognostic value.","baseSha256":"e14826b2b2cbf0cf52ff183f95c6e7915f4c71778c7bbd2a98db320e00e72bdf","audit":{"verdict":"pass","basis":"phase4_adjudicated"}},{"id":"cloos-2026-blood-147-1147-C0001","shortId":"C0001","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["NPM1","FLT3","PML","RARA","RUNX1","RUNX1T1","CBFB","MYH11","KMT2A"],"diseases":["AML"],"ancestors":[],"locator":"Table 3, recommendation C4; section C1 qPCR-based MRD assessment","secondary":null,"text":"According to ELN-DAVID 2025, validated leukemia-specific MRD assays targeting NPM1, FLT3-ITD, PML::RARA, RUNX1::RUNX1T1, CBFB::MYH11, or KMT2A rearrangements are preferred over less-specific molecular markers for acute myeloid leukemia.","baseSha256":"4652f9f686c883ae05e71ca30e9e6017c99ce65dbb0e69f2085a3c33c6f22601","audit":{"verdict":"pass","basis":"phase4_adjudicated"}},{"id":"cloos-2026-blood-147-1147-C0002","shortId":"C0002","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["WT1","MECOM"],"diseases":["AML"],"ancestors":[],"locator":"Table 3, recommendation C4; section C1 qPCR-based MRD assessment","secondary":null,"text":"According to ELN-DAVID 2025, WT1 and EVI1/MECOM expression are less-specific MRD markers in acute myeloid leukemia, so validated leukemia-specific MRD assays are preferred when available.","baseSha256":"5dbe5f1f9cf41e5d017acdc1d3db9a9211c7a6571950037c0504dfa2e1de861c","audit":{"verdict":"pass","basis":"phase4_adjudicated"}},{"id":"cloos-2026-blood-147-1147-C0003","shortId":"C0003","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["NPM1","FLT3","PML","RARA"],"diseases":["AML"],"ancestors":[],"locator":"Table 4 footnote; section C. Molecular MRD technologies","secondary":null,"text":"According to ELN-DAVID 2025, when a rare NPM1 mutation, very large FLT3-ITD, or uncommon noncanonical PML::RARA transcript will be used for acute myeloid leukemia MRD monitoring, analyte detectability with the established MRD assay should first be confirmed at diagnosis.","baseSha256":"6034ba6fb37587426e668555cc42c71abdf29e1673e54ee175673b99adb5b982","audit":{"verdict":"pass","basis":"phase3"}},{"id":"cloos-2026-blood-147-1147-C0004","shortId":"C0004","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["NPM1"],"diseases":["AML"],"ancestors":[],"locator":"Table 5, mutNPM1 qPCR, after 2 cycles of intensive chemotherapy or before alloHCT, PB","secondary":null,"text":"According to ELN-DAVID 2025, in NPM1-mutated acute myeloid leukemia assessed by peripheral-blood qPCR after 2 intensive-chemotherapy cycles or before alloHCT, mutNPM1/ABL1 <0.001% or undetectable MRD is MRD-negative with an optimal response.","baseSha256":"16c48486abe37681141bf005b0e0188643b64bd4208e93bcd5cd979c2c273670","audit":{"verdict":"pass","basis":"phase3"}},{"id":"cloos-2026-blood-147-1147-C0005","shortId":"C0005","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["NPM1"],"diseases":["AML"],"ancestors":[],"locator":"Table 5, mutNPM1 qPCR, after 2 cycles of intensive chemotherapy or before alloHCT, PB","secondary":null,"text":"According to ELN-DAVID 2025, in NPM1-mutated acute myeloid leukemia assessed by peripheral-blood qPCR after 2 intensive-chemotherapy cycles or before alloHCT, detectable mutNPM1/ABL1 from ≥0.001% to <0.01% is MRD-LL with a warning response.","baseSha256":"1d1450330671603970811e4625f119a0bef6845231749a17f53fb8719716bb42","audit":{"verdict":"pass","basis":"phase3"}},{"id":"cloos-2026-blood-147-1147-C0006","shortId":"C0006","paper":"cloos-2026-blood-147-1 rmalities are absent, a pathogenic somatic TP53 mutation with variant allele fraction ≥10%, with or without loss of the wild-type allele, defines TP53-mutated AML at ≥20% blasts; the corresponding 10%-19% blast category is MDS/AML.","baseSha256":"fd87d91400591cd3ea79210b6db68561ec5217997923ccd7d66733829941eb3d","audit":{"verdict":"pass","basis":"phase3"}},{"id":"d-hner-2022-blood-140-1345-C0007","shortId":"C0007","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"guideline criterion","genes":["TP53","ASXL1","BCOR","EZH2","RUNX1","SF3B1","SRSF2","STAG2","U2AF1","ZRSR2"],"diseases":["AML","MDS","MDS/AML"],"ancestors":[],"locator":"AML classification — AML with myelodysplasia-related gene mutations; Table 1; Figure 1; Table 1; Figure 1; AML classification — remaining AML cases","secondary":null,"text":"Under the 2022 ICC, when higher-priority recurrent AML-defining abnormalities and TP53-mutated disease are absent, pathogenic mutations in ASXL1, BCOR, EZH2, RUNX1, SF3B1, SRSF2, STAG2, U2AF1, or ZRSR2 define AML with myelodysplasia-related gene mutations at ≥20% blasts, irrespective of prior MDS; the corresponding 10%-19% blast category is MDS/AML.","baseSha256":"dd7bf8d9b0de122664fef88d49d1bf3e1226f1d74b381cddb8043e4eed3dc736","audit":{"verdict":"pass","basis":"phase3"}},{"id":"d-hner-2022-blood-140-1345-C0008","shortId":"C0008","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["AML","MDS/AML"],"ancestors":["MDS"],"locator":"Table 1 footnote ** — AML with myelodysplasia-related cytogenetic abnormalities; Table 1; Figure 1; AML classification — remaining AML cases","secondary":null,"text":"Under the 2022 ICC, when higher-priority AML-defining categories are absent, del(5q)/t(5q)/add(5q), monosomy 7/del(7q), trisomy 8, del(12p)/t(12p)/add(12p), i(17q), monosomy 17/add(17p)/del(17p), del(20q), idic(X)(q13), or a complex karyotype of ≥3 unrelated chromosome abnormalities (excluding hyperdiploid "}},{"id":"d-hner-2022-blood-140-1345-C0086","shortId":"C0086","paper":"d-hner-2022-blood-140-1345","category":"treatment","tier":"restated secondary","genes":["FLT3"],"diseases":["AML"],"ancestors":[],"locator":"Therapy for AML — Relapsed and refractory disease","secondary":null,"text":"For relapsed/refractory FLT3-ITD-positive AML, quizartinib improves overall survival versus conventional care, although FDA and EMA approval was not granted after review of the cited trial data.","baseSha256":"128a087553dbca0930d0c18c5614bfda3a415d92fd853367a2854325ddcc2e02","audit":{"verdict":"pass","basis":"phase4_adjudicated"}},{"id":"d-hner-2022-blood-140-1345-C0087","shortId":"C0087","paper":"d-hner-2022-blood-140-1345","category":"treatment","tier":"restated secondary","genes":["IDH1"],"diseases":["AML"],"ancestors":[],"locator":"Therapy for AML — Relapsed and refractory disease; Table 10","secondary":null,"text":"The 2022 ELN recommendations list ivosidenib as a salvage option for relapsed/refractory IDH1-mutated AML, supported by clinically meaningful single-agent antileukemic activity from single-arm evidence.","baseSha256":"822042c6b652c3f81baca2f9d4fc13f066825556fe099b484fd9bc45804df891","audit":{"verdict":"pass","basis":"phase4_adjudicated"}},{"id":"d-hner-2022-blood-140-1345-C0088","shortId":"C0088","paper":"d-hner-2022-blood-140-1345","category":"treatment","tier":"restated secondary","genes":["IDH2"],"diseases":["AML"],"ancestors":[],"locator":"Therapy for AML — Relapsed and refractory disease; Table 10","secondary":null,"text":"The 2022 ELN recommendations list enasidenib as a salvage option for relapsed/refractory IDH2-mutated AML because clinically useful single-agent antileukemic activity has been demonstrated, although a randomized late-line study did not improve overall survival versus conventional care.","baseSha256":"068ec3db10e9d9a98ff687c79c579ee7bc23058c2f3612bd87b53a1ea783b171","audit":{"verdict":"pass","basis":"phase4_adjudicated"}},{"id":"d-hner-2022-blo on — Antecedent AML history","secondary":null,"text":"Under the 2022 ICC, the former AML with myelodysplasia-related changes (AML-MRC) category is removed, and multilineage dysplasia is no longer an independent criterion for that AML category.","baseSha256":"be3bb3070164362fa79905eeacfe0aa4e23de1440c9dcf048d7da6115a57bda0","audit":{"verdict":"pass","basis":"phase3"}},{"id":"d-hner-2022-blood-140-1345-C0094","shortId":"C0094","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"guideline criterion","genes":["TP53"],"diseases":["AML","MDS/AML"],"ancestors":["MDS"],"locator":"AML classification — remaining AML cases; Figure 1; Table 1; Figure 1; AML classification — remaining AML cases","secondary":null,"text":"Under the 2022 ICC, cases lacking a recurrent AML-defining abnormality, TP53-mutated category, myelodysplasia-related gene mutation category, or myelodysplasia-related cytogenetic category are classified as AML, not otherwise specified at ≥20% blasts, or MDS/AML at 10%-19% blasts, irrespective of multilineage dysplasia.","baseSha256":"ab0d568f67bab779eed8ad29ff8d3705c6e14c44610d154d4e59ba144859555f","audit":{"verdict":"pass","basis":"phase3"}},{"id":"d-hner-2022-blood-140-1345-C0095","shortId":"C0095","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["AML"],"ancestors":[],"locator":"Germline predisposition","secondary":null,"text":"Under the 2022 ICC, when an inherited germline predisposing disorder is identified in a patient with AML, the germline disorder is appended as a diagnostic qualifier to the specific AML category.","baseSha256":"77cb1f8d18123d1a5207c5b14eb0a31ae6d30974497dbd7c4b86ffb45f8d8a2b","audit":{"verdict":"pass","basis":"phase3"}},{"id":"d-hner-2022-blood-140-1345-C0096","shortId":"C0096","paper":"d-hner-2022-blood-140-1345","category":"prognosis","tier":"guideline criterion","genes":["NPM1"],"diseases":["AML"],"ancestors":[],"locator":"2022 European LeukemiaNet genetic risk classification at diagnosis","secondary":null,"text":"The 2022 ELN recommendations state that subsequent MRD response may modify the initial ELN genetic risk assignment in NPM1-mutated AML.","baseSha256":"eefc8940482d1e754b7cfcee0811b16f2042e1a4021f9246945b5a58e1d3fa2f","audit":{"verdict":"pass","basis":"phase3"}},{"id":"d-hner-2022-blood-140-1345-C0097","shortId":"C0097","paper":"d-hner-2022-blood-140-1345","category":"biomarker","tier":"guideline criterion","genes":["FLT3","IDH1","IDH2","NPM1","CEBPA","DDX41","TP53","ASXL1","BCOR","EZH2","RUNX1","SF3B1","SRSF2","STAG2","U2AF1","ZRSR2"],"diseases":["AML"],"ancestors":[],"locator":"Table 4 — Genetic analyses at diagnosis","secondary":null,"text":"The 2022 ELN recommendations recommend mutation testing at AML diagnosis for FLT3, IDH1, IDH2, NPM1, CEBPA, DDX41, TP53, ASXL1, BCOR, EZH2, RUNX1, SF3B1, SRSF2, STAG2, U2AF1, and ZRSR2 because these genes are required for disease/risk classification and/or identification of actionable therapeutic targets as applicable.","baseSha256":"cf1a41baa3c607579a99005b380f70d5554e7d663c95bd5704d3793916aa6389","audit":{"verdict":"pass","basis":"phase3"}},{"id":"d-hner-2022-blood-140-1345-C0098","shortId":"C0098","paper":"d-hner-2022-blood-140-1345","category":"biomarker","tier":"guideline criterion","genes":["PML","RARA","CBFB","MYH11","RUNX1","RUNX1T1","KMT2A","BCR","ABL1"],"diseases":["AML"],"ancestors":[],"locator":"Table 4 — Screening for gene rearrangements; footnote **","secondary":null,"text":"The 2022 ELN recommendations recommend screening at AML diagnosis for PML::RARA, CBFB::MYH11, RUNX1::RUNX1T1, KMT2A rearrangements, and BCR::ABL1 when rapid therapeutic information is needed, chromosome morphology is poor, or typical morphology lacks the suspected cytogenetic abnormality.","baseSha256":"4283ca5947f801dd36d384f24e5b230a34c3d397b8c98a8180ffe350be2ba142","audit":{"verdict":"pass","basis":"phase4_adjudicated"}},{"id":"d-hner-2022-blood-140-1345-C0099","shortId":"C0099","paper":"d-hner-2022-blood-140-1345","category":"biomarker","tier":"guideline criterion","genes":["ANKRD26","BCORL1","BRAF","CBL","CSF3R","DNMT3A","ETV6","GATA2","JAK2","KIT","KRAS","NRAS","NF1","PHF6","PPM1D","PTPN11","RAD21","SETBP1","TET2","WT1"],"diseases":["AML"],"ancestors":[],"locator":"Table 4 — Additional genes recommended to test at diagnosis; footnote ††","secondary":null,"text":"The 2022 ELN recommendations list ANKRD26, BCORL1, BRAF, CBL, CSF3R, DNMT3A, ETV6, GATA2, JAK2, KIT, KRAS, NRAS, NF1, PHF6, PPM1D, PTPN11, RAD21, SETBP1, TET2, and WT1 as additional genes for possible investigational NGS-based disease monitoring after AML diagnosis; DNMT3A and TET2 mutations consistent with clonal hematopoiesis are specifically excluded from use as AML MRD markers.","baseSha256":"928bd11981f48ac987ced78ae5ea86d260ef3211b94f7a2752e3b7f8c12f0925","audit":{"verdict":"pass","basis":"phase3"}},{"id":"d-hner-2022-blood-140-1345-C0106","shortId":"C0106","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"guideline criterion","genes":["BCR","ABL1","KMT2A"],"diseases":["acute leukaemia of ambiguous lineage"],"ancestors":[],"locator":"Table 1 — Acute leukemia of ambiguous lineage","secondary":null,"text":"Under the 2022 ICC, mixed-phenotype acute leukemia with BCR::ABL1 and mixed-phenotype acute leukemia with KMT2A rearrangement are recognized distinct genetic entities within acute leukemia of ambiguous lineage.","baseSha256":"48e568f7f145f19af47ad8970d1923651129e28b42c7928c5cd18f0c73523002","audit":{"verdict":"pass","basis":"phase3"}},{"id":"d-hner-2022-blood-140-1345-C0107","shortId":"C0107","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"guideline criterion","genes":["BCR","ABL1"],"diseases":["CML","AML"],"ancestors":["MPN"],"locator":"Figure 1 legend; Changes to the blast thresholds defining AML","secondary":null,"text":"Under the 2022 ICC, BCR::ABL1-positive disease with 10%-19% blasts is classified as chronic myeloid leukemia in accelerated phase rather than AML.","baseSha256":"6b927987181fb3352e1c4e0ee532f6a5e6acbbba36633d8371959b082101a763","audit":{"verdict":"pass","basis":"phase3"}},{"id":"d-hner-2022-blood-140-1345-C0108","shortId":"C0108","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"guideline criterion","genes":["BCR","ABL1"],"diseases":["CML","AML"],"ancestors":["MPN"],"locator":"Figure 1 legend","secondary":null,"text":"Under the 2022 ICC, in a patient with a history of chronic myeloid leukemia, BCR::ABL1-positive disease with ≥20% blasts is classified as CML in myeloid blast phase rather than de novo AML with BCR::ABL1.","baseSha256":"ba1404d2d9c1c5e0411a2dd9c8660f159d8d9620e716b4ac2331d6b7468b10fc","audit":{"verdict":"pass","basis":"phase3"}},{"id":"d-hner-2022-blood-140-1345-C0109","shortId":"C0109","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["MDS/MPN","AML"],"ancestors":["MDS","MPN"],"locator":"Table 1 — Diagnostic qualifiers","secondary":null,"text":"Under the 2022 ICC, a prior MDS/MPN is appended as a diagnostic qualifier to the AML category only when the MDS/MPN was established by standard diagnostics more than 3 months before AML diagnosis, and the MDS/MPN type should be specified.","baseSha256":"d0d53b55fabcc486bfc52fb83e7940e6f4ee1df82d5b778ed96d261f4fa54e52","audit":{"verdict":"pass","basis":"phase3"}},{"id":"d-hner-2022-blood-140-1345-C0110","shortId":"C0110","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["MPN","MPN blast phase"],"ancestors":[],"locator":"Figure 1 legend","secondary":null,"text":"Under the 2022 ICC, patients with a prior myeloproliferative neoplasm are excluded from the AML hierarchy and are classified as accelerated-phase MPN at 10%-19% blasts or MPN blast phase at ≥20% blasts.","baseSha256":"745d9a88db3ac6759fa29530bcb63a34f6de111884a91490456fb3f363a09faf","audit":{"verdict":"pass","basis":"phase3"}},{ pillary electrophoresis for FLT3-ITD detection in AML because longer FLT3 internal tandem duplications can be missed by next-generation sequencing.","baseSha256":"8f3c9ff80fadd418265e223637c910fd72a349f49d3eed28c434a5944ed5b6b0","audit":{"verdict":"pass","basis":"phase3"}},{"id":"d-hner-2022-blood-140-1345-C0117","shortId":"C0117","paper":"d-hner-2022-blood-140-1345","category":"germline","tier":"guideline criterion","genes":["CHEK2","DDX41"],"diseases":[],"ancestors":[],"locator":"Table 3 footnote","secondary":null,"text":"The 2022 ELN recommendations advise consideration of germline testing when CHEK2 I200T or a truncating DDX41 variant is identified on tumor profiling, even when identified once.","baseSha256":"49130b9cb6386e01484d74eea4715b9015c124deaaf6b1b03a22c610102c5116","audit":{"verdict":"pass","basis":"phase3"}},{"id":"d-hner-2022-blood-140-1345-C0122","shortId":"C0122","paper":"d-hner-2022-blood-140-1345","category":"treatment","tier":"restated secondary","genes":["CD33"],"diseases":["AML"],"ancestors":[],"locator":"Therapy for AML — Gemtuzumab ozogamicin","secondary":null,"text":"In patients aged 50-70 years with de novo CD33-positive AML, adding gemtuzumab ozogamicin to frontline therapy provides an event-free-survival benefit in favorable- or intermediate-cytogenetic-risk disease, with no corresponding benefit stated for adverse-risk disease.","baseSha256":"7a157dd0cfa94859b87ee345e3da5cab90e697779d56e78398d1b8e98d46017a","audit":{"verdict":"pass","basis":"phase3"}},{"id":"d-hner-2022-blood-140-1345-C0124","shortId":"C0124","paper":"d-hner-2022-blood-140-1345","category":"biomarker","tier":"guideline criterion","genes":["RUNX1","RUNX1T1","CBFB","MYH11","KMT2A","MECOM"],"diseases":["AML"],"ancestors":[],"locator":"Diagnostic procedures — Cytogenetic and molecular studies; Table 4 footnote §","secondary":null,"text":"The 2022 ELN recommendations identify FISH as an alternative method to detect RUNX1::RUNX1T1, CBFB::MYH11, KMT2A rearrangements, and MECOM rearrangements when conventional cytogenetic analysis yields no analyzable metaphases in AML.","baseSha256":"42ef6fbb1c2280dc2dd821386542550b59219bf647d9aadb9fc1c5c0da62f9c0","audit":{"verdict":"pass","basis":"phase3"}},{"id":"d-hner-2022-blood-140-1345-C0127","shortId":"C0127","paper":"d-hner-2022-blood-140-1345","category":"treatment","tier":"guideline criterion","genes":[],"diseases":["AML"],"ancestors":[],"locator":"Table 11 — Selected treatment options for patients not suitable for intensive chemotherapy; Therapy for AML — Patients not considered candidates for intensive therapy","secondary":null,"text":"The 2022 ELN recommendations list best supportive care as an appropriate option for patients with AML who cannot tolerate any active antileukemic therapy or who do not wish to receive antileukemic treatment.","baseSha256":"73bd0caa8cb79901dce200bdd650977b9b8d99f305197052f58561ee3c18aad1","audit":{"verdict":"pass","basis":"phase3"}},{"id":"d-hner-2024-blood-144-2169-C0001","shortId":"C0001","paper":"d-hner-2024-blood-144-2169","category":"prognosis","tier":"restated secondary","genes":["NPM1","IDH2","FLT3","KRAS","NRAS"],"diseases":["AML"],"ancestors":[],"locator":"HMAs plus VEN, paragraph beginning “Within these newly deﬁned higher- and intermediate-beneﬁt groups”","secondary":{"display":"Döhner H, Pratz KW, DiNardo CD, et al. Genetic risk stratiﬁcation and outcomes among treatment-naive patients with AML treated with venetoclax and azacitidine. Blood. 2024;144(21):2211-2222."},"text":"Exploratory analyses in NPM1- or IDH2-mutated AML treated with azacitidine/venetoclax found inferior overall survival when FLT3-ITD, KRAS, and/or NRAS mutations co-occurred.","baseSha256":"2e61edfbab5c80e46d0a67e97aa440e72989d7b289bc261eb0b7adb05357caeb","audit":{"verdict":"pass","basis":"phase3"}},{"id":"d-hner-2024-blood-144-2169-C0002","shortId":"C0002","paper":"d-hner-2024-blood-144-2169","category":"prognosis","tier":"restated secondary","genes":["RUNX1"],"diseases":["AML"], id leukemia. Clin Cancer Res. 2022;28(13):2744-2752."},"text":"FLT3-ITD positivity has an adverse prognostic impact in AML treated with azacitidine/venetoclax.","baseSha256":"7eb2d6eb0d702eea50b73da7aa334861e1b939789bc610aee3ca58fee6717c35","audit":{"verdict":"pass","basis":"phase3"}},{"id":"d-hner-2024-blood-144-2169-C0005","shortId":"C0005","paper":"d-hner-2024-blood-144-2169","category":"prognosis","tier":"guideline criterion","genes":["NPM1","IDH2","FLT3","NRAS","KRAS","TP53"],"diseases":["AML"],"ancestors":[],"locator":"Table 1, risk row; Genetic risk classification applicability/limitations","secondary":null,"text":"According to the proposed 2024 ELN Less-Intensive classification, newly diagnosed AML with mutated NPM1 or IDH2, FLT3-ITD negativity, NRAS/KRAS wild type, and TP53 wild type is favorable risk with HMA-based less-intensive therapy. This framework does not apply after prior HMA therapy and has limited relevance in patients with a prior myeloproliferative neoplasm.","baseSha256":"e14a31961649ae458eefecc56693c1f797251316f5c03c344c3a85e413dbc019","audit":{"verdict":"pass","basis":"phase3"}},{"id":"d-hner-2024-blood-144-2169-C0006","shortId":"C0006","paper":"d-hner-2024-blood-144-2169","category":"prognosis","tier":"guideline criterion","genes":["IDH1","TP53"],"diseases":["AML"],"ancestors":[],"locator":"Table 1, risk row; Genetic risk classification applicability/limitations","secondary":null,"text":"According to the proposed 2024 ELN Less-Intensive classification, IDH1-mutated, TP53-wild-type AML is favorable risk specifically with azacitidine/ivosidenib, irrespective of the presence of activating signaling gene mutations. This framework does not apply after prior HMA therapy and has limited relevance in patients with a prior myeloproliferative neoplasm.","baseSha256":"a7eb2dab01a4eea5b3739d4bc1c73a17f799fa74e1411393ab524db277efb775","audit":{"verdict":"pass","basis":"phase3"}},{"id":"d-hner-2024-blood-144-2169-C0007","shortId":"C0007","paper":"d-hner-2024-blood-144-2169","category":"prognosis","tier":"guideline criterion","genes":["DDX41"],"diseases":["AML"],"ancestors":[],"locator":"Table 1, risk row; Genetic risk classification applicability/limitations","secondary":null,"text":"According to the proposed 2024 ELN Less-Intensive classification, DDX41-mutated AML is favorable risk with HMA-based less-intensive therapy. This framework does not apply after prior HMA therapy and has limited relevance in patients with a prior myeloproliferative neoplasm.","baseSha256":"d635ac121e171c9615ee3fecfd2f8da506596b0b390bfca1167f7aed18fb1300","audit":{"verdict":"pass","basis":"phase3"}},{"id":"d-hner-2024-blood-144-2169-C0008","shortId":"C0008","paper":"d-hner-2024-blood-144-2169","category":"prognosis","tier":"guideline criterion","genes":["FLT3","NRAS","KRAS","TP53"],"diseases":["AML"],"ancestors":[],"locator":"Table 1, risk row; Genetic risk classification applicability/limitations","secondary":null,"text":"According to the proposed 2024 ELN Less-Intensive classification, other cytogenetic and/or molecular abnormalities in newly diagnosed AML are tentatively favorable risk when FLT3-ITD is negative, NRAS and KRAS are wild type, and TP53 is wild type. This framework does not apply after prior HMA therapy and has limited relevance in patients with a prior myeloproliferative neoplasm.","baseSha256":"96879e3cc0d0661ea255399ef401afa0bd6381e5bdd284cd61f452cc7fcb7f43","audit":{"verdict":"pass","basis":"phase3"}},{"id":"d-hner-2024-blood-144-2169-C0009","shortId":"C0009","paper":"d-hner-2024-blood-144-2169","category":"prognosis","tier":"guideline criterion","genes":["FLT3","NRAS","KRAS","TP53"],"diseases":["AML"],"ancestors":[],"locator":"Table 1, intermediate-risk row; Genetic risk classification applicability/limitations","secondary":null,"text":"According to the proposed 2024 ELN Less-Intensive classification, other cytogenetic and molecular abnormalities in newly diagnosed AML are tentatively intermediate risk when FLT3-ITD is positive and/or NRAS or KRAS is mutated, with TP53 wild type. This framework does not apply after prior HMA therapy and has limited relevance in patients with a prior myeloproliferative neoplasm.","baseSha256":"f5a9dfdbe26dda3cce74f10e0026c5967c470280afdd36745969366ead7975b2","audit":{"verdict":"pass","basis":"phase3"}},{"id":"d-hner-2024-blood-144-2169-C0010","shortId":"C0010","paper":"d-hner-2024-blood-144-2169","category":"prognosis","tier":"guideline criterion","genes":["TP53"],"diseases":["AML"],"ancestors":[],"locator":"Table 1, adverse-risk row; Genetic risk classification applicability/limitations","secondary":null,"text":"According to the proposed 2024 ELN Less-Intensive classification, TP53-mutated AML is adverse risk with HMA-based less-intensive therapy. This framework does not apply after prior HMA therapy and has limited relevance in patients with a prior myeloproliferative neoplasm.","baseSha256":"559aa912b1652bbb009c4c38d0dd9456f80886e5875f55dad61e180033194041","audit":{"verdict":"pass","basis":"phase3"}},{"id":"d-hner-2024-blood-144-2169-C0012","shortId":"C0012","paper":"d-hner-2024-blood-144-2169","category":"prognosis","tier":"guideline criterion","genes":["FLT3","NRAS","KRAS","TP53"],"diseases":["AML"],"ancestors":[],"locator":"Table 2, favorable-risk group; Genetic risk classification applicability/limitations","secondary":null,"text":"According to the proposed 2024 ELN Less-Intensive classification, AML with myelodysplasia-related gene mutations is favorable risk when FLT3-ITD is negative, NRAS and KRAS are wild type, and TP53 is wild type. This framework does not apply after prior HMA therapy and has limited relevance in patients with a prior myeloproliferative neoplasm.","baseSha256":"e4a96ca0cce684dab7d23161c13fd16c1a5c7313676436a23761587ae78fd120","audit":{"verdict":"pass","basis":"phase3"}},{"id":"d-hner-2024-blood-144-2169-C0013","shortId":"C0013","paper":"d-hner-2024-blood-144-2169","category":"prognosis","tier":"guideline criterion","genes":["FLT3","NRAS","KRAS","TP53"],"diseases":["AML"],"ancestors":[],"locator":"Table 2, intermediate-risk group; Genetic risk classification applicability/limitations","secondary":null,"text":"According to the proposed 2024 ELN Less-Intensive classification, AML with myelodysplasia-related gene mutations is intermediate risk when FLT3-ITD is positive and/or NRAS or KRAS is mutated, with TP53 wild type. This framework does not apply after prior HMA therapy and has limited relevance in patients with a prior myeloproliferative neoplasm.","baseSha256":"8b474dcbdd50f2a17606f04587aefb4c552fa56d699d46bf26ee57d5ce65ba36","audit":{"verdict":"pass","basis":"phase3"}},{"id":"d-hner-2024-blood-144-2169-C0014","shortId":"C0014","paper":"d-hner-2024-blood-144-2169","category":"prognosis","tier":"restated secondary","genes":["ASXL1"],"diseases":["AML"],"ancestors":[],"locator":"Genetic risk classification, paragraph beginning “secondary AML”","secondary":{"display":"Rahmani NE, Ramachandra N, Sahu S, et al. ASXL1 mutations are associated with distinct epigenomic alterations that lead to sensitivity to venetoclax and azacytidine. Blood Cancer J. 2021;11(9):157."},"text":"ASXL1 mutations have been linked to improved outcomes in AML treated with HMA/venetoclax.","baseSha256":"77bbca72f82d31e7f97cbee280428dcca87ffc7e8972c090f11055cd8923b996","audit":{"verdict":"pass","basis":"phase3"}},{"id":"d-hner-2024-blood-144-2169-C0016","shortId":"C0016","paper":"d-hner-2024-blood-144-2169","category":"treatment","tier":"restated secondary","genes":["TP53","FLT3"],"diseases":["AML"],"ancestors":[],"locator":"HMAs plus VEN, paragraph containing “failure to improve survival above AZA alone”","secondary":null,"text":"In TP53-mutated or FLT3-ITD-positive AML, adding venetoclax to azacitidine has been reported not to improve survival beyond azacitidine alone.","baseSha256":"19594fde9bfdbc68405fc05ec7f46ad97dd45f8208aedb5f86cc13e5c6a123d1","audit":{"verdict":"pass","basis":"phase3"}},{"id":"d-hner
