0f40ec8262e9151266648f71c0c0fca175","audit":{"verdict":"pass","basis":"phase3"}},{"id":"elena-2016-blood-128-1408-C0003","shortId":"C0003","paper":"elena-2016-blood-128-1408","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["CMML"],"ancestors":["MDS","MDS/MPN","MPN"],"locator":"Introduction, paragraph beginning 'Chronic myelomonocytic leukemia (CMML) is a myeloid neoplasm'","secondary":{"display":"Arber DA, Orazi A, Hasserjian R, et al. The 2016 revision to the World Health Organization classification of myeloid neoplasms and acute leukemia. Blood. 2016;127(20):2391-2405."},"text":"According to the 2016 WHO revision, chronic myelomonocytic leukemia includes dysplastic and proliferative types.","baseSha256":"12f16277570eb4f4ded6d365d57438fd1fd150a46c3d1211fd27024e7d81a0ff","audit":{"verdict":"pass","basis":"phase3"}},{"id":"elena-2016-blood-128-1408-C0005","shortId":"C0005","paper":"elena-2016-blood-128-1408","category":"prognosis","tier":"multivariable-adjusted","genes":["ASXL1","NRAS","RUNX1","SETBP1"],"diseases":["CMML"],"ancestors":["MDS","MDS/MPN","MPN"],"locator":"Results, Prognostic value of genetic lesions in CMML, multivariable Cox regression paragraph; Results, Development of a clinical/molecular prognostic scoring system in CMML","secondary":null,"text":"According to the CMML-specific genetic score developed as part of the CPSS-Mol framework, mutations in ASXL1, NRAS, RUNX1, and SETBP1 are independently associated with inferior overall survival in chronic myelomonocytic leukemia.","baseSha256":"2a426014f2f12ed578b2b3e7fa0fa32c8a7600b2792bc5301f02b4167c2cca84","audit":{"verdict":"pass","basis":"phase3"}},{"id":"elena-2016-blood-128-1408-C0006","shortId":"C0006","paper":"elena-2016-blood-128-1408","category":"prognosis","tier":"univariable or descriptive","genes":["EZH2"],"diseases":["CMML"],"ancestors":["MDS","MDS/MPN","MPN"],"locator":"Results, Prognostic value of genetic lesions in CMML, univariable analysis and multivariable Cox regression paragraphs","secondary":null,"text":"In chronic myelomonocytic leukemia, EZH2 mutation is associated with inferior overall survival in univariable analysis, but was not retained as an independent prognostic factor in multivariable analysis.","baseSha256":"db1608f91db73e38f9f503765d763682518200e9c7c3679056b37a5606328f45","audit":{"verdict":"pass","basis":"phase4_adjudicated"}},{"id":"guglielmelli-2017-mipss70-pmf-C0001","shortId":"C0001","paper":"guglielmelli-2017-mipss70-pmf","category":"prognosis","tier":"multivariable-adjusted","genes":["CALR"],"diseases":["PMF"],"ancestors":["MPN"],"locator":"Development and Validation of Mutation-Enhanced IPSS: MIPSS70; Development and Validation of the Cytogenetic-Enhanced MIPSS70 Scoring System: MIPSS70-Plus; Table 2","secondary":null,"text":"According to the MIPSS70 and MIPSS70-plus frameworks, absence of a type 1-like CALR mutation in patients aged 70 years or younger with primary myelofibrosis is associated with inferior overall survival.","baseSha256":"2e7448a221d03dab2189d596b589dea7c65eeb3c727f34a5745b8dfa4975cbe0","audit":{"verdict":"pass","basis":"phase4_adjudicated"}},{"id":"guglielmelli-2017-mipss70-pmf-C0002","shortId":"C0002","paper":"guglielmelli-2017-mipss70-pmf","category":"prognosis","tier":"multivariable-adjusted","genes":["ASXL1","EZH2","SRSF2","IDH1","IDH2"],"diseases":["PMF"],"ancestors":["MPN"],"locator":"Mutation Analysis; Development and Validation of Mutation-Enhanced IPSS: MIPSS70; Development and Validation of the Cytogenetic-Enhanced MIPSS70 Scoring System: MIPSS70-Plus; Table 2","secondary":null,"text":"According to the MIPSS70 and MIPSS70-plus frameworks, the presence of a high-molecular-risk mutation in ASXL1, EZH2, SRSF2, IDH1, or IDH2 in patients aged 70 years or younger with primary myelofibrosis is associated with inferior overall survival.","baseSha256":"9e5729d5bcabf53ac7d739885fdd979569f97865fe68b1821a169c1b07bf29ba","audit":{"verdict":"pass","basis":"phase4_adjudicated"}},{"id":"guglielmelli-2017-mipss70-pmf-C0003","shortId":"C0003","paper":"guglielmelli-2017-mipss70-pmf","category":"prognosis","tier":"multivariable-adjusted","genes":["ASXL1","EZH2","SRSF2","IDH1","IDH2"],"diseases":["PMF"],"ancestors":["MPN"],"locator":"Development and Validation of Mutation-Enhanced IPSS: MIPSS70; Development and Validation of the Cytogenetic-Enhanced MIPSS70 Scoring System: MIPSS70-Plus; Table 2","secondary":null,"text":"According to the MIPSS70 and MIPSS70-plus frameworks, the presence of mutations in two or more of ASXL1, EZH2, SRSF2, IDH1, and IDH2 in patients aged 70 years or younger with primary myelofibrosis identifies a particularly adverse overall-survival group.","baseSha256":"8f8c8ea93339f828a4fcf89ac3f6217e77b82908a5d83f8e476bd12308a5b25c","audit":{"verdict":"pass","basis":"phase4_adjudicated"}},{"id":"guglielmelli-2017-mipss70-pmf-C0004","shortId":"C0004","paper":"guglielmelli-2017-mipss70-pmf","category":"prognosis","tier":"univariable or descriptive","genes":["CALR","ASXL1","EZH2","SRSF2","IDH1","IDH2"],"diseases":["PMF"],"ancestors":["MPN"],"locator":"Development and Validation of Mutation-Enhanced IPSS: MIPSS70; Table 3; Figure 1A-B","secondary":null,"text":"According to the MIPSS70 framework, which incorporates CALR, ASXL1, EZH2, SRSF2, IDH1, and IDH2 with clinical factors, patients aged 70 years or younger with primary myelofibrosis are classified into low-, intermediate-, and high-risk overall-survival groups.","baseSha256":"4fe23767464ccab7b48a3f0d4873cfa6a34f62c377b6ea0361d66fa4fa0e1766","audit":{"verdict":"pass","basis":"phase3"}},{"id":"guglielmelli-2017-mipss70-pmf-C0005","shortId":"C0005","paper":"guglielmelli-2017-mipss70-pmf","category":"prognosis","tier":"univariable or descriptive","genes":["CALR","ASXL1","EZH2","SRSF2","IDH1","IDH2"],"diseases":["PMF"],"ancestors":["MPN"],"locator":"Development and Validation of the Cytogenetic-Enhanced MIPSS70 Scoring System: MIPSS70-Plus; Table 3; Figure 1C-D","secondary":null,"text":"According to the MIPSS70-plus framework, which incorporates CALR, ASXL1, EZH2, SRSF2, IDH1, and IDH2 with clinical and cytogenetic factors, patients aged 70 years or younger with primary myelofibrosis are classified into low-, intermediate-, high-, and very-high-risk overall-survival groups.","baseSha256":"25ce55c5110a0de18717f815b2db714fe0e6970346b934c0685cbc6eab9813f3","audit":{"verdict":"pass","basis":"phase3"}},{"id":"guglielmelli-2017-mipss70-pmf-C0006","shortId":"C0006","paper":"guglielmelli-2017-mipss70-pmf","category":"prognosis","tier":"univariable or descriptive","genes":["CALR","ASXL1","EZH2","SRSF2","IDH1","IDH2"],"diseases":["PMF"],"ancestors":["MPN"],"locator":"All Age-Inclusive Application of Novel Prognostic Scoring Systems; Appendix Table A2; Discussion","secondary":null,"text":"According to the MIPSS70 framework, which incorporates CALR, ASXL1, EZH2, SRSF2, IDH1, and IDH2 with clinical factors, overall-survival risk stratification in primary myelofibrosis remains informative when patients older than 70 years are included.","baseSha256":"9b9749200cfb7ca730a5e702510fc3ea685dfaeafcdf774b484796a75c7a22e3","audit":{"verdict":"pass","basis":"phase4_adjudicated"}},{"id":"guglielmelli-2017-mipss70-pmf-C0007","shortId":"C0007","paper":"guglielmelli-2017-mipss70-pmf","category":"prognosis","tier":"univariable or descriptive","genes":["CALR","ASXL1","EZH2","SRSF2","IDH1","IDH2"],"diseases":["PMF"],"ancestors":["MPN"],"locator":"All Age-Inclusive Application of Novel Prognostic Scoring Systems; Appendix Table A2; Discussion","secondary":null,"text":"According to the MIPSS70-plus framework, which incorporates CALR, ASXL1, EZH2, SRSF2, IDH1, and IDH2 with clinical and cytogenetic factors, overall-survival risk stratification in primary myelofibrosis remains informative when patients older than 70 years are included.","baseSha256":"bcfefb7bba2999213398032f35afbe7d9af5b034d552d846b5334674e9c32229","audit":{"verdict":"pass","basis":"phase4_adjudicated"}},{"id":"khoury-2022-leukemia-36-1703-C0001","shortId":"C0001","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["CHIP"],"ancestors":[],"locator":"CLONAL HAEMATOPOIESIS — CHIP definition","secondary":null,"text":"According to WHO 5th Edition 2022, clonal haematopoiesis is recognized as a precursor myeloid disease state, and CHIP is defined as clonal haematopoiesis with somatic mutations in myeloid malignancy-associated genes detected in blood or bone marrow at VAF ≥2% (≥4% for X-linked gene mutations in males), in the absence of a diagnosed haematologic disorder or unexplained cytopenia.","baseSha256":"abb9b9ca075973577b31b2c1b7e332c72960585820ee8422fde2a00c9dddcd6a","audit":{"verdict":"pass","basis":"phase3"}},{"id":"khoury-2022-leukemia-36-1703-C0002","shortId":"C0002","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["CCUS"],"ancestors":[],"locator":"CLONAL HAEMATOPOIESIS — CCUS definition","secondary":null,"text":"According to WHO 5th Edition 2022, CCUS is defined as CHIP with one or more persistent cytopenias that are otherwise unexplained and that do not meet diagnostic criteria for a defined myeloid neoplasm.","baseSha256":"7219c629f8e548c3ecc01416d3b6a8d440defbe6c6440df5b0a7e8db8153fc0f","audit":{"verdict":"pass","basis":"phase3"}},{"id":"khoury-2022-leukemia-36-1703-C0003","shortId":"C0003","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["CCUS","MDS","MDS/MPN"],"ancestors":["MPN"],"locator":"CLONAL HAEMATOPOIESIS — harmonized cytopenia thresholds","secondary":null,"text":"According to WHO 5th Edition 2022, cytopenia thresholds harmonized across CCUS, MDS and MDS/MPN are haemoglobin <13 g/dL in males or <12 g/dL in females, absolute neutrophil count <1.8 × 10^9/L, and platelets <150 × 10^9/L.","baseSha256":"1bdc5dd5b1f4eb23fd86b1c32fbf0d033eb316eaffb5025a3bec8bcec5e17cf4","audit":{"verdict":"pass","basis":"phase3"}},{"id":"khoury-2022-leukemia-36-1703-C0004","shortId":"C0004","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["BCR","ABL1"],"diseases":["CML"],"ancestors":["MPN"],"locator":"MYELOPROLIFERATIVE NEOPLASMS — CML definition","secondary":null,"text":"According to WHO 5th Edition 2022, chronic myeloid leukaemia is defined by BCR::ABL1 resulting from t(9;22)(q34;q11).","baseSha256":"206006c9c3f62705faf7d13003a917c7d5e64c96cf4d93c3e4cae7251050f865","audit":{"verdict":"pass","basis":"phase3"}},{"id":"khoury-2022-leukemia-36-1703-C0005","shortId":"C0005","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["CML"],"ancestors":["MPN"],"locator":"MYELOPROLIFERATIVE NEOPLASMS — CML phase classification","secondary":null,"text":"According to WHO 5th Edition 2022, CML is classified into chronic and blast phases; accelerated phase is omitted. Blast phase is defined by ≥20% myeloid blasts in blood or bone marrow, extramedullary proliferation of blasts, or increased lymphoblasts in blood or marrow. The optimal lymphoblast cutoff and significance of low-level B-lymphoblasts remain uncertain.","baseSha256":"57aceda0c800bcd2746bb7abb8a1975e09b9c19ad174615e08d3c31732cae246","audit":{"verdict":"pass","basis":"phase3"}},{"id":"khoury-2022-leukemia-36-1703-C0006","shortId":"C0006","paper":"khoury-2022-leukemia-36-1703","category":"treatment","tier":"restated secondary","genes":["ABL1"],"diseases":["CML"],"ancestors":["MPN"],"locator":"MYELOPROLIFERATIVE NEOPLASMS — CML resistance features","secondary":null,"text":"In chronic-phase CML, ABL1 kinase mutations are a source of resistance to tyrosine-kinase inhibitor therapy.","baseSha256":"122ab53ed590df6196cae0721be8f1fe154f2bbfe69dbd8aca29b825781d80c4","audit":{"verdict":"pass","basis":"phase3"}},{"id":"khoury-2022-leukemia-36-1703-C0009","shortId":"C0009","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["JAK2"],"diseases":["PV"],"ancestors":["MPN"],"locator":"MYELOPROLIFERATIVE NEOPLASMS — PV major diagnostic criteria","secondary":null,"text":"According to WHO 5th Edition 2022, major diagnostic criteria for polycythaemia vera include elevated haemoglobin and/or haematocrit, bone-marrow trilineage hyperplasia (panmyelosis) with pleomorphic mature megakaryocytes, and JAK2 p.V617F or a JAK2 exon 12 mutation. Measurement of increased red-cell mass with 51Cr-labelled red cells is no longer a diagnostic criterion.","baseSha256":"c615703be075c91f8d8bdb006ca8f3fe19ef789b341a43e831151b74c040597e","audit":{"verdict":"pass","basis":"phase3"}},{"id":"khoury-2022-leukemia-36-1703-C0011","shortId":"C0011","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["PMF","ET","PV"],"ancestors":["MPN"],"locator":"MYELOPROLIFERATIVE NEOPLASMS — prefibrotic PMF distinction","secondary":null,"text":"According to WHO 5th Edition 2022, recognition of prefibrotic primary myelofibrosis remains necessary to distinguish it from essential thrombocythaemia, polycythaemia vera and fibrotic primary myelofibrosis.","baseSha256":"e89982eeb8246c42691eef763a9fd9f3f978232f544b9236ab9182e2b26bbff1","audit":{"verdict":"pass","basis":"phase3"}},{"id":"khoury-2022-leukemia-36-1703-C0012","shortId":"C0012","paper":"khoury-2022-leukemia-36-1703","category":"prognosis","tier":"restated secondary","genes":["EZH2","IDH1","IDH2","SRSF2","U2AF1","ASXL1"],"diseases":["PMF"],"ancestors":["MPN"],"locator":"MYELOPROLIFERATIVE NEOPLASMS — additional mutations in PMF","secondary":null,"text":"In primary myelofibrosis, mutations in EZH2, IDH1, IDH2, SRSF2, U2AF1 and ASXL1 are associated with poorer prognostic risk.","baseSha256":"7796d0dde8a428e6d018bd8fd280d3a6272eb338e5707297282f3c0f98188854","audit":{"verdict":"pass","basis":"phase3"}},{"id":"khoury-2022-leukemia-36-1703-C0018","shortId":"C0018","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["BCR","ABL1"],"diseases":["CNL"],"ancestors":["MPN"],"locator":"MYELOPROLIFERATIVE NEOPLASMS — CNL definition","secondary":null,"text":"According to WHO 5th Edition 2022, chronic neutrophilic leukaemia is a BCR::ABL1-negative MPN characterized by sustained peripheral-blood neutrophilia with WBC ≥25 × 10^9/L and ≥80% segmented neutrophils and bands, bone-marrow hypercellularity due to neutrophilic granulocyte proliferation, and hepatosplenomegaly.","baseSha256":"d22a56c2d3254131f7d6c630e535347188b88115dd0f3ca500e01cb5f05ddf29","audit":{"verdict":"pass","basis":"phase3"}},{"id":"khoury-2022-leukemia-36-1703-C0019","shortId":"C0019","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["CEL"],"ancestors":["MPN"],"locator":"MYELOPROLIFERATIVE NEOPLASMS — CEL definition","secondary":null,"text":"According to WHO 5th Edition 2022, chronic eosinophilic leukaemia is defined by sustained clonal proliferation of morphologically abnormal eosinophils and eosinophil precursors producing persistent hypereosinophilia in blood and marrow. Sustained hypereosinophilia requires ≥4 weeks; both clonality and abnormal bone-marrow morphology are required; increased blasts no longer substitute for clonality; and the former “not otherwise specified” qualifier is omitted.","baseSha256":"dd9d7951e472e279b26318cc796a8ab941e3f787776ac4ad5f5b066294bbeab9","audit":{"verdict":"pass","basis":"phase3"}},{"id":"khoury-2022-leukemia-36-1703-C0023","shortId":"C0023","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["MPN-U"],"ancestors":["MPN"],"locator":"MYELOPROLIFERATIVE NEOPLASMS — MPN-NOS","secondary":null,"text":"According to WHO 5th Edition 2022, MPN-U (MPN-NOS) is reserved for cases with clinical, laboratory, morphologic and molecular features of MPN that either fail criteria for a specific MPN type or overlap distinct MPN types.","baseSha256":"c77e9f8b7bcc0d23b4dc7fac058bb154f92d5f12cdc9f6c89cf08c3a7107a785","audit":{"verdict":"pass","basis":"phase3"}},{"id":"khoury-2022-leukemia-36-1703-C0024","shortId":"C0024","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["KMT2A"],"diseases":["JMML"],"ancestors":["MPN"],"locator":"MYELOPROLIFERATIVE NEOPLASMS — JMML diagnostic updates","secondary":null,"text":"According to WHO 5th Edition 2022, JMML diagnosis integrates clinical, laboratory and molecular criteria. Updated criteria exclude KMT2A rearrangements, no longer use monosomy 7 as a cytogenetic diagnostic criterion, and emphasize molecular studies demonstrating RAS-pathway activation.","baseSha256":"025a63745634146bb26663637855f5aed23eae14f0983a3c8c0a5f33ceedfd36","audit":{"verdict":"pass","basis":"phase3"}},{"id":"khoury-2022-leukemia-36-1703-C0027","shortId":"C0027","paper":"khoury-2022-leukemia-36-1703","category":"prognosis","tier":"restated secondary","genes":["PTPN11"],"diseases":["JMML"],"ancestors":["MPN"],"locator":"MYELOPROLIFERATIVE NEOPLASMS — JMML genetic risk","secondary":null,"text":"JMML initiated by somatic PTPN11 mutation is described as among the most aggressive genetic types.","baseSha256":"a7ee8634f7e4b23f108f101db26b91134f6bb9a7afb162ed50b3fd35fe90d823","audit":{"verdict":"pass","basis":"phase3"}},{"id":"khoury-2022-leukemia-36-1703-C0028","shortId":"C0028","paper":"khoury-2022-leukemia-36-1703","category":"prognosis","tier":"restated secondary","genes":["NF1"],"diseases":["JMML"],"ancestors":["MPN"],"locator":"MYELOPROLIFERATIVE NEOPLASMS — JMML genetic risk","secondary":null,"text":"JMML associated with germline pathogenic NF1 variants is described as among the most aggressive genetic types.","baseSha256":"d9afaba876f0736cd4951470d1cd99f07f471e5d3fb2f98788e3724ddf0734f6","audit":{"verdict":"pass","basis":"phase3"}},{"id":"khoury-2022-leukemia-36-1703-C0029","shortId":"C0029","paper":"khoury-2022-leukemia-36-1703","category":"prognosis","tier":"restated secondary","genes":["CBL"],"diseases":["JMML"],"ancestors":["MPN"],"locator":"MYELOPROLIFERATIVE NEOPLASMS — JMML genetic risk","secondary":null,"text":"Some JMML cases associated with pathogenic germline CBL variants can undergo spontaneous remission.","baseSha256":"08f1ef2bb467dc5ef544ec3479db4724097388e875d590ba0b93ccbab2e51cc7","audit":{"verdict":"pass","basis":"phase3"}},{"id":"khoury-2022-leukemia-36-1703-C0030","shortId":"C0030","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["KIT"],"diseases":["mastocytosis"],"ancestors":[],"locator":"MASTOCYTOSIS — systemic mastocytosis minor criteria","secondary":null,"text":"According to WHO 5th Edition 2022, revised minor diagnostic criteria for systemic mastocytosis include any KIT mutation causing ligand-independent activation, CD30 expression, and basal serum tryptase >20 ng/mL; the tryptase value should be adjusted in hereditary alpha-tryptasaemia.","baseSha256":"b979e648ffb0686debf983dd4330d5008ddf2addc8ac3265aaeee0aff2f70dd0","audit":{"verdict":"pass","basis":"phase3"}},{"id":"khoury-2022-leukemia-36-1703-C0033","shortId":"C0033","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["KIT"],"diseases":["mastocytosis"],"ancestors":[],"locator":"MASTOCYTOSIS — B-finding","secondary":null,"text":"According to WHO 5th Edition 2022, KIT p.D816V with VAF ≥10% in bone-marrow cells or peripheral-blood leukocytes qualifies as a B-finding in systemic mastocytosis.","baseSha256":"21bc8c7845dd8585c813ba9d1e17ec08d72d67d0084c0dafeb397dc63784ad08","audit":{"verdict":"pass","basis":"phase3"}},{"id":"khoury-2022-leukemia-36-1703-C0034","shortId":"C0034","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["mastocytosis"],"ancestors":[],"locator":"MASTOCYTOSIS — bone marrow mastocytosis subtype","secondary":null,"text":"According to WHO 5th Edition 2022, bone marrow mastocytosis is a systemic mastocytosis subtype characterized by absence of skin lesions and B-findings and basal serum tryptase <125 ng/mL.","baseSha256":"fd10d375df78e66e9c7d2022676292476af1a2d32125e5a3049b81115daf3f34","audit":{"verdict":"pass","basis":"phase3"}},{"id":"khoury-2022-leukemia-36-1703-C0035","shortId":"C0035","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["MDS"],"ancestors":[],"locator":"MYELODYSPLASTIC NEOPLASMS — core definition and dysplasia threshold","secondary":null,"text":"According to WHO 5th Edition 2022, the term “myelodysplastic neoplasms,” abbreviated MDS, replaces “myelodysplastic syndromes.” MDS is defined as a clonal haematopoietic neoplasm with cytopenia(s) and morphologic dysplasia, with a recommended dysplasia threshold of ≥10% in a lineage.","baseSha256":"860606bc0f05019b13e01334bead579f2d200cb5299eea6ac452ac30d0d19e77","audit":{"verdict":"pass","basis":"phase3"}},{"id":"khoury-2022-leukemia-36-1703-C0036","shortId":"C0036","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["SF3B1","TP53"],"diseases":["MDS"],"ancestors":[],"locator":"MYELODYSPLASTIC NEOPLASMS — MDS-5q Table 3","secondary":null,"text":"According to WHO 5th Edition 2022, MDS with low blasts and isolated 5q deletion requires <5% bone-marrow blasts and <2% peripheral-blood blasts, with 5q deletion alone or with one additional abnormality other than monosomy 7 or 7q deletion. An SF3B1 mutation or a TP53 mutation that is not multi-hit does not by itself override the MDS-5q diagnosis.","baseSha256":"57c3799d1797f670de0b4f83065d22e71c204f354e57afab6f674ed9bd62317f","audit":{"verdict":"pass","basis":"phase3"}},{"id":"khoury-2022-leukemia-36-1703-C0037","shortId":"C0037","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["SF3B1"],"diseases":["MDS"],"ancestors":[],"locator":"MYELODYSPLASTIC NEOPLASMS — MDS-SF3B1 Table 3","secondary":null,"text":"According to WHO 5th Edition 2022, MDS with low blasts and SF3B1 mutation is a genetically defined MDS type in which 5q deletion, monosomy 7 and complex karyotype are exclusionary. Detection of ≥15% ring sideroblasts may substitute for an SF3B1 mutation; for SF3B1-wild-type cases with ≥15% ring sideroblasts, “MDS with low blasts and ring sideroblasts” is an acceptable alternative term.","baseSha256":"0a08922af54b3d5f51196b916bf207b47015ad2b4e6d59a96b8a3ec5fd948d7e","audit":{"verdict":"pass","basis":"phase3"}},{"id":"khoury-2022-leukemia-36-1703-C0039","shortId":"C0039","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["TP53"],"diseases":["MDS"],"ancestors":[],"locator":"MYELODYSPLASTIC NEOPLASMS — MDS-biTP53 Table 3","secondary":null,"text":"According to WHO 5th Edition 2022, MDS with biallelic TP53 inactivation requires <20% blasts in blood and marrow plus either ≥2 TP53 mutations or one TP53 mutation with TP53 copy-number loss or copy-neutral loss of heterozygosity. Two or more TP53 mutations can generally be considered multi-hit status. MDS-biTP53 supersedes MDS-5q and MDS-SF3B1 in the WHO5 genetic hierarchy.","baseSha256":"9d2c1a810b7298dc32f87a96b92bdccb572b183e4aae5310cf5582b301a6d1b7","audit":{"verdict":"pass","basis":"phase3"}},{"id":"khoury-2022-leukemia-36-1703-C0044","shortId":"C0044","paper":"khoury-2022-leukemia-36-1703","category":"biomarker","tier":"guideline criterion","genes":["TP53"],"diseases":["MDS"],"ancestors":[],"locator":"MYELODYSPLASTIC NEOPLASMS — TP53 biallelic-status testing","secondary":null,"text":"According to WHO 5th Edition 2022, clinical assessment of biallelic TP53 alteration in MDS uses sequencing covering at least TP53 exons 4–11, generally coupled with assessment of TP53 copy-number status; copy loss may also be inferred by next-generation sequencing.","baseSha256":"6e3121d23b96b924dd184c372ae38937c54cc55d1a553fc85251d108f9e98868","audit":{"verdict":"pass","basis":"phase3"}},{"id":"khoury-2022-leukemia-36-1703-C0045","shortId":"C0045","paper":"khoury-2022-leukemia-36-1703","category":"biomarker","tier":"guideline criterion","genes":["TP53"],"diseases":["MDS"],"ancestors":[],"locator":"MYELODYSPLASTIC NEOPLASMS — TP53 allelic-state inference","secondary":null,"text":"In MDS, WHO 5th Edition 2022 notes that TP53 VAF ≥50% may be regarded as presumptive, but not definitive, evidence of trans-allelic copy loss or copy-neutral loss of heterozygosity when a constitutional TP53 variant has been excluded.","baseSha256":"a6d5ec5a9ab249377b9dd16efed84734b47ac1f4c3cf2b4991f6c4aac2e65fdb","audit":{"verdict":"pass","basis":"phase3"}},{"id":"khoury-2022-leukemia-36-1703-C0047","shortId":"C0047","paper":"khoury-2022-leukemia-36-1703","category":"prognosis","tier":"restated secondary","genes":["TP53"],"diseases":["MDS"],"ancestors":[],"locator":"MYELODYSPLASTIC NEOPLASMS — MDS-biTP53 risk","secondary":null,"text":"MDS with biallelic TP53 inactivation is regarded as very high risk in IPSS-R.","baseSha256":"d9f06ff62d9036b0bbf3934f95c3c0df201e6bcd86ebf2df38677309a2e20733","audit":{"verdict":"pass","basis":"phase3"}},{"id":"khoury-2022-leukemia-36-1703-C0049","shortId":"C0049","paper":"khoury-2022-leukemia-36-1703","category":"treatment","tier":"restated secondary","genes":["TP53"],"diseases":["MDS"],"ancestors":[],"locator":"MYELODYSPLASTIC NEOPLASMS — MDS-biTP53 therapeutic equivalence","secondary":null,"text":"Published data summarized by the WHO5 paper suggest that MDS with biallelic TP53 inactivation may be regarded as AML-equivalent for therapeutic considerations.","baseSha256":"677192c4c8a2e06f3d84be83ebd7b6b0ffda42465f3eaaa8ffa616d552e9b1d1","audit":{"verdict":"pass","basis":"phase3"}},{"id":"khoury-2022-leukemia-36-1703-C0050","shortId":"C0050","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["MDS"],"ancestors":[],"locator":"MYELODYSPLASTIC NEOPLASMS — hypoplastic MDS","secondary":null,"text":"According to WHO 5th Edition 2022, hypoplastic MDS is a distinct MDS type defined by bone-marrow cellularity ≤25%, adjusted for age.","baseSha256":"43cae2af7f432cdc921b7db274b15c2982f9b5f1d6e0c883b7da57704b1bd9d5","audit":{"verdict":"pass","basis":"phase3"}},{"id":"khoury-2022-leukemia-36-1703-C0051","shortId":"C0051","paper":"khoury-2022-leukemia-36-1703","category":"treatment","tier":"restated secondary","genes":["GATA2","DDX41"],"diseases":["MDS","AML"],"ancestors":[],"locator":"MYELODYSPLASTIC NEOPLASMS — hypoplastic marrow with germline predisposition","secondary":null,"text":"Patients with germline pathogenic GATA2 or DDX41 variants who have hypoplastic marrow and evolve to MDS or AML are described as not responding to immunosuppressive treatment.","baseSha256":"5ca5404836f21886ed6effae332367ada5c8848029d8bf7c21038f8d8b0efb1d","audit":{"verdict":"pass","basis":"phase3"}},{"id":"khoury-2022-leukemia-36-1703-C0053","shortId":"C0053","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["MDS"],"ancestors":[],"locator":"MYELODYSPLASTIC NEOPLASMS — lineage dysplasia terminology","secondary":null,"text":"According to WHO 5th Edition 2022, distinction between single-lineage and multilineage dysplasia is optional rather than disease-type defining in MDS.","baseSha256":"ab6344433586bfd92a6b9b0efde8778a160674f34b365485231ee2008bcfb745","audit":{"verdict":"pass","basis":"phase3"}},{"id":"khoury-2022-leukemia-36-1703-C0054","shortId":"C0054","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["BCR","ABL1","CEBPA"],"diseases":["MDS","AML"],"ancestors":[],"locator":"MYELODYSPLASTIC NEOPLASMS — MDS/AML blast boundary","secondary":null,"text":"According to WHO 5th Edition 2022, a 20% blast cutoff is retained to delineate MDS from AML, but most AML types with defining genetic abnormalities may be diagnosed below 20% blasts. AML with BCR::ABL1 and AML with CEBPA mutation remain exceptions requiring ≥20% blasts. When a genetically defined AML is diagnosed below 20%, morphologic and molecular findings must be correlated to establish that the defining abnormality is driving the disease.","baseSha256":"a32f32762d9f16ba31907a80d58ab8f83fa97586beb379e12c2b37056e68bcc4","audit":{"verdict":"pass","basis":"phase3"}},{"id":"khoury-2022-leukemia-36-1703-C0055","shortId":"C0055","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["MDS"],"ancestors":[],"locator":"MYELODYSPLASTIC NEOPLASMS — childhood MDS-LB exclusion prerequisite","secondary":null,"text":"According to WHO 5th Edition 2022, childhood MDS with low blasts replaces the former term refractory cytopenia of childhood and is defined by <5% bone-marrow blasts and <2% peripheral-blood blasts. It comprises hypocellular and NOS subtypes, and diagnosis requires exclusion of non-neoplastic causes of cytopenia, bone-marrow failure syndromes and germline pathogenic variants.","baseSha256":"5d5b4cf27af89eea142b2a1e5e750f4f9a684cfb89146896710d3b9d431f250d","audit":{"verdict":"pass","basis":"phase3"}},{"id":"khoury-2022-leukemia-36-1703-C0057","shortId":"C0057","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["MDS"],"ancestors":[],"locator":"MYELODYSPLASTIC NEOPLASMS — childhood MDS-IB blast criteria","secondary":null,"text":"According to WHO 5th Edition 2022, childhood MDS with increased blasts is defined by 5–19% bone-marrow blasts or 2–19% peripheral-blood blasts.","baseSha256":"5a6131b318480679f1bc1d776c2ceb401a1ad304f80dda2cde6d3c48be94b177","audit":{"verdict":"pass","basis":"phase3"}},{"id":"khoury-2022-leukemia-36-1703-C0059","shortId":"C0059","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["JAK2","CALR","MPL"],"diseases":["CMML"],"ancestors":["MDS","MDS/MPN","MPN"],"locator":"MYELODYSPLASTIC/MYELOPROLIFERATIVE NEOPLASMS — CMML prerequisite monocytosis","secondary":null,"text":"According to WHO 5th Edition 2022, CMML requires all four prerequisite criteria: persistent absolute peripheral-blood monocytosis ≥0.5 × 10^9/L and relative monocytosis ≥10%; <20% blasts/blast equivalents in blood and marrow; absence of diagnostic criteria for CML or another MPN; and absence of a myeloid/lymphoid neoplasm with a tyrosine-kinase fusion. Supporting criteria are dysplasia in ≥1 myeloid lineage, with ≥10% of cells affected; an acquired clonal cytogenetic or molecular abnormality; and abnormal monocyte partitioning with >94% classical monocytes in the absence of active autoimmune/systemic inflammatory disease. With monocytosis ≥1 × 10^9/L, at least one supporting criterion is required; with monocytosis ≥0.5 but <1 × 10^9/L, both dysplasia and clonality are required. A prior MPN excludes CMML; MPN-type marrow features and/or a high burden of JAK2, CALR or MPL mutations support MPN with monocytosis rather than CMML.","baseSha256":"ab3fe1596a12cfd8a6bacaa5ce1b23817bfa4ac843fbed553e1081d9aa6c3c73","audit":{"verdict":"pass","basis":"phase4_adjudicated"}},{"id":"khoury-2022-leukemia-36-1703-C0068","shortId":"C0068","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["CMML"],"ancestors":["MDS","MDS/MPN","MPN"],"locator":"MYELODYSPLASTIC/MYELOPROLIFERATIVE NEOPLASMS — CMML WBC subtypes","secondary":null,"text":"According to WHO 5th Edition 2022, CMML is subtyped as myelodysplastic CMML when WBC <13 × 10^9/L and myeloproliferative CMML when WBC ≥13 × 10^9/L. Blast-based subgrouping comprises CMML-1 with <5% blasts/promonocytes in blood and <10% in marrow and CMML-2 with 5–19% in blood and 10–19% in marrow; CMML-0 is no longer recognized.","baseSha256":"17e2592d9354880ef41cab8ebb524202a89bbb0dccc77f5f03306b627a78e824","audit":{"verdict":"pass","basis":"phase3"}},{"id":"khoury-2022-leukemia-36-1703-C0072","shortId":"C0072","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["aCML"],"ancestors":["MDS","MDS/MPN","MPN"],"locator":"MYELODYSPLASTIC/MYELOPROLIFERATIVE NEOPLASMS — MDS/MPN with neutrophilia terminology","secondary":null,"text":"According to WHO 5th Edition 2022, atypical chronic myeloid leukaemia is renamed MDS/MPN with neutrophilia.","baseSha256":"0b603dcc24009391c6355296fc3d36a0de2d7dcade8887942c3d5b85a81c4e89","audit":{"verdict":"pass","basis":"phase3"}},{"id":"khoury-2022-leukemia-36-1703-C0073","shortId":"C0073","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["SF3B1"],"diseases":["MDS/MPN-SF3B1-T"],"ancestors":["MDS","MDS/MPN","MPN"],"locator":"MYELODYSPLASTIC/MYELOPROLIFERATIVE NEOPLASMS — MDS/MPN-SF3B1-T","secondary":null,"text":"According to WHO 5th Edition 2022, MDS/MPN with ring sideroblasts and thrombocytosis is redefined on the basis of SF3B1 mutation and renamed MDS/MPN with SF3B1 mutation and thrombocytosis. For SF3B1-wild-type cases with ≥15% ring sideroblasts, MDS/MPN with ring sideroblasts and thrombocytosis remains acceptable terminology.","baseSha256":"cdb0dda371e71e3c803bbaa99de37e0adbde56f2b9355587fc122b25080e574a","audit":{"verdict":"pass","basis":"phase3"}},{"id":"khoury-2022-leukemia-36-1703-C0075","shortId":"C0075","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["AML"],"ancestors":[],"locator":"ACUTE MYELOID LEUKAEMIA — overall WHO5 grouping","secondary":null,"text":"According to WHO 5th Edition 2022, AML is organized into two families: AML with defining genetic abnormalities and AML defined by differentiation. The term AML, NOS is no longer applied to the differentiation-defined family.","baseSha256":"e7fee7b3cac21a6ccfd9e1e35ca50dc73ad00ed970b68bb34978dfb67b08923f","audit":{"verdict":"pass","basis":"phase3"}},{"id":"khoury-2022-leukemia-36-1703-C0078","shortId":"C0078","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["PML","RARA","RUNX1","RUNX1T1","CBFB","MYH11","DEK","NUP214","RBM15","MRTFA"],"diseases":["AML"],"ancestors":[],"locator":"ACUTE MYELOID LEUKAEMIA — Table 7 defining genetic abnormalities","secondary":null,"text":"According to WHO 5th Edition 2022, AML with PML::RARA, RUNX1::RUNX1T1, CBFB::MYH11, DEK::NUP214 or RBM15::MRTFA is classified as AML with a defining genetic abnormality.","baseSha256":"490b6cbaf4611542c927931aaa89a4ec1e585c52ab1b6589a068396be7cbd13b","audit":{"verdict":"pass","basis":"phase3"}},{"id":"khoury-2022-leukemia-36-1703-C0083","shortId":"C0083","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["BCR","ABL1"],"diseases":["AML"],"ancestors":[],"locator":"ACUTE MYELOID LEUKAEMIA — BCR::ABL1 blast threshold","secondary":null,"text":"According to WHO 5th Edition 2022, AML with BCR::ABL1 requires ≥20% blasts, principally to avoid overlap with CML.","baseSha256":"609896763f66f51f8556c4b1fb9e100b1d9696f3b23c89c7946f5dbdf0d215eb","audit":{"verdict":"pass","basis":"phase3"}},{"id":"khoury-2022-leukemia-36-1703-C0084","shortId":"C0084","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["CEBPA"],"diseases":["AML"],"ancestors":[],"locator":"ACUTE MYELOID LEUKAEMIA — CEBPA blast threshold","secondary":null,"text":"According to WHO 5th Edition 2022, AML with CEBPA mutation includes either biallelic CEBPA mutations or a single CEBPA mutation in the basic leucine zipper region and requires ≥20% blasts.","baseSha256":"aaca8fb8f94508025289b0d0018e65fcdb59ba8a932a780218d724b17e30d2f7","audit":{"verdict":"pass","basis":"phase3"}},{"id":"khoury-2022-leukemia-36-1703-C0085","shortId":"C0085","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["KMT2A","MECOM","NUP98"],"diseases":["AML"],"ancestors":[],"locator":"ACUTE MYELOID LEUKAEMIA — rearrangement-defined AML","secondary":null,"text":"According to WHO 5th Edition 2022, AML with KMT2A, MECOM or NUP98 rearrangement may be diagnosed with <20% blasts.","baseSha256":"a67c90b122f99dae1b7bb4090e7436401660fa7ed511c609a5e7ad4420004b85","audit":{"verdict":"pass","basis":"phase3"}},{"id":"khoury-2022-leukemia-36-1703-C0088","shortId":"C0088","paper":"khoury-2022-leukemia-36-1703","category":"biomarker","tier":"restated secondary","genes":["KMT2A","MECOM","NUP98"],"diseases":["AML"],"ancestors":[],"locator":"ACUTE MYELOID LEUKAEMIA — cryptic rearrangements","secondary":null,"text":"In AML, KMT2A, MECOM and NUP98 rearrangements, particularly NUP98 rearrangements, may be cryptic on conventional karyotyping.","baseSha256":"f86c0f7e728953954076876975bd3aaae2bd07c6f2900d1bf1bf28fc4634dfa7","audit":{"verdict":"pass","basis":"phase3"}},{"id":"khoury-2022-leukemia-36-1703-C0089","shortId":"C0089","paper":"khoury-2022-leukemia-36-1703","category":"biomarker","tier":"guideline criterion","genes":["KMT2A"],"diseases":["AML"],"ancestors":[],"locator":"ACUTE MYELOID LEUKAEMIA — KMT2A fusion-partner identification","secondary":null,"text":"According to WHO 5th Edition 2022, identification of the KMT2A fusion partner in AML with KMT2A rearrangement is desirable, although not required, because it may affect disease monitoring.","baseSha256":"26e350fe447284c5ae14f763d65d159d4216863c5ebb1647f48c34e8e8a452f9","audit":{"verdict":"pass","basis":"phase3"}},{"id":"khoury-2022-leukemia-36-1703-C0090","shortId":"C0090","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["NPM1"],"diseases":["AML"],"ancestors":[],"locator":"ACUTE MYELOID LEUKAEMIA — NPM1 definition","secondary":null,"text":"According to WHO 5th Edition 2022, AML with NPM1 mutation may be diagnosed irrespective of blast count, with judicious clinicopathologic correlation.","baseSha256":"1e1b19ac4ecd0ee52280053b9e29290cf3e6e57b52dde790729b61293bed7c2c","audit":{"verdict":"pass","basis":"phase3"}},{"id":"khoury-2022-leukemia-36-1703-C0091","shortId":"C0091","paper":"khoury-2022-leukemia-36-1703","category":"prognosis","tier":"restated secondary","genes":["NPM1"],"diseases":["MDS","MDS/MPN","AML"],"ancestors":["MPN"],"locator":"ACUTE MYELOID LEUKAEMIA — NPM1 in prior MDS/MDS-MPN","secondary":null,"text":"MDS or MDS/MPN harbouring NPM1 mutation is described as progressing to AML over a short period of time.","baseSha256":"921838179e6f6627a19a8cacdab38ca4777e490c846f5d3a82990353d5e80d19","audit":{"verdict":"pass","basis":"phase3"}},{"id":"khoury-2022-leukemia-36-1703-C0092","shortId":"C0092","paper":"khoury-2022-leukemia-36-1703","category":"prognosis","tier":"restated secondary","genes":["NPM1"],"diseases":["CHIP","AML"],"ancestors":[],"locator":"ACUTE MYELOID LEUKAEMIA — acquired NPM1 in clonal haematopoiesis","secondary":null,"text":"Acquisition of NPM1 mutation in CHIP is similarly associated with rapid progression to AML.","baseSha256":"1b6af8776a02d7e7d5cf4c6eac4b6d9c0613b8edc16bbb0e8ada4c5767517c67","audit":{"verdict":"pass","basis":"phase3"}},{"id":"khoury-2022-leukemia-36-1703-C0094","shortId":"C0094","paper":"khoury-2022-leukemia-36-1703","category":"prognosis","tier":"restated secondary","genes":["CEBPA"],"diseases":["AML"],"ancestors":[],"locator":"ACUTE MYELOID LEUKAEMIA — CEBPA bZIP prognosis","secondary":null,"text":"In AML, a single CEBPA mutation in the basic leucine zipper region is associated with favourable prognosis in children and adults up to age 70.","baseSha256":"31ad65a6a6abae2b2a46f4565ab3fbd67533fffca7a54531fae96fb9fbd49230","audit":{"verdict":"pass","basis":"phase3"}},{"id":"khoury-2022-leukemia-36-1703-C0095","shortId":"C0095","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["RUNX1"],"diseases":["AML"],"ancestors":[],"locator":"ACUTE MYELOID LEUKAEMIA — RUNX1 mutation classification","secondary":null,"text":"According to WHO 5th Edition 2022, somatic RUNX1 mutation does not define a standalone AML type because it lacks sufficient specificity across defining molecular contexts.","baseSha256":"cf9e94ea0db9f1d8765534fb2ef55b420e24c1c4afdb1c2ecfb4d68d341da72d","audit":{"verdict":"pass","basis":"phase3"}},{"id":"khoury-2022-leukemia-36-1703-C0096","shortId":"C0096","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["ASXL1","BCOR","EZH2","SF3B1","SRSF2","STAG2","U2AF1","ZRSR2"],"diseases":["AML","MDS","MDS/MPN","acute erythroid leukaemia"],"ancestors":["MPN"],"locator":"ACUTE MYELOID LEUKAEMIA — AML-MR core definition","secondary":null,"text":"According to WHO 5th Edition 2022, AML, myelodysplasia-related (AML-MR; formerly AML with myelodysplasia-related changes) requires ≥20% blasts with a myeloid immunophenotype plus at least one qualifying MDS-related feature: a history of MDS or MDS/MPN; a defining somatic mutation in ASXL1, BCOR, EZH2, SF3B1, SRSF2, STAG2, U2AF1 or ZRSR2; or a defining cytogenetic abnormality comprising complex karyotype (≥3 abnormalities), 5q deletion/loss, monosomy 7 or 7q deletion/loss, 11q deletion, 12p deletion/loss, monosomy 13 or 13q deletion, 17p deletion/loss, isochromosome 17q or idic(X)(q13). Morphologic dysplasia alone is insufficient. A diagnosis of acute erythroid leukaemia supersedes AML-MR.","baseSha256":"9a2ea7c307650143129a1c3b3d77f259593ca380828bb86549391804cd99ef75","audit":{"verdict":"pass","basis":"phase3"}},{"id":"khoury-2022-leukemia-36-1703-C0114","shortId":"C0114","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["AML with minimal differentiation"],"ancestors":["AML"],"locator":"ACUTE MYELOID LEUKAEMIA — AML with minimal differentiation (Table 9)","secondary":null,"text":"According to WHO 5th Edition 2022, AML with minimal differentiation requires blasts negative (<3%) for MPO and SBB by cytochemistry and expression of at least two myeloid-associated antigens such as CD13, CD33 and CD117. It also requires ≥20% blasts, absence of a defining genetic AML type, absence of mixed-phenotype acute leukaemia, absence of myeloid neoplasm post cytotoxic therapy and no prior MPN.","baseSha256":"40ae9c440267561dd17ebf3484df4ef68033635b2f5bff86e3c6c7ef65391e16","audit":{"verdict":"pass","basis":"phase3"}},{"id":"khoury-2022-leukemia-36-1703-C0115","shortId":"C0115","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["AML without maturation"],"ancestors":["AML"],"locator":"ACUTE MYELOID LEUKAEMIA — AML without maturation (Table 9)","secondary":null,"text":"According to WHO 5th Edition 2022, AML without maturation requires ≥3% blasts positive for MPO or SBB, NSE negativity, <10% maturing granulocytic cells and expression of at least two myeloid-associated antigens. It also requires ≥20% blasts, absence of a defining genetic AML type, absence of mixed-phenotype acute leukaemia, absence of myeloid neoplasm post cytotoxic therapy and no prior MPN.","baseSha256":"cd2fd49f5ab059ed8ceeacd8673e9c78138e7a1f30f6556b4e28a5784d4f987c","audit":{"verdict":"pass","basis":"phase3"}},{"id":"khoury-2022-leukemia-36-1703-C0116","shortId":"C0116","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["AML with maturation"],"ancestors":["AML"],"locator":"ACUTE MYELOID LEUKAEMIA — AML with maturation (Table 9)","secondary":null,"text":"According to WHO 5th Edition 2022, AML with maturation requires ≥3% blasts positive for MPO or SBB, ≥10% maturing granulocytic cells, <20% monocyte-lineage cells and expression of at least two myeloid-associated antigens. It also requires ≥20% blasts, absence of a defining genetic AML type, absence of mixed-phenotype acute leukaemia, absence of myeloid neoplasm post cytotoxic therapy and no prior MPN.","baseSha256":"d0540b9a687d979ade30b30574c06ac9d6744377a3417c85843d7579cfb80aa2","audit":{"verdict":"pass","basis":"phase3"}},{"id":"khoury-2022-leukemia-36-1703-C0117","shortId":"C0117","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["acute basophilic leukaemia"],"ancestors":["AML"],"locator":"ACUTE MYELOID LEUKAEMIA — acute basophilic leukaemia (Table 9)","secondary":null,"text":"According to WHO 5th Edition 2022, acute basophilic leukaemia requires basophilic blasts/immature or mature basophils with metachromasia on toluidine blue, blasts negative for MPO, SBB and NSE, and absence of strong CD117-equivalent expression. It also requires ≥20% blasts, absence of a defining genetic AML type, absence of mixed-phenotype acute leukaemia, absence of myeloid neoplasm post cytotoxic therapy and no prior MPN.","baseSha256":"4c378506fac8cc2fc194554f29bd168ef5041635f6a36f26ed78466f961d8e36","audit":{"verdict":"pass","basis":"phase3"}},{"id":"khoury-2022-leukemia-36-1703-C0118","shortId":"C0118","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["AMML"],"ancestors":["AML"],"locator":"ACUTE MYELOID LEUKAEMIA — acute myelomonocytic leukaemia (Table 9)","secondary":null,"text":"According to WHO 5th Edition 2022, acute myelomonocytic leukaemia requires ≥20% monocytes and precursors, ≥20% maturing granulocytic cells and ≥3% blasts positive for MPO. It also requires ≥20% blasts, absence of a defining genetic AML type, absence of mixed-phenotype acute leukaemia, absence of myeloid neoplasm post cytotoxic therapy and no prior MPN.","baseSha256":"318f995efb65d6bd0c5f5aeca5d8017add674e42acf3de1dc34d32ba2e6151ea","audit":{"verdict":"pass","basis":"phase3"}},{"id":"khoury-2022-leukemia-36-1703-C0119","shortId":"C0119","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["AMoL"],"ancestors":["AML"],"locator":"ACUTE MYELOID LEUKAEMIA — acute monocytic leukaemia (Table 9)","secondary":null,"text":"According to WHO 5th Edition 2022, acute monocytic leukaemia requires ≥80% monocytes and/or their precursors, <20% maturing granulocytic cells, and blasts/promonocytes expressing at least two monocytic markers among CD11c, CD14, CD36 and CD64 or showing NSE positivity. It also requires ≥20% blasts, absence of a defining genetic AML type, absence of mixed-phenotype acute leukaemia, absence of myeloid neoplasm post cytotoxic therapy and no prior MPN.","baseSha256":"dfb8493e4511cf4eebd5ff04443bfb77b3d4107f44e82d03769577bfbd436aa8","audit":{"verdict":"pass","basis":"phase3"}},{"id":"khoury-2022-leukemia-36-1703-C0120","shortId":"C0120","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["acute erythroid leukaemia"],"ancestors":["AML"],"locator":"ACUTE MYELOID LEUKAEMIA — acute erythroid leukaemia","secondary":null,"text":"According to WHO 5th Edition 2022, acute erythroid leukaemia is characterized by erythroid predominance, usually ≥80% of marrow cellularity, with ≥30% proerythroblasts; cases with <80% erythroid cellularity are recognized when they share the same clinicopathologic features. “Pure erythroid leukaemia” is retained as an acceptable related term. The other shared differentiation-defined AML exclusions apply, but the ≥20% blast requirement does not.","baseSha256":"2ba8d4ad288526a008cae893c053ad9207b61875d7296f8661ecacba41970c52","audit":{"verdict":"pass","basis":"phase3"}},{"id":"khoury-2022-leukemia-36-1703-C0122","shortId":"C0122","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["AMKL"],"ancestors":["AML"],"locator":"ACUTE MYELOID LEUKAEMIA — acute megakaryoblastic leukaemia (Table 9)","secondary":null,"text":"According to WHO 5th Edition 2022, acute megakaryoblastic leukaemia requires blasts expressing at least one platelet glycoprotein marker—CD41, CD61 or CD42b. It also requires ≥20% blasts, absence of a defining genetic AML type, absence of mixed-phenotype acute leukaemia, absence of myeloid neoplasm post cytotoxic therapy and no prior MPN.","baseSha256":"bf25af55b8b488acc26082e127641213a12113b471777731958a199f22c98ecd","audit":{"verdict":"pass","basis":"phase3"}},{"id":"khoury-2022-leukemia-36-1703-C0123","shortId":"C0123","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["CBFA2T3","GLIS2"],"diseases":["AML","AMKL"],"ancestors":[],"locator":"ACUTE MYELOID LEUKAEMIA — AMKL/RAM immunophenotype","secondary":null,"text":"According to WHO 5th Edition 2022, AML with other defined genetic alterations provides a classification category for uncommon or emerging genetically defined AML subtypes, including rare genetic fusions; CBFA2T3::GLIS2 is recognized in this category in the acute megakaryoblastic leukaemia context.","baseSha256":"a2687126e709485df3ed60868cc6f32c22705ba458edf29a69cd1f3361c1dbca","audit":{"verdict":"pass","basis":"phase3"}},{"id":"khoury-2022-leukemia-36-1703-C0125","shortId":"C0125","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["NPM1","RUNX1","RUNX1T1","CBFB","MYH11","PARP1"],"diseases":["AML","MDS","MDS/MPN","CCUS"],"ancestors":["MPN"],"locator":"SECONDARY MYELOID NEOPLASMS — disease-attribute framework","secondary":null,"text":"According to WHO 5th Edition 2022, a myeloid neoplasm post cytotoxic therapy (MN-pCT) is diagnosed when criteria for AML, MDS or MDS/MPN are fulfilled in a patient with a documented history of chemotherapy or large-field radiation therapy for an unrelated neoplasm. CCUS is excluded. NPM1-mutated disease and core-binding-factor leukaemias with RUNX1::RUNX1T1 or CBFB::MYH11 still receive the post-cytotoxic designation when the exposure history is present. PARP1 inhibitors qualify as an exposure and methotrexate does not. The specific myeloid diagnosis should be given when possible with “post cytotoxic therapy” appended.","baseSha256":"ad07493d13a0021787d0ef577d826610ad745be85e506c61aa152b1631f8aeaf","audit":{"verdict":"pass","basis":"phase3"}},{"id":"khoury-2022-leukemia-36-1703-C0131","shortId":"C0131","paper":"khoury-2022-leukemia-36-1703","category":"prognosis","tier":"restated secondary","genes":["TP53"],"diseases":["AML","MDS"],"ancestors":[],"locator":"SECONDARY MYELOID NEOPLASMS — TP53 allelic state after cytotoxic therapy","secondary":null,"text":"In AML or MDS post cytotoxic therapy, biallelic/multi-hit TP53 alterations—including ≥2 TP53 mutations or a TP53 mutation with 17p/TP53 deletion or copy-neutral loss of heterozygosity—are associated with worse outcomes.","baseSha256":"6657ebb561525a61eded25ef799c173e89949279794260d714c321329aed9762","audit":{"verdict":"pass","basis":"phase3"}},{"id":"khoury-2022-leukemia-36-1703-C0132","shortId":"C0132","paper":"khoury-2022-leukemia-36-1703","category":"germline","tier":"restated secondary","genes":["PPM1D"],"diseases":[],"ancestors":[],"locator":"SECONDARY MYELOID NEOPLASMS — possible germline work-up","secondary":null,"text":"PPM1D and other DNA-damage-response mutations detected in myeloid neoplasms post cytotoxic therapy may warrant additional work-up for germline predisposition.","baseSha256":"4c818d84134d3ec287d50e2b22f87a7784d8d09c4c30aec92700e4b11689058e","audit":{"verdict":"pass","basis":"phase3"}},{"id":"khoury-2022-leukemia-36-1703-C0133","shortId":"C0133","paper":"khoury-2022-leukemia-36-1703","category":"germline","tier":"restated secondary","genes":["NF1","CBL"],"diseases":["JMML"],"ancestors":["MPN"],"locator":"MYELOPROLIFERATIVE NEOPLASMS — JMML germline genetic background","secondary":null,"text":"JMML can arise in association with germline pathogenic NF1 variants in neurofibromatosis type 1 or pathogenic germline CBL variants.","baseSha256":"d08045c5149492fcfdcfbb6316a5f38ea1b75779c05c1935c35937e0699e3bed","audit":{"verdict":"pass","basis":"phase3"}},{"id":"khoury-2022-leukemia-36-1703-C0135","shortId":"C0135","paper":"khoury-2022-leukemia-36-1703","category":"germline","tier":"guideline criterion","genes":["CEBPA","DDX41","TP53","RUNX1","ANKRD26","ETV6","GATA2","SAMD9","SAMD9L","BLM"],"diseases":["germline predisposition syndrome"],"ancestors":[],"locator":"SECONDARY MYELOID NEOPLASMS — germline predisposition subtypes (Table 10)","secondary":null,"text":"According to WHO 5th Edition 2022, a germline predisposition syndrome involving myeloid neoplasms is classified by coupling the myeloid disease phenotype with the predisposing germline genotype. The framework includes: without a pre-existing platelet disorder or organ dysfunction—germline CEBPA, DDX41 or TP53 pathogenic/likely pathogenic variants; with a pre-existing platelet disorder—germline RUNX1, ANKRD26 or ETV6 pathogenic/likely pathogenic variants; and with potential organ dysfunction—including germline GATA2, SAMD9 or SAMD9L pathogenic/likely pathogenic variants and biallelic germline BLM pathogenic/likely pathogenic variants. SAMD9L-related ataxia-pancytopenia syndrome may occur without ataxia.","baseSha256":"7b2c0b039688f9ccae0ddda9ad73abdbf6907ec291b2ee9d3f4dfebedb037578","audit":{"verdict":"pass","basis":"phase3"}},{"id":"khoury-2022-leukemia-36-1703-C0145","shortId":"C0145","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["GATA1"],"diseases":["germline predisposition syndrome"],"ancestors":[],"locator":"SECONDARY MYELOID NEOPLASMS — Down syndrome myeloid proliferations","secondary":null,"text":"According to WHO 5th Edition 2022, in the germline predisposition syndrome context, myeloid proliferations associated with constitutional trisomy 21 comprise transient abnormal myelopoiesis, confined to the first 6 months of life, and myeloid leukaemia of Down syndrome; these proliferations are typically associated with somatic GATA1 exon 2 or 3 mutation.","baseSha256":"8d79c7f9329480fb5f7be0f1390882cdb84d615346cd9113e2f71066c43daae3","audit":{"verdict":"pass","basis":"phase3"}},{"id":"khoury-2022-leukemia-36-1703-C0146","shortId":"C0146","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["BCR","ABL1","PDGFRA","PDGFRB","FGFR1","JAK2","FLT3","ETV6","FGFR2","LYN","NTRK3","RANBP2","ALK","RET","FGFR1OP"],"diseases":["myeloid/lymphoid neoplasm with eosinophilia and TK fusion"],"ancestors":[],"locator":"MYELOID/LYMPHOID NEOPLASMS WITH EOSINOPHILIA AND TYROSINE KINASE GENE FUSIONS — diagnostic hierarchy","secondary":null,"text":"According to WHO 5th Edition 2022, myeloid/lymphoid neoplasms with eosinophilia and tyrosine kinase gene fusions (MLN-TK) are BCR::ABL1-negative neoplasms driven by defining tyrosine-kinase rearrangements; eosinophilia is common but is not required. Defining abnormalities include rearrangements of PDGFRA, PDGFRB, FGFR1, JAK2 or FLT3; ETV6::ABL1; and other defined fusions including ETV6::FGFR2, ETV6::LYN, ETV6::NTRK3, RANBP2::ALK, BCR::RET and FGFR1OP::RET. MLN-TK supersedes other myeloid or lymphoid diagnoses and systemic mastocytosis in the diagnostic hierarchy, must be excluded before diagnosing CEL, and MLN-TK with ETV6::ABL1 should be distinguished from B-ALL with ETV6::ABL1.","baseSha256":"ab084f7d20a1252801ec53f8f8707ba41cf6a5af9ced53526977faf6972dac98","audit":{"verdict":"pass","basis":"phase4_adjudicated"}},{"id":"khoury-2022-leukemia-36-1703-C0149","shortId":"C0149","paper":"khoury-2022-leukemia-36-1703","category":"biomarker","tier":"restated secondary","genes":["FIP1L1","PDGFRA"],"diseases":["myeloid/lymphoid neoplasm with eosinophilia and TK fusion"],"ancestors":[],"locator":"MYELOID/LYMPHOID NEOPLASMS WITH EOSINOPHILIA AND TYROSINE KINASE GENE FUSIONS — cryptic FIP1L1::PDGFRA","secondary":null,"text":"In myeloid/lymphoid neoplasm with eosinophilia and tyrosine kinase fusion (MLN-TK), FIP1L1::PDGFRA commonly results from a cytogenetically cryptic deletion of 4q12.","baseSha256":"1a63cb332eea97c437780bdedd1e015bfc94780f5279e5030c8680c39a554bb2","audit":{"verdict":"pass","basis":"phase3"}},{"id":"khoury-2022-leukemia-36-1703-C0163","shortId":"C0163","paper":"khoury-2022-leukemia-36-1703","category":"treatment","tier":"restated secondary","genes":["PDGFRA","PDGFRB"],"diseases":["myeloid/lymphoid neoplasm with eosinophilia and TK fusion"],"ancestors":[],"locator":"MYELOID/LYMPHOID NEOPLASMS WITH EOSINOPHILIA AND TYROSINE KINASE GENE FUSIONS — TKI sensitivity","secondary":null,"text":"In myeloid/lymphoid neoplasm with eosinophilia and tyrosine kinase fusion (MLN-TK), PDGFRA- or PDGFRB-rearranged disease is highly sensitive to tyrosine-kinase inhibitor therapy, particularly imatinib, with major alteration of the natural history of the disease.","baseSha256":"4a81d57e4cee4fbb806c7f3bc689a0f9d75e1322f5c0e4ae3b466eaf5c9738a8","audit":{"verdict":"pass","basis":"phase3"}},{"id":"khoury-2022-leukemia-36-1703-C0165","shortId":"C0165","paper":"khoury-2022-leukemia-36-1703","category":"treatment","tier":"restated secondary","genes":["FGFR1","JAK2","FLT3","ETV6","ABL1"],"diseases":["myeloid/lymphoid neoplasm with eosinophilia and TK fusion"],"ancestors":[],"locator":"MYELOID/LYMPHOID NEOPLASMS WITH EOSINOPHILIA AND TYROSINE KINASE GENE FUSIONS — variable TKI sensitivity","secondary":null,"text":"Myeloid/lymphoid neoplasm with eosinophilia and tyrosine kinase fusion (MLN-TK) involving FGFR1, JAK2, FLT3 or ETV6::ABL1 has variable sensitivity to currently available newer-generation tyrosine-kinase inhibitors.","baseSha256":"4aeead788e008d10a147a3e2abde013f3771542ff7acbfe631f880476959beb4","audit":{"verdict":"pass","basis":"phase3"}},{"id":"khoury-2022-leukemia-36-1703-C0169","shortId":"C0169","paper":"khoury-2022-leukemia-36-1703","category":"treatment","tier":"restated secondary","genes":["FGFR1","JAK2","FLT3","ETV6","ABL1"],"diseases":["myeloid/lymphoid neoplasm with eosinophilia and TK fusion"],"ancestors":[],"locator":"MYELOID/LYMPHOID NEOPLASMS WITH EOSINOPHILIA AND TYROSINE KINASE GENE FUSIONS — transplantation","secondary":null,"text":"For myeloid/lymphoid neoplasm with eosinophilia and tyrosine kinase fusion (MLN-TK) with FGFR1, JAK2 or FLT3 fusions or ETV6::ABL1, long-term disease-free survival may in most cases only be achievable with allogeneic haematopoietic stem-cell transplantation.","baseSha256":"1b7a8d0599f38f440158fb117f10e199ebf7b56e10f883959104c7e1fa41cefe","audit":{"verdict":"pass","basis":"phase3"}},{"id":"khoury-2022-leukemia-36-1703-C0170","shortId":"C0170","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["BCR","ABL1","KMT2A","ZNF384","BCL11B"],"diseases":["acute leukaemia of ambiguous lineage"],"ancestors":[],"locator":"ACUTE LEUKAEMIAS OF MIXED OR AMBIGUOUS LINEAGE — WHO5 grouping","secondary":null,"text":"According to WHO 5th Edition 2022, acute leukaemia of ambiguous lineage is separated into those with defining genetic abnormalities and those defined immunophenotypically. Defining genetic subtypes include MPAL with BCR::ABL1, KMT2A rearrangement or ZNF384 rearrangement, and ALAL with BCL11B rearrangement.","baseSha256":"1212009f55317ff0499f69f6d15ff9ea53086d792ead66e770680e0a6428eb1a","audit":{"verdict":"pass","basis":"phase3"}},{"id":"khoury-2022-leukemia-36-1703-C0175","shortId":"C0175","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["acute leukaemia of ambiguous lineage"],"ancestors":[],"locator":"ACUTE LEUKAEMIAS OF MIXED OR AMBIGUOUS LINEAGE — B-lineage assignment (Table 13)","secondary":null,"text":"According to WHO 5th Edition 2022, lineage assignment in acute leukaemia of ambiguous lineage uses: for B lineage, strong CD19 plus ≥1 strongly expressed CD10, CD22 or CD79a, or weak CD19 plus ≥2 of these markers; for T lineage, cytoplasmic or surface CD3 of sufficient intensity or positive immunocytochemistry with a non-zeta-chain reagent; and for myeloid lineage, sufficiently intense MPO expression or monocytic differentiation demonstrated by at least two of nonspecific esterase, CD11c, CD14, CD64 or lysozyme.","baseSha256":"8972334f5928dc36e946d98e72097935492e63aa5fcbd2ce3d66e7b40c5a0d2d","audit":{"verdict":"pass","basis":"phase3"}},{"id":"khoury-2022-leukemia-36-1703-C0178","shortId":"C0178","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["acute leukaemia of ambiguous lineage"],"ancestors":[],"locator":"ACUTE LEUKAEMIAS OF MIXED OR AMBIGUOUS LINEAGE — MPO flow-cytometry threshold uncertainty","secondary":null,"text":"For acute leukaemia of ambiguous lineage assessed by flow cytometry, a 3% MPO-positive blast threshold has high sensitivity but poor specificity, >10% appears to improve specificity, and no consensus cutoff has been established.","baseSha256":"a6e117496b47be85e5cb908b58f5afa730e4afba5ac58168b4600a57b05e2ea7","audit":{"verdict":"pass","basis":"phase3"}},{"id":"khoury-2022-leukemia-36-1703-C0179","shortId":"C0179","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["BPDCN"],"ancestors":["histiocytic/dendritic neoplasm"],"locator":"HISTIOCYTIC/DENDRITIC CELL NEOPLASMS — BPDCN immunophenotypic criteria (Table 15)","secondary":null,"text":"According to WHO 5th Edition 2022, BPDCN immunophenotypic diagnosis requires either CD123 plus one other plasmacytoid dendritic-cell marker together with CD4 and/or CD56, or any three plasmacytoid dendritic-cell markers with absence of all expected negative markers including CD3, CD14, CD19, CD34, lysozyme and MPO.","baseSha256":"dc337eb22aa860ec3cb47b5a161b3be175ac790b48097020a8b08fff426fa19c","audit":{"verdict":"pass","basis":"phase3"}},{"id":"khoury-2022-leukemia-36-1703-C0180","shortId":"C0180","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["ALK"],"diseases":["histiocytic/dendritic neoplasm"],"ancestors":[],"locator":"HISTIOCYTIC/DENDRITIC CELL NEOPLASMS — ALK-positive histiocytosis","secondary":null,"text":"According to WHO 5th Edition 2022, ALK-positive histiocytosis is a defined histiocytic/dendritic neoplasm unified by the presence of an ALK gene translocation.","baseSha256":"95ca861ae4c8ee2bed13298ea31748244a25aa52dcbed14fbd7f9373c8751d82","audit":{"verdict":"pass","basis":"phase3"}},{"id":"khoury-2022-leukemia-36-1703-C0181","shortId":"C0181","paper":"khoury-2022-leukemia-36-1703","category":"treatment","tier":"restated secondary","genes":["ALK"],"diseases":["histiocytic/dendritic neoplasm"],"ancestors":[],"locator":"HISTIOCYTIC/DENDRITIC CELL NEOPLASMS — ALK-positive histiocytosis treatment","secondary":null,"text":"Within the histiocytic/dendritic neoplasm category, ALK-positive histiocytosis is described as showing a remarkable response to ALK-inhibitor therapy.","baseSha256":"5772a62374078a2e1f650f37a0959a571e288cd4c1f794e964b4dc8f3025a272","audit":{"verdict":"pass","basis":"phase3"}},{"id":"khoury-2022-leukemia-36-1703-C0182","shortId":"C0182","paper":"khoury-2022-leukemia-36-1703","category":"biomarker","tier":"guideline criterion","genes":["ALK"],"diseases":["histiocytic/dendritic neoplasm"],"ancestors":[],"locator":"HISTIOCYTIC/DENDRITIC CELL NEOPLASMS — ALK screening","secondary":null,"text":"WHO 5th Edition 2022 recommends ALK immunostaining when a histiocytic/dendritic neoplasm does not conform to defined entities, to screen for possible ALK-positive histiocytosis.","baseSha256":"38618206580d2c1dd42abfce8a6b8c242293a4f0b77fe2837aa2e96fca330824","audit":{"verdict":"pass","basis":"phase4_adjudicated"}},{"id":"khoury-2022-leukemia-36-1703-C0183","shortId":"C0183","paper":"khoury-2022-leukemia-36-1703","category":"treatment","tier":"restated secondary","genes":["BRAF","ARAF","MAP2K1","NRAS","KRAS"],"diseases":["histiocytic/dendritic neoplasm"],"ancestors":[],"locator":"HISTIOCYTIC/DENDRITIC CELL NEOPLASMS — MAPK-pathway alterations","secondary":null,"text":"In the histiocytic/dendritic neoplasm category, alterations in BRAF, ARAF, MAP2K1, NRAS and KRAS have treatment implications because activated MAPK-pathway components can be targeted with therapies including BRAF and MEK inhibitors.","baseSha256":"0939e51dce1100d9be41b63d27b3a21c3ee6b5c227a4eb66843566fbc78a0d11","audit":{"verdict":"pass","basis":"phase3"}},{"id":"khoury-2022-leukemia-36-1703-C0184","shortId":"C0184","paper":"khoury-2022-leukemia-36-1703","category":"biomarker","tier":"guideline criterion","genes":["NF1","NRAS","KRAS","PTPN11","CBL"],"diseases":["JMML"],"ancestors":["MPN"],"locator":"GENETIC TUMOR SYNDROMES WITH PREDISPOSITION TO MYELOID NEOPLASIA — RASopathies/JMML","secondary":null,"text":"Genomic analysis of NF1, NRAS, KRAS, PTPN11 and CBL in myeloid neoplasms from patients suspected of a RASopathy is important and can aid JMML diagnosis in the majority of cases.","baseSha256":"7ddefde22107f58198fa76feb4b8be27600792097c9f0d44f59b4d3e0a10eeff","audit":{"verdict":"pass","basis":"phase3"}},{"id":"khoury-2022-leukemia-36-1703-C0185","shortId":"C0185","paper":"khoury-2022-leukemia-36-1703","category":"germline","tier":"guideline criterion","genes":["NF1","NRAS","KRAS","PTPN11","CBL"],"diseases":["germline predisposition syndrome"],"ancestors":[],"locator":"GENETIC TUMOR SYNDROMES WITH PREDISPOSITION TO MYELOID NEOPLASIA — RASopathy diagnostic criteria","secondary":null,"text":"According to WHO 5th Edition 2022, a RASopathy is a germline predisposition syndrome in which the myeloid disease phenotype is coupled to the predisposing germline genotype. In this germline RASopathy context, WHO5 specifically identifies NF1, NRAS, KRAS, PTPN11 and CBL; diagnostic criteria include a pathogenic germline variant in a RAS-pathway gene and/or a classic phenotype suggestive of a RASopathy.","baseSha256":"0e0460266c606c097efd5bb4268d0ecd0bf08106ac775794c3510a8bd4023194","audit":{"verdict":"pass","basis":"phase4_adjudicated"}},{"id":"khoury-2022-leukemia-36-1703-C0187","shortId":"C0187","paper":"khoury-2022-leukemia-36-1703","category":"biomarker","tier":"restated secondary","genes":["CBFA2T3","GLIS2"],"diseases":["AMKL"],"ancestors":["AML"],"locator":"ACUTE MYELOID LEUKAEMIA — AMKL/RAM immunophenotype","secondary":null,"text":"In acute megakaryoblastic leukaemia, the RAM immunophenotype correlates with CBFA2T3::GLIS2.","baseSha256":"7327102f805c34c1d2a5c9161b6a77e233c744bd7fe6dea0d2a53b90e6406fb9","audit":{"verdict":"pass","basis":"phase3"}},{"id":"khoury-2022-leukemia-36-1703-C0194","shortId":"C0194","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["JMML"],"ancestors":["MPN"],"locator":"MYELOPROLIFERATIVE NEOPLASMS — JMML / Summary Box","secondary":null,"text":"According to WHO 5th Edition 2022, juvenile myelomonocytic leukaemia is categorized under myeloproliferative neoplasms.","baseSha256":"6754b13ec571a92fa9bbc67faa22565386dd776e6cfec3701d2696a0dfc53c56","audit":{"verdict":"pass","basis":"phase3"}},{"id":"khoury-2022-leukemia-36-1703-C0196","shortId":"C0196","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["MDS"],"ancestors":[],"locator":"MYELODYSPLASTIC NEOPLASMS — Table 3, MDS with low blasts","secondary":null,"text":"According to WHO 5th Edition 2022, MDS with low blasts is defined by <5% bone-marrow blasts and <2% peripheral-blood blasts.","baseSha256":"124bf60ca1b758872d5913607e1be705649aac6924e26b8cd59550963b34c5b2","audit":{"verdict":"pass","basis":"phase3"}},{"id":"khoury-2022-leukemia-36-1703-C0198","shortId":"C0198","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["MDS"],"ancestors":[],"locator":"MYELODYSPLASTIC NEOPLASMS — Table 3, MDS-IB1","secondary":null,"text":"According to WHO 5th Edition 2022, MDS with increased blasts is subgrouped as MDS-IB1, defined by 5–9% bone-marrow blasts or 2–4% peripheral-blood blasts, and MDS-IB2, defined by 10–19% bone-marrow blasts, 5–19% peripheral-blood blasts, or Auer rods.","baseSha256":"817b7b35cb647da0415bef2da980bab80916b87c8ebddd9a23df55f89a2c4716","audit":{"verdict":"pass","basis":"phase3"}},{"id":"khoury-2022-leukemia-36-1703-C0200","shortId":"C0200","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["MDS"],"ancestors":[],"locator":"MYELODYSPLASTIC NEOPLASMS — Table 3, MDS with fibrosis","secondary":null,"text":"According to WHO 5th Edition 2022, MDS with fibrosis has 5–19% bone-marrow blasts and 2–19% peripheral-blood blasts.","baseSha256":"76b1aa262b491a7b941f7fa7f9beeb13a76adadf96cb03c0ebe1ab8e6523e775","audit":{"verdict":"pass","basis":"phase3"}},{"id":"khoury-2022-leukemia-36-1703-C0201","shortId":"C0201","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["MDS"],"ancestors":[],"locator":"MYELODYSPLASTIC NEOPLASMS — MDS, morphologically defined","secondary":null,"text":"According to WHO 5th Edition 2022, MDS, unclassifiable is no longer a recognized MDS category.","baseSha256":"5921ca2a18c0c5c542d64639ada272db105996509abea2d937d578faf315ce98","audit":{"verdict":"pass","basis":"phase3"}},{"id":"khoury-2022-leukemia-36-1703-C0202","shortId":"C0202","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["MDS/MPN-U"],"ancestors":["MDS","MDS/MPN","MPN"],"locator":"MYELODYSPLASTIC/MYELOPROLIFERATIVE NEOPLASMS — terminology updates","secondary":null,"text":"According to WHO 5th Edition 2022, MDS/MPN, unclassifiable is renamed MDS/MPN, not otherwise specified.","baseSha256":"018a14bf6221135af16b03629771636270ccb9b64d634c9df10f14f274be868c","audit":{"verdict":"pass","basis":"phase3"}},{"id":"khoury-2022-leukemia-36-1703-C0207","shortId":"C0207","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["histiocytic/dendritic neoplasm"],"ancestors":[],"locator":"HISTIOCYTIC/DENDRITIC CELL NEOPLASMS — Plasmacytoid dendritic cell neoplasms / Table 14","secondary":null,"text":"According to WHO 5th Edition 2022, within the histiocytic/dendritic neoplasm category, mature plasmacytoid dendritic-cell proliferation associated with myeloid neoplasm is a clonal low-grade pDC proliferation arising in the context of a defined myeloid neoplasm.","baseSha256":"ca246e6408eec76bdf3c05b44177239570a5b57090690c0b428fe0500a084a79","audit":{"verdict":"pass","basis":"phase3"}},{"id":"khoury-2022-leukemia-36-1703-C0210","shortId":"C0210","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["germline predisposition syndrome"],"ancestors":[],"locator":"SECONDARY MYELOID NEOPLASMS — disease-attribute framework","secondary":null,"text":"According to WHO 5th Edition 2022, for a germline predisposition syndrome, “associated with germline [gene] variant” is a disease attribute that should be appended to the relevant myeloid disease type whose diagnostic criteria are otherwise fulfilled.","baseSha256":"6e6ef823a4b3154d785b5e708683e4d66d11cbd0399dc35cfdbbae94365247ea","audit":{"verdict":"pass","basis":"phase3"}},{"id":"khoury-2022-leukemia-36-1703-C0212","shortId":"C0212","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["KMT2A","MLLT3"],"diseases":["AML"],"ancestors":[],"locator":"ACUTE MYELOID LEUKAEMIA — AML with defining genetic abnormalities","secondary":null,"text":"According to WHO 5th Edition 2022, “AML with KMT2A rearrangement” replaces the former term “AML with t(9;11)(p22;q23); KMT2A-MLLT3.”","baseSha256":"d211d2a8fa23e83685bc7ee72b0559717a92363affb312a6d62387c6a43e2945","audit":{"verdict":"pass","basis":"phase3"}},{"id":"kraft-godley-2020-germline-guide-C0001","shortId":"C0001","paper":"kraft-godley-2020-germline-guide","category":"germline","tier":"univariable or descriptive","genes":["DDX41"],"diseases":[],"ancestors":[],"locator":"Clinical case, lines 15-17","secondary":null,"text":"In myeloid malignancies, DDX41 p.Arg525His is described as a hotspot acquired mutation occurring in individuals with deleterious germline DDX41 variants.","baseSha256":"8d11e3bf19927d930e460fa859ccd692b8ff7f07c43c12622bbf6c08973daa79","audit":{"verdict":"pass","basis":"phase3"}},{"id":"kraft-godley-2020-germline-guide-C0002","shortId":"C0002","paper":"kraft-godley-2020-germline-guide","category":"germline","tier":"restated secondary","genes":["DDX41"],"diseases":[],"ancestors":[],"locator":"Identifying potential germline alterations, line 21","secondary":null,"text":"Germline DDX41-associated myeloid malignancy can present at advanced age; an age around 70 years does not exclude germline predisposition.","baseSha256":"7bf0f1a4cd2c70d59a8c01edf2284e4232f2a20306ff74ec6e326600d0b93307","audit":{"verdict":"pass","basis":"phase3"}},{"id":"kraft-godley-2020-germline-guide-C0003","shortId":"C0003","paper":"kraft-godley-2020-germline-guide","category":"germline","tier":"restated secondary","genes":["GATA2","BRCA1","BRCA2"],"diseases":[],"ancestors":[],"locator":"Identifying potential germline alterations, line 21","secondary":null,"text":"Germline predisposition involving GATA2, BRCA1, or BRCA2 may arise de novo and therefore be present in the affected individual but absent from the parents.","baseSha256":"924aae238cebdadcb3322895a4455431d121ef29e087a5a5fb666aac71271f43","audit":{"verdict":"pass","basis":"phase3"}},{"id":"kraft-godley-2020-germline-guide-C0005","shortId":"C0005","paper":"kraft-godley-2020-germline-guide","category":"germline","tier":"restated secondary","genes":["DDX41"],"diseases":[],"ancestors":[],"locator":"Identifying potential germline alleles from NGS assays of tumor samples, line 57","secondary":null,"text":"A truncating DDX41 variant should raise suspicion of germline origin.","baseSha256":"c02f21e1f1a7fd90239d8d93f6c74dad4c92e3611c3c2f0153370ebab93a6f02","audit":{"verdict":"pass","basis":"phase3"}},{"id":"kraft-godley-2020-germline-guide-C0006","shortId":"C0006","paper":"kraft-godley-2020-germline-guide","category":"germline","tier":"restated secondary","genes":["RUNX1","TP53"],"diseases":[],"ancestors":[],"locator":"Identifying potential germline alleles from NGS assays of tumor samples, line 57","secondary":null,"text":"A RUNX1 or TP53 variant detected in hematopoietic tissue should not be assumed to be germline or somatic based on the variant itself, because variants in either gene can occur in both settings.","baseSha256":"5f2afece4e744e3b46bd5960a53f144f5a54184b087048dd862718eb1bf56505","audit":{"verdict":"pass","basis":"phase3"}},{"id":"kraft-godley-2020-germline-guide-C0007","shortId":"C0007","paper":"kraft-godley-2020-germline-guide","category":"germline","tier":"univariable or descriptive","genes":["TP53"],"diseases":[],"ancestors":[],"locator":"Identifying potential germline alleles from NGS assays of tumor samples, lines 57 and 126","secondary":null,"text":"A TP53 variant detected in hematopoietic tissue is more commonly somatic than germline; however, germline TP53 origin remains possible and may require dedicated germline evaluation.","baseSha256":"7178a13fcc2d42453eb8eda3d1f536b213f03d99f90203c5c1e2125d8eeaa27d","audit":{"verdict":"pass","basis":"phase3"}},{"id":"kraft-godley-2020-germline-guide-C0008","shortId":"C0008","paper":"kraft-godley-2020-germline-guide","category":"germline","tier":"univariable or descriptive","genes":["BRCA1","BRCA2"],"diseases":[],"ancestors":[],"locator":"Identifying potential germline alleles from NGS assays of tumor samples, line 126","secondary":null,"text":"A deleterious BRCA1 or BRCA2 variant detected during sequencing of a hematologic malignancy may warrant consideration of germline origin; the authors report that such variants were more commonly germline in their experience.","baseSha256":"056926d3b549e0aaa9ad2c47edecd21696a36618ec6086061c861cc24598e868","audit":{"verdict":"pass","basis":"phase3"}},{"id":"kraft-godley-2020-germline-guide-C0009","shortId":"C0009","paper":"kraft-godley-2020-germline-guide","category":"germline","tier":"univariable or descriptive","genes":["TP53"],"diseases":[],"ancestors":[],"locator":"Identifying potential germline alleles from NGS assays of tumor samples, lines 57 and 126","secondary":null,"text":"Persistence of a TP53 variant at a relatively stable VAF across serial hematopoietic samples can raise suspicion of germline origin, including in patients who do not otherwise meet clinical criteria for Li-Fraumeni syndrome; germline status requires confirmation with appropriate germline testing.","baseSha256":"32eef6b553d32ab21fb5cddd2e50b8ac14bb5df0b9f7e5a8454b7a4e2457baf0","audit":{"verdict":"pass","basis":"phase3"}},{"id":"kraft-godley-2020-germline-guide-C0031","shortId":"C0031","paper":"kraft-godley-2020-germline-guide","category":"germline","tier":"restated secondary","genes":["BRCA1","BRCA2"],"diseases":[],"ancestors":[],"locator":"Figure 3 legend, line 108","secondary":null,"text":"BRCA1 and BRCA2 cancer-predisposition pathway mutations are associated with increased risk of hematopoietic malignancies.","baseSha256":"a1d6e767ac099a41987ee156024d0281b7314aa761805bf06a1a7ebc15957ca1","audit":{"verdict":"pass","basis":"phase3"}},{"id":"kraft-godley-2020-germline-guide-C0032","shortId":"C0032","paper":"kraft-godley-2020-germline-guide","category":"germline","tier":"restated secondary","genes":["TP53"],"diseases":[],"ancestors":[],"locator":"Figure 3 legend, line 108; Table 1 Li-Fraumeni syndrome row, line 68","secondary":null,"text":"TP53-associated Li-Fraumeni syndrome is associated with increased risk of hematopoietic malignancies.","baseSha256":"c0031523b3ff3e7c4cec333390277efbd54da0dcee75f6b59b01c4c8dd7db8f2","audit":{"verdict":"pass","basis":"phase4_adjudicated"}},{"id":"kraft-godley-2020-germline-guide-C0033","shortId":"C0033","paper":"kraft-godley-2020-germline-guide","category":"germline","tier":"r ia-related changes.","baseSha256":"ea05b7d9fac094992c195059060e9240b4089d819a0214ed885c6b3924172ab0","audit":{"verdict":"pass","basis":"phase3"}},{"id":"malcovati-2017-ccus-foundation-C0010","shortId":"C0010","paper":"malcovati-2017-ccus-foundation","category":"diagnosis","tier":"univariable or descriptive","genes":["SRSF2","U2AF1","JAK2"],"diseases":["MDS","MDS/MPN","AML","PMF"],"ancestors":["MPN"],"locator":"Results—Implications of mutation status for the diagnosis of myeloid neoplasms","secondary":null,"text":"In unexplained cytopenia, SRSF2 or U2AF1 mutation is highly specific for a myeloid neoplasm with myelodysplasia—MDS, MDS/MPN, or AML with myelodysplasia-related changes—except when co-occurring with JAK2 in primary myelofibrosis.","baseSha256":"cf0e7143b9b0516f8b0b4ead6f083a5230677b532258b615e889a25fa4a88b17","audit":{"verdict":"pass","basis":"phase3"}},{"id":"malcovati-2017-ccus-foundation-C0011","shortId":"C0011","paper":"malcovati-2017-ccus-foundation","category":"diagnosis","tier":"univariable or descriptive","genes":["SF3B1","SRSF2","U2AF1","ZRSR2","TET2","ASXL1","DNMT3A","RUNX1","EZH2","CBL","BCOR","CUX1","TP53","IDH1","IDH2"],"diseases":["CCUS","MDS"],"ancestors":[],"locator":"Results—Implications of mutation status for the diagnosis of myeloid neoplasms; Discussion","secondary":null,"text":"In patients with CCUS and inconclusive dysplasia, the authors propose that highly specific mutation patterns—SF3B1, SRSF2, U2AF1, or ZRSR2 mutation, or TET2, ASXL1, or DNMT3A co-mutated with RUNX1, EZH2, CBL, BCOR, CUX1, TP53, IDH1, or IDH2—may provide presumptive evidence of MDS even when definitive morphologic criteria are absent.","baseSha256":"6ba506d5294c7645c84065b66a04aa984efa6335684347148963235716af1382","audit":{"verdict":"pass","basis":"phase3"}},{"id":"malcovati-2017-ccus-foundation-C0012","shortId":"C0012","paper":"malcovati-2017-ccus-foundation","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["MDS"],"ancestors":[],"locator":
