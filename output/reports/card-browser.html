<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Evidence cards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#efeef4;
    --panel:#f7f6fa;
    --ink:#191825;
    --muted:#6e6a82;
    --rule:#d8d5e3;
    --azure:#2b4c8c;
    --eosin:#a31e63;
    --focus:#a31e63;
    --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --display:"Newsreader",Georgia,serif;
    --cat-diagnosis:#4a3f8f;
    --cat-prognosis:#a31e63;
    --cat-treatment:#1d6f63;
    --cat-biomarker:#2b4c8c;
    --cat-germline:#8a5a12;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);color:var(--ink);font-family:var(--sans);
    font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;
  }
  a{color:var(--azure)}
  button{font:inherit;color:inherit}

  /* ---------- masthead ---------- */
  header.masthead{
    border-bottom:1px solid var(--rule);
    padding:22px 28px 16px;
    display:flex;flex-wrap:wrap;gap:18px;align-items:baseline;justify-content:space-between;
  }
  .wordmark{font-family:var(--display);font-size:31px;line-height:1;letter-spacing:-.01em;font-weight:500;margin:0}
  .wordmark em{font-style:italic;color:var(--eosin)}
  .provenance{font-family:var(--mono);font-size:11.5px;color:var(--muted);letter-spacing:.02em}

  /* ---------- shell ---------- */
  .shell{display:grid;grid-template-columns:288px minmax(0,1fr);gap:0;align-items:start}
  .rail{
    border-right:1px solid var(--rule);padding:20px 20px 60px;
    position:sticky;top:0;max-height:100vh;overflow-y:auto;background:var(--panel);
  }
  .main{padding:20px 28px 90px;min-width:0}

  /* ---------- filters ---------- */
  .facet{margin-bottom:26px}
  .facet h2{
    font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.12em;
    text-transform:uppercase;color:var(--muted);margin:0 0 9px;
    display:flex;justify-content:space-between;align-items:baseline;gap:8px;
  }
  .facet h2 .clear{
    border:0;background:none;padding:0;cursor:pointer;color:var(--eosin);
    font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:none;
    visibility:hidden;
  }
  .facet.active h2 .clear{visibility:visible}
  .facet-search{
    width:100%;border:1px solid var(--rule);background:#fff;border-radius:2px;
    padding:6px 8px;font-family:var(--mono);font-size:12px;color:var(--ink);margin-bottom:8px;
  }
  .facet-search::placeholder{color:#9a96ab}
  .options{list-style:none;margin:0;padding:0;max-height:264px;overflow-y:auto}
  .options.short{max-height:none}
  .opt{
    width:100%;display:flex;gap:8px;align-items:baseline;text-align:left;
    border:0;background:none;cursor:pointer;padding:3px 4px;border-radius:2px;
    font-size:13.5px;line-height:1.35;color:var(--ink);
  }
  .opt:hover{background:#e9e6f1}
  .opt .tick{
    font-family:var(--mono);font-size:11px;color:var(--muted);width:12px;flex:none;
  }
  .opt[aria-pressed="true"]{background:#fff}
  .opt[aria-pressed="true"] .label{color:var(--eosin);font-weight:600}
  .opt[aria-pressed="true"] .tick{color:var(--eosin)}
  .opt .label{flex:1;min-width:0;overflow-wrap:anywhere}
  .opt .count{font-family:var(--mono);font-size:11px;color:var(--muted);flex:none}
  .opt[disabled]{opacity:.35;cursor:default}
  .opt[disabled]:hover{background:none}
  .swatch{width:8px;height:8px;border-radius:50%;flex:none;align-self:center}

  /* ---------- results ---------- */
  .toolbar{
    display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;
    padding-bottom:12px;border-bottom:1px solid var(--rule);margin-bottom:4px;
  }
  .tally{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.03em}
  .tally b{color:var(--ink);font-weight:500}
  .text-search{
    flex:1;min-width:200px;max-width:380px;border:1px solid var(--rule);background:#fff;
    border-radius:2px;padding:7px 10px;font-family:var(--sans);font-size:13.5px;
  }
  .reset{
    border:1px solid var(--rule);background:#fff;border-radius:2px;padding:6px 11px;
    font-family:var(--mono);font-size:11.5px;letter-spacing:.04em;cursor:pointer;
  }
  .reset:hover{border-color:var(--eosin);color:var(--eosin)}

  ol.cards{list-style:none;margin:0;padding:0}
  li.card{
    display:grid;grid-template-columns:232px minmax(0,1fr);gap:22px;
    padding:15px 0 15px 13px;border-bottom:1px solid var(--rule);
    border-left:3px solid var(--spine,var(--rule));
  }
  li.card .cid{
    font-family:var(--mono);font-size:11.5px;line-height:1.5;color:var(--muted);
    letter-spacing:-.01em;overflow-wrap:anywhere;padding-top:2px;
  }
  li.card p{margin:0;font-size:15.5px;line-height:1.6}
  li.card mark{background:#f7dbe8;color:inherit;padding:0 1px}
  .empty{padding:56px 0;max-width:44ch}
  .empty h3{font-family:var(--display);font-size:22px;font-weight:500;margin:0 0 6px}
  .empty p{margin:0;color:var(--muted)}

  .railtoggle{display:none}

  @media (max-width:900px){
    .shell{grid-template-columns:1fr}
    .rail{
      position:static;max-height:none;border-right:0;border-bottom:1px solid var(--rule);
      padding-bottom:24px;
    }
    .rail[hidden]{display:none}
    .railtoggle{
      display:block;margin:16px 28px 0;border:1px solid var(--rule);background:#fff;
      border-radius:2px;padding:8px 12px;font-family:var(--mono);font-size:12px;cursor:pointer;
    }
    .main{padding:16px 20px 70px}
    li.card{grid-template-columns:1fr;gap:5px}
    header.masthead{padding:18px 20px 14px}
  }
  :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="masthead">
  <h1 class="wordmark">Evidence <em>cards</em></h1>
  <div class="provenance" id="provenance"></div>
</header>

<button class="railtoggle" id="railtoggle" aria-expanded="false" aria-controls="rail">Filters</button>

<div class="shell">
  <aside class="rail" id="rail" aria-label="Filters"></aside>
  <main class="main">
    <div class="toolbar">
      <div class="tally" id="tally"></div>
      <input class="text-search" id="textsearch" type="search" placeholder="Search interpretation text" aria-label="Search interpretation text">
      <button class="reset" id="reset" type="button">Clear all filters</button>
    </div>
    <ol class="cards" id="cards"></ol>
  </main>
</div>

blastoid or large-centrocyte features needs to be distinguished from large B-cell lymphoma with IRF4 rearrangement."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0066","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"guideline criterion","genes":["CCND1"],"diseases":["in situ mantle cell neoplasm"],"text":"In situ mantle cell neoplasm represents mantle-zone colonization by B cells carrying an IG::CCND1 fusion with cyclin D1 overexpression."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0067","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"guideline criterion","genes":["IGH","CCND1"],"diseases":["mantle cell lymphoma"],"text":"IGH::CCND1 from t(11;14)(q13;q32) is the genetic hallmark of mantle cell lymphoma."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0068","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"guideline criterion","genes":["IGK","CCND1"],"diseases":["mantle cell lymphoma"],"text":"IGK can serve as an alternative CCND1 translocation partner in mantle cell lymphoma."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0069","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"guideline criterion","genes":["IGL","CCND1"],"diseases":["mantle cell lymphoma"],"text":"IGL can serve as an alternative CCND1 translocation partner in mantle cell lymphoma."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0070","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"guideline criterion","genes":["IGK","CCND1"],"diseases":["mantle cell lymphoma"],"text":"Cyclin-D1-positive mantle cell lymphoma without a detectable CCND1 rearrangement by FISH can harbor cryptic rearrangements of IGK enhancers with CCND1."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0071","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"guideline criterion","genes":["IGL","CCND1"],"diseases":["mantle cell lymphoma"],"text":"Cyclin-D1-positive mantle cell lymphoma without a detectable CCND1 rearrangement by FISH can harbor cryptic rearrangements of IGL enhancers with CCND1."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0072","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"guideline criterion","genes":["CCND2"],"diseases":["mantle cell lymphoma"],"text":"Cyclin-D1-negative/CCND1-rearrangement-negative mantle cell lymphoma can carry CCND2 rearrangements as an alternative cell-cycle lesion."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0073","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"guideline criterion","genes":["CCND3"],"diseases":["mantle cell lymphoma"],"text":"Cyclin-D1-negative/CCND1-rearrangement-negative mantle cell lymphoma can carry CCND3 rearrangements as an alternative cell-cycle lesion."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0074","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"guideline criterion","genes":["CCNE"],"diseases":["mantle cell lymphoma"],"text":"Cyclin-D1-negative/CCND1-rearrangement-negative mantle cell lymphoma can carry CCNE rearrangements as an alternative cell-cycle lesion."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0075","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"prognosis","tier":"restated secondary","genes":["TP53"],"diseases":["mantle cell lymphoma"],"text":"TP53 mutation is among the widely available, best-established biomarkers of high-risk mantle cell lymphoma."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0076","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["DLBCL, NOS"],"text":"DLBCL, NOS is defined by large-cell morphology, a mature B-cell phenotype and absence of criteria defining another specific large B-cell lymphoma entity."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0078","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["DLBCL, NOS"],"text":"WHO-HAEM5 does not define a unified molecular classification framework for DLBCL, NOS because proposed NGS-derived genetic clusters lack a unifying framework and their clinical significance remains unclear."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0079","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"guideline criterion","genes":["MYC","BCL2"],"diseases":["DLBCL/HGBL-MYC/BCL2"],"text":"Dual MYC and BCL2 rearrangements define the WHO-HAEM5 entity DLBCL/HGBL-MYC/BCL2 across large-cell, intermediate-cell and blastoid morphologies."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0080","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"guideline criterion","genes":["MYC","BCL6"],"diseases":["DLBCL, NOS","HGBL, NOS"],"text":"Lymphoid neoplasms with dual MYC and BCL6 rearrangements are excluded from DLBCL/HGBL-MYC/BCL2 and are classified as DLBCL, NOS or HGBL, NOS according to cytomorphology."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0081","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"guideline criterion","genes":["MYC"],"diseases":["HGBL-11q"],"text":"HGBL with 11q aberration is a MYC-rearrangement-negative mature B-cell lymphoma defined in part by a characteristic chromosome 11q gain/loss pattern."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0082","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["HGBL-11q"],"text":"Losses in 11q24-qter are more specific for HGBL-11q than the centromeric 11q gains."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0083","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["HGBL-11q"],"text":"Rare HGBL-11q cases may show copy-number-neutral loss of heterozygosity instead of the usual 11q24-qter losses."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0084","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"guideline criterion","genes":["ID3","TCF3"],"diseases":["HGBL-11q"],"text":"Genomic alterations affecting the ID3-TCF3 complex, a molecular hallmark of Burkitt lymphoma, are rare or absent in HGBL-11q."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0085","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"biomarker","tier":"restated secondary","genes":["MYC"],"diseases":["HGBL-11q"],"text":"B-cell lymphomas with Burkitt-like morphology that lack MYC rearrangement should be tested for the characteristic 11q gain/loss pattern."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0086","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["HGBL, NOS"],"text":"High-grade B-cell lymphoma, NOS is defined as an aggressive mature B-cell lymphoma composed of medium-sized or blastoid cells that does not fit another well-defined entity."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0087","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"guideline criterion","genes":["MYC"],"diseases":["Burkitt lymphoma"],"text":"Burkitt lymphoma is defined in WHO-HAEM5 in part by an IG::MYC juxtaposition together with its characteristic morphology and germinal-centre phenotype."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0088","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["Burkitt lymphoma"],"text":"WHO-HAEM5 recommends EBV-positive and EBV-negative Burkitt lymphoma as biologic subtypes that supersede the traditional epidemiologic subtyping."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0089","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["T-ALL"],"text":"WHO-HAEM5 does not establish genetically defined T-ALL types because current evidence is insufficient to support clinically relevant genetic subtyping."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0090","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["T-PLL"],"text":"Unified diagnostic criteria for T-prolymphocytic leukaemia include T lymphocytosis above 5 x 10^9/L with an appropriate phenotype and demonstration of T-cell monoclonality."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0091","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"guideline criterion","genes":["TCL1A"],"diseases":["T-PLL"],"text":"Structural variants with breakpoints affecting TCL1A are included among unified diagnostic criteria for T-prolymphocytic leukaemia."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0092","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"guideline criterion","genes":["MTCP1"],"diseases":["T-PLL"],"text":"Structural variants with breakpoints affecting MTCP1 are included among unified diagnostic criteria for T-prolymphocytic leukaemia."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0093","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["T-PLL"],"text":"TCL1 expression is included among unified diagnostic criteria for T-prolymphocytic leukaemia."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0094","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"prognosis","tier":"restated secondary","genes":["STAT3"],"diseases":["T-LGLL"],"text":"STAT3 mutation in T-large granular lymphocytic leukaemia is associated with poorer overall survival."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0095","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"prognosis","tier":"restated secondary","genes":["STAT5B"],"diseases":["T-LGLL"],"text":"STAT5B mutation is associated with poor prognosis in CD8-positive T-large granular lymphocytic leukaemia."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0096","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"prognosis","tier":"restated secondary","genes":["STAT5B"],"diseases":["T-LGLL"],"text":"STAT5B mutation has no prognostic impact in CD4-positive T-large granular lymphocytic leukaemia."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0097","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"prognosis","tier":"restated secondary","genes":["STAT5B"],"diseases":["T-LGLL"],"text":"STAT5B mutation has no prognostic impact in gamma/delta T-large granular lymphocytic leukaemia."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0098","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"guideline criterion","genes":["JAK3"],"diseases":["indolent NK-cell lymphoproliferative disorder of the gastrointestinal tract"],"text":"Recurrent somatic JAK3 mutations support the neoplastic nature of indolent NK-cell lymphoproliferative disorder of the gastrointestinal tract."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0099","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["indolent NK-cell lymphoproliferative disorder of the gastrointestinal tract"],"text":"Lack of EBV is a crucial feature supporting indolent NK-cell lymphoproliferative disorder of the gastrointestinal tract over extranodal NK/T-cell lymphoma."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0100","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"guideline criterion","genes":["ALK"],"diseases":["ALK-positive anaplastic large cell lymphoma","ALK-negative anaplastic large cell lymphoma"],"text":"ALK-positive and ALK-negative systemic anaplastic large cell lymphomas are separate entities in WHO-HAEM5 based on distinct pathogenesis and clinical course."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0101","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"prognosis","tier":"restated secondary","genes":["TP63"],"diseases":["ALK-negative anaplastic large cell lymphoma"],"text":"TP63 rearrangements in ALK-negative anaplastic large cell lymphoma are associated with poor outcomes."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0102","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"prognosis","tier":"restated secondary","genes":["TP53"],"diseases":["ALK-negative anaplastic large cell lymphoma"],"text":"Loss of TP53 in ALK-negative anaplastic large cell lymphoma is associated with poor outcomes."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0103","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"prognosis","tier":"restated secondary","genes":["DUSP22"],"diseases":["ALK-negative anaplastic large cell lymphoma"],"text":"The initially reported favourable survival association of DUSP22 rearrangement in ALK-negative anaplastic large cell lymphoma has not been confirmed by more recent studies."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0104","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"biomarker","tier":"restated secondary","genes":["LEF1","DUSP22"],"diseases":["ALK-negative anaplastic large cell lymphoma"],"text":"LEF1 expression may serve as a surrogate marker for DUSP22 rearrangement in ALK-negative anaplastic large cell lymphoma."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0105","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"guideline criterion","genes":["GATA3"],"diseases":["peripheral T-cell lymphoma, NOS"],"text":"PTCL-GATA3 is a possible biological variant of PTCL-NOS, but current evidence is insufficient for formal WHO-HAEM5 subtype status."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0106","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"guideline criterion","genes":["TBX21"],"diseases":["peripheral T-cell lymphoma, NOS"],"text":"PTCL-TBX21 is a possible biological variant of PTCL-NOS, but current evidence is insufficient for formal WHO-HAEM5 subtype status."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0107","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"germline","tier":"restated secondary","genes":["ATM"],"diseases":[],"text":"Ataxia telangiectasia is linked to germline ATM mutations."},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0108","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"germline","tier":"restated secondary","genes":["NBN"],"diseases":[],"text":"Nijmegen-Breakage syndrome is linked to germline NBN mutations."},{"id":"arber-2022-blood-140-1200-C0001","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["CML"],"text":"In CML, major-route additional clonal cytogenetic abnormalities present at diagnosis or acquired during treatment are a hallmark of accelerated phase."},{"id":"arber-2022-blood-140-1200-C0002","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["CML"],"text":"CML accelerated phase is defined by 10%-19% blasts in peripheral blood or bone marrow."},{"id":"arber-2022-blood-140-1200-C0003","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["CML"],"text":"CML blast phase is defined by at least 20% blasts in peripheral blood or bone marrow."},{"id":"arber-2022-blood-140-1200-C0004","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["JAK2","CALR","MPL"],"diseases":["PV","ET","PMF"],"text":"JAK2 V617F/exon 12, CALR, and MPL driver mutations support the diagnosis of PV, ET, or PMF and help distinguish driver-positive from triple-negative disease."},{"id":"arber-2022-blood-140-1200-C0005","paper":"arber-2022-blood-140-1200","category":"biomarker","tier":"guideline criterion","genes":["JAK2","CALR","MPL"],"diseases":["PV","ET","PMF"],"text":"For PV, ET, and PMF driver testing, the ICC recommends highly sensitive single-target or multigene assays with approximately 1% VAF sensitivity."},{"id":"arber-2022-blood-140-1200-C0006","paper":"arber-2022-blood-140-1200","category":"biomarker","tier":"guideline criterion","genes":["JAK2","CALR","MPL"],"diseases":["PV","ET","PMF"],"text":"A JAK2 V617F VAF below 1% should prompt a search for coexisting canonical CALR and MPL mutations."},{"id":"arber-2022-blood-140-1200-C0007","paper":"arber-2022-blood-140-1200","category":"biomarker","tier":"guideline criterion","genes":["JAK2","MPL"],"diseases":["ET","PMF"],"text":"In suspected triple-negative ET or PMF, searching for noncanonical JAK2 and MPL mutations is encouraged."},{"id":"arber-2022-blood-140-1200-C0008","paper":"arber-2022-blood-140-1200","category":"prognosis","tier":"restated secondary","genes":["JAK2"],"diseases":["PV"],"text":"In PV, JAK2 exon 12-mutated disease is reported to have prognosis similar to JAK2 V617F-mutated disease."},{"id":"arber-2022-blood-140-1200-C0009","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["JAK2"],"diseases":["PV"],"text":"In JAK2 exon 12-mutated PV with isolated erythrocytosis and erythroid-predominant marrow, panmyelosis may not be an applicable diagnostic criterion."},{"id":"arber-2022-blood-140-1200-C0010","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["JAK2","CALR","MPL"],"diseases":["ET"],"text":"JAK2, CALR, or MPL mutation is a major diagnostic criterion for essential thrombocythemia."},{"id":"arber-2022-blood-140-1200-C0011","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["JAK2"],"diseases":["PV"],"text":"JAK2 V617F or JAK2 exon 12 mutation is a major diagnostic criterion for polycythemia vera."},{"id":"arber-2022-blood-140-1200-C0012","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["JAK2"],"diseases":["PV"],"text":"In PV with sustained absolute erythrocytosis at the stated high hemoglobin/hematocrit thresholds, bone marrow biopsy may not be required when JAK2 V617F or JAK2 exon 12 mutation is present."},{"id":"arber-2022-blood-140-1200-C0013","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["JAK2","CALR","MPL"],"diseases":["PMF"],"text":"JAK2, CALR, or MPL mutation is a major molecular diagnostic criterion for prefibrotic or overt primary myelofibrosis."},{"id":"arber-2022-blood-140-1200-C0014","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["ASXL1","EZH2","IDH1","IDH2","SF3B1","SRSF2","TET2"],"diseases":["PMF"],"text":"Mutations in ASXL1, EZH2, IDH1, IDH2, SF3B1, SRSF2, or TET2 can support the clonal nature of suspected PMF."},{"id":"arber-2022-blood-140-1200-C0015","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["JAK2","CALR","MPL"],"diseases":["PMF"],"text":"In PMF with monocytosis, a higher VAF of an MPN-associated driver mutation supports PMF with monocytosis rather than CMML."},{"id":"arber-2022-blood-140-1200-C0016","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["CSF3R"],"diseases":["CNL"],"text":"Activating CSF3R driver mutations are the diagnostic genetic signature of CNL."},{"id":"arber-2022-blood-140-1200-C0017","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["CSF3R"],"diseases":["CNL"],"text":"Absence of a CSF3R mutation does not exclude CNL."},{"id":"arber-2022-blood-140-1200-C0018","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["CSF3R"],"diseases":["CNL"],"text":"CSF3R T618I or another activating CSF3R mutation satisfies the molecular diagnostic criterion for CNL."},{"id":"arber-2022-blood-140-1200-C0019","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["BCR","ABL1","PDGFRA","PDGFRB","FGFR1","JAK2","FLT3"],"diseases":["CNL"],"text":"CNL requires exclusion of BCR::ABL1-positive CML and myeloid/lymphoid neoplasms with eosinophilia and tyrosine-kinase fusions."},{"id":"arber-2022-blood-140-1200-C0020","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["CSF3R"],"diseases":["CNL"],"text":"For CNL with CSF3R T618I or another activating CSF3R mutation, the leukocytosis threshold is at least 13 × 10^9/L; without an activating CSF3R mutation, the threshold is at least 25 × 10^9/L."},{"id":"arber-2022-blood-140-1200-C0021","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["CNL"],"text":"CNL with 10%-19% blasts in blood or bone marrow is classified as accelerated phase."},{"id":"arber-2022-blood-140-1200-C0022","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["CNL"],"text":"CNL with at least 20% blasts in blood or bone marrow is classified as blast phase."},{"id":"arber-2022-blood-140-1200-C0023","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["BCR","ABL1","PDGFRA","PDGFRB","FGFR1","JAK2","FLT3"],"diseases":["CEL"],"text":"CEL, NOS requires absence of BCR::ABL1, other ABL1, PDGFRA, PDGFRB, FGFR1, JAK2, or FLT3 tyrosine-kinase fusions."},{"id":"arber-2022-blood-140-1200-C0024","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["JAK2","CALR","MPL"],"diseases":["MPN-U"],"text":"JAK2, CALR, or MPL mutation satisfies the molecular clonality criterion for MPN-U."},{"id":"arber-2022-blood-140-1200-C0025","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["ASXL1","EZH2","IDH1","IDH2","SF3B1","SRSF2","TET2"],"diseases":["MPN-U"],"text":"Mutations such as ASXL1, EZH2, IDH1, IDH2, SF3B1, SRSF2, or TET2 support the clonal nature of MPN-U."},{"id":"arber-2022-blood-140-1200-C0026","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["PDGFRA"],"diseases":["myeloid/lymphoid neoplasm with eosinophilia and TK fusion"],"text":"PDGFRA rearrangement defines an ICC genetic subtype of myeloid/lymphoid neoplasm with eosinophilia and a tyrosine-kinase fusion."},{"id":"arber-2022-blood-140-1200-C0027","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["PDGFRB"],"diseases":["myeloid/lymphoid neoplasm with eosinophilia and TK fusion"],"text":"PDGFRB rearrangement defines an ICC genetic subtype of myeloid/lymphoid neoplasm with eosinophilia and a tyrosine-kinase fusion."},{"id":"arber-2022-blood-140-1200-C0028","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["FGFR1"],"diseases":["myeloid/lymphoid neoplasm with eosinophilia and TK fusion"],"text":"FGFR1 rearrangement defines an ICC genetic subtype of myeloid/lymphoid neoplasm with eosinophilia and a tyrosine-kinase fusion."},{"id":"arber-2022-blood-140-1200-C0029","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["JAK2"],"diseases":["myeloid/lymphoid neoplasm with eosinophilia and TK fusion"],"text":"JAK2 rearrangement defines an ICC genetic subtype of myeloid/lymphoid neoplasm with eosinophilia and a tyrosine-kinase fusion."},{"id":"arber-2022-blood-140-1200-C0030","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["FLT3"],"diseases":["myeloid/lymphoid neoplasm with eosinophilia and TK fusion"],"text":"FLT3 rearrangement defines an ICC genetic subtype of myeloid/lymphoid neoplasm with eosinophilia and a tyrosine-kinase fusion."},{"id":"arber-2022-blood-140-1200-C0031","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["ETV6","ABL1"],"diseases":["myeloid/lymphoid neoplasm with eosinophilia and TK fusion"],"text":"ETV6::ABL1 defines an ICC genetic subtype of myeloid/lymphoid neoplasm with eosinophilia and a tyrosine-kinase fusion."},{"id":"arber-2022-blood-140-1200-C0032","paper":"arber-2022-blood-140-1200","category":"treatment","tier":"restated secondary","genes":["PDGFRA"],"diseases":["myeloid/lymphoid neoplasm with eosinophilia and TK fusion"],"text":"PDGFRA-rearranged M/LN-eo is reported to show an excellent response to tyrosine-kinase inhibitor therapy."},{"id":"arber-2022-blood-140-1200-C0033","paper":"arber-2022-blood-140-1200","category":"treatment","tier":"restated secondary","genes":["PDGFRB"],"diseases":["myeloid/lymphoid neoplasm with eosinophilia and TK fusion"],"text":"PDGFRB-rearranged M/LN-eo is reported to show an excellent response to tyrosine-kinase inhibitor therapy."},{"id":"arber-2022-blood-140-1200-C0034","paper":"arber-2022-blood-140-1200","category":"treatment","tier":"restated secondary","genes":["FGFR1"],"diseases":["myeloid/lymphoid neoplasm with eosinophilia and TK fusion"],"text":"FGFR1-rearranged M/LN-eo is reported to have a high response rate to an FGFR inhibitor such as pemigatinib, especially in chronic phase."},{"id":"arber-2022-blood-140-1200-C0035","paper":"arber-2022-blood-140-1200","category":"treatment","tier":"restated secondary","genes":["JAK2"],"diseases":["myeloid/lymphoid neoplasm with eosinophilia and TK fusion"],"text":"JAK2-rearranged M/LN-eo has shown limited responses to ruxolitinib."},{"id":"arber-2022-blood-140-1200-C0036","paper":"arber-2022-blood-140-1200","category":"treatment","tier":"restated secondary","genes":["FLT3"],"diseases":["myeloid/lymphoid neoplasm with eosinophilia and TK fusion"],"text":"FLT3-rearranged M/LN-eo appears sensitive to FLT3 inhibitors irrespective of fusion partner."},{"id":"arber-2022-blood-140-1200-C0037","paper":"arber-2022-blood-140-1200","category":"treatment","tier":"restated secondary","genes":["ETV6","ABL1"],"diseases":["myeloid/lymphoid neoplasm with eosinophilia and TK fusion"],"text":"ETV6::ABL1 M/LN-eo has shown therapeutic benefit from tyrosine-kinase inhibitors, especially second-generation TKIs."},{"id":"arber-2022-blood-140-1200-C0038","paper":"arber-2022-blood-140-1200","category":"biomarker","tier":"guideline criterion","genes":["ABL1"],"diseases":["myeloid/lymphoid neoplasm with eosinophilia and TK fusion"],"text":"RNA sequencing can identify additional cryptic ABL1 rearrangements in M/LN-eo."},{"id":"arber-2022-blood-140-1200-C0039","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["KIT"],"diseases":["mastocytosis"],"text":"KIT D816V or another activating KIT mutation in marrow, blood, or another extracutaneous organ is a minor diagnostic criterion for systemic mastocytosis."},{"id":"arber-2022-blood-140-1200-C0040","paper":"arber-2022-blood-140-1200","category":"biomarker","tier":"guideline criterion","genes":["KIT"],"diseases":["mastocytosis"],"text":"High-sensitivity PCR is recommended for KIT D816V testing in suspected systemic mastocytosis to reduce false-negative results."},{"id":"arber-2022-blood-140-1200-C0041","paper":"arber-2022-blood-140-1200","category":"biomarker","tier":"guideline criterion","genes":["KIT"],"diseases":["mastocytosis"],"text":"If KIT D816V testing is negative in suspected systemic mastocytosis, exclusion of other KIT mutation variants is strongly recommended."},{"id":"arber-2022-blood-140-1200-C0042","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["PDGFRA","PDGFRB","FGFR1","JAK2","FLT3","ABL1"],"diseases":["mastocytosis"],"text":"Identification of a tyrosine-kinase fusion associated with M/LN-eo excludes a diagnosis of systemic mastocytosis."},{"id":"arber-2022-blood-140-1200-C0043","paper":"arber-2022-blood-140-1200","category":"biomarker","tier":"guideline criterion","genes":["KIT","PDGFRA","PDGFRB","FGFR1","JAK2","FLT3","ABL1"],"diseases":["mastocytosis"],"text":"In suspected systemic mastocytosis without a KIT mutation, particularly with eosinophilia, M/LN-eo-associated tyrosine-kinase fusions should be excluded."},{"id":"arber-2022-blood-140-1200-C0044","paper":"arber-2022-blood-140-1200","category":"treatment","tier":"restated secondary","genes":["KIT"],"diseases":["mastocytosis"],"text":"Rare well-differentiated systemic mastocytosis cases that typically lack KIT D816V may have a higher response rate to conventional tyrosine-kinase inhibitors."},{"id":"arber-2022-blood-140-1200-C0045","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["KIT"],"diseases":["mastocytosis"],"text":"In systemic mastocytosis, high KIT D816V VAF, particularly with monocytosis, eosinophilia, splenomegaly, elevated LDH, or additional myeloid mutations, raises suspicion for an associated myeloid neoplasm."},{"id":"arber-2022-blood-140-1200-C0046","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["SRSF2","TET2","ASXL1","SETBP1","NRAS","KRAS","RUNX1","CBL","EZH2"],"diseases":["CMML"],"text":"In CMML, common myeloid mutations including SRSF2, TET2, ASXL1, SETBP1, NRAS, KRAS, RUNX1, CBL, and EZH2 can provide molecular evidence of clonality."},{"id":"arber-2022-blood-140-1200-C0047","paper":"arber-2022-blood-140-1200","category":"prognosis","tier":"restated secondary","genes":["ASXL1"],"diseases":["CMML"],"text":"ASXL1 mutations in CMML have prognostic implications."},{"id":"arber-2022-blood-140-1200-C0048","paper":"arber-2022-blood-140-1200","category":"prognosis","tier":"restated secondary","genes":["NPM1"],"diseases":["CMML"],"text":"NPM1 mutation in CMML is associated with a particularly aggressive clinical course and rapid progression to acute leukemia."},{"id":"arber-2022-blood-140-1200-C0049","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["NPM1"],"diseases":["CMML"],"text":"Development of an NPM1 mutation in established CMML should be noted but does not by itself define de novo AML."},{"id":"arber-2022-blood-140-1200-C0050","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["CMML"],"text":"When clonality is established, CMML can be diagnosed with an absolute monocyte count of at least 0.5 × 10^9/L provided monocytes remain at least 10% of WBC."},{"id":"arber-2022-blood-140-1200-C0051","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["CMML"],"text":"The myeloproliferative subtype of CMML is defined by WBC greater than 13 × 10^9/L."},{"id":"arber-2022-blood-140-1200-C0052","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["JAK2","CALR","MPL"],"diseases":["aCML"],"text":"In aCML, absence of JAK2, CALR, and MPL driver mutations supports the diagnosis, whereas an MPN history or these driver mutations tends to exclude aCML."},{"id":"arber-2022-blood-140-1200-C0053","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["SETBP1","ASXL1"],"diseases":["aCML"],"text":"SETBP1 mutation, often with ASXL1 co-mutation, supports a diagnosis of aCML."},{"id":"arber-2022-blood-140-1200-C0054","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["CSF3R"],"diseases":["aCML"],"text":"CSF3R mutation is uncommon in aCML and, if detected, should prompt morphologic review to exclude CNL."},{"id":"arber-2022-blood-140-1200-C0055","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["BCR","ABL1"],"diseases":["aCML"],"text":"aCML requires absence of BCR::ABL1."},{"id":"arber-2022-blood-140-1200-C0056","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["PDGFRA","PDGFRB","FGFR1","JAK2","FLT3","ABL1"],"diseases":["aCML"],"text":"aCML requires absence of genetic abnormalities defining myeloid/lymphoid neoplasms with eosinophilia and tyrosine-kinase fusions."},{"id":"arber-2022-blood-140-1200-C0057","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["SF3B1"],"diseases":["MDS/MPN-SF3B1-T"],"text":"MDS/MPN with SF3B1 mutation and thrombocytosis requires an SF3B1 mutation with VAF greater than 10%."},{"id":"arber-2022-blood-140-1200-C0058","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["SF3B1"],"diseases":["MDS/MPN-SF3B1-T"],"text":"When the qualifying SF3B1 mutation is present in MDS/MPN with SF3B1 mutation and thrombocytosis, ring sideroblasts are not required for diagnosis."},{"id":"arber-2022-blood-140-1200-C0059","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["JAK2","CALR","MPL"],"diseases":["MDS/MPN-SF3B1-T"],"text":"In MDS/MPN with SF3B1 mutation and thrombocytosis, JAK2 V617F, CALR, or MPL W515 co-mutation is not required but supports the diagnosis."},{"id":"arber-2022-blood-140-1200-C0060","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["SF3B1"],"diseases":["MDS"],"text":"MDS-SF3B1 that later develops thrombocytosis is classified as thrombocytotic progression of MDS-SF3B1 rather than as MDS/MPN."},{"id":"arber-2022-blood-140-1200-C0061","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["BCR","ABL1"],"diseases":["MDS/MPN-SF3B1-T"],"text":"MDS/MPN with SF3B1 mutation and thrombocytosis requires absence of BCR::ABL1."},{"id":"arber-2022-blood-140-1200-C0062","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["PDGFRA","PDGFRB","FGFR1","JAK2","FLT3","ABL1"],"diseases":["MDS/MPN-SF3B1-T"],"text":"MDS/MPN with SF3B1 mutation and thrombocytosis requires absence of genetic abnormalities defining myeloid/lymphoid neoplasms with eosinophilia and tyrosine-kinase fusions."},{"id":"arber-2022-blood-140-1200-C0063","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["JAK2","CALR","MPL"],"diseases":["MDS/MPN-U"],"text":"For MDS/MPN, NOS, an MPN history or JAK2, CALR, or MPL mutation—particularly at high VAF—tends to exclude the diagnosis."},{"id":"arber-2022-blood-140-1200-C0064","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["CHIP"],"text":"CHIP can be defined by a somatic mutation in a myeloid-neoplasm driver gene at VAF at least 2%."},{"id":"arber-2022-blood-140-1200-C0065","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["CHIP"],"text":"A non-MDS-defining clonal cytogenetic abnormality can alternatively define CHIP."},{"id":"arber-2022-blood-140-1200-C0066","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["CHIP"],"text":"CHIP requires absence of a diagnosed myeloid neoplasm and absence of unexplained cytopenia."},{"id":"arber-2022-blood-140-1200-C0067","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["CCUS"],"text":"CCUS requires persistent idiopathic cytopenia lasting at least 4 months and not attributable to another comorbid condition."},{"id":"arber-2022-blood-140-1200-C0068","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["CCUS"],"text":"For CCUS and other premalignant clonal cytopenias, a VAF threshold of at least 2% is recommended for the clonal abnormality."},{"id":"arber-2022-blood-140-1200-C0069","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["CCUS"],"text":"CCUS is distinguished from MDS by the absence of qualifying dysplasia or increased blasts in peripheral blood and bone marrow."},{"id":"arber-2022-blood-140-1200-C0070","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["SF3B1"],"diseases":["MDS"],"text":"Neither dysplasia nor ring sideroblasts are required for the diagnosis of MDS-SF3B1 when the defining genetic criteria are met."},{"id":"arber-2022-blood-140-1200-C0071","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["SF3B1"],"diseases":["MDS"],"text":"MDS-SF3B1 requires an SF3B1 mutation with VAF at least 10%."},{"id":"arber-2022-blood-140-1200-C0072","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["TP53"],"diseases":["MDS"],"text":"MDS-SF3B1 requires absence of multi-hit TP53."},{"id":"arber-2022-blood-140-1200-C0073","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["RUNX1"],"diseases":["MDS"],"text":"MDS-SF3B1 requires absence of a RUNX1 mutation."},{"id":"arber-2022-blood-140-1200-C0074","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["MDS"],"text":"MDS with del(5q) requires del(5q) to be isolated or accompanied by only one other cytogenetic abnormality, except -7/del(7q)."},{"id":"arber-2022-blood-140-1200-C0075","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["TP53"],"diseases":["MDS"],"text":"MDS with del(5q) excludes multi-hit TP53."},{"id":"arber-2022-blood-140-1200-C0076","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["MDS/AML"],"text":"Adult MDS/AML is defined as a cytopenic myeloid neoplasm with 10%-19% blasts in blood or bone marrow."},{"id":"arber-2022-blood-140-1200-C0077","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["TP53"],"diseases":["MDS"],"text":"MDS with mutated TP53 is defined in the 0%-9% blood or marrow blast range."},{"id":"arber-2022-blood-140-1200-C0078","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["TP53"],"diseases":["MDS"],"text":"MDS with mutated TP53 requires multi-hit TP53."},{"id":"arber-2022-blood-140-1200-C0079","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["TP53"],"diseases":["MDS"],"text":"When TP53-locus LOH information is unavailable, a TP53 mutation with VAF above 10% plus complex karyotype is accepted for MDS with mutated TP53."},{"id":"arber-2022-blood-140-1200-C0080","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["TP53"],"diseases":["MDS"],"text":"Two distinct TP53 mutations, each with VAF above 10%, establish multi-hit TP53."},{"id":"arber-2022-blood-140-1200-C0081","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["TP53"],"diseases":["MDS"],"text":"A TP53 mutation with a cytogenetic deletion involving the TP53 locus at 17p13.1 establishes multi-hit TP53."},{"id":"arber-2022-blood-140-1200-C0082","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["TP53"],"diseases":["MDS"],"text":"A single TP53 mutation with VAF above 50% establishes multi-hit TP53."},{"id":"arber-2022-blood-140-1200-C0083","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["TP53"],"diseases":["MDS"],"text":"A TP53 mutation with copy-neutral loss of heterozygosity at the 17p TP53 locus establishes multi-hit TP53."},{"id":"arber-2022-blood-140-1200-C0084","paper":"arber-2022-blood-140-1200","category":"prognosis","tier":"restated secondary","genes":["TP53"],"diseases":["MDS","MDS/AML","AML"],"text":"In cytopenic myeloid neoplasms, multi-hit TP53 denotes highly aggressive disease with short survival."},{"id":"arber-2022-blood-140-1200-C0085","paper":"arber-2022-blood-140-1200","category":"prognosis","tier":"restated secondary","genes":["TP53"],"diseases":["MDS"],"text":"In MDS with multi-hit TP53, prognosis does not appear to depend on blast percentage."},{"id":"arber-2022-blood-140-1200-C0086","paper":"arber-2022-blood-140-1200","category":"prognosis","tier":"restated secondary","genes":["TP53"],"diseases":["MDS"],"text":"Monoallelic TP53 mutations in MDS have a less adverse prognostic effect than multi-hit TP53 mutations."},{"id":"arber-2022-blood-140-1200-C0087","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["TP53"],"diseases":["MDS"],"text":"Monoallelic TP53-mutated MDS is not included in the ICC MDS with mutated TP53 entity, which requires multi-hit TP53."},{"id":"arber-2022-blood-140-1200-C0088","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["TP53"],"diseases":["MDS/AML"],"text":"MDS/AML with mutated TP53 is defined by 10%-19% blood or marrow blasts and any somatic TP53 mutation with VAF above 10%."},{"id":"arber-2022-blood-140-1200-C0089","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["TP53"],"diseases":["AML"],"text":"AML with mutated TP53 is defined by at least 20% blood or marrow blasts, or pure erythroid leukemia criteria, plus any somatic TP53 mutation with VAF above 10%."},{"id":"arber-2022-blood-140-1200-C0090","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["TP53"],"diseases":["MDS"],"text":"Acquisition of TP53 mutation during MDS progression can reclassify disease as MDS, MDS/AML, or AML with mutated TP53 according to blast count."},{"id":"arber-2022-blood-140-1200-C0091","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["PTPN11","KRAS","NRAS","RRAS"],"diseases":["JMML"],"text":"A somatic mutation in PTPN11, KRAS, NRAS, or RRAS is a qualifying genetic route for JMML."},{"id":"arber-2022-blood-140-1200-C0092","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["NF1"],"diseases":["JMML"],"text":"Germline NF1 mutation with acquired loss of heterozygosity, or a clinical diagnosis of neurofibromatosis type 1, is a qualifying genetic route for JMML."},{"id":"arber-2022-blood-140-1200-C0093","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["CBL"],"diseases":["JMML"],"text":"Germline CBL mutation with acquired loss of heterozygosity is a qualifying genetic route for JMML."},{"id":"arber-2022-blood-140-1200-C0094","paper":"arber-2022-blood-140-1200","category":"germline","tier":"guideline criterion","genes":["NF1"],"diseases":["JMML"],"text":"JMML associated with NF1 involves a germline NF1 event that progresses to malignancy through acquired biallelic inactivation in hematopoietic cells."},{"id":"arber-2022-blood-140-1200-C0095","paper":"arber-2022-blood-140-1200","category":"germline","tier":"guideline criterion","genes":["CBL"],"diseases":["JMML"],"text":"JMML associated with CBL involves a germline CBL event that usually progresses to malignancy through acquired biallelic inactivation in hematopoietic cells."},{"id":"arber-2022-blood-140-1200-C0096","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["PTPN11","NRAS","KRAS"],"diseases":["JMML"],"text":"PTPN11-, NRAS-, and KRAS-mutated JMML are characterized by heterozygous somatic gain-of-function mutations in children without germline disease."},{"id":"arber-2022-blood-140-1200-C0097","paper":"arber-2022-blood-140-1200","category":"germline","tier":"guideline criterion","genes":["PTPN11","KRAS","NRAS","RIT1"],"diseases":[],"text":"Germline PTPN11, KRAS, NRAS, or RIT1 mutations in Noonan syndrome can cause a transient myeloproliferative disorder in the first year of life."},{"id":"arber-2022-blood-140-1200-C0098","paper":"arber-2022-blood-140-1200","category":"germline","tier":"guideline criterion","genes":["CEBPA"],"diseases":["AML"],"text":"Germline CEBPA predisposes to AML."},{"id":"arber-2022-blood-140-1200-C0099","paper":"arber-2022-blood-140-1200","category":"germline","tier":"guideline criterion","genes":["DDX41"],"diseases":[],"text":"Germline DDX41 predisposes to both myeloid and lymphoid neoplasms."},{"id":"arber-2022-blood-140-1200-C0100","paper":"arber-2022-blood-140-1200","category":"germline","tier":"guideline criterion","genes":["TP53"],"diseases":[],"text":"Germline TP53 in Li-Fraumeni syndrome predisposes to myeloid and lymphoid malignancies in both treatment-naive and therapy-related settings."},{"id":"arber-2022-blood-140-1200-C0101","paper":"arber-2022-blood-140-1200","category":"germline","tier":"guideline criterion","genes":["RUNX1"],"diseases":[],"text":"Germline RUNX1 predisposition is associated with a constitutional platelet disorder and can predispose to myeloid and lymphoid neoplasms."},{"id":"arber-2022-blood-140-1200-C0102","paper":"arber-2022-blood-140-1200","category":"germline","tier":"guideline criterion","genes":["ANKRD26"],"diseases":[],"text":"Germline ANKRD26 predisposition is associated with a constitutional platelet disorder and myeloid neoplasia."},{"id":"arber-2022-blood-140-1200-C0103","paper":"arber-2022-blood-140-1200","category":"germline","tier":"guideline criterion","genes":["ETV6"],"diseases":[],"text":"Germline ETV6 predisposition is associated with a constitutional platelet disorder and can predispose to myeloid and lymphoid neoplasms."},{"id":"arber-2022-blood-140-1200-C0104","paper":"arber-2022-blood-140-1200","category":"germline","tier":"guideline criterion","genes":["GATA2"],"diseases":[],"text":"Germline GATA2 predisposes to myeloid neoplasms in the setting of a constitutional disorder affecting multiple organ systems."},{"id":"arber-2022-blood-140-1200-C0105","paper":"arber-2022-blood-140-1200","category":"germline","tier":"guideline criterion","genes":["SAMD9"],"diseases":["MDS"],"text":"Germline SAMD9 predisposes to acquired monosomy 7/del(7q) and MDS."},{"id":"arber-2022-blood-140-1200-C0106","paper":"arber-2022-blood-140-1200","category":"germline","tier":"guideline criterion","genes":["SAMD9L"],"diseases":["MDS"],"text":"Germline SAMD9L predisposes to acquired monosomy 7/del(7q) and MDS."},{"id":"arber-2022-blood-140-1200-C0107","paper":"arber-2022-blood-140-1200","category":"germline","tier":"guideline criterion","genes":["BLM"],"diseases":[],"text":"Bloom syndrome due to germline BLM mutation is associated with predisposition to hematologic malignancy."},{"id":"arber-2022-blood-140-1200-C0108","paper":"arber-2022-blood-140-1200","category":"germline","tier":"guideline criterion","genes":["DNMT3A"],"diseases":[],"text":"Germline DNMT3A mutation is reported as predisposing to hematologic malignancy."},{"id":"arber-2022-blood-140-1200-C0109","paper":"arber-2022-blood-140-1200","category":"germline","tier":"guideline criterion","genes":["ERCC6L2"],"diseases":[],"text":"Germline ERCC6L2 mutation is reported as predisposing to hematologic malignancy."},{"id":"arber-2022-blood-140-1200-C0110","paper":"arber-2022-blood-140-1200","category":"germline","tier":"guideline criterion","genes":["MBD4"],"diseases":[],"text":"Germline MBD4 mutation is reported as predisposing to hematologic malignancy."},{"id":"arber-2022-blood-140-1200-C0111","paper":"arber-2022-blood-140-1200","category":"germline","tier":"guideline criterion","genes":["XPC"],"diseases":[],"text":"Germline XPC mutation is reported as predisposing to hematologic malignancy."},{"id":"arber-2022-blood-140-1200-C0112","paper":"arber-2022-blood-140-1200","category":"germline","tier":"guideline criterion","genes":["CSF3R"],"diseases":[],"text":"Limited cases of hematologic malignancy have been reported with germline CSF3R mutations."},{"id":"arber-2022-blood-140-1200-C0113","paper":"arber-2022-blood-140-1200","category":"germline","tier":"guideline criterion","genes":["MECOM"],"diseases":[],"text":"Limited cases of hematologic malignancy have been reported with germline MECOM mutations."},{"id":"arber-2022-blood-140-1200-C0114","paper":"arber-2022-blood-140-1200","categ yelodysplasia-related gene mutation at at least 20% blasts."},{"id":"arber-2022-blood-140-1200-C0155","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["SF3B1"],"diseases":["MDS/AML","AML"],"text":"SF3B1 mutation qualifies for MDS/AML with myelodysplasia-related gene mutation at 10%-19% blasts or AML with myelodysplasia-related gene mutation at at least 20% blasts."},{"id":"arber-2022-blood-140-1200-C0156","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["SRSF2"],"diseases":["MDS/AML","AML"],"text":"SRSF2 mutation qualifies for MDS/AML with myelodysplasia-related gene mutation at 10%-19% blasts or AML with myelodysplasia-related gene mutation at at least 20% blasts."},{"id":"arber-2022-blood-140-1200-C0157","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["STAG2"],"diseases":["MDS/AML","AML"],"text":"STAG2 mutation qualifies for MDS/AML with myelodysplasia-related gene mutation at 10%-19% blasts or AML with myelodysplasia-related gene mutation at at least 20% blasts."},{"id":"arber-2022-blood-140-1200-C0158","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["U2AF1"],"diseases":["MDS/AML","AML"],"text":"U2AF1 mutation qualifies for MDS/AML with myelodysplasia-related gene mutation at 10%-19% blasts or AML with myelodysplasia-related gene mutation at at least 20% blasts."},{"id":"arber-2022-blood-140-1200-C0159","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["ZRSR2"],"diseases":["MDS/AML","AML"],"text":"ZRSR2 mutation qualifies for MDS/AML with myelodysplasia-related gene mutation at 10%-19% blasts or AML with myelodysplasia-related gene mutation at at least 20% blasts."},{"id":"arber-2022-blood-140-1200-C0160","paper":"arber-2022-blood-140-1200","category":"prognosis","tier":"restated secondary","genes":["ASXL1","BCOR","EZH2","RUNX
