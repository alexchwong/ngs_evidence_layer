paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["BCR","ABL1"],"diseases":["AML"],"text":"AML with BCR::ABL1 retains a blast requirement of at least 20%."},{"id":"arber-2022-blood-140-1200-C0150","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["BCR","ABL1"],"diseases":["AML"],"text":"The MDS/AML category is not used for BCR::ABL1-positive AML because of overlap with progression of BCR::ABL1-positive CML."},{"id":"arber-2022-blood-140-1200-C0151","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["ASXL1"],"diseases":["MDS/AML","AML"],"text":"ASXL1 mutation qualifies for MDS/AML with myelodysplasia-related gene mutation at 10%-19% blasts or AML with myelodysplasia-related gene mutation at at least 20% blasts."},{"id":"arber-2022-blood-140-1200-C0152","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["BCOR"],"diseases":["MDS/AML","AML"],"text":"BCOR mutation qualifies for MDS/AML with myelodysplasia-related gene mutation at 10%-19% blasts or AML with myelodysplasia-related gene mutation at at least 20% blasts."},{"id":"arber-2022-blood-140-1200-C0153","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["EZH2"],"diseases":["MDS/AML","AML"],"text":"EZH2 mutation qualifies for MDS/AML with myelodysplasia-related gene mutation at 10%-19% blasts or AML with myelodysplasia-related gene mutation at at least 20% blasts."},{"id":"arber-2022-blood-140-1200-C0154","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["RUNX1"],"diseases":["MDS/AML","AML"],"text":"RUNX1 mutation qualifies for MDS/AML with myelodysplasia-related gene mutation at 10%-19% blasts or AML with myelodysplasia-related gene mutation at at least 20% blasts."},{"id":"arber-2022-blood-140-1200-C0155","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["SF3B1"],"diseases":["MDS/AML","AML"],"text":"SF3B1 mutation qualifies for MDS/AML with myelodysplasia-related gene mutation at 10%-19% blasts or AML with myelodysplasia-related gene mutation at at least 20% blasts."},{"id":"arber-2022-blood-140-1200-C0156","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["SRSF2"],"diseases":["MDS/AML","AML"],"text":"SRSF2 mutation qualifies for MDS/AML with myelodysplasia-related gene mutation at 10%-19% blasts or AML with myelodysplasia-related gene mutation at at least 20% blasts."},{"id":"arber-2022-blood-140-1200-C0157","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["STAG2"],"diseases":["MDS/AML","AML"],"text":"STAG2 mutation qualifies for MDS/AML with myelodysplasia-related gene mutation at 10%-19% blasts or AML with myelodysplasia-related gene mutation at at least 20% blasts."},{"id":"arber-2022-blood-140-1200-C0158","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["U2AF1"],"diseases":["MDS/AML","AML"],"text":"U2AF1 mutation qualifies for MDS/AML with myelodysplasia-related gene mutation at 10%-19% blasts or AML with myelodysplasia-related gene mutation at at least 20% blasts."},{"id":"arber-2022-blood-140-1200-C0159","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["ZRSR2"],"diseases":["MDS/AML","AML"],"text":"ZRSR2 mutation qualifies for MDS/AML with myelodysplasia-related gene mutation at 10%-19% blasts or AML with myelodysplasia-related gene mutation at at least 20% blasts."},{"id":"arber-2022-blood-140-1200-C0160","paper":"arber-2022-blood-140-1200","category":"prognosis","tier":"restated secondary","genes":["ASXL1","BCOR","EZH2","RUNX1","SF3B1","SRSF2","STAG2","U2AF1","ZRSR2"],"diseases":["AML"],"text":"The myelodysplasia-related gene mutations confer similarly adverse prognosis in de novo AML that would previously have been classified as AML, NOS."},{"id":"arber-2022-blood-140-1200-C0161","paper":"arber-2022-blood-140-1200","category":"prognosis","tier":"restated secondary","genes":["TP53"],"diseases":["AML"],"text":"AML with mutated TP53 is associated with very poor outcome and defines a distinctly aggressive category across de novo, post-MDS, and therapy-related presentations."},{"id":"arber-2022-blood-140-1200-C0162","paper":"arber-2022-blood-140-1200","category":"prognosis","tier":"restated secondary","genes":["CEBPA"],"diseases":["AML"],"text":"In-frame bZIP CEBPA mutations define a favorable-prognosis AML entity without requiring biallelic CEBPA mutation."},{"id":"arber-2022-blood-140-1200-C0163","paper":"arber-2022-blood-140-1200","category":"prognosis","tier":"restated secondary","genes":["TP53"],"diseases":["AML"],"text":"When TP53 mutation overlaps another AML genetic category, it is usually predictive of worse prognosis and should be reported with the other abnormality."},{"id":"arber-2022-blood-140-1200-C0164","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["AML"],"text":"In AML classification, single-gene mutation or gene-fusion categories take precedence over myelodysplasia-related gene-mutation and myelodysplasia-related cytogenetic categories."},{"id":"arber-2022-blood-140-1200-C0165","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["TP53"],"diseases":["AML"],"text":"Pure erythroid leukemia is typically TP53-mutated and is classified within AML with TP53 mutation in the ICC."},{"id":"arber-2022-blood-140-1200-C0166","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["AML"],"text":"The remaining AML categories retain a blast requirement of at least 20%."},{"id":"arber-2022-blood-140-1200-C0167","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["MDS/AML"],"text":"MDS cases with 10%-19% blasts are classified as MDS/AML after higher-priority AML-defining genetic categories are considered."},{"id":"arber-2022-blood-140-1200-C0168","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["BCR","ABL1"],"diseases":["B-ALL"],"text":"BCR::ABL1-positive B-ALL is divided into lymphoid-only and multilineage BCR::ABL1-positive subsets."},{"id":"arber-2022-blood-140-1200-C0169","paper":"arber-2022-blood-140-1200","category":"biomarker","tier":"guideline criterion","genes":["BCR","ABL1"],"diseases":["B-ALL"],"text":"In BCR::ABL1-positive B-ALL, FISH detection of the translocation in granulocytes supports multilineage involvement, whereas FISH positivity confined to lymphoblasts supports lymphoid-only involvement."},{"id":"arber-2022-blood-140-1200-C0170","paper":"arber-2022-blood-140-1200","category":"biomarker","tier":"guideline criterion","genes":["BCR","ABL1"],"diseases":["B-ALL"],"text":"After treatment of BCR::ABL1-positive B-ALL, high RT-PCR positivity for BCR::ABL1 can persist despite little or no MRD by flow cytometry and other molecular MRD methods, which can affect MRD interpretation."},{"id":"arber-2022-blood-140-1200-C0171","paper":"arber-2022-blood-140-1200","category":"treatment","tier":"restated secondary","genes":["ABL1"],"diseases":["B-ALL"],"text":"BCR::ABL1-like B-ALL with ABL-class fusions is important to recognize because these cases show a distinctive response pattern to ABL1-class tyrosine-kinase inhibitors."},{"id":"arber-2022-blood-140-1200-C0172","paper":"arber-2022-blood-140-1200","category":"biomarker","tier":"guideline criterion","genes":["CRLF2"],"diseases":["B-ALL"],"text":"CRLF2 rearrangement in BCR::ABL1-like B-ALL can often be detected by FISH or screened by CRLF2 flow cytometry because CRLF2 is upregulated."},{"id":"arber-2022-blood-140-1200-C0173","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["MYC"],"diseases":["B-ALL"],"text":"B-ALL with MYC rearrangement is classified as an immature B-ALL entity distinct from aggressive mature B-cell lymphomas with MYC rearrangement."},{"id":"arber-2022-blood-140-1200-C0174","paper":"arber-2022-blood-140-1200","category":"prognosis","tier":"restated secondary","genes":["MYC"],"diseases":["B-ALL"],"text":"B-ALL with MYC rearrangement has poor prognosis in the ICC summary table."},{"id":"arber-2022-blood-140-1200-C0175","paper":"arber-2022-blood-140-1200","category":"prognosis","tier":"restated secondary","genes":["DUX4","IKZF1"],"diseases":["B-ALL"],"text":"DUX4-rearranged B-ALL has excellent prognosis in children and adults, even with adverse features such as IKZF1 deletion."},{"id":"arber-2022-blood-140-1200-C0176","paper":"arber-2022-blood-140-1200","category":"biomarker","tier":"guideline criterion","genes":["DUX4"],"diseases":["B-ALL"],"text":"FISH detection of DUX4 rearrangement is difficult."},{"id":"arber-2022-blood-140-1200-C0177","paper":"arber-2022-blood-140-1200","category":"biomarker","tier":"guideline criterion","genes":["DUX4"],"diseases":["B-ALL"],"text":"DUX4 overexpression is specific for DUX4-rearranged B-ALL and can be detected by quantitative gene-expression testing or immunohistochemistry."},{"id":"arber-2022-blood-140-1200-C0178","paper":"arber-2022-blood-140-1200","category":"biomarker","tier":"guideline criterion","genes":["DUX4"],"diseases":["B-ALL"],"text":"CD371 expression is associated with DUX4-rearranged B-ALL and may be identified by flow cytometry."},{"id":"arber-2022-blood-140-1200-C0179","paper":"arber-2022-blood-140-1200","category":"prognosis","tier":"restated secondary","genes":["MEF2D"],"diseases":["B-ALL"],"text":"MEF2D-rearranged B-ALL has poor prognosis."},{"id":"arber-2022-blood-140-1200-C0180","paper":"arber-2022-blood-140-1200","category":"biomarker","tier":"guideline criterion","genes":["MEF2D"],"diseases":["B-ALL"],"text":"MEF2D-rearranged B-ALL can be assessed by whole-transcriptome sequencing or MEF2D FISH."},{"id":"arber-2022-blood-140-1200-C0181","paper":"arber-2022-blood-140-1200","category":"biomarker","tier":"guideline criterion","genes":["MEF2D","BCL9"],"diseases":["B-ALL"],"text":"MEF2D-rearranged B-ALL with the common BCL9 fusion partner can be detected with available fusion FISH probes."},{"id":"arber-2022-blood-140-1200-C0183","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["ZNF384"],"diseases":["B-ALL"],"text":"ZNF384-rearranged leukemia is a distinct rearrangement-defined entity that may present as B-ALL or B/myeloid MPAL."},{"id":"arber-2022-blood-140-1200-C0184","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["ZNF384","ZNF362"],"diseases":["B-ALL"],"text":"ZNF362-rearranged cases with the same characteristic expression profile are grouped with ZNF384/ZNF362-rearranged B-ALL."},{"id":"arber-2022-blood-140-1200-C0185","paper":"arber-2022-blood-140-1200","category":"prognosis","tier":"restated secondary","genes":["ZNF384","EP300","TCF3"],"diseases":["B-ALL"],"text":"In ZNF384-rearranged B-ALL, prognosis varies by fusion partner, with EP300 associated with the best prognosis and TCF3 with the worst."},{"id":"arber-2022-blood-140-1200-C0186","paper":"arber-2022-blood-140-1200","category":"biomarker","tier":"guideline criterion","genes":["ZNF384","ZNF362"],"diseases":["B-ALL"],"text":"ZNF384/ZNF362-rearranged B-ALL can be assessed by whole-transcriptome sequencing, with FISH possible for some rearrangements."},{"id":"arber-2022-blood-140-1200-C0187","paper":"arber-2022-blood-140-1200","category":"prognosis","tier":"restated secondary","genes":["NUTM1","KMT2A"],"diseases":["B-ALL"],"text":"NUTM1-rearranged B-ALL has favorable prognosis and, in infants, a much more favorable prognosis than KMT2A-rearranged leukemia."},{"id":"arber-2022-blood-140-1200-C0188","paper":"arber-2022-blood-140-1200","category":"biomarker","tier":"guideline criterion","genes":["NUTM1"],"diseases":["B-ALL"],"text":"NUTM1-rearranged B-ALL can be diagnosed with a standard NUTM1 break-apart FISH probe set."},{"id":"arber-2022-blood-140-1200-C0189","paper":"arber-2022-blood-140-1200","category":"prognosis","tier":"restated secondary","genes":["TCF3","TCF4","HLF"],"diseases":["B-ALL"],"text":"HLF-rearranged B-ALL has very poor prognosis."},{"id":"arber-2022-blood-140-1200-C0190","paper":"arber-2022-blood-140-1200","category":"treatment","tier":"restated secondary","genes":["TCF3","TCF4","HLF"],"diseases":["B-ALL"],"text":"Anti-CD19 therapy and transplant have shown some promise in HLF-rearranged B-ALL."},{"id":"arber-2022-blood-140-1200-C0191","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["CDX2","UBTF","FLT3","PAN3","ATXN7L3"],"diseases":["B-ALL"],"text":"CDX2/UBTF B-ALL is defined by concomitant FLT3/PAN3-region enhancer retargeting with CDX2 deregulation and a UBTF-region lesion producing UBTF::ATXN7L3."},{"id":"arber-2022-blood-140-1200-C0192","paper":"arber-2022-blood-140-1200","category":"prognosis","tier":"restated secondary","genes":["CDX2","UBTF"],"diseases":["B-ALL"],"text":"CDX2/UBTF B-ALL appears to have poor outcome with conventional chemotherapy."},{"id":"arber-2022-blood-140-1200-C0193","paper":"arber-2022-blood-140-1200","category":"biomarker","tier":"guideline criterion","genes":["CDX2","UBTF"],"diseases":["B-ALL"],"text":"CDX2/UBTF B-ALL can be assessed using RT-PCR or whole-transcriptome sequencing for its defining lesions."},{"id":"arber-2022-blood-140-1200-C0194","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["IKZF1"],"diseases":["B-ALL"],"text":"B-ALL with IKZF1 N159Y is recognized as a distinct point-mutation-defined entity."},{"id":"arber-2022-blood-140-1200-C0195","paper":"arber-2022-blood-140-1200","category":"biomarker","tier":"guideline criterion","genes":["IKZF1"],"diseases":["B-ALL"],"text":"The defining IKZF1 N159Y mutation in B-ALL can be detected by exome or gene-panel sequencing."},{"id":"arber-2022-blood-140-1200-C0196","paper":"arber-2022-blood-140-1200","category":"prognosis","tier":"restated secondary","genes":["IKZF1"],"diseases":["B-ALL"],"text":"B-ALL with IKZF1 N159Y is assigned intermediate prognosis in the ICC summary table."},{"id":"arber-2022-blood-140-1200-C0197","paper":"arber-2022-blood-140-1200","category":"prognosis","tier":"restated secondary","genes":["PAX5"],"diseases":["B-ALL"],"text":"PAX5 P80R B-ALL has relatively favorable prognosis in the source discussion."},{"id":"arber-2022-blood-140-1200-C0198","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["PAX5"],"diseases":["B-ALL"],"text":"The PAX5 P80R B-ALL entity depends on biallelic PAX5 alteration through deletion or inactivation of the second allele."},{"id":"arber-2022-blood-140-1200-C0199","paper":"arber-2022-blood-140-1200","category":"biomarker","tier":"guideline criterion","genes":["PAX5"],"diseases":["B-ALL"],"text":"The defining PAX5 P80R mutation in B-ALL can be detected by exome or gene-panel sequencing."},{"id":"arber-2022-blood-140-1200-C0200","paper":"arber-2022-blood-140-1200","category":"prognosis","tier":"restated secondary","genes":["PAX5"],"diseases":["B-ALL"],"text":"B-ALL with PAX5 P80R is summarized as intermediate prognosis overall and good prognosis in adults in the ICC summary table."},{"id":"arber-2022-blood-140-1200-C0201","paper":"arber-2022-blood-140-1200","category":"prognosis","tier":"restated secondary","genes":["ETV6","RUNX1"],"diseases":["B-ALL"],"text":"Pediatric ETV6::RUNX1-like B-ALL appears to have the same favorable prognosis as ETV6::RUNX1 B-ALL."},{"id":"arber-2022-blood-140-1200-C0202","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["PAX5"],"diseases":["B-ALL"],"text":"PAX5-altered B-ALL is a provisional subtype characterized by diverse PAX5 rearrangements, point mutations, and intragenic lesions."},{"id":"arber-2022-blood-140-1200-C0203","paper":"arber-2022-blood-140-1200","category":"biomarker","tier":"guideline criterion","genes":["PAX5"],"diseases":["B-ALL"],"text":"Complete definition of PAX5-altered B-ALL requires gene-expression profiling."},{"id":"arber-2022-blood-140-1200-C0204","paper":"arber-2022-blood-140-1200","category":"prognosis","tier":"restated secondary","genes":["ZEB2","CEBPE"],"diseases":["B-ALL"],"text":"B-ALL cases clustering with ZEB2 H1038R or IGH::CEBPE have poor prognosis."},{"id":"arber-2022-blood-140-1200-C0205","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["ZEB2","CEBPE"],"diseases":["B-ALL"],"text":"ZEB2 H1038R and IGH::CEBPE lesions do not uniquely define the expression-defined provisional B-ALL group."},{"id":"arber-2022-blood-140-1200-C0206","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["KMT2A"],"diseases":["B-ALL"],"text":"KMT2A rearrangement defines an ICC B-ALL subtype with recurrent genetic abnormality."},{"id":"arber-2022-blood-140-1200-C0207","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["ETV6","RUNX1"],"diseases":["B-ALL"],"text":"ETV6::RUNX1 defines an ICC B-ALL subtype with recurrent genetic abnormality."},{"id":"arber-2022-blood-140-1200-C0208","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["IL3","IGH"],"diseases":["B-ALL"],"text":"IL3::IGH defines an ICC B-ALL subtype with recurrent genetic abnormality."},{"id":"arber-2022-blood-140-1200-C0209","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["TCF3","PBX1"],"diseases":["B-ALL"],"text":"TCF3::PBX1 defines an ICC B-ALL subtype with recurrent genetic abnormality."},{"id":"arber-2022-blood-140-1200-C0210","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["ABL1"],"diseases":["B-ALL"],"text":"BCR::ABL1-like B-ALL with an ABL1-class rearrangement is recognized as an ICC subtype."},{"id":"arber-2022-blood-140-1200-C0211","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["B-ALL"],"text":"B-ALL with iAMP21 is recognized as an ICC subtype."},{"id":"arber-2022-blood-140-1200-C0212","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["ZEB2","CEBPE"],"diseases":["B-ALL"],"text":"B-ALL with mutated ZEB2 p.H1038R/IGH::CEBPE is listed as a provisional ICC entity."},{"id":"arber-2022-blood-140-1200-C0213","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["ZNF384"],"diseases":["B-ALL"],"text":"B-ALL with a ZNF384-rearranged-like expression profile is listed as a provisional ICC entity."},{"id":"arber-2022-blood-140-1200-C0214","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["KMT2A"],"diseases":["B-ALL"],"text":"B-ALL with a KMT2A-rearranged-like expression profile is listed as a provisional ICC entity."},{"id":"barbui-2015-blood-cancer-journal-5-e369-C0001","paper":"barbui-2015-blood-cancer-journal-5-e369","category":"prognosis","tier":"restated secondary","genes":["CALR"],"diseases":["ET"],"text":"In ET, CALR mutation was reported not to further modify prediction of future vascular events by IPSET-thrombosis."},{"id":"barbui-2015-blood-cancer-journal-5-e369-C0002","paper":"barbui-2015-blood-cancer-journal-5-e369","category":"prognosis","tier":"univariable or descriptive","genes":["JAK2"],"diseases":["ET"],"text":"In conventionally assigned low-risk ET, JAK2 mutation without cardiovascular risk factors was associated with a higher annual thrombosis rate than absence of both JAK2 mutation and cardiovascular risk factors (1.59% vs 0.44% patients/year; P=0.001)."},{"id":"barbui-2015-blood-cancer-journal-5-e369-C0003","paper":"barbui-2015-blood-cancer-journal-5-e369","category":"prognosis","tier":"univariable or descriptive","genes":["JAK2"],"diseases":["ET"],"text":"In conventionally assigned low-risk JAK2-unmutated ET, cardiovascular risk factors alone did not significantly increase thrombosis compared with absence of both factors (1.05% vs 0.44% patients/year; P=NS)."},{"id":"barbui-2015-blood-cancer-journal-5-e369-C0004","paper":"barbui-2015-blood-cancer-journal-5-e369","category":"prognosis","tier":"univariable or descriptive","genes":["JAK2"],"diseases":["ET"],"text":"In conventionally assigned low-risk JAK2-mutated ET, concomitant cardiovascular risk factors did not significantly increase thrombosis compared with JAK2 mutation alone (P=0.217)."},{"id":"barbui-2015-blood-cancer-journal-5-e369-C0005","paper":"barbui-2015-blood-cancer-journal-5-e369","category":"prognosis","tier":"univariable or descriptive","genes":["JAK2"],"diseases":["ET"],"text":"In conventionally assigned high-risk ET, patients with both JAK2 mutation and cardiovascular risk factors had higher thrombosis risk than patients with neither factor (4.17% vs 1.44% patients/year; P=0.011)."},{"id":"barbui-2015-blood-cancer-journal-5-e369-C0006","paper":"barbui-2015-blood-cancer-journal-5-e369","category":"prognosis","tier":"univariable or descriptive","genes":["JAK2"],"diseases":["ET"],"text":"In conventionally high-risk ET defined by a history of thrombosis, JAK2 mutation and/or cardiovascular risk factors provided only limited, non-significant additional thrombosis-risk enhancement, regardless of age."},{"id":"barbui-2015-blood-cancer-journal-5-e369-C0007","paper":"barbui-2015-blood-cancer-journal-5-e369","category":"prognosis","tier":"univariable or descriptive","genes":["JAK2"],"diseases":["ET"],"text":"In conventionally high-risk ET defined by age alone, JAK2 mutation with or without cardiovascular risk factors might increase thrombosis risk (P=0.05)."},{"id":"barbui-2015-blood-cancer-journal-5-e369-C0008","paper":"barbui-2015-blood-cancer-journal-5-e369","category":"prognosis","tier":"univariable or descriptive","genes":["JAK2"],"diseases":["ET"],"text":"In the revised ET thrombosis classification, very-low-risk disease is defined by no thrombosis history, age ≤60 years, and unmutated JAK2."},{"id":"barbui-2015-blood-cancer-journal-5-e369-C0009","paper":"barbui-2015-blood-cancer-journal-5-e369","category":"prognosis","tier":"univariable or descriptive","genes":["JAK2"],"diseases":["ET"],"text":"In the revised ET thrombosis classification, low-risk disease is defined by no thrombosis history, age ≤60 years, and mutated JAK2."},{"id":"barbui-2015-blood-cancer-journal-5-e369-C0010","paper":"barbui-2015-blood-cancer-journal-5-e369","category":"prognosis","tier":"univariable or descriptive","genes":["JAK2"],"diseases":["ET"],"text":"In the revised ET thrombosis classification, intermediate-risk disease is defined by no thrombosis history, age >60 years, and unmutated JAK2."},{"id":"barbui-2015-blood-cancer-journal-5-e369-C0011","paper":"barbui-2015-blood-cancer-journal-5-e369","category":"prognosis","tier":"univariable or descriptive","genes":["JAK2"],"diseases":["ET"],"text":"In the revised ET thrombosis classification, high-risk disease is defined by a history of thrombosis or by age >60 years together with JAK2 mutation."},{"id":"barbui-2015-blood-cancer-journal-5-e369-C0012","paper":"barbui-2015-blood-cancer-journal-5-e369","category":"treatment","tier":"univariable or descriptive","genes":["JAK2"],"diseases":["ET"],"text":"For revised very-low-risk ET (no thrombosis history, age ≤60 years, JAK2-unmutated) without cardiovascular risk factors, the authors would not insist on aspirin; they state that these treatment recommendations require prospective controlled-study evaluation."},{"id":"barbui-2015-blood-cancer-journal-5-e369-C0013","paper":"barbui-2015-blood-cancer-journal-5-e369","category":"treatment","tier":"univariable or descriptive","genes":["JAK2"],"diseases":["ET"],"text":"For revised very-low-risk ET (no thrombosis history, age ≤60 years, JAK2-unmutated) with cardiovascular risk factors, the authors advise once-daily aspirin; they state that these treatment recommendations require prospective controlled-study evaluation."},{"id":"barbui-2015-blood-cancer-journal-5-e369-C0014","paper":"barbui-2015-blood-cancer-journal-5-e369","category":"treatment","tier":"univariable or descriptive","genes":["JAK2"],"diseases":["ET"],"text":"For revised low-risk JAK2-mutated ET, twice-daily aspirin is considered reasonable but not mandated, especially when cardiovascular risk factors are present; the recommendation is pending prospective controlled-study evaluation."},{"id":"barbui-2015-blood-cancer-journal-5-e369-C0015","paper":"barbui-2015-blood-cancer-journal-5-e369","category":"treatment","tier":"univariable or descriptive","genes":["JAK2"],"diseases":["ET"],"text":"For revised intermediate-risk ET (no thrombosis history, age >60 years, JAK2-unmutated), the authors encourage cytoreductive therapy but would not insist on it; twice-daily aspirin may be used instead, pending prospective controlled-study evaluation."},{"id":"barbui-2015-blood-cancer-journal-5-e369-C0016","paper":"barbui-2015-blood-cancer-journal-5-e369","category":"treatment","tier":"univariable or descriptive","genes":["JAK2"],"diseases":["ET"],"text":"For revised high-risk ET (history of thrombosis, or age >60 years with JAK2 mutation), the authors encourage cytoreductive therapy, pending prospective controlled-study evaluation."},{"id":"cloos-2026-blood-147-1147-C0001","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["NPM1"],"diseases":["AML"],"text":"In NPM1-mutated AML after 2 chemotherapy cycles, MRD positivity is formally interpreted in peripheral blood rather than bone marrow; a positive peripheral-blood result is a warning response, not high risk of treatment failure, because the postremission transplant-versus-consolidation decision remains uncertain."},{"id":"cloos-2026-blood-147-1147-C0002","paper":"cloos-2026-blood-147-1147","category":"prognosis","tier":"guideline criterion","genes":["NPM1"],"diseases":["AML"],"text":"For NPM1-mutated AML at end of treatment, 0.1% NPM1/ABL1 in bone marrow is the guideline MRD-positivity threshold with demonstrated prognostic significance; levels around 2% are typically close to hematologic relapse and may leave insufficient time for preemptive escalation."},{"id":"cloos-2026-blood-147-1147-C0003","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["NPM1"],"diseases":["AML"],"text":"During follow-up of NPM1-mutated AML, conversion to detectable peripheral-blood NPM1 MRD at ≥0.01% defines MRD relapse. If MRD was never negative, a ≥1-log10 rise from the nadir in the same tissue defines relapse; qPCR relapse should be confirmed within 4 weeks, preferably in paired blood and marrow."},{"id":"cloos-2026-blood-147-1147-C0004","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["NPM1"],"diseases":["AML"],"text":"During follow-up of NPM1-mutated AML, conversion to detectable bone-marrow NPM1 MRD at ≥0.1% defines MRD relapse. If MRD was never negative, a ≥1-log10 rise from the nadir in the same tissue defines relapse; confirmation within 4 weeks is preferred unless marrow NPM1/ABL1 is ≥1%."},{"id":"cloos-2026-blood-147-1147-C0005","paper":"cloos-2026-blood-147-1147","category":"prognosis","tier":"restated secondary","genes":["NPM1"],"diseases":["AML"],"text":"In NPM1-mutated AML, MRD relapse is strongly correlated with impending clinical relapse."},{"id":"cloos-2026-blood-147-1147-C0006","paper":"cloos-2026-blood-147-1147","category":"treatment","tier":"restated secondary","genes":["NPM1"],"diseases":["AML"],"text":"For NPM1-mutated AML at ELN-defined MRD relapse, evidence supports initiating antileukemic therapy before morphologic relapse as a feasible and effective preemptive strategy."},{"id":"cloos-2026-blood-147-1147-C0007","paper":"cloos-2026-blood-147-1147","category":"treatment","tier":"guideline criterion","genes":["NPM1"],"diseases":["AML"],"text":"For NPM1-mutated AML with MRD relapse, allogeneic hematopoietic cell transplantation should be strongly considered."},{"id":"cloos-2026-blood-147-1147-C0008","paper":"cloos-2026-blood-147-1147","category":"prognosis","tier":"guideline criterion","genes":["NPM1"],"diseases":["AML"],"text":"NPM1 qPCR MRD has prognostic value in AML treated with a hypomethylating agent plus venetoclax, although its clinical utility in this nonintensive setting remains under development."},{"id":"cloos-2026-blood-147-1147-C0009","paper":"cloos-2026-blood-147-1147","category":"prognosis","tier":"guideline criterion","genes":["NPM1"],"diseases":["AML"],"text":"For NPM1-mutated AML, persistence of mutated NPM1 at VAF ≥0.01% in genomic DNA from peripheral blood or bone marrow may identify increased risk of relapse and mortality; this use requires further validation."},{"id":"cloos-2026-blood-147-1147-C0010","paper":"cloos-2026-blood-147-1147","category":"prognosis","tier":"restated secondary","genes":["NPM1","FLT3"],"diseases":["AML"],"text":"In AML with both NPM1 mutation and FLT3-ITD, persistence of MRD by either NPM1 qPCR or FLT3-ITD UHS-NGS is associated with increased risk compared with testing negative."},{"id":"cloos-2026-blood-147-1147-C0011","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["NPM1","FLT3"],"diseases":["AML"],"text":"In AML with both NPM1 mutation and FLT3-ITD, NPM1 MRD can serve as the stand-alone molecular MRD marker when FLT3-ITD UHS-NGS is unavailable."},{"id":"cloos-2026-blood-147-1147-C0012","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["FLT3"],"diseases":["AML"],"text":"For FLT3-ITD AML, UHS-NGS MRD assessment is strongly supported after two treatment cycles and before alloHCT."},{"id":"cloos-2026-blood-147-1147-C0013","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["FLT3"],"diseases":["AML"],"text":"For FLT3-ITD AML, UHS-NGS MRD monitoring at end of treatment and during follow-up is recommended on the basis of expert consensus and more limited evidence."},{"id":"cloos-2026-blood-147-1147-C0014","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["FLT3"],"diseases":["AML"],"text":"For FLT3-ITD AML by UHS-NGS, MRD positivity is defined as a level greater than the assay limit of detection; the guideline states that assay sensitivity must reach at least 0.01%."},{"id":"cloos-2026-blood-147-1147-C0015","paper":"cloos-2026-blood-147-1147","category":"prognosis","tier":"guideline criterion","genes":["FLT3"],"diseases":["AML"],"text":"In FLT3-ITD AML after two intensive-chemotherapy cycles or before alloHCT, UHS-NGS MRD at or above the assay LOD is MRD positive and classified as high risk of treatment failure; bone marrow is preferred over peripheral blood."},{"id":"cloos-2026-blood-147-1147-C0016","paper":"cloos-2026-blood-147-1147","category":"prognosis","tier":"guideline criterion","genes":["FLT3"],"diseases":["AML"],"text":"In FLT3-ITD–mutated AML at end of treatment, UHS-NGS MRD at or above the assay limit of detection is classified as MRD positive and high risk of treatment failure; bone marrow is preferred over peripheral blood. The guideline notes that evidence for FLT3-ITD UHS-NGS at EOT is limited and states that the LOD must be at least 0.01% VAF."},{"id":"cloos-2026-blood-147-1147-C0017","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["FLT3"],"diseases":["AML"],"text":"During follow-up of FLT3-ITD AML, UHS-NGS MRD at or above the assay LOD defines MRD relapse in peripheral blood or bone marrow. Repeat confirmation may be omitted because relapse can be imminent, but low-level results from the LOD to <0.01% VAF should be promptly repeated, especially for a clone differing from diagnosis."},{"id":"cloos-2026-blood-147-1147-C0018","paper":"cloos-2026-blood-147-1147","category":"prognosis","tier":"guideline criterion","genes":["FLT3"],"diseases":["AML"],"text":"FLT3-ITD UHS-NGS MRD identifies AML patients at increased risk of relapse and death."},{"id":"cloos-2026-blood-147-1147-C0019","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["FLT3"],"diseases":["AML"],"text":"During follow-up of FLT3-ITD AML, FLT3-ITD should not be used as the sole MRD marker when another marker is available because relapse can occur without FLT3-ITD."},{"id":"cloos-2026-blood-147-1147-C0020","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["FLT3"],"diseases":["AML"],"text":"When multiple FLT3-ITD clones are detected by UHS-NGS MRD testing, report the VAF and sequence of each clone; use the major clone to determine MRD level and also report the summed VAF if possible."},{"id":"cloos-2026-blood-147-1147-C0021","paper":"cloos-2026-blood-147-1147","category":"treatment","tier":"guideline criterion","genes":["FLT3"],"diseases":["AML"],"text":"In FLT3-mutated AML after alloHCT, sorafenib maintenance is effective independent of pretransplant MFC-MRD status."},{"id":"cloos-2026-blood-147-1147-C0022","paper":"cloos-2026-blood-147-1147","category":"treatment","tier":"guideline criterion","genes":["FLT3","NPM1"],"diseases":["AML"],"text":"In FLT3-ITD AML, post-alloHCT gilteritinib is recommended for patients with UHS-NGS MRD positivity before transplant or around day 30 after transplant; the reported benefit was especially evident with one FLT3-ITD clone and co-mutated NPM1."},{"id":"cloos-2026-blood-147-1147-C0023","paper":"cloos-2026-blood-147-1147","category":"treatment","tier":"restated secondary","genes":["FLT3"],"diseases":["AML"],"text":"In FLT3-mutated AML, quizartinib maintenance following intensive chemotherapy appears effective irrespective of MRD status; post-alloHCT maintenance data remain limited, and initiation of maintenance has not been assessed in a randomized trial."},{"id":"cloos-2026-blood-147-1147-C0024","paper":"cloos-2026-blood-147-1147","category":"treatment","tier":"guideline criterion","genes":["FLT3"],"diseases":["AML"],"text":"For AML patients receiving standard-of-care FLT3-inhibitor maintenance, evidence is very limited to support stopping treatment on the basis of MRD results."},{"id":"cloos-2026-blood-147-1147-C0025","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["RUNX1","RUNX1T1","CBFB","MYH11"],"diseases":["AML"],"text":"For core-binding-factor AML with RUNX1::RUNX1T1 or CBFB::MYH11, a ≥3-log reduction from diagnostic baseline is recommended to stratify relapse risk; log reduction should use the same tissue, bone marrow is preferred, and the diagnostic transcript level must be established."},{"id":"cloos-2026-blood-147-1147-C0026","paper":"cloos-2026-blood-147-1147","category":"prognosis","tier":"guideline criterion","genes":["RUNX1","RUNX1T1","CBFB","MYH11"],"diseases":["AML"],"text":"For core-binding-factor AML after two intensive-chemotherapy cycles or before alloHCT, <3-log10 reduction of RUNX1::RUNX1T1 or CBFB::MYH11 transcript from diagnosis is MRD positive and classified as a warning response."},{"id":"cloos-2026-blood-147-1147-C0027","paper":"cloos-2026-blood-147-1147","category":"prognosis","tier":"guideline criterion","genes":["RUNX1","RUNX1T1","CBFB","MYH11"],"diseases":["AML"],"text":"For core-binding-factor AML at end of treatment, <3-log10 reduction of RUNX1::RUNX1T1 or CBFB::MYH11 transcript from diagnosis is MRD positive and classified as high risk of treatment failure."},{"id":"cloos-2026-blood-147-1147-C0028","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["RUNX1","RUNX1T1","CBFB","MYH11"],"diseases":["AML"],"text":"During follow-up of core-binding-factor AML, conversion to detectable RUNX1::RUNX1T1 or CBFB::MYH11 transcript at ≥0.1% defines MRD relapse in peripheral blood or bone marrow. If MRD was never negative, a ≥1-log10 rise from nadir in the same tissue defines relapse; qPCR relapse should be confirmed within 4 weeks."},{"id":"cloos-2026-blood-147-1147-C0029","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["RUNX1","RUNX1T1","CBFB","MYH11"],"diseases":["AML"],"text":"In core-binding-factor AML, low-level RUNX1::RUNX1T1 or CBFB::MYH11 positivity at end of treatment can persist in patients who never relapse and may arise from fusion-bearing mast cells; the MRD-relapse threshold was redefined to reduce overtreatment of such low-level positivity."},{"id":"cloos-2026-blood-147-1147-C0030","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["PML","RARA"],"diseases":["APL"],"text":"In acute promyelocytic leukemia, PML::RARA MRD monitoring is recommended at end of treatment rather than during ongoing therapy."},{"id":"cloos-2026-blood-147-1147-C0031","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["PML","RARA"],"diseases":["APL"],"text":"In acute promyelocytic leukemia, PML::RARA MRD positivity at end of treatment is a warning response rather than definitive treatment failure because stable low-level MRD may persist transiently."},{"id":"cloos-2026-blood-147-1147-C0032","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["PML","RARA"],"diseases":["APL"],"text":"For acute promyelocytic leukemia with PML::RARA MRD positivity at end of treatment, regular post-EOT MRD monitoring is advised to document stability or conversion to MRD negativity."},{"id":"cloos-2026-blood-147-1147-C0033","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["PML","RARA"],"diseases":["APL"],"text":"Routine PML::RARA MRD follow-up in acute promyelocytic leukemia is recommended only for high-risk patients who did not receive arsenic trioxide, reflecting the very low relapse risk after ATO-based regimens."},{"id":"cloos-2026-blood-147-1147-C0034","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["PML","RARA"],"diseases":["APL"],"text":"For PML::RARA MRD follow-up in acute promyelocytic leukemia, bone marrow is preferred over peripheral blood because peripheral blood typically becomes MRD positive almost concurrently with hematologic relapse and therefore has limited value for early detection."},{"id":"cloos-2026-blood-147-1147-C0035","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["PML","RARA"],"diseases":["APL"],"text":"During follow-up of acute promyelocytic leukemia, conversion to detectable bone-marrow PML::RARA at ≥0.001% defines MRD relapse. If MRD was never negative, a ≥1-log10 rise from nadir in the same tissue defines relapse; qPCR relapse should be confirmed within 4 weeks."},{"id":"cloos-2026-blood-147-1147-C0037","paper":"cloos-2026-blood-147-1147","category":"treatment","tier":"guideline criterion","genes":["KMT2A"],"diseases":["AML"],"text":"For KMT2A-rearranged AML, MRD assays are available or under development, but the role of clinical intervention for persistent fusion-gene MRD at specific thresholds and treatment time points remains unestablished."},{"id":"cloos-2026-blood-147-1147-C0038","paper":"cloos-2026-blood-147-1147","category":"germline","tier":"guideline criterion","genes":["ANKRD26","CEBPA","DDX41","ETV6","GATA2","RUNX1","TP53"],"diseases":["AML"],"text":"In AML remission after intensive chemotherapy and before alloHCT, variants in germline-predisposition genes such as ANKRD26, CEBPA, DDX41, ETV6, GATA2, RUNX1 and TP53 are not prognostic for MRD and should not be counted toward MRD status at those time points."},{"id":"cloos-2026-blood-147-1147-C0039","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["DNMT3A","TET2","ASXL1"],"diseases":["AML"],"text":"In AML remission after intensive chemotherapy and before alloHCT, age-related clonal-hematopoiesis variants in DNMT3A, TET2 and ASXL1 are not prognostic for MRD and should not be counted toward MRD status at those time points."},{"id":"cloos-2026-blood-147-1147-C0040","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["NPM1"],"diseases":["AML"],"text":"For NPM1-mutated AML after alloHCT, serial UHS-NGS monitoring using the diagnostic NPM1 marker is an implemented example of posttransplant molecular MRD surveillance; the guideline states that this serial diagnostic-marker approach correlates with impending relapse and that broader gene use requires rigorous validation."},{"id":"cloos-2026-blood-147-1147-C0041","paper":"cloos-2026-blood-147-1147","category":"prognosis","tier":"restated secondary","genes":["TP53","IDH1","CEBPA"],"diseases":["AML"],"text":"For AML at the selected pre-alloHCT time points reviewed in this guideline, residual TP53, IDH1 or bZIP-mutated CEBPA detected by UHS-NGS did not show a prognostic effect."},{"id":"cloos-2026-blood-147-1147-C0042","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["NPM1","FLT3","PML","RARA","RUNX1","RUNX1T1","CBFB","MYH11","KMT2A","WT1","MECOM"],"diseases":["AML"],"text":"For AML molecular MRD, validated leukemia-specific assays targeting NPM1, FLT3-ITD, PML::RARA, RUNX1::RUNX1T1, CBFB::MYH11 or KMT2A rearrangements are preferred over less-specific WT1 or MECOM/EVI1 expression markers."},{"id":"cloos-2026-blood-147-1147-C0043","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["NPM1","FLT3","PML","RARA"],"diseases":["AML"],"text":"When monitoring a rare NPM1 variant, very large FLT3-ITD, or uncommon noncanonical PML::RARA transcript in AML, analyte detectability should first be confirmed at diagnosis with the intended MRD assay before longitudinal monitoring."},{"id":"cloos-2026-blood-147-1147-C0044","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["FLT3"],"diseases":["AML"],"text":"For FLT3-ITD AML monitored by UHS-NGS, no warning category is defined at any time because current evidence does not support a safe or stable low-level MRD range."},{"id":"cloos-2026-blood-147-1147-C0045","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["PML","RARA"],"diseases":["APL"],"text":"For PML::RARA in acute promyelocytic leukemia during follow-up, no warning category is defined because current evidence does not support a safe or stable low-level MRD range during follow-up."},{"id":"cloos-2026-blood-147-1147-C0046","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["NPM1"],"diseases":["AML"],"text":"In NPM1-mutated AML, MRD levels are approximately tenfold higher in bone marrow than peripheral blood, so tissue-specific positivity thresholds are used; MRD negativity is defined as <0.001% NPM1/ABL1 or meeting the qualitative undetectable criterion with adequate ABL1 copies in either tissue."},{"id":"cloos-2026-blood-147-1147-C0047","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["CEBPA"],"diseases":["AML"],"text":"For CEBPA bZIP in-frame AML after two cycles of intensive chemotherapy, the guideline notes evidence favoring MFC-MRD over molecular MRD; prognostic use at end of treatment and during follow-up still requires further study."},{"id":"d-hner-2022-blood-140-1345-C0001","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"guideline criterion","genes":["PML","RARA","RUNX1","RUNX1T1","CBFB","MYH11","MLLT3","KMT2A","DEK","NUP214","GATA2","MECOM","PRDM16","RPN1","RBM15","MRTFA","NPM1","MLF1","NUP98","NSD1","ETV6","MNX1","KAT6A","CREBBP","PICALM","MLLT10","KMD5A","FUS","ERG","CBFA2T3","GLIS2","CEBPA","BCR","ABL1"],"diseases":["AML"],"text":"AML can be diagnosed with ≥10% blasts in blood or bone marrow in the presence of recurrent genetic abnormalities, which include: PML::RARA; RUNX1::RUNX1T1; CBFB::MYH11; MLLT3::KMT2A or another KMT2A rearrangement; DEK::NUP214; GATA2/MECOM or another MECOM rearrangement; PRDM16::RPN1; RBM15::MRTFA; NPM1::MLF1; NUP98::NSD1; ETV6::MNX1; KAT6A::CREBBP; PICALM::MLLT10; NUP98::KMD5A or another NUP98 rearrangement; FUS::ERG; RUNX1::CBFA2T3; CBFA2T3::GLIS2; mutated NPM1; or an in-frame bZIP CEBPA mutation. AML with BCR::ABL1 remains an exception and requires ≥20% blasts."},{"id":"d-hner-2022-blood-140-1345-C0002","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"guideline criterion","genes":["BCR","ABL1"],"diseases":["AML"],"text":"AML with BCR::ABL1 requires at least 20% blasts in bone marrow or blood to avoid overlap with accelerated-phase CML."},{"id":"d-hner-2022-blood-140-1345-C0003","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["MDS/AML"],"text":"Cases with defined genomic abnormalities and 10% to 19% blasts may be classified as MDS/AML; other non-recurrent-genetic AML subtypes require at least 20% blasts."},{"id":"d-hner-2022-blood-140-1345-C0004","paper":"d-hner-2022-blood-140-1345","category":"treatment","tier":"guideline criterion","genes":[],"diseases":["MDS/AML"],"text":"Patients classified as MDS/AML should be eligible for either MDS or AML clinical trials and treatment approaches."},{"id":"d-hner-2022-blood-140-1345-C0005","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"guideline criterion","genes":["CEBPA"],"diseases":["AML"],"text":"An in-frame mutation affecting the CEBPA bZIP region defines the CEBPA-mutated AML subtype whether monoallelic or biallelic."},{"id":"d-hner-2022-blood-140-1345-C0006","paper":"d-hner-2022-blood-140-1345","category":"prognosis","tier":"guideline criterion","genes":["CEBPA"],"diseases":["AML"],"text":"In-frame CEBPA bZIP mutations are associated with favorable outcome irrespective of monoallelic or biallelic occurrence."},{"id":"d-hner-2022-blood-140-1345-C0007","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"guideline criterion","genes":["TP53"],"diseases":["AML"],"text":"A pathogenic TP53 mutation with variant allele fraction of at least 10%, with or without loss of the wild-type allele, defines AML with mutated TP53."},{"id":"d-hner-2022-blood-140-1345-C0008","paper":"d-hner-2022-blood-140-1345","category":"prognosis","tier":"restated secondary","genes":["TP53"],"diseases":["AML","MDS"],"text":"TP53-mutant AML and MDS are associated with a very poor prognosis."},{"id":"d-hner-2022-blood-140-1345-C0009","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"guideline criterion","genes":["ASXL1","BCOR","EZH2","RUNX1","SF3B1","SRSF2","STAG2","U2AF1","ZRSR2"],"diseases":["AML"],"text":"In the absence of TP53 mutation, mutations in ASXL1, BCOR, EZH2, RUNX1, SF3B1, SRSF2, STAG2, U2AF1, and/or ZRSR2 define AML with myelodysplasia-related gene mutations irrespective of prior MDS."},{"id":"d-hner-2022-blood-140-1345-C0010","paper":"d-hner-2022-blood-140-1345","category":"prognosis","tier":"restated secondary","genes":["ASXL1","BCOR","EZH2","RUNX1","SF3B1","SRSF2","STAG2","U2AF1","ZRSR2"],"diseases":["AML"],"text":"Myelodysplasia-related gene mutations in ASXL1, BCOR, EZH2, RUNX1, SF3B1, SRSF2, STAG2, U2AF1, and/or ZRSR2 confer adverse prognosis even in de novo AML."},{"id":"d-hner-2022-blood-140-1345-C0011","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"guideline criterion","genes":["TP53","ASXL1","BCOR","EZH2","RUNX1","SF3B1","SRSF2","STAG2","U2AF1","ZRSR2"],"diseases":["AML"],"text":"AML with recurrent genetic abnormalities takes precedence over all other AML categories. Among the remaining categories, AML with mutated TP53 takes precedence over AML with myelodysplasia-related gene mutations, which takes precedence over AML with myelodysplasia-related cytogenetic abnormalities. AML with myelodysplasia-related cytogenetic abnormalities is defined, in the absence of higher-priority AML-defining categories, by a qualifying complex karyotype or del(5q)/t(5q)/add(5q), −7/del(7q), +8, del(12p)/t(12p)/add(12p), i(17q), −17/add(17p)/del(17p), del(20q), and/or idic(X)(q13)."},{"id":"d-hner-2022-blood-140-1345-C0012","paper":"d-hner-2022-blood-140-1345","category":"germline","tier":"guideline criterion","genes":["DDX41"],"diseases":[],"text":"Germline predisposition should be considered in patients with hematopoietic malignancy regardless of age; DDX41 predisposition alleles can present at older ages."},{"id":"d-hner-2022-blood-140-1345-C0013","paper":"d-hner-2022-blood-140-1345","category":"treatment","tier":"guideline criterion","genes":[],"diseases":["AML"],"text":"Because allogeneic HCT and related-donor selection may be relevant in AML, germline risk-allele testing should be performed as early as possible during clinical management."},{"id":"d-hner-2022-blood-140-1345-C0014","paper":"d-hner-2022-blood-140-1345","category":"biomarker","tier":"guideline criterion","genes":["RUNX1","RUNX1T1","CBFB","MYH11","KMT2A","MECOM"],"diseases":["AML"],"text":"If conventional cytogenetics fails, FISH is an alternative for detecting RUNX1::RUNX1T1, CBFB::MYH11, KMT2A, and MECOM fusions and selected myelodysplasia-related chromosome abnormalities."},{"id":"d-hner-2022-blood-140-1345-C0015","paper":"d-hner-2022-blood-140-1345","category":"biomarker","tier":"guideline criterion","genes":["NPM1","CBFB","MYH11","RUNX1","RUNX1T1"],"diseases":["AML"],"text":"In NPM1-mutant and core-binding-factor AML, baseline qPCR or dPCR molecular assessment is recommended to enable subsequent MRD monitoring."},{"id":"d-hner-2022-blood-140-1345-C0016","paper":"d-hner-2022-blood-140-1345","category":"prognosis","tier":"guideline criterion","genes":["NPM1"],"diseases":["AML"],"text":"MRD response can modify initial ELN risk assignment during therapy, particularly in NPM1-mutated AML."},{"id":"d-hner-2022-blood-140-1345-C0017","paper":"d-hner-2022-blood-140-1345","category":"prognosis","tier":"guideline criterion","genes":["FLT3","NPM1"],"diseases":["AML"],"text":"FLT3-ITD AML without adverse-risk genetic lesions is intermediate risk irrespective of FLT3-ITD allelic ratio or concurrent NPM1 mutation; the allelic ratio is no longer used for ELN risk classification."},{"id":"d-hner-2022-blood-140-1345-C0018","paper":"d-hner-2022-blood-140-1345","category":"prognosis","tier":"guideline criterion","genes":["ASXL1","BCOR","EZH2","RUNX1","SF3B1","SRSF2","STAG2","U2AF1","ZRSR2"],"diseases":["AML"],"text":"AML with pathogenic ASXL1, BCOR, EZH2, RUNX1, SF3B1, SRSF2, STAG2, U2AF1, or ZRSR2 mutations is categorized as adverse risk."},{"id":"d-hner-2022-blood-140-1345-C0019","paper":"d-hner-2022-blood-140-1345","category":"prognosis","tier":"guideline criterion","genes":["NPM1"],"diseases":["AML"],"text":"NPM1-mutated AML with adverse-risk cytogenetic abnormalities is categorized as adverse risk."},{"id":"d-hner-2022-blood-140-1345-C0020","paper":"d-hner-2022-blood-140-1345","category":"prognosis","tier":"guideline criterion","genes":["CEBPA"],"diseases":["AML"],"text":"In-frame CEBPA bZIP mutations are categorized as favorable risk irrespective of whether they are monoallelic or biallelic."},{"id":"d-hner-2022-blood-140-1345-C0021","paper":"d-hner-2022-blood-140-1345","category":"prognosis","tier":"guideline criterion","genes":["MECOM"],"diseases":["AML"],"text":"MECOM rearrangements involving t(3q26.2;v) are included in the adverse-risk group."},{"id":"d-hner-2022-blood-140-1345-C0022","paper":"d-hner-2022-blood-140-1345","category":"prognosis","tier":"guideline criterion","genes":["KAT6A","CREBBP"],"diseases":["AML"],"text":"KAT6A::CREBBP t(8;16) is included in the adverse-risk group."},{"id":"d-hner-2022-blood-140-1345-C0023","paper":"d-hner-2022-blood-140-1345","category":"prognosis","tier":"guideline criterion","genes":["IDH1","IDH2","DNMT3A"],"diseases":["AML"],"text":"Current evidence does not assign IDH1, IDH2, or DNMT3A mutations to a distinct ELN prognostic group."},{"id":"d-hner-2022-blood-140-1345-C0024","paper":"d-hner-2022-blood-140-1345","category":"biomarker","tier":"guideline criterion","genes":["NPM1","CBFB","MYH11","RUNX1","RUNX1T1"],"diseases":["AML"],"text":"Mutated NPM1, CBFB::MYH11, and RUNX1::RUNX1T1 are robustly validated molecular targets for qPCR-based MRD monitoring in AML."},{"id":"d-hner-2022-blood-140-1345-C0025","paper":"d-hner-2022-blood-140-1345","category":"biomarker","tier":"guideline criterion","genes":["DNMT3A","TET2","ASXL1"],"diseases":["AML"],"text":"DNMT3A, TET2, and ASXL1 mutations consistent with premalignant clonal hematopoiesis should not be considered AML MRD."},{"id":"d-hner-2022-blood-140-1345-C0026","paper":"d-hner-2022-blood-140-1345","category":"prognosis","tier":"guideline criterion","genes":["NPM1","CBFB","MYH11","RUNX1","RUNX1T1"],"diseases":["AML"],"text":"Persistent low-level molecular MRD in NPM1-mutated or core-binding-factor AML can occur after treatment without being prognostic of relapse when below the prognosis-linked threshold."},{"id":"d-hner-2022-blood-140-1345-C0027","paper":"d-hner-2022-blood-140-1345","category":"treatment","tier":"guideline criterion","genes":["FLT3"],"diseases":["AML"],"text":"Midostaurin incorporated into first-line intensive induction and consolidation is standard therapy for FLT3-mutant AML."},{"id":"d-hner-2022-blood-140-1345-C0028","paper":"d-hner-2022-blood-140-1345","category":"treatment","tier":"restated secondary","genes":["IDH1"],"diseases":["AML"],"text":"For newly diagnosed patients with IDH1-mutated AML who are not considered candidates for intensive therapy, ivosidenib plus azacitidine improves event-free survival, clinical response, and overall survival compared with azacitidine plus placebo."},{"id":"d-hner-2022-blood-140-1345-C0029","paper":"d-hner-2022-blood-140-1345","category":"biomarker","tier":"guideline criterion","genes":["IDH1"],"diseases":["AML"],"text":"Rapid IDH1 mutation screening is recommended at initial diagnosis in older AML patients to identify candidates for ivosidenib."},{"id":"d-hner-2022-blood-140-1345-C0030","paper":"d-hner-2022-blood-140-1345","category":"biomarker","tier":"guideline criterion","genes":["IDH1","IDH2","FLT3"],"diseases":["AML"],"text":"At AML progression, molecular re-evaluation is important because new IDH1/IDH2 mutations or new or expanded FLT3-ITD or FLT3-TKD clones may emerge and identify targeted salvage options."},{"id":"d-hner-2022-blood-140-1345-C0031","paper":"d-hner-2022-blood-140-1345","category":"treatment","tier":"guideline criterion","genes":["FLT3"],"diseases":["AML"],"text":"Gilteritinib is an approved salvage option for relapsed/refractory FLT3-mutated AML and improved response and overall survival versus salvage chemotherapy in the cited randomized trial."},{"id":"d-hner-2022-blood-140-1345-C0032","paper":"d-hner-2022-blood-140-1345","category":"treatment","tier":"guideline criterion","genes":["IDH1","IDH2"],"diseases":["AML"],"text":"Ivosidenib or enasidenib is a salvage option for relapsed/refractory IDH1- or IDH2-mutated AML."},{"id":"d-hner-2022-blood-140-1345-C0033","paper":"d-hner-2022-blood-140-1345","category":"treatment","tier":"guideline criterion","genes":["FLT3"],"diseases":["AML"],"text":"After allogeneic HCT for FLT3-mutated AML, sorafenib maintenance reduces relapse risk and supports FLT3-inhibitor maintenance as a reasonable option."},{"id":"d-hner-2022-blood-140-1345-C0034","paper":"d-hner-2022-blood-140-1345","category":"treatment","tier":"guideline criterion","genes":["KMT2A","NPM1"],"diseases":["AML"],"text":"Menin inhibitors are under clinical evaluation for AML with KMT2A rearrangements or NPM1 mutations."},{"id":"d-hner-2022-blood-140-1345-C0035","paper":"d-hner-2022-blood-140-1345","category":"treatment","tier":"guideline criterion","genes":["IDH1","IDH2"],"diseases":["AML"],"text":"Patients receiving IDH inhibitors require close monitoring for differentiation syndrome."},{"id":"d-hner-2022-blood-140-1345-C0036","paper":"d-hner-2022-blood-140-1345","category":"treatment","tier":"guideline criterion","genes":["RUNX1","CEBPA"],"diseases":["AML"],"text":"Hematopoietic donor stem cells from carriers of deleterious RUNX1 or CEBPA variants should not be used."},{"id":"d-hner-2024-blood-144-2169-C0001","paper":"d-hner-2024-blood-144-2169","category":"prognosis","tier":"guideline criterion","genes":["NPM1","FLT3","NRAS","KRAS","TP53"],"diseases":["AML"],"text":"Under the 2024 ELN Less-Intensive classification, NPM1-mutated AML is favorable risk when FLT3-ITD is negative and NRAS, KRAS, and TP53 are wild type."},{"id":"d-hner-2024-blood-144-2169-C0002","paper":"d-hner-2024-blood-144-2169","category":"prognosis","tier":"guideline criterion","genes":["IDH2","FLT3","NRAS","KRAS","TP53"],"diseases":["AML"],"text":"Under the 2024 ELN Less-Intensive classification, IDH2-mutated AML is favorable risk when FLT3-ITD is negative and NRAS, KRAS, and TP53 are wild type."},{"id":"d-hner-2024-blood-144-2169-C0003","paper":"d-hner-2024-blood-144-2169","category":"prognosis","tier":"guideline criterion","genes":["IDH1","TP53"],"diseases":["AML"],"text":"Under the 2024 ELN Less-Intensive classification, TP53-wild-type IDH1-mutated AML is favorable risk specifically with azacitidine plus ivosidenib; this favorable assignment applies irrespective of activating signaling-gene mutations."},{"id":"d-hner-2024-blood-144-2169-C0004","paper":"d-hner-2024-blood-144-2169","category":"prognosis","tier":"guideline criterion","genes":["DDX41"],"diseases":["AML"],"text":"Under the 2024 ELN Less-Intensive classification, DDX41-mutated AML is favorable risk."},{"id":"d-hner-2024-blood-144-2169-C0005","paper":"d-hner-2024-blood-144-2169","category":"prognosis","tier":"guideline criterion","genes":["FLT3","NRAS","KRAS","TP53"],"diseases":["AML"],"text":"For other cytogenetic and/or molecular abnormalities, the 2024 ELN Less-Intensive classification tentatively assigns favorable risk when FLT3-ITD is negative and NRAS, KRAS, and TP53 are wild type; data are unavailable for many such abnormalities."},{"id":"d-hner-2024-blood-144-2169-C0006","paper":"d-hner-2024-blood-144-2169","category":"prognosis","tier":"guideline criterion","genes":["FLT3","NRAS","KRAS","TP53"],"diseases":["AML"],"text":"For other cytogenetic and molecular abnormalities, the 2024 ELN Less-Intensive classification tentatively assigns intermediate risk when FLT3-ITD and/or NRAS/KRAS mutation is present and TP53 is wild type; data are unavailable for many such abnormalities."},{"id":"d-hner-2024-blood-144-2169-C0007","paper":"d-hner-2024-blood-144-2169","category":"prognosis","tier":"guideline criterion","genes":["TP53"],"diseases":["AML"],"text":"Under the 2024 ELN Less-Intensive classification, TP53-mutated AML is adverse risk."},{"id":"d-hner-2024-blood-144-2169-C0008","paper":"d-hner-2024-blood-144-2169","category":"germline","tier":"guideline criterion","genes":["DDX41"],"diseases":[],"text":"A DDX41 mutation at near-heterozygous frequency should prompt consideration of a germline DDX41 mutation."},{"id":"d-hner-2024-blood-144-2169-C0009","paper":"d-hner-2024-blood-144-2169","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["AML"],"text":"Do not apply the 2024 ELN Less-Intensive classification to AML patients who have received prior HMA treatment."},{"id":"d-hner-2024-blood-144-2169-C0010","paper":"d-hner-2024-blood-144-2169","category":"prognosis","tier":"restated secondary","genes":["NPM1","FLT3","KRAS","NRAS"],"diseases":["AML"],"text":"In NPM1-mutated AML treated with HMA/VEN, co-occurring FLT3-ITD, KRAS, or NRAS mutations are associated with inferior prognosis; median OS was 39 months without these signaling mutations versus 9.9 months when one or more were present."},{"id":"d-hner-2024-blood-144-2169-C0011","paper":"d-hner-2024-blood-144-2169","category":"prognosis","tier":"restated secondary","genes":["IDH2","FLT3","KRAS","NRAS"],"diseases":["AML"],"text":"In IDH2-mutated AML treated with HMA/VEN, co-occurring activated signaling mutations are associated with inferior prognosis; median OS was 36.9 months without versus 12.2 months with an activated kinase pathogenic variant."},{"id":"d-hner-2024-blood-144-2169-C0012","paper":"d-hner-2024-blood-144-2169","category":"treatment","tier":"restated secondary","genes":["IDH1"],"diseases":["AML"],"text":"Azacitidine plus ivosidenib is a treatment standard for IDH1-mutated AML and improved overall survival versus azacitidine/placebo (24.0 vs 7.9 months) in the cited randomized phase 3 study."},{"id":"elena-2016-blood-128-1408-C0001","paper":"elena-2016-blood-128-1408","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["CMML"],"text":"In CMML, the FAB classification distinguishes myelodysplastic from myeloproliferative disease using a leukocyte-count threshold of 13 × 10^9/L (≤13 × 10^9/L vs >13 × 10^9/L, respectively)."},{"id":"elena-2016-blood-128-1408-C0002","paper":"elena-2016-blood-128-1408","category":"diagnosis","tier":"univariable or descriptive","genes":["JAK2","NRAS","SETBP1"],"diseases":["CMML"],"text":"In CMML, JAK2, NRAS, and SETBP1 mutations were significantly associated with the myeloproliferative subtype (CMML-MP)."},{"id":"elena-2016-blood-128-1408-C0003","paper":"elena-2016-blood-128-1408","category":"diagnosis","tier":"univariable or descriptive","genes":["TET2","SF3B1"],"diseases":["CMML"],"text":"In CMML, TET2 and SF3B1 mutations were significantly associated with the myelodysplastic subtype (CMML-MD; P=.007 and P=.03, respectively)."},{"id":"elena-2016-blood-128-1408-C0004","paper":"elena-2016-blood-128-1408","category":"prognosis","tier":"multivariable-adjusted","genes":["RUNX1","NRAS","SETBP1","ASXL1"],"diseases":["CMML"],"text":"In CMML, RUNX1, NRAS, SETBP1, and ASXL1 mutations each retained independent adverse prognostic value for overall survival in multivariable analysis (HR 2.32, 2.19, 2.00, and 1.77, respectively)."},{"id":"elena-2016-blood-128-1408-C0005","paper":"elena-2016-blood-128-1408","category":"prognosis","tier":"univariable or descriptive","genes":["EZH2"],"diseases":["CMML"],"text":"In CMML, EZH2 mutation was associated with worse overall survival in univariable analysis (HR 2.07, P=.023)."},{"id":"khoury-2022-leukemia-36-1703-C0001","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["CHIP"],"text":"CHIP is defined by a somatic mutation in a myeloid malignancy-associated gene detected in blood or marrow at VAF ≥2% (≥4% for X-linked mutations in males), in a person without a diagnosed haematologic disorder or unexplained cytopenia."},{"id":"khoury-2022-leukemia-36-1703-C0002","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["CCUS"],"text":"CCUS is CHIP accompanied by one or more persistent otherwise-unexplained cytopenias that do not meet diagnostic criteria for a defined myeloid neoplasm."},{"id":"khoury-2022-leukemia-36-1703-C0003","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["CCUS","MDS","MDS/MPN"],"text":"For CCUS, MDS and MDS/MPN, cytopenia thresholds are haemoglobin <13 g/dL in males or <12 g/dL in females, ANC <1.8 ×10^9/L, and platelets <150 ×10^9/L."},{"id":"khoury-2022-leukemia-36-1703-C0004","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["BCR","ABL1"],"diseases":["CML"],"text":"CML is defined by the BCR::ABL1 fusion resulting from t(9;22)(q34;q11)."},{"id":"khoury-2022-leukemia-36-1703-C0005","paper":"khoury-2022-leukemia-36-1703","category":"treatment","tier":"restated secondary","genes":["ABL1"],"diseases":["CML"],"text":"In CML, ABL1 kinase mutations are described as a source of TKI resistance and a key disease attribute in the current classification."},{"id":"khoury-2022-leukemia-36-1703-C0006","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["CML"],"text":"CML blast phase is defined by ≥20% myeloid blasts in blood or marrow, extramedullary blast proliferation, or increased lymphoblasts in blood or marrow; accelerated phase is omitted from WHO5."},{"id":"khoury-2022-leukemia-36-1703-C0007","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["JAK2"],"diseases":["PV"],"text":"Major PV diagnostic criteria include elevated haemoglobin and/or haematocrit, marrow panmyelosis with pleomorphic mature megakaryocytes, and JAK2 p.V617F or a JAK2 exon 12 mutation."},{"id":"khoury-2022-leukemia-36-1703-C0008","paper":"khoury-2022-leukemia-36-1703","category":"prognosis","tier":"restated secondary","genes":["EZH2","IDH1","IDH2","SRSF2","U2AF1","ASXL1"],"diseases":["PMF"],"text":"In PMF, mutations in EZH2, IDH1, IDH2, SRSF2, U2AF1 and ASXL1 are associated with poorer prognostic risk."},{"id":"khoury-2022-leukemia-36-1703-C0009","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["BCR","ABL1"],"diseases":["CNL"],"text":"CNL is a BCR::ABL1-negative MPN characterized by sustained neutrophilia with WBC ≥25 ×10^9/L and ≥80% segmented neutrophils/bands, neutrophilic marrow hypercellularity and hepatosplenomegaly."},{"id":"khoury-2022-leukemia-36-1703-C0010","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["CEL"],"text":"CEL is characterized by sustained clonal proliferation of morphologically abnormal eosinophils/eosinophil precursors causing persistent blood and marrow hypereosinophilia."},{"id":"khoury-2022-leukemia-36-1703-C0011","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["CEL"],"text":"For CEL, the interval required to define sustained hypereosinophilia is 4 weeks rather than 6 months."},{"id":"khoury-2022-leukemia-36-1703-C0012","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["CEL"],"text":"CEL requires both evidence of clonality and abnormal bone-marrow morphology, such as megakaryocytic or erythroid dysplasia."},{"id":"khoury-2022-leukemia-36-1703-C0013","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["CEL"],"text":"For CEL, increased blasts (≥2% in blood or 5–19% in marrow) are no longer an alternative to demonstrating clonality."},{"id":"khoury-2022-leukemia-36-1703-C0014","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["KMT2A"],"diseases":["JMML"],"text":"Updated JMML criteria require exclusion of KMT2A rearrangements."},{"id":"khoury-2022-leukemia-36-1703-C0015","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["JMML"],"text":"JMML diagnosis emphasizes molecular studies demonstrating RAS-pathway activation together with clinical and laboratory criteria."},{"id":"khoury-2022-leukemia-36-1703-C0016","paper":"khoury-2022-leukemia-36-1703","category":"prognosis","tier":"restated secondary","genes":["PTPN11"],"diseases":["JMML"],"text":"JMML initiated by somatic PTPN11 mutations is among the most aggressive genetic types."},{"id":"khoury-2022-leukemia-36-1703-C0017","paper":"khoury-2022-leukemia-36-1703","category":"germline","tier":"guideline criterion","genes":["CBL"],"diseases":["JMML"],"text":"A subset of JMML is associated with pathogenic germline CBL variants."},{"id":"khoury-2022-leukemia-36-1703-C0018","paper":"khoury-2022-leukemia-36-1703","category":"prognosis","tier":"restated secondary","genes":["CBL"],"diseases":["JMML"],"text":"JMML associated with pathogenic germline CBL variants can occasionally undergo spontaneous remission."},{"id":"khoury-2022-leukemia-36-1703-C0019","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["KIT"],"diseases":["mastocytosis"],"text":"In systemic mastocytosis, KIT p.D816V with VAF ≥10% in bone-marrow cells or peripheral-blood leukocytes qualifies as a B-finding."},{"id":"khoury-2022-leukemia-36-1703-C0020","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["KIT"],"diseases":["mastocytosis"],"text":"Any KIT mutation causing ligand-independent activation is accepted as a minor diagnostic criterion for systemic mastocytosis."},{"id":"khoury-2022-leukemia-36-1703-C0021","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["KIT"],"diseases":["mastocytosis"],"text":"Well-differentiated systemic mastocytosis may occur in any systemic-mastocytosis subtype; most cases lack KIT codon 816 mutation and typically show CD25/CD2 negativity with CD30 positivity."},{"id":"khoury-2022-leukemia-36-1703-C0022","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["MDS"],"text":"MDS is defined by cytopenias and morphologic dysplasia, with a recommended dysplasia threshold of 10% for all lineages."},{"id":"khoury-2022-leukemia-36-1703-C0023","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["TP53","SF3B1"],"diseases":["MDS"],"text":"Within genetically defined MDS, MDS with biallelic TP53 inactivation supersedes MDS-5q and MDS-SF3B1 in the WHO5 hierarchy."},{"id":"khoury-2022-leukemia-36-1703-C0024","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["SF3B1","TP53"],"diseases":["MDS"],"text":"In MDS-5q, an SF3B1 mutation or a TP53 mutation that is not multi-hit does not by itself override the MDS-5q diagnosis."},{"id":"khoury-2022-leukemia-36-1703-C0025","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["SF3B1"],"diseases":["MDS"],"text":"For SF3B1-wild-type MDS with ≥15% ring sideroblasts, “MDS with low blasts and ring sideroblasts” remains an acceptable alternative designation."},{"id":"khoury-2022-leukemia-36-1703-C0026","paper":"khoury-2022-leukemia-36-1703","category":"biomarker","tier":"guideline criterion","genes":["TP53"],"diseases":["MDS"],"text":"Clinical assessment of biallelic TP53 alterations in MDS uses sequencing covering at least exons 4–11 together with copy-number assessment; TP53 locus loss may also be inferred by next-generation sequencing."},{"id":"khoury-2022-leukemia-36-1703-C0027","paper":"khoury-2022-leukemia-36-1703","category":"biomarker","tier":"guideline criterion","genes":["TP53"],"diseases":["MDS"],"text":"In MDS, TP53 VAF ≥50% may be regarded as presumptive, but not definitive, evidence of trans-allelic copy loss or copy-neutral LOH when a constitutional TP53 variant has been ruled out."},{"id":"khoury-2022-leukemia-36-1703-C0028","paper":"khoury-2022-leukemia-36-1703","category":"biomarker","tier":"guideline criterion","genes":["TP53"],"diseases":["MDS"],"text":"When two or more TP53 mutations are detected in MDS, they usually affect both alleles and may be considered multi-hit status."},{"id":"khoury-2022-leukemia-36-1703-C0029","paper":"khoury-2022-leukemia-36-1703","category":"prognosis","tier":"restated secondary","genes":["TP53"],"diseases":["MDS"],"text":"MDS with biallelic TP53 alterations is regarded as very high risk in IPSS-R and is usually associated with complex or very complex karyotype."},{"id":"khoury-2022-leukemia-36-1703-C0030","paper":"khoury-2022-leukemia-36-1703","category":"treatment","tier":"restated secondary","genes":["TP53"],"diseases":["MDS"],"text":"Published data support considering MDS with biallelic TP53 inactivation as AML-equivalent for therapeutic purposes."},{"id":"khoury-2022-leukemia-36-1703-C0031","paper":"khoury-2022-leukemia-36-1703","category":"germline","tier":"restated secondary","genes":["GATA2","DDX41"],"diseases":["MDS","AML"],"text":"Pathogenic germline GATA2 or DDX41 variants can present with hypoplastic marrow and evolve to MDS and/or AML."},{"id":"khoury-2022-leukemia-36-1703-C0032","paper":"khoury-2022-leukemia-36-1703","category":"treatment","tier":"restated secondary","genes":["GATA2","DDX41"],"diseases":["MDS"],"text":"In the hypoplastic-marrow differential, individuals with germline GATA2 or DDX41 pathogenic variants are described as not responding to immunosuppressive treatment."},{"id":"khoury-2022-leukemia-36-1703-C0033","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["MDS","AML"],"text":"WHO5 retains a 20% blast cutoff to delineate MDS from AML while removing blast cutoffs for most AML types with defining genetic abnormalities."},{"id":"khoury-2022-leukemia-36-1703-C0034","paper":"khoury-2022-leukemia-36-1703","category":"treatment","tier":"guideline criterion","genes":[],"diseases":["MDS"],"text":"MDS-IB2 may be regarded as AML-equivalent for therapeutic considerations and, when appropriate, clinical-trial design."},{"id":"khoury-2022-leukemia-36-1703-C0035","paper":"khoury-2022-leukemia-36-1703","category":"treatment","tier":"restated secondary","genes":[],"diseases":["MDS"],"text":"In childhood MDS with low blasts, monosomy 7, 7q deletion, or complex karyotype is associated with increased risk of AML progression and is typically treated with haematopoietic stem-cell transplantation."},{"id":"khoury-2022-leukemia-36-1703-C0036","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["CMML"],"text":"CMML requires persistent absolute peripheral-blood monocytosis ≥0.5 ×10^9/L and relative monocytosis ≥10%."},{"id":"khoury-2022-leukemia-36-1703-C0037","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["CMML"],"text":"When absolute monocytosis is ≥0.5 but <1.0 ×10^9/L, CMML diagnosis requires a clonal cytogenetic or molecular abnormality and dysplasia in at least one lineage."},{"id":"khoury-2022-leukemia-36-1703-C0038","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["JAK2","CALR","MPL"],"diseases":["CMML","MPN"],"text":"In a patient with monocytosis, a documented MPN history excludes CMML; marrow MPN features and/or a high burden of JAK2, CALR or MPL mutations supports MPN with monocytosis rather than CMML."},{"id":"khoury-2022-leukemia-36-1703-C0039","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["PDGFRA","FIP1L1","PDGFRB","ETV6","FGFR1","JAK2","FLT3","ABL1","FGFR2","LYN","NTRK3","RANBP2","ALK","BCR","RET","FGFR1OP"],"diseases":["CMML"],"text":"In a suspected CMML case with eosinophilia, myeloid/lymphoid neoplasms with tyrosine-kinase gene fusions should be excluded by assessing for PDGFRA rearrangement (most commonly FIP1L1::PDGFRA), PDGFRB rearrangement (most commonly ETV6::PDGFRB), FGFR1 rearrangement, JAK2 rearrangement, FLT3 rearrangement, ETV6::ABL1, and other defined tyrosine-kinase fusions including ETV6::FGFR2, ETV6::LYN, ETV6::NTRK3, RANBP2::ALK, BCR::RET, and FGFR1OP::RET. WHO5 treats PDGFRA, PDGFRB, FGFR1, JAK2 and FLT3 as rearrangement-defined categories rather than restricting them to a single fusion partner."},{"id":"khoury-2022-leukemia-36-1703-C0040","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["SF3B1"],"diseases":["MDS/MPN"],"text":"MDS/MPN with ring sideroblasts and thrombocytosis is redefined on the basis of SF3B1 mutation and renamed MDS/MPN with SF3B1 mutation and thrombocytosis."},{"id":"khoury-2022-leukemia-36-1703-C0041","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["SF3B1"],"diseases":["MDS/MPN"],"text":"For SF3B1-wild-type MDS/MPN with ≥15% ring sideroblasts, “MDS/MPN with ring sideroblasts and thrombocytosis” remains an acceptable term."},{"id":"khoury-2022-leukemia-36-1703-C0042","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["PML","RARA","RUNX1","RUNX1T1","CBFB","MYH11"],"diseases":["AML"],"text":"WHO5 recognizes AML with PML::RARA, RUNX1::RUNX1T1 and CBFB::MYH11 as AML types with defining genetic abnormalities."},{"id":"khoury-2022-leukemia-36-1703-C0043","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["BCR","ABL1","CEBPA"],"diseases":["AML"],"text":"AML with BCR::ABL1 and AML with CEBPA mutation are the defining-genetic-abnormality AML types that still require at least 20% blasts; for BCR::ABL1 this avoids overlap with CML."},{"id":"khoury-2022-leukemia-36-1703-C0044","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["KMT2A","MECOM","NUP98"],"diseases":["AML"],"text":"AML with KMT2A, MECOM or NUP98 rearrangement may be diagnosed with a blast count below 20%."},{"id":"khoury-2022-leukemia-36-1703-C0045","paper":"khoury-2022-leukemia-36-1703","category":"biomarker","tier":"restated secondary","genes":["KMT2A","MECOM","NUP98"],"diseases":["AML"],"text":"KMT2A, MECOM and NUP98 rearrangements, particularly NUP98 rearrangements, may be cryptic on conventional karyotyping."},{"id":"khoury-2022-leukemia-36-1703-C0046","paper":"khoury-2022-leukemia-36-1703","category":"prognosis","tier":"restated secondary","genes":["KMT2A"],"diseases":["AML"],"text":"For KMT2A-rearranged AML, identifying the fusion partner is desirable because it can provide prognostic information."},{"id":"khoury-2022-leukemia-36-1703-C0047","paper":"khoury-2022-leukemia-36-1703","category":"biomarker","tier":"restated secondary","genes":["KMT2A"],"diseases":["AML"],"text":"For KMT2A-rearranged AML, identifying the fusion partner is desirable because it may affect disease monitoring."},{"id":"khoury-2022-leukemia-36-1703-C0048","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["NPM1"],"diseases":["AML"],"text":"AML with NPM1 mutation can be diagnosed irrespective of blast count, with clinicopathologic correlation."},{"id":"khoury-2022-leukemia-36-1703-C0049","paper":"khoury-2022-leukemia-36-1703","category":"prognosis","tier":"restated secondary","genes":["NPM1"],"diseases":["MDS","MDS/MPN"],"text":"MDS or MDS/MPN cases with NPM1 mutation are reported to progress to AML in a short period."},{"id":"khoury-2022-leukemia-36-1703-C0050","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["CEBPA"],"diseases":["AML"],"text":"AML with CEBPA mutation includes biallelic CEBPA mutations and single CEBPA mutations in the basic leucine zipper region."},{"id":"khoury-2022-leukemia-36-1703-C0051","paper":"khoury-2022-leukemia-36-1703","category":"prognosis","tier":"restated secondary","genes":["CEBPA"],"diseases":["AML"],"text":"A single CEBPA mutation in the bZIP region is associated with favourable prognosis in children and adults up to age 70."},{"id":"khoury-2022-leukemia-36-1703-C0052","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["RUNX1"],"diseases":["AML"],"text":"Somatic RUNX1 mutation is not sufficient to define a standalone WHO5 AML type because it lacks specificity across defining molecular contexts."},{"id":"khoury-2022-leukemia-36-1703-C0053","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["SRSF2","SF
