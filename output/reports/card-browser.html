<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Evidence cards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#efeef4;
    --panel:#f7f6fa;
    --ink:#191825;
    --muted:#6e6a82;
    --rule:#d8d5e3;
    --azure:#2b4c8c;
    --eosin:#a31e63;
    --focus:#a31e63;
    --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --display:"Newsreader",Georgia,serif;
    --cat-diagnosis:#4a3f8f;
    --cat-prognosis:#a31e63;
    --cat-treatment:#1d6f63;
    --cat-biomarker:#2b4c8c;
    --cat-germline:#8a5a12;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);color:var(--ink);font-family:var(--sans);
    font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;
  }
  a{color:var(--azure)}
  button{font:inherit;color:inherit}

  /* ---------- masthead ---------- */
  header.masthead{
    border-bottom:1px solid var(--rule);
    padding:22px 28px 16px;
    display:flex;flex-wrap:wrap;gap:18px;align-items:baseline;justify-content:space-between;
  }
  .wordmark{font-family:var(--display);font-size:31px;line-height:1;letter-spacing:-.01em;font-weight:500;margin:0}
  .wordmark em{font-style:italic;color:var(--eosin)}
  .provenance{font-family:var(--mono);font-size:11.5px;color:var(--muted);letter-spacing:.02em}

  /* ---------- shell ---------- */
  .shell{display:grid;grid-template-columns:288px minmax(0,1fr);gap:0;align-items:start}
  body.full-mode.detail-open .shell{grid-template-columns:1fr 3fr 1fr}
  body.full-mode.detail-open .rail{grid-column:1}
  body.full-mode.detail-open .detail{grid-column:2;grid-row:1}
  body.full-mode.detail-open .main{grid-column:3;grid-row:1;padding-left:20px;padding-right:20px}
  .rail{
    border-right:1px solid var(--rule);padding:20px 20px 60px;
    position:sticky;top:0;max-height:100vh;overflow-y:auto;background:var(--panel);
  }
  .main{padding:20px 28px 90px;min-width:0}

  /* ---------- full detail pane ---------- */
  .detail{display:none}
  body.full-mode.detail-open .detail{
    display:block;border-left:1px solid var(--rule);border-right:1px solid var(--rule);
    background:#fff;padding:18px 24px 60px;position:sticky;top:0;max-height:100vh;
    overflow-y:auto;min-width:0;
  }
  .detail-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px}
  .detail-id{font-family:var(--mono);font-size:12px;color:var(--muted);overflow-wrap:anywhere}
  .detail-close{border:1px solid var(--rule);background:#fff;border-radius:2px;cursor:pointer;padding:3px 8px;font-family:var(--mono);font-size:12px}
  .detail-close:hover{border-color:var(--eosin);color:var(--eosin)}
  .detail-section{border-top:1px solid var(--rule);padding-top:14px;margin-top:16px}
  .detail-section:first-of-type{border-top:0;padding-top:0;margin-top:0}
  .detail-section h2{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
  .detail-interpretation{font-family:var(--display);font-size:20px;line-height:1.45;margin:0}
  .meta-grid{display:grid;grid-template-columns:minmax(100px,130px) minmax(0,1fr);gap:6px 12px;margin:0;font-size:13px}
  .meta-grid dt{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin:0}
  .meta-grid dd{margin:0;overflow-wrap:anywhere}
  .evidence-fragment{margin:12px 0 0;padding:10px 12px;background:var(--panel);border-left:3px solid var(--azure)}
  .fragment-label{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-bottom:6px}
  .evidence-fragment blockquote{margin:0;font-size:13.5px;line-height:1.55}
  .support-list{margin:0;padding-left:18px;font-size:13px}
  .support-list code{font-family:var(--mono);font-size:11px}
  .detail-citation{font-size:13px;line-height:1.55;margin:0}
  details.raw{margin-top:16px;border-top:1px solid var(--rule);padding-top:12px}
  details.raw summary{cursor:pointer;font-family:var(--mono);font-size:10.5px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
  pre.raw-json{white-space:pre-wrap;overflow-wrap:anywhere;font-family:var(--mono);font-size:10px;line-height:1.45;background:var(--panel);padding:10px;margin:10px 0 0;border:1px solid var(--rule)}

  /* ---------- filters ---------- */
  .facet{margin-bottom:26px}
  .facet h2{
    font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.12em;
    text-transform:uppercase;color:var(--muted);margin:0 0 9px;
    display:flex;justify-content:space-between;align-items:baseline;gap:8px;
  }
  .facet h2 .clear{
    border:0;background:none;padding:0;cursor:pointer;color:var(--eosin);
    font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:none;
    visibility:hidden;
  }
  .facet.active h2 .clear{visibility:visible}
  .facet-search{
    width:100%;border:1px solid var(--rule);background:#fff;border-radius:2px;
    padding:6px 8px;font-family:var(--mono);font-size:12px;color:var(--ink);margin-bottom:8px;
  }
  .facet-search::placeholder{color:#9a96ab}
  .options{list-style:none;margin:0;padding:0;max-height:264px;overflow-y:auto}
  .options.short{max-height:none}
  .opt{
    width:100%;display:flex;gap:8px;align-items:baseline;text-align:left;
    border:0;background:none;cursor:pointer;padding:3px 4px;border-radius:2px;
    font-size:13.5px;line-height:1.35;color:var(--ink);
  }
  .opt:hover{background:#e9e6f1}
  .opt .tick{
    font-family:var(--mono);font-size:11px;color:var(--muted);width:12px;flex:none;
  }
  .opt[aria-pressed="true"]{background:#fff}
  .opt[aria-pressed="true"] .label{color:var(--eosin);font-weight:600}
  .opt[aria-pressed="true"] .tick{color:var(--eosin)}
  .opt .label{flex:1;min-width:0;overflow-wrap:anywhere}
  .opt .count{font-family:var(--mono);font-size:11px;color:var(--muted);flex:none}
  .opt[disabled]{opacity:.35;cursor:default}
  .opt[disabled]:hover{background:none}
  .swatch{width:8px;height:8px;border-radius:50%;flex:none;align-self:center}

  /* ---------- results ---------- */
  .toolbar{
    display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;
    padding-bottom:12px;border-bottom:1px solid var(--rule);margin-bottom:4px;
  }
  .tally{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.03em}
  .tally b{color:var(--ink);font-weight:500}
  .text-search{
    flex:1;min-width:200px;max-width:380px;border:1px solid var(--rule);background:#fff;
    border-radius:2px;padding:7px 10px;font-family:var(--sans);font-size:13.5px;
  }
  .reset{
    border:1px solid var(--rule);background:#fff;border-radius:2px;padding:6px 11px;
    font-family:var(--mono);font-size:11.5px;letter-spacing:.04em;cursor:pointer;
  }
  .reset:hover{border-color:var(--eosin);color:var(--eosin)}

  ol.cards{list-style:none;margin:0;padding:0}
  li.card{
    display:grid;grid-template-columns:232px minmax(0,1fr);gap:22px;
    padding:15px 0 15px 13px;border-bottom:1px solid var(--rule);
    border-left:3px solid var(--spine,var(--rule));
  }
  body.full-mode li.card{cursor:pointer}
  body.full-mode li.card:hover{background:#f7f4fa}
  body.full-mode li.card.selected{background:#fff;border-left-width:5px;padding-left:11px}
  body.full-mode.detail-open li.card{display:block;padding-top:13px;padding-bottom:13px}
  body.full-mode.detail-open li.card .cid{display:block;margin-bottom:5px}
  body.full-mode.detail-open li.card p{font-size:14px;line-height:1.5}
  li.card .cid{
    font-family:var(--mono);font-size:11.5px;line-height:1.5;color:var(--muted);
    letter-spacing:-.01em;overflow-wrap:anywhere;padding-top:2px;
  }
  li.card p{margin:0;font-size:15.5px;line-height:1.6}
  li.card mark{background:#f7dbe8;color:inherit;padding:0 1px}
  .empty{padding:56px 0;max-width:44ch}
  .empty h3{font-family:var(--display);font-size:22px;font-weight:500;margin:0 0 6px}
  .empty p{margin:0;color:var(--muted)}

  .railtoggle{display:none}

  @media (max-width:1150px){
    body.full-mode.detail-open .rail{padding-left:14px;padding-right:14px}
    body.full-mode.detail-open .detail{padding-left:18px;padding-right:18px}
    body.full-mode.detail-open .main{padding-left:14px;padding-right:14px}
  }

  @media (max-width:900px){
    .shell, body.full-mode.detail-open .shell{grid-template-columns:1fr}
    body.full-mode.detail-open .rail{grid-column:1;grid-row:1}
    body.full-mode.detail-open .detail{
      grid-column:1;grid-row:2;position:static;max-height:none;border-right:0;
    }
    body.full-mode.detail-open .main{grid-column:1;grid-row:3;padding:16px 20px 70px}
    .rail{
      position:static;max-height:none;border-right:0;border-bottom:1px solid var(--rule);
      padding-bottom:24px;
    }
    .rail[hidden]{display:none}
    .railtoggle{
      display:block;margin:16px 28px 0;border:1px solid var(--rule);background:#fff;
      border-radius:2px;padding:8px 12px;font-family:var(--mono);font-size:12px;cursor:pointer;
    }
    .main{padding:16px 20px 70px}
    li.card{grid-template-columns:1fr;gap:5px}
    header.masthead{padding:18px 20px 14px}
  }
  :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

  /* ---------- corpus user layer ---------- */
  /* Inherits the light document palette above. Editable surfaces are white with
     --ink text so they stay legible before selection. */
  .modebar{display:flex;gap:0;align-items:stretch;margin-left:auto;border:1px solid var(--rule);border-radius:2px;overflow:hidden}
  .modebtn{
    font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;
    padding:5px 12px;border:0;background:#fff;color:var(--muted);cursor:pointer;
  }
  .modebtn + .modebtn{border-left:1px solid var(--rule)}
  .modebtn:hover{color:var(--ink)}
  .modebtn[aria-pressed="true"]{background:var(--azure);color:#fff}

  .profilebar{
    display:flex;gap:10px;align-items:center;flex-wrap:wrap;
    padding:10px 14px;margin:0 0 18px;
    background:var(--panel);border:1px solid var(--rule);border-left:3px solid var(--azure);
  }
  .profilebar .pname{
    font-family:var(--mono);font-size:12px;color:var(--ink);background:#fff;
    border:1px solid var(--rule);border-radius:2px;padding:5px 8px;width:13rem;
  }
  .pcount{font-family:var(--mono);font-size:11px;color:var(--muted)}
  .pstale{
    font-family:var(--mono);font-size:10.5px;color:#fff;background:var(--eosin);
    border-radius:2px;padding:2px 7px;letter-spacing:.04em;
  }
  .pbtn{
    font-family:var(--mono);font-size:11px;letter-spacing:.04em;
    border:1px solid var(--rule);background:#fff;color:var(--ink);
    border-radius:2px;padding:5px 11px;cursor:pointer;
  }
  .pbtn:hover{border-color:var(--azure);color:var(--azure)}
  .pbtn.primary{background:var(--azure);border-color:var(--azure);color:#fff}
  .pbtn.primary:hover{background:#22406f;color:#fff}
  .phelp{flex-basis:100%;font-family:var(--mono);font-size:10.5px;color:var(--muted)}

  /* Copy controls are quiet text affordances, not buttons competing with the card. */
  .copyrow{display:flex;gap:14px;align-items:baseline;margin-top:8px}
  .copybtn{
    border:0;background:none;padding:0;cursor:pointer;
    font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;
    color:var(--muted);text-decoration:underline;text-underline-offset:2px;
  }
  .copybtn:hover{color:var(--azure)}
  .copybtn.copied{color:var(--cat-treatment);text-decoration:none}

  .editor{margin-top:14px;border-top:1px solid var(--rule);padding-top:14px}
  .original{background:var(--panel);border-left:3px solid var(--muted);padding:9px 12px;margin-bottom:12px}
  .origlabel{
    display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--muted);margin-bottom:5px;
  }
  .original p{margin:0;font-size:13.5px;line-height:1.5;color:var(--ink)}
  .editarea{
    width:100%;font-family:var(--sans);font-size:14.5px;line-height:1.5;
    background:#fff;color:var(--ink);
    border:1px solid var(--rule);border-radius:2px;padding:9px 11px;resize:vertical;
  }
  .editarea:focus,.editfield:focus,.profilebar .pname:focus{
    outline:2px solid var(--focus);outline-offset:-1px;border-color:var(--focus);
  }
  /* Assertion left, classification right; stacks when the column is too narrow
     (mobile, or the full-mode detail pane taking two thirds of the shell). */
  .editcolumns{display:grid;grid-template-columns:minmax(0,1fr) 17rem;gap:18px;align-items:start}
  .editmain{min-width:0}
  .editside{display:flex;flex-direction:column;gap:12px;min-width:0}
  .editlabel{display:flex;flex-direction:column;gap:4px}
  .wasline{
    font-family:var(--mono);font-size:10.5px;line-height:1.4;color:var(--muted);
    overflow-wrap:anywhere;
  }
  select.editfield{
    appearance:none;-webkit-appearance:none;
    background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
    background-position:calc(100% - 14px) 52%,calc(100% - 9px) 52%;
    background-size:5px 5px,5px 5px;background-repeat:no-repeat;
    padding-right:26px;cursor:pointer;
  }

  /* Disease token field: chips for the selection, filtering list to add. */
  .tokenfield{position:relative;display:flex;flex-direction:column;gap:5px}
  .chips{display:flex;flex-wrap:wrap;gap:4px}
  .chip{
    display:inline-flex;align-items:center;gap:5px;
    font-family:var(--mono);font-size:11px;line-height:1.3;
    background:#fff;color:var(--ink);border:1px solid var(--rule);
    border-radius:2px;padding:2px 4px 2px 7px;
  }
  .chipx{
    border:0;background:none;padding:0 1px;cursor:pointer;
    font-family:var(--mono);font-size:13px;line-height:1;color:var(--muted);
  }
  .chipx:hover{color:var(--eosin)}
  .chipnone{font-family:var(--mono);font-size:11px;color:var(--muted)}
  .tokeninput{width:100%}
  .tokenlist{
    list-style:none;margin:0;padding:0;position:absolute;left:0;right:0;top:100%;z-index:5;
    max-height:210px;overflow-y:auto;background:#fff;border:1px solid var(--rule);
    box-shadow:0 4px 14px rgba(25,24,37,.13);
  }
  .tokenopt{
    display:block;width:100%;text-align:left;border:0;background:none;cursor:pointer;
    font-family:var(--sans);font-size:12.5px;color:var(--ink);padding:5px 9px;
  }
  .tokenopt:hover{background:var(--panel);color:var(--azure)}
  @media (max-width:1100px){
    .editcolumns{grid-template-columns:minmax(0,1fr)}
  }
  body.full-mode.detail-open .editcolumns{grid-template-columns:minmax(0,1fr)}


  /* ---------- modal ---------- */
  .modalback{
    position:fixed;inset:0;z-index:40;background:rgba(25,24,37,.42);
    display:flex;align-items:flex-start;justify-content:center;padding:6vh 20px;
  }
  .modalbox{
    background:#fff;border:1px solid var(--rule);max-width:760px;width:100%;
    max-height:82vh;overflow-y:auto;padding:20px 24px 28px;box-shadow:0 12px 40px rgba(25,24,37,.24);
  }
  .modalhead{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
  .modalhead h2{font-family:var(--display);font-size:22px;margin:0 0 4px;font-weight:500}
  .modalsection{border-top:1px solid var(--rule);margin-top:18px;padding-top:14px}
  .modalsection > h3{
    font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--muted);margin:0 0 8px;
  }
  .modalline{margin:0 0 5px;font-size:13px;line-height:1.5;color:var(--ink)}
  .pselect{width:11rem}
  .pfile{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
  label.pbtn{cursor:pointer;position:relative;display:inline-flex;align-items:center}

  /* ---------- edit mode: filters | editor | card picker ---------- */
  body.edit-mode .shell{grid-template-columns:288px minmax(0,1fr) 27rem}
  body.edit-mode .rail{grid-column:1}
  body.edit-mode .detail{
    grid-column:2;grid-row:1;display:block;background:#fff;
    border-left:1px solid var(--rule);border-right:1px solid var(--rule);
    padding:18px 24px 60px;position:sticky;top:0;max-height:100vh;overflow-y:auto;min-width:0;
  }
  body.edit-mode .main{grid-column:3;grid-row:1;padding:18px 20px 70px}
  body.edit-mode .toolbar{flex-wrap:wrap}
  body.edit-mode .cards{list-style:none;margin:0;padding:0}

  .pickbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  .picktally{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
  .pbtn[disabled]{opacity:.45;cursor:default}
  .pbtn[disabled]:hover{border-color:var(--rule);color:var(--ink)}

  .promptbox{
    border:1px solid var(--azure);border-left:3px solid var(--azure);background:var(--panel);
    padding:11px 13px;margin-bottom:14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;
  }
  .promptbox p{flex-basis:100%;margin:0;font-size:12.5px;line-height:1.5;color:var(--ink)}

  .pickrow{
    display:flex;gap:9px;align-items:flex-start;
    border-top:1px solid var(--rule);padding:10px 6px;cursor:pointer;
  }
  .pickrow:hover{background:var(--panel)}
  .pickrow.selected{background:var(--panel);box-shadow:inset 3px 0 0 var(--azure)}
  .pickrow.excluded .picktext,.pickrow.excluded .pickid{opacity:.45}
  .pickbox{margin-top:3px;accent-color:var(--azure);width:15px;height:15px;flex:none;cursor:pointer}
  .pickbox:disabled{cursor:default}
  .pickbody{min-width:0}
  .pickhead{display:flex;flex-wrap:wrap;gap:7px;align-items:baseline;margin-bottom:3px}
  .pickid{font-family:var(--mono);font-size:11px;color:var(--ink)}
  .pickpaper{font-family:var(--mono);font-size:10px;color:var(--muted);overflow-wrap:anywhere}
  .locktag{
    font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;
    color:var(--muted);border:1px solid var(--rule);border-radius:2px;padding:1px 5px;
  }
  .picktext{
    margin:0;font-size:12.5px;line-height:1.45;color:var(--ink);
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
  }
  .scopenote{
    font-family:var(--mono);font-size:10.5px;color:var(--cat-germline);
    border-left:3px solid var(--cat-germline);padding:6px 10px;background:var(--panel);margin:12px 0 0;
  }
  @media (max-width:1250px){
    body.edit-mode .shell{grid-template-columns:minmax(0,1fr)}
    body.edit-mode .rail{grid-column:1;grid-row:1;position:static;max-height:none}
    body.edit-mode .detail{grid-column:1;grid-row:2;position:static;max-height:none;border-left:0;border-right:0}
    body.edit-mode .main{grid-column:1;grid-row:3}
  }

  .editlabel > span{
    font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--muted);
  }
  .editlabel.changed > span{color:var(--eosin)}
  .editfield{
    font-family:var(--sans);font-size:13.5px;
    background:#fff;color:var(--ink);
    border:1px solid var(--rule);border-radius:2px;padding:6px 9px;
  }
  .editlabel.changed .editfield{border-color:var(--eosin)}
  .editfield::placeholder{color:#767290}
  .editactions{display:flex;gap:12px;align-items:baseline;margin-top:14px}
  .revert{
    font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;
    border:1px solid var(--rule);background:#fff;color:var(--eosin);
    border-radius:2px;padding:4px 10px;cursor:pointer;
  }
  .revert:hover{border-color:var(--eosin)}
  .editnote{font-family:var(--mono);font-size:10.5px;color:var(--muted)}

  .amendtag{
    font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;
    color:#fff;background:var(--eosin);border-radius:2px;padding:1px 6px;margin-left:8px;
  }
  .amendtag.staletag{background:var(--cat-germline)}
  .evidencetag{
    font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;

0c2019df1c","audit":{"verdict":"pass","basis":"phase3"}},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0010","shortId":"C0010","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["B-ALL"],"ancestors":["lymphoid neoplasm","acute lymphoblastic leukaemia/lymphoma","B-cell lymphoid neoplasm","precursor B-cell neoplasm"],"locator":"B-ALL section, line 79","secondary":null,"text":"According to WHO-HAEM5, B-ALL with ETV6::RUNX1-like features is a new B-ALL entity.","baseSha256":"aa79e0e838ddc917d29a91d2032005d33ae14cb058a1919dfc371c594c42e021","audit":{"verdict":"pass","basis":"phase3"}},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0013","shortId":"C0013","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["MBL"],"ancestors":["lymphoid neoplasm","B-cell lymphoid neoplasm","mature B-cell neoplasm","small lymphocytic proliferation"],"locator":"MBL section, lines 201–203","secondary":null,"text":"According to WHO-HAEM5, low-count MBL is defined by a clonal CLL/SLL-phenotype B-cell count below 0.5 × 10^9/L with no other features diagnostic of a B-lymphoproliferative disorder.","baseSha256":"9af392b7649862935a8e781a581531aad6ebbd03e76a7c7732296bfd217c3587","audit":{"verdict":"pass","basis":"phase3"}},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0014","shortId":"C0014","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["MBL"],"ancestors":["lymphoid neoplasm","B-cell lymphoid neoplasm","mature B-cell neoplasm","small lymphocytic proliferation"],"locator":"MBL section, lines 204–207","secondary":null,"text":"According to WHO-HAEM5, CLL/SLL-type MBL is defined by a monoclonal CLL/SLL-phenotype B-cell count at least 0.5 × 10^9/L and a total B-cell count below 5 × 10^9/L, with no other features diagnostic of CLL/SLL.","baseSha256":"761ce50db4d496139b93befc29cc28b2da9b6888c4879eb41911ea710e5f34b8","audit":{"verdict":"pass","basis":"phase3"}},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0015","shortId":"C0015","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["MBL"],"ancestors":["lymphoid neoplasm","B-cell lymphoid neoplasm","mature B-cell neoplasm","small lymphocytic proliferation"],"locator":"MBL section, line 209","secondary":null,"text":"According to WHO-HAEM5, non-CLL/SLL-type MBL is any monoclonal non-CLL/SLL-phenotype B-cell expansion without symptoms or features diagnostic of another mature B-cell neoplasm.","baseSha256":"f0f80fe46766f72dcb67316e72ee1f9eff4feabf1883465682cb3fcc6cb9b6e1","audit":{"verdict":"pass","basis":"phase3"}},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0016","shortId":"C0016","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["CLL/SLL"],"ancestors":["lymphoid neoplasm","B-cell lymphoid neoplasm","mature B-cell neoplasm","small lymphocytic proliferation"],"locator":"CLL/SLL section, line 211","secondary":null,"text":"For CLL/SLL diagnosis, WHO-HAEM5 regards CD5, CD19, CD20, CD23, and surface or cytoplasmic kappa and lambda light chains as essential markers.","baseSha256":"36e4e3075046fa9e53acb4cd7b051d0bce9f99618a7a32392ef705211a07230a","audit":{"verdict":"pass","basis":"phase4_adjudicated"}},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0019","shortId":"C0019","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":["IGH","CCND1"],"diseases":["mantle cell lymphoma"],"ancestors":["lymphoid neoplasm","B-cell lymphoid neoplasm","mature B-cell neoplasm","mantle cell neoplasm"],"locator":"B-prolymphocytic leukaemia section, line 257","secondary":null,"text":"According to WHO-HAEM5, cases formerly labelled B-prolymphocytic leukaemia that carry IGH::CCND1 are classified as a mantle cell lymphoma variant rather than B-PLL.","baseSha256":"fa40df57cc006c37c2375c1a27f107efe6de52a3cd0d19855c9703e9ebad207c","audit":{"verdict":"pass","basis":"phase3"}},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0020","shortId":"C0020","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["CLL/SLL"],"ancestors":["lymphoid neoplasm","B-cell lymphoid neoplasm","mature B-cell neoplasm","small lymphocytic proliferation"],"locator":"B-prolymphocytic leukaemia section and Fig. 1, lines 257 and 275","secondary":null,"text":"According to WHO-HAEM5, CLL/SLL with at least 15% prolymphocytes is classified as prolymphocytic progression of CLL/SLL, whereas CLL/SLL with less than 15% prolymphocytes remains CLL/SLL.","baseSha256":"11d6ac56470854b4ef2fdc8ff6b094431ec0db6d78207b93223284d976dd60e6","audit":{"verdict":"pass","basis":"phase3"}},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0021","shortId":"C0021","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["SBLPN"],"ancestors":["lymphoid neoplasm","B-cell lymphoid neoplasm","mature B-cell neoplasm","splenic B-cell lymphoma/leukaemia"],"locator":"B-prolymphocytic leukaemia section, lines 257–263","secondary":null,"text":"According to WHO-HAEM5, former B-prolymphocytic leukaemia cases not reclassified as mantle cell lymphoma or CLL/SLL progression are incorporated into splenic B-cell lymphoma/leukaemia with prominent nucleoli (SBLPN).","baseSha256":"e1f9679c984cc17470168ea19f13b48decc440ce26c1738b0d69320086eb9d6e","audit":{"verdict":"pass","basis":"phase3"}},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0022","shortId":"C0022","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":["BRAF"],"diseases":["HCL"],"ancestors":["lymphoid neoplasm","B-cell lymphoid neoplasm","mature B-cell neoplasm","splenic B-cell lymphoma/leukaemia"],"locator":"Splenic B-cell lymphoma section, line 261","secondary":null,"text":"In hairy cell leukaemia, BRAF p.V600E is a hallmark somatic mutation, whereas other members of the splenic B-cell lymphoma/leukaemia family usually lack BRAF mutations, supporting diagnostic distinction.","baseSha256":"711f549007d9c31a2daac6011bab8abf2cd3495c1e9d2dbb1919838839f262d7","audit":{"verdict":"pass","basis":"phase3"}},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0023","shortId":"C0023","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["SDRPL"],"ancestors":["lymphoid neoplasm","B-cell lymphoid neoplasm","mature B-cell neoplasm","splenic B-cell lymphoma/leukaemia"],"locator":"SDRPL section, line 267","secondary":null,"text":"A CD200 mean fluorescence intensity/CD180 mean fluorescence intensity ratio below 0.5 on flow cytometry favours splenic diffuse red pulp small B-cell lymphoma (SDRPL) over hairy cell leukaemia (HCL), splenic marginal zone lymphoma (SMZL), and splenic B-cell lymphoma/leukaemia with prominent nucleoli (SBLPN).","baseSha256":"7d206c2c14b0fe57d7b719b7900646711b4752f131b4054bf236f801bec05c01","audit":{"verdict":"pass","basis":"phase3"}},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0024","shortId":"C0024","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":["MYD88"],"diseases":["IgM LPL/WM"],"ancestors":["lymphoid neoplasm","B-cell lymphoid neoplasm","mature B-cell neoplasm","LPL"],"locator":"Lymphoplasmacytic lymphoma section, line 273","secondary":null,"text":"According to WHO-HAEM5, IgM LPL/WM has two molecular subsets based on the presence or absence of MYD88 p.L265P.","baseSha256":"17e56011f1d57ee9b502832f62a1e5ea038bb04b9e6280060eafed7bcbb158e3","audit":{"verdict":"pass","basis":"phase3"}},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0025","shortId":"C0025","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":["MYD88"],"diseases":["LPL"],"ancestors":["lymphoid neoplasm","B-cell lymphoid neoplasm","mature B-cell neoplasm"],"locator":"Lymphoplasmacytic lymphoma section, line 273","secondary":null,"text":"In lymphoplasmacytic lymphoma (LPL), demonstration of MYD88 p.L265P may aid differential diagnosis from nodal marginal zone lymphoma, extranodal MZL of MALT with plasmacytoid differentiation, and plasma cell myeloma.","baseSha256":"a68623ad89e2d8a17e2b1fb4a65ba7386377be158125b9398d98d89f7f82c719","audit":{"verdict":"pass","basis":"phase3"}},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0026","shortId":"C0026","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"prognosis","tier":"restated secondary","genes":["CXCR4"],"diseases":["LPL"],"ancestors":["lymphoid neoplasm","B-cell lymphoid neoplasm","mature B-cell neoplasm"],"locator":"Lymphoplasmacytic lymphoma section, line 277","secondary":null,"text":"In lymphoplasmacytic lymphoma (LPL), CXCR4-mutated disease is associated with shorter time to treatment.","baseSha256":"b85ef97b2b8058ce475a2676fe681ef84b4e0b01f2d7a68f7ede040d661b8df4","audit":{"verdict":"pass","basis":"phase3"}},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0027","shortId":"C0027","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"treatment","tier":"restated secondary","genes":["CXCR4"],"diseases":["LPL"],"ancestors":["lymphoid neoplasm","B-cell lymphoid neoplasm","mature B-cell neoplasm"],"locator":"Lymphoplasmacytic lymphoma section, line 277","secondary":null,"text":"In lymphoplasmacytic lymphoma (LPL), CXCR4 mutation is associated particularly with resistance to ibrutinib therapy.","baseSha256":"5e3457d4f8c530e269ad74ff46fee79b9ba7020bcdcb334eaf5043da9dc13951","audit":{"verdict":"pass","basis":"phase3"}},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0029","shortId":"C0029","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"treatment","tier":"restated secondary","genes":["BIRC3","MALT1"],"diseases":["extranodal MZL of MALT"],"ancestors":["lymphoid neoplasm","B-cell lymphoid neoplasm","mature B-cell neoplasm","marginal zone lymphoma"],"locator":"Extranodal marginal zone lymphoma Fig. 2 legend, line 317","secondary":null,"text":"In gastric extranodal MZL of MALT, BIRC3::MALT1 identifies disease that does not respond to Helicobacter pylori eradication.","baseSha256":"6c2d79eae367a694216789490961d7bc68f0c93fde94bab53e1a4cb0cae98bf1","audit":{"verdict":"pass","basis":"phase3"}},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0030","shortId":"C0030","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":["IGH","BCL2"],"diseases":["follicular lymphoma"],"ancestors":["lymphoid neoplasm","B-cell lymphoid neoplasm","mature B-cell neoplasm"],"locator":"Follicular lymphoma section, line 289","secondary":null,"text":"According to WHO-HAEM5, classic follicular lymphoma encompasses the usual follicular-pattern follicular lymphomas composed of centrocytes and centroblasts that commonly harbour t(14;18)/IGH::BCL2, and is distinguished from follicular large B-cell lymphoma and follicular lymphoma with uncommon features.","baseSha256":"89fa364dbf32bb51d76ca6f0f30c9aa6627e4a443e15f8177c20abe5183221af","audit":{"verdict":"pass","basis":"phase3"}},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0031","shortId":"C0031","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["follicular lymphoma"],"ancestors":["lymphoid neoplasm","B-cell lymphoid neoplasm","mature B-cell neoplasm"],"locator":"Follicular lymphoma section, lines 291–319","secondary":null,"text":"According to WHO-HAEM5, histological grading is optional rather than mandatory for classic follicular lymphoma.","baseSha256":"f0955a341521117913a35a7cf8461e6eb17f01682511f95c10272b61d93e97f4","audit":{"verdict":"pass","basis":"phase3"}},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0032","shortId":"C0032","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":["IRF4"],"diseases":["follicular lymphoma"],"ancestors":["lymphoid neoplasm","B-cell lymphoid neoplasm","mature B-cell neoplasm"],"locator":"Follicular lymphoma section, line 325","secondary":null,"text":"Follicular lymphoma with blastoid or large-centrocyte cytology should be distinguished from large B-cell lymphoma with IRF4 rearrangement.","baseSha256":"a9a07da5a53ce6b8ed29d9a4a6dc703de3e7beef96d9cbbc0d2e54d5e6136228","audit":{"verdict":"pass","basis":"phase3"}},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0033","shortId":"C0033","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":["CCND1"],"diseases":["in situ mantle cell neoplasm"],"ancestors":["lymphoid neoplasm","B-cell lymphoid neoplasm","mature B-cell neoplasm","mantle cell neoplasm"],"locator":"Mantle cell lymphoma section, line 329","secondary":null,"text":"According to WHO-HAEM5, in situ mantle cell neoplasm represents mantle-zone colonization by B cells carrying an IG::CCND1 fusion with cyclin D1 overexpression.","baseSha256":"93098fa4c798714a382e64b4a6297b9c031bad72b8c2340162d0f39531912aed","audit":{"verdict":"pass","basis":"phase3"}},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0034","shortId":"C0034","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":["IGH","CCND1"],"diseases":["mantle cell lymphoma"],"ancestors":["lymphoid neoplasm","B-cell lymphoid neoplasm","mature B-cell neoplasm","mantle cell neoplasm"],"locator":"Mantle cell lymphoma section, line 331","secondary":null,"text":"In mantle cell lymphoma, IGH::CCND1 fusion associated with t(11;14) is the genetic hallmark and is present in at least 95% of cases.","baseSha256":"a3965785c2c0a9f81ec9d99a5080885d6f6e3db852a2656ec2eecb8bc98ddf3e","audit":{"verdict":"pass","basis":"phase3"}},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0035","shortId":"C0035","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":["IGK","IGL","CCND1"],"diseases":["mantle cell lymphoma"],"ancestors":["lymphoid neoplasm","B-cell lymphoid neoplasm","mature B-cell neoplasm","mantle cell neoplasm"],"locator":"Mantle cell lymphoma section, line 331","secondary":null,"text":"In cyclin D1-positive mantle cell lymphoma with no detectable CCND1 rearrangement by FISH, cryptic rearrangements of IGK or IGL enhancers with CCND1 can account for cyclin D1 overexpression.","baseSha256":"a712de58321da594212ff97949725a6651ed2626b1c66452ffaf35aff77a5ff9","audit":{"verdict":"pass","basis":"phase3"}},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0036","shortId":"C0036","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":["CCND2","CCND3","CCNE"],"diseases":["mantle cell lymphoma"],"ancestors":["lymphoid neoplasm","B-cell lymphoid neoplasm","mature B-cell neoplasm","mantle cell neoplasm"],"locator":"Mantle cell lymphoma section, line 335","secondary":null,"text":"In cyclin D1-negative, CCND1-rearrangement-negative mantle cell lymphoma, rearrangements of CCND2, CCND3, or CCNE are alternative cell-cycle lesions.","baseSha256":"00df7a0d6164105f63c4c9cf41c123330eaa16ca058bb5ce01e7d5dd5fdd47b6","audit":{"verdict":"pass","basis":"phase3"}},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0037","shortId":"C0037","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"prognosis","tier":"restated secondary","genes":["TP53"],"diseases":["mantle cell lymphoma"],"ancestors":["lymphoid neoplasm","B-cell lymphoid neoplasm","mature B-cell neoplasm","mantle cell neoplasm"],"locator":"Mantle cell lymphoma section, line 335","secondary":null,"text":"TP53 mutation is a best-established biomarker of high-risk mantle cell lymphoma.","baseSha256":"641c0fca40707e2127e02822b2a5645b5905284fa4a07fd9756775a624591b88","audit":{"verdict":"pass","basis":"phase3"}},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0038","shortId":"C0038","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":["SOX11"],"diseases":["leukaemic non-nodal mantle cell lymphoma"],"ancestors":["lymphoid neoplasm","B-cell lymphoid neoplasm","mature B-cell neoplasm","mantle cell neoplasm"],"locator":"Mantle cell lymphoma section, line 337","secondary":null,"text":"Leukaemic non-nodal mantle cell lymphoma is characteristically SOX11-negative, with a low Ki67 index and frequent lack of CD5 expression.","baseSha256":"f0b89deba1761398765159b2399dfeec44014c736a48b603d04eb816e85d0ffb","audit":{"verdict":"pass","basis":"phase3"}},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0039","shortId":"C0039","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["DLBCL, NOS"],"ancestors":["lymphoid neoplasm","B-cell lymphoid neoplasm","mature B-cell neoplasm","large B-cell lymphoma"],"locator":"DLBCL, NOS section, lines 347–353","secondary":null,"text":"According to WHO-HAEM5, DLBCL, NOS continues to include germinal-centre B-cell-like and activated B-cell-like subtypes.","baseSha256":"f420a2b13f780ae2ff9b285b82aae0242a56a07098fbdcd98f03f0d0bbaab728","audit":{"verdict":"pass","basis":"phase3"}},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0040","shortId":"C0040","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["DLBCL, NOS"],"ancestors":["lymphoid neoplasm","B-cell lymphoid neoplasm","mature B-cell neoplasm","large B-cell lymphoma"],"locator":"DLBCL, NOS section, lines 349–353","secondary":null,"text":"According to WHO-HAEM5, proposed NGS-based molecular classifications are not incorporated into DLBCL, NOS because no unified genetic framework is established and their outcome and targeted-treatment implications remain unclear.","baseSha256":"8758c75e4fd25165f1ffe1739a2545b66f21d3ab4119ff3282456b83277ec8a7","audit":{"verdict":"pass","basis":"phase3"}},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0041","shortId":"C0041","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":["MYC","BCL2"],"diseases":["DLBCL/HGBL-MYC/BCL2"],"ancestors":["lymphoid neoplasm","B-cell lymphoid neoplasm","mature B-cell neoplasm","large B-cell lymphoma"],"locator":"Large B-cell lymphoma section, line 357","secondary":null,"text":"According to WHO-HAEM5, DLBCL/HGBL-MYC/BCL2 is defined by dual MYC and BCL2 rearrangements and can have large-cell, intermediate-cell, or blastoid morphology.","baseSha256":"f7f2d4ff5b4f7f1280027f48e958962bff517791eae4b8e4f369e93d4bc2dd36","audit":{"verdict":"pass","basis":"phase3"}},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0042","shortId":"C0042","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":["MYC","BCL6"],"diseases":["DLBCL, NOS","HGBL, NOS"],"ancestors":["lymphoid neoplasm","B-cell lymphoid neoplasm","mature B-cell neoplasm","large B-cell lymphoma"],"locator":"Large B-cell lymphoma section, line 357","secondary":null,"text":"According to WHO-HAEM5, lymphoid neoplasms with dual MYC and BCL6 rearrangements are excluded from DLBCL/HGBL-MYC/BCL2 and are classified as DLBCL, NOS or HGBL, NOS according to cytomorphology.","baseSha256":"96374e105432df2c079a301c4a6c4527c233bb249d4ae579a36c29531774751b","audit":{"verdict":"pass","basis":"phase3"}},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0043","shortId":"C0043","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":["MYC"],"diseases":["HGBL-11q"],"ancestors":["lymphoid neoplasm","B-cell lymphoid neoplasm","mature B-cell neoplasm","large B-cell lymphoma"],"locator":"HGBL-11q section, lines 359–361","secondary":null,"text":"According to WHO-HAEM5, HGBL-11q is a MYC-rearrangement-negative mature B-cell lymphoma with Burkitt-like, intermediate, or blastoid morphology and a characteristic 11q gain/loss pattern.","baseSha256":"bf3d91d0450f5018ed21279a5a76fdd99b0717a4d777d782f0905567662234f7","audit":{"verdict":"pass","basis":"phase4_adjudicated"}},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0044","shortId":"C0044","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":["MYC"],"diseases":["HGBL-11q"],"ancestors":["lymphoid neoplasm","B-cell lymphoid neoplasm","mature B-cell neoplasm","large B-cell lymphoma"],"locator":"HGBL-11q section, line 361","secondary":null,"text":"B-cell lymphomas with a Burkitt-like appearance that lack MYC rearrangement should be tested for the characteristic 11q gain/loss pattern of HGBL-11q.","baseSha256":"665af170d97f4a11387b4748ae7de3a1ef69a303b07e9e06ca074d6cf6bf5d3f","audit":{"verdict":"pass","basis":"phase3"}},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0045","shortId":"C0045","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":["MYD88","CD79B"],"diseases":["primary large B-cell lymphoma of immune-privileged sites"],"ancestors":["lymphoid neoplasm","B-cell lymphoid neoplasm","mature B-cell neoplasm","large B-cell lymphoma"],"locator":"Table 4, lines 367–381","secondary":null,"text":"In primary large B-cell lymphoma of immune-privileged sites, concomitant MYD88 and CD79B mutations are a distinctive shared mutational profile across primary CNS, vitreoretinal, and testicular large B-cell lymphomas.","baseSha256":"19cd4be5cceb6404aabda9e2baf1378b0ad25e6d64ee51c8d6381734b368e310","audit":{"verdict":"pass","basis":"phase4_adjudicated"}},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0046","shortId":"C0046","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["fluid overload-associated large B-cell lymphoma"],"ancestors":["lymphoid neoplasm","B-cell lymphoid neoplasm","mature B-cell neoplasm","large B-cell lymphoma"],"locator":"Fluid overload-associated large B-cell lymphoma section, lines 365 and 383","secondary":null,"text":"According to WHO-HAEM5, fluid overload-associated large B-cell lymphoma is distinct from primary effusion lymphoma; fluid overload-associated large B-cell lymphoma is KSHV/HHV8-negative and usually presents as an isolated body-cavity effusion in adults without underlying immunodeficiency.","baseSha256":"bedf4b8251dc06112469bba3f3ce7a0f3cce45acb4e2d72db1802dad7c9d27eb","audit":{"verdict":"pass","basis":"phase3"}},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0047","shortId":"C0047","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["DLBCL, NOS"],"ancestors":["lymphoid neoplasm","B-cell lymphoid neoplasm","mature B-cell neoplasm","large B-cell lymphoma"],"locator":"Mediastinal grey zone lymphoma section, line 385","secondary":null,"text":"According to WHO-HAEM5, cases resembling mediastinal grey zone lymphoma but occurring outside and without mediastinal involvement are better classified as DLBCL, NOS.","baseSha256":"142523bc864b63bb47ebe5c7392203258de3bbf41c7e33911cc14e086ffe2c9a","audit":{"verdict":"pass","basis":"phase3"}},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0048","shortId":"C0048","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":["MYC"],"diseases":["Burkitt lymphoma"],"ancestors":["lymphoid neoplasm","B-cell lymphoid neoplasm","mature B-cell neoplasm"],"locator":"Burkitt lymphoma section, line 391","secondary":null,"text":"According to WHO-HAEM5, Burkitt lymphoma is an aggressive mature B-cell neoplasm with germinal-centre phenotype, very high Ki67, and an IG::MYC juxtaposition.","baseSha256":"4984e0c059de1a3d441cd8dd2b4b66d1915260281232e708e1510c67527039a2","audit":{"verdict":"pass","basis":"phase3"}},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0049","shortId":"C0049","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["Burkitt lymphoma"],"ancestors":["lymphoid neoplasm","B-cell lymphoid neoplasm","mature B-cell neoplasm"],"locator":"Burkitt lymphoma section, lines 391–393","secondary":null,"text":"According to WHO-HAEM5, Burkitt lymphoma should be classified into EBV-positive and EBV-negative subtypes rather than the traditional endemic, sporadic, and immunodeficiency-associated epidemiological variants.","baseSha256":"bd099421894ddc2f4f23da3e89d6bdac91b3a5af4b76a4065c00fda8f3d879e7","audit":{"verdict":"pass","basis":"phase3"}},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0051","shortId":"C0051","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["lymphoid neoplasm"],"ancestors":[],"locator":"Immune deficiency/dysregulation section and Table 5, lines 401–451","secondary":null,"text":"For a lymphoid neoplasm arising in immune deficiency/dysregulation, WHO-HAEM5 uses a three-part nomenclature comprising histological diagnosis, oncogenic-virus status, and the immune-deficiency/dysregulation setting.","baseSha256":"ba01ead083d785559acedbdb56c72d429d5eace29991b0d82461642ba744fefd","audit":{"verdict":"pass","basis":"phase3"}},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0052","shortId":"C0052","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["classic Hodgkin lymphoma"],"ancestors":["lymphoid neoplasm","B-cell lymphoid neoplasm","Hodgkin lymphoma"],"locator":"Classic Hodgkin lymphoma section, line 461","secondary":null,"text":"For classic Hodgkin lymphoma, WHO-HAEM5 advises caution in immune-deficiency/dysregulation settings and in purely extranodal CHL-like proliferations because EBV-positive HRS-like cells can occur in mimics.","baseSha256":"c5118bbd8c6cb5b1642e46b22f5004f6947d1f5b5b7a55517a540434256c4880","audit":{"verdict":"pass","basis":"phase3"}},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0053","shortId":"C0053","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["nodular lymphocyte predominant Hodgkin lymphoma"],"ancestors":["lymphoid neoplasm","B-cell lymphoid neoplasm","Hodgkin lymphoma"],"locator":"NLPHL section, line 463","secondary":null,"text":"According to WHO-HAEM5, nodular lymphocyte predominant Hodgkin lymphoma remains the formal terminology, while “nodular lymphocyte predominant B-cell lymphoma” is an acceptable alternative name in preparation for possible future adoption.","baseSha256":"4fba779c45289f86e49f15665ebd1ba94818caf87472f0ddd1bb4286f458b4fe","audit":{"verdict":"pass","basis":"phase3"}},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0054","shortId":"C0054","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["MGRS"],"ancestors":["lymphoid neoplasm","B-cell lymphoid neoplasm","plasma cell neoplasm/paraprotein disorder","monoclonal gammopathy"],"locator":"Plasma cell neoplasms section, line 471","secondary":null,"text":"According to WHO-HAEM5, monoclonal gammopathy of renal significance (MGRS) is a plasma-cell or B-cell proliferation below accepted malignancy criteria that secretes a monoclonal immunoglobulin or fragment causing kidney injury.","baseSha256":"1a09dd16014366449c2104a4952ca62c18f1e8f895fa5a5f7c7da86eadc74a64","audit":{"verdict":"pass","basis":"phase3"}},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0055","shortId":"C0055","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["TEMPI syndrome"],"ancestors":["lymphoid neoplasm","B-cell lymphoid neoplasm","plasma cell neoplasm/paraprotein disorder","plasma cell neoplasm","plasma cell neoplasm with paraneoplastic syndrome"],"locator":"Plasma cell neoplasms section, lines 467–469","secondary":null,"text":"According to WHO-HAEM5, TEMPI syndrome is included among plasma-cell-neoplasm-associated paraneoplastic syndromes.","baseSha256":"11ed1a391a19ac68c5187f187835e43e1819ec984f963f760d917f1b283a6bf6","audit":{"verdict":"pass","basis":"phase4_adjudicated"}},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0056","shortId":"C0056","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["TEMPI syndrome"],"ancestors":["lymphoid neoplasm","B-cell lymphoid neoplasm","plasma cell neoplasm/paraprotein disorder","plasma cell neoplasm","plasma cell neoplasm with paraneoplastic syndrome"],"locator":"Plasma cell neoplasms section, line 473","secondary":null,"text":"According to WHO-HAEM5, TEMPI syndrome is diagnosed primarily using clinical and imaging investigations.","baseSha256":"c10914df3073860280f0d3a0c2b9b0dce795974d7999a622e151f8abfd035a90","audit":{"verdict":"pass","basis":"phase3"}},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0057","shortId":"C0057","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["T-ALL"],"ancestors":["lymphoid neoplasm","acute lymphoblastic leukaemia/lymphoma","T-cell/NK-cell lymphoid neoplasm","precursor T-cell neoplasm"],"locator":"Tumour-like T-cell lesions section, line 485","secondary":null,"text":"Indolent T-lymphoblastic proliferation may mimic T-ALL because of TdT expression, but typically lacks architectural destruction, marked cytologic atypia, and monoclonal TCR gene rearrangement.","baseSha256":"2d50309cf7866cf4cfc5a88a236fe08f9377a66a0b472b68dbd6f639d2d88c8b","audit":{"verdict":"pass","basis":"phase3"}},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0058","shortId":"C0058","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["T-ALL"],"ancestors":["lymphoid neoplasm","acute lymphoblastic leukaemia/lymphoma","T-cell/NK-cell lymphoid neoplasm","precursor T-cell neoplasm"],"locator":"Precursor T-cell neoplasms section, lines 487–489","secondary":null,"text":"According to WHO-HAEM5, genetically defined T-ALL types are not recognized because current genetic evidence is insufficient to establish clinically relevant genetic subtypes.","baseSha256":"cef0379d50216634fbab1a6687976551172911fe94435b7fc398e515674dfc42","audit":{"verdict":"pass","basis":"phase3"}},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0059","shortId":"C0059","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["acute lymphoblastic leukaemia/lymphoma"],"ancestors":["lymphoid neoplasm"],"locator":"Precursor T-cell neoplasms section, line 489","secondary":null,"text":"Within acute lymphoblastic leukaemia/lymphoma classification, WHO-HAEM5 does not separately list NK-lymphoblastic leukaemia/lymphoma because reliable diagnostic criteria are lacking and there is substantial overlap with other CD56-positive acute neoplasms.","baseSha256":"e84676e99b85251b097e15692229236d7df59c1610f8e54a2a163df7d1773e24","audit":{"verdict":"pass","basis":"phase3"}},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0060","shortId":"C0060","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":["TCL1A","MTCP1"],"diseases":["T-PLL"],"ancestors":["lymphoid neoplasm","T-cell/NK-cell lymphoid neoplasm","mature T-cell/NK-cell neoplasm","mature T-cell/NK-cell leukaemia"],"locator":"T-prolymphocytic leukaemia section, line 497","secondary":null,"text":"Unified diagnostic criteria for T-PLL include T-lymphocytosis above 5 × 10^9/L with appropriate phenotype and T-cell monoclonality plus genetic aberrations with breakpoints affecting TCL1A or MTCP1, or TCL1 expression.","baseSha256":"fcd186b9b505916b9b35f87be7ea1ba8ae0f080fc28483050e0ccac61c29b2f8","audit":{"verdict":"pass","basis":"phase3"}},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0061","shortId":"C0061","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"prognosis","tier":"restated secondary","genes":["STAT3"],"diseases":["T-LGLL"],"ancestors":["lymphoid neoplasm","T-cell/NK-cell lymphoid neoplasm","mature T-cell/NK-cell neoplasm","mature T-cell/NK-cell leukaemia"],"locator":"T-LGLL section, line 497","secondary":null,"text":"In T-LGLL, STAT3 mutation is associated with poorer overall survival.","baseSha256":"64dd448c73cfdb081fb7aad32c4b397ef2fa79759128f31c3a7f656bfb0baee3","audit":{"verdict":"pass","basis":"phase4_adjudicated"}},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0062","shortId":"C0062","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"prognosis","tier":"restated secondary","genes":["STAT5B"],"diseases":["T-LGLL"],"ancestors":["lymphoid neoplasm","T-cell/NK-cell lymphoid neoplasm","mature T-cell/NK-cell neoplasm","mature T-cell/NK-cell leukaemia"],"locator":"T-LGLL section, line 497","secondary":null,"text":"In T-LGLL, STAT5B mutation is associated with poor prognosis in CD8-positive disease but has no prognostic impact in CD4-positive or gamma/delta T-LGLL.","baseSha256":"57c78f3af19e862f61098f0e8b4c2f195d1022a91e38403af932dcdbf80f63e5","audit":{"verdict":"pass","basis":"phase3"}},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0063","shortId":"C0063","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["primary cutaneous T-cell lymphoma"],"ancestors":["lymphoid neoplasm","T-cell/NK-cell lymphoid neoplasm","mature T-cell/NK-cell neoplasm"],"locator":"Primary cutaneous T-cell lymphoma section, lines 503–507","secondary":null,"text":"Because forms of primary cutaneous T-cell lymphoma overlap morphologically and immunophenotypically, WHO-HAEM5 regards clinical correlation, dermatological examination, and photographic documentation as indispensable to correct diagnosis.","baseSha256":"0d54942c0c572a93b6a7c6f66636743f2db8cdeb26b0d76f200b4715d2bf5b85","audit":{"verdict":"pass","basis":"phase3"}},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0064","shortId":"C0064","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":["JAK3"],"diseases":["indolent NK-cell lymphoproliferative disorder of the gastrointestinal tract"],"ancestors":["lymphoid neoplasm","T-cell/NK-cell lymphoid neoplasm","mature T-cell/NK-cell neoplasm","intestinal T-cell/NK-cell lymphoid neoplasm"],"locator":"Intestinal T/NK-cell section, line 511","secondary":null,"text":"In indolent NK-cell lymphoproliferative disorder of the gastrointestinal tract, recurrent somatic JAK3 mutations support its neoplastic classification rather than a reactive process.","baseSha256":"5b8b6688492d03a79665174352f5ff254609ce43440c28ef53ed7bedb739063b","audit":{"verdict":"pass","basis":"phase3"}},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0065","shortId":"C0065","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["indolent NK-cell lymphoproliferative disorder of the gastrointestinal tract"],"ancestors":["lymphoid neoplasm","T-cell/NK-cell lymphoid neoplasm","mature T-cell/NK-cell neoplasm","intestinal T-cell/NK-cell lymphoid neoplasm"],"locator":"Intestinal T/NK-cell section, line 511","secondary":null,"text":"Indolent NK-cell lymphoproliferative disorder of the gastrointestinal tract should not be misdiagnosed as extranodal NK/T-cell lymphoma; lack of EBV is a crucial differential feature supporting the indolent NK-cell lymphoproliferative disorder diagnosis.","baseSha256":"d9210a3e43e435e9bcf47605e54c7ffa3bc4f57bff2b3d8a85e9335a9a6d6c26","audit":{"verdict":"pass","basis":"phase3"}},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0066","shortId":"C0066","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"prognosis","tier":"restated secondary","genes":["TP63","TP53"],"diseases":["ALK-negative anaplastic large cell lymphoma"],"ancestors":["lymphoid neoplasm","T-cell/NK-cell lymphoid neoplasm","mature T-cell/NK-cell neoplasm","anaplastic large cell lymphoma"],"locator":"ALK-negative ALCL section, line 637","secondary":null,"text":"In ALK-negative anaplastic large cell lymphoma, TP63 rearrangement and loss of TP53 are associated with poor outcome.","baseSha256":"5c31931aa5f142b9f500d3cfc9974589c606a3ae93b69fafe998f9c86b17826d","audit":{"verdict":"pass","basis":"phase3"}},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0069","shortId":"C0069","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["nodal TFH cell lymphoma"],"ancestors":["lymphoid neoplasm","T-cell/NK-cell lymphoid neoplasm","mature T-cell/NK-cell neoplasm"],"locator":"Nodal TFH lymphoma section, line 651","secondary":null,"text":"According to WHO-HAEM5, the TFH phenotype in nodal TFH cell lymphoma is defined by at least two TFH markers in addition to CD4.","baseSha256":"9035cfd3df87ec3940db24be0eff12f78f59998a189fc3e6ea9305c2ff6799c1","audit":{"verdict":"pass","basis":"phase3"}},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0070","shortId":"C0070","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["nodal TFH cell lymphoma"],"ancestors":["lymphoid neoplasm","T-cell/NK-cell lymphoid neoplasm","mature T-cell/NK-cell neoplasm"],"locator":"Nodal TFH lymphoma section, line 651","secondary":null,"text":"For difficult nodal TFH cell lymphoma diagnoses, WHO-HAEM5 recommends an integrated approach using clinical, morphologic, and immunophenotypic features, with genomic input for clonality and mutational profiles.","baseSha256":"2413a029385680dabf781ec202dfb4d649c600bb4c172d6b6436aaee72f7b8a9","audit":{"verdict":"pass","basis":"phase3"}},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0072","shortId":"C0072","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["EBV-positive nodal T/NK-cell lymphoma"],"ancestors":["lymphoid neoplasm","T-cell/NK-cell lymphoid neoplasm","mature T-cell/NK-cell neoplasm","EBV-positive T/NK-cell lymphoma"],"locator":"Nodal EBV-positive T/NK-cell lymphoma section, lines 657–661","secondary":null,"text":"According to WHO-HAEM5, EBV-positive nodal T/NK-cell lymphoma is a distinct entity rather than a peripheral T-cell lymphoma, NOS subtype, and EBV positivity is required by definition.","baseSha256":"7b43d8a0860614a3fc448dbf75f1147217193ecfe179b34d7f342e984c5e0025","audit":{"verdict":"pass","basis":"phase3"}},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0073","shortId":"C0073","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"germline","tier":"restated secondary","genes":["ATM"],"diseases":[],"ancestors":[],"locator":"Genetic predisposition syndromes section, line 677","secondary":null,"text":"Ataxia telangiectasia is a lymphoid-neoplasm-relevant inherited predisposition syndrome linked to germline ATM mutations.","baseSha256":"a5c9f251f474b276d0a5c256646414ad7cfe79a2cc164b06e1aedc6b6fd37e6c","audit":{"verdict":"pass","basis":"phase3"}},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0074","shortId":"C0074","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"germline","tier":"restated secondary","genes":["NBN"],"diseases":[],"ancestors":[],"locator":"Genetic predisposition syndromes section, line 677","secondary":null,"text":"Nijmegen breakage syndrome is a lymphoid-neoplasm-relevant inherited predisposition syndrome linked to germline NBN mutations.","baseSha256":"5d4e20a4949b944394c910effb589a72c6e3c0d1ec6adc69539dd6e703f47329","audit":{"verdict":"pass","basis":"phase3"}},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0075","shortId":"C0075","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":["ATM"],"diseases":["lymphoid neoplasm"],"ancestors":[],"locator":"Genetic predisposition syndromes section, line 677","secondary":null,"text":"In a lymphoid neoplasm arising in a patient with ataxia telangiectasia due to germline ATM predisposition, leukaemias and lymphomas should be diagnosed by conventional criteria and designated “AT-related”.","baseSha256":"a075088339ba8d4c16027af3a7fe55327ebd7723f294b8d5275c2fcb572eebc5","audit":{"verdict":"pass","basis":"phase3"}},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0076","shortId":"C0076","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":["NBN"],"diseases":["lymphoid neoplasm"],"ancestors":[],"locator":"Genetic predisposition syndromes section, line 677","secondary":null,"text":"In a lymphoid neoplasm arising in a patient with Nijmegen breakage syndrome due to germline NBN predisposition, leukaemias and lymphomas should be diagnosed by conventional criteria and designated “NBS-related”.","baseSha256":"ad80455877ecccacbc83142f252e9b8d14c74bac12b45cf55ec312e9abc246e7","audit":{"verdict":"pass","basis":"phase3"}},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0077","shortId":"C0077","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"treatment","tier":"restated secondary","genes":["ATM"],"diseases":["lymphoid neoplasm"],"ancestors":[],"locator":"Genetic predisposition syndromes section, line 677","secondary":null,"text":"In a lymphoid neoplasm associated with germline ATM predisposition causing ataxia telangiectasia, recognition of the syndrome is clinically important for treatment planning because of increased toxicities.","baseSha256":"284b9f56d04fee681e703f2bf9f8d8321f52ce5565e6166ecbe1fbea2b10c9d7","audit":{"verdict":"pass","basis":"phase3"}},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0078","shortId":"C0078","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"treatment","tier":"restated secondary","genes":["NBN"],"diseases":["lymphoid neoplasm"],"ancestors":[],"locator":"Genetic predisposition syndromes section, line 677","secondary":null,"text":"In a lymphoid neoplasm associated with germline NBN predisposition causing Nijmegen breakage syndrome, recognition of the syndrome is clinically important for treatment planning because of increased toxicities.","baseSha256":"98bf12335c1ec16941fa0dd92835ee16ab09cbc84007b51169e27b1d30375257","audit":{"verdict":"pass","basis":"phase3"}},{"id":"alaggio-2022-leu hoid neoplasm","mature T-cell/NK-cell neoplasm","primary cutaneous T-cell lymphoma"],"locator":"Primary cutaneous T-cell lymphoma section, lines 503–505","secondary":null,"text":"According to WHO-HAEM5, primary cutaneous peripheral T-cell lymphoma, NOS is a new entity for rare primary cutaneous T-cell lymphoma cases that do not fit other recognized cutaneous T-cell lymphoma entities.","baseSha256":"ef3c2eb10f1258c85c1a7a44dc14e49d3ac7503d603fdfb2086d250b58a05ba4","audit":{"verdict":"pass","basis":"phase3"}},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0096","shortId":"C0096","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["indolent T-cell lymphoma of the gastrointestinal tract"],"ancestors":["lymphoid neoplasm","T-cell/NK-cell lymphoid neoplasm","mature T-cell/NK-cell neoplasm","intestinal T-cell/NK-cell lymphoid neoplasm"],"locator":"Intestinal T/NK-cell section, line 511","secondary":null,"text":"According to WHO-HAEM5, indolent T-cell lymphoproliferative disorder of the gastrointestinal tract is renamed indolent T-cell lymphoma of the gastrointestinal tract.","baseSha256":"0df73c0dc5f16a1cda0490ca3de55eb818ea4d3d174f9f8aa558c33ae7c3d5ff","audit":{"verdict":"pass","basis":"phase3"}},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0097","shortId":"C0097","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["indolent NK-cell lymphoproliferative disorder of the gastrointestinal tract"],"ancestors":["lymphoid neoplasm","T-cell/NK-cell lymphoid neoplasm","mature T-cell/NK-cell neoplasm","intestinal T-cell/NK-cell lymphoid neoplasm"],"locator":"Intestinal T/NK-cell section, line 511","secondary":null,"text":"According to WHO-HAEM5, indolent NK-cell lymphoproliferative disorder of the gastrointestinal tract is a new entity.","baseSha256":"8c45c58125c67c7b4bfdd770dc5218413b8e9f2678686166607828d5c944d3fc","audit":{"verdict":"pass","basis":"p
