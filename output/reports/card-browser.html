n in primary myelofibrosis in transplant-age patients (≤70 years)."},{"id":"tefferi-2018-journal-of-clinical-oncology-36-1769-C0003","paper":"tefferi-2018-journal-of-clinical-oncology-36-1769","category":"prognosis","tier":"restated secondary","genes":["U2AF1"],"diseases":["PMF"],"text":"According to MIPSS70+ Version 2.0, U2AF1 Q157 is an additional high molecular risk mutation in primary myelofibrosis."},{"id":"tefferi-2018-journal-of-clinical-oncology-36-1769-C0004","paper":"tefferi-2018-journal-of-clinical-oncology-36-1769","category":"prognosis","tier":"multivariable-adjusted","genes":["ASXL1","SRSF2","EZH2","IDH1","IDH2","U2AF1"],"diseases":["PMF"],"text":"According to MIPSS70+ Version 2.0, in patients aged ≤70 years with primary myelofibrosis, the presence of one high molecular risk mutation among ASXL1, SRSF2, EZH2, IDH1, IDH2, or U2AF1 Q157 is associated with inferior overall survival."},{"id":"tefferi-2018-journal-of-clinical-oncology-36-1769-C0005","paper":"tefferi-2018-journal-of-clinical-oncology-36-1769","category":"prognosis","tier":"multivariable-adjusted","genes":["ASXL1","SRSF2","EZH2","IDH1","IDH2","U2AF1"],"diseases":["PMF"],"text":"According to MIPSS70+ Version 2.0, in patients aged ≤70 years with primary myelofibrosis, the presence of two or more high molecular risk mutations among ASXL1, SRSF2, EZH2, IDH1, IDH2, or U2AF1 Q157 is associated with inferior overall survival."},{"id":"tefferi-2018-journal-of-clinical-oncology-36-1769-C0006","paper":"tefferi-2018-journal-of-clinical-oncology-36-1769","category":"prognosis","tier":"multivariable-adjusted","genes":["CALR"],"diseases":["PMF"],"text":"According to MIPSS70+ Version 2.0, in patients aged ≤70 years with primary myelofibrosis, absence of a CALR type 1/like mutation is associated with inferior overall survival."},{"id":"tefferi-2020-mipss-et-pv-C0001","paper":"tefferi-2020-mipss-et-pv","category":"prognosis","tier":"multivariable-adjusted","genes":["SF3B1","SRSF2"],"diseases":["ET"],"text":"In essential thrombocythaemia, SF3B1 or SRSF2 mutation is associated with inferior overall survival."},{"id":"tefferi-2020-mipss-et-pv-C0002","paper":"tefferi-2020-mipss-et-pv","category":"prognosis","tier":"multivariable-adjusted","genes":["SF3B1","U2AF1"],"diseases":["ET"],"text":"In essential thrombocythaemia, SF3B1 or U2AF1 mutation is associated with increased risk of fibrotic progression."},{"id":"tefferi-2020-mipss-et-pv-C0003","paper":"tefferi-2020-mipss-et-pv","category":"prognosis","tier":"multivariable-adjusted","genes":["TP53"],"diseases":["ET"],"text":"In essential thrombocythaemia, TP53 mutation predicts leukaemic transformation."},{"id":"tefferi-2020-mipss-et-pv-C0004","paper":"tefferi-2020-mipss-et-pv","category":"prognosis","tier":"multivariable-adjusted","genes":["SRSF2"],"diseases":["PV"],"text":"In polycythaemia vera, SRSF2 mutation is associated with inferior overall survival."},{"id":"tefferi-2020-mipss-et-pv-C0005","paper":"tefferi-2020-mipss-et-pv","category":"prognosis","tier":"univariable or descriptive","genes":["SRSF2"],"diseases":["PV"],"text":"In polycythaemia vera, SRSF2 mutation is associated with inferior leukaemia-free survival."},{"id":"tefferi-2020-mipss-et-pv-C0014","paper":"tefferi-2020-mipss-et-pv","category":"prognosis","tier":"multivariable-adjusted","genes":["SRSF2","SF3B1","U2AF1","TP53"],"diseases":["ET"],"text":"In essential thrombocythaemia, the study-defined adverse-mutation group comprising SRSF2, SF3B1, U2AF1 and TP53 independently identifies patients with inferior overall survival."},{"id":"tefferi-2020-mipss-et-pv-C0018","paper":"tefferi-2020-mipss-et-pv","category":"prognosis","tier":"univariable or descriptive","genes":["JAK2"],"diseases":["ET","PV"],"text":"JAK2 mutation is associated with venous thrombosis in both essential thrombocythaemia and polycythaemia vera."},{"id":"tefferi-2020-mipss-et-pv-C0020","paper":"tefferi-2020-mipss-et-pv","category":"prognosis","tier":"restated secondary","genes":["MPL"],"diseases":["ET"],"text":"In essential thrombocythaemia, MPL mutation has been associated with increased risk of fibrotic transformation."},{"id":"tefferi-2020-mipss-et-pv-C0021","paper":"tefferi-2020-mipss-et-pv","category":"prognosis","tier":"restated secondary","genes":["CALR"],"diseases":["PMF"],"text":"In primary myelofibrosis, type 1-like CALR mutation is associated with favourable survival."},{"id":"tefferi-2020-mipss-et-pv-C0022","paper":"tefferi-2020-mipss-et-pv","category":"prognosis","tier":"restated secondary","genes":["ASXL1","SRSF2","U2AF1","EZH2","IDH1","IDH2"],"diseases":["PMF"],"text":"In primary myelofibrosis, high-molecular-risk mutations involving ASXL1, SRSF2, U2AF1 Q157, EZH2, IDH1 or IDH2 are associated with adverse survival."},{"id":"tefferi-2020-mipss-et-pv-C0023","paper":"tefferi-2020-mipss-et-pv","category":"prognosis","tier":"restated secondary","genes":["JAK2"],"diseases":["ET"],"text":"In essential thrombocythaemia, JAK2 mutation has been associated with increased thrombosis risk."},{"id":"urrutia-2025-tp53-myeloid-C0002","paper":"urrutia-2025-tp53-myeloid","category":"diagnosis","tier":"restated secondary","genes":["TP53"],"diseases":["AML","MDS"],"text":"In TP53-mutated AML/MDS, findings supporting multihit TP53 status include TP53 cnLOH demonstrated by dedicated testing; loss of chromosome 17 or 17p; two or more TP53 mutations; or a single TP53 mutation with VAF >55% and sequencing coverage >200×. A TP53 VAF <55% does not exclude multihit disease."},{"id":"urrutia-2025-tp53-myeloid-C0003","paper":"urrutia-2025-tp53-myeloid","category":"diagnosis","tier":"restated secondary","genes":["TP53"],"diseases":["AML","MDS"],"text":"In TP53-mutated AML/MDS, complex karyotype may suggest multihit TP53 status but is an imperfect surrogate: some TP53-mutated cases with complex karyotype lack chromosome 17 deletion or TP53 cnLOH, whereas some cases with TP53 cnLOH have noncomplex karyotypes."},{"id":"urrutia-2025-tp53-myeloid-C0007","paper":"urrutia-2025-tp53-myeloid","category":"diagnosis","tier":"restated secondary","genes":["TP53"],"diseases":["MDS"],"text":"According to WHO 2022 as summarized by Urrutia et al., MDS with biallelic TP53 inactivation has <20% blasts and no history of cytotoxic or radiation therapy; biallelic TP53 inactivation is defined by two or more TP53 mutations, one TP53 mutation with chromosome 17/17p copy loss, or one TP53 mutation with TP53 cnLOH."},{"id":"urrutia-2025-tp53-myeloid-C0016","paper":"urrutia-2025-tp53-myeloid","category":"prognosis","tier":"restated secondary","genes":["TP53"],"diseases":["AML"],"text":"In TP53-mutated AML undergoing transplantation, complex karyotype is associated with inferior overall survival compared with absence of complex karyotype."},{"id":"urrutia-2025-tp53-myeloid-C0022","paper":"urrutia-2025-tp53-myeloid","category":"prognosis","tier":"restated secondary","genes":["TP53"],"diseases":["AML"],"text":"In TP53-mutated AML, specific TP53 mutation identity is not currently recommended for prognostication."},{"id":"ustun-2025-systemic-mastocytosis-pdf-C0009","paper":"ustun-2025-systemic-mastocytosis-pdf","category":"diagnosis","tier":"restated secondary","genes":["KIT"],"diseases":["mastocytosis"],"text":"Detection of KIT D816V or another activating KIT mutation in bone marrow, peripheral blood, or another extracutaneous organ is a minor diagnostic criterion for systemic mastocytosis."},{"id":"ustun-2025-systemic-mastocytosis-pdf-C0018","paper":"ustun-2025-systemic-mastocytosis-pdf","category":"diagnosis","tier":"restated secondary","genes":["KIT"],"diseases":["mastocytosis"],"text":"For systemic mastocytosis, KIT D816V variant allele fraction of at least 10% in bone marrow or peripheral-blood leukocytes is a WHO B-finding used in smoldering systemic mastocytosis classification; ICC does not use this molecular B-finding."},{"id":"ustun-2025-systemic-mastocytosis-pdf-C0032","paper":"ustun-2025-systemic-mastocytosis-pdf","category":"diagnosis","tier":"restated secondary","genes":["KIT"],"diseases":["mastocytosis"],"text":"In a patient with elevated basal serum tryptase, detection of KIT D816V increases the likelihood of systemic mastocytosis."},{"id":"ustun-2025-systemic-mastocytosis-pdf-C0033","paper":"ustun-2025-systemic-mastocytosis-pdf","category":"diagnosis","tier":"restated secondary","genes":["KIT"],"diseases":["mastocytosis"],"text":"When an associated hematologic neoplasm may obscure systemic mastocytosis, an NGS-detected KIT mutation should prompt bone-marrow reevaluation for occult SM-AHN."},{"id":"ustun-2025-systemic-mastocytosis-pdf-C0034","paper":"ustun-2025-systemic-mastocytosis-pdf","category":"diagnosis","tier":"restated secondary","genes":["KIT"],"diseases":["mastocytosis"],"text":"KIT D816V negativity alone does not exclude well-differentiated systemic mastocytosis because non-D816V KIT variants or no detectable KIT mutation can occur in this subtype."},{"id":"ustun-2025-systemic-mastocytosis-pdf-C0035","paper":"ustun-2025-systemic-mastocytosis-pdf","category":"diagnosis","tier":"restated secondary","genes":["KIT"],"diseases":["mastocytosis"],"text":"KIT D816V negativity alone does not exclude mast-cell leukemia within systemic mastocytosis because non-D816V KIT variants or no detectable KIT mutation can occur in this subtype."},{"id":"ustun-2025-systemic-mastocytosis-pdf-C0036","paper":"ustun-2025-systemic-mastocytosis-pdf","category":"diagnosis","tier":"restated secondary","genes":["KIT"],"diseases":["mastocytosis"],"text":"KIT D816V negativity alone does not exclude aggressive systemic mastocytosis because non-D816V KIT variants or no detectable KIT mutation can occur in this subtype."},{"id":"ustun-2025-systemic-mastocytosis-pdf-C0037","paper":"ustun-2025-systemic-mastocytosis-pdf","category":"diagnosis","tier":"restated secondary","genes":["KIT"],"diseases":["mastocytosis"],"text":"In systemic mastocytosis evaluation, CD117/KIT and mast-cell tryptase identify mast cells but cannot establish a neoplastic mast-cell phenotype because they do not distinguish abnormal from normal mast cells."},{"id":"ustun-2025-systemic-mastocytosis-pdf-C0042","paper":"ustun-2025-systemic-mastocytosis-pdf","category":"diagnosis","tier":"restated secondary","genes":["KIT"],"diseases":["mastocytosis"],"text":"In systemic mastocytosis evaluation, mast-cell tryptase and CD117/KIT should both be assessed because neoplastic mast cells can degranulate and show weak or absent tryptase staining while retaining strong CD117/KIT staining."},{"id":"ustun-2025-systemic-mastocytosis-pdf-C0047","paper":"ustun-2025-systemic-mastocytosis-pdf","category":"diagnosis","tier":"restated secondary","genes":["KIT"],"diseases":["mastocytosis"],"text":"In an eosinophilic patient with systemic mastocytosis being evaluated for an associated hematologic neoplasm, a myeloid/lymphoid neoplasm with eosinophilia and tyrosine-kinase fusion must be excluded if no KIT mutation is detected."},{"id":"ustun-2025-systemic-mastocytosis-pdf-C0048","paper":"ustun-2025-systemic-mastocytosis-pdf","category":"diagnosis","tier":"restated secondary","genes":["KIT","PDGFR"],"diseases":["mastocytosis"],"text":"Rare true systemic mastocytosis with an associated eosinophil neoplasm can harbor both a KIT mutation and a PDGFR rearrangement, so detection of both abnormalities does not by itself exclude coexistence of systemic mastocytosis and the eosinophil neoplasm."},{"id":"ustun-2025-systemic-mastocytosis-pdf-C0056","paper":"ustun-2025-systemic-mastocytosis-pdf","category":"diagnosis","tier":"restated secondary","genes":["KIT"],"diseases":["mastocytosis"],"text":"Bone-marrow immunohistochemistry for systemic mastocytosis should include mast-cell tryptase, CD117/KIT, CD2, CD25, and CD30."},{"id":"ustun-2025-systemic-mastocytosis-pdf-C0062","paper":"ustun-2025-systemic-mastocytosis-pdf","category":"prognosis","tier":"restated secondary","genes":["KIT"],"diseases":["mastocytosis"],"text":"Multilineage KIT involvement is an independent poor prognostic factor in indolent systemic mastocytosis."},{"id":"ustun-2025-systemic-mastocytosis-pdf-C0063","paper":"ustun-2025-systemic-mastocytosis-pdf","category":"prognosis","tier":"restated secondary","genes":["KIT"],"diseases":["mastocytosis"],"text":"In nonadvanced systemic mastocytosis, KIT variant allele fraction of at least 6% is associated with inferior overall survival compared with lower KIT variant allele fraction."},{"id":"ustun-2025-systemic-mastocytosis-pdf-C0064","paper":"ustun-2025-systemic-mastocytosis-pdf","category":"prognosis","tier":"restated secondary","genes":["KIT"],"diseases":["mastocytosis"],"text":"In patients with systemic mastocytosis undergoing allogeneic hematopoietic cell transplantation, absence of a KIT mutation is associated with unfavorable survival."},{"id":"ustun-2025-systemic-mastocytosis-pdf-C0068","paper":"ustun-2025-systemic-mastocytosis-pdf","category":"treatment","tier":"restated secondary","genes":["KIT"],"diseases":["mastocytosis"],"text":"Imatinib is FDA-approved for systemic mastocytosis with wild-type KIT."},{"id":"ustun-2025-systemic-mastocytosis-pdf-C0069","paper":"ustun-2025-systemic-mastocytosis-pdf","category":"treatment","tier":"restated secondary","genes":["KIT"],"diseases":["mastocytosis"],"text":"Imatinib is ineffective in KIT D816V-mutated systemic mastocytosis."},{"id":"ustun-2025-systemic-mastocytosis-pdf-C0073","paper":"ustun-2025-systemic-mastocytosis-pdf","category":"treatment","tier":"restated secondary","genes":["KIT"],"diseases":["mastocytosis"],"text":"Avapritinib, a KIT D816V-selective inhibitor, is FDA-approved for advanced systemic mastocytosis."},{"id":"ustun-2025-systemic-mastocytosis-pdf-C0102","paper":"ustun-2025-systemic-mastocytosis-pdf","category":"biomarker","tier":"restated secondary","genes":["KIT"],"diseases":["mastocytosis"],"text":"When systemic mastocytosis is morphologically present but standard NGS is negative for KIT, high-sensitivity KIT D816V testing with droplet-digital or allele-specific PCR capable of detecting variants below about 0.1% VAF should be performed to avoid false-negative results."},{"id":"ustun-2025-systemic-mastocytosis-pdf-C0107","paper":"ustun-2025-systemic-mastocytosis-pdf","category":"biomarker","tier":"restated secondary","genes":["KIT"],"diseases":["mastocytosis"],"text":"KIT D816V is often detectable even when systemic mastocytosis is morphologically occult, supporting KIT testing as a means of uncovering otherwise hidden systemic mastocytosis."},{"id":"ustun-2025-systemic-mastocytosis-pdf-C0109","paper":"ustun-2025-systemic-mastocytosis-pdf","category":"germline","tier":"restated secondary","genes":["TPSAB1"],"diseases":[],"text":"Increased germline TPSAB1 copy number causes hereditary alpha-tryptasemia and can elevate basal serum tryptase."},{"id":"vainchenker-2017-mpn-C0001","paper":"vainchenker-2017-mpn","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["PV"],"text":"Polycythemia vera is characterized by erythrocytosis with predominant erythroid-lineage involvement and may also show variable megakaryocytic and granulocytic hyperplasia."},{"id":"vainchenker-2017-mpn-C0002","paper":"vainchenker-2017-mpn","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["ET"],"text":"Essential thrombocythemia is characterized by an increased platelet count with megakaryocytic hyperplasia."},{"id":"vainchenker-2017-mpn-C0003","paper":"vainchenker-2017-mpn","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["PMF"],"text":"Primary myelofibrosis is defined by bone marrow fibrosis with megakaryocytic hyperplasia."},{"id":"vainchenker-2017-mpn-C0004","paper":"vainchenker-2017-mpn","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["PMF"],"text":"Prefibrotic or early primary myelofibrosis can present with an essential-thrombocythemia phenotype at diagnosis but is distinguished by typical primary-myelofibrosis bone marrow histology."},{"id":"vainchenker-2017-mpn-C0005","paper":"vainchenker-2017-mpn","category":"diagnosis","tier":"restated secondary","genes":["JAK2"],"diseases":["MPN"],"text":"JAK2 V617F supports a classical myeloproliferative neoplasm but is not specific to classical myeloproliferative neoplasms because it can occur in other hematologic malignancies and at very low levels in otherwise healthy individuals or age-related clonal hematopoiesis."},{"id":"vainchenker-2017-mpn-C0006","paper":"vainchenker-2017-mpn","category":"diagnosis","tier":"restated secondary","genes":["JAK2"],"diseases":["PV","ET","PMF"],"text":"A JAK2 exon 12 mutation favors polycythemia vera, particularly in JAK2 V617F-negative disease, and is not usually associated with essential thrombocythemia or primary myelofibrosis."},{"id":"vainchenker-2017-mpn-C0007","paper":"vainchenker-2017-mpn","category":"diagnosis","tier":"restated secondary","genes":["MPL"],"diseases":["ET","PMF"],"text":"MPL W515 mutations support essential thrombocythemia or primary myelofibrosis but can also occur in refractory anemia with ring sideroblasts and thrombocytosis."},{"id":"vainchenker-2017-mpn-C0008","paper":"vainchenker-2017-mpn","category":"diagnosis","tier":"restated secondary","genes":["MPL"],"diseases":["ET"],"text":"An acquired somatic MPL S505N mutation can support a diagnosis of essential thrombocythemia, although this is a rare finding."},{"id":"vainchenker-2017-mpn-C0009","paper":"vainchenker-2017-mpn","category":"diagnosis","tier":"restated secondary","genes":["MPL","JAK2","CALR"],"diseases":["ET"],"text":"In essential thrombocythemia negative for JAK2 V617F, CALR, MPL W515, and MPL S505N, a noncanonical MPL mutation such as S204, E230, or Y591 is more often acquired and supports a true acquired myeloproliferative neoplasm."},{"id":"vainchenker-2017-mpn-C0010","paper":"vainchenker-2017-mpn","category":"diagnosis","tier":"restated secondary","genes":["CALR","JAK2","MPL"],"diseases":["ET","PMF"],"text":"CALR exon 9 frameshift mutations support essential thrombocythemia or primary myelofibrosis in disease negative for JAK2 and MPL driver mutations."},{"id":"vainchenker-2017-mpn-C0011","paper":"vainchenker-2017-mpn","category":"diagnosis","tier":"restated secondary","genes":["CALR"],"diseases":["MPN"],"text":"In myeloproliferative neoplasms, at the time of this review, only CALR exon 9 mutations generating the characteristic +1 reading frame were known to be pathogenic."},{"id":"vainchenker-2017-mpn-C0012","paper":"vainchenker-2017-mpn","category":"diagnosis","tier":"restated secondary","genes":["SH2B3"],"diseases":["MPN"],"text":"SH2B3 (LNK) mutations are not established primary driver mutations for myeloproliferative neoplasms."},{"id":"vainchenker-2017-mpn-C0013","paper":"vainchenker-2017-mpn","category":"diagnosis","tier":"restated secondary","genes":["JAK2","CALR","MPL"],"diseases":["PMF","MDS"],"text":"Rare primary myelofibrosis lacking JAK2, CALR, and MPL driver mutations is described by the review as more likely to represent myelodysplastic syndrome with secondary fibrosis."},{"id":"vainchenker-2017-mpn-C0014","paper":"vainchenker-2017-mpn","category":"diagnosis","tier":"restated secondary","genes":["MPL","JAK2","CALR"],"diseases":["ET"],"text":"In essential thrombocythemia negative for JAK2 V617F, CALR, and canonical MPL driver mutations, finding a germline noncanonical MPL variant strongly suggests hereditary thrombocytosis rather than an acquired myeloproliferative neoplasm."},{"id":"vainchenker-2017-mpn-C0015","paper":"vainchenker-2017-mpn","category":"diagnosis","tier":"restated secondary","genes":["JAK2"],"diseases":["PV","ET","PMF"],"text":"JAK2 V617F is associated with polycythemia vera, essential thrombocythemia, and primary myelofibrosis."},{"id":"vainchenker-2017-mpn-C0018","paper":"vainchenker-2017-mpn","category":"prognosis","tier":"restated secondary","genes":["ASXL1"],"diseases":["PMF"],"text":"In primary myelofibrosis, ASXL1 mutation is associated with worse prognosis irrespective of International Prognostic Scoring System (iPSS) classification."},{"id":"vainchenker-2017-mpn-C0019","paper":"vainchenker-2017-mpn","category":"biomarker","tier":"restated secondary","genes":["CALR"],"diseases":["ET"],"text":"In essential thrombocythemia, myeloperoxidase deficiency detected by a flow-cytometer-based hematology analyzer can raise suspicion for a homozygous CALR mutation."},{"id":"vainchenker-2017-mpn-C0020","paper":"vainchenker-2017-mpn","category":"biomarker","tier":"restated secondary","genes":["CALR"],"diseases":["ET"],"text":"In essential thrombocythemia, the generally high variant allele fraction of mutant CALR facilitates molecular detection."},{"id":"vainchenker-2017-mpn-C0021","paper":"vainchenker-2017-mpn","category":"biomarker","tier":"restated secondary","genes":["JAK2"],"diseases":["PV"],"text":"In polycythemia vera, JAK2 exon 12 mutations can occur at low variant allele fraction in granulocytes, so their detection may require specific sensitive techniques."},{"id":"vainchenker-2017-mpn-C0022","paper":"vainchenker-2017-mpn","category":"germline","tier":"restated secondary","genes":["MPL"],"diseases":[],"text":"MPL S505N can be a germline cause of hereditary thrombocytosis."},{"id":"vainchenker-2017-mpn-C0023","paper":"vainchenker-2017-mpn","category":"germline","tier":"restated secondary","genes":["MPL","JAK2","CALR"],"diseases":["ET"],"text":"In essential thrombocythemia negative for JAK2 V617F, CALR, and canonical MPL driver mutations, a noncanonical MPL variant can be germline."},{"id":"vainchenker-2017-mpn-C0024","paper":"vainchenker-2017-mpn","category":"germline","tier":"restated secondary","genes":["CALR"],"diseases":[],"text":"At the time of this review, CALR variants considered nonpathogenic and outside the pathogenic +1-reading-frame class were usually germline variants."},{"id":"vainchenker-2017-mpn-C0025","paper":"vainchenker-2017-mpn","category":"germline","tier":"restated secondary","genes":["SH2B3"],"diseases":["MPN"],"text":"Some SH2B3 (LNK) variants, including E208Q, can be germline predisposition variants rather than primary myeloproliferative neoplasm drivers."},{"id":"vainchenker-2017-mpn-C0026","paper":"vainchenker-2017-mpn","category":"germline","tier":"restated secondary","genes":["JAK2","TERT","MECOM","SH2B3","CHEK2","PINT","GFI1B"],"diseases":["MPN"],"text":"Common susceptibility alleles involving JAK2, including the 46/1 haplotype, TERT, MECOM, SH2B3, CHEK2, PINT, and GFI1B confer modest inherited predisposition to myeloproliferative neoplasms, with reported risk increases of approximately twofold to sixfold."},{"id":"vainchenker-2017-mpn-C0027","paper":"vainchenker-2017-mpn","category":"germline","tier":"restated secondary","genes":["RBBP6"],"diseases":["MPN"],"text":"RBBP6 mutations have been identified in families with myelofibrosis as a familial myeloproliferative neoplasm predisposition finding."},{"id":"vainchenker-2017-mpn-C0028","paper":"vainchenker-2017-mpn","category":"germline","tier":"restated secondary","genes":["ATG2B","GSKIP"],"diseases":["MPN"],"text":"A familial six-gene copy-number variation including ATG2B and GSKIP has been identified in myeloproliferative neoplasm families as an inherited predisposition finding."},{"id":"weeks-2023-nejm-evidence-2-na-C0001","paper":"weeks-2023-nejm-evidence-2-na","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["CHIP"],"text":"Clonal hematopoiesis of indeterminate potential (CHIP) is defined as clonal hematopoiesis with somatic mutations detectable at a variant allele fraction (VAF) of 2% or greater in the absence of a diagnosed blood disorder or cytopenia."},{"id":"weeks-2023-nejm-evidence-2-na-C0002","paper":"weeks-2023-nejm-evidence-2-na","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["CCUS"],"text":"Clonal cytopenia of undetermined significance (CCUS) is defined as clonal hematopoiesis with somatic mutations at a variant allele fraction (VAF) of 2% or greater in the presence of unexplained, persistent cytopenia."},{"id":"weeks-2023-nejm-evidence-2-na-C0003","paper":"weeks-2023-nejm-evidence-2-na","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["CCUS"],"text":"For the WHO-based cytopenia criteria applied to clonal cytopenia of undetermined significance (CCUS) in this study, anemia is defined as hemoglobin below 13.0 g/dL in males or below 12.0 g/dL in females."},{"id":"weeks-2023-nejm-evidence-2-na-C0004","paper":"weeks-2023-nejm-evidence-2-na","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["CCUS"],"text":"For the WHO-based cytopenia criteria applied to clonal cytopenia of undetermined significance (CCUS) in this study, thrombocytopenia is defined as a platelet count below 150 × 10^9/L."},{"id":"weeks-2023-nejm-evidence-2-na-C0005","paper":"weeks-2023-nejm-evidence-2-na","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["CCUS"],"text":"For the WHO-based cytopenia criteria applied to clonal cytopenia of undetermined significance (CCUS) in this study, neutropenia is defined as an absolute neutrophil count below 1.8 × 10^9/L."},{"id":"weeks-2023-nejm-evidence-2-na-C0006","paper":"weeks-2023-nejm-evidence-2-na","category":"prognosis","tier":"multivariable-adjusted","genes":["SRSF2","SF3B1","ZRSR2","JAK2","RUNX1","IDH2"],"diseases":["CHIP","CCUS"],"text":"According to the CHRS framework, mutations in SRSF2, SF3B1, ZRSR2, JAK2, RUNX1, and IDH2 are high-risk mutations for progression of CHIP or CCUS to myeloid neoplasm."},{"id":"weeks-2023-nejm-evidence-2-na-C0007","paper":"weeks-2023-nejm-evidence-2-na","category":"prognosis","tier":"restated secondary","genes":["TP53"],"diseases":["CHIP","CCUS"],"text":"Although the TP53-related mutation group was not associated with incident myeloid neoplasm in this cohort, the CHRS empirically treats TP53 mutation as high risk in CHIP/CCUS based on prior evidence and concern about underestimating risk."},{"id":"weeks-2023-nejm-evidence-2-na-C0008","paper":"weeks-2023-nejm-evidence-2-na","category":"prognosis","tier":"multivariable-adjusted","genes":["DNMT3A"],"diseases":["CHIP","CCUS"],"text":"In CHIP/CCUS, DNMT3A-mutant genotypes are associated with lower risk of progression to myeloid neoplasm than other CHIP/CCUS genotypes."},{"id":"weeks-2023-nejm-evidence-2-na-C0009","paper":"weeks-2023-nejm-evidence-2-na","category":"prognosis","tier":"multivariable-adjusted","genes":["DNMT3A"],"diseases":["CHIP","CCUS"],"text":"In CHIP/CCUS, a single DNMT3A mutation identifies a particularly low-risk genotype for progression to myeloid neoplasm compared with other CHIP/CCUS genotypes."},{"id":"weeks-2023-nejm-evidence-2-na-C0010","paper":"weeks-2023-nejm-evidence-2-na","category":"prognosis","tier":"univariable or descriptive","genes":["DNMT3A"],"diseases":["CHIP","CCUS"],"text":"DNMT3A-mutant CHIP/CCUS is associated with higher risk of myeloid neoplasm than individuals without CHIP/CCUS."},{"id":"weeks-2023-nejm-evidence-2-na-C0016","paper":"weeks-2023-nejm-evidence-2-na","category":"prognosis","tier":"restated secondary","genes":["TP53"],"diseases":["CHIP","CCUS"],"text":"In TP53-mutant CHIP/CCUS, myeloid-neoplasm risk is probably heterogeneous and may be influenced by clonal selection pressures such as chemotherapy, clone size, allelic state, and clonal complexity."},{"id":"weeks-2023-nejm-evidence-2-na-C0017","paper":"weeks-2023-nejm-evidence-2-na","category":"prognosis","tier":"univariable or descriptive","genes":["IDH1","FLT3"],"diseases":["CHIP","CCUS"],"text":"According to the CHRS framework, IDH1 and FLT3 mutations are classified as high-risk mutations for progression of CHIP or CCUS to myeloid neoplasm as members of the AML-like mutation group."},{"id":"xie-2024-ccrs-ccus-C0001","paper":"xie-2024-ccrs-ccus","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["CHIP","CCUS"],"text":"According to the WHO fifth edition definition cited by the paper, a myeloid-associated somatic mutation with VAF ≥2% in blood or bone marrow without a myeloid neoplasm is classified as CHIP when unexplained cytopenia is absent and as CCUS when unexplained cytopenia is present."},{"id":"xie-2024-ccrs-ccus-C0003","paper":"xie-2024-ccrs-ccus","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["CHIP","CCUS"],"text":"According to ICC classification, when absolute monocyte count is ≥0.5 × 10^9/L, monocytes comprise ≥10% of the white blood cell differential, and bone marrow lacks morphologic CMML, CHIP is classified as CMUS and CCUS is classified as CCMUS."},{"id":"xie-2024-ccrs-ccus-C0005","paper":"xie-2024-ccrs-ccus","category":"prognosis","tier":"univariable or descriptive","genes":["TET2","SRSF2","ZRSR2"],"diseases":["CCUS"],"text":"In CCUS, TET2, SRSF2, and ZRSR2 mutations are associated with shorter leukemia-free survival."},{"id":"xie-2024-ccrs-ccus-C0006","paper":"xie-2024-ccrs-ccus","category":"prognosis","tier":"univariable or descriptive","genes":["DNMT3A"],"diseases":["CCUS"],"text":"In CCUS, DNMT3A mutation is associated with a lower risk of disease transformation than absence of a DNMT3A mutation."},{"id":"xie-2024-ccrs-ccus-C0007","paper":"xie-2024-ccrs-ccus","category":"prognosis","tier":"univariable or descriptive","genes":["ASXL1","SRSF2"],"diseases":["CCUS"],"text":"In CCUS, ASXL1 and SRSF2 mutations are associated with inferior overall survival."}]};

const paperName = {};
const paperByKey = {};
DATA.papers.forEach(p => { paperName[p.key] = p.nickname; paperByKey[p.key] = p; });
if (DATA.full) document.body.classList.add("full-mode");

const state = {
  paper:new Set(), disease:new Set(), gene:new Set(), category:new Set(),
  query:"", selected:null
};
const facetSearch = { paper:"", disease:"", gene:"", category:"" };
const FACETS = [
  { key:"category", title:"Category", field:c => [c.category], searchable:false, swatch:true },
  { key:"paper", title:"Paper", field:c => [c.paper], searchable:true, labelOf:k => paperName[k] || k },
  { key:"disease", title:"Disease", field:c => c.diseases, searchable:true },
  { key:"gene", title:"Gene", field:c => c.genes, searchable:true }
];

function matches(card, skip){
  for (const f of FACETS){
    if (f.key === skip) continue;
    const chosen = state[f.key];
    if (!chosen.size) continue;
    if (!f.field(card).some(v => chosen.has(v))) return false;
  }
  if (state.query && !skip && !card.text.toLowerCase().includes(state.query)) return false;
  return true;
}

function visibleCards(){
  return DATA.cards.filter(c => matches(c, null));
}

function countsFor(facet){
  const tally = new Map();
  for (const card of DATA.cards){
    if (!matches(card, facet.key)) continue;
    if (state.query && !card.text.toLowerCase().includes(state.query)) continue;
    for (const value of facet.field(card)){
      if (!value) continue;
      tally.set(value, (tally.get(value) || 0) + 1);
    }
  }
  const all = new Set(tally.keys());
  state[facet.key].forEach(v => { if (!all.has(v)) tally.set(v, 0); });
  return tally;
}

function buildRail(){
  const rail = document.getElementById("rail");
  rail.innerHTML = "";
  for (const facet of FACETS){
    const tally = countsFor(facet);
    let entries = [...tally.entries()];
    if (facet.key === "paper"){
      entries.sort((a,b) => facet.labelOf(a[0]).localeCompare(facet.labelOf(b[0])));
    } else if (facet.key === "category"){
      entries.sort((a,b) => b[1] - a[1] || a[0].localeCompare(b[0]));
    } else {
      entries.sort((a,b) => a[0].localeCompare(b[0], undefined, {numeric:true}));
    }

    const needle = facetSearch[facet.key].toLowerCase();
    if (needle){
      entries = entries.filter(([value]) => {
        const label = facet.labelOf ? facet.labelOf(value) : value;
        return label.toLowerCase().includes(needle) || state[facet.key].has(value);
      });
    }

    const box = document.createElement("section");
    box.className = "facet" + (state[facet.key].size ? " active" : "");

    const head = document.createElement("h2");
    head.textContent = facet.title;
    const clear = document.createElement("button");
    clear.type = "button";
    clear.className = "clear";
    clear.textContent = "clear";
    clear.addEventListener("click", () => { state[facet.key].clear(); render(); });
    head.appendChild(clear);
    box.appendChild(head);

    if (facet.searchable){
      const input = document.createElement("input");
      input.className = "facet-search";
      input.type = "search";
      input.placeholder = "Filter " + facet.title.toLowerCase() + "s";
      input.setAttribute("aria-label", "Filter " + facet.title.toLowerCase() + " list");
      input.value = facetSearch[facet.key];
      input.addEventListener("input", event => {
        facetSearch[facet.key] = event.target.value;
        render({keepFocus:facet.key});
      });
      box.appendChild(input);
    }

    const list = document.createElement("ul");
    list.className = "options" + (entries.length <= 8 ? " short" : "");
    for (const [value, count] of entries){
      const item = document.createElement("li");
      const button = document.createElement("button");
      const on = state[facet.key].has(value);
      button.type = "button";
      button.className = "opt";
      button.setAttribute("aria-pressed", on ? "true" : "false");
      if (!count && !on) button.disabled = true;

      const tick = document.createElement("span");
      tick.className = "tick";
      tick.textContent = on ? "\u2715" : "";
      tick.setAttribute("aria-hidden", "true");
      button.appendChild(tick);

      if (facet.swatch){
        const dot = document.createElement("span");
        dot.className = "swatch";
        dot.style.background = CATEGORY_COLOURS[value] || "var(--muted)";
        button.appendChild(dot);
      }

      const label = document.createElement("span");
      label.className = "label";
      label.textContent = facet.labelOf ? facet.labelOf(value) : value;
      button.appendChild(label);

      const num = document.createElement("span");
      num.className = "count";
      num.textContent = count;
      button.appendChild(num);

      button.addEventListener("click", () => {
        const set = state[facet.key];
        if (set.has(value)) set.delete(value); else set.add(value);
        render();
      });
      item.appendChild(button);
      list.appendChild(item);
    }

    if (!entries.length){
      const item = document.createElement("li");
      item.className = "tally";
      item.style.padding = "4px";
      item.textContent = "No matches in this list.";
      list.appendChild(item);
    }
    box.appendChild(list);
    rail.appendChild(box);
  }
}

function highlight(text, needle){
  if (!needle) return document.createTextNode(text);
  const fragment = document.createDocumentFragment();
  const lower = text.toLowerCase();
  let from = 0;
  let at = lower.indexOf(needle, from);
  while (at !== -1){
    fragment.appendChild(document.createTextNode(text.slice(from, at)));
    const mark = document.createElement("mark");
    mark.textContent = text.slice(at, at + needle.length);
    fragment.appendChild(mark);
    from = at + needle.length;
    at = lower.indexOf(needle, from);
  }
  fragment.appendChild(document.createTextNode(text.slice(from)));
  return fragment;
}

function textOrDash(value){
  if (value === null || value === undefined || value === "") return "—";
  if (Array.isArray(value)) return value.length ? value.join(", ") : "—";
  if (typeof value === "object") return JSON.stringify(value);
  return String(value);
}

function addMeta(grid, label, value){
  const dt = document.createElement("dt");
  dt.textContent = label;
  const dd = document.createElement("dd");
  dd.textContent = textOrDash(value);
  grid.append(dt, dd);
}

function detailSection(title){
  const section = document.createElement("section");
  section.className = "detail-section";
  const head = document.createElement("h2");
  head.textContent = title;
  section.appendChild(head);
  return section;
}

function closeDetail(){
  state.selected = null;
  document.body.classList.remove("detail-open");
  document.getElementById("detail").innerHTML = "";
  document.querySelectorAll("li.card.selected").forEach(el => el.classList.remove("selected"));
}

function buildDetail(card){
  if (!DATA.full || !card || !card.details) return;
  state.selected = card.id;
  document.body.classList.add("detail-open");
  const pane = document.getElementById("detail");
  pane.innerHTML = "";

  const paper = paperByKey[card.paper];
  const exact = card.details.card || {};
  const evidence = card.details.evidence || {};
  const paperDetails = (paper && paper.details) || {};

  const head = document.createElement("div");
  head.className = "detail-head";
  const id = document.createElement("div");
  id.className = "detail-id";
  id.textContent = card.id;
  const close = document.createElement("button");
  close.type = "button";
  close.className = "detail-close";
  close.textContent = "Close";
  close.setAttribute("aria-label", "Close card details");
  close.addEventListener("click", closeDetail);
  head.append(id, close);
  pane.appendChild(head);

  const interpretation = detailSection("Interpretation");
  const text = document.createElement("p");
  text.className = "detail-interpretation";
  text.textContent = exact.interpretation || card.text;
  interpretation.appendChild(text);
  pane.appendChild(interpretation);

  const classification = detailSection("Classification");
  const classificationGrid = document.createElement("dl");
  classificationGrid.className = "meta-grid";
  addMeta(classificationGrid, "Genes", exact.genes || card.genes);
  addMeta(classificationGrid, "Category", exact.category || card.category);
  addMeta(classificationGrid, "Disease", exact.diseases || card.diseases);
  classification.appendChild(classificationGrid);
  pane.appendChild(classification);

  const evidenceMeta = detailSection("Evidence");
  const evidenceGrid = document.createElement("dl");
  evidenceGrid.className = "meta-grid";
  addMeta(evidenceGrid, "Evidence tier", exact.evidence_tier || card.tier);
  addMeta(
    evidenceGrid,
    "Secondary citation",
    exact.secondary_citation && exact.secondary_citation.display
  );
  evidenceMeta.appendChild(evidenceGrid);

  for (const fragment of (evidence.fragments || [])){
    const box = document.createElement("div");
    box.className = "evidence-fragment";
    const label = document.createElement("div");
    label.className = "fragment-label";
    label.textContent = [fragment.fragment_id, fragment.role, fragment.locator]
      .filter(Boolean).join(" · ");
    const quote = document.createElement("blockquote");
    quote.textContent = fragment.quote || "";
    box.append(label, quote);
    evidenceMeta.appendChild(box);
  }

  const supportMap = evidence.support_map || {};
  if (Object.keys(supportMap).length){
    const mapSection = document.createElement("div");
    mapSection.className = "evidence-fragment";
    const label = document.createElement("div");
    label.className = "fragment-label";
    label.textContent = "Support mapping";
    const list = document.createElement("ul");
    list.className = "support-list";
    for (const [field, fragmentIds] of Object.entries(supportMap)){
      const li = document.createElement("li");
      li.textContent = field + ": " + textOrDash(fragmentIds);
      list.appendChild(li);
    }
    mapSection.append(label, list);
    evidenceMeta.appendChild(mapSection);
  }
  pane.appendChild(evidenceMeta);

  const acceptance = paperDetails.accepted_package || {};
  const acceptanceMeta = detailSection("Acceptance");
  const acceptanceGrid = document.createElement("dl");
  acceptanceGrid.className = "meta-grid";
  addMeta(acceptanceGrid, "Acceptance path", acceptance.acceptance_path);
  addMeta(acceptanceGrid, "Accepted at", acceptance.accepted_at);
  addMeta(acceptanceGrid, "Accepted at source", acceptance.accepted_at_source);
  addMeta(acceptanceGrid, "Accepted in version", acceptance.accepted_in_version);
  addMeta(acceptanceGrid, "Latest version", acceptance.latest_version || acceptance.accepted_in_version);
  addMeta(acceptanceGrid, "Version history", acceptance.version_history);
  acceptanceMeta.appendChild(acceptanceGrid);
  pane.appendChild(acceptanceMeta);

  pane.scrollTop = 0;
  document.querySelectorAll("li.card").forEach(el => {
    el.classList.toggle("selected", el.dataset.cardId === card.id);
  });
}

function legacyCopy(text, done){
  const area = document.createElement("textarea");
  area.value = text;
  area.setAttribute("readonly", "");
  area.style.position = "fixed";
  area.style.opacity = "0";
  document.body.appendChild(area);
  area.select();
  try {
    document.execCommand("copy");
    done();
  } catch (err) {
    window.prompt("Copy:", text);
  }
  document.body.removeChild(area);
}

function copyText(text, button){
  const done = () => {
    const original = button.textContent;
    button.textContent = "Copied";
    button.classList.add("copied");
    setTimeout(() => {
      button.textContent = original;
      button.classList.remove("copied");
    }, 1200);
  };
  if (navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(done, () => legacyCopy(text, done));
  } else {
    legacyCopy(text, done);
  }
}

function copyCitationRow(card){
  const paper = paperByKey[card.paper] || {};
  const row = document.createElement("div");
  row.className = "copyrow";
  const button = document.createElement("button");
  button.type = "button";
  button.className = "copybtn";
  button.textContent = "Copy citation";
  button.addEventListener("click", event => {
    event.stopPropagation();
    const citation = paper.display || paper.nickname || card.paper;
    copyText(citation, button);
  });
  button.addEventListener("keydown", event => event.stopPropagation());
  row.appendChild(button);
  return row;
}

function buildCards(){
  const list = document.getElementById("cards");
  const rows = visibleCards();
  list.innerHTML = "";

  document.getElementById("tally").innerHTML =
    "<b>" + rows.length + "</b> of " + DATA.cards.length + " cards";

  if (!rows.length){
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.innerHTML = "<h3>Nothing matches these filters</h3>" +
      "<p>Remove a filter, or clear all of them and start from a single gene or paper.</p>";
    list.appendChild(empty);
    return;
  }

  const chunk = document.createDocumentFragment();
  for (const card of rows){
    const item = document.createElement("li");
    item.className = "card" + (state.selected === card.id ? " selected" : "");
    item.dataset.cardId = card.id;
    item.style.setProperty("--spine", CATEGORY_COLOURS[card.category] || "var(--rule)");

    if (DATA.full){
      item.tabIndex = 0;
      item.setAttribute("role", "button");
      item.setAttribute("aria-label", "Open full details for " + card.id);
      item.addEventListener("click", () => buildDetail(card));
      item.addEventListener("keydown", event => {
        if (event.target !== item) return;
        if (event.key === "Enter" || event.key === " "){
          event.preventDefault();
          buildDetail(card);
        }
      });
    }

    const cid = document.createElement("span");
    cid.className = "cid";
    cid.textContent = card.id;
    item.appendChild(cid);

    const para = document.createElement("p");
    para.appendChild(highlight(card.text, state.query));
    item.appendChild(para);
    item.appendChild(copyCitationRow(card));

    chunk.appendChild(item);
  }
  list.appendChild(chunk);
  if (DATA.full && state.selected && !rows.some(card => card.id === state.selected)) closeDetail();
}

function render(options){
  const keep = options && options.keepFocus;
  buildRail();
  buildCards();
  if (keep){
    const facetIndex = FACETS.findIndex(f => f.key === keep);
    const input = document.querySelectorAll(".facet")[facetIndex].querySelector(".facet-search");
    if (input){
      input.focus();
      input.setSelectionRange(input.value.length, input.value.length);
    }
  }
}

document.getElementById("provenance").textContent =
  "corpus " + DATA.corpusVersion + " · " + DATA.cards.length + " cards · " +
  DATA.papers.length + " papers" + (DATA.full ? " · full evidence view" : "");

document.getElementById("textsearch").addEventListener("input", event => {
  state.query = event.target.value.trim().toLowerCase();
  buildRail();
  buildCards();
});

document.getElementById("reset").addEventListener("click", () => {
  FACETS.forEach(f => { state[f.key].clear(); facetSearch[f.key] = ""; });
  state.query = "";
  document.getElementById("textsearch").value = "";
  render();
});

const railToggle = document.getElementById("railtoggle");
railToggle.addEventListener("click", () => {
  const rail = document.getElementById("rail");
  const open = rail.hasAttribute("hidden");
  if (open) rail.removeAttribute("hidden"); else rail.setAttribute("hidden", "");
  railToggle.setAttribute("aria-expanded", open ? "true" : "false");
});
if (window.matchMedia("(max-width:900px)").matches){
  document.getElementById("rail").setAttribute("hidden", "");
}

render();
</script>
</body>
</html>
