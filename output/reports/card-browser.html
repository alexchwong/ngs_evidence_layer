"],"text":"In cytopenic patients lacking dysplasia, prior MDS-defining cytogenetic abnormalities other than del(5q), -7/del(7q), or complex karyotype are now classified as CCUS rather than MDS."},{"id":"arber-2022-blood-140-1200-C0065","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["TP53"],"diseases":["MDS"],"text":"According to the ICC, MDS with excess blasts requires at least one cytopenia, no ICC-defined cytosis, and 5%-9% marrow blasts or 2%-9% blood blasts; 1% peripheral-blood blasts confirmed on two occasions also qualifies. Dysplasia is typically present but not required, multihit TP53 is excluded in favor of MDS with mutated TP53, and excess blasts supersede other non-TP53 MDS subtypes. In patients <18 years, MDS with excess blasts uses 5%-19% marrow blasts and 2%-19% blood blasts, and MDS/AML does not apply."},{"id":"arber-2022-blood-140-1200-C0066","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["TP53"],"diseases":["MDS"],"text":"According to the ICC, MDS with del(5q) requires at least one cytopenia, del(5q) isolated or with no more than one additional cytogenetic abnormality other than -7/del(7q), <5% marrow blasts and <2% blood blasts, and absence of multihit TP53. Thrombocytosis is allowed but other ICC-defined cytoses are not; dysplasia is typically present but is not required."},{"id":"arber-2022-blood-140-1200-C0067","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["SF3B1","TP53"],"diseases":["MDS"],"text":"According to the ICC, MDS, NOS without dysplasia requires at least one cytopenia, no ICC-defined cytosis, <5% marrow blasts and <2% blood blasts, and -7/del(7q) or complex karyotype as the defining cytogenetic abnormality; multihit TP53 and SF3B1 mutation with VAF >=10% are excluded."},{"id":"arber-2022-blood-140-1200-C0068","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["SF3B1","TP53"],"diseases":["MDS"],"text":"According to the ICC, MDS, NOS with single-lineage dysplasia requires dysplasia in one lineage, at least one cytopenia, no ICC-defined cytosis, <5% marrow blasts and <2% blood blasts, and failure to meet criteria for MDS with del(5q) or MDS with mutated SF3B1; multihit TP53 is excluded."},{"id":"arber-2022-blood-140-1200-C0069","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["SF3B1","TP53"],"diseases":["MDS"],"text":"According to the ICC, MDS, NOS with multilineage dysplasia requires dysplasia in at least two lineages, at least one cytopenia, no ICC-defined cytosis, <5% marrow blasts and <2% blood blasts, and failure to meet criteria for MDS with del(5q) or MDS with mutated SF3B1; multihit TP53 is excluded."},{"id":"arber-2022-blood-140-1200-C0070","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["CEBPA","NPM1","TP53"],"diseases":["MDS/AML"],"text":"According to the ICC, adult MDS/AML is defined by 10%-19% blasts in blood or marrow, at least one cytopenia, and absence of ICC-defined cytosis. Generic MDS/AML excludes AML-defining cytogenetic abnormalities and NPM1, in-frame bZIP CEBPA, and TP53 mutations that define other genetic categories; dysplasia is typically present but not required. MDS/AML is subclassified as TP53-mutated, myelodysplasia-related gene-mutated, myelodysplasia-related cytogenetic, or NOS."},{"id":"arber-2022-blood-140-1200-C0071","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["TP53"],"diseases":["MDS"],"text":"According to the ICC, MDS with mutated TP53 has 0%-9% blasts and requires multihit TP53, defined as 2 distinct TP53 mutations each with VAF >10% or one TP53 mutation plus 17p deletion, VAF >50%, or copy-neutral LOH at TP53; when LOH information is unavailable, TP53 mutation VAF >10% with complex karyotype qualifies. Complex karyotype without a TP53 mutation does not qualify, and monoallelic TP53-mutated MDS is excluded from this entity."},{"id":"arber-2022-blood-140-1200-C0072","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["TP53"],"diseases":["MDS/AML"],"text":"MDS/AML with mutated TP53 is defined by 10%-19% blasts and any somatic TP53 mutation with VAF >10%; monoallelic TP53 mutations are allowed."},{"id":"arber-2022-blood-140-1200-C0073","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["TP53"],"diseases":["AML"],"text":"AML with mutated TP53 is defined by >=20% marrow or blood blasts, or pure erythroid leukemia, plus any somatic TP53 mutation with VAF >10%; monoallelic TP53 mutations are allowed."},{"id":"arber-2022-blood-140-1200-C0074","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["TP53"],"diseases":["MDS"],"text":"Established MDS that acquires a TP53 mutation can be redesignated as MDS, MDS/AML, or AML with mutated TP53 according to blast count."},{"id":"arber-2022-blood-140-1200-C0075","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["MDS"],"text":"Development of leukocytosis, thrombocytosis, or monocytosis during established MDS generally does not warrant reclassification as MDS/MPN; the disease can instead be designated as MDS with neutrophilic, thrombocytotic, or monocytic progression."},{"id":"arber-2022-blood-140-1200-C0076","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["MDS"],"text":"The ICC recommends retaining the morphologic/genetic MDS diagnosis as primary and adding a therapy-related qualifier when disease follows cytotoxic therapy."},{"id":"arber-2022-blood-140-1200-C0077","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["CHIP","CCUS","MDS"],"text":"The ICC recommends qualifying CHIP, CCUS, and other non-MDS clonal cytopenias as therapy-related when they follow marrow exposure to chemotherapy or radiation."},{"id":"arber-2022-blood-140-1200-C0078","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["MDS"],"text":"Any underlying germline predisposition mutation or syndrome should be specified as a qualifier after the MDS diagnosis and subtype."},{"id":"arber-2022-blood-140-1200-C0079","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["ABL1","BCR","CBL","KRAS","NF1","NRAS","PTPN11","RRAS"],"diseases":["JMML"],"text":"According to the ICC, JMML is a RAS-pathway-defined neoplasm involving PTPN11, NRAS, KRAS, RRAS, NF1, or CBL and generally requires peripheral-blood monocytes >=1 x 10^9/L, splenomegaly, <20% blasts in blood and marrow, and absence of BCR::ABL1. One diagnostic genetic route is a somatic PTPN11, KRAS, NRAS, or RRAS mutation after excluding relevant germline Noonan-syndrome forms; the paper notes that a minority of JMML cases may present below the monocytosis threshold or without splenomegaly."},{"id":"arber-2022-blood-140-1200-C0080","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["ALK","CBL","CCDC88C","FIP1L1","FLT3","KRAS","NF1","NRAS","PTPN11","RARA","ROS1","RRAS"],"diseases":["JMML"],"text":"According to the ICC, JMML-like neoplasm is a clonal disorder phenotypically resembling JMML but lacking a canonical PTPN11, NRAS, KRAS, RRAS, NF1, or CBL RAS-pathway mutation; rare examples include ALK or ROS1 rearrangements and FIP1L1::RARA or CCDC88C::FLT3 fusions. AML-defining recurrent genetic abnormalities and myeloid/lymphoid neoplasms with eosinophilia and TK fusions are excluded."},{"id":"arber-2022-blood-140-1200-C0084","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["ANKRD26","ETV6","RUNX1"],"diseases":["MDS"],"text":"In germline RUNX1-, ANKRD26-, or ETV6-associated constitutional platelet disorders, marrow megakaryocytic dysplasia can be present with isolated thrombocytopenia in the absence of MDS."},{"id":"arber-2022-blood-140-1200-C0085","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["MDS"],"text":"When assessing MDS in patients with germline predisposition, baseline dyspoietic bone-marrow changes can be present even in the absence of a myeloid malignancy."},{"id":"arber-2022-blood-140-1200-C0086","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["MDS"],"text":"In patients with germline predisposition, development of MDS is generally associated with new or progressive cytopenia, often with rising marrow cellularity, overt multilineage dysplasia, increased blasts, and/or acquired pathogenic genetic abnormalities."},{"id":"arber-2022-blood-140-1200-C0087","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["SF3B1","TP53"],"diseases":["MDS"],"text":"In a patient with germline predisposition, emergence of del(5q), -7/del(7q), complex karyotype, multihit TP53 mutation VAF >10%, or SF3B1 mutation VAF >10% is considered MDS-defining."},{"id":"arber-2022-blood-140-1200-C0088","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["TP53"],"diseases":["MDS"],"text":"In Shwachman-Diamond syndrome, a small stable clone with monoallelic TP53 mutation alone is not considered MDS, whereas biallelic TP53 mutation is associated with myeloid malignancy."},{"id":"arber-2022-blood-140-1200-C0089","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["PML","RARA"],"diseases":["APL"],"text":"According to the ICC, acute promyelocytic leukemia with PML::RARA can be diagnosed with >=10% blasts."},{"id":"arber-2022-blood-140-1200-C0090","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["BCOR","FIP1L1","IRF2BP2","NPM1","RARA","STAT3","STAT5B","TBL1XR1","ZBTB16"],"diseases":["APL"],"text":"According to the ICC, APL with other RARA rearrangements can be diagnosed with >=10% blasts; listed RARA partners include IRF2BP2, NPM1, ZBTB16, STAT5B, STAT3, TBL1XR1, FIP1L1, and BCOR."},{"id":"arber-2022-blood-140-1200-C0091","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["CBFB","DEK","KMT2A","MLLT3","MYH11","NUP214","RUNX1","RUNX1T1"],"diseases":["AML"],"text":"According to the ICC, AML with RUNX1::RUNX1T1, CBFB::MYH11, MLLT3::KMT2A, or DEK::NUP214 can be diagnosed with >=10% blasts."},{"id":"arber-2022-blood-140-1200-C0092","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["AFDN","AFF1","ELL","KMT2A","MLLT1","MLLT10","TET1"],"diseases":["AML"],"text":"According to the ICC, AML with other KMT2A rearrangements can be diagnosed with >=10% blasts; listed partners include AFF1, AFDN, MLLT10, TET1, ELL, and MLLT1."},{"id":"arber-2022-blood-140-1200-C0093","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["GATA2","MECOM"],"diseases":["AML"],"text":"According to the ICC, AML with inv(3) or t(3;3) involving GATA2 and MECOM can be diagnosed with >=10% blasts."},{"id":"arber-2022-blood-140-1200-C0094","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["ETV6","MECOM","MYC","RUNX1"],"diseases":["AML"],"text":"According to the ICC, AML with other MECOM rearrangements can be diagnosed with >=10% blasts; listed examples include MECOM rearrangements involving MYC, ETV6, or RUNX1."},{"id":"arber-2022-blood-140-1200-C0095","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["ABL1","BCR"],"diseases":["AML"],"text":"According to the ICC, AML with BCR::ABL1 requires >=20% blasts."},{"id":"arber-2022-blood-140-1200-C0096","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["ABL1","BCR"],"diseases":["AML"],"text":"The ICC does not use the MDS/AML category for BCR::ABL1-positive AML because of overlap with progression of BCR::ABL1-positive CML."},{"id":"arber-2022-blood-140-1200-C0097","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["NPM1"],"diseases":["AML"],"text":"According to the ICC, AML with mutated NPM1 can be diagnosed with >=10% blasts."},{"id":"arber-2022-blood-140-1200-C0098","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["CEBPA"],"diseases":["AML"],"text":"According to the ICC, AML with an in-frame bZIP CEBPA mutation can be diagnosed with >=10% blasts, without requiring biallelic CEBPA mutations."},{"id":"arber-2022-blood-140-1200-C0099","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["ASXL1","BCOR","EZH2","RUNX1","SF3B1","SRSF2","STAG2","U2AF1","ZRSR2"],"diseases":["MDS/AML"],"text":"According to the ICC, MDS/AML with myelodysplasia-related gene mutations has 10%-19% blasts and is defined by mutation in ASXL1, BCOR, EZH2, RUNX1, SF3B1, SRSF2, STAG2, U2AF1, or ZRSR2."},{"id":"arber-2022-blood-140-1200-C0100","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["ASXL1","BCOR","EZH2","RUNX1","SF3B1","SRSF2","STAG2","U2AF1","ZRSR2"],"diseases":["AML"],"text":"According to the ICC, AML with myelodysplasia-related gene mutations requires >=20% blasts and is defined by mutation in ASXL1, BCOR, EZH2, RUNX1, SF3B1, SRSF2, STAG2, U2AF1, or ZRSR2."},{"id":"arber-2022-blood-140-1200-C0101","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["TP53"],"diseases":["MDS/AML"],"text":"After excluding TP53 mutation, myelodysplasia-related gene mutation, and other class-defining recurring genetic abnormalities, MDS/AML with myelodysplasia-related cytogenetic abnormalities is defined at 10%-19% blasts by specified abnormalities including complex karyotype, del/t/add(5q), -7/del(7q), +8, del/t/add(12p), i(17q), -17/add(17p)/del(17p), del(20q), or idic(X)(q13)."},{"id":"arber-2022-blood-140-1200-C0102","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["TP53"],"diseases":["AML"],"text":"After excluding TP53 mutation, myelodysplasia-related gene mutation, and other class-defining recurring genetic abnormalities, AML with myelodysplasia-related cytogenetic abnormalities is defined at >=20% blasts by specified abnormalities including complex karyotype, del/t/add(5q), -7/del(7q), +8, del/t/add(12p), i(17q), -17/add(17p)/del(17p), del(20q), or idic(X)(q13)."},{"id":"arber-2022-blood-140-1200-C0103","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["AML"],"text":"AML, NOS requires >=20% blasts after excluding class-defining genetic categories."},{"id":"arber-2022-blood-140-1200-C0104","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["MDS/AML"],"text":"MDS/AML, NOS applies at 10%-19% blasts after excluding the other defined MDS/AML genetic categories."},{"id":"arber-2022-blood-140-1200-C0105","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["AML"],"text":"Myeloid sarcoma remains an ICC AML-related disease category and does not require a marrow or blood blast-percentage threshold for its classification."},{"id":"arber-2022-blood-140-1200-C0106","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["ABL1","BCR"],"diseases":["AML"],"text":"For AML categories with listed recurrent genetic abnormalities other than BCR::ABL1 and the remaining >=20%-blast categories, the ICC permits AML diagnosis with at least 10% blasts or blast equivalents."},{"id":"arber-2022-blood-140-1200-C0107","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["AML"],"text":"Single-gene mutation or gene-fusion AML categories take precedence over myelodysplasia-related gene-mutation and myelodysplasia-related cytogenetic groups."},{"id":"arber-2022-blood-140-1200-C0108","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["TP53"],"diseases":["AML"],"text":"When TP53 mutation overlaps another AML genetic category, the ICC states that the TP53 mutation should be noted with the other genetic abnormality."},{"id":"arber-2022-blood-140-1200-C0109","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["TP53"],"diseases":["AML"],"text":"Pure erythroid leukemia is typically TP53-mutated and is classified within AML with TP53 mutation in the ICC."},{"id":"arber-2022-blood-140-1200-C0110","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["MDS/AML","AML"],"text":"According to the ICC, therapy-related status is a diagnostic qualifier appended to the specific AML or MDS/AML diagnosis rather than a stand-alone AML disease category."},{"id":"arber-2022-blood-140-1200-C0111","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["MDS/AML","AML"],"text":"According to the ICC, progression from a confirmed prior MDS is a diagnostic qualifier appended to the specific AML or MDS/AML diagnosis."},{"id":"arber-2022-blood-140-1200-C0112","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["MDS/AML","AML"],"text":"According to the ICC, progression from a confirmed prior MDS/MPN is a diagnostic qualifier appended to the specific AML or MDS/AML diagnosis, with the antecedent MDS/MPN specified."},{"id":"arber-2022-blood-140-1200-C0113","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["MDS/AML","AML"],"text":"Underlying germline predisposition is used as a qualifier following the specific AML or MDS/AML diagnosis."},{"id":"arber-2022-blood-140-1200-C0114","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["acute lymphoblastic leukaemia/lymphoma"],"text":"Therapy-related status should also be noted as a diagnostic association for acute lymphoblastic leukemia/lymphoma when applicable."},{"id":"arber-2022-blood-140-1200-C0115","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["ABL1","BCR","KMT2A"],"diseases":["acute leukaemia of ambiguous lineage"],"text":"According to the ICC, mixed-phenotype acute leukemia with BCR::ABL1 or KMT2A rearrangement is classified as acute leukemia of ambiguous lineage."},{"id":"arber-2022-blood-140-1200-C0116","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["KMT2A"],"diseases":["B-ALL"],"text":"The ICC recognizes KMT2A-rearranged B-ALL as a recurrent-genetic-abnormality subtype."},{"id":"arber-2022-blood-140-1200-C0117","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["ETV6","IGH","IL3","PBX1","RUNX1","TCF3"],"diseases":["B-ALL"],"text":"The ICC recognizes ETV6::RUNX1, IL3::IGH, and TCF3::PBX1 B-ALL as recurrent-genetic-abnormality subtypes."},{"id":"arber-2022-blood-140-1200-C0118","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["B-ALL"],"text":"The ICC recognizes hyperdiploid B-ALL as a recurrent-genetic-abnormality subtype."},{"id":"arber-2022-blood-140-1200-C0119","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["B-ALL"],"text":"The ICC recognizes low-hypodiploid B-ALL as a recurrent-genetic-abnormality subtype."},{"id":"arber-2022-blood-140-1200-C0120","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["B-ALL"],"text":"The ICC recognizes near-haploid B-ALL as a recurrent-genetic-abnormality subtype."},{"id":"arber-2022-blood-140-1200-C0121","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["ABL1","BCR"],"diseases":["B-ALL"],"text":"The ICC recognizes BCR::ABL1-like B-ALL with an ABL-class rearrangement as a subtype."},{"id":"arber-2022-blood-140-1200-C0122","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["ABL1","BCR","JAK"],"diseases":["B-ALL"],"text":"The ICC retains BCR::ABL1-like B-ALL, NOS for cases not assigned to the ABL-class-rearranged or JAK-STAT-activated BCR::ABL1-like subtypes."},{"id":"arber-2022-blood-140-1200-C0123","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["B-ALL"],"text":"The ICC recognizes B-ALL with iAMP21 as a recurrent-genetic-abnormality subtype."},{"id":"arber-2022-blood-140-1200-C0124","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["DUX4","HLF","MEF2D","NUTM1"],"diseases":["B-ALL"],"text":"The ICC recognizes DUX4-rearranged, MEF2D-rearranged, NUTM1-rearranged, and HLF-rearranged B-ALL as distinct subtypes."},{"id":"arber-2022-blood-140-1200-C0125","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["ETV6","RUNX1"],"diseases":["B-ALL"],"text":"ETV6::RUNX1-like B-ALL is a provisional ICC entity defined by an ETV6::RUNX1-like gene-expression/phenotypic profile despite lacking the canonical structural lesion."},{"id":"arber-2022-blood-140-1200-C0126","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["CEBPE","IGH","ZEB2"],"diseases":["B-ALL"],"text":"B-ALL with ZEB2 H1038R/IGH::CEBPE is listed as a provisional ICC entity, but the paper cautions that these lesions do not appear to define the group uniquely."},{"id":"arber-2022-blood-140-1200-C0127","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["KMT2A","ZNF384"],"diseases":["B-ALL"],"text":"ZNF384-rearranged-like and KMT2A-rearranged-like B-ALL are listed as provisional ICC entities."},{"id":"arber-2022-blood-140-1200-C0128","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["B-ALL"],"text":"B-ALL, NOS remains an ICC category after defined genetic B-ALL subtypes are excluded."},{"id":"arber-2022-blood-140-1200-C0129","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["ABL1","BCR"],"diseases":["B-ALL"],"text":"The ICC divides BCR::ABL1-positive B-ALL into lymphoid-only and multilineage-involvement subsets."},{"id":"arber-2022-blood-140-1200-C0130","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["ABL1","BCR"],"diseases":["B-ALL"],"text":"p190 versus p210 BCR::ABL1 fusion protein does not reliably distinguish lymphoid-only from multilineage BCR::ABL1-positive B-ALL."},{"id":"arber-2022-blood-140-1200-C0131","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["ABL1","BCR","CRLF2","EPOR","JAK"],"diseases":["B-ALL"],"text":"The ICC recognizes a JAK-STAT-activated BCR::ABL1-like B-ALL subgroup that includes CRLF2 rearrangements, JAK fusions, and EPOR rearrangements."},{"id":"arber-2022-blood-140-1200-C0132","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["MYC"],"diseases":["B-ALL"],"text":"The ICC recognizes B-ALL with MYC rearrangement as an immature lymphoblastic entity; MYC-rearranged aggressive B-cell lymphomas with lymphoblastic features should instead be classified under the appropriate lymphoma."},{"id":"arber-2022-blood-140-1200-C0133","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["ZNF362","ZNF384"],"diseases":["B-ALL"],"text":"ZNF384- or ZNF362-rearranged leukemia is an ICC entity with lineage ambiguity that may manifest as B-ALL or B/myeloid mixed-phenotype acute leukemia."},{"id":"arber-2022-blood-140-1200-C0134","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["ZNF384"],"diseases":["B-ALL"],"text":"In ZNF384-rearranged B-ALL or B/myeloid acute leukemia of ambiguous lineage, lineage shift during disease evolution is common and supports ZNF384 rearrangement defining a distinct entity irrespective of the initial immunophenotype."},{"id":"arber-2022-blood-140-1200-C0135","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["ATXN7L3","CDX2","FLT3","UBTF"],"diseases":["B-ALL"],"text":"CDX2/UBTF-deregulated B-ALL is characterized by two concomitant genomic alterations: a focal chromosome 13 deletion upstream of FLT3 and a focal deletion involving the 3-prime region of UBTF that produces UBTF::ATXN7L3."},{"id":"arber-2022-blood-140-1200-C0136","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["IKZF1"],"diseases":["B-ALL"],"text":"B-ALL with IKZF1 N159Y is a distinct ICC entity defined by the IKZF1 N159Y hotspot mutation and a unique gene-expression pattern."},{"id":"arber-2022-blood-140-1200-C0137","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["PAX5"],"diseases":["B-ALL"],"text":"B-ALL with PAX5 P80R is a distinct ICC entity defined by the PAX5 P80R hotspot mutation."},{"id":"arber-2022-blood-140-1200-C0138","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["PAX5"],"diseases":["B-ALL"],"text":"PAX5-altered B-ALL is a provisional ICC entity characterized by diverse PAX5 alterations including rearrangements, point mutations, and intragenic lesions."},{"id":"arber-2022-blood-140-1200-C0139","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["BCL11B"],"diseases":["ETP-ALL"],"text":"The ICC retains early T-cell precursor ALL, NOS for ETP-ALL not assigned to the BCL11B-rearranged subtype."},{"id":"arber-2022-blood-140-1200-C0140","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["T-ALL, NOS"],"text":"The ICC retains T-ALL, NOS as a classification category."},{"id":"arber-2022-blood-140-1200-C0141","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["T-ALL"],"text":"Additional transcription-factor-defined T-ALL subgroups are considered provisional ICC entities because the underlying lesions are complex, diagnosis is challenging, and subtype definitions vary."},{"id":"arber-2022-blood-140-1200-C0142","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["acute lymphoblastic leukaemia/lymphoma"],"text":"Natural killer cell ALL is listed as a provisional ICC entity."},{"id":"arber-2022-blood-140-1200-C0143","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["BCL11B"],"diseases":["ETP-ALL"],"text":"The ICC recognizes early T-cell precursor lymphoblastic leukemia (ETP-ALL) with BCL11B rearrangement as a subtype."},{"id":"arber-2022-blood-140-1200-C0144","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["ETP-ALL"],"text":"Near-ETP ALL is defined phenotypically by an ETP-like immunophenotype with CD5 present on >75% of cells rather than <=75% as in ETP-ALL."},{"id":"arber-2022-blood-140-1200-C0145","paper":"arber-2022-blood-140-1200","category":"prognosis","tier":"restated secondary","genes":["JAK2"],"diseases":["PV"],"text":"In polycythemia vera, JAK2 exon 12-mutated cases are prognostically similar to JAK2 V617F-mutated cases."},{"id":"arber-2022-blood-140-1200-C0147","paper":"arber-2022-blood-140-1200","category":"prognosis","tier":"restated secondary","genes":["TP53"],"diseases":["MDS","MDS/AML","AML"],"text":"Across MDS, MDS/AML, and AML, multihit TP53 is associated with highly aggressive disease and short survival."},{"id":"arber-2022-blood-140-1200-C0148","paper":"arber-2022-blood-140-1200","category":"prognosis","tier":"restated secondary","genes":["TP53"],"diseases":["MDS"],"text":"In MDS with multihit TP53, prognosis does not appear to depend on blast percentage."},{"id":"arber-2022-blood-140-1200-C0149","paper":"arber-2022-blood-140-1200","category":"prognosis","tier":"restated secondary","genes":["TP53"],"diseases":["MDS"],"text":"MDS with complex karyotype but no TP53 mutation has superior prognosis to TP53-mutated MDS."},{"id":"arber-2022-blood-140-1200-C0150","paper":"arber-2022-blood-140-1200","category":"prognosis","tier":"restated secondary","genes":["TP53"],"diseases":["MDS"],"text":"Monoallelic TP53 mutations in MDS have a less adverse prognostic effect than multihit TP53 mutations."},{"id":"arber-2022-blood-140-1200-C0151","paper":"arber-2022-blood-140-1200","category":"prognosis","tier":"restated secondary","genes":["CEBPA"],"diseases":["AML"],"text":"In-frame bZIP CEBPA mutations define a favorable AML prognostic entity."},{"id":"arber-2022-blood-140-1200-C0152","paper":"arber-2022-blood-140-1200","category":"prognosis","tier":"restated secondary","genes":["TP53"],"diseases":["AML"],"text":"TP53 mutations define a distinctly aggressive AML category with very poor outcome, whether AML presents de novo, after MDS progression, or as therapy-related disease."},{"id":"arber-2022-blood-140-1200-C0153","paper":"arber-2022-blood-140-1200","category":"prognosis","tier":"restated secondary","genes":["ASXL1","BCOR","EZH2","RUNX1","SF3B1","SRSF2","STAG2","U2AF1","ZRSR2"],"diseases":["AML"],"text":"Myelodysplasia-related gene mutations in ASXL1, BCOR, EZH2, RUNX1, SF3B1, SRSF2, STAG2, U2AF1, or ZRSR2 confer an adverse prognosis in de novo AML comparable to secondary AML."},{"id":"arber-2022-blood-140-1200-C0154","paper":"arber-2022-blood-140-1200","category":"prognosis","tier":"restated secondary","genes":["TP53"],"diseases":["AML"],"text":"When TP53 mutation overlaps another AML genetic category, its presence is usually predictive of worse prognosis."},{"id":"arber-2022-blood-140-1200-C0155","paper":"arber-2022-blood-140-1200","category":"prognosis","tier":"restated secondary","genes":["MYC"],"diseases":["B-ALL"],"text":"B-ALL with MYC rearrangement is associated with poor prognosis."},{"id":"arber-2022-blood-140-1200-C0156","paper":"arber-2022-blood-140-1200","category":"prognosis","tier":"restated secondary","genes":["DUX4","IKZF1"],"diseases":["B-ALL"],"text":"DUX4-rearranged B-ALL is associated with excellent prognosis in children and adults, even with other poor-risk features such as IKZF1 deletion."},{"id":"arber-2022-blood-140-1200-C0157","paper":"arber-2022-blood-140-1200","category":"prognosis","tier":"restated secondary","genes":["MEF2D"],"diseases":["B-ALL"],"text":"MEF2D-rearranged B-ALL has poor prognosis."},{"id":"arber-2022-blood-140-1200-C0158","paper":"arber-2022-blood-140-1200","category":"prognosis","tier":"restated secondary","genes":["EP300","TCF3","ZNF384"],"diseases":["B-ALL"],"text":"In ZNF384-rearranged B-ALL or B/myeloid acute leukemia of ambiguous lineage, prognosis varies by fusion partner, with EP300-associated disease having the best and TCF3-associated disease the worst prognosis."},{"id":"arber-2022-blood-140-1200-C0159","paper":"arber-2022-blood-140-1200","category":"prognosis","tier":"restated secondary","genes":["KMT2A","NUTM1"],"diseases":["B-ALL"],"text":"NUTM1-rearranged B-ALL has a much more favorable prognosis than KMT2A-rearranged infant leukemia."},{"id":"arber-2022-blood-140-1200-C0160","paper":"arber-2022-blood-140-1200","category":"prognosis","tier":"restated secondary","genes":["HLF"],"diseases":["B-ALL"],"text":"HLF-rearranged B-ALL has very poor prognosis."},{"id":"arber-2022-blood-140-1200-C0162","paper":"arber-2022-blood-140-1200","category":"prognosis","tier":"restated secondary","genes":["IKZF1"],"diseases":["B-ALL"],"text":"B-ALL with IKZF1 N159Y has intermediate prognosis in the ICC summary table."},{"id":"arber-2022-blood-140-1200-C0163","paper":"arber-2022-blood-140-1200","category":"prognosis","tier":"restated secondary","genes":["PAX5"],"diseases":["B-ALL"],"text":"PAX5 P80R B-ALL has a relatively favorable prognosis, particularly in adults."},{"id":"arber-2022-blood-140-1200-C0165","paper":"arber-2022-blood-140-1200","category":"prognosis","tier":"restated secondary","genes":["CEBPE","IGH","ZEB2"],"diseases":["B-ALL"],"text":"B-ALL cases with ZEB2 H1038R that co-cluster with IGH::CEBPE have poor prognosis."},{"id":"arber-2022-blood-140-1200-C0166","paper":"arber-2022-blood-140-1200","category":"treatment","tier":"restated secondary","genes":["PDGFRA","PDGFRB"],"diseases":["myeloid/lymphoid neoplasm with eosinophilia and TK fusion"],"text":"PDGFRA-rearranged and PDGFRB-rearranged myeloid/lymphoid neoplasms with eosinophilia and tyrosine kinase gene fusions show excellent response to tyrosine kinase inhibitor therapy."},{"id":"arber-2022-blood-140-1200-C0167","paper":"arber-2022-blood-140-1200","category":"treatment","tier":"restated secondary","genes":["FGFR1"],"diseases":["myeloid/lymphoid neoplasm with eosinophilia and TK fusion"],"text":"FGFR1-rearranged myeloid/lymphoid neoplasm with eosinophilia and tyrosine kinase gene fusion has a high rate of response to FGFR inhibition such as pemigatinib, especially in chronic phase."},{"id":"arber-2022-blood-140-1200-C0168","paper":"arber-2022-blood-140-1200","category":"treatment","tier":"restated secondary","genes":["JAK2"],"diseases":["myeloid/lymphoid neoplasm with eosinophilia and TK fusion"],"text":"JAK2-rearranged myeloid/lymphoid neoplasm with eosinophilia and tyrosine kinase gene fusion has shown limited responses to ruxolitinib."},{"id":"arber-2022-blood-140-1200-C0170","paper":"arber-2022-blood-140-1200","category":"treatment","tier":"restated secondary","genes":["ABL1","ETV6"],"diseases":["myeloid/lymphoid neoplasm with eosinophilia and TK fusion"],"text":"ETV6::ABL1-rearranged myeloid/lymphoid neoplasm with eosinophilia and tyrosine kinase gene fusion has shown therapeutic benefit from tyrosine kinase inhibitors, especially second-generation TKIs."},{"id":"arber-2022-blood-140-1200-C0172","paper":"arber-2022-blood-140-1200","category":"treatment","tier":"restated secondary","genes":["TP53"],"diseases":["MDS","MDS/AML","AML"],"text":"The ICC groups TP53-mutated MDS, MDS/AML, and AML because their similarly aggressive behavior irrespective of blast percentage is stated to warrant a more unified treatment strategy across the blast spectrum."},{"id":"arber-2022-blood-140-1200-C0173","paper":"arber-2022-blood-140-1200","category":"treatment","tier":"restated secondary","genes":["ABL1","BCR"],"diseases":["B-ALL"],"text":"BCR::ABL1-like B-ALL with an ABL-class fusion has a distinctive response pattern to ABL1-class tyrosine kinase inhibitors, making recognition of this subgroup treatment-relevant."},{"id":"arber-2022-blood-140-1200-C0178","paper":"arber-2022-blood-140-1200","category":"biomarker","tier":"guideline criterion","genes":["JAK2"],"diseases":["PV"],"text":"For suspected polycythemia vera, the ICC recommends highly sensitive JAK2 V617F testing (<1% sensitivity); if negative, noncanonical or atypical JAK2 mutations in exons 12-15 should be sought."},{"id":"arber-2022-blood-140-1200-C0179","paper":"arber-2022-blood-140-1200","category":"biomarker","tier":"restated secondary","genes":["ABL1","BCR","CALR","JAK2","MPL"],"diseases":["MPN"],"text":"In BCR::ABL1-negative MPN, a JAK2 V617F VAF <1% should prompt a search for coexisting canonical CALR and MPL mutations."},{"id":"arber-2022-blood-140-1200-C0180","paper":"arber-2022-blood-140-1200","category":"biomarker","tier":"guideline criterion","genes":["CALR","JAK2","MPL"],"diseases":["ET"],"text":"For suspected essential thrombocythemia, the ICC recommends highly sensitive assays for JAK2 V617F (<1% sensitivity) and CALR/MPL (1%-3% sensitivity), with consideration of noncanonical JAK2 and MPL mutations when canonical testing is negative."},{"id":"arber-2022-blood-140-1200-C0181","paper":"arber-2022-blood-140-1200","category":"biomarker","tier":"guideline criterion","genes":["CALR","JAK2","MPL"],"diseases":["PMF"],"text":"For suspected primary myelofibrosis, the ICC recommends highly sensitive assays for JAK2 V617F (<1% sensitivity) and CALR/MPL (1%-3% sensitivity), with consideration of noncanonical JAK2 and MPL mutations when canonical testing is negative."},{"id":"arber-2022-blood-140-1200-C0182","paper":"arber-2022-blood-140-1200","category":"biomarker","tier":"guideline criterion","genes":["CALR","JAK2","MPL"],"diseases":["MPN-U"],"text":"For suspected MPN-U, the ICC recommends highly sensitive JAK2 V617F testing with sensitivity <1% and CALR/MPL testing with sensitivity 1%-3%; when canonical testing is negative, noncanonical JAK2 and MPL mutations should be considered."},{"id":"arber-2022-blood-140-1200-C0184","paper":"arber-2022-blood-140-1200","category":"biomarker","tier":"guideline criterion","genes":["KIT"],"diseases":["mastocytosis"],"text":"In suspected systemic mastocytosis without a KIT mutation, particularly when eosinophilia is present, the ICC requires exclusion of tyrosine-kinase gene fusions associated with myeloid/lymphoid neoplasm with eosinophilia."},{"id":"arber-2022-blood-140-1200-C0185","paper":"arber-2022-blood-140-1200","category":"biomarker","tier":"guideline criterion","genes":["KIT"],"diseases":["mastocytosis"],"text":"In suspected systemic mastocytosis, high-sensitivity PCR is recommended for KIT D816V; if negative, testing for other KIT mutation variants is strongly recommended."},{"id":"arber-2022-blood-140-1200-C0186","paper":"arber-2022-blood-140-1200","category":"biomarker","tier":"guideline criterion","genes":["ABL1","ETV6","FGFR1","FLT3","JAK2","PDGFRA","PDGFRB"],"diseases":["mastocytosis"],"text":"When eosinophilia is present in systemic mastocytosis, the ICC recommends excluding PDGFRA, PDGFRB, FGFR1, JAK2, FLT3, and ETV6::ABL1 tyrosine-kinase gene fusions associated with myeloid/lymphoid neoplasm with eosinophilia."},{"id":"arber-2022-blood-140-1200-C0187","paper":"arber-2022-blood-140-1200","category":"biomarker","tier":"restated secondary","genes":["ABL1","BCR"],"diseases":["B-ALL"],"text":"FISH detection of BCR::ABL1 in granulocytes supports multilineage involvement, whereas FISH positivity confined to lymphoblasts supports lymphoid-only BCR::ABL1-positive B-ALL."},{"id":"arber-2022-blood-140-1200-C0188","paper":"arber-2022-blood-140-1200","category":"biomarker","tier":"restated secondary","genes":["ABL1","BCR"],"diseases":["B-ALL"],"text":"In some BCR::ABL1-positive B-ALL cases, cell sorting may be necessary to obtain enough myeloid cells for FISH assessment of multilineage versus lymphoid-only BCR::ABL1 involvement."},{"id":"arber-2022-blood-140-1200-C0189","paper":"arber-2022-blood-140-1200","category":"biomarker","tier":"restated secondary","genes":["ABL1","BCR"],"diseases":["B-ALL"],"text":"After treatment of BCR::ABL1-positive B-ALL with multilineage involvement, high BCR::ABL1 RT-PCR positivity can persist despite little or no MRD by flow cytometry or other molecular MRD methods, so BCR::ABL1 PCR alone may not reflect residual lymphoblastic disease."},{"id":"arber-2022-blood-140-1200-C0190","paper":"arber-2022-blood-140-1200","category":"biomarker","tier":"restated secondary","genes":["ABL1","BCR","CRLF2"],"diseases":["B-ALL"],"text":"CRLF2 rearrangement in BCR::ABL1-like B-ALL can often be detected by FISH or screened by flow cytometry because CRLF2 is upregulated."},{"id":"arber-2022-blood-140-1200-C0191","paper":"arber-2022-blood-140-1200","category":"biomarker","tier":"restated secondary","genes":["MYC"],"diseases":["B-ALL"],"text":"Somatic hypermutation of immunoglobulin V(H) genes favors a MYC-rearranged mature B-cell lymphoma, whereas B-ALL with MYC rearrangement has unmutated immunoglobulin V(H) genes."},{"id":"arber-2022-blood-140-1200-C0193","paper":"arber-2022-blood-140-1200","category":"biomarker","tier":"restated secondary","genes":["DUX4"],"diseases":["B-ALL"],"text":"DUX4 overexpression is specific for DUX4-rearranged B-ALL and can be detected by quantitation of DUX4 gene expression or immunohistochemistry."},{"id":"arber-2022-blood-140-1200-C0194","paper":"arber-2022-blood-140-1200","category":"biomarker","tier":"restated secondary","genes":["DUX4"],"diseases":["B-ALL"],"text":"In DUX4-rearranged B-ALL, CD371 expression is associated with DUX4 rearrangement and may be identified by flow cytometry."},{"id":"arber-2022-blood-140-1200-C0195","paper":"arber-2022-blood-140-1200","category":"biomarker","tier":"restated secondary","genes":["DUX4","IGH"],"diseases":["B-ALL"],"text":"In DUX4-rearranged B-ALL, the DUX4 rearrangement is difficult to detect by FISH, and whole-transcriptome sequencing may also miss some cases because of repetitive genomic features at the DUX4 and IGH loci."},{"id":"arber-2022-blood-140-1200-C0196","paper":"arber-2022-blood-140-1200","category":"biomarker","tier":"guideline criterion","genes":["HLF","MEF2D"],"diseases":["B-ALL"],"text":"Whole-transcriptome sequencing and corresponding MEF2D or HLF FISH are listed diagnostic approaches for MEF2D-rearranged or HLF-rearranged B-ALL, respectively."},{"id":"arber-2022-blood-140-1200-C0197","paper":"arber-2022-blood-140-1200","category":"biomarker","tier":"restated secondary","genes":["MEF2D"],"diseases":["B-ALL"],"text":"MEF2D-rearranged B-ALL can be suspected from a CD10-negative or dim, CD38-positive, cytoplasmic-mu-positive immunophenotype."},{"id":"arber-2022-blood-140-1200-C0198","paper":"arber-2022-blood-140-1200","category":"biomarker","tier":"restated secondary","genes":["ZNF362","ZNF384"],"diseases":["B-ALL"],"text":"In ZNF384- or ZNF362-rearranged leukemia, MPO negativity supports classification as B-ALL whereas MPO positivity supports B/myeloid mixed-phenotype acute leukemia."},{"id":"arber-2022-blood-140-1200-C0199","paper":"arber-2022-blood-140-1200","category":"biomarker","tier":"guideline criterion","genes":["ZNF362","ZNF384"],"diseases":["B-ALL"],"text":"Whole-transcriptome sequencing, with FISH possible, is listed as a diagnostic approach for ZNF384- or ZNF362-rearranged B-ALL."},{"id":"arber-2022-blood-140-1200-C0200","paper":"arber-2022-blood-140-1200","category":"biomarker","tier":"restated secondary","genes":["NUTM1"],"diseases":["B-ALL"],"text":"NUTM1-rearranged B-ALL can be diagnosed using a standard NUTM1 break-apart FISH probe set."},{"id":"arber-2022-blood-140-1200-C0201","paper":"arber-2022-blood-140-1200","category":"biomarker","tier":"restated secondary","genes":["NUTM1"],"diseases":["B-ALL"],"text":"NUTM1-rearranged B-ALL typically has a CD10-negative or dim immunophenotype with expression of myeloid markers including CD13, CD15, or CD33."},{"id":"arber-2022-blood-140-1200-C0202","paper":"arber-2022-blood-140-1200","category":"biomarker","tier":"restated secondary","genes":["NUTM1"],"diseases":["B-ALL"],"text":"In addition to NUTM1 break-apart FISH, the ICC table lists whole-transcriptome sequencing and NUTM1-overexpression assays by whole-transcriptome sequencing, RT-PCR, or immunohistochemistry as diagnostic approaches for NUTM1-rearranged B-ALL."},{"id":"arber-2022-blood-140-1200-C0203","paper":"arber-2022-blood-140-1200","category":"biomarker","tier":"guideline criterion","genes":["CDX2","UBTF"],"diseases":["B-ALL"],"text":"RT-PCR and whole-transcriptome sequencing are listed diagnostic approaches for CDX2/UBTF-deregulated B-ALL."},{"id":"arber-2022-blood-140-1200-C0204","paper":"arber-2022-blood-140-1200","category":"biomarker","tier":"restated secondary","genes":["CDX2","UBTF"],"diseases":["B-ALL"],"text":"CDX2/UBTF-deregulated B-ALL is described with a CD10-negative, cytoplasmic-IgM-positive immunophenotype."},{"id":"arber-2022-blood-140-1200-C0205","paper":"arber-2022-blood-140-1200","category":"biomarker","tier":"guideline criterion","genes":["IKZF1","PAX5"],"diseases":["B-ALL"],"text":"Exome or gene-panel sequencing is listed as a diagnostic approach for B-ALL with IKZF1 N159Y or PAX5 P80R."},{"id":"arber-2022-blood-140-1200-C0206","paper":"arber-2022-blood-140-1200","category":"biomarker","tier":"guideline criterion","genes":["PAX5"],"diseases":["B-ALL"],"text":"Complete definition of the provisional PAX5-altered B-ALL group requires gene-expression profiling."},{"id":"arber-2022-blood-140-1200-C0207","paper":"arber-2022-blood-140-1200","category":"biomarker","tier":"restated secondary","genes":["BCL11B"],"diseases":["ETP-ALL"],"text":"Most BCL11B-rearranged ETP-ALL cases may be detected by FISH demonstrating disruption of the BCL11B locus."},{"id":"arber-2022-blood-140-1200-C0208","paper":"arber-2022-blood-140-1200","category":"germline","tier":"restated secondary","genes":["NF1"],"diseases":[],"text":"An ICC genetic route to JMML is either a germline NF1 mutation with loss of heterozygosity of NF1, or a clinical diagnosis of neurofibromatosis type 1."},{"id":"arber-2022-blood-140-1200-C0209","paper":"arber-2022-blood-140-1200","category":"germline","tier":"restated secondary","genes":["CBL"],"diseases":[],"text":"JMML associated with germline CBL requires germline CBL alteration with acquired loss of heterozygosity/biallelic CBL inactivation in hematopoietic cells, although occasional cases remain heterozygous."},{"id":"arber-2022-blood-140-1200-C0210","paper":"arber-2022-blood-140-1200","category":"germline","tier":"restated secondary","genes":["KRAS","NRAS","PTPN11"],"diseases":[],"text":"PTPN11-, NRAS-, and KRAS-mutated JMML subtypes are typically characterized by heterozygous somatic gain-of-function mutations in children without germline disease."},{"id":"arber-2022-blood-140-1200-C0211","paper":"arber-2022-blood-140-1200","category":"germline","tier":"restated secondary","genes":["KRAS","NRAS","PTPN11","RIT1"],"diseases":[],"text":"Noonan syndrome with germline PTPN11, NRAS, KRAS, or RIT1 can cause a transient myeloproliferative disorder in the first year of life that may mimic JMML but lacks acquired somatic mutations; the ICC summary describes no secondary mutations and usually a normal karyotype, with rare monosomy 7."},{"id":"arber-2022-blood-140-1200-C0212","paper":"arber-2022-blood-140-1200","category":"germline","tier":"restated secondary","genes":["GATA2","SAMD9","SAMD9L"],"diseases":[],"text":"Germline GATA2, SAMD9, and SAMD9L predisposition can precede refractory cytopenia of childhood, in which RCC may represent progression to marrow failure or frank MDS."},{"id":"arber-2022-blood-140-1200-C0213","paper":"arber-2022-blood-140-1200","category":"germline","tier":"restated secondary","genes":["CEBPA"],"diseases":[],"text":"Germline CEBPA mutation predisposes to AML."},{"id":"arber-2022-blood-140-1200-C0214","paper":"arber-2022-blood-140-1200","category":"germline","tier":"restated secondary","genes":["DDX41"],"diseases":[],"text":"Germline DDX41 mutation predisposes to both myeloid and lymphoid neoplasms."},{"id":"arber-2022-blood-140-1200-C0215","paper":"arber-2022-blood-140-1200","category":"germline","tier":"restated secondary","genes":["TP53"],"diseases":[],"text":"Germline TP53 mutation/Li-Fraumeni syndrome predisposes to myeloid and lymphoid malignancies in treatment-naive and therapy-related settings."},{"id":"arber-2022-blood-140-1200-C0216","paper":"arber-2022-blood-140-1200","category":"germline","tier":"restated secondary","genes":["RUNX1"],"diseases":[],"text":"Germline RUNX1 mutation, associated with a constitutional platelet disorder, predisposes to myeloid and lymphoid neoplasms."},{"id":"arber-2022-blood-140-1200-C0217","paper":"arber-2022-blood-140-1200","category":"germline","tier":"restated secondary","genes":["ANKRD26"],"diseases":[],"text":"Germline ANKRD26 mutation, associated with a constitutional platelet disorder, predisposes to myeloid neoplasms."},{"id":"arber-2022-blood-140-1200-C0218","paper":"arber-2022-blood-140-1200","category":"germline","tier":"restated secondary","genes":["ETV6"],"diseases":[],"text":"Germline ETV6 mutation, associated with a constitutional platelet disorder, predisposes to myeloid and lymphoid neoplasms, including ALL."},{"id":"arber-2022-blood-140-1200-C0219","paper":"arber-2022-blood-140-1200","category":"germline","tier":"restated secondary","genes":["GATA2"],"diseases":[],"text":"Germline GATA2 mutation predisposes to myeloid neoplasms."},{"id":"arber-2022-blood-140-1200-C0220","paper":"arber-2022-blood-140-1200","category":"germline","tier":"restated secondary","genes":["SAMD9","SAMD9L"],"diseases":[],"text":"Germline SAMD9 or SAMD9L mutation predisposes to myeloid neoplasms and is associated with acquired monosomy 7/del(7q) and MDS."},{"id":"arber-2022-blood-140-1200-C0221","paper":"arber-2022-blood-140-1200","category":"germline","tier":"restated secondary","genes":["IKZF1","PAX5"],"diseases":[],"text":"Germline PAX5 or IKZF1 mutation predisposes to acute lymphoblastic leukemia."},{"id":"arber-2022-blood-140-1200-C0222","paper":"arber-2022-blood-140-1200","category":"germline","tier":"restated secondary","genes":["IKZF1","PAX5"],"diseases":[],"text":"Germline PAX5 or IKZF1 mutation can predispose to loss of B-cell subsets and immune deficiency."},{"id":"arber-2022-blood-140-1200-C0223","paper":"arber-2022-blood-140-1200","category":"germline","tier":"restated secondary","genes":["NF1"],"diseases":[],"text":"Germline NF1 predisposition associated with neurofibromatosis can predispose to JMML."},{"id":"arber-2022-blood-140-1200-C0224","paper":"arber-2022-blood-140-1200","category":"germline","tier":"restated secondary","genes":["PTPN11"],"diseases":[],"text":"Germline PTPN11 predisposition associated with Noonan syndrome can predispose to JMML or a Noonan-associated myeloproliferative disorder."},{"id":"arber-2022-blood-140-1200-C0225","paper":"arber-2022-blood-140-1200","category":"germline","tier":"restated secondary","genes":["CBL"],"diseases":[],"text":"Germline CBL predisposition associated with a Noonan-like syndrome can predispose to JMML."},{"id":"arber-2022-blood-140-1200-C0226","paper":"arber-2022-blood-140-1200","category":"germline","tier":"restated secondary","genes":["BLM"],"diseases":[],"text":"Germline BLM mutation/Bloom syndrome is associated with predisposition to hematologic malignancy."},{"id":"arber-2022-blood-140-1200-C0227","paper":"arber-2022-blood-140-1200","category":"germline","tier":"restated secondary","genes":["DNMT3A","ERCC6L2","MBD4","XPC"],"diseases":[],"text":"Germline DNMT3A, ERCC6L2, MBD4, or XPC mutation is associated with predisposition to hematologic malignancy."},{"id":"baliakas-2019-operational-germline-testing-C0002","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"restated secondary","genes":["CEBPA","DDX41","RUNX1","ANKRD26","ETV6","GATA2","SAMD9","SAMD9L","SRP72","CBL","KRAS","NF1","PTPN11","TP53","MECOM"],"diseases":[],"text":"The Nordic 2019 guidelines list germline predisposition involving CEBPA, DDX41, RUNX1, ANKRD26, ETV6, GATA2, SAMD9, SAMD9L, SRP72, CBL, KRAS, NF1, PTPN11, TP53, and MECOM as autosomal dominant."},{"id":"baliakas-2019-operational-germline-testing-C0003","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"restated secondary","genes":["CEBPA"],"diseases":[],"text":"According to the Nordic 2019 guidelines, germline CEBPA predisposition is associated with AML and has a reported lifetime myeloid-malignancy risk >80%."},{"id":"baliakas-2019-operational-germline-testing-C0004","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"restated secondary","genes":["DDX41"],"diseases":[],"text":"The Nordic 2019 guidelines list germline DDX41 predisposition as associated with MDS and AML."},{"id":"baliakas-2019-operational-germline-testing-C0007","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"restated secondary","genes":["DDX41"],"diseases":[],"text":"For germline DDX41 predisposition, CML, CMML and lymphomas have also been reported in addition to MDS and AML."},{"id":"baliakas-2019-operational-germline-testing-C0010","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"restated secondary","genes":["RUNX1"],"diseases":[],"text":"According to the Nordic 2019 guidelines, germline RUNX1 predisposition is associated with MDS and AML, with ALL also listed, and has a reported lifetime myeloid-malignancy risk of approximately 45%."},{"id":"baliakas-2019-operational-germline-testing-C0014","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"restated secondary","genes":["ANKRD26"],"diseases":[],"text":"According to the Nordic 2019 guidelines, germline ANKRD26 predisposition is associated with AML, MDS and CML and has a reported lifetime myeloid-malignancy risk of approximately 8%."},{"id":"baliakas-2019-operational-germline-testing-C0016","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"restated secondary","genes":["ETV6"],"diseases":[],"text":"The Nordic 2019 guidelines list germline ETV6 predisposition as associated with ALL, AML and MDS."},{"id":"baliakas-2019-operational-germline-testing-C0021","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"restated secondary","genes":["GATA2"],"diseases":[],"text":"According to the Nordic 2019 guidelines, germline GATA2 deficiency predisposes to MDS and AML and has a reported lifetime myeloid-malignancy risk >80%."},{"id":"baliakas-2019-operational-germline-testing-C0022","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"restated secondary","genes":["GATA2"],"diseases":[],"text":"GATA2 deficiency syndrome can include B-cell, NK-cell and CD4-cell lymphocytopenia, monocytopenia, viral susceptibility, warts, disseminated nontuberculous mycobacterial infection, lymphedema, sensorineural hearing loss and pulmonary alveolar proteinosis."},{"id":"baliakas-2019-operational-germline-testing-C0023","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"restated secondary","genes":["SAMD9","SAMD9L"],"diseases":[],"text":"The Nordic 2019 guidelines list germline SAMD9-related MIRAGE syndrome and SAMD9L-related ataxia-pancytopenia syndrome as predisposing to MDS or AML with monosomy 7."},{"id":"baliakas-2019-operational-germline-testing-C0025","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"restated secondary","genes":["SAMD9","SAMD9L"],"diseases":[],"text":"According to the Nordic 2019 guidelines, both SAMD9-related MIRAGE syndrome and SAMD9L-related ataxia-pancytopenia syndrome have a high lifetime risk of myeloid malignancy."},{"id":"baliakas-2019-operational-germline-testing-C0027","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"restated secondary","genes":["SAMD9"],"diseases":[],"text":"SAMD9-related MIRAGE syndrome can include cytopenias and marrow failure, growth restriction, infection susceptibility, adrenal hypoplasia, genital phenotypes and enteropathy."},{"id":"baliakas-2019-operational-germline-testing-C0028","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"restated secondary","genes":["SAMD9L"],"diseases":[],"text":"SAMD9L-related ataxia-pancytopenia syndrome can include cytopenias and marrow failure, gait disturbance, nystagmus, cerebellar atrophy, white-matter hyperintensities and immunodeficiency."},{"id":"baliakas-2019-operational-germline-testing-C0029","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"restated secondary","genes":["SRP72"],"diseases":[],"text":"Germline SRP72 bone marrow failure syndrome is listed as associated with MDS."},{"id":"baliakas-2019-operational-germline-testing-C0031","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"restated secondary","genes":["SRP72"],"diseases":[],"text":"Germline SRP72 bone marrow failure syndrome can include congenital sensorineural deafness."},{"id":"baliakas-2019-operational-germline-testing-C0033","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"restated secondary","genes":["FANCA","FANCB","FANCC","BRCA2","FANCD2","FANCE","FANCF","FANCG","FANCI","FANCM","PALB2","RAD51C","SLX4"],"diseases":[],"text":"According to the Nordic 2019 guidelines, Fanconi anaemia associated with FANCA, FANCB, FANCC, BRCA2, FANCD2, FANCE, FANCF, FANCG, FANCI, FANCM, PALB2, RAD51C, or SLX4 predisposes to MDS and AML, with a reported lifetime myeloid-malignancy risk of approximately 10%."},{"id":"baliakas-2019-operational-germline-testing-C0034","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"restated secondary","genes":["FANCA","FANCB","FANCC","BRCA2","FANCD2","FANCE","FANCF","FANCG","FANCI","FANCM","PALB2","RAD51C","SLX4"],"diseases":[],"text":"Fanconi anaemia associated with FANCA, FANCB, FANCC, BRCA2, FANCD2, FANCE, FANCF, FANCG, FANCI, FANCM, PALB2, RAD51C and SLX4 can include bone marrow failure, short stature, abnormal skin pigmentation, skeletal anomalies, congenital heart disease, ear anomalies, renal malformations and squamous cell carcinomas."},{"id":"baliakas-2019-operational-germline-testing-C0036","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"restated secondary","genes":["ELANE","CSF3R","GFI1","SRP54","HAX1","G6PC3","JAGN1","VPS45","WAS"],"diseases":[],"text":"According to the Nordic 2019 guidelines, severe congenital neutropenia associated with ELANE, CSF3R, GFI1, SRP54, HAX1, G6PC3, JAGN1, VPS45, or WAS predisposes to MDS and AML, with a reported lifetime myeloid-malignancy risk of 21–40%."},{"id":"baliakas-2019-operational-germline-testing-C0038","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"restated secondary","genes":["SBDS","MLH1","MSH2","MSH6","PMS2","EPCAM","BLM","LIG4","ERCC6L2"],"diseases":[],"text":"The Nordic 2019 guidelines list germline predisposition involving SBDS, MLH1, MSH2, MSH6, PMS2, EPCAM, BLM, LIG4, and ERCC6L2 as autosomal recessive."},{"id":"baliakas-2019-operational-germline-testing-C0039","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"restated secondary","genes":["SBDS"],"diseases":[],"text":"According to the Nordic 2019 guidelines, germline SBDS Shwachman-Diamond syndrome is associated with MDS, AML and ALL and has a reported lifetime myeloid-malignancy risk of 5–24%."},{"id":"baliakas-2019-operational-germline-testing-C0040","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"restated secondary","genes":["SBDS"],"diseases":[],"text":"Germline SBDS Shwachman-Diamond syndrome can include neutropenia, pancreatic insufficiency, short stature and skeletal abnormalities."},{"id":"baliakas-2019-operational-germline-testing-C0042","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"restated secondary","genes":["RPS19","RPS17","RPS24","RPL35A","RPL5","RPL11","RPL15","RPL26","RPS7","RPS26","RPS10","RPS29","GATA1"],"diseases":[],"text":"According to the Nordic 2019 guidelines, Diamond-Blackfan anaemia associated with RPS19, RPS17, RPS24, RPL35A, RPL5, RPL11, RPL15, RPL26, RPS7, RPS26, RPS10, RPS29, or GATA1 is associated with MDS, AML and ALL and has a reported lifetime myeloid-malignancy risk of approximately 5%."},{"id":"baliakas-2019-operational-germline-testing-C0043","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"restated secondary","genes":["RPS19","RPS17","RPS24","RPL35A","RPL5","RPL11","RPL15","RPL26","RPS7","RPS26","RPS10","RPS29","GATA1"],"diseases":[],"text":"Diamond-Blackfan anaemia associated with RPS19, RPS17, RPS24, RPL35A, RPL5, RPL11, RPL15, RPL26, RPS7, RPS26, RPS10, RPS29, or GATA1 can include anaemia with marrow erythroid hypoplasia, small stature and congenital craniofacial, cardiac, skeletal or genitourinary anomalies."},{"id":"baliakas-2019-operational-germline-testing-C0045","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"restated secondary","genes":["DKC1","TERT","TERC","TINF2","RTEL1","PARN","ACD","NOP10","NHP2","WRAP53","CTC1"],"diseases":[],"text":"According to the Nordic 2019 guidelines, telomere biology disorders associated with DKC1, TERT, TERC, TINF2, RTEL1, PARN, ACD, NOP10, NHP2, WRAP53, or CTC1 predispose to MDS and AML, with a reported lifetime myeloid-malignancy risk of 2–30%."},{"id":"baliakas-2019-operational-germline-testing-C0046","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"restated secondary","genes":["DKC1","TERT","TERC","TINF2","RTEL1","PARN","ACD","NOP10","NHP2","WRAP53","CTC1"],"diseases":[],"text":"Telomere biology disorders associated with DKC1, TERT, TERC, TINF2, RTEL1, PARN, ACD, NOP10, NHP2, WRAP53, or CTC1 can include bone marrow failure, nail dystrophy, abnormal skin pigmentation, oral leukoplakia, early hair graying, pulmonary fibrosis, hepatic fibrosis and squamous cell carcinoma."},{"id":"baliakas-2019-operational-germline-testing-C0049","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"restated secondary","genes":["CBL","KRAS","NF1","PTPN11"],"diseases":[],"text":"According to the Nordic 2019 guidelines, RASopathies associated with CBL, KRAS, NF1, or PTPN11 predispose to JMML and AML, with a reported lifetime myeloid-malignancy risk of approximately 10%."},{"id":"baliakas-2019-operational-germline-testing-C0050","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"restated secondary","genes":["CBL","KRAS","NF1","PTPN11"],"diseases":[],"text":"RASopathies associated with CBL, KRAS, NF1, or PTPN11 can include short stature, characteristic facial features, cardio-thoracic defects and coagulopathy."},{"id":"baliakas-2019-operational-germline-testing-C0051","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"restated secondary","genes":["MLH1","MSH2","MSH6","PMS2","EPCAM"],"diseases":[],"text":"Constitutional mismatch repair deficiency associated with MLH1, MSH2, MSH6, PMS2, or EPCAM is listed as associated with ALL, lymphomas, AML and MDS."},{"id":"baliakas-2019-operational-germline-testing-C0053","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"restated secondary","genes":["MLH1","MSH2","MSH6","PMS2","EPCAM"],"diseases":[],"text":"According to the Nordic 2019 guidelines, constitutional mismatch repair deficiency associated with MLH1, MSH2, MSH6, PMS2, or EPCAM has a reported lymphoma/ALL risk of approximately 30%."},{"id":"baliakas-2019-operational-germline-testing-C0054","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"restated secondary","genes":["MLH1","MSH2","MSH6","PMS2","EPCAM"],"diseases":[],"text":"Constitutional mismatch repair deficiency associated with MLH1, MSH2, MSH6, PMS2, or EPCAM can include café-au-lait spots, brain tumours, colorectal cancer, osteosarcoma and other solid tumours."},{"id":"baliakas-2019-operational-germline-testing-C0057","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"restated secondary","genes":["BLM"],"diseases":[],"text":"According to the Nordic 2019 guidelines, germline BLM Bloom syndrome is associated with ALL, AML/MDS and lymphoma and has a reported lifetime myeloid-malignancy risk of approximately 15%."},{"id":"baliakas-2019-operational-germline-testing-C0058","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"restated secondary","genes":["BLM"],"diseases":[],"text":"Germline BLM Bloom syndrome can include growth deficiency, photosensitive skin changes, immunodeficiency, early-onset diabetes, microcephaly, a high-pitched voice, hypogonadism and risk of other cancers."},{"id":"baliakas-2019-operational-germline-testing-C0059","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"restated secondary","genes":["LIG4"],"diseases":[],"text":"Germline LIG4 syndrome is listed as associated with MDS, with the risk described as rare."},{"id":"baliakas-2019-operational-germline-testing-C0061","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"restated secondary","genes":["LIG4"],"diseases":[],"text":"Germline LIG4 syndrome can include short stature, microcephaly, combined immunodeficiency and pancytopenia."},{"id":"baliakas-2019-operational-germline-testing-C0064","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"restated secondary","genes":["TP53"],"diseases":[],"text":"According to the Nordic 2019 guidelines, germline TP53 Li-Fraumeni syndrome is associated with ALL, MDS and AML and has a reported lifetime myeloid-malignancy risk of 2–4%."},{"id":"baliakas-2019-operational-germline-testing-C0065","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"restated secondary","genes":["TP53"],"diseases":[],"text":"According to the Nordic 2019 guidelines, germline TP53 Li-Fraumeni syndrome carries a high overall cancer risk—approximately 50% by age 30 and 90% by age 60—with particularly high risk of cancers including adrenocortical carcinoma, brain and breast cancer, choroid plexus carcinoma, colon and lung cancer, and sarcoma."},{"id":"baliakas-2019-operational-germline-testing-C0067","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"restated secondary","genes":["MECOM"],"diseases":[],"text":"Germline MECOM is listed among bone marrow failure syndromes associated with MDS and AML."},{"id":"baliakas-2019-operational-germline-testing-C0069","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"restated secondary","genes":["MECOM"],"diseases":[],"text":"Germline MECOM-associated bone marrow failure can include skeletal, cardiac and neurological abnormalities."},{"id":"baliakas-2019-operational-germline-testing-C0070","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"restated secondary","genes":["ERCC6L2"],"diseases":[],"text":"ERCC6L2 is listed under other germline bone marrow failure syndromes predisposing to myeloid neoplasms."},{"id":"baliakas-2019-operational-germline-testing-C0072","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"guideline criterion","genes":["TERC","RUNX1"],"diseases":[],"text":"Poor stem-cell mobilisation in a sibling donor candidate is a clinical clue to hereditary myeloid predisposition and has been reported in rare cases with germline TERC and RUNX1 variants."},{"id":"baliakas-2019-operational-germline-testing-C0073","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"guideline criterion","genes":["BRCA2"],"diseases":[],"text":"Under Nordic criterion A3, germline evaluation is indicated for a patient with MDS or AML who has two first- or second-degree relatives with solid tumours, with at least one diagnosed before age 50; BRCA2-related tumour patterns are included among the suggestive cancers."},{"id":"baliakas-2019-operational-germline-testing-C0075","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"guideline criterion","genes":["RUNX1","GATA2","TP53","ETV6","CEBPA"],"diseases":[],"text":"In patients with MDS or AML, a RUNX1, GATA2, TP53, ETV6, or CEBPA variant detected on a somatic NGS panel at VAF 40–60% or >90% can suggest germline origin; the Nordic 2019 guidelines recommend confirmation in extra-haematological tissue after consent."},{"id":"baliakas-2019-operational-germline-testing-C0078","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"restated secondary","genes":["DDX41"],"diseases":[],"text":"A truncating DDX41 variant is usually of germline origin according to the Nordic 2019 guidelines."},{"id":"baliakas-2019-operational-germline-testing-C0079","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"guideline criterion","genes":["GATA2","SAMD9","SAMD9L"],"diseases":[],"text":"Under the Nordic 2019 recommendations, patients diagnosed with MDS or AML before age 50 who lack a suggestive personal or family history but have monosomy 7, del(7q), or another chromosome 7 aberration with loss of 7q material should be referred for genetic counselling/testing; these abnormalities are particularly common in GATA2-, SAMD9-, and SAMD9L-related germline disorders."},{"id":"baliakas-2019-operational-germline-testing-C0080","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"guideline criterion","genes":["GATA2","ANKRD26"],"diseases":[],"text":"For suspected GATA2- or ANKRD26-related germline predisposition, the Nordic 2019 guidelines state that testing should include noncoding regulatory regions."},{"id":"baliakas-2019-operational-germline-testing-C0081","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"restated secondary","genes":["RUNX1","ANKRD26","ETV6"],"diseases":[],"text":"Asymptomatic carriers of germline RUNX1, ANKRD26, or ETV6 variants may have thrombocytopenia or a bleeding tendency at baseline, including bleeding tendency without thrombocytopenia."},{"id":"barbui-2015-blood-cancer-journal-5-e369-C0001","paper":"barbui-2015-blood-cancer-journal-5-e369","category":"prognosis","tier":"restated secondary","genes":["JAK2"],"diseases":["ET"],"text":"In essential thrombocythemia, JAK2 (JAK2V617F) mutation is an independent risk factor for future thrombosis in the original IPSET-thrombosis model."},{"id":"barbui-2015-blood-cancer-journal-5-e369-C0002","paper":"barbui-2015-blood-cancer-journal-5-e369","category":"prognosis","tier":"restated secondary","genes":["CALR"],"diseases":["ET"],"text":"In essential thrombocythemia, CALR mutation does not modify thrombosis-risk prediction by the IPSET-thrombosis model."},{"id":"barbui-2015-blood-cancer-journal-5-e369-C0003","paper":"barbui-2015-blood-cancer-journal-5-e369","category":"prognosis","tier":"univariable or descriptive","genes":["JAK2"],"diseases":["ET"],"text":"Among patients with essential thrombocythemia who are conventionally low risk, defined as age ≤60 years with no history of thrombosis, JAK2 (JAK2V617F)-unmutated patients have lower thrombosis risk than JAK2 (JAK2V617F)-mutated patients, whether or not cardiovascular risk factors are present."},{"id":"barbui-2015-blood-cancer-journal-5-e369-C0004","paper":"barbui-2015-blood-cancer-journal-5-e369","category":"prognosis","tier":"univariable or descriptive","genes":["JAK2"],"diseases":["ET"],"text":"Among patients with essential thrombocythemia who are conventionally high risk, defined by age >60 years and/or a history of thrombosis, the combination of JAK2 (JAK2V617F) mutation and cardiovascular risk factors is associated with higher thrombosis risk than the absence of both additional risk factors."},{"id":"barbui-2015-blood-cancer-journal-5-e369-C0006","paper":"barbui-2015-blood-cancer-journal-5-e369","category":"prognosis","tier":"univariable or descriptive","genes":["JAK2"],"diseases":["ET"],"text":"Among patients with essential thrombocythemia whose conventional high-risk status is defined by a history of thrombosis, regardless of age, JAK2 (JAK2V617F) mutation and/or cardiovascular risk factors provide only limited additional thrombosis-risk information."},{"id":"barbui-2015-blood-cancer-journal-5-e369-C0007","paper":"barbui-2015-blood-cancer-journal-5-e369","category":"prognosis","tier":"univariable or descriptive","genes":["JAK2"],"diseases":["ET"],"text":"The proposed 2015 revision of IPSET-thrombosis classifies essential thrombocythemia with no thrombosis history, age ≤60 years, and JAK2 (JAK2V617F)-unmutated status as very low risk."},{"id":"barbui-2015-blood-cancer-journal-5-e369-C0008","paper":"barbui-2015-blood-cancer-journal-5-e369","category":"prognosis","tier":"univariable or descriptive","genes":["JAK2"],"diseases":["ET"],"text":"The proposed 2015 revision of IPSET-thrombosis classifies essential thrombocythemia with no thrombosis history, age ≤60 years, and JAK2 (JAK2V617F) mutation as low risk."},{"id":"barbui-2015-blood-cancer-journal-5-e369-C0009","paper":"barbui-2015-blood-cancer-journal-5-e369","category":"prognosis","tier":"univariable or descriptive","genes":["JAK2"],"diseases":["ET"],"text":"The proposed 2015 revision of IPSET-thrombosis classifies essential thrombocythemia with no thrombosis history, age >60 years, and JAK2 (JAK2V617F)-unmutated status as intermediate risk."},{"id":"barbui-2015-blood-cancer-journal-5-e369-C0010","paper":"barbui-2015-blood-cancer-journal-5-e369","category":"prognosis","tier":"univariable or descriptive","genes":["JAK2"],"diseases":["ET"],"text":"The proposed 2015 revision of IPSET-thrombosis classifies essential thrombocythemia as high risk when there is a history of thrombosis regardless of age, or when age is >60 years with JAK2 (JAK2V617F) mutation."},{"id":"bernard-2020-tp53-mds-C0001","paper":"bernard-2020-tp53-mds","category":"diagnosis","tier":"univariable or descriptive","genes":["TP53"],"diseases":["MDS"],"text":"For TP53-mutated MDS, a single TP53 mutation with a retained wild-type copy represents a monoallelic state, whereas multiple TP53 mutations or TP53 mutation(s) with TP53 deletion or copy-neutral loss of heterozygosity represent multi-hit TP53, consistent with biallelic targeting."},{"id":"bernard-2020-tp53-mds-C0002","paper":"bernard-2020-tp53-mds","category":"prognosis","tier":"multivariable-adjusted","genes":["TP53"],"diseases":["MDS"],"text":"In MDS, multi-hit TP53 is associated with inferior overall survival and independently identifies adverse-risk disease across IPSS-R strata; poor survival persists irrespective of TP53 VAF and the number of co-occurring driver mutations."},{"id":"bernard-2020-tp53-mds-C0003","paper":"bernard-2020-tp53-mds","category":"prognosis","tier":"multivariable-adjusted","genes":["TP53"],"diseases":["MDS"],"text":"In MDS, monoallelic TP53 is not independently associated with worse overall survival than TP53-wild-type disease."},{"id":"bernard-2020-tp53-mds-C0004","paper":"bernard-2020-tp53-mds","category":"prognosis","tier":"multivariable-adjusted","genes":["TP53"],"diseases":["MDS"],"text":"In MDS, multi-hit TP53 independently predicts increased risk of transformation to acute myeloid leukemia; this adverse risk persists even when the TP53-mutated clone has a low VAF."},{"id":"bernard-2020-tp53-mds-C0005","paper":"bernard-2020-tp53-mds","category":"prognosis","tier":"multivariable-adjusted","genes":["TP53"],"diseases":["MDS"],"text":"In MDS, monoallelic TP53 is not independently associated with greater risk of transformation to acute myeloid leukemia than TP53-wild-type disease."},{"id":"bernard-2020-tp53-mds-C0006","paper":"bernard-2020-tp53-mds","category":"prognosis","tier":"univariable or descriptive","genes":["TP53"],"diseases":["MDS"],"text":"In monoallelic TP53 MDS, survival worsens as the number of co-occurring driver mutations increases."},{"id":"bernard-2020-tp53-mds-C0011","paper":"bernard-2020-tp53-mds","category":"prognosis","tier":"univariable or descriptive","genes":["TP53"],"diseases":["MDS"],"text":"Within multi-hit TP53 MDS, poor outcomes are similar across missense, truncating, and hotspot TP53 mutation types."},{"id":"bernard-2020-tp53-mds-C0012","paper":"bernard-2020-tp53-mds","category":"prognosis","tier":"univariable or descriptive","genes":["TP53"],"diseases":["MDS"],"text":"In monoallelic TP53 MDS, a TP53 R248 hotspot mutation is associated with increased risk of death compared with TP53-wild-type disease."},{"id":"bernard-2020-tp53-mds-C0013","paper":"bernard-2020-tp53-mds","category":"prognosis","tier":"univariable or descriptive","genes":["TP53"],"diseases":["MDS"],"text":"In monoallelic TP53 MDS, a TP53 R175 hotspot mutation, but not R273, was reported to be associated with increased risk of death compared with TP53-wild-type disease; the evidence for the R175 association was less certain than for R248."},{"id":"bernard-2020-tp53-mds-C0014","paper":"bernard-2020-tp53-mds","category":"prognosis","tier":"univariable or descriptive","genes":["TP53"],"diseases":["MDS"],"text":"In TP53-mutated therapy-related MDS, monoallelic TP53 is associated with lower risk of death than multi-hit TP53."},{"id":"bernard-2020-tp53-mds-C0015","paper":"bernard-2020-tp53-mds","category":"prognosis","tier":"multivariable-adjusted","genes":["TP53"],"diseases":["MDS"],"text":"In MDS, multi-hit TP53 and complex karyotype are independent predictors of adverse outcome."},{"id":"bernard-2020-tp53-mds-C0016","paper":"bernard-2020-tp53-mds","category":"prognosis","tier":"univariable or descriptive","genes":["TP53"],"diseases":["MDS"],"text":"Within multi-hit TP53 MDS, multiple TP53 mutations, TP53 mutation plus deletion, and TP53 mutation plus copy-neutral loss of heterozygosity have similarly dismal outcomes."},{"id":"bernard-2020-tp53-mds-C0018","paper":"bernard-2020-tp53-mds","category":"prognosis","tier":"restated secondary","genes":["TP53"],"diseases":["MDS"],"text":"TP53 mutation in therapy-related MDS has been associated with a high risk of progression to acute myeloid leukemia."},{"id":"bernard-2020-tp53-mds-C0019","paper":"bernard-2020-tp53-mds","category":"prognosis","tier":"restated secondary","genes":["TP53"],"diseases":["MDS"],"text":"TP53-mutated therapy-related MDS and disease at progression have been described as an extremely adverse prognostic group with very poor long-term survival."},{"id":"bernard-2020-tp53-mds-C0023","paper":"bernard-2020-tp53-mds","category":"treatment","tier":"univariable or descriptive","genes":["TP53"],"diseases":["MDS"],"text":"In MDS, treatment resistance is associated with multi-hit TP53 rather than TP53 mutation alone; monoallelic TP53 cases had overall therapy responses similar to TP53-wild-type disease."},{"id":"bernard-2020-tp53-mds-C0027","paper":"bernard-2020-tp53-mds","category":"treatment","tier":"restated secondary","genes":["TP53"],"diseases":["MDS"],"text":"TP53-mutated therapy-related MDS and disease at progression have been described as chemorefractory."},{"id":"bernard-2020-tp53-mds-C0028","paper":"bernard-2020-tp53-mds","category":"treatment","tier":"restated secondary","genes":["TP53"],"diseases":["MDS"],"text":"In MDS, TP53-mutated patients have been reported to respond poorly to lenalidomide."},{"id":"bernard-2020-tp53-mds-C0029","paper":"bernard-2020-tp53-mds","category":"treatment","tier":"restated secondary","genes":["TP53"],"diseases":["MDS"],"text":"In MDS, TP53-mutated patients have been reported to respond poorly to hematopoietic stem cell transplantation."},{"id":"bernard-2020-tp53-mds-C0030","paper":"bernard-2020-tp53-mds","category":"treatment","tier":"restated secondary","genes":["TP53"],"diseases":["MDS"],"text":"In MDS, TP53-mutated patients have been reported to have marked but transient responses to hypomethylating agents."},{"id":"bernard-2022-nejm-evidence-1-na-C0001","paper":"bernard-2022-nejm-evidence-1-na","category":"prognosis","tier":"multivariable-adjusted","genes":["ASXL1","CBL","DNMT3A","ETV6","EZH2","FLT3","IDH2","KRAS","KMT2A","NPM1","NRAS","RUNX1","SF3B1","SRSF2","TP53","U2AF1","BCOR","BCORL1","CEBPA","ETNK1","GATA2","GNB1","IDH1","NF1","PHF6","PPM1D","PRPF8","PTPN1
