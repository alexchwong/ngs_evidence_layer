iseases":[],"text":"Under the recurrent-variant DDX41 calibration, BS1_supporting can be used for variants with MAF between 0.0000875 and 0.000219."},{"id":"feurstein-2021-myeloid-germline-C0008","paper":"feurstein-2021-myeloid-germline","category":"germline","tier":"restated secondary","genes":["CEBPA"],"diseases":["AML"],"text":"Germline CEBPA variants cause hereditary AML without other organ manifestations."},{"id":"feurstein-2021-myeloid-germline-C0009","paper":"feurstein-2021-myeloid-germline","category":"prognosis","tier":"restated secondary","genes":["CEBPA"],"diseases":["AML"],"text":"Hereditary AML caused by germline CEBPA variants has a reported median age of onset of 24 years."},{"id":"feurstein-2021-myeloid-germline-C0010","paper":"feurstein-2021-myeloid-germline","category":"germline","tier":"restated secondary","genes":["CEBPA"],"diseases":["AML"],"text":"In AML, germline CEBPA heterozygotes almost always acquire a second CEBPA variant on the constitutionally wild-type allele and therefore present with biallelic CEBPA variants."},{"id":"feurstein-2021-myeloid-germline-C0012","paper":"feurstein-2021-myeloid-germline","category":"germline","tier":"restated secondary","genes":["BRAF","CARD11","CBL","ETV6","IKZF1","KRAS","MPL","NRAS","PTPN11","RAD51","RIT1","STAT3","TP53"],"diseases":["CHIP"],"text":"For BRAF, CARD11, CBL, ETV6, IKZF1, KRAS, MPL, NRAS, PTPN11, RAD51, RIT1, STAT3, and TP53, variants seen in gnomAD may reflect CHIP rather than true germline alleles and this possibility should be considered during germline interpretation."},{"id":"feurstein-2021-myeloid-germline-C0013","paper":"feurstein-2021-myeloid-germline","category":"germline","tier":"restated secondary","genes":["GATA2"],"diseases":[],"text":"For GATA2, missense variants in zinc finger 1 are a typical somatic hotspot, whereas missense variants in zinc finger 2 are a common germline hotspot associated with clinical GATA2 deficiency."},{"id":"feurstein-2021-myeloid-germline-C0014","paper":"feurstein-2021-myeloid-germline","category":"germline","tier":"univariable or descriptive","genes":["ETV6"],"diseases":[],"text":"PM1 can be applied to germline ETV6 variants across the entire ETS domain."},{"id":"feurstein-2021-myeloid-germline-C0015","paper":"feurstein-2021-myeloid-germline","category":"germline","tier":"univariable or descriptive","genes":["ETV6"],"diseases":[],"text":"For ETV6, PM1 may be applied either across the central domain or specifically at the amino-acid 214 mutational hotspot."},{"id":"feurstein-2021-myeloid-germline-C0016","paper":"feurstein-2021-myeloid-germline","category":"germline","tier":"univariable or descriptive","genes":["ANKRD26"],"diseases":[],"text":"PM1 can be applied to the 19-bp ANKRD26 5′ UTR stretch that encompasses all reported pathogenic/likely pathogenic variants."},{"id":"feurstein-2021-myeloid-germline-C0017","paper":"feurstein-2021-myeloid-germline","category":"germline","tier":"restated secondary","genes":["GATA2"],"diseases":[],"text":"GATA2 intronic enhancer variants are an example of disease-causing noncoding variation for which PM1 may be applied when the region is clearly defined, highly conserved, biologically significant, and variants in that region drive disease."},{"id":"feurstein-2021-myeloid-germline-C0018","paper":"feurstein-2021-myeloid-germline","category":"germline","tier":"univariable or descriptive","genes":["BRCA2"],"diseases":[],"text":"PVS1 should not be applied when truncating variants are frequent in the affected exon; the paper illustrates this with common truncating variants in the last exon of BRCA2."},{"id":"feurstein-2021-myeloid-germline-C0019","paper":"feurstein-2021-myeloid-germline","category":"germline","tier":"restated secondary","genes":["ERCC6L2"],"diseases":[],"text":"ERCC6L2 NM_020207.7:c.1930C>T (p.Arg644*) affects both biologically relevant transcripts and has been reported as disease-causing."},{"id":"feurstein-2021-myeloid-germline-C0020","paper":"feurstein-2021-myeloid-germline","category":"germline","tier":"restated secondary","genes":["ERCC6L2"],"diseases":[],"text":"ERCC6L2 NM_020207.7:c.3763C>T (p.Arg1255*) affects only the long HEBO isoform and has been reported as disease-causing."},{"id":"feurstein-2021-myeloid-germline-C0021","paper":"feurstein-2021-myeloid-germline","category":"germline","tier":"restated secondary","genes":["DDX41"],"diseases":[],"text":"PVS1_strong can be applied to DDX41 NM_016222.4:c.1791_1792del (p.Lys597Asnfs*?) because it is not predicted to undergo NMD but still affects a functional domain."},{"id":"feurstein-2021-myeloid-germline-C0022","paper":"feurstein-2021-myeloid-germline","category":"germline","tier":"restated secondary","genes":["ETV6"],"diseases":[],"text":"For ETV6 variant curation, luciferase reporter assays showing decreased transcriptional repression are supported as a pathogenic functional readout."},{"id":"feurstein-2021-myeloid-germline-C0023","paper":"feurstein-2021-myeloid-germline","category":"germline","tier":"restated secondary","genes":["ETV6"],"diseases":[],"text":"For ETV6 variant curation, impaired megakaryocytic differentiation is supported as a pathogenic functional readout."},{"id":"feurstein-2021-myeloid-germline-C0024","paper":"feurstein-2021-myeloid-germline","category":"germline","tier":"restated secondary","genes":["ETV6"],"diseases":[],"text":"For ETV6 variant curation, aberrant cytoplasmic localization of mutant ETV6 is supported as a pathogenic functional readout."},{"id":"feurstein-2021-myeloid-germline-C0025","paper":"feurstein-2021-myeloid-germline","category":"germline","tier":"univariable or descriptive","genes":["ETV6"],"diseases":[],"text":"For ETV6 functional evidence, two different supporting assays can reach moderate strength, while one moderate plus one supporting assay or three supporting assays can reach strong evidence."},{"id":"feurstein-2021-myeloid-germline-C0026","paper":"feurstein-2021-myeloid-germline","category":"germline","tier":"restated secondary","genes":["GATA2"],"diseases":[],"text":"In suspected GATA2 deficiency, pulmonary alveolar proteinosis is a specific extrahematologic feature that can support PP4 in germline variant interpretation."},{"id":"feurstein-2021-myeloid-germline-C0027","paper":"feurstein-2021-myeloid-germline","category":"germline","tier":"restated secondary","genes":["CTC1","STN1"],"diseases":[],"text":"Coats Plus syndrome caused by CTC1 or STN1 is a highly distinct phenotype in which PP4_moderate can be applied during germline variant interpretation."},{"id":"flt3-ras-gilteritinib-resistance-C0001","paper":"flt3-ras-gilteritinib-resistance","category":"prognosis","tier":"univariable or descriptive","genes":["FLT3"],"diseases":["AML"],"text":"In relapsed/refractory AML, no FLT3-ITD allelic-ratio threshold has been established as prognostic; the ADMIRAL cutoff of 0.77 was study-defined rather than a validated prognostic threshold."},{"id":"flt3-ras-gilteritinib-resistance-C0002","paper":"flt3-ras-gilteritinib-resistance","category":"prognosis","tier":"univariable or descriptive","genes":["FLT3"],"diseases":["AML"],"text":"Within ADMIRAL relapsed/refractory FLT3-mutated AML, the study-defined high FLT3-ITD allelic ratio (≥0.77) was associated with shorter overall survival than the low-ratio group across treatment arms; the authors cautioned that 0.77 may be a surrogate for disease burden."},{"id":"flt3-ras-gilteritinib-resistance-C0003","paper":"flt3-ras-gilteritinib-resistance","category":"treatment","tier":"univariable or descriptive","genes":["FLT3"],"diseases":["AML"],"text":"In relapsed/refractory FLT3-mutated AML, gilteritinib showed an overall-survival benefit versus salvage chemotherapy in both high and low FLT3-ITD allelic-ratio groups; allelic ratio did not identify a subgroup lacking benefit."},{"id":"flt3-ras-gilteritinib-resistance-C0004","paper":"flt3-ras-gilteritinib-resistance","category":"treatment","tier":"univariable or descriptive","genes":["FLT3"],"diseases":["AML"],"text":"In relapsed/refractory FLT3-mutated AML, FLT3-ITD length did not identify loss of gilteritinib activity: survival favored gilteritinib across length groups and response was not affected by ITD length."},{"id":"flt3-ras-gilteritinib-resistance-C0005","paper":"flt3-ras-gilteritinib-resistance","category":"treatment","tier":"univariable or descriptive","genes":["FLT3"],"diseases":["AML"],"text":"In relapsed/refractory FLT3-mutated AML, the presence of multiple FLT3-ITD mutations did not adversely affect response to gilteritinib; pretransplant composite complete remission was 52% with gilteritinib versus 32% with salvage chemotherapy."},{"id":"flt3-ras-gilteritinib-resistance-C0006","paper":"flt3-ras-gilteritinib-resistance","category":"treatment","tier":"univariable or descriptive","genes":["FLT3"],"diseases":["AML"],"text":"In relapsed/refractory FLT3-mutated AML, multiple FLT3-ITD mutations did not appear to adversely affect survival during gilteritinib treatment."},{"id":"flt3-ras-gilteritinib-resistance-C0007","paper":"flt3-ras-gilteritinib-resistance","category":"treatment","tier":"univariable or descriptive","genes":["FLT3","DNMT3A","NPM1"],"diseases":["AML"],"text":"In relapsed/refractory FLT3-mutated AML, concurrent DNMT3A and NPM1 mutations identified the molecular subgroup with the most pronounced survival benefit from gilteritinib in ADMIRAL; the genotype-treatment association should be considered preliminary pending independent confirmation."},{"id":"flt3-ras-gilteritinib-resistance-C0008","paper":"flt3-ras-gilteritinib-resistance","category":"treatment","tier":"univariable or descriptive","genes":["FLT3","NRAS","PTPN11","KRAS","CBL"],"diseases":["AML"],"text":"In relapsed/refractory FLT3-mutated AML, baseline Ras/MAPK-pathway mutations—including NRAS, PTPN11, KRAS, or CBL in this cohort—did not preclude clinical benefit from gilteritinib."},{"id":"flt3-ras-gilteritinib-resistance-C0009","paper":"flt3-ras-gilteritinib-resistance","category":"treatment","tier":"univariable or descriptive","genes":["FLT3","NRAS","PTPN11","KRAS"],"diseases":["AML"],"text":"In relapsed/refractory FLT3-mutated AML relapsing on gilteritinib, acquired Ras/MAPK-pathway mutations were a common resistance mechanism; NRAS, PTPN11, and KRAS were the most frequently acquired pathway genes."},{"id":"flt3-ras-gilteritinib-resistance-C0010","paper":"flt3-ras-gilteritinib-resistance","category":"treatment","tier":"univariable or descriptive","genes":["FLT3"],"diseases":["AML"],"text":"In relapsed/refractory FLT3-mutated AML, acquired FLT3 F691L gatekeeper mutations at relapse were associated with resistance to gilteritinib."},{"id":"flt3-ras-gilteritinib-resistance-C0011","paper":"flt3-ras-gilteritinib-resistance","category":"treatment","tier":"restated secondary","genes":["FLT3"],"diseases":["AML"],"text":"For relapsed/refractory FLT3-mutated AML, gilteritinib was superior to salvage chemotherapy in the phase 3 ADMIRAL trial."},{"id":"flt3-ras-gilteritinib-resistance-C0012","paper":"flt3-ras-gilteritinib-resistance","category":"prognosis","tier":"restated secondary","genes":["FLT3"],"diseases":["AML"],"text":"In AML, activating FLT3-ITD mutations are associated with an increased risk of relapse."},{"id":"flt3-ras-gilteritinib-resistance-C0014","paper":"flt3-ras-gilteritinib-resistance","category":"treatment","tier":"restated secondary","genes":["FLT3"],"diseases":["AML"],"text":"In AML, a high FLT3-ITD allelic ratio is associated with a lower likelihood of achieving remission with intensive chemotherapy."},{"id":"flt3-ras-gilteritinib-resistance-C0015","paper":"flt3-ras-gilteritinib-resistance","category":"treatment","tier":"restated secondary","genes":["FLT3"],"diseases":["AML"],"text":"Secondary FLT3 D835 activation-loop mutations confer resistance to type II FLT3 inhibitors, including sorafenib and quizartinib."},{"id":"flt3-ras-gilteritinib-resistance-C0016","paper":"flt3-ras-gilteritinib-resistance","category":"treatment","tier":"restated secondary","genes":["FLT3"],"diseases":["AML"],"text":"Secondary FLT3 F691 gatekeeper mutations confer resistance to both type I and type II FLT3 inhibitors."},{"id":"idh-comutations-inhibitor-resistance-C0001","paper":"idh-comutations-inhibitor-resistance","category":"treatment","tier":"restated secondary","genes":["IDH1"],"diseases":["AML"],"text":"In relapsed/refractory AML, mutant IDH1 is therapeutically targetable with ivosidenib."},{"id":"idh-comutations-inhibitor-resistance-C0002","paper":"idh-comutations-inhibitor-resistance","category":"treatment","tier":"restated secondary","genes":["IDH2"],"diseases":["AML"],"text":"In relapsed/refractory AML, mutant IDH2 is therapeutically targetable with enasidenib."},{"id":"idh-comutations-inhibitor-resistance-C0003","paper":"idh-comutations-inhibitor-resistance","category":"biomarker","tier":"restated secondary","genes":["IDH1","IDH2"],"diseases":["AML"],"text":"During IDH-inhibitor response in AML, IDH mutations may remain detectable in mature neutrophils; mutation persistence is compatible with a differentiation response."},{"id":"idh-comutations-inhibitor-resistance-C0004","paper":"idh-comutations-inhibitor-resistance","category":"treatment","tier":"univariable or descriptive","genes":["RUNX1"],"diseases":["AML"],"text":"In AML treated with an IDH inhibitor, baseline RUNX1 co-mutation was associated with a lower complete-remission rate."},{"id":"idh-comutations-inhibitor-resistance-C0005","paper":"idh-comutations-inhibitor-resistance","category":"treatment","tier":"univariable or descriptive","genes":["NRAS"],"diseases":["AML"],"text":"In AML treated with an IDH inhibitor, baseline NRAS co-mutation trended toward poor response; in the current cohort none of six patients with concurrent NRAS mutation achieved complete remission."},{"id":"idh-comutations-inhibitor-resistance-C0006","paper":"idh-comutations-inhibitor-resistance","category":"treatment","tier":"univariable or descriptive","genes":["CEBPA"],"diseases":["AML"],"text":"In AML treated with an IDH inhibitor, four of five patients with co-occurring CEBPA mutation did not respond."},{"id":"idh-comutations-inhibitor-resistance-C0007","paper":"idh-comutations-inhibitor-resistance","category":"biomarker","tier":"multivariable-adjusted","genes":["DNMT3B","ZBTB46","NYNRIN","ARHGAP22","LAPTM4B","MMRN1","DPYSL3","KIAA0125","CDK6","CPXM1","SOCS2","SMIM24","EMP1","NGFRAP1","CD34","AKR1C3","GPR56"],"diseases":["AML"],"text":"In AML treated with IDH inhibitors, a higher 17-gene LSC17 expression score was associated with nonresponse and predicted complete remission (AUROC 0.785); LSC17 remained significant in multivariable analysis, but the finding requires independent validation."},{"id":"idh-comutations-inhibitor-resistance-C0008","paper":"idh-comutations-inhibitor-resistance","category":"prognosis","tier":"univariable or descriptive","genes":["IDH1","IDH2"],"diseases":["AML"],"text":"Among AML patients responding to IDH-inhibitor therapy, clearance of the IDH mutation was associated with better relapse-free survival than persistence of the mutation."},{"id":"idh-comutations-inhibitor-resistance-C0009","paper":"idh-comutations-inhibitor-resistance","category":"treatment","tier":"univariable or descriptive","genes":["BCOR"],"diseases":["AML"],"text":"In IDH-inhibitor-treated AML, acquisition of BCOR loss-of-function mutation at relapse is implicated in acquired resistance; the mechanism remains uncertain."},{"id":"idh-comutations-inhibitor-resistance-C0010","paper":"idh-comutations-inhibitor-resistance","category":"treatment","tier":"univariable or descriptive","genes":["RUNX1"],"diseases":["AML"],"text":"In IDH-inhibitor-treated AML, RUNX1 mutations may be selected or acquired at relapse and are implicated in acquired resistance."},{"id":"idh-comutations-inhibitor-resistance-C0011","paper":"idh-comutations-inhibitor-resistance","category":"treatment","tier":"univariable or descriptive","genes":["CEBPA"],"diseases":["AML"],"text":"In IDH-inhibitor-treated AML, CEBPA mutations may be acquired at relapse and are implicated in acquired resistance."},{"id":"idh-comutations-inhibitor-resistance-C0012","paper":"idh-comutations-inhibitor-resistance","category":"treatment","tier":"univariable or descriptive","genes":["NRAS","KRAS"],"diseases":["AML"],"text":"In IDH-inhibitor-treated AML, acquisition of NRAS or KRAS mutations at relapse is a major RAS-pathway mechanism of acquired resistance; such mutations were acquired in nearly 30% of cases in this cohort."},{"id":"idh-comutations-inhibitor-resistance-C0013","paper":"idh-comutations-inhibitor-resistance","category":"treatment","tier":"univariable or descriptive","genes":["TET2"],"diseases":["AML"],"text":"In IDH-inhibitor-treated AML, emergent TET2 mutation is a likely acquired-resistance mechanism; observed TET2-associated relapses occurred despite ongoing 2HG suppression and were accompanied by loss of treatment-associated hypomethylation."},{"id":"idh-comutations-inhibitor-resistance-C0014","paper":"idh-comutations-inhibitor-resistance","category":"treatment","tier":"univariable or descriptive","genes":["IDH1","IDH2"],"diseases":["AML"],"text":"In IDH-inhibitor-treated AML, emergence of a mutation in the alternate IDH isoform during inhibition of the original mutant isoform (IDH homolog switching) can mediate acquired resistance."},{"id":"idh-comutations-inhibitor-resistance-C0015","paper":"idh-comutations-inhibitor-resistance","category":"treatment","tier":"restated secondary","genes":["IDH2"],"diseases":["AML"],"text":"In AML receiving IDH-inhibitor therapy, acquired IDH2 dimer-interface mutations p.Q316E and p.I391M have been reported in cases of secondary resistance."},{"id":"idh-comutations-inhibitor-resistance-C0016","paper":"idh-comutations-inhibitor-resistance","category":"treatment","tier":"restated secondary","genes":["IDH1"],"diseases":["AML"],"text":"In AML receiving IDH-inhibitor therapy, acquired IDH1 p.S280F has been reported in cases of secondary resistance."},{"id":"khoury-2022-leukemia-36-1703-C0001","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["CHIP"],"text":"CHIP is defined by a somatic mutation in a myeloid malignancy-associated gene detected in blood or marrow at VAF ≥2% (≥4% for X-linked mutations in males), in a person without a diagnosed haematologic disorder or unexplained cytopenia."},{"id":"khoury-2022-leukemia-36-1703-C0002","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["CCUS"],"text":"CCUS is CHIP accompanied by one or more persistent otherwise-unexplained cytopenias that do not meet diagnostic criteria for a defined myeloid neoplasm."},{"id":"khoury-2022-leukemia-36-1703-C0003","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["CCUS","MDS","MDS/MPN"],"text":"For CCUS, MDS and MDS/MPN, cytopenia thresholds are haemoglobin <13 g/dL in males or <12 g/dL in females, ANC <1.8 ×10^9/L, and platelets <150 ×10^9/L."},{"id":"khoury-2022-leukemia-36-1703-C0004","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["BCR","ABL1"],"diseases":["CML"],"text":"CML is defined by the BCR::ABL1 fusion resulting from t(9;22)(q34;q11)."},{"id":"khoury-2022-leukemia-36-1703-C0005","paper":"khoury-2022-leukemia-36-1703","category":"treatment","tier":"restated secondary","genes":["ABL1"],"diseases":["CML"],"text":"In CML, ABL1 kinase mutations are described as a source of TKI resistance and a key disease attribute in the current classification."},{"id":"khoury-2022-leukemia-36-1703-C0006","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["CML"],"text":"CML blast phase is defined by ≥20% myeloid blasts in blood or marrow, extramedullary blast proliferation, or increased lymphoblasts in blood or marrow; accelerated phase is omitted from WHO5."},{"id":"khoury-2022-leukemia-36-1703-C0007","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["JAK2"],"diseases":["PV"],"text":"Major PV diagnostic criteria include elevated haemoglobin and/or haematocrit, marrow panmyelosis with pleomorphic mature megakaryocytes, and JAK2 p.V617F or a JAK2 exon 12 mutation."},{"id":"khoury-2022-leukemia-36-1703-C0008","paper":"khoury-2022-leukemia-36-1703","category":"prognosis","tier":"restated secondary","genes":["EZH2","IDH1","IDH2","SRSF2","U2AF1","ASXL1"],"diseases":["PMF"],"text":"In PMF, mutations in EZH2, IDH1, IDH2, SRSF2, U2AF1 and ASXL1 are associated with poorer prognostic risk."},{"id":"khoury-2022-leukemia-36-1703-C0009","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["BCR","ABL1"],"diseases":["CNL"],"text":"CNL is a BCR::ABL1-negative MPN characterized by sustained neutrophilia with WBC ≥25 ×10^9/L and ≥80% segmented neutrophils/bands, neutrophilic marrow hypercellularity and hepatosplenomegaly."},{"id":"khoury-2022-leukemia-36-1703-C0010","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["CEL"],"text":"CEL is characterized by sustained clonal proliferation of morphologically abnormal eosinophils/eosinophil precursors causing persistent blood and marrow hypereosinophilia."},{"id":"khoury-2022-leukemia-36-1703-C0011","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["CEL"],"text":"For CEL, the interval required to define sustained hypereosinophilia is 4 weeks rather than 6 months."},{"id":"khoury-2022-leukemia-36-1703-C0012","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["CEL"],"text":"CEL requires both evidence of clonality and abnormal bone-marrow morphology, such as megakaryocytic or erythroid dysplasia."},{"id":"khoury-2022-leukemia-36-1703-C0013","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["CEL"],"text":"For CEL, increased blasts (≥2% in blood or 5–19% in marrow) are no longer an alternative to demonstrating clonality."},{"id":"khoury-2022-leukemia-36-1703-C0014","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["KMT2A"],"diseases":["JMML"],"text":"Updated JMML criteria require exclusion of KMT2A rearrangements."},{"id":"khoury-2022-leukemia-36-1703-C0015","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["JMML"],"text":"JMML diagnosis emphasizes molecular studies demonstrating RAS-pathway activation together with clinical and laboratory criteria."},{"id":"khoury-2022-leukemia-36-1703-C0016","paper":"khoury-2022-leukemia-36-1703","category":"prognosis","tier":"restated secondary","genes":["PTPN11"],"diseases":["JMML"],"text":"JMML initiated by somatic PTPN11 mutations is among the most aggressive genetic types."},{"id":"khoury-2022-leukemia-36-1703-C0017","paper":"khoury-2022-leukemia-36-1703","category":"germline","tier":"guideline criterion","genes":["CBL"],"diseases":["JMML"],"text":"A subset of JMML is associated with pathogenic germline CBL variants."},{"id":"khoury-2022-leukemia-36-1703-C0018","paper":"khoury-2022-leukemia-36-1703","category":"prognosis","tier":"restated secondary","genes":["CBL"],"diseases":["JMML"],"text":"JMML associated with pathogenic germline CBL variants can occasionally undergo spontaneous remission."},{"id":"khoury-2022-leukemia-36-1703-C0019","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["KIT"],"diseases":["mastocytosis"],"text":"In systemic mastocytosis, KIT p.D816V with VAF ≥10% in bone-marrow cells or peripheral-blood leukocytes qualifies as a B-finding."},{"id":"khoury-2022-leukemia-36-1703-C0020","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["KIT"],"diseases":["mastocytosis"],"text":"Any KIT mutation causing ligand-independent activation is accepted as a minor diagnostic criterion for systemic mastocytosis."},{"id":"khoury-2022-leukemia-36-1703-C0021","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["KIT"],"diseases":["mastocytosis"],"text":"Well-differentiated systemic mastocytosis may occur in any systemic-mastocytosis subtype; most cases lack KIT codon 816 mutation and typically show CD25/CD2 negativity with CD30 positivity."},{"id":"khoury-2022-leukemia-36-1703-C0022","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["MDS"],"text":"MDS is defined by cytopenias and morphologic dysplasia, with a recommended dysplasia threshold of 10% for all lineages."},{"id":"khoury-2022-leukemia-36-1703-C0023","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["TP53","SF3B1"],"diseases":["MDS"],"text":"Within genetically defined MDS, MDS with biallelic TP53 inactivation supersedes MDS-5q and MDS-SF3B1 in the WHO5 hierarchy."},{"id":"khoury-2022-leukemia-36-1703-C0024","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["SF3B1","TP53"],"diseases":["MDS"],"text":"In MDS-5q, an SF3B1 mutation or a TP53 mutation that is not multi-hit does not by itself override the MDS-5q diagnosis."},{"id":"khoury-2022-leukemia-36-1703-C0025","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["SF3B1"],"diseases":["MDS"],"text":"For SF3B1-wild-type MDS with ≥15% ring sideroblasts, “MDS with low blasts and ring sideroblasts” remains an acceptable alternative designation."},{"id":"khoury-2022-leukemia-36-1703-C0026","paper":"khoury-2022-leukemia-36-1703","category":"biomarker","tier":"guideline criterion","genes":["TP53"],"diseases":["MDS"],"text":"Clinical assessment of biallelic TP53 alterations in MDS uses sequencing covering at least exons 4–11 together with copy-number assessment; TP53 locus loss may also be inferred by next-generation sequencing."},{"id":"khoury-2022-leukemia-36-1703-C0027","paper":"khoury-2022-leukemia-36-1703","category":"biomarker","tier":"guideline criterion","genes":["TP53"],"diseases":["MDS"],"text":"In MDS, TP53 VAF ≥50% may be regarded as presumptive, but not definitive, evidence of trans-allelic copy loss or copy-neutral LOH when a constitutional TP53 variant has been ruled out."},{"id":"khoury-2022-leukemia-36-1703-C0028","paper":"khoury-2022-leukemia-36-1703","category":"biomarker","tier":"guideline criterion","genes":["TP53"],"diseases":["MDS"],"text":"When two or more TP53 mutations are detected in MDS, they usually affect both alleles and may be considered multi-hit status."},{"id":"khoury-2022-leukemia-36-1703-C0029","paper":"khoury-2022-leukemia-36-1703","category":"prognosis","tier":"restated secondary","genes":["TP53"],"diseases":["MDS"],"text":"MDS with biallelic TP53 alterations is regarded as very high risk in IPSS-R and is usually associated with complex or very complex karyotype."},{"id":"khoury-2022-leukemia-36-1703-C0030","paper":"khoury-2022-leukemia-36-1703","category":"treatment","tier":"restated secondary","genes":["TP53"],"diseases":["MDS"],"text":"Published data support considering MDS with biallelic TP53 inactivation as AML-equivalent for therapeutic purposes."},{"id":"khoury-2022-leukemia-36-1703-C0031","paper":"khoury-2022-leukemia-36-1703","category":"germline","tier":"restated secondary","genes":["GATA2","DDX41"],"diseases":["MDS","AML"],"text":"Pathogenic germline GATA2 or DDX41 variants can present with hypoplastic marrow and evolve to MDS and/or AML."},{"id":"khoury-2022-leukemia-36-1703-C0032","paper":"khoury-2022-leukemia-36-1703","category":"treatment","tier":"restated secondary","genes":["GATA2","DDX41"],"diseases":["MDS"],"text":"In the hypoplastic-marrow differential, individuals with germline GATA2 or DDX41 pathogenic variants are described as not responding to immunosuppressive treatment."},{"id":"khoury-2022-leukemia-36-1703-C0033","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["MDS","AML"],"text":"WHO5 retains a 20% blast cutoff to delineate MDS from AML while removing blast cutoffs for most AML types with defining genetic abnormalities."},{"id":"khoury-2022-leukemia-36-1703-C0034","paper":"khoury-2022-leukemia-36-1703","category":"treatment","tier":"guideline criterion","genes":[],"diseases":["MDS"],"text":"MDS-IB2 may be regarded as AML-equivalent for therapeutic considerations and, when appropriate, clinical-trial design."},{"id":"khoury-2022-leukemia-36-1703-C0035","paper":"khoury-2022-leukemia-36-1703","category":"treatment","tier":"restated secondary","genes":[],"diseases":["MDS"],"text":"In childhood MDS with low blasts, monosomy 7, 7q deletion, or complex karyotype is associated with increased risk of AML progression and is typically treated with haematopoietic stem-cell transplantation."},{"id":"khoury-2022-leukemia-36-1703-C0036","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["CMML"],"text":"CMML requires persistent absolute peripheral-blood monocytosis ≥0.5 ×10^9/L and relative monocytosis ≥10%."},{"id":"khoury-2022-leukemia-36-1703-C0037","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["CMML"],"text":"When absolute monocytosis is ≥0.5 but <1.0 ×10^9/L, CMML diagnosis requires a clonal cytogenetic or molecular abnormality and dysplasia in at least one lineage."},{"id":"khoury-2022-leukemia-36-1703-C0038","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["JAK2","CALR","MPL"],"diseases":["CMML","MPN"],"text":"In a patient with monocytosis, a documented MPN history excludes CMML; marrow MPN features and/or a high burden of JAK2, CALR or MPL mutations supports MPN with monocytosis rather than CMML."},{"id":"khoury-2022-leukemia-36-1703-C0039","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["PDGFRA","FIP1L1","PDGFRB","ETV6","FGFR1","JAK2","FLT3","ABL1","FGFR2","LYN","NTRK3","RANBP2","ALK","BCR","RET","FGFR1OP"],"diseases":["CMML"],"text":"In a suspected CMML case with eosinophilia, myeloid/lymphoid neoplasms with tyrosine-kinase gene fusions should be excluded by assessing for PDGFRA rearrangement (most commonly FIP1L1::PDGFRA), PDGFRB rearrangement (most commonly ETV6::PDGFRB), FGFR1 rearrangement, JAK2 rearrangement, FLT3 rearrangement, ETV6::ABL1, and other defined tyrosine-kinase fusions including ETV6::FGFR2, ETV6::LYN, ETV6::NTRK3, RANBP2::ALK, BCR::RET, and FGFR1OP::RET. WHO5 treats PDGFRA, PDGFRB, FGFR1, JAK2 and FLT3 as rearrangement-defined categories rather than restricting them to a single fusion partner."},{"id":"khoury-2022-leukemia-36-1703-C0040","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["SF3B1"],"diseases":["MDS/MPN"],"text":"MDS/MPN with ring sideroblasts and thrombocytosis is redefined on the basis of SF3B1 mutation and renamed MDS/MPN with SF3B1 mutation and thrombocytosis."},{"id":"khoury-2022-leukemia-36-1703-C0041","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["SF3B1"],"diseases":["MDS/MPN"],"text":"For SF3B1-wild-type MDS/MPN with ≥15% ring sideroblasts, “MDS/MPN with ring sideroblasts and thrombocytosis” remains an acceptable term."},{"id":"khoury-2022-leukemia-36-1703-C0042","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["PML","RARA","RUNX1","RUNX1T1","CBFB","MYH11"],"diseases":["AML"],"text":"WHO5 recognizes AML with PML::RARA, RUNX1::RUNX1T1 and CBFB::MYH11 as AML types with defining genetic abnormalities."},{"id":"khoury-2022-leukemia-36-1703-C0043","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["BCR","ABL1","CEBPA"],"diseases":["AML"],"text":"AML with BCR::ABL1 and AML with CEBPA mutation are the defining-genetic-abnormality AML types that still require at least 20% blasts; for BCR::ABL1 this avoids overlap with CML."},{"id":"khoury-2022-leukemia-36-1703-C0044","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["KMT2A","MECOM","NUP98"],"diseases":["AML"],"text":"AML with KMT2A, MECOM or NUP98 rearrangement may be diagnosed with a blast count below 20%."},{"id":"khoury-2022-leukemia-36-1703-C0045","paper":"khoury-2022-leukemia-36-1703","category":"biomarker","tier":"restated secondary","genes":["KMT2A","MECOM","NUP98"],"diseases":["AML"],"text":"KMT2A, MECOM and NUP98 rearrangements, particularly NUP98 rearrangements, may be cryptic on conventional karyotyping."},{"id":"khoury-2022-leukemia-36-1703-C0046","paper":"khoury-2022-leukemia-36-1703","category":"prognosis","tier":"restated secondary","genes":["KMT2A"],"diseases":["AML"],"text":"For KMT2A-rearranged AML, identifying the fusion partner is desirable because it can provide prognostic information."},{"id":"khoury-2022-leukemia-36-1703-C0047","paper":"khoury-2022-leukemia-36-1703","category":"biomarker","tier":"restated secondary","genes":["KMT2A"],"diseases":["AML"],"text":"For KMT2A-rearranged AML, identifying the fusion partner is desirable because it may affect disease monitoring."},{"id":"khoury-2022-leukemia-36-1703-C0048","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["NPM1"],"diseases":["AML"],"text":"AML with NPM1 mutation can be diagnosed irrespective of blast count, with clinicopathologic correlation."},{"id":"khoury-2022-leukemia-36-1703-C0049","paper":"khoury-2022-leukemia-36-1703","category":"prognosis","tier":"restated secondary","genes":["NPM1"],"diseases":["MDS","MDS/MPN"],"text":"MDS or MDS/MPN cases with NPM1 mutation are reported to progress to AML in a short period."},{"id":"khoury-2022-leukemia-36-1703-C0050","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["CEBPA"],"diseases":["AML"],"text":"AML with CEBPA mutation includes biallelic CEBPA mutations and single CEBPA mutations in the basic leucine zipper region."},{"id":"khoury-2022-leukemia-36-1703-C0051","paper":"khoury-2022-leukemia-36-1703","category":"prognosis","tier":"restated secondary","genes":["CEBPA"],"diseases":["AML"],"text":"A single CEBPA mutation in the bZIP region is associated with favourable prognosis in children and adults up to age 70."},{"id":"khoury-2022-leukemia-36-1703-C0052","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["RUNX1"],"diseases":["AML"],"text":"Somatic RUNX1 mutation is not sufficient to define a standalone WHO5 AML type because it lacks specificity across defining molecular contexts."},{"id":"khoury-2022-leukemia-36-1703-C0053","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["SRSF2","SF3B1","U2AF1","ZRSR2","ASXL1","EZH2","BCOR","STAG2"],"diseases":["AML"],"text":"AML, myelodysplasia-related has a mutation-based definition that includes SRSF2, SF3B1, U2AF1, ZRSR2, ASXL1, EZH2, BCOR or STAG2."},{"id":"khoury-2022-leukemia-36-1703-C0054","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["AML"],"text":"Morphologic myelodysplasia alone is no longer sufficient to diagnose AML, myelodysplasia-related."},{"id":"khoury-2022-leukemia-36-1703-C0055","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"restated secondary","genes":["CBFA2T3","GLIS2"],"diseases":["AML"],"text":"In acute megakaryoblastic leukaemia, the RAM immunophenotype correlates with CBFA2T3::GLIS2, a subtype of AML with other defined genetic alterations."},{"id":"khoury-2022-leukemia-36-1703-C0056","paper":"khoury-2022-leukemia-36-1703","category":"prognosis","tier":"restated secondary","genes":["KIT"],"diseases":["AML"],"text":"KIT mutations remain relevant prognostic factors in the genetically defined AML context discussed by WHO5."},{"id":"khoury-2022-leukemia-36-1703-C0057","paper":"khoury-2022-leukemia-36-1703","category":"biomarker","tier":"restated secondary","genes":["PML","RARA","RUNX1","RUNX1T1"],"diseases":["AML"],"text":"WHO5 emphasizes the increased importance of highly sensitive MRD evaluation techniques in the genetically defined AML context of PML::RARA and RUNX1::RUNX1T1."},{"id":"khoury-2022-leukemia-36-1703-C0058","paper":"khoury-2022-leukemia-36-1703","category":"prognosis","tier":"restated secondary","genes":["PML","RARA","RUNX1","RUNX1T1"],"diseases":["AML"],"text":"Post-induction MRD status is a prognostic factor in the genetically defined AML context discussed for PML::RARA and RUNX1::RUNX1T1 AML."},{"id":"khoury-2022-leukemia-36-1703-C0059","paper":"khoury-2022-leukemia-36-1703","category":"prognosis","tier":"restated secondary","genes":["TP53"],"diseases":["AML","MDS"],"text":"In AML or MDS after cytotoxic therapy, outcomes are generally worse with biallelic/multi-hit TP53 alterations, including ≥2 TP53 mutations or a TP53 mutation with 17p/TP53 deletion or copy-neutral LOH."},{"id":"khoury-2022-leukemia-36-1703-C0060","paper":"khoury-2022-leukemia-36-1703","category":"germline","tier":"restated secondary","genes":["PPM1D"],"diseases":[],"text":"In myeloid neoplasms after cytotoxic therapy, PPM1D and other DNA-damage-response gene mutations may warrant additional work-up for germline predisposition."},{"id":"khoury-2022-leukemia-36-1703-C0061","paper":"khoury-2022-leukemia-36-1703","category":"germline","tier":"guideline criterion","genes":["CEBPA"],"diseases":[],"text":"A germline pathogenic/likely pathogenic CEBPA variant is recognized as CEBPA-associated familial AML within myeloid neoplasms with germline predisposition."},{"id":"khoury-2022-leukemia-36-1703-C0062","paper":"khoury-2022-leukemia-36-1703","category":"germline","tier":"guideline criterion","genes":["DDX41"],"diseases":[],"text":"A germline pathogenic/likely pathogenic DDX41 variant is a recognized myeloid-neoplasm predisposition subtype."},{"id":"khoury-2022-leukemia-36-1703-C0063","paper":"khoury-2022-leukemia-36-1703","category":"germline","tier":"guideline criterion","genes":["TP53"],"diseases":[],"text":"A germline pathogenic/likely pathogenic TP53 variant (Li-Fraumeni syndrome) is a recognized myeloid-neoplasm predisposition subtype."},{"id":"khoury-2022-leukemia-36-1703-C0064","paper":"khoury-2022-leukemia-36-1703","category":"germline","tier":"guideline criterion","genes":["RUNX1"],"diseases":[],"text":"A germline pathogenic/likely pathogenic RUNX1 variant defines familial platelet disorder with associated myeloid malignancy."},{"id":"khoury-2022-leukemia-36-1703-C0065","paper":"khoury-2022-leukemia-36-1703","category":"germline","tier":"guideline criterion","genes":["ANKRD26"],"diseases":[],"text":"A germline pathogenic/likely pathogenic ANKRD26 variant (Thrombocytopenia 2) is recognized among myeloid neoplasms with germline predisposition and a pre-existing platelet disorder."},{"id":"khoury-2022-leukemia-36-1703-C0066","paper":"khoury-2022-leukemia-36-1703","category":"germline","tier":"guideline criterion","genes":["ETV6"],"diseases":[],"text":"A germline pathogenic/likely pathogenic ETV6 variant (Thrombocytopenia 5) is recognized among myeloid neoplasms with germline predisposition and a pre-existing platelet disorder."},{"id":"khoury-2022-leukemia-36-1703-C0067","paper":"khoury-2022-leukemia-36-1703","category":"germline","tier":"guideline criterion","genes":["GATA2"],"diseases":[],"text":"A germline pathogenic/likely pathogenic GATA2 variant (GATA2 deficiency) is recognized among myeloid neoplasms with germline predisposition and potential organ dysfunction."},{"id":"khoury-2022-leukemia-36-1703-C0068","paper":"khoury-2022-leukemia-36-1703","category":"germline","tier":"guideline criterion","genes":["CBL"],"diseases":[],"text":"CBL syndrome is included among RASopathies associated with myeloid-neoplasm germline predisposition."},{"id":"khoury-2022-leukemia-36-1703-C0069","paper":"khoury-2022-leukemia-36-1703","category":"germline","tier":"guideline criterion","genes":["SAMD9"],"diseases":[],"text":"A germline pathogenic/likely pathogenic SAMD9 variant (MIRAGE syndrome) is a recognized myeloid-neoplasm predisposition state."},{"id":"khoury-2022-leukemia-36-1703-C0070","paper":"khoury-2022-leukemia-36-1703","category":"germline","tier":"guideline criterion","genes":["SAMD9L"],"diseases":[],"text":"A germline pathogenic/likely pathogenic SAMD9L variant is recognized in SAMD9L-related ataxia-pancytopenia syndrome; ataxia is not always present."},{"id":"khoury-2022-leukemia-36-1703-C0071","paper":"khoury-2022-leukemia-36-1703","category":"germline","tier":"guideline criterion","genes":["BLM"],"diseases":[],"text":"Biallelic germline pathogenic/likely pathogenic BLM variants (Bloom syndrome) are a recognized myeloid-neoplasm predisposition state."},{"id":"khoury-2022-leukemia-36-1703-C0072","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["CEL"],"text":"Before a diagnosis of CEL is rendered, myeloid/lymphoid neoplasms with tyrosine-kinase gene fusions must be excluded."},{"id":"khoury-2022-leukemia-36-1703-C0073","paper":"khoury-2022-leukemia-36-1703","category":"treatment","tier":"restated secondary","genes":["PDGFRA","PDGFRB"],"diseases":["MDS","AML","MDS/MPN","MPN"],"text":"For MLN-TK with PDGFRA or PDGFRB rearrangement, TKI therapy—particularly imatinib—has dramatically altered the natural history."},{"id":"khoury-2022-leukemia-36-1703-C0074","paper":"khoury-2022-leukemia-36-1703","category":"treatment","tier":"restated secondary","genes":["FGFR1","JAK2","FLT3","ETV6","ABL1"],"diseases":["MDS","AML","MDS/MPN","MPN"],"text":"MLN-TK with FGFR1, JAK2 or FLT3 fusions or ETV6::ABL1 has more variable sensitivity to available newer-generation TKIs."},{"id":"khoury-2022-leukemia-36-1703-C0075","paper":"khoury-2022-leukemia-36-1703","category":"treatment","tier":"restated secondary","genes":["FGFR1","JAK2","FLT3","ETV6","ABL1"],"diseases":["MDS","AML","MDS/MPN","MPN"],"text":"For MLN-TK with FGFR1, JAK2 or FLT3 fusions or ETV6::ABL1, long-term disease-free survival may in most cases require allogeneic haematopoietic stem-cell transplantation."},{"id":"khoury-2022-leukemia-36-1703-C0076","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["BCR","ABL1","KMT2A"],"diseases":["acute leukaemia of ambiguous lineage"],"text":"WHO5 lists mixed-phenotype acute leukaemia with BCR::ABL1 fusion and with KMT2A rearrangement among acute leukaemias of ambiguous lineage with defining genetic abnormalities."},{"id":"khoury-2022-leukemia-36-1703-C0077","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["ZNF384"],"diseases":["acute leukaemia of ambiguous lineage"],"text":"MPAL with ZNF384 rearrangement is a WHO5 subtype of acute leukaemia with a defining genetic alteration and commonly has a B/myeloid immunophenotype."},{"id":"khoury-2022-leukemia-36-1703-C0078","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":["BCL11B"],"diseases":["acute leukaemia of ambiguous lineage"],"text":"Acute leukaemia of ambiguous lineage with BCL11B rearrangement is a WHO5 subtype with a defining genetic alteration and may occur with heterogeneous immunophenotypes."},{"id":"khoury-2022-leukemia-36-1703-C0079","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["acute leukaemia of ambiguous lineage"],"text":"For flow-cytometric MPO assessment in acute leukaemia, a >10% positivity threshold appears to improve specificity over 3%, but WHO5 states that no consensus cutoff has been established."},{"id":"khoury-2022-leukemia-36-1703-C0080","paper":"khoury-2022-leukemia-36-1703","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["BPDCN"],"text":"BPDCN immunophenotypic diagnosis requires either CD123 plus one other pDC marker with CD4 and/or CD56, or any three pDC markers with absence of all expected negative markers."},{"id":"kraft-godley-2020-germline-guide-C0001","paper":"kraft-godley-2020-germline-guide","category":"germline","tier":"univariable or descriptive","genes":["DDX41"],"diseases":[],"text":"In a myeloid malignancy, DDX41 p.Arg525His should not be assumed constitutional solely from its presence: the review describes it as an acquired hotspot mutation occurring in patients with deleterious germline DDX41 variants."},{"id":"kraft-godley-2020-germline-guide-C0002","paper":"kraft-godley-2020-germline-guide","category":"germline","tier":"restated secondary","genes":["DDX41"],"diseases":[],"text":"Advanced age does not exclude DDX41-associated germline predisposition; the review notes an average myeloid-malignancy diagnosis age of about 70 years in patients with germline DDX41 mutations."},{"id":"kraft-godley-2020-germline-guide-C0003","paper":"kraft-godley-2020-germline-guide","category":"germline","tier":"restated secondary","genes":["GATA2","BRCA1","BRCA2"],"diseases":[],"text":"GATA2-, BRCA1-, and BRCA2-associated inherited predisposition may arise de novo, so the germline variant need not have been inherited from an affected parent."},{"id":"kraft-godley-2020-germline-guide-C0004","paper":"kraft-godley-2020-germline-guide","category":"germline","tier":"restated secondary","genes":["DDX41"],"diseases":[],"text":"A truncating DDX41 variant should raise strong suspicion of germline origin because the review states that all truncating DDX41 variants reported to date were germline; suspected germline status should still be confirmed using true germline DNA."},{"id":"kraft-godley-2020-germline-guide-C0005","paper":"kraft-godley-2020-germline-guide","category":"germline","tier":"restated secondary","genes":["RUNX1"],"diseases":[],"text":"For many RUNX1 variants detected on tumor-based sequencing, variant identity alone cannot establish constitutional status because the same variant may be somatic or germline; suspected germline status should be confirmed using true germline DNA."},{"id":"kraft-godley-2020-germline-guide-C0006","paper":"kraft-godley-2020-germline-guide","category":"germline","tier":"restated secondary","genes":["TP53"],"diseases":[],"text":"For many TP53 variants detected on tumor-based sequencing, variant identity alone cannot establish constitutional status because the same variant may be somatic or germline; suspected germline status should be confirmed using true germline DNA."},{"id":"kraft-godley-2020-germline-guide-C0007","paper":"kraft-godley-2020-germline-guide","category":"germline","tier":"restated secondary","genes":["ANKRD26","CEBPA","DDX41","ETV6","GATA2","MBD4","MECOM","EVI1","PTPN11","RUNX1","SAMD9","SAMD9L","SRP72","TET2"],"diseases":[],"text":"For familial MDS/AML germline assessment, this review lists ANKRD26, CEBPA, DDX41, ETV6, GATA2, MBD4, MECOM/EVI1, PTPN11, RUNX1, SAMD9, SAMD9L, SRP72, and TET2 among genes recommended as yielding clinically actionable results."},{"id":"kraft-godley-2020-germline-guide-C0008","paper":"kraft-godley-2020-germline-guide","category":"germline","tier":"restated secondary","genes":["DKC1","DNAJC21","ELANE","EFL1","ERCC6L2","FANC","GFI1","HAX1","NAF1","NPM1","RAD51C","RECQL4","RTEL1","SBDS","SRP72","TERT","TERC"],"diseases":[],"text":"For inherited bone-marrow-failure syndromes with germline predisposition to myeloid neoplasms, this review lists DKC1, DNAJC21, ELANE, EFL1, ERCC6L2, FANC genes, GFI1, HAX1, NAF1, NPM1, RAD51C, RECQL4, RTEL1, SBDS, SRP72, TERT, and TERC among genes recommended as yielding clinically actionable results."},{"id":"kraft-godley-2020-germline-guide-C0009","paper":"kraft-godley-2020-germline-guide","category":"germline","tier":"restated secondary","genes":["ATG2B","GSKIP","BLM","BRCA1","BRCA2","CBL","KRAS","NF1","PTPN11","TP53"],"diseases":[],"text":"For inherited syndromes associated with myeloid neoplasms, this review lists ATG2B/GSKIP, BLM, BRCA1, BRCA2, CBL, KRAS, NF1, PTPN11, and TP53 among genes recommended as yielding clinically actionable results."},{"id":"kraft-godley-2020-germline-guide-C0010","paper":"kraft-godley-2020-germline-guide","category":"germline","tier":"restated secondary","genes":["BRCA1","BRCA2"],"diseases":[],"text":"BRCA1/BRCA2 cancer-predisposition mutations are described as increasing risk for hematopoietic malignancies."},{"id":"kraft-godley-2020-germline-guide-C0011","paper":"kraft-godley-2020-germline-guide","category":"germline","tier":"restated secondary","genes":["MLH1","MSH2","MSH6","PMS2"],"diseases":[],"text":"Lynch syndrome, represented in this review by MLH1, MSH2, MSH6, and PMS2, is described as a cancer-predisposition syndrome that also increases risk for hematopoietic malignancies."},{"id":"kraft-godley-2020-germline-guide-C0012","paper":"kraft-godley-2020-germline-guide","category":"germline","tier":"restated secondary","genes":["TP53"],"diseases":[],"text":"Li-Fraumeni syndrome, represented in this review by TP53, is described as a cancer-predisposition syndrome that also increases risk for hematopoietic malignancies."},{"id":"kraft-godley-2020-germline-guide-C0013","paper":"kraft-godley-2020-germline-guide","category":"germline","tier":"univariable or descriptive","genes":["TP53"],"diseases":[],"text":"The review notes that TP53 mutations occur most commonly as somatic alleles, so a TP53 finding should not be presumed constitutional without additional evidence."},{"id":"kraft-godley-2020-germline-guide-C0014","paper":"kraft-godley-2020-germline-guide","category":"germline","tier":"univariable or descriptive","genes":["BRCA1","BRCA2"],"diseases":[],"text":"In the authors’ experience, deleterious BRCA1/BRCA2 variants are more commonly germline alterations."},{"id":"kraft-godley-2020-germline-guide-C0015","paper":"kraft-godley-2020-germline-guide","category":"biomarker","tier":"univariable or descriptive","genes":["DDX41"],"diseases":["MDS","AML"],"text":"In an MDS case that progressed to AML, confirmed germline DDX41 p.Asp140fs remained detectable on serial testing but fell to VAF 0.39 on one assay, illustrating technical VAF variability; a value below 0.5 did not exclude germline origin."},{"id":"kraft-godley-2020-germline-guide-C0016","paper":"kraft-godley-2020-germline-guide","category":"biomarker","tier":"restated secondary","genes":["DDX41"],"diseases":["MDS"],"text":"In the opening MDS case, DDX41 germline assessment depends on panel content because DDX41 is absent from many commercial NGS platforms; a panel lacking DDX41 cannot evaluate this gene."},{"id":"malcovati-2017-ccus-foundation-C0001","paper":"malcovati-2017-ccus-foundation","category":"diagnosis","tier":"univariable or descriptive","genes":["TET2","ASXL1","SRSF2","SF3B1","DNMT3A","RUNX1","JAK2","TP53","U2AF1","EZH2","IDH2","ZRSR2","NRAS","IDH1","STAG2","BCOR","CBL","CUX1","KRAS","GATA2","PTPN11","CALR","ETV6","PHF6","KIT","NPM1","MLL","GNAS","ATRX","CDKN2A","KDM6A","MPL","WT1","ABL1","RAD21","FLT3","CEBPA","GATA1"],"diseases":["MDS","MDS/MPN","MPN","AML"],"text":"In patients investigated for unexplained cytopenia, a negative result across the studied 40-gene panel did not exclude the study's composite myeloid-neoplasm endpoint (MDS, MDS/MPN, MPN, or AML): the negative predictive value was 0.76, increasing to 0.84 when mutation status was combined with standard karyotyping."},{"id":"malcovati-2017-ccus-foundation-C0002","paper":"malcovati-2017-ccus-foundation","category":"diagnosis","tier":"univariable or descriptive","genes":["TET2","ASXL1","SRSF2","SF3B1","DNMT3A","RUNX1","JAK2","TP53","U2AF1","EZH2","IDH2","ZRSR2","NRAS","IDH1","STAG2","BCOR","CBL","CUX1","KRAS","GATA2","PTPN11","CALR","ETV6","PHF6","KIT","NPM1","MLL","GNAS","ATRX","CDKN2A","KDM6A","MPL","WT1","ABL1","RAD21","FLT3","CEBPA","GATA1"],"diseases":["MDS","MDS/MPN","MPN","AML"],"text":"In patients investigated for unexplained cytopenia, finding two or more somatic mutations in the studied 40-gene panel was strongly predictive of the study's composite myeloid-neoplasm endpoint (MDS, MDS/MPN, MPN, or AML), with positive predictive value 0.88 (95% CI 0.84-0.92). These predictive findings were reported as fully confirmed in the independent 190-patient validation cohort."},{"id":"malcovati-2017-ccus-foundation-C0003","paper":"malcovati-2017-ccus-foundation","category":"diagnosis","tier":"univariable or descriptive","genes":["TET2","ASXL1","SRSF2","SF3B1","DNMT3A","RUNX1","JAK2","TP53","U2AF1","EZH2","IDH2","ZRSR2","NRAS","IDH1","STAG2","BCOR","CBL","CUX1","KRAS","GATA2","PTPN11","CALR","ETV6","PHF6","KIT","NPM1","MLL","GNAS","ATRX","CDKN2A","KDM6A","MPL","WT1","ABL1","RAD21","FLT3","CEBPA","GATA1"],"diseases":["MDS","MDS/MPN","MPN","AML"],"text":"For mutations measured in isolated peripheral-blood granulocytes, a VAF around 0.10 was associated with the best classification of the study's composite myeloid-neoplasm endpoint (MDS, MDS/MPN, MPN, or AML); the paper cautions that the applicable allele-burden threshold may vary when a different blood-cell source is used. These predictive findings were reported as fully confirmed in the independent 190-patient validation cohort."},{"id":"malcovati-2017-ccus-foundation-C0004","paper":"malcovati-2017-ccus-foundation","category":"diagnosis","tier":"univariable or descriptive","genes":["SF3B1","SRSF2","U2AF1","JAK2","RUNX1"],"diseases":["MDS","MDS/MPN","MPN","AML"],"text":"In unexplained cytopenia, mutations in SF3B1, SRSF2, U2AF1, JAK2, or RUNX1 had the highest predictive values for the study's composite myeloid-neoplasm endpoint (MDS, MDS/MPN, MPN, or AML), with positive predictive values of 0.88-0.97 irrespective of co-occurring mutations. These predictive findings were reported as fully confirmed in the independent 190-patient validation cohort."},{"id":"malcovati-2017-ccus-foundation-C0005","paper":"malcovati-2017-ccus-foundation","category":"diagnosis","tier":"univariable or descriptive","genes":["TET2","DNMT3A","ASXL1"],"diseases":["MDS","MDS/MPN","MPN","AML"],"text":"In unexplained cytopenia, isolated TET2, DNMT3A, or ASXL1 mutations were substantially less predictive of the study's composite myeloid-neoplasm endpoint (MDS, MDS/MPN, MPN, or AML) than the same mutations occurring with additional genetic lesions (positive predictive value 0.29-0.57 vs 0.81-0.89). These predictive findings were reported as fully confirmed in the independent 190-patient validation cohort."},{"id":"malcovati-2017-ccus-foundation-C0006","paper":"malcovati-2017-ccus-foundation","category":"prognosis","tier":"univariable or descriptive","genes":["TET2","ASXL1","SRSF2","SF3B1","DNMT3A","RUNX1","JAK2","TP53","U2AF1","EZH2","IDH2","ZRSR2","NRAS","IDH1","STAG2","BCOR","CBL","CUX1","KRAS","GATA2","PTPN11","CALR","ETV6","PHF6","KIT","NPM1","MLL","GNAS","ATRX","CDKN2A","KDM6A","MPL","WT1","ABL1","RAD21","FLT3","CEBPA","GATA1"],"diseases":["CCUS"],"text":"Among patients provisionally diagnosed with ICUS, mutation-positive CCUS carried a markedly higher risk of progression to myeloid neoplasm than absence of clonality (HR 13.9; 95% CI 5.40-35.91); 5- and 10-year progression probabilities were 82% and 95% versus 9% and 9%, respectively."},{"id":"malcovati-2017-ccus-foundation-C0007","paper":"malcovati-2017-ccus-foundation","category":"prognosis","tier":"univariable or descriptive","genes":["SF3B1","SRSF2","U2AF1","TET2","ASXL1","DNMT3A"],"diseases":["CCUS"],"text":"In CCUS, the study-defined high-predictive mutation-pattern group comprised either (1) an SF3B1, SRSF2, or U2AF1 mutation, whether isolated or co-mutated, or (2) a TET2, ASXL1, or DNMT3A mutation with ≥1 additional mutation. This pooled group had a 95% 5-year cumulative probability of developing a myeloid neoplasm."},{"id":"malcovati-2017-ccus-foundation-C0009","paper":"malcovati-2017-ccus-foundation","category":"diagnosis","tier":"univariable or descriptive","genes":[],"diseases":["MDS"],"text":"For patients diagnosed with MDS on the basis of mild dysplasia (<25% dysplastic cells), absence of detectable clonality by standard cytogenetics and targeted sequencing, together with a stable course, raised concern that the MDS diagnosis might be inappropriate despite meeting then-current WHO criteria."},{"id":"malcovati-2017-ccus-foundation-C0010","paper":"malcovati-2017-ccus-foundation","category":"diagnosis","tier":"univariable or descriptive","genes":["SRSF2","U2AF1","JAK2"],"diseases":["PMF"],"text":"Primary myelofibrosis with JAK2 co-mutation was the stated specificity exception for SRSF2 or U2AF1: after excluding this pattern, SRSF2 and U2AF1 mutations showed 100% specificity for myeloid neoplasm with myelodysplasia."},{"id":"malcovati-2017-ccus-foundation-C0011","paper":"malcovati-2017-ccus-foundation","category":"diagnosis","tier":"univariable or descriptive","genes":["SF3B1","SRSF2","U2AF1","ZRSR2","TET2","ASXL1","DNMT3A","RUNX1","EZH2","CBL","BCOR","CUX1","TP53","IDH1","IDH2","JAK2"],"diseases":["MDS"],"text":"In cases with inconclusive dysplasia, highly specific mutation patterns may provide presumptive evidence of MDS even without definitive morphology. The reported patterns included splicing-factor mutations and co-mutation patterns involving TET2, ASXL1, or DNMT3A with RUNX1, EZH2, CBL, BCOR, CUX1, TP53, or IDH1/IDH2; SRSF2/U2AF1 with JAK2 in primary myelofibrosis was a stated specificity exception."},{"id":"malcovati-2017-ccus-foundation-C0012","paper":"malcovati-2017-ccus-foundation","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["MDS"],"text":"In MDS with del(5q), the chromosomal deletion itself can represent the founding and disease-defining genetic lesion."},{"id":"malcovati-2017-ccus-foundation-C0013","paper":"malcovati-2017-ccus-foundation","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["MDS"],"text":"As restated from then-current WHO criteria, MDS diagnosis required unexplained cytopenia plus morphologic evidence of dysplasia and/or an MDS-specific cytogenetic abnormality."},{"id":"mf-genomics-ruxolitinib-response-C0001","paper":"mf-genomics-ruxolitinib-response","category":"prognosis","tier":"restated secondary","genes":["ASXL1","EZH2","IDH1","IDH2","SRSF2"],"diseases":["PMF"],"text":"In primary myelofibrosis, high molecular risk (HMR), defined by a mutation in any of EZH2, ASXL1, IDH1, IDH2, or SRSF2, was reported as an IPSS- and DIPSS-plus-independent adverse prognostic group with shorter overall survival than low molecular risk (LMR)."},{"id":"mf-genomics-ruxolitinib-response-C0002","paper":"mf-genomics-ruxolitinib-response","category":"prognosis","tier":"restated secondary","genes":["ASXL1","EZH2","IDH1","IDH2","SRSF2"],"diseases":["PMF"],"text":"In primary myelofibrosis, HMR defined by a mutation in any of EZH2, ASXL1, IDH1, IDH2, or SRSF2 was reported to confer greater risk of leukemia than LMR."},{"id":"mf-genomics-ruxolitinib-response-C0003","paper":"mf-genomics-ruxolitinib-response","category":"treatment","tier":"univariable or descriptive","genes":["ASXL1","CBL","EZH2","IDH1","IDH2","JAK2","KRAS","MPL","SH2B3","SOCS1","SOCS2","SOCS3","SRSF2","TET2"],"diseases":["PMF","post-PV/post-ET MF"],"text":"Among COMFORT-II patients with primary or post-PV/post-ET myelofibrosis treated with ruxolitinib, spleen responses occurred at similar frequencies across the 14-gene mutation profiles assessed in this molecular analysis."},{"id":"mf-genomics-ruxolitinib-response-C0004","paper":"mf-genomics-ruxolitinib-response","category":"treatment","tier":"univariable or descriptive","genes":["ASXL1","CBL","EZH2","IDH1","IDH2","JAK2","KRAS","MPL","SH2B3","SOCS1","SOCS2","SOCS3","SRSF2","TET2"],"diseases":["PMF","post-PV/post-ET MF"],"text":"Among COMFORT-II patients with primary or post-PV/post-ET myelofibrosis treated with ruxolitinib, symptomatic improvement occurred at similar frequencies across the 14-gene mutation profiles assessed in this molecular analysis."},{"id":"mf-genomics-ruxolitinib-response-C0005","paper":"mf-genomics-ruxolitinib-response","category":"treatment","tier":"univariable or descriptive","genes":["ASXL1","CBL","EZH2","IDH1","IDH2","JAK2","KRAS","MPL","SH2B3","SOCS1","SOCS2","SOCS3","SRSF2","TET2"],"diseases":["PMF","post-PV/post-ET MF"],"text":"Among COMFORT-II patients with primary or post-PV/post-ET myelofibrosis treated with ruxolitinib, ruxolitinib-associated anemia occurred at similar frequencies across the 14-gene mutation profiles assessed in this molecular analysis."},{"id":"mf-genomics-ruxolitinib-response-C0006","paper":"mf-genomics-ruxolitinib-response","category":"treatment","tier":"univariable or descriptive","genes":["ASXL1","CBL","EZH2","IDH1","IDH2","JAK2","KRAS","MPL","SH2B3","SOCS1","SOCS2","SOCS3","SRSF2","TET2"],"diseases":["PMF","post-PV/post-ET MF"],"text":"Among COMFORT-II patients with primary or post-PV/post-ET myelofibrosis treated with ruxolitinib, ruxolitinib-associated thrombocytopenia occurred at similar frequencies across the 14-gene mutation profiles assessed in this molecular analysis."},{"id":"mf-genomics-ruxolitinib-response-C0007","paper":"mf-genomics-ruxolitinib-response","category":"prognosis","tier":"univariable or descriptive","genes":["ASXL1","EZH2","IDH1","IDH2","SRSF2"],"diseases":["PMF","post-PV/post-ET MF"],"text":"In the COMFORT-II molecular-analysis subset with primary or post-PV/post-ET myelofibrosis, HMR (at least one mutation in ASXL1, EZH2, SRSF2, IDH1, or IDH2) retained adverse prognostic significance in the best-available-therapy control population; estimated survival at 144 weeks was 0.58 for HMR versus 0.71 for LMR."},{"id":"mf-genomics-ruxolitinib-response-C0008","paper":"mf-genomics-ruxolitinib-response","category":"treatment","tier":"multivariable-adjusted","genes":["ASXL1","EZH2","IDH1","IDH2","SRSF2"],"diseases":["PMF","post-PV/post-ET MF"],"text":"In COMFORT-II patients with primary or post-PV/post-ET myelofibrosis and HMR (at least one mutation in ASXL1, EZH2, SRSF2, IDH1, or IDH2), multivariable Cox analysis adjusted for baseline IPSS category estimated a 43% lower risk of death with ruxolitinib versus best available therapy (HR 0.57, 95% CI 0.30-1.08); the confidence interval included 1."},{"id":"mf-genomics-ruxolitinib-response-C0009","paper":"mf-genomics-ruxolitinib-response","category":"treatment","tier":"univariable or descriptive","genes":["ASXL1","CBL","EZH2","IDH1","IDH2","JAK2","KRAS","MPL","SH2B3","SOCS1","SOCS2","SOCS3","SRSF2","TET2"],"diseases":["PMF","post-PV/post-ET MF"],"text":"In the COMFORT-II molecular-analysis subset with primary or post-PV/post-ET myelofibrosis, the study reported that survival improvement with ruxolitinib occurred independently of the 14-gene mutation profile and may occur across different molecular subsets."},{"id":"mpn-genomics-interferon-response-C0001","paper":"mpn-genomics-interferon-response","category":"diagnosis","tier":"restated secondary","genes":["JAK2","CALR","MPL"],"diseases":["MPN"],"text":"In MPN, absence of mutations in all three phenotypic driver genes JAK2, CALR, and MPL defines the molecular designation “triple-negative.”"},{"id":"mpn-genomics-interferon-response-C0002","paper":"mpn-genomics-interferon-response","category":"treatment","tier":"restated secondary","genes":[],"diseases":["ET","PV"],"text":"Hydroxyurea is described as the most widely used first-line cytoreductive therapy for patients with high-risk ET or PV."},{"id":"mpn-genomics-interferon-response-C0003","paper":"mpn-genomics-interferon-response","category":"treatment","tier":"restated secondary","genes":["JAK2"],"diseases":["MPN"],"text":"In JAK2V617F-mutated MPN, long-term interferon-alpha has been associated with molecular remission and bone-marrow normalization; in a minority, these responses may persist after treatment discontinuation, an effect the paper states has not been observed with hydroxyurea."},{"id":"mpn-genomics-interferon-response-C0004","paper":"mpn-genomics-interferon-response","category":"treatment","tier":"univariable or descriptive","genes":["JAK2","CALR","MPL"],"diseases":["MPN"],"text":"In serially sampled DALIAH patients with newly diagnosed MPN, every phenotypic driver mutation present at baseline remained detectable by NGS at 24 months after interferon-alpha or hydroxyurea treatment."},{"id":"mpn-genomics-interferon-response-C0005","paper":"mpn-genomics-interferon-response","category":"treatment","tier":"univariable or descriptive","genes":["JAK2"],"diseases":["MPN"],"text":"In DALIAH patients with newly diagnosed MPN, interferon-alpha was associated with a larger 24-month reduction in JAK2-mutant allele burden than hydroxyurea: JAK2 VAF decreased in 94% versus 75% of patients, with a greater median absolute reduction (0.11 vs 0.05)."},{"id":"mpn-genomics-interferon-response-C0006","paper":"mpn-genomics-interferon-response","category":"treatment","tier":"univariable or descriptive","genes":["CALR"],"diseases":["MPN"],"text":"In DALIAH patients with newly diagnosed MPN, 24-month CALR-mutant allele-burden reduction did not significantly differ between interferon-alpha and hydroxyurea."},{"id":"mpn-genomics-interferon-response-C0007","paper":"mpn-genomics-interferon-response","category":"treatment","tier":"univariable or descriptive","genes":["JAK2"],"diseases":["MPN"],"text":"Among JAK2-mutated DALIAH patients, those with JAK2-UPD had a greater JAK2 VAF reduction during interferon-alpha treatment than those without JAK2-UPD; this differential reduction was not observed with hydroxyurea."},{"id":"mpn-genomics-interferon-response-C0008","paper":"mpn-genomics-interferon-response","category":"treatment","tier":"univariable or descriptive","genes":["JAK2"],"diseases":["MPN"],"text":"In DALIAH patients with newly diagnosed MPN, baseline JAK2 mutation status was not associated with complete clinicohematologic response at 24 months."},{"id":"mpn-genomics-interferon-response-C0009","paper":"mpn-genomics-interferon-response","category":"treatment","tier":"univariable or descriptive","genes":["JAK2"],"diseases":["MPN"],"text":"In DALIAH patients with newly diagnosed MPN, baseline JAK2-UPD status was not associated with complete clinicohematologic response at 24 months."},{"id":"mpn-genomics-interferon-response-C0010","paper":"mpn-genomics-interferon-response","category":"treatment","tier":"univariable or descriptive","genes":["CALR"],"diseases":["MPN"],"text":"In DALIAH patients with newly diagnosed MPN, baseline CALR mutation status was not associated with complete clinicohematologic response at 24 months."},{"id":"mpn-genomics-interferon-response-C0011","paper":"mpn-genomics-interferon-response","category":"treatment","tier":"univariable or descriptive","genes":["DNMT3A","TET2","ASXL1"],"diseases":["MPN"],"text":"In DALIAH patients with newly diagnosed MPN, baseline concomitant mutation in DNMT3A, TET2, or ASXL1 was not associated with complete clinicohematologic response at 24 months."},{"id":"mpn-genomics-interferon-response-C0012","paper":"mpn-genomics-interferon-response","category":"treatment","tier":"univariable or descriptive","genes":["JAK2"],"diseases":["MPN"],"text":"Among JAK2-mutated DALIAH patients randomized to hydroxyurea, JAK2 VAF declined significantly by 24 months in patients achieving complete clinicohematologic response, but not in those who failed to achieve response."},{"id":"mpn-genomics-interferon-response-C0013","paper":"mpn-genomics-interferon-response","category":"treatment","tier":"univariable or descriptive","genes":["JAK2"],"diseases":["MPN"],"text":"Among JAK2-mutated DALIAH patients treated with interferon-alpha, patients achieving complete clinicohematologic response at 24 months had a greater reduction in JAK2 VAF than nonresponders."},{"id":"mpn-genomics-interferon-response-C0014","paper":"mpn-genomics-interferon-response","category":"treatment","tier":"univariable or descriptive","genes":["CALR"],"diseases":["MPN"],"text":"Among the 18 evaluable CALR-positive DALIAH patients allocated to interferon-alpha, CALR VAF did not significantly decline at 24 months in either complete clinicohematologic responders or nonresponders."},{"id":"mpn-genomics-interferon-response-C0015","paper":"mpn-genomics-interferon-response","category":"treatment","tier":"univariable or descriptive","genes":["DNMT3A"],"diseases":["MPN"],"text":"Among DALIAH patients with newly diagnosed MPN who had treatment-emergent mutations, DNMT3A mutations were more common during interferon-alpha than hydroxyurea treatment (11/18 [61%] vs 3/14 [21%]; P=.046)."},{"id":"mpn-genomics-interferon-response-C0016","paper":"mpn-genomics-interferon-response","category":"treatment","tier":"univariable or descriptive","genes":["DNMT3A"],"diseases":["MPN"],"text":"Among interferon-alpha-treated DALIAH patients with treatment-emergent mutations, emergent DNMT3A mutations were significantly enriched in patients failing to achieve complete clinicohematologic response compared with emergent non-DNMT3A mutations (89% vs 20%; P=.02)."},{"id":"mpn-genomics-interferon-response-C0017","paper":"mpn-genomics-interferon-response","category":"biomarker","tier":"univariable or descriptive","genes":["JAK2"],"diseases":["MPN"],"text":"In JAK2-mutated MPN, targeted NGS that incorporates informative chromosome 9p SNP coverage can determine JAK2 uniparental disomy (JAK2-UPD), enabling distinction between heterozygous and homozygous JAK2-mutated states; the authors note that this is particularly informative when JAK2 VAF is <50%."},{"id":"mpn-genomics-interferon-response-C0018","paper":"mpn-genomics-interferon-response","category":"prognosis","tier":"restated secondary","genes":["JAK2"],"diseases":["CHIP"],"text":"JAK2V617F-mutant clonal hematopoiesis is associated with an increased risk of cardiovascular disease."},{"id":"mpn-genomics-interferon-response-C0019","paper":"mpn-genomics-interferon-response","category":"prognosis","tier":"restated secondary","genes":["JAK2"],"diseases":["CHIP"],"text":"JAK2V617F-mutant clonal hematopoiesis is associated with an increased risk of venous thrombosis."},{"id":"passamonti-2017-mysec-pm-secondary-C0001","paper":"passamonti-2017-mysec-pm-secondary","category":"prognosis","tier":"restated secondary","genes":["CALR"],"diseases":["post-PV/post-ET MF"],"text":"In previously reported MYSEC data for post-PV/post-ET myelofibrosis, CALR type 1/type 1-like and CALR type 2/type 2-like mutations had similar outcomes."},{"id":"passamonti-2017-mysec-pm-secondary-C0002","paper":"passamonti-2017-mysec-pm-secondary","category":"prognosis","tier":"restated secondary","genes":["JAK2","CALR"],"diseases":["post-PV/post-ET MF"],"text":"In previously reported MYSEC data, JAK2-mutated post-ET myelofibrosis had higher blast-phase incidence than CALR-mutated disease."},{"id":"passamonti-2017-mysec-pm-secondary-C0003","paper":"passamonti-2017-mysec-pm-secondary","category":"prognosis","tier":"restated secondary","genes":["JAK2","MPL","CALR"],"diseases":["post-PV/post-ET MF"],"text":"In previously reported MYSEC data for post-PV/post-ET myelofibrosis, triple-negative disease lacking JAK2, MPL, and CALR mutations had higher blast-phase incidence than CALR-mutated disease."},{"id":"passamonti-2017-mysec-pm-secondary-C0004","paper":"passamonti-2017-mysec-pm-secondary","category":"prognosis","tier":"multivariable-adjusted","genes":["CALR","JAK2","MPL"],"diseases":["post-PV/post-ET MF"],"text":"In post-PV/post-ET myelofibrosis, CALR-unmutated genotypes (JAK2-mutated, MPL-mutated, or triple-negative) were associated with worse survival in multivariable analysis."},{"id":"passamonti-2017-mysec-pm-secondary-C0006","paper":"passamonti-2017-mysec-pm-secondary","category":"prognosis","tier":"multivariable-adjusted","genes":["CALR"],"diseases":["post-PV/post-ET MF"],"text":"MYSEC-PM, which incorporates CALR-unmutated genotype as a prognostic factor, stratified post-PV/post-ET myelofibrosis into low-, intermediate-1-, intermediate-2-, and high-risk groups with median survival not reached, 9.3 years, 4.5 years, and 2.0 years, respectively."},{"id":"passamonti-2017-mysec-pm-secondary-C0007","paper":"passamonti-2017-mysec-pm-secondary","category":"prognosis","tier":"multivariable-adjusted","genes":["CALR"],"diseases":["post-PV/post-ET MF"],"text":"For post-PV/post-ET myelofibrosis, MYSEC-PM, which incorporates CALR-unmutated genotype, provided more accurate survival risk stratification than IPSS."},{"id":"passamonti-2017-mysec-pm-secondary-C0008","paper":"passamonti-2017-mysec-pm-secondary","category":"treatment","tier":"restated secondary","genes":["CALR"],"diseases":["post-PV/post-ET MF"],"text":"For young, fit patients with post-PV/post-ET myelofibrosis classified as MYSEC-PM intermediate-2 or high risk, allogenic stem cell transplantation (ASCT) can be considered; MYSEC-PM incorporates CALR-unmutated genotype together with clinical factors."},{"id":"passamonti-2017-mysec-pm-secondary-C0009","paper":"passamonti-2017-mysec-pm-secondary","category":"treatment","tier":"univariable or descriptive","genes":["CALR"],"diseases":["post-PV/post-ET MF"],"text":"For post-PV/post-ET myelofibrosis classified as MYSEC-PM low risk, the authors state that a more conservative approach seems reasonable; MYSEC-PM incorporates CALR-unmutated genotype together with clinical factors."},{"id":"passamonti-2017-mysec-pm-secondary-C0010","paper":"passamonti-2017-mysec-pm-secondary","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["post-PV/post-ET MF"],"text":"As restated in this paper, bone marrow fibrosis above grade 1 is one of the two main IWG-MRT diagnostic criteria for post-PV/post-ET myelofibrosis."},{"id":"sf3b1-luspatercept-response-C0001","paper":"sf3b1-luspatercept-response","category":"treatment","tier":"multivariable-adjusted","genes":["SF3B1"],"diseases":["MDS"],"text":"Among patients with lower-risk MDS treated with higher-dose luspatercept, SF3B1 mutation was associated with a higher erythroid response rate (IWG HI-E: 77% vs 40% in mutation-negative patients), and SF3B1 mutation status remained significant in multivariable analysis (p=0.01)."},{"id":"sf3b1-luspatercept-response-C0002","paper":"sf3b1-luspatercept-response","category":"treatment","tier":"univariable or descriptive","genes":["SF3B1","SRSF2","U2AF1","ZRSR2"],"diseases":["MDS"],"text":"Among patients with lower-risk MDS treated with luspatercept 0.75–1.75 mg/kg, International Working Group haematological improvement–erythroid (IWG HI-E) occurred in 73% with a mutation in any assessed splicing factor (SF3B1, SRSF2, U2AF1, or ZRSR2) versus 36% without an assessed splicing-factor mutation."},{"id":"sf3b1-luspatercept-response-C0003","paper":"sf3b1-luspatercept-response","category":"treatment","tier":"univariable or descriptive","genes":["SF3B1","SRSF2","U2AF1","ZRSR2"],"diseases":["MDS"],"text":"Among RBC-transfusion-independence-evaluable patients with lower-risk MDS treated with luspatercept 0.75–1.75 mg/kg, red blood cell transfusion independence (RBC-TI) for at least 8 weeks occurred in 50% with a mutation in any assessed splicing factor (SF3B1, SRSF2, U2AF1, or ZRSR2) versus 8% without an assessed splicing-factor mutation."},{"id":"tefferi-2018-genomics-only-pmf-C0001","paper":"tefferi-2018-genomics-only-pmf","category":"treatment","tier":"restated secondary","genes":[],"diseases":["PMF"],"text":"In PMF, allogeneic hematopoietic stem cell transplantation is stated to be the treatment of choice when the g  model (HR 2.4, 95% CI 1.7–3.3)."},{"id":"tefferi-2018-genomics-only-pmf-C0007","paper":"tefferi-2018-genomics-only-pmf","category":"prognosis","tier":"multivariable-adjusted","genes":["ASXL1"],"diseases":["PMF"],"text":"ASXL1 mutation independently predicted inferior leukemia-free survival in PMF after adjustment for other risk factors for leukemic transformation (HR 2.1, 95% CI 1.3–3.4)."},{"id":"tefferi-2018-genomics-only-pmf-C0008","paper":"tefferi-2018-genomics-only-pmf","category":"prognosis","tier":"multivariable-adjusted","genes":["SRSF2"],"diseases":["PMF"],"text":"SRSF2 mutation independently predicted inferior leukemia-free survival in PMF after adjustment for other risk factors for leukemic transformation (HR 4.3, 95% CI 2.5–7.5)."},{"id":"tefferi-2018-genomics-only-pmf-C0009","paper":"tefferi-2018-genomics-only-pmf","category":"prognosis","tier":"univariable or descriptive","genes":["IDH1","IDH2"],"diseases":["PMF"],"text":"IDH1/2 mutation was associated with inferior leukemia-free survival in this PMF cohort in univariable analysis (HR 3.1, 95% CI 1.4–6.7; p=0.005)."},{"id":"tefferi-2018-genomics-only-pmf-C0010","paper":"tefferi-2018-genomics-only-pmf","category":"prognosis","tier":"univariable or descriptive","genes":["JAK2","CALR","MPL"],"diseases":["PMF"],"text":"Triple-negative driver status was associated with inferior leukemia-free survival in this PMF cohort in univariable analysis (HR 2.9, 95% CI 1.4–6.2; p=0.005)."},{"id":"tefferi-2018-genomics-only-pmf-C0011","paper":"tefferi-2018-genomics-only-pmf","category":"prognosis","tier":"multivariable-adjusted","genes":["CALR","ASXL1","SRSF2","U2AF1"],"diseases":["PMF"],"text":"For PMF, GIPSS assigns 2 points for very-high-risk karyotype and 1 point each for unfavorable karyotype, absence of type 1/like CALR mutation, ASXL1 mutation, SRSF2 mutation, or U2AF1 Q157 mutation."},{"id":"tefferi-2018-genomics-only-pmf-C0012","paper":"tefferi-2018-genomics-only-pmf","category":"prognosis","tier":"univariabl ,"diseases":["CHIP"],"text":"CHIP is defined by a myeloid-associated somatic mutation in blood or bone marrow with VAF ≥2% in an individual without a myeloid neoplasm or unexplained cytopenia."},{"id":"xie-2024-ccrs-ccus-C0002","paper":"xie-2024-ccrs-ccus","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["CCUS"],"text":"CCUS is characterized by a myeloid-related somatic mutation with VAF ≥2% in an individual with unexplained cytopenia(s) but no myeloid neoplasm."},{"id":"xie-2024-ccrs-ccus-C0003","paper":"xie-2024-ccrs-ccus","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["CHIP"],"text":"In a patient with CHIP, AMC ≥0.5 × 10^9/L, monocytes ≥10% of the WBC differential, and no bone-marrow morphologic findings of CMML further classify the condition as CMUS."},{"id":"xie-2024-ccrs-ccus-C0004","paper":"xie-2024-ccrs-ccus","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["CCUS"],"text":"In a patient with CCUS, AMC ≥0.5 × 10^9/L, monocytes ≥10% of the WBC differential, and no bone-marrow morphologic findings of CMML further classify the condition as CCMUS."},{"id":"xie-2024-ccrs-ccus-C0005","paper":"xie-2024-ccrs-ccus","category":"prognosis","tier":"univariable or descriptive","genes":["TET2"],"diseases":["CCUS"],"text":"In this 357-patient CCUS cohort, TET2 mutation was associated with shorter leukemia-free survival (HR 3.29, 95% CI 1.82-5.86; P<.001)."},{"id":"xie-2024-ccrs-ccus-C0006","paper":"xie-2024-ccrs-ccus","category":"prognosis","tier":"univariable or descriptive","genes":["SRSF2"],"diseases":["CCUS"],"text":"In this 357-patient CCUS cohort, SRSF2 mutation was associated with shorter leukemia-free survival (HR 3.81, 95% CI 2.13-6.83; P=.001)."},{"id":"xie-2024-ccrs-ccus-C0007","paper":"xie-2024-ccrs-ccus","category":"prognosis","tier":"univariable or descriptive","genes":["ZRSR2"],"diseases":["CCUS"],"text":"In this 357-patient CCUS cohort, ZRSR2 mutation was associated with shorter leuk
