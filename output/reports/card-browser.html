8d5bad72ba2ad8179727e884031","audit":{"verdict":"pass","basis":"phase4_adjudicated"}},{"id":"alaggio-2022-leukemia-who5-lymphoid-C0110","shortId":"C0110","paper":"alaggio-2022-leukemia-who5-lymphoid","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["primary cutaneous CD4-positive small/medium T-cell lymphoproliferative disorder"],"ancestors":["lymphoid neoplasm","T-cell/NK-cell lymphoid neoplasm","mature T-cell/NK-cell neoplasm","primary cutaneous T-cell lymphoma"],"locator":"Primary cutaneous T-cell lymphoma section, line 503","secondary":null,"text":"According to WHO-HAEM5, primary cutaneous CD4-positive small/medium T-cell lymphoproliferative disorder is listed as a separate entity rather than within the WHO-HAEM4R group “cutaneous peripheral T-cell lymphoma, rare subtypes”.","baseSha256":"a87096f881e7fe9886a1c094e19217ec0f0e7530b23cc6a6a29e99912cf77205","audit":{"verdict":"pass","basis":"phase4_adjudicated"}},{"id":"arber-2022-blood-140-1200-C0001","shortId":"C0001","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["CML"],"ancestors":["MPN"],"locator":"Myeloproliferative neoplasms; CML; Table 2","secondary":null,"text":"According to the ICC, accelerated-phase CML is defined by any of the following: 10%-19% blasts in peripheral blood or bone marrow; peripheral-blood basophils >=20%; or a major-route additional clonal cytogenetic abnormality in Philadelphia-positive cells at diagnosis or acquired during treatment (second Philadelphia chromosome, trisomy 8, i(17q), trisomy 19, complex karyotype, or 3q26.2 abnormality).","baseSha256":"ed506af12116832fb1d5be5e71497e5f7c249518c5978ed9d6b532a26704a30c","audit":{"verdict":"pass","basis":"carried_forward"}},{"id":"arber-2022-blood-140-1200-C0002","shortId":"C0002","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["CML"],"ancestors":["MPN"],"locator":"Myeloproliferative neoplasms; CML; Table 2","secondary":null,"text":"According to the ICC, blast-phase CML is defined by >=20% blasts in peripheral blood or bone marrow or by myeloid sarcoma (extramedullary blast proliferation).","baseSha256":"3b1d603d27734a27b244b63e38e4372e69da9ab98ce3e9c2a22a3fe2904c695a","audit":{"verdict":"pass","basis":"carried_forward"}},{"id":"arber-2022-blood-140-1200-C0003","shortId":"C0003","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["CML"],"ancestors":["MPN"],"locator":"Myeloproliferative neoplasms; CML; Table 2","secondary":null,"text":"In CML, morphologically apparent lymphoblasts >5% warrant consideration of lymphoblastic crisis; immunophenotypic analysis is required to confirm lymphoid lineage.","baseSha256":"86b3fc73a68e6cf9a422b10272b140d9498acc0aea8fcf77d7dcb08daf8e2a78","audit":{"verdict":"pass","basis":"carried_forward"}},{"id":"arber-2022-blood-140-1200-C0004","shortId":"C0004","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["JAK2"],"diseases":["PV"],"ancestors":["MPN"],"locator":"Myeloproliferative neoplasms; PV; Table 3","secondary":null,"text":"According to the ICC, polycythemia vera requires either all 3 major criteria or the first 2 major criteria plus the minor criterion. Major criteria are: elevated hemoglobin (>16.5 g/dL in men or >16.0 g/dL in women), elevated hematocrit (>49% in men or >48% in women), or red-cell mass >25% above predicted; JAK2 V617F or JAK2 exon 12 mutation; and age-adjusted hypercellular marrow with trilineage proliferation (panmyelosis). The minor criterion is a subnormal serum erythropoietin level.","baseSha256":"c16b74dc66e103e1db26f6a05b54d1d735e656f6a6ad7ce4e6ff1752b3d711ab","audit":{"verdict":"pass","basis":"carried_forward"}},{"id":"arber-2022-blood-140-1200-C0005","shortId":"C0005","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["JAK2"],"diseases":["PV"],"ancestors":["MPN"],"locator":"Myeloproliferative neoplasms; PV; Table 3","secondary":null,"text":"In patients with sustained absolute erythrocytosis (hemoglobin >18.5 g/dL in men or >16.5 g/dL in women and hematocrit >55.5% in men or >49.5% in women) plus JAK2 V617F or JAK2 exon 12 mutation, a bone marrow biopsy may not be required for polycythemia vera diagnosis.","baseSha256":"c30f39c46d14e76babd64e8c968e030065b088b85e17beeb0e71fabe78c320e1","audit":{"verdict":"pass","basis":"carried_forward"}},{"id":"arber-2022-blood-140-1200-C0006","shortId":"C0006","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["JAK2"],"diseases":["PV"],"ancestors":["MPN"],"locator":"Myeloproliferative neoplasms; MPN driver mutations","secondary":null,"text":"In JAK2 exon 12-mutated polycythemia vera with isolated erythrocytosis and erythroid-predominant marrow, the usual panmyelosis diagnostic criterion may not apply.","baseSha256":"6cb597a55d136710cfd0cc2608c101523dd6ea08f1fda01a7b941dc0c4d6a9cc","audit":{"verdict":"pass","basis":"carried_forward"}},{"id":"arber-2022-blood-140-1200-C0007","shortId":"C0007","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["post-PV/post-ET MF"],"ancestors":["MPN"],"locator":"Myeloproliferative neoplasms; post-ET myelofibrosis; Table 4","secondary":null,"text":"According to the ICC, post-polycythemia vera myelofibrosis requires both required criteria—previous established polycythemia vera and bone-marrow fibrosis grade 2 or 3—plus at least 2 additional criteria: anemia or sustained loss of requirement for phlebotomy/cytoreductive treatment for erythrocytosis; leukoerythroblastosis; increased or newly palpable splenomegaly; or development of at least 2 of >10% weight loss in 6 months, night sweats, and unexplained fever >37.5°C.","baseSha256":"7aa340274654eeeffd4c1760c1967464837aa544cf51e34808938e888bf0daef","audit":{"verdict":"pass","basis":"carried_forward"}},{"id":"arber-2022-blood-140-1200-C0008","shortId":"C0008","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["ABL1","BCR","CALR","JAK2","MPL"],"diseases":["ET"],"ancestors":["MPN"],"locator":"Myeloproliferative neoplasms; essential thrombocythemia; Table 4","secondary":null,"text":"According to the ICC, essential thrombocythemia requires all 4 major criteria or the first 3 major criteria plus the minor criterion. Major criteria are platelet count >=450 x 10^9/L; characteristic megakaryocytic-lineage proliferation with enlarged mature hyperlobulated megakaryocytes and no significant granulocytic/erythroid proliferation or relevant fibrosis; exclusion of BCR::ABL1-positive CML, polycythemia vera, primary myelofibrosis, and other myeloid neoplasms; and JAK2, CALR, or MPL mutation. The minor criterion is another clonal marker or absence of reactive thrombocytosis.","baseSha256":"a2251248a6ae53c6ea9477459340e3cbd64f23598298981d3ace89148bed2725","audit":{"verdict":"pass","basis":"carried_forward"}},{"id":"arber-2022-blood-140-1200-C0009","shortId":"C0009","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["ET"],"ancestors":["MPN"],"locator":"Myeloproliferative neoplasms; essential thrombocythemia; Table 4","secondary":null,"text":"Small dense megakaryocyte clusters can occur infrequently in essential thrombocythemia and therefore do not by themselves exclude that diagnosis.","baseSha256":"5c273e8aeb475e79fcb7fdf7cc12177ad0e769e6fa9390e588e2b34e8ee07a44","audit":{"verdict":"pass","basis":"carried_forward"}},{"id":"arber-2022-blood-140-1200-C0010","shortId":"C0010","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["post-PV/post-ET MF"],"ancestors":["MPN"],"locator":"Myeloproliferative neoplasms; post-ET myelofibrosis; Table 4","secondary":null,"text":"According to the ICC, post-essential thrombocythemia myelofibrosis requires both required criteria—previous established essential thrombocythemia and bone-marrow fibrosis grade 2 or 3—plus at least 2 additional criteria: anemia with a >2 g/dL decrease from baseline hemoglobin; leukoerythroblastosis; increased or newly palpable splenomegaly; elevated LDH; or development of at least 2 of >10% weight loss in 6 months, night sweats, and unexplained fever >37.5°C.","baseSha256":"8150ae23a0ac91936dc3e0dbe8978405946d4b6599ac23820619983312959d91","audit":{"verdict":"pass","basis":"carried_forward"}},{"id":"arber-2022-blood-140-1200-C0011","shortId":"C0011","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["ABL1","BCR","CALR","JAK2","MPL"],"diseases":["PMF"],"ancestors":["MPN"],"locator":"Myeloproliferative neoplasms; primary myelofibrosis; Table 5","secondary":null,"text":"According to the ICC, pre-fibrotic/early primary myelofibrosis requires all 3 major criteria and at least 1 minor criterion confirmed on 2 consecutive determinations. Major criteria are characteristic megakaryocytic proliferation/atypia with marrow fibrosis <grade 2, increased age-adjusted cellularity, granulocytic proliferation and often decreased erythropoiesis; JAK2, CALR, or MPL mutation, another clonal marker, or absence of reactive reticulin fibrosis; and exclusion of BCR::ABL1-positive CML, polycythemia vera, essential thrombocythemia, MDS, and other myeloid neoplasms. Minor criteria are unexplained anemia, leukocytosis >=11 x 10^9/L, palpable splenomegaly, or elevated LDH.","baseSha256":"7fbec14dc839e9b873c90b006febb252e4fb634d5160cd24d03761ecd12c3395","audit":{"verdict":"pass","basis":"carried_forward"}},{"id":"arber-2022-blood-140-1200-C0012","shortId":"C0012","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["ABL1","BCR","CALR","JAK2","MPL"],"diseases":["PMF"],"ancestors":["MPN"],"locator":"Myeloproliferative neoplasms; primary myelofibrosis; Table 5","secondary":null,"text":"According to the ICC, overt primary myelofibrosis requires all 3 major criteria and at least 1 minor criterion confirmed on 2 consecutive determinations. Major criteria are megakaryocytic proliferation/atypia with reticulin and/or collagen fibrosis grade 2 or 3; JAK2, CALR, or MPL mutation, another clonal marker, or absence of reactive myelofibrosis; and exclusion of essential thrombocythemia, polycythemia vera, BCR::ABL1-positive CML, MDS, and other myeloid neoplasms. Minor criteria are unexplained anemia, leukocytosis >=11 x 10^9/L, palpable splenomegaly, elevated LDH, or leukoerythroblastosis.","baseSha256":"f3f3bf5d2fed9249eeaac084d0b19c1c50ad103f751ea04762136c0d99fe2af1","audit":{"verdict":"pass","basis":"carried_forward"}},{"id":"arber-2022-blood-140-1200-C0013","shortId":"C0013","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["ASXL1","EZH2","IDH1","IDH2","SF3B1","SRSF2","TET2"],"diseases":["PMF"],"ancestors":["MPN"],"locator":"Myeloproliferative neoplasms; primary myelofibrosis; Table 5","secondary":null,"text":"In suspected primary myelofibrosis, detection of ASXL1, EZH2, IDH1, IDH2, SF3B1, SRSF2, or TET2 mutation can support the clonal nature of disease when canonical MPN-driver mutations are absent.","baseSha256":"d74fb374d1a6aacd5708e7fd082b6cb116028c54421543c5481680d5b8bed73b","audit":{"verdict":"pass","basis":"carried_forward"}},{"id":"arber-2022-blood-140-1200-C0014","shortId":"C0014","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["PMF"],"ancestors":["MPN"],"locator":"Myeloproliferative neoplasms; primary myelofibrosis; Table 5","secondary":null,"text":"In primary myelofibrosis with monocytosis, a history of MPN excludes CMML, while a higher variant allele frequency of MPN-associated driver mutations supports PMF with monocytosis rather than CMML.","baseSha256":"7b2b311844cf40263bca39e1234c5ab2b17f3db22e817112aae87c385a17dd66","audit":{"verdict":"pass","basis":"carried_forward"}},{"id":"arber-2022-blood-140-1200-C0015","shortId":"C0015","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["ABL1","BCR","CSF3R"],"diseases":["CNL"],"ancestors":["MPN"],"locator":"Myeloproliferative neoplasms; chronic neutrophilic leukemia; Table 6","secondary":null,"text":"According to the ICC, chronic neutrophilic leukemia requires neutrophilic leukocytosis with segmented/band neutrophils >=80%, neutrophil precursors <10%, monocytes <10%, no significant dysgranulopoiesis, and hypercellular marrow with increased normally maturing neutrophil granulocytes; exclusion of BCR::ABL1-positive CML, polycythemia vera, essential thrombocythemia, primary myelofibrosis, and myeloid/lymphoid neoplasms with eosinophilia and TK fusions; and either CSF3R T618I/another activating CSF3R mutation or, if CSF3R is absent, persistent neutrophilia for >=3 months with splenomegaly and no reactive cause (with myeloid clonality demonstrated if a plasma-cell neoplasm is present). The WBC threshold is >=13 x 10^9/L with an activating CSF3R mutation and >=25 x 10^9/L without one; absence of CSF3R does not exclude CNL.","baseSha256":"2e3ae0f48b2329188494d8b7ea9aab0fe6eaf07bd1268b37c0bc3e23423a19bf","audit":{"verdict":"pass","basis":"phase3"}},{"id":"arber-2022-blood-140-1200-C0016","shortId":"C0016","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["CNL"],"ancestors":["MPN"],"locator":"Myeloproliferative neoplasms; chronic neutrophilic leukemia; Table 6","secondary":null,"text":"Significant monocytosis, basophilia, eosinophilia, or dysgranulopoiesis should prompt critical review of a proposed chronic neutrophilic leukemia diagnosis.","baseSha256":"a6332cc07b57bbb1e64d418857c61de741abc69918d7f40327f8b5257222d403","audit":{"verdict":"pass","basis":"carried_forward"}},{"id":"arber-2022-blood-140-1200-C0017","shortId":"C0017","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["CNL"],"ancestors":["MPN"],"locator":"Myeloproliferative neoplasms; chronic neutrophilic leukemia; Table 6","secondary":null,"text":"In chronic neutrophilic leukemia, 10%-19% blasts in peripheral blood or bone marrow represents accelerated phase, whereas >=20% blasts represents blast phase.","baseSha256":"90c0b1d49b58b4b14d00dccdf4d9e2fe7d4cf0a4f5069016723b824dcb553e6a","audit":{"verdict":"pass","basis":"carried_forward"}},{"id":"arber-2022-blood-140-1200-C0018","shortId":"C0018","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["ABL1","BCR","FGFR1","FLT3","JAK2","PDGFRA","PDGFRB"],"diseases":["CEL"],"ancestors":["MPN"],"locator":"Myeloproliferative neoplasms; chronic eosinophilic leukemia, NOS; Table 7","secondary":null,"text":"According to the ICC, chronic eosinophilic leukemia, NOS requires all 6 criteria: peripheral-blood eosinophils >=1.5 x 10^9/L and >=10% of leukocytes; <20% blasts in blood and marrow without another AML-defining recurrent genetic abnormality; absence of BCR::ABL1 and other ABL1, PDGFRA, PDGFRB, FGFR1, JAK2, or FLT3 TK fusions; failure to meet criteria for another well-defined MPN, CMML, or systemic mastocytosis; characteristic marrow abnormalities or increased blasts (>=5% marrow and/or >=2% blood); and a clonal cytogenetic abnormality and/or somatic mutation. If clonality or increased blasts are absent, supportive marrow findings can suffice when persistent eosinophilia is present and other causes are excluded.","baseSha256":"d61b911e910e2ff90b39b85a9459c42e6d9e394ba81d376a340abe628ed4d820","audit":{"verdict":"pass","basis":"carried_forward"}},{"id":"arber-2022-blood-140-1200-C0020","shortId":"C0020","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["ABL1","BCR","CALR","JAK2","MPL"],"diseases":["MPN-U"],"ancestors":["MPN"],"locator":"Myeloproliferative neoplasms; MPN-unclassifiable; Table 9","secondary":null,"text":"According to the ICC, myeloproliferative neoplasm, unclassifiable (MPN-U) requires all 3 criteria: clinical and hematologic features of an MPN (with reactive causes excluded if marrow fibrosis is present); JAK2, CALR, or MPL mutation or another clonal marker; and failure to meet criteria for another MPN, MDS, MDS/MPN, or BCR::ABL1-positive CML.","baseSha256":"7a1cd41a19df7afbf21c1f4dc458043aea2f94e38bdf67c3f8344fba96609d67","audit":{"verdict":"pass","basis":"carried_forward"}},{"id":"arber-2022-blood-140-1200-C0021","shortId":"C0021","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["MPN-U"],"ancestors":["MPN"],"locator":"Myeloproliferative neoplasms; MPN-unclassifiable; Table 9","secondary":null,"text":"Myeloproliferative neoplasm, unclassifiable (MPN-U) is an appropriate ICC category for very early-phase MPN lacking fully developed subtype criteria or for splanchnic/portal-vein thrombosis with MPN features that do not meet a specific MPN subtype.","baseSha256":"9a9c155bdcf978515f4d03e712d4b24c241dc1ef4d127943f1086128c351b3d8","audit":{"verdict":"pass","basis":"carried_forward"}},{"id":"arber-2022-blood-140-1200-C0022","shortId":"C0022","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["ASXL1","EZH2","IDH1","IDH2","SF3B1","SRSF2","TET2"],"diseases":["MPN-U"],"ancestors":["MPN"],"locator":"Myeloproliferative neoplasms; MPN-unclassifiable; Table 9","secondary":null,"text":"In myeloproliferative neoplasm, unclassifiable (MPN-U), ASXL1, EZH2, IDH1, IDH2, SF3B1, SRSF2, or TET2 mutations detected by sensitive molecular methods can support the clonal nature of disease.","baseSha256":"68f127d41d2739ea77697b1b7d30b65a0f1e8377a105910e570e3db8486a5d7d","audit":{"verdict":"pass","basis":"carried_forward"}},{"id":"arber-2022-blood-140-1200-C0023","shortId":"C0023","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["ETV6","FIP1L1","PDGFRA","PDGFRB"],"diseases":["myeloid/lymphoid neoplasm with eosinophilia and TK fusion"],"ancestors":[],"locator":"Myeloid/lymphoid neoplasms with eosinophilia and tyrosine kinase gene fusions; Table 10","secondary":null,"text":"The ICC recognizes PDGFRA-rearranged and PDGFRB-rearranged disease within the category of myeloid/lymphoid neoplasms with eosinophilia and tyrosine kinase gene fusions, most commonly FIP1L1::PDGFRA and ETV6::PDGFRB respectively.","baseSha256":"3d67e463382f5154d067b1aed47dbb0d3febb7e46c4fdf380b0948ba289825b1","audit":{"verdict":"pass","basis":"phase3"}},{"id":"arber-2022-blood-140-1200-C0024","shortId":"C0024","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["FGFR1"],"diseases":["myeloid/lymphoid neoplasm with eosinophilia and TK fusion"],"ancestors":[],"locator":"Myeloid/lymphoid neoplasms with eosinophilia and tyrosine kinase gene fusions; Table 10","secondary":null,"text":"The ICC recognizes myeloid/lymphoid neoplasm with eosinophilia and tyrosine kinase gene fusion involving FGFR1, most commonly ZMYM2::FGFR1.","baseSha256":"23c94a44f3b93d6987497545286f755b469dd71b1f0c24da7cf3eeca929f8cc8","audit":{"verdict":"pass","basis":"phase3"}},{"id":"arber-2022-blood-140-1200-C0025","shortId":"C0025","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["JAK2","PCM1"],"diseases":["myeloid/lymphoid neoplasm with eosinophilia and TK fusion"],"ancestors":[],"locator":"Myeloid/lymphoid neoplasms with eosinophilia and tyrosine kinase gene fusions; Table 10","secondary":null,"text":"The ICC recognizes PCM1::JAK2-rearranged myeloid/lymphoid neoplasm with eosinophilia and tyrosine kinase gene fusion as a formal member of this category.","baseSha256":"442e7657c8d8e521881997975bc8639ebd63cb547c456fe6314bd5173bb625e7","audit":{"verdict":"pass","basis":"carried_forward"}},{"id":"arber-2022-blood-140-1200-C0026","shortId":"C0026","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["BCR","ETV6","JAK2","PCM1"],"diseases":["myeloid/lymphoid neoplasm with eosinophilia and TK fusion"],"ancestors":[],"locator":"Myeloid/lymphoid neoplasms with eosinophilia and tyrosine kinase gene fusions; Table 10","secondary":null,"text":"ETV6::JAK2 and BCR::JAK2 neoplasms are considered genetic variants of PCM1::JAK2 myeloid/lymphoid neoplasm with eosinophilia and tyrosine kinase gene fusion in the ICC.","baseSha256":"747752f92ac5b80094fafeba42fed54bdc0cbcc0f434227b7f2b735a3a86fe70","audit":{"verdict":"pass","basis":"carried_forward"}},{"id":"arber-2022-blood-140-1200-C0027","shortId":"C0027","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["ETV6","FLT3"],"diseases":["myeloid/lymphoid neoplasm with eosinophilia and TK fusion"],"ancestors":[],"locator":"Myeloid/lymphoid neoplasms with eosinophilia and tyrosine kinase gene fusions; Table 10","secondary":null,"text":"The ICC recognizes FLT3-rearranged myeloid/lymphoid neoplasm with eosinophilia and tyrosine kinase gene fusion, most commonly ETV6::FLT3.","baseSha256":"56ad63c831e656600daa5be66561ca5faf4838b650a7a4037591ee90af4e2dee","audit":{"verdict":"pass","basis":"phase3"}},{"id":"arber-2022-blood-140-1200-C0028","shortId":"C0028","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["ABL1","ETV6"],"diseases":["myeloid/lymphoid neoplasm with eosinophilia and TK fusion"],"ancestors":[],"locator":"Myeloid/lymphoid neoplasms with eosinophilia and tyrosine kinase gene fusions; Table 10","secondary":null,"text":"The ICC recognizes ETV6::ABL1-rearranged myeloid/lymphoid neoplasm with eosinophilia and tyrosine kinase gene fusion.","baseSha256":"29a328271a368cb06876114243b553a48e7abf82c12f1ff9bb768290a8aa8bd3","audit":{"verdict":"pass","basis":"phase3"}},{"id":"arber-2022-blood-140-1200-C0029","shortId":"C0029","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["ABL1","BCR"],"diseases":["myeloid/lymphoid neoplasm with eosinophilia and TK fusion"],"ancestors":[],"locator":"Myeloid/lymphoid neoplasms with eosinophilia and tyrosine kinase gene fusions; Table 10","secondary":null,"text":"When acute lymphoblastic leukemia carries a tyrosine-kinase fusion, involvement of background myeloid cells supports classification as myeloid/lymphoid neoplasm with eosinophilia and tyrosine kinase gene fusion rather than lymphoid-restricted BCR::ABL1-like B-ALL or de novo T-ALL.","baseSha256":"46a5fe5d4ab8ad9de1eb18571d1c8816d30c0718ed4a41a37c6d02d1153af0b4","audit":{"verdict":"pass","basis":"carried_forward"}},{"id":"arber-2022-blood-140-1200-C0030","shortId":"C0030","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["mastocytosis"],"ancestors":[],"locator":"Mastocytosis; Table 11","secondary":null,"text":"The ICC classifies mastocytosis into cutaneous mastocytosis, generally skin-confined, and systemic mastocytosis, defined by extracutaneous involvement with or without skin disease.","baseSha256":"394405e783b34a6ca57e0fab69018300c24eb32221517a6a022fd2287e5c4a81","audit":{"verdict":"pass","basis":"carried_forward"}},{"id":"arber-2022-blood-140-1200-C0031","shortId":"C0031","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["mastocytosis"],"ancestors":[],"locator":"Mastocytosis; Table 11","secondary":null,"text":"The ICC recognizes five systemic mastocytosis subtypes: indolent, smoldering, aggressive, mast cell leukemia, and systemic mastocytosis with an associated myeloid neoplasm.","baseSha256":"9e2d3d868ee2b3beac62211738a26fe41a9cec4f0cd34694a6287b9bb257d229","audit":{"verdict":"pass","basis":"carried_forward"}},{"id":"arber-2022-blood-140-1200-C0032","shortId":"C0032","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["mastocytosis"],"ancestors":[],"locator":"Mastocytosis; Table 11","secondary":null,"text":"Bone-marrow mastocytosis is described as an indolent systemic mastocytosis variant characterized by limited bone-marrow infiltration, no skin lesions, and normal or slightly elevated serum tryptase levels.","baseSha256":"63b9ad96000f5588b25612625cd2616cebbde472afdbde6075675415da255d3d","audit":{"verdict":"pass","basis":"carried_forward"}},{"id":"arber-2022-blood-140-1200-C0033","shortId":"C0033","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["KIT"],"diseases":["mastocytosis"],"ancestors":[],"locator":"Mastocytosis; Table 11","secondary":null,"text":"According to the ICC, systemic mastocytosis is established by the major criterion—multifocal dense aggregates of >=15 tryptase- and/or CD117-positive mast cells in marrow and/or another extracutaneous organ—or, when the major criterion is absent, by at least 3 of 4 minor criteria: >25% spindle-shaped/atypical immature mast cells; mast-cell expression of CD25, CD2, and/or CD30; KIT D816V or another activating KIT mutation; and persistent serum tryptase >20 ng/mL (not counted in SM with an associated myeloid neoplasm). A TK fusion associated with myeloid/lymphoid neoplasm with eosinophilia excludes systemic mastocytosis.","baseSha256":"a1bf4942a21392b925d2eda2cf28ad1497caaa84aae8eddc4a57966e6a5b98a0","audit":{"verdict":"pass","basis":"carried_forward"}},{"id":"arber-2022-blood-140-1200-C0034","shortId":"C0034","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["mastocytosis"],"ancestors":[],"locator":"Mastocytosis; mast cell leukemia","secondary":null,"text":"In systemic mastocytosis, mast cell leukemia is defined by atypical immature mast cells accounting for >=20% of bone marrow cellularity, with provision for diagnosis when the aspirate is a dry tap or otherwise suboptimal.","baseSha256":"f5e04546f27daa190423117aebb70763c90596a1bc5bdff6899e01289142a403","audit":{"verdict":"pass","basis":"carried_forward"}},{"id":"arber-2022-blood-140-1200-C0035","shortId":"C0035","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["mastocytosis"],"ancestors":[],"locator":"Mastocytosis; mast cell leukemia","secondary":null,"text":"In systemic mastocytosis, the amount of circulating mast cells does not justify a separate leukemic versus aleukemic mast cell leukemia subcategory in the ICC.","baseSha256":"7bf19da844bf43fd55f5b49e419eedeae913d54fea353bce95ecf5fabb244803","audit":{"verdict":"pass","basis":"carried_forward"}},{"id":"arber-2022-blood-140-1200-C0036","shortId":"C0036","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["KIT"],"diseases":["mastocytosis"],"ancestors":[],"locator":"Mastocytosis; mast cell leukemia","secondary":null,"text":"Rare cases of systemic mastocytosis can show mature, round, well-granulated mast cells; these cases typically lack KIT D816V and are often CD25-negative, CD2-negative, and CD30-positive, with variable serum tryptase.","baseSha256":"ea6f73f1f0aec1302bc0431cc1463c729c4c9b5cce38f373568f8c704c71cd17","audit":{"verdict":"pass","basis":"carried_forward"}},{"id":"arber-2022-blood-140-1200-C0037","shortId":"C0037","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["mastocytosis"],"ancestors":[],"locator":"Mastocytosis; systemic mastocytosis with associated myeloid neoplasm; Table 12","secondary":null,"text":"According to the ICC, systemic mastocytosis with an associated myeloid neoplasm requires meeting diagnostic criteria for systemic mastocytosis and for an associated myeloid neoplasm, with the associated neoplasm fully classified.","baseSha256":"16e7f3edad0680f823d203e59b75076a1739d16b84fb69088b5927f5b5dd8d20","audit":{"verdict":"pass","basis":"carried_forward"}},{"id":"arber-2022-blood-140-1200-C0038","shortId":"C0038","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["KIT"],"diseases":["mastocytosis"],"ancestors":[],"locator":"Mastocytosis; systemic mastocytosis with associated myeloid neoplasm; Table 12","secondary":null,"text":"Monocytosis, eosinophilia, splenomegaly, elevated LDH, high KIT D816V variant allele frequency, and additional myeloid-malignancy mutations, particularly in combination, can raise suspicion for an associated myeloid neoplasm in systemic mastocytosis.","baseSha256":"42fc0c268d91be119ed3707ac37b0d58edde12bc767fe0f117f5552c9ae3ee18","audit":{"verdict":"pass","basis":"carried_forward"}},{"id":"arber-2022-blood-140-1200-C0039","shortId":"C0039","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["KIT"],"diseases":["mastocytosis"],"ancestors":[],"locator":"Mastocytosis; systemic mastocytosis with associated myeloid neoplasm; Table 12 footnote","secondary":null,"text":"In rare systemic mastocytosis cases with both a KIT mutation and a myeloid/lymphoid-neoplasm tyrosine-kinase fusion, the ICC recommends assigning the fusion-defined myeloid/lymphoid neoplasm as the associated myeloid neoplasm only when both abnormalities are present.","baseSha256":"e40886756226af30d8befa23aef56d69afa126afef1ae1700d60bce1d1ed33a4","audit":{"verdict":"pass","basis":"carried_forward"}},{"id":"arber-2022-blood-140-1200-C0040","shortId":"C0040","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["MDS/MPN"],"ancestors":["MDS","MPN"],"locator":"MDS/MPN; general criteria","secondary":null,"text":"According to the ICC, cytopenia together with cytosis is a key characteristic of MDS/MPN; cytopenia thresholds are hemoglobin <13 g/dL in males or <12 g/dL in females, ANC <1.8 x 10^9/L, or platelets <150 x 10^9/L.","baseSha256":"b36bbfe64483fdac687fda6d0ce6ee4f2b78e25466dbf9142847f1fdfe6c9cdb","audit":{"verdict":"pass","basis":"carried_forward"}},{"id":"arber-2022-blood-140-1200-C0041","shortId":"C0041","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["ABL1","BCR"],"diseases":["CMML"],"ancestors":["MDS","MDS/MPN","MPN"],"locator":"MDS/MPN; CMML; Table 13","secondary":null,"text":"According to the ICC, CMML requires persistent monocytosis (absolute monocytes >=0.5 x 10^9/L and >=10% of WBCs), cytopenia using MDS thresholds except that some early cases may have borderline/no cytopenia, <20% blasts including promonocytes in blood and marrow, marrow morphology consistent with CMML, and absence of BCR::ABL1 or TK-fusion myeloid/lymphoid neoplasms. Clonality is established by abnormal cytogenetics and/or a myeloid-neoplasm-associated mutation with allele frequency >=10%; without demonstrable clonality, monocytes must be >=1.0 x 10^9/L and >10% of WBCs together with increased blasts, morphologic dysplasia, or an abnormal CMML immunophenotype.","baseSha256":"aaabd87b3d3132d231369dcadde30ba48a24600c89060db8fa77c2a832143cec","audit":{"verdict":"pass","basis":"carried_forward"}},{"id":"arber-2022-blood-140-1200-C0042","shortId":"C0042","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["CMML"],"ancestors":["MDS","MDS/MPN","MPN"],"locator":"MDS/MPN; CMML","secondary":null,"text":"According to the ICC, CMML uses a 2-tier blast classification: CMML-1 has <5% blasts in peripheral blood and <10% in bone marrow; CMML-2 has 5%-19% blasts in blood, 10%-19% in marrow, or Auer rods. The former CMML-0 category is eliminated.","baseSha256":"e207e1b251c28c92603576b823063d37e76523b7dcdc05db57f238f29e9291cc","audit":{"verdict":"pass","basis":"carried_forward"}},{"id":"arber-2022-blood-140-1200-C0043","shortId":"C0043","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["NPM1"],"diseases":["CMML"],"ancestors":["MDS","MDS/MPN","MPN"],"locator":"MDS/MPN; CMML; Table 13","secondary":null,"text":"Development of an NPM1 mutation in established CMML should be noted but does not by itself define de novo AML.","baseSha256":"b2eb4105483598dc9532a385c0b8e87f2e2445246f988c3f15fd161cb1ad8107","audit":{"verdict":"pass","basis":"carried_forward"}},{"id":"arber-2022-blood-140-1200-C0044","shortId":"C0044","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["CMML"],"ancestors":["MDS","MDS/MPN","MPN"],"locator":"MDS/MPN; CMML; Table 13","secondary":null,"text":"The ICC myeloproliferative subtype of CMML (CMML-MP) is defined by WBC >13 x 10^9/L.","baseSha256":"fe23dc4bf6072523cc607da22f3d1b5fd5dac229835a72e051ed6ae74098665a","audit":{"verdict":"pass","basis":"carried_forward"}},{"id":"arber-2022-blood-140-1200-C0046","shortId":"C0046","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["ABL1","ASXL1","BCR","CALR","JAK2","MPL","SETBP1"],"diseases":["aCML"],"ancestors":["MDS","MDS/MPN","MPN"],"locator":"MDS/MPN; atypical chronic myeloid leukemia; diagnostic criteria","secondary":null,"text":"According to the ICC, atypical chronic myeloid leukemia (aCML) requires WBC >=13 x 10^9/L due to neutrophils and precursors with promyelocytes/myelocytes/metamyelocytes >=10%; cytopenia using MDS thresholds; <20% blasts; prominent dysgranulopoiesis; monocytes <10% and eosinophils <10% of leukocytes; hypercellular marrow with granulocytic proliferation/dysplasia; and absence of BCR::ABL1 and TK-fusion myeloid/lymphoid neoplasms. Absence of JAK2, CALR, and MPL supports the diagnosis, and SETBP1 mutation, often with ASXL1, provides additional support.","baseSha256":"0384f2a3669e395503ecc527b946a89420dd171baaf1d6e6ece6b93c2077fc4a","audit":{"verdict":"pass","basis":"carried_forward"}},{"id":"arber-2022-blood-140-1200-C0047","shortId":"C0047","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["CALR","JAK2","MPL"],"diseases":["aCML"],"ancestors":["MDS","MDS/MPN","MPN"],"locator":"MDS/MPN; atypical chronic myeloid leukemia; diagnostic criteria","secondary":null,"text":"A history of MPN and/or JAK2, CALR, or MPL mutation tends to exclude atypical chronic myeloid leukemia (aCML).","baseSha256":"5aa62d6b5e27b650e0bc545e7ac8f41b13e3848f5fdf892d40e0822faec8edbc","audit":{"verdict":"pass","basis":"carried_forward"}},{"id":"arber-2022-blood-140-1200-C0048","shortId":"C0048","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["CSF3R"],"diseases":["aCML","CNL"],"ancestors":["MDS","MDS/MPN","MPN"],"locator":"MDS/MPN; atypical chronic myeloid leukemia; diagnostic criteria","secondary":null,"text":"Detection of a CSF3R mutation in suspected atypical chronic myeloid leukemia (aCML) should prompt careful morphologic review to exclude chronic neutrophilic leukemia.","baseSha256":"bfe39933c79ff8d324ce23a536c847a8a3333c1d22764f35ddf076fa1a0aa1ce","audit":{"verdict":"pass","basis":"carried_forward"}},{"id":"arber-2022-blood-140-1200-C0049","shortId":"C0049","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["ABL1","BCR","CALR","JAK2","MPL","SF3B1"],"diseases":["MDS/MPN-SF3B1-T"],"ancestors":["MDS","MDS/MPN","MPN"],"locator":"MDS/MPN; MDS/MPN with SF3B1 mutation and thrombocytosis; Table 16","secondary":null,"text":"According to the ICC, MDS/MPN with SF3B1 mutation and thrombocytosis requires thrombocytosis >=450 x 10^9/L and anemia present at initial diagnosis, <1% blood blasts and <5% marrow blasts, and SF3B1 mutation with VAF >10%; no recent cytotoxic/growth-factor therapy explaining the phenotype; no prior MPN, MDS, or other MDS/MPN; and absence of BCR::ABL1, TK-fusion myeloid/lymphoid neoplasms, t(3;3), inv(3), and del(5q) meeting MDS-del(5q) criteria. Ring sideroblasts are not required when SF3B1 VAF is >10%; JAK2 V617F, CALR, or MPL W515 co-mutation is not required but supports the diagnosis.","baseSha256":"64ba42dab4e556a557e1417cef215e134dffd7b823784d74d08f3ef8368820ef","audit":{"verdict":"pass","basis":"phase3"}},{"id":"arber-2022-blood-140-1200-C0050","shortId":"C0050","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["ABL1","BCR","SF3B1"],"diseases":["MDS/MPN-SF3B1-T"],"ancestors":["MDS","MDS/MPN","MPN"],"locator":"MDS/MPN; MDS/MPN with ring sideroblasts and thrombocytosis, NOS; Table 17","secondary":null,"text":"According to the ICC, MDS/MPN with ring sideroblasts and thrombocytosis, NOS requires thrombocytosis >=450 x 10^9/L and anemia present at initial diagnosis, erythroid dysplasia with >=15% ring sideroblasts, <1% blood blasts and <5% marrow blasts, and clonality by cytogenetic abnormality and/or somatic mutation (or, if clonality is absent, no recent cytotoxic/growth-factor therapy explaining the phenotype); no prior MPN, MDS, or other MDS/MPN; and absence of SF3B1 mutation, BCR::ABL1, TK-fusion myeloid/lymphoid neoplasms, t(3;3), inv(3), and del(5q) meeting MDS-del(5q) criteria.","baseSha256":"34813b6eb55c7c495dbb6a5b75f010a86a02a3a7c3f5c220dcce75429d8c8d34","audit":{"verdict":"pass","basis":"carried_forward"}},{"id":"arber-2022-blood-140-1200-C0051","shortId":"C0051","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["SF3B1"],"diseases":["MDS"],"ancestors":[],"locator":"MDS/MPN; MDS/MPN with ring sideroblasts and thrombocytosis, NOS; Table 17","secondary":null,"text":"MDS with SF3B1 mutation that later develops thrombocytosis is classified as thrombocytotic progression of MDS-SF3B1 rather than MDS/MPN with thrombocytosis.","baseSha256":"e7399b6ceb2b259711af26905cefa8397b271a439c93bd661e5736bced3d7f81","audit":{"verdict":"pass","basis":"carried_forward"}},{"id":"arber-2022-blood-140-1200-C0052","shortId":"C0052","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["ABL1","BCR"],"diseases":["MDS/MPN-U"],"ancestors":["MDS","MDS/MPN","MPN"],"locator":"MDS/MPN; MDS/MPN, NOS; Table 19","secondary":null,"text":"According to the ICC, MDS/MPN NOS requires mixed myelodysplastic and myeloproliferative features that do not meet another MDS/MPN, MDS, or MPN category; cytopenia using MDS thresholds; <20% blasts in blood and marrow; platelets >=450 x 10^9/L and/or WBC >=13 x 10^9/L; evidence of clonality when demonstrable (or persistent findings with other causes excluded if clonality cannot be determined); and absence of BCR::ABL1, TK-fusion myeloid/lymphoid neoplasms, t(3;3), inv(3), and del(5q) meeting corresponding MDS criteria.","baseSha256":"d03e75a38612a97dbd35a3cad648f37d8b4736664df057aaf515b51551712408","audit":{"verdict":"pass","basis":"carried_forward"}},{"id":"arber-2022-blood-140-1200-C0053","shortId":"C0053","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["CALR","JAK2","MPL"],"diseases":["MDS/MPN-U"],"ancestors":["MDS","MDS/MPN","MPN"],"locator":"MDS/MPN; MDS/MPN, NOS; Table 19","secondary":null,"text":"A history of MPN and/or JAK2, CALR, or MPL mutation, particularly at high VAF, tends to exclude MDS/MPN NOS.","baseSha256":"46ff1b5d6b4856d09c101b9faa8ac1e387dd4a8baec82e8d6076ee3a293db520","audit":{"verdict":"pass","basis":"carried_forward"}},{"id":"arber-2022-blood-140-1200-C0054","shortId":"C0054","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["MDS/MPN-U"],"ancestors":["MDS","MDS/MPN","MPN"],"locator":"MDS/MPN; MDS/MPN, NOS; Table 19","secondary":null,"text":"Hypereosinophilia in a case being considered as MDS/MPN NOS favors chronic eosinophilic leukemia, NOS instead.","baseSha256":"05a23fb8d007b86fbb1cbf0a97cb19cacfbec4263eead85a52fe72fef285135c","audit":{"verdict":"pass","basis":"carried_forward"}},{"id":"arber-2022-blood-140-1200-C0055","shortId":"C0055","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["MDS/MPN-U"],"ancestors":["MDS","MDS/MPN","MPN"],"locator":"MDS/MPN; MDS/MPN, NOS; Table 19","secondary":null,"text":"The ICC MDS/MPN NOS category should not be used to classify advanced-stage MPN or triple-negative MPN merely because they are otherwise difficult to classify.","baseSha256":"9b69abcd6d63ee9dfc8fcba5af01fd70bb9706cbff08165bb2d1796797831890","audit":{"verdict":"pass","basis":"carried_forward"}},{"id":"arber-2022-blood-140-1200-C0056","shortId":"C0056","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["ABL1","BCR","CALR","JAK2","MPL","SETBP1","SRSF2"],"diseases":["MDS/MPN-U"],"ancestors":["MDS","MDS/MPN","MPN"],"locator":"MDS/MPN; provisional MDS/MPN with i(17q); Table 18","secondary":null,"text":"According to the ICC, MDS/MPN with i(17q) is a provisional subtype of MDS/MPN, NOS. Diagnosis requires leukocytosis >=13 x 10^9/L, cytopenia using MDS thresholds, <20% blasts in blood and bone marrow, dysgranulopoiesis with nonsegmented or pseudo-Pelger-Huet neutrophils, and i(17q) either isolated or with one additional abnormality other than -7/del(7q). BCR::ABL1, myeloid/lymphoid-neoplasm tyrosine-kinase gene fusions, and JAK2/CALR/MPL mutations should be absent, and recent cytotoxic or growth-factor therapy must not explain the phenotype. SRSF2 and SETBP1 co-mutations further support the diagnosis.","baseSha256":"281be62c3284aaab9e1323e13766201c2661e27263dbaef0757b27c3c28a9930","audit":{"verdict":"pass","basis":"carried_forward"}},{"id":"arber-2022-blood-140-1200-C0057","shortId":"C0057","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["CCUS","MDS"],"ancestors":[],"locator":"Premalignant clonal cytopenias and MDS; CCUS and CHIP","secondary":null,"text":"For clonal cytopenias spanning CCUS to MDS, the ICC defines cytopenia as acquired sustained hemoglobin <12 g/dL in females or <13 g/dL in males, ANC <1.8 x 10^9/L, and/or platelets <150 x 10^9/L not explained by another condition.","baseSha256":"cd1fe0245b4b50523ef85e63f8b6f85b69c3c6116e00dca910c4c81bd05ca518","audit":{"verdict":"pass","basis":"carried_forward"}},{"id":"arber-2022-blood-140-1200-C0058","shortId":"C0058","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["CHIP"],"ancestors":[],"locator":"Premalignant clonal cytopenias and MDS; CCUS and CHIP","secondary":null,"text":"CHIP is defined by a somatic mutation in a myeloid-neoplasm driver gene at VAF >=2% or a non-MDS-defining clonal cytogenetic abnormality in a patient without a myeloid neoplasm or unexplained cytopenia.","baseSha256":"e05ab2ef80e255a5a64012ae5a61e9e2ad7ff2c5a6d7d940bb8ad70d71ee02e3","audit":{"verdict":"pass","basis":"carried_forward"}},{"id":"arber-2022-blood-140-1200-C0059","shortId":"C0059","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["CCUS"],"ancestors":[],"locator":"Premalignant clonal cytopenias and MDS; CCUS and CHIP","secondary":null,"text":"According to the ICC, CCUS has persistent idiopathic cytopenia for >=4 months; it is distinguished from MDS by absence of dysplasia or increased blasts in blood and marrow, and a VAF threshold >=2% is recommended for the clonal abnormality in CCUS and other premalignant clonal cytopenias.","baseSha256":"f67fcb1cfa3f0b4ec5ae4a83e3dbe08cfe59420c8d5019bd9f696dc64d3589ac","audit":{"verdict":"pass","basis":"carried_forward"}},{"id":"arber-2022-blood-140-1200-C0060","shortId":"C0060","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["UBA1"],"diseases":["MDS"],"ancestors":[],"locator":"Premalignant clonal cytopenias and MDS; CCUS and CHIP","secondary":null,"text":"VEXAS syndrome is associated with somatic UBA1 mutation and should be kept separate from MDS unless morphologic MDS criteria are met.","baseSha256":"05abe06cfe2ec36e6d9b6fa57881424dd2d83da450ae02b6af01900f4ec48e41","audit":{"verdict":"pass","basis":"carried_forward"}},{"id":"arber-2022-blood-140-1200-C0061","shortId":"C0061","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["ABL1","BCR"],"diseases":["MDS"],"ancestors":[],"locator":"Premalignant clonal cytopenias and MDS; MDS definition","secondary":null,"text":"According to the ICC, MDS is a clonal hematopoietic neoplasm defined by persistent unexplained cytopenia and morphologic dysplasia, generally chronic for about >=4 months and not explained by drug, toxin, or comorbidity; a 10% dysplasia threshold is recommended for each lineage, and demonstrable clonality is not required when qualifying dysplasia and cytopenia are present. BCR::ABL1 or a TK-fusion myeloid/lymphoid neoplasm excludes MDS. At initial diagnosis, persistent WBC >=13 x 10^9/L, platelets >=450 x 10^9/L (except MDS-del(5q) or inv(3)/t(3;3)), or monocytes >=0.5 x 10^9/L and >=10% of leukocytes instead favors MDS/MPN or MPN classification.","baseSha256":"21e2c367a103b0a2afacc5e965988e8a0f7d2951c8a6cba161dce353ede07077","audit":{"verdict":"pass","basis":"phase3"}},{"id":"arber-2022-blood-140-1200-C0062","shortId":"C0062","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["RUNX1","SF3B1","TP53"],"diseases":["MDS"],"ancestors":[],"locator":"Premalignant clonal cytopenias and MDS; Table 20","secondary":null,"text":"According to the ICC, MDS with mutated SF3B1 requires SF3B1 mutation VAF >=10%, at least one cytopenia, no ICC-defined cytosis at diagnosis, <5% marrow blasts and <2% blood blasts, and absence of multihit TP53, RUNX1 mutation, isolated del(5q), -7/del(7q), 3q26.2 abnormalities, and complex karyotype. Dysplasia is typically present but is not required, and ring sideroblasts are not required.","baseSha256":"55fc36bc47022ef4c597aa44166a13063e3cfea10db53aa58077d5375d71d98f","audit":{"verdict":"pass","basis":"carried_forward"}},{"id":"arber-2022-blood-140-1200-C0063","shortId":"C0063","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["SF3B1"],"diseases":["MDS"],"ancestors":[],"locator":"Premalignant clonal cytopenias and MDS; Table 20","secondary":null,"text":"SF3B1-unmutated MDS with ring sideroblasts is classified as MDS, NOS irrespective of ring-sideroblast number.","baseSha256":"2c99f649e83c13ca23be9b5dc072be006a5f00bd307a212362e17275516c6f79","audit":{"verdict":"pass","basis":"carried_forward"}},{"id":"arber-2022-blood-140-1200-C0064","shortId":"C0064","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["CCUS","MDS"],"ancestors":[],"locator":"Premalignant clonal cytopenias and MDS; Table 20","secondary":null,"text":"In cytopenic patients lacking dysplasia, prior MDS-defining cytogenetic abnormalities other than del(5q), -7/del(7q), or complex karyotype are now classified as CCUS rather than MDS.","baseSha256":"d32700af5dd3fa8fcc90f171c5b21eccc357e0ddbf3d518ae8decdf828863e6e","audit":{"verdict":"pass","basis":"carried_forward"}},{"id":"arber-2022-blood-140-1200-C0065","shortId":"C0065","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["TP53"],"diseases":["MDS"],"ancestors":[],"locator":"Premalignant clonal cytopenias and MDS; Table 20","secondary":null,"text":"According to the ICC, MDS with excess blasts requires at least one cytopenia, no ICC-defined cytosis, and 5%-9% marrow blasts or 2%-9% blood blasts; 1% peripheral-blood blasts confirmed on two occasions also qualifies. Dysplasia is typically present but not required, multihit TP53 is excluded in favor of MDS with mutated TP53, and excess blasts supersede other non-TP53 MDS subtypes. In patients <18 years, MDS with excess blasts uses 5%-19% marrow blasts and 2%-19% blood blasts, and MDS/AML does not apply.","baseSha256":"f7f62f7b3c6862f2e3acf80578b072077a733bef1be7cf127313b978918fade3","audit":{"verdict":"pass","basis":"phase3"}},{"id":"arber-2022-blood-140-1200-C0066","shortId":"C0066","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["TP53"],"diseases":["MDS"],"ancestors":[],"locator":"Premalignant clonal cytopenias and MDS; Table 20","secondary":null,"text":"According to the ICC, MDS with del(5q) requires at least one cytopenia, del(5q) isolated or with no more than one additional cytogenetic abnormality other than -7/del(7q), <5% marrow blasts and <2% blood blasts, and absence of multihit TP53. Thrombocytosis is allowed but other ICC-defined cytoses are not; dysplasia is typically present but is not required.","baseSha256":"89acb444ba122ee2dad312a34ecd632939e13c0618189ada3e0e0d31a3cd0319","audit":{"verdict":"pass","basis":"carried_forward"}},{"id":"arber-2022-blood-140-1200-C0067","shortId":"C0067","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["SF3B1","TP53"],"diseases":["MDS"],"ancestors":[],"locator":"Premalignant clonal cytopenias and MDS; Table 20","secondary":null,"text":"According to the ICC, MDS, NOS without dysplasia requires at least one cytopenia, no ICC-defined cytosis, <5% marrow blasts and <2% blood blasts, and -7/del(7q) or complex karyotype as the defining cytogenetic abnormality; multihit TP53 and SF3B1 mutation with VAF >=10% are excluded.","baseSha256":"28296f3f054e2b2bd616589c07dca224663be0b9b567abdf33a460b976d8db3c","audit":{"verdict":"pass","basis":"carried_forward"}},{"id":"arber-2022-blood-140-1200-C0068","shortId":"C0068","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["SF3B1","TP53"],"diseases":["MDS"],"ancestors":[],"locator":"Premalignant clonal cytopenias and MDS; Table 20","secondary":null,"text":"According to the ICC, MDS, NOS with single-lineage dysplasia requires dysplasia in one lineage, at least one cytopenia, no ICC-defined cytosis, <5% marrow blasts and <2% blood blasts, and failure to meet criteria for MDS with del(5q) or MDS with mutated SF3B1; multihit TP53 is excluded.","baseSha256":"e058be15e826233edc0b1facb38d8a28cf11fd593e130a40946504f6adf8c5b1","audit":{"verdict":"pass","basis":"carried_forward"}},{"id":"arber-2022-blood-140-1200-C0069","shortId":"C0069","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["SF3B1","TP53"],"diseases":["MDS"],"ancestors":[],"locator":"Premalignant clonal cytopenias and MDS; Table 20","secondary":null,"text":"According to the ICC, MDS, NOS with multilineage dysplasia requires dysplasia in at least two lineages, at least one cytopenia, no ICC-defined cytosis, <5% marrow blasts and <2% blood blasts, and failure to meet criteria for MDS with del(5q) or MDS with mutated SF3B1; multihit TP53 is excluded.","baseSha256":"aa373868f83ddeb136e29e7f9482d7ff8a42e8cea6e7c8922910d8345c5b1e88","audit":{"verdict":"pass","basis":"carried_forward"}},{"id":"arber-2022-blood-140-1200-C0070","shortId":"C0070","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["CEBPA","NPM1","TP53"],"diseases":["MDS/AML"],"ancestors":["MDS","AML"],"locator":"Premalignant clonal cytopenias and MDS; Table 20","secondary":null,"text":"According to the ICC, adult MDS/AML is defined by 10%-19% blasts in blood or marrow, at least one cytopenia, and absence of ICC-defined cytosis. Generic MDS/AML excludes AML-defining cytogenetic abnormalities and NPM1, in-frame bZIP CEBPA, and TP53 mutations that define other genetic categories; dysplasia is typically present but not required. MDS/AML is subclassified as TP53-mutated, myelodysplasia-related gene-mutated, myelodysplasia-related cytogenetic, or NOS.","baseSha256":"2c9802fb08dca3c4d85f114f9788fab669cc367760e6729c67c58bacb57daf63","audit":{"verdict":"pass","basis":"carried_forward"}},{"id":"arber-2022-blood-140-1200-C0071","shortId":"C0071","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["TP53"],"diseases":["MDS"],"ancestors":[],"locator":"Premalignant clonal cytopenias and MDS; myeloid neoplasms with mutated TP53; Table 21","secondary":null,"text":"According to the ICC, MDS with mutated TP53 has 0%-9% blasts and requires multihit TP53, defined as 2 distinct TP53 mutations each with VAF >10% or one TP53 mutation plus 17p deletion, VAF >50%, or copy-neutral LOH at TP53; when LOH information is unavailable, TP53 mutation VAF >10% with complex karyotype qualifies. Complex karyotype without a TP53 mutation does not qualify, and monoallelic TP53-mutated MDS is excluded from this entity.","baseSha256":"34b6d5ee9615e5981f033356e16a251bb3490f7df079e4bbe753c63293a4490a","audit":{"verdict":"pass","basis":"carried_forward"}},{"id":"arber-2022-blood-140-1200-C0072","shortId":"C0072","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["TP53"],"diseases":["MDS/AML"],"ancestors":["MDS","AML"],"locator":"Premalignant clonal cytopenias and MDS; myeloid neoplasms with mutated TP53; Table 21","secondary":null,"text":"MDS/AML with mutated TP53 is defined by 10%-19% blasts and any somatic TP53 mutation with VAF >10%; monoallelic TP53 mutations are allowed.","baseSha256":"56a8969e4be2f86742aa13076eca47fbbbc3585f5715ac9d53590eb294df6de6","audit":{"verdict":"pass","basis":"carried_forward"}},{"id":"arber-2022-blood-140-1200-C0073","shortId":"C0073","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["TP53"],"diseases":["AML"],"ancestors":[],"locator":"Premalignant clonal cytopenias and MDS; myeloid neoplasms with mutated TP53; Table 21","secondary":null,"text":"AML with mutated TP53 is defined by >=20% marrow or blood blasts, or pure erythroid leukemia, plus any somatic TP53 mutation with VAF >10%; monoallelic TP53 mutations are allowed.","baseSha256":"d70b34c7241e3c4d0b047a893871a0b84e4299de4a96b3d61f61ebfa73f1f85c","audit":{"verdict":"pass","basis":"carried_forward"}},{"id":"arber-2022-blood-140-1200-C0074","shortId":"C0074","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["TP53"],"diseases":["MDS"],"ancestors":[],"locator":"Premalignant clonal cytopenias and MDS; progression","secondary":null,"text":"Established MDS that acquires a TP53 mutation can be redesignated as MDS, MDS/AML, or AML with mutated TP53 according to blast count.","baseSha256":"d96ad88ba3aa496f4e505e5f605c0b488f77e5fae6853089b18bfb34c1e1b753","audit":{"verdict":"pass","basis":"carried_forward"}},{"id":"arber-2022-blood-140-1200-C0075","shortId":"C0075","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["MDS"],"ancestors":[],"locator":"Premalignant clonal cytopenias and MDS; progression","secondary":null,"text":"Development of leukocytosis, thrombocytosis, or monocytosis during established MDS generally does not warrant reclassification as MDS/MPN; the disease can instead be designated as MDS with neutrophilic, thrombocytotic, or monocytic progression.","baseSha256":"6dfbcf5e0fc9803e9064e55e1fb64b6af074d62ece22b26042457df129faf0ca","audit":{"verdict":"pass","basis":"carried_forward"}},{"id":"arber-2022-blood-140-1200-C0076","shortId":"C0076","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["MDS"],"ancestors":[],"locator":"Premalignant clonal cytopenias and MDS; diagnostic qualifiers","secondary":null,"text":"The ICC recommends retaining the morphologic/genetic MDS diagnosis as primary and adding a therapy-related qualifier when disease follows cytotoxic therapy.","baseSha256":"f1ff55caa7b4dce9b015c5f46afe6e51a6cc8e35e92b9d7458ceb1141d0a311d","audit":{"verdict":"pass","basis":"carried_forward"}},{"id":"arber-2022-blood-140-1200-C0077","shortId":"C0077","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["CHIP","CCUS","MDS"],"ancestors":[],"locator":"Premalignant clonal cytopenias and MDS; diagnostic qualifiers","secondary":null,"text":"The ICC recommends qualifying CHIP, CCUS, and other non-MDS clonal cytopenias as therapy-related when they follow marrow exposure to chemotherapy or radiation.","baseSha256":"ad73593338f02fca7183c020b04c0833b2084d29e4cda1b58005dd704e5764d0","audit":{"verdict":"pass","basis":"carried_forward"}},{"id":"arber-2022-blood-140-1200-C0078","shortId":"C0078","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["MDS"],"ancestors":[],"locator":"Premalignant clonal cytopenias and MDS; diagnostic qualifiers","secondary":null,"text":"Any underlying germline predisposition mutation or syndrome should be specified as a qualifier after the MDS diagnosis and subtype.","baseSha256":"2e5cfde73f2be79afb6023d5b0a10225ce91e87f6816bf8cf23c38757b13808d","audit":{"verdict":"pass","basis":"carried_forward"}},{"id":"arber-2022-blood-140-1200-C0079","shortId":"C0079","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["ABL1","BCR","CBL","KRAS","NF1","NRAS","PTPN11","RRAS"],"diseases":["JMML"],"ancestors":["MPN"],"locator":"Pediatric disorders and/or germline mutation-associated disorders; JMML; Tables 22-23","secondary":null,"text":"According to the ICC, JMML is a RAS-pathway-defined neoplasm involving PTPN11, NRAS, KRAS, RRAS, NF1, or CBL and generally requires peripheral-blood monocytes >=1 x 10^9/L, splenomegaly, <20% blasts in blood and marrow, and absence of BCR::ABL1. One diagnostic genetic route is a somatic PTPN11, KRAS, NRAS, or RRAS mutation after excluding relevant germline Noonan-syndrome forms; the paper notes that a minority of JMML cases may present below the monocytosis threshold or without splenomegaly.","baseSha256":"96327d7a796c6e3e66da55e173b18c9b4bff53d656ad2dbb1ce52ad0e788e7c3","audit":{"verdict":"pass","basis":"carried_forward"}},{"id":"arber-2022-blood-140-1200-C0080","shortId":"C0080","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["ALK","CBL","CCDC88C","FIP1L1","FLT3","KRAS","NF1","NRAS","PTPN11","RARA","ROS1","RRAS"],"diseases":["JMML"],"ancestors":["MPN"],"locator":"Pediatric disorders and/or germline mutation-associated disorders; JMML-like neoplasms","secondary":null,"text":"According to the ICC, JMML-like neoplasm is a clonal disorder phenotypically resembling JMML but lacking a canonical PTPN11, NRAS, KRAS, RRAS, NF1, or CBL RAS-pathway mutation; rare examples include ALK or ROS1 rearrangements and FIP1L1::RARA or CCDC88C::FLT3 fusions. AML-defining recurrent genetic abnormalities and myeloid/lymphoid neoplasms with eosinophilia and TK fusions are excluded.","baseSha256":"988fcc5eb76738c83a44b5d15d09648685fb0342fa638f391f978f17a376b06d","audit":{"verdict":"pass","basis":"carried_forward"}},{"id":"arber-2022-blood-140-1200-C0084","shortId":"C0084","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["ANKRD26","ETV6","RUNX1"],"diseases":["MDS"],"ancestors":[],"locator":"Hematologic neoplasms with germline predisposition; Table 24","secondary":null,"text":"In germline RUNX1-, ANKRD26-, or ETV6-associated constitutional platelet disorders, marrow megakaryocytic dysplasia can be present with isolated thrombocytopenia in the absence of MDS.","baseSha256":"e8fc96faf1ae1846f605ea2c058ee5ee9a382a4448e18b15a39e6d352392e236","audit":{"verdict":"pass","basis":"carried_forward"}},{"id":"arber-2022-blood-140-1200-C0085","shortId":"C0085","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["MDS"],"ancestors":[],"locator":"Hematologic neoplasms with germline predisposition; diagnosis of MDS in germline predisposition","secondary":null,"text":"When assessing MDS in patients with germline predisposition, baseline dyspoietic bone-marrow changes can be present even in the absence of a myeloid malignancy.","baseSha256":"898971f7d8d541a6dc08367421d9fa3389fdd628e2dc42ee8b8373f576c9cedb","audit":{"verdict":"pass","basis":"carried_forward"}},{"id":"arber-2022-blood-140-1200-C0086","shortId":"C0086","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["MDS"],"ancestors":[],"locator":"Hematologic neoplasms with germline predisposition; diagnosis of MDS in germline predisposition","secondary":null,"text":"In patients with germline predisposition, development of MDS is generally associated with new or progressive cytopenia, often with rising marrow cellularity, overt multilineage dysplasia, increased blasts, and/or acquired pathogenic genetic abnormalities.","baseSha256":"5167b729273149f6d6f5ded3cde4cdf97dcf6fbddaaaeb5a6ca37642412e45c0","audit":{"verdict":"pass","basis":"carried_forward"}},{"id":"arber-2022-blood-140-1200-C0087","shortId":"C0087","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["SF3B1","TP53"],"diseases":["MDS"],"ancestors":[],"locator":"Hematologic neoplasms with germline predisposition; diagnosis of MDS in germline predisposition","secondary":null,"text":"In a patient with germline predisposition, emergence of del(5q), -7/del(7q), complex karyotype, multihit TP53 mutation VAF >10%, or SF3B1 mutation VAF >10% is considered MDS-defining.","baseSha256":"463b3dcf61490543895632fb311156609f650f853d7947cb105a7ee4bcc6e23f","audit":{"verdict":"pass","basis":"carried_forward"}},{"id":"arber-2022-blood-140-1200-C0088","shortId":"C0088","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["TP53"],"diseases":["MDS"],"ancestors":[],"locator":"Hematologic neoplasms with germline predisposition; diagnosis of MDS in germline predisposition","secondary":null,"text":"In Shwachman-Diamond syndrome, a small stable clone with monoallelic TP53 mutation alone Sha256":"a6319cdf4c140f294b80f91415ee6850fd964849c2b01db1f7a891654d66a22e","audit":{"verdict":"pass","basis":"carried_forward"}},{"id":"arber-2022-blood-140-1200-C0172","shortId":"C0172","paper":"arber-2022-blood-140-1200","category":"treatment","tier":"restated secondary","genes":["TP53"],"diseases":["MDS","MDS/AML","AML"],"ancestors":[],"locator":"Premalignant clonal cytopenias and MDS; myeloid neoplasms with mutated TP53","secondary":null,"text":"The ICC groups TP53-mutated MDS, MDS/AML, and AML because their similarly aggressive behavior irrespective of blast percentage is stated to warrant a more unified treatment strategy across the blast spectrum.","baseSha256":"aeacc1344a0f6ff28a30f894c4ad178ada8418894d0a4fcccf8d576580c3b869","audit":{"verdict":"pass","basis":"carried_forward"}},{"id":"arber-2022-blood-140-1200-C0173","shortId":"C0173","paper":"arber-2022-blood-140-1200","category":"treatment","tier":"restated secondary","genes":["ABL1","BCR"],"diseases":["B-ALL"],"ancestors":["lymphoid neoplasm","acute lymphoblastic leukaemia/lymphoma","B-cell lymphoid neoplasm","precursor B-cell neoplasm"],"locator":"B-ALL/T-ALL; BCR::ABL1-like B-ALL","secondary":null,"text":"BCR::ABL1-like B-ALL with an ABL-class fusion has a distinctive response pattern to ABL1-class tyrosine kinase inhibitors, making recognition of this subgroup treatment-relevant.","baseSha256":"b7cb1c8927b8d9501aa154f47b7718365d522fabfe46ed2d69813afa7aebdd1b","audit":{"verdict":"pass","basis":"carried_forward"}},{"id":"arber-2022-blood-140-1200-C0178","shortId":"C0178","paper":"arber-2022-blood-140-1200","category":"biomarker","tier":"guideline criterion","genes":["JAK2"],"diseases":["PV"],"ancestors":["MPN"],"locator":"Myeloproliferative neoplasms; PV; Table 3","secondary":null,"text":"For suspected polycythemia vera, the ICC recommends highly sensitive JAK2 V617F testing (<1% sensitivity); if negative, noncanonical or atypical JAK2 mutations in exons 12-15 should be sought.","baseSha256":"73a4e3698019893e944598b2a22bd2302f7f2e0b4ffda5d558097931d63a038b","audit":{"verdict":"pass","basis":"carried_forward"}},{"id":"arber-2022-blood-140-1200-C0179","shortId":"C0179","paper":"arber-2022-blood-140-1200","category":"biomarker","tier":"restated secondary","genes":["ABL1","BCR","CALR","JAK2","MPL"],"diseases":["MPN"],"ancestors":[],"locator":"Myeloproliferative neoplasms; MPN driver mutations","secondary":null,"text":"In BCR::ABL1-negative MPN, a JAK2 V617F VAF <1% should prompt a search for coexisting canonical CALR and MPL mutations.","baseSha256":"3ef68152ae3e7f312604ba6c2dccece34fdcf2b3458b8ea03a0e575b9476d39c","audit":{"verdict":"pass","basis":"carried_forward"}},{"id":"arber-2022-blood-140-1200-C0180","shortId":"C0180","paper":"arber-2022-blood-140-1200","category":"biomarker","tier":"guideline criterion","genes":["CALR","JAK2","MPL"],"diseases":["ET"],"ancestors":["MPN"],"locator":"Myeloproliferative neoplasms; essential thrombocythemia; Table 4","secondary":null,"text":"For suspected essential thrombocythemia, the ICC recommends highly sensitive assays for JAK2 V617F (<1% sensitivity) and CALR/MPL (1%-3% sensitivity), with consideration of noncanonical JAK2 and MPL mutations when canonical testing is negative.","baseSha256":"4191bc2457c484f60fbe5d321251d088307c143440272fb17e8914f7f6a4329a","audit":{"verdict":"pass","basis":"carried_forward"}},{"id":"arber-2022-blood-140-1200-C0181","shortId":"C0181","paper":"arber-2022-blood-140-1200","category":"biomarker","tier":"guideline criterion","genes":["CALR","JAK2","MPL"],"diseases":["PMF"],"ancestors":["MPN"],"locator":"Myeloproliferative neoplasms; primary myelofibrosis; Table 5","secondary":null,"text":"For suspected primary myelofibrosis, the ICC recommends highly sensitive assays for JAK2 V617F (<1% sensitivity) and CALR/MPL (1%-3% sensitivity), with consideration of noncanonical JAK2 and MPL mutations when canonical testing is negative.","baseSha256":"bcc67fb5b3db13bed4c3a258ea1a83923c7132270fd8cb1f438c536f16f30c6c","audit":{"verdict":"pass","basis":"carried_forward"}},{"id":"arber-2022-blood-140-1200-C0182","shortId":"C0182","paper":"arber-2022-blood-140-1200","category":"biomarker","tier":"guideline criterion","genes":["CALR","JAK2","MPL"],"diseases":["MPN-U"],"ancestors":["MPN"],"locator":"Myeloproliferative neoplasms; MPN-U; Table 9 footnote","secondary":null,"text":"For suspected MPN-U, the ICC recommends highly sensitive JAK2 V617F testing with sensitivity <1% and CALR/MPL testing with sensitivity 1%-3%; when canonical testing is negative, noncanonical JAK2 and MPL mutations should be considered.","baseSha256":"bb91e745fb216e7c97436393ee1df46885ccd25a301b1e442b89042d18b17c40","audit":{"verdict":"pass","basis":"carried_forward"}},{"id":"arber-2022-blood-140-1200-C0184","shortId":"C0184","paper":"arber-2022-blood-140-1200","category":"biomarker","tier":"guideline criterion","genes":["KIT"],"diseases":["mastocytosis"],"ancestors":[],"locator":"Mastocytosis; Table 11 footnote","secondary":null,"text":"In suspected systemic mastocytosis without a KIT mutation, particularly when eosinophilia is present, the ICC requires exclusion of tyrosine-kinase gene fusions associated with myeloid/lymphoid neoplasm with eosinophilia.","baseSha256":"f843f87d5b76d41a7f00a8fd7ba4592eb51bf87855d3d9caaf9c26d2ee93895f","audit":{"verdict":"pass","basis":"carried_forward"}},{"id":"arber-2022-blood-140-1200-C0185","shortId":"C0185","paper":"arber-2022-blood-140-1200","category":"biomarker","tier":"guideline criterion","genes":["KIT"],"diseases":["mastocytosis"],"ancestors":[],"locator":"Mastocytosis; Table 11","secondary":null,"text":"In suspected systemic mastocytosis, high-sensitivity PCR is recommended for KIT D816V; if negative, testing for other KIT mutation variants is strongly recommended.","baseSha256":"29a3214e169a04c3f8de161c41e4ef7341068c7d3a81d9b7746ed0304159d5a7","audit":{"verdict":"pass","basis":"carried_forward"}},{"id":"arber-2022-blood-140-1200-C0186","shortId":"C0186","paper" rs":[],"locator":"Table 1, lines 191-197","secondary":null,"text":"Constitutional mismatch repair deficiency associated with MLH1, MSH2, MSH6, PMS2, or EPCAM can include café-au-lait spots, brain tumours, colorectal cancer, osteosarcoma and other solid tumours.","baseSha256":"d934e3c97270f55aa3d638a375bad19f687a489456077d99f2a89b17c85b4e90","audit":{"verdict":"pass","basis":"phase3"}},{"id":"baliakas-2019-operational-germline-testing-C0057","shortId":"C0057","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"restated secondary","genes":["BLM"],"diseases":[],"ancestors":[],"locator":"Table 1, line 199","secondary":null,"text":"According to the Nordic 2019 guidelines, germline BLM Bloom syndrome is associated with ALL, AML/MDS and lymphoma and has a reported lifetime myeloid-malignancy risk of approximately 15%.","baseSha256":"fc61f714105fce0ccb484106c686a439182b0b9b2c4c4698b6fadb3502c239fd","audit":{"verdict":"pass","basis":"phase3"}},{"id":"baliakas-2019-operational-germline-testing-C0058","shortId":"C0058","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"restated secondary","genes":["BLM"],"diseases":[],"ancestors":[],"locator":"Table 1, line 199","secondary":null,"text":"Germline BLM Bloom syndrome can include growth deficiency, photosensitive skin changes, immunodeficiency, early-onset diabetes, microcephaly, a high-pitched voice, hypogonadism and risk of other cancers.","baseSha256":"cee9ec2ea785b41e7aec725ec237e36c12d8232f6e065b913f9067353fa0d4b2","audit":{"verdict":"pass","basis":"phase3"}},{"id":"baliakas-2019-operational-germline-testing-C0059","shortId":"C0059","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"restated secondary","genes":["LIG4"],"diseases":[],"ancestors":[],"locator":"Table 1, lines 201-203","secondary":null,"text":"Germline LIG4 syndrome is listed as associated with MDS, with the risk described as rare.","baseSha256":"ad1bdfa99d5d51a7e40cf33
