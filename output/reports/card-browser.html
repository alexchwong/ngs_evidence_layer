ording to MIPSS70+ Version 2.0, in patients aged ≤70 years with primary myelofibrosis, absence of a CALR type 1/like mutation is associated with inferior overall survival."}]};

const CATEGORY_COLOURS = {
  diagnosis:"var(--cat-diagnosis)", prognosis:"var(--cat-prognosis)",
  treatment:"var(--cat-treatment)", biomarker:"var(--cat-biomarker)",
  germline:"var(--cat-germline)"
};

const paperName = {};
const paperByKey = {};
DATA.papers.forEach(p => { paperName[p.key] = p.nickname; paperByKey[p.key] = p; });
if (DATA.full) document.body.classList.add("full-mode");

const state = { paper:new Set(), disease:new Set(), gene:new Set(), category:new Set(), query:"", selected:null };
const facetSearch = { paper:"", disease:"", gene:"", category:"" };

const FACETS = [
  { key:"category", title:"Category",  field:c => [c.category], searchable:false, swatch:true },
  { key:"paper",    title:"Paper",     field:c => [c.paper],    searchable:true,  labelOf:k => paperName[k] || k },
  { key:"disease",  title:"Disease",   field:c => c.diseases,   searchable:true },
  { key:"gene",     title:"Gene",      field:c => c.genes,      searchable:true }
];

function matches(card, skip){
  for (const f of FACETS){
    if (f.key === skip) continue;
    const chosen = state[f.key];
    if (!chosen.size) continue;
    if (!f.field(card).some(v => chosen.has(v))) return false;
  }
  if (state.query && !skip){
    if (!card.text.toLowerCase().includes(state.query)) return false;
  }
  return true;
}

function visibleCards(){
  return DATA.cards.filter(c => matches(c, null));
}

function countsFor(facet){
  const tally = new Map();
  for (const card of DATA.cards){
    if (!matches(card, facet.key)) continue;
    if (state.query && !card.text.toLowerCase().includes(state.query)) continue;
    for (const value of facet.field(card)){
      if (!value) continue;
      tally.set(value, (tally.get(value) || 0) + 1);
    }
  }
  const all = new Set(tally.keys());
  state[facet.key].forEach(v => { if (!all.has(v)) tally.set(v, 0); });
  return tally;
}

function buildRail(){
  const rail = document.getElementById("rail");
  rail.innerHTML = "";
  for (const facet of FACETS){
    const tally = countsFor(facet);
    let entries = [...tally.entries()];
    if (facet.key === "paper"){
      entries.sort((a,b) => (facet.labelOf(a[0])).localeCompare(facet.labelOf(b[0])));
    } else if (facet.key === "category"){
      entries.sort((a,b) => b[1] - a[1] || a[0].localeCompare(b[0]));
    } else {
      entries.sort((a,b) => a[0].localeCompare(b[0], undefined, {numeric:true}));
    }
    const needle = facetSearch[facet.key].toLowerCase();
    if (needle){
      entries = entries.filter(([value]) => {
        const label = facet.labelOf ? facet.labelOf(value) : value;
        return label.toLowerCase().includes(needle) || state[facet.key].has(value);
      });
    }

    const box = document.createElement("section");
    box.className = "facet" + (state[facet.key].size ? " active" : "");

    const head = document.createElement("h2");
    head.textContent = facet.title;
    const clear = document.createElement("button");
    clear.type = "button";
    clear.className = "clear";
    clear.textContent = "clear";
    clear.addEventListener("click", () => { state[facet.key].clear(); render(); });
    head.appendChild(clear);
    box.appendChild(head);

    if (facet.searchable){
      const input = document.createElement("input");
      input.className = "facet-search";
      input.type = "search";
      input.placeholder = "Filter " + facet.title.toLowerCase() + "s";
      input.setAttribute("aria-label", "Filter " + facet.title.toLowerCase() + " list");
      input.value = facetSearch[facet.key];
      input.addEventListener("input", event => {
        facetSearch[facet.key] = event.target.value;
        render({ keepFocus: facet.key });
      });
      box.appendChild(input);
    }

    const list = document.createElement("ul");
    list.className = "options" + (entries.length <= 8 ? " short" : "");
    for (const [value, count] of entries){
      const item = document.createElement("li");
      const button = document.createElement("button");
      const on = state[facet.key].has(value);
      button.type = "button";
      button.className = "opt";
      button.setAttribute("aria-pressed", on ? "true" : "false");
      if (!count && !on) button.disabled = true;

      const tick = document.createElement("span");
      tick.className = "tick";
      tick.textContent = on ? "\u2715" : "";
      tick.setAttribute("aria-hidden", "true");
      button.appendChild(tick);

      if (facet.swatch){
        const dot = document.createElement("span");
        dot.className = "swatch";
        dot.style.background = CATEGORY_COLOURS[value] || "var(--muted)";
        button.appendChild(dot);
      }

      const label = document.createElement("span");
      label.className = "label";
      label.textContent = facet.labelOf ? facet.labelOf(value) : value;
      button.appendChild(label);

      const num = document.createElement("span");
      num.className = "count";
      num.textContent = count;
      button.appendChild(num);

      button.addEventListener("click", () => {
        const set = state[facet.key];
        if (set.has(value)) set.delete(value); else set.add(value);
        render();
      });
      item.appendChild(button);
      list.appendChild(item);
    }
    if (!entries.length){
      const item = document.createElement("li");
      item.className = "tally";
      item.style.padding = "4px";
      item.textContent = "No matches in this list.";
      list.appendChild(item);
    }
    box.appendChild(list);
    rail.appendChild(box);
  }
}

function highlight(text, needle){
  if (!needle) return document.createTextNode(text);
  const fragment = document.createDocumentFragment();
  const lower = text.toLowerCase();
  let from = 0;
  let at = lower.indexOf(needle, from);
  while (at !== -1){
    fragment.appendChild(document.createTextNode(text.slice(from, at)));
    const mark = document.createElement("mark");
    mark.textContent = text.slice(at, at + needle.length);
    fragment.appendChild(mark);
    from = at + needle.length;
    at = lower.indexOf(needle, from);
  }
  fragment.appendChild(document.createTextNode(text.slice(from)));
  return fragment;
}

function textOrDash(value){
  if (value === null || value === undefined || value === "") return "—";
  if (Array.isArray(value)) return value.length ? value.join(", ") : "—";
  if (typeof value === "object") return JSON.stringify(value);
  return String(value);
}

function addMeta(grid, label, value){
  const dt = document.createElement("dt");
  dt.textContent = label;
  const dd = document.createElement("dd");
  dd.textContent = textOrDash(value);
  grid.append(dt, dd);
}

function detailSection(title){
  const section = document.createElement("section");
  section.className = "detail-section";
  const head = document.createElement("h2");
  head.textContent = title;
  section.appendChild(head);
  return section;
}

function closeDetail(){
  state.selected = null;
  document.body.classList.remove("detail-open");
  document.getElementById("detail").innerHTML = "";
  document.querySelectorAll("li.card.selected").forEach(el => el.classList.remove("selected"));
}

function buildDetail(card){
  if (!DATA.full || !card || !card.details) return;
  state.selected = card.id;
  document.body.classList.add("detail-open");
  const pane = document.getElementById("detail");
  pane.innerHTML = "";

  const paper = paperByKey[card.paper];
  const exact = card.details.card || {};
  const evidence = card.details.evidence || {};
  const paperDetails = (paper && paper.details) || {};

  const head = document.createElement("div");
  head.className = "detail-head";
  const id = document.createElement("div");
  id.className = "detail-id";
  id.textContent = card.id;
  const close = document.createElement("button");
  close.type = "button";
  close.className = "detail-close";
  close.textContent = "Close";
  close.setAttribute("aria-label", "Close card details");
  close.addEventListener("click", closeDetail);
  head.append(id, close);
  pane.appendChild(head);

  const interpretation = detailSection("Interpretation");
  const text = document.createElement("p");
  text.className = "detail-interpretation";
  text.textContent = exact.interpretation || card.text;
  interpretation.appendChild(text);
  pane.appendChild(interpretation);

  const cardMeta = detailSection("Card");
  const grid = document.createElement("dl");
  grid.className = "meta-grid";
  addMeta(grid, "Category", exact.category);
  addMeta(grid, "Evidence tier", exact.evidence_tier);
  addMeta(grid, "Genes", exact.genes);
  addMeta(grid, "Diseases", exact.diseases);
  addMeta(grid, "Disease ancestors", exact.disease_ancestors);
  addMeta(grid, "Locator", exact.locator);
  if (exact.secondary_citation){
    addMeta(grid, "Secondary citation", exact.secondary_citation.display || exact.secondary_citation);
  }
  cardMeta.appendChild(grid);
  pane.appendChild(cardMeta);

  const ev = detailSection("Evidence");
  const evMeta = document.createElement("dl");
  evMeta.className = "meta-grid";
  addMeta(evMeta, "Evidence type", evidence.evidence_type);
  ev.appendChild(evMeta);
  for (const fragment of (evidence.fragments || [])){
    const box = document.createElement("div");
    box.className = "evidence-fragment";
    const label = document.createElement("div");
    label.className = "fragment-label";
    label.textContent = [fragment.fragment_id, fragment.role, fragment.locator].filter(Boolean).join(" · ");
    const quote = document.createElement("blockquote");
    quote.textContent = fragment.quote || "";
    box.append(label, quote);
    ev.appendChild(box);
  }
  pane.appendChild(ev);

  if (evidence.support_map){
    const support = detailSection("Support map");
    const list = document.createElement("ul");
    list.className = "support-list";
    for (const [role, fragments] of Object.entries(evidence.support_map)){
      const item = document.createElement("li");
      item.textContent = role + " → " + textOrDash(fragments);
      list.appendChild(item);
    }
    support.appendChild(list);
    pane.appendChild(support);
  }

  if (evidence.table_relations && evidence.table_relations.length){
    const relations = detailSection("Table relations");
    const list = document.createElement("ul");
    list.className = "support-list";
    evidence.table_relations.forEach((relation, index) => {
      const item = document.createElement("li");
      const bits = [
        "value " + textOrDash(relation.value_fragment_id),
        "headers " + textOrDash(relation.header_fragment_ids),
        "qualifiers " + textOrDash(relation.qualifier_fragment_ids)
      ];
      item.textContent = (index + 1) + ". " + bits.join(" · ");
      list.appendChild(item);
    });
    relations.appendChild(list);
    pane.appendChild(relations);
  }

  const pub = detailSection("Publication");
  const citation = document.createElement("p");
  citation.className = "detail-citation";
  citation.textContent = paper.display || paper.nickname || paper.key;
  pub.appendChild(citation);
  const doc = paperDetails.document || {};
  const pubGrid = document.createElement("dl");
  pubGrid.className = "meta-grid";
  addMeta(pubGrid, "Publication key", doc.publication_key || paper.key);
  addMeta(pubGrid, "Nickname", doc.paper_nickname || paper.nickname);
  addMeta(pubGrid, "Publication type", doc.publication_type || paper.type);
  addMeta(pubGrid, "Extraction date", doc.extraction_date);
  addMeta(pubGrid, "Extraction model", doc.extraction_model);
  addMeta(pubGrid, "Genes covered", doc.genes_covered);
  addMeta(pubGrid, "Diseases covered", doc.diseases_covered);
  addMeta(pubGrid, "Census entries", doc.census_entries);
  pub.appendChild(pubGrid);
  pane.appendChild(pub);

  const source = paperDetails.source || {};
  const provenance = detailSection("Source & acceptance");
  const sourceGrid = document.createElement("dl");
  sourceGrid.className = "meta-grid";
  addMeta(sourceGrid, "Input ID", source.input_id);
  addMeta(sourceGrid, "Source filename", source.source_filename);
  addMeta(sourceGrid, "Acceptance path", source.acceptance_path);
  const accepted = paperDetails.accepted_package || {};
  addMeta(sourceGrid, "Accepted at", accepted.accepted_at);
  addMeta(sourceGrid, "Accepted in version", accepted.accepted_in_version);
  addMeta(sourceGrid, "Latest version", accepted.latest_version || accepted.accepted_in_version);
  provenance.appendChild(sourceGrid);
  pane.appendChild(provenance);

  const raw = document.createElement("details");
  raw.className = "raw";
  const summary = document.createElement("summary");
  summary.textContent = "Raw record / provenance";
  const pre = document.createElement("pre");
  pre.className = "raw-json";
  pre.textContent = JSON.stringify({card: exact, evidence, paper: paperDetails}, null, 2);
  raw.append(summary, pre);
  pane.appendChild(raw);

  pane.scrollTop = 0;
  document.querySelectorAll("li.card").forEach(el => {
    el.classList.toggle("selected", el.dataset.cardId === card.id);
  });
}

function buildCards(){
  const list = document.getElementById("cards");
  const rows = visibleCards();
  list.innerHTML = "";

  document.getElementById("tally").innerHTML =
    "<b>" + rows.length + "</b> of " + DATA.cards.length + " cards";

  if (!rows.length){
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.innerHTML = "<h3>Nothing matches these filters</h3>" +
      "<p>Remove a filter, or clear all of them and start from a single gene or paper.</p>";
    list.appendChild(empty);
    return;
  }

  const chunk = document.createDocumentFragment();
  for (const card of rows){
    const item = document.createElement("li");
    item.className = "card" + (state.selected === card.id ? " selected" : "");
    item.dataset.cardId = card.id;
    item.style.setProperty("--spine", CATEGORY_COLOURS[card.category] || "var(--rule)");
    if (DATA.full){
      item.tabIndex = 0;
      item.setAttribute("role", "button");
      item.setAttribute("aria-label", "Open full details for " + card.id);
      item.addEventListener("click", () => buildDetail(card));
      item.addEventListener("keydown", event => {
        if (event.key === "Enter" || event.key === " "){
          event.preventDefault();
          buildDetail(card);
        }
      });
    }

    const cid = document.createElement("span");
    cid.className = "cid";
    cid.textContent = card.id;
    item.appendChild(cid);

    const para = document.createElement("p");
    para.appendChild(highlight(card.text, state.query));
    item.appendChild(para);

    chunk.appendChild(item);
  }
  list.appendChild(chunk);
  if (DATA.full && state.selected && !rows.some(card => card.id === state.selected)) closeDetail();
}

function render(options){
  const keep = options && options.keepFocus;
  buildRail();
  buildCards();
  if (keep){
    const facetIndex = FACETS.findIndex(f => f.key === keep);
    const input = document.querySelectorAll(".facet")[facetIndex].querySelector(".facet-search");
    if (input){
      input.focus();
      input.setSelectionRange(input.value.length, input.value.length);
    }
  }
}

document.getElementById("provenance").textContent =
  "corpus " + DATA.corpusVersion + " \u00b7 " + DATA.cards.length + " cards \u00b7 " +
  DATA.papers.length + " papers" + (DATA.full ? " · full evidence view" : "");

document.getElementById("textsearch").addEventListener("input", event => {
  state.query = event.target.value.trim().toLowerCase();
  buildRail();
  buildCards();
});

document.getElementById("reset").addEventListener("click", () => {
  FACETS.forEach(f => { state[f.key].clear(); facetSearch[f.key] = ""; });
  state.query = "";
  document.getElementById("textsearch").value = "";
  render();
});

const railToggle = document.getElementById("railtoggle");
railToggle.addEventListener("click", () => {
  const rail = document.getElementById("rail");
  const open = rail.hasAttribute("hidden");
  if (open) rail.removeAttribute("hidden"); else rail.setAttribute("hidden", "");
  railToggle.setAttribute("aria-expanded", open ? "true" : "false");
});
if (window.matchMedia("(max-width:900px)").matches){
  document.getElementById("rail").setAttribute("hidden", "");
}

render();
</script>
