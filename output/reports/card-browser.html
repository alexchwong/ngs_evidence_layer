id neoplasm testing and nomenclature","secondary":null,"text":"In TP53-mutated AML/MDS, findings supporting multihit TP53 status include TP53 cnLOH demonstrated by dedicated testing; loss of chromosome 17 or 17p; two or more TP53 mutations; or a single TP53 mutation with VAF >55% and sequencing coverage >200×. A TP53 VAF <55% does not exclude multihit disease.","baseSha256":"05cb0ca5b3ac4b168fb4a13c0fafc1171ffe478b6263418f7608bc4453f20db7","audit":{"verdict":"pass","basis":"phase3"}},{"id":"urrutia-2025-tp53-myeloid-C0003","shortId":"C0003","paper":"urrutia-2025-tp53-myeloid","category":"diagnosis","tier":"restated secondary","genes":["TP53"],"diseases":["AML","MDS"],"ancestors":[],"locator":"TP53 mutational status and the role of cnLOH","secondary":null,"text":"In TP53-mutated AML/MDS, complex karyotype may suggest multihit TP53 status but is an imperfect surrogate: some TP53-mutated cases with complex karyotype lack chromosome 17 deletion or TP53 cnLOH, whereas some cases with TP53 cnLOH have noncomplex karyotypes.","baseSha256":"0b56eeb882dfeb9c7874c66de3303ab3284067835015e939aebfb0fac047e501","audit":{"verdict":"pass","basis":"phase3"}},{"id":"urrutia-2025-tp53-myeloid-C0007","shortId":"C0007","paper":"urrutia-2025-tp53-myeloid","category":"diagnosis","tier":"restated secondary","genes":["TP53"],"diseases":["MDS"],"ancestors":[],"locator":"Societal classification of myeloid neoplasms with TP53 mutations, Figure 2","secondary":null,"text":"According to WHO 2022 as summarized by Urrutia et al., MDS with biallelic TP53 inactivation has <20% blasts and no history of cytotoxic or radiation therapy; biallelic TP53 inactivation is defined by two or more TP53 mutations, one TP53 mutation with chromosome 17/17p copy loss, or one TP53 mutation with TP53 cnLOH.","baseSha256":"3cc6dc4ef2eb32d1f857a199de03c72feabcde921ee838f8aa354aecbe71a706","audit":{"verdict":"pass","basis":"phase3"}},{"id":"urrutia-2025-tp53-myeloid-C0016","shortId":"C0016","paper":"urrutia-2025-tp53-myeloid","category":"prognosis","tier":"restated secondary","genes":["TP53"],"diseases":["AML"],"ancestors":[],"locator":"TP53 mutational status and the role of cnLOH","secondary":null,"text":"In TP53-mutated AML undergoing transplantation, complex karyotype is associated with inferior overall survival compared with absence of complex karyotype.","baseSha256":"8106e9bb3c2b877e87627f6e1edf1b6d7f47e1599dd981af35ebbf813140d3be","audit":{"verdict":"pass","basis":"phase3"}},{"id":"urrutia-2025-tp53-myeloid-C0022","shortId":"C0022","paper":"urrutia-2025-tp53-myeloid","category":"prognosis","tier":"restated secondary","genes":["TP53"],"diseases":["AML"],"ancestors":[],"locator":"Does TP53 mutation identity matter?","secondary":null,"text":"In TP53-mutated AML, specific TP53 mutation identity is not currently recommended for prognostication.","baseSha256":"ce668328132657dac91f5d4622eaf6efb733d519530c72bfcff5bc735f8a9df9","audit":{"verdict":"pass","basis":"phase4_adjudicated"}},{"id":"weeks-2023-nejm-evidence-2-na-C0001","shortId":"C0001","paper":"weeks-2023-nejm-evidence-2-na","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["CHIP"],"ancestors":[],"locator":"Introduction","secondary":null,"text":"Clonal hematopoiesis of indeterminate potential (CHIP) is defined as clonal hematopoiesis with somatic mutations detectable at a variant allele fraction (VAF) of 2% or greater in the absence of a diagnosed blood disorder or cytopenia.","baseSha256":"4ec9d40ee1efe06b408388a469bc5de1de71c72b8175dcee8d264e5d221a50fb","audit":{"verdict":"pass","basis":"phase3"}},{"id":"weeks-2023-nejm-evidence-2-na-C0002","shortId":"C0002","paper":"weeks-2023-nejm-evidence-2-na","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["CCUS"],"ancestors":[],"locator":"Introduction; CHIP AND CCUS DESIGNATIONS","secondary":null,"text":"Clonal cytopenia of undetermined significance (CCUS) is defined as clonal hematopoiesis with somatic mutations at a variant allele fraction (VAF) of 2% or greater in the presence of unexplained, persistent cytopenia.","baseSha256":"92fe2448f0e6f2080f9da24f8487c06c88d4e4d85e3d5b77c586c9e3ada66882","audit":{"verdict":"pass","basis":"phase3"}},{"id":"weeks-2023-nejm-evidence-2-na-C0003","shortId":"C0003","paper":"weeks-2023-nejm-evidence-2-na","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["CCUS"],"ancestors":[],"locator":"CHIP AND CCUS DESIGNATIONS","secondary":null,"text":"For the WHO-based cytopenia criteria applied to clonal cytopenia of undetermined significance (CCUS) in this study, anemia is defined as hemoglobin below 13.0 g/dL in males or below 12.0 g/dL in females.","baseSha256":"051d523af5b3027eb54775faa47e0dd1c4257b8bfb4ae27b32ef538814f7d13b","audit":{"verdict":"pass","basis":"phase3"}},{"id":"weeks-2023-nejm-evidence-2-na-C0004","shortId":"C0004","paper":"weeks-2023-nejm-evidence-2-na","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["CCUS"],"ancestors":[],"locator":"CHIP AND CCUS DESIGNATIONS","secondary":null,"text":"For the WHO-based cytopenia criteria applied to clonal cytopenia of undetermined significance (CCUS) in this study, thrombocytopenia is defined as a platelet count below 150 × 10^9/L.","baseSha256":"e7a0a2a791f14f10204e685da94af592355f63af12d4e38a18b9a00613a1d8a2","audit":{"verdict":"pass","basis":"phase3"}},{"id":"weeks-2023-nejm-evidence-2-na-C0005","shortId":"C0005","paper":"weeks-2023-nejm-evidence-2-na","category":"diagnosis","tier":"restated secondary","genes":[],"diseases":["CCUS"],"ancestors":[],"locator":"CHIP AND CCUS DESIGNATIONS","secondary":null,"text":"For the WHO-based cytopenia criteria applied to clonal cytopenia of undetermined significance (CCUS) in this study, neutropenia is defined as an absolute neutrophil count below 1.8 × 10^9/L.","baseSha256":"929ea148139c26f058039481dd1f5ebf84b21b8e3209bb088ceeada72202ec11","audit":{"verdict":"pass","basis":"phase3"}},{"id":"weeks-2023-nejm-evidence-2-na-C0006", IP","CCUS"],"ancestors":[],"locator":"Discussion","secondary":null,"text":"In CHIP/CCUS, a single DNMT3A mutation identifies a particularly low-risk genotype for progression to myeloid neoplasm compared with other CHIP/CCUS genotypes.","baseSha256":"61aa99d247c6a5568363a99940e91db8a6a687178241715268b1d442ae695cbf","audit":{"verdict":"pass","basis":"phase3"}},{"id":"weeks-2023-nejm-evidence-2-na-C0010","shortId":"C0010","paper":"weeks-2023-nejm-evidence-2-na","category":"prognosis","tier":"univariable or descriptive","genes":["DNMT3A"],"diseases":["CHIP","CCUS"],"ancestors":[],"locator":"GENOTYPE-SPECIFIC RISK OF INCIDENT MN","secondary":null,"text":"DNMT3A-mutant CHIP/CCUS is associated with higher risk of myeloid neoplasm than individuals without CHIP/CCUS.","baseSha256":"d464a787616f41c28aa2b7c56f90562fe2eaf99b8e942f496ff7d48ccfa5d757","audit":{"verdict":"pass","basis":"phase3"}},{"id":"weeks-2023-nejm-evidence-2-na-C0016","shortId":"C0016","paper":"weeks-2023-nejm-evidence-2-na","category":"prognosis","tier":"restated secondary","genes":["TP53"],"diseases":["CHIP","CCUS"],"ancestors":[],"locator":"Discussion","secondary":null,"text":"In TP53-mutant CHIP/CCUS, myeloid-neoplasm risk is probably heterogeneous and may be influenced by clonal selection pressures such as chemotherapy, clone size, allelic state, and clonal complexity.","baseSha256":"fbbb27b025c74fd099a1edc72d89cafaf7cb75cd679e9725e218a1fc08dfdca7","audit":{"verdict":"pass","basis":"phase3"}},{"id":"weeks-2023-nejm-evidence-2-na-C0017","shortId":"C0017","paper":"weeks-2023-nejm-evidence-2-na","category":"prognosis","tier":"univariable or descriptive","genes":["IDH1","FLT3"],"diseases":["CHIP","CCUS"],"ancestors":[],"locator":"GENOTYPE-SPECIFIC RISK OF INCIDENT MN; Discussion","secondary":null,"text":"According to the CHRS framework, IDH1 and FLT3 mutations are classified as high-risk mutations for progression of CHIP or CCUS to myeloid neoplasm as members of the AML-like mutation group.","baseSha256":"a6 CUL.scope = normaliseScope((DATA.cul && DATA.cul.scope) || null);

/* --------------------------------------------------------------------- scope */

/* Hybrid scope model. Paper and category rules stay rules: they are compact and
   they keep applying to cards a later redo adds. Tickboxes only ever write
   card-level `exclude` entries on top of those rules. A card suppressed by a
   rule is shown locked, so a three-rule profile can never be silently expanded
   into a hundred literal card IDs. */

function normaliseDimension(value){
  const v = value || {};
  return { include: (v.include || []).slice(), exclude: (v.exclude || []).slice() };
}

function normaliseRule(value){
  const v = value || {};
  return {
    enabled: v.enabled === undefined ? true : !!v.enabled,
    categories: normaliseDimension(v.categories),
    genes: normaliseDimension(v.genes),
    cards: normaliseDimension(v.cards)
  };
}

function normaliseScope(value){
  const v = value || {};
  const papers = {};
  Object.keys(v.papers || {}).forEach(key => { papers[key] = normaliseRule(v.papers[key]); });
  return {
    enabled: v.enabled === undefined ? true : !!v.enabled,
    global: normaliseRule(v.global),
    papers: papers
  };
}

function dimensionAllows(dimension, values){
  const set = Array.isArray(values) ? values : [values];
  if (dimension.exclude.some(x => set.includes(x))) return false;
  if (dimension.include.length && !dimension.include.some(x => set.includes(x))) return false;
  return true;
}

/* Mirrors scripts/core/corpus.py::_rule_allows so the browser and retrieval
   cannot disagree about what a profile reaches. */
function ruleAllows(view, rule){
  if (!rule.enabled) return false;
  if (!dimensionAllows(rule.categories, view.category)) return false;
  if (!dimensionAllows(rule.genes, (view.genes || []).map(g => g.toUpperCase()))) return false;
  if (!dimensionAllows(rule.cards, view.id)) return false;
  return true;
}

/* Why a card is out of scope, so the UI can lock a rule-derived exclusion and
   allow a card-level one to be toggled back. */
function scopeState(card){
  const view = effective(card);
  const scope = CUL.scope;
  if (!scope.enabled) return { included: false, locked: true, reason: "profile scope disabled" };

  const paper = scope.papers[card.paper];
  const byCard =
    scope.global.cards.exclude.includes(card.id) ||
    (paper && paper.cards.exclude.includes(card.id));

  const ruleOnly = Object.assign({}, scope.global, { cards: { include: [], exclude: [] } });
  let allowed = ruleAllows(view, ruleOnly);
  let reason = allowed ? "" : "global rule";
  if (allowed && paper){
    const paperRuleOnly = Object.assign({}, paper, { cards: { include: [], exclude: [] } });
    allowed = ruleAllows(view, paperRuleOnly);
    if (!allowed) reason = "rule on " + (paperName[card.paper] || card.paper);
  }
  if (!allowed) return { included: false, locked: true, reason: reason };
  if (byCard) return { included: false, locked: false, reason: "excluded card" };
  return { included: true, locked: false, reason: "" };
}

function setCardIncluded(id, included){
  const card = baseById[id];
  const paper = CUL.scope.papers[card.paper];
  const lists = [CUL.scope.global.cards];
  if (paper) lists.push(paper.cards);
  if (included){
    lists.forEach(list => {
      const at = list.exclude.indexOf(id);
      if (at !== -1) list.exclude.splice(at, 1);
    });
  } else if (!CUL.scope.global.cards.exclude.includes(id)) {
    CUL.scope.global.cards.exclude.push(id);
  }
  CUL.dirty = true;
}

function excludedCardIds(){
  const ids = new Set(CUL.scope.global.cards.exclude);
  Object.values(CUL.scope.papers).forEach(rule => rule.cards.exclude.forEach(id => ids.add(id)));
  return Array.from(ids).sort();
}

/* Offered when a bulk exclusion happens to be exactly one paper or one
   category: a rule stays compact and keeps applying to cards added later. */
function rulePromotion(cards){
  if (cards.length < 2) return null;
  const papers = new Set(cards.map(c => c.paper));
  const categories = new Set(cards.map(c => effective(c).category));
  if (papers.size === 1){
    const key = cards[0].paper;
    const inPaper = DATA.cards.filter(c => c.paper === key);
    if (categories.size === 1 && cards.length < inPaper.length){
      return { kind: "paper-category", paper: key, category: cards[0].category,
               label: 'exclude every "' + Array.from(categories)[0] + '" card from ' +
                      (paperName[key] || key) };
    }
    if (cards.length === inPaper.length){
      return { kind: "paper", paper: key, label: "exclude this whole paper" };
    }
  }
  if (categories.size === 1 && papers.size > 1){
    const category = Array.from(categories)[0];
    const all = DATA.cards.filter(c => effective(c).category === category);
    if (cards.length === all.length){
      return { kind: "category", category: category,
               label: 'exclude every "' + category + '" card corpus-wide' };
    }
  }
  return null;
}

function applyPromotion(promotion){
  if (promotion.kind === "category"){
    if (!CUL.scope.global.categories.exclude.includes(promotion.category)){
      CUL.scope.global.categories.exclude.push(promotion.category);
    }
  } else {
    const key = promotion.paper;
    const rule = CUL.scope.papers[key] || normaliseRule({});
    if (promotion.kind === "paper") rule.enabled = false;
    else if (!rule.categories.exclude.includes(promotion.category)){
      rule.categories.exclude.push(promotion.category);
    }
    CUL.scope.papers[key] = rule;
  }
  CUL.dirty = true;
}

/* ---------------------------------------------------------------- amendments */

function amendmentFor(id){ return CUL.amendments[id] || null; }

function effective(card){
  const a = amendmentFor(card.id);
  if (!a) return card;
  const out = Object.assign({}, card);
  if (a.interpretation !== undefined) out.text = a.interpretation;
  if (a.category !== undefined) out.category = a.category;
  if (a.evidence_tier !== undefined) out.tier = a.evidence_tier;
  if (a.genes !== undefined) out.genes = a.genes.slice();
  if (a.diseases !== undefined) out.diseases = a.diseases.slice();
  out.amended = true;
  out.amendedFields = AMENDABLE.filter(f => a[f] !== undefined);
  out.stale = !!a.stale;
  return out;
}

function changedFields(id){
  const a = amendmentFor(id);
  if (!a) return [];
  const base = baseById[id];
  const map = { interpretation: "text", category: "category", evidence_tier: "tier",
                genes: "genes", diseases: "diseases" };
  return AMENDABLE.filter(f => {
    if (a[f] === undefined) return false;
    const b = base[map[f]];
    return Array.isArray(b) ? b.join("\u0000") !== a[f].join("\u0000") : b !== a[f];
  });
}

function setAmendment(id, field, value){
  const base = baseById[id];
  const map = { interpretation: "text", category: "category", evidence_tier: "tier",
                genes: "genes", diseases: "diseases" };
  const current = base[map[field]];
  const same = Array.isArray(current)
    ? current.join("\u0000") === (value || []).join("\u0000")
    : current === value;
  const entry = Object.assign({}, CUL.amendments[id] || { base_sha256: base.baseSha256 });
  if (same) delete entry[field]; else entry[field] = value;
  entry.base_sha256 = base.baseSha256;
  entry.stale = false;
  const remaining = AMENDABLE.filter(f => entry[f] !== undefined);
  if (!remaining.length) delete CUL.amendments[id];
  else CUL.amendments[id] = entry;
  CUL.dirty = true;
  updateProfileBar();
}

function revertCard(id){
  delete CUL.amendments[id];
  CUL.dirty = true;
  updateProfileBar();
}

/* ------------------------------------------------------------------- search */

/* Free text, not just keywords. Supports:
     bare terms          all must appear (prefix match)
     "quoted phrase"     literal substring
     -term               exclusion
     gene:TP53           field-scoped, also disease: paper: cat: tier: id:
   Terms are scored by frequency and field weight so the closest cards sort
   first; 789 cards are scanned directly, which is faster than shipping and
   parsing an inverted index. */

const FIELD_KEYS = { gene:"genes", genes:"genes", disease:"diseases", diseases:"diseases",
                     paper:"paper", cat:"category", category:"category",
                     tier:"tier", id:"id", locator:"locator" };

function parseQuery(raw){
  const terms = [];
  const re = /(-?)(?:([a-z]+):)?(?:"([^"]*)"|(\S+))/gi;
  let m;
  while ((m = re.exec(raw)) !== null){
    const text = (m[3] !== undefined ? m[3] : m[4] || "").toLowerCase().trim();
    if (!text) continue;
    terms.push({
      negate: m[1] === "-",
      field: m[2] ? FIELD_KEYS[m[2].toLowerCase()] || null : null,
      phrase: m[3] !== undefined,
      text: text
    });
  }
  return terms;
}

function haystack(card){
  const paper = paperByKey[card.paper] || {};
  return {
    text: (card.text || "").toLowerCase(),
    locator: (card.locator || "").toLowerCase(),
    genes: (card.genes || []).join(" ").toLowerCase(),
    diseases: (card.diseases || []).concat(card.ancestors || []).join(" ").toLowerCase(),
    category: (card.category || "").toLowerCase(),
    tier: (card.tier || "").toLowerCase(),
    id: (card.id || "").toLowerCase(),
    paper: ((paper.nickname || "") + " " + (paper.display || "") + " " + card.paper).toLowerCase()
  };
}

const WEIGHT = { text:1, locator:0.6, genes:2, diseases:2, category:1.5, tier:0.8, id:2, paper:1.2 };

function scoreCard(card, terms){
  if (!terms.length) return 0;
  const hay = haystack(card);
  let score = 0;
  for (const term of terms){
    const fields = term.field ? [term.field] : Object.keys(hay);
    let hits = 0;
    for (const field of fields){
      const value = hay[field] || "";
      if (!value) continue;
      let count = 0;
      if (term.phrase){
        let at = value.indexOf(term.text);
        while (at !== -1){ count++; at = value.indexOf(term.text, at + term.text.length); }
      } else {
        const re = new RegExp("(^|[^a-z0-9])" + term.text.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "g");
        count = (value.match(re) || []).length;
        if (!count && value.includes(term.text)) count = 0.5;
      }
      if (count) hits += count * (WEIGHT[field] || 1);
    }
    if (term.negate){ if (hits) return -1; continue; }
    if (!hits) return -1;
    score += 1 + Math.log(1 + hits);
  }
  return score;
}

/* --------------------------------------------------------------- clipboard */

function copyText(text, button){
  const done = () => {
    const original = button.textContent;
    button.textContent = "Copied";
    button.classList.add("copied");
    setTimeout(() => { button.textContent = original; button.classList.remove("copied"); }, 1200);
  };
  /* navigator.clipboard is unavailable on file:// in several browsers, so the
     textarea path is a real fallback rather than defensive decoration. */
  if (navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(done, () => legacyCopy(text, done));
  } else {
    legacyCopy(text, done);
  }
}

function legacyCopy(text, done){
  const area = document.createElement("textarea");
  area.value = text;
  area.setAttribute("readonly", "");
  area.style.position = "fixed";
  area.style.opacity = "0";
  document.body.appendChild(area);
  area.select();
  try { document.execCommand("copy"); done(); } catch (err) { window.prompt("Copy:", text); }
  document.body.removeChild(area);
}

function copyRow(card){
  const paper = paperByKey[card.paper] || {};
  const row = document.createElement("div");
  row.className = "copyrow";
  const buttons = [
    ["Copy citation", () => paper.display || paper.nickname || card.paper],
    ["DOI", () => paper.doi || ""]
  ];
  for (const [label, value] of buttons){
    const button = document.createElement("button");
    button.type = "button";
    button.className = "copybtn";
    button.textContent = label;
    button.addEventListener("click", event => {
      event.stopPropagation();
      const text = value();
      if (!text){ button.textContent = "None"; setTimeout(() => { button.textContent = label; }, 1200); return; }
      copyText(text, button);
    });
    row.appendChild(button);
  }
  return row;
}

/* ------------------------------------------------------------------ editing */

const VOCAB = DATA.vocabulary || { categories: [], evidenceTiers: [], diseases: [] };

function tokenList(value){
  return value.split(/[,\s]+/).map(x => x.trim()).filter(Boolean);
}

function displayList(values){
  return (values && values.length) ? values.join(", ") : "\u2014";
}

/* The corpus value is shown only once a field differs from it. Four permanent
   "corpus:" lines on every card would be noise on the cards nobody has touched,
   and the original is exactly what you want the moment one changes. */
function originalLine(text){
  const line = document.createElement("span");
  line.className = "wasline";
  line.textContent = "corpus: " + text;
  return line;
}

function labelled(text, field, changed, originalText){
  const wrap = document.createElement("label");
  wrap.className = "editlabel" + (changed ? " changed" : "");
  const span = document.createElement("span");
  span.textContent = text;
  wrap.appendChild(span);
  wrap.appendChild(field);
  if (changed && originalText !== undefined) wrap.appendChild(originalLine(originalText));
  return wrap;
}

function selectField(options, current, onChange){
  const select = document.createElement("select");
  select.className = "editfield";
  options.forEach(name => {
    const option = document.createElement("option");
    option.value = name;
    option.textContent = name;
    if (name === current) option.selected = true;
    select.appendChild(option);
  });
  if (current && !options.includes(current)){
    const option = document.createElement("option");
    option.value = current;
    option.textContent = current + " (not in vocabulary)";
    option.selected = true;
    select.insertBefore(option, select.firstChild);
  }
  select.addEventListener("change", () => onChange(select.value));
  return select;
}

/* Diseases are a closed 162-term vocabulary, but 634 of 789 cards carry exactly
   one term. A native multi-select at that size is unusable, so this is a token
   field: chips for what is selected, a filtering list to add. Validating against
   the vocabulary here means an invalid term cannot reach cul.py at all. */
function diseaseField(card, selected, onChange){
  const wrap = document.createElement("div");
  wrap.className = "tokenfield";

  const chips = document.createElement("div");
  chips.className = "chips";
  wrap.appendChild(chips);

  const search = document.createElement("input");
  search.type = "text";
  search.className = "editfield tokeninput";
  search.placeholder = "add disease\u2026";
  search.setAttribute("aria-label", "Add a disease to " + card.id);
  wrap.appendChild(search);

  const list = document.createElement("ul");
  list.className = "tokenlist";
  list.hidden = true;
  wrap.appendChild(list);

  let active = selected.slice();

  function commit(){
    onChange(active.slice());
    paint();
  }

  function paint(){
    chips.innerHTML = "";
    if (!active.length){
      const none = document.createElement("span");
      none.className = "chipnone";
      none.textContent = "none";
      chips.appendChild(none);
    }
    active.forEach(name => {
      const chip = document.createElement("span");
      chip.className = "chip";
      chip.textContent = name;
      const remove = document.createElement("button");
      remove.type = "button";
      remove.className = "chipx";
      remove.textContent = "\u00d7";
      remove.setAttribute("aria-label", "Remove " + name);
      remove.addEventListener("click", event => {
        event.stopPropagation();
        active = active.filter(x => x !== name);
        commit();
      });
      chip.appendChild(remove);
      chips.appendChild(chip);
    });
  }

  function options(){
    const needle = search.value.trim().toLowerCase();
    return VOCAB.diseases
      .filter(name => !active.includes(name))
      .filter(name => !needle || name.toLowerCase().includes(needle))
      .slice(0, 40);
  }

  function paintList(){
    const rows = options();
    list.innerHTML = "";
    list.hidden = !rows.length || document.activeElement !== search;
    rows.forEach(name => {
      const item = document.createElement("li");
      const button = document.createElement("button");
      button.type = "button";
      button.className = "tokenopt";
      button.textContent = name;
      button.addEventListener("mousedown", event => {
        event.preventDefault();
        active = active.concat([name]);
        search.value = "";
        commit();
        paintList();
      });
      item.appendChild(button);
      list.appendChild(item);
    });
  }

  search.addEventListener("input", paintList);
  search.addEventListener("focus", paintList);
  search.addEventListener("blur", () => { setTimeout(() => { list.hidden = true; }, 120); });
  search.addEventListener("keydown", event => {
    if (event.key === "Escape"){ search.value = ""; list.hidden = true; }
    if (event.key === "Enter"){
      event.preventDefault();
      const first = options()[0];
      if (first){ active = active.concat([first]); search.value = ""; commit(); paintList(); }
    }
  });

  paint();
  return wrap;
}

function editor(card){
  const base = baseById[card.id];
  const changed = changedFields(card.id);
  const box = document.createElement("div");
  box.className = "editor";

  /* Assertion on the left, classification on the right: the same split the
     report disclosure rule draws. */
  const columns = document.createElement("div");
  columns.className = "editcolumns";

  const left = document.createElement("div");
  left.className = "editmain";

  if (changed.includes("interpretation")){
    const original = document.createElement("div");
    original.className = "original";
    original.innerHTML = "<span class='origlabel'>Corpus interpretation</span>";
    const text = document.createElement("p");
    text.textContent = base.text;
    original.appendChild(text);
    left.appendChild(original);
  }

  const area = document.createElement("textarea");
  area.className = "editarea";
  area.rows = 6;
  area.value = card.text;
  area.setAttribute("aria-label", "Interpretation for " + card.id);
  area.addEventListener("input", () => setAmendment(card.id, "interpretation", area.value.trim()));
  area.addEventListener("change", () => renderAll());
  left.appendChild(area);
  columns.appendChild(left);

  const side = document.createElement("div");
  side.className = "editside";

  side.appendChild(labelled(
    "Category",
    selectField(VOCAB.categories, card.category, value => {
      setAmendment(card.id, "category", value);
      renderAll();
    }),
    changed.includes("category"), base.category
  ));

  side.appendChild(labelled(
    "Evidence tier",
    selectField(VOCAB.evidenceTiers, card.tier, value => {
      setAmendment(card.id, "evidence_tier", value);
      renderAll();
    }),
    changed.includes("evidence_tier"), base.tier
  ));

  const genes = document.createElement("input");
  genes.className = "editfield";
  genes.type = "text";
  genes.value = (card.genes || []).join(", ");
  genes.placeholder = "comma separated";
  genes.addEventListener("change", () => {
    setAmendment(card.id, "genes", tokenList(genes.value).map(x => x.toUpperCase()));
    renderAll();
  });
  side.appendChild(labelled("Genes", genes, changed.includes("genes"), displayList(base.genes)));

  side.appendChild(labelled(
    "Diseases",
    diseaseField(card, card.diseases || [], values => {
      setAmendment(card.id, "diseases", values);
      renderAll();
    }),
    changed.includes("diseases"), displayList(base.diseases)
  ));

  columns.appendChild(side);
  box.appendChild(columns);

  const actions = document.createElement("div");
  actions.className = "editactions";
  if (changed.length){
    const revert = document.createElement("button");
    revert.type = "button";
    revert.className = "revert";
    revert.textContent = "Revert to corpus";
    revert.addEventListener("click", () => { revertCard(card.id); renderAll(); });
    actions.appendChild(revert);
  }
  const note = document.createElement("span");
  note.className = "editnote";
  note.textContent = changed.length
    ? "Amended: " + changed.join(", ")
    : "No change; this card renders exactly as accepted.";
  actions.appendChild(note);
  box.appendChild(actions);
  return box;
}

/* ------------------------------------------------------------- profile bar */

function profileJSON(){
  const amendments = {};
  Object.keys(CUL.amendments).sort().forEach(id => {
    const entry = CUL.amendments[id];
    const out = { base_sha256: baseById[id].baseSha256, amended_at: new Date().toISOString() };
    AMENDABLE.forEach(f => { if (entry[f] !== undefined) out[f] = entry[f]; });
    amendments[id] = out;
  });
  return {
    schema_version: "1.0",
    profile: CUL.profile,
    description: CUL.description,
    authored_against_corpus_sha256: DATA.corpusSha256 || null,
    scope: CUL.scope,
    amendments: amendments
  };
}

function downloadProfile(){
  const blob = new Blob([JSON.stringify(profileJSON(), null, 2) + "\n"], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = CUL.profile + ".json";
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  CUL.dirty = false;
  updateProfileBar();
}

function updateProfileBar(){
  const bar = document.getElementById("profilebar");
  if (!bar) return;
  const count = Object.keys(CUL.amendments).length;
  const stale = Object.keys(CUL.amendments).filter(id => CUL.amendments[id].stale);
  bar.querySelector(".pcount").textContent =
    count + (count === 1 ? " amendment" : " amendments") + (CUL.dirty ? " (unsaved)" : "");
  const warn = bar.querySelector(".pstale");
  warn.textContent = stale.length ? stale.length + " stale" : "";
  warn.hidden = !stale.length;
}

function buildProfileBar(){
  const bar = document.createElement("div");
  bar.className = "profilebar";
  bar.id = "profilebar";

  /* Every profile in config/cul/ is embedded at build time, so switching does
     not need a rebuild or a file dialog. */
  const names = Object.keys(DATA.profiles || {});
  if (names.length){
    const pick = document.createElement("select");
    pick.className = "editfield pselect";
    pick.setAttribute("aria-label", "Load a profile");
    const blank = document.createElement("option");
    blank.value = "";
    blank.textContent = "load profile\u2026";
    pick.appendChild(blank);
    names.forEach(name => {
      const option = document.createElement("option");
      option.value = name;
      option.textContent = name;
      pick.appendChild(option);
    });
    pick.addEventListener("change", () => {
      if (!pick.value) return;
      if (CUL.dirty && !window.confirm("Discard unsaved changes and load " + pick.value + "?")){
        pick.value = "";
        return;
      }
      loadProfile(DATA.profiles[pick.value]);
      pick.value = "";
      renderAll();
    });
    bar.appendChild(pick);
  }

  const name = document.createElement("input");
  name.type = "text";
  name.className = "pname";
  name.value = CUL.profile;
  name.setAttribute("aria-label", "Profile name");
  name.addEventListener("change", () => {
    const value = name.value.trim();
    if (!/^[A-Za-z0-9][A-Za-z0-9._-]*$/.test(value)){ name.value = CUL.profile; return; }
    CUL.profile = value; CUL.dirty = true; updateProfileBar();
  });
  bar.appendChild(name);

  const count = document.createElement("span");
  count.className = "pcount";
  bar.appendChild(count);

  const stale = document.createElement("span");
  stale.className = "pstale";
  bar.appendChild(stale);

  const upload = document.createElement("label");
  upload.className = "pbtn";
  upload.textContent = "Open file";
  const file = document.createElement("input");
  file.type = "file";
  file.accept = "application/json,.json";
  file.className = "pfile";
  file.addEventListener("change", () => {
    const chosen = file.files && file.files[0];
    if (!chosen) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        loadProfile(JSON.parse(reader.result));
        renderAll();
      } catch (err) {
        window.alert("That file is not a valid CUL profile: " + err.message);
      }
      file.value = "";
    };
    reader.readAsText(chosen);
  });
  upload.appendChild(file);
  bar.appendChild(upload);

  const diff = document.createElement("button");
  diff.type = "button";
  diff.className = "pbtn";
  diff.textContent = "Review changes";
  diff.addEventListener("click", showChanges);
  bar.appendChild(diff);

  const download = document.createElement("button");
  download.type = "button";
  download.className = "pbtn primary";
  download.textContent = "Download profile";
  download.addEventListener("click", downloadProfile);
  bar.appendChild(download);

  const help = document.createElement("span");
  help.className = "phelp";
  help.textContent =
    "Downloads cannot overwrite files from disk. Install with: " +
    "python scripts/cul.py apply --from <downloaded file>";
  bar.appendChild(help);
  return bar;
}

function loadProfile(raw){
  CUL.profile = raw.profile || "custom";
  CUL.description = raw.description || "";
  CUL.scope = normaliseScope(raw.scope);
  CUL.amendments = {};
  Object.keys(raw.amendments || {}).forEach(id => {
    /* Amendments for cards this corpus does not contain are dropped rather than
       carried invisibly; cul.py would reject them anyway. */
    if (baseById[id]) CUL.amendments[id] = Object.assign({}, raw.amendments[id]);
  });
  CUL.selected = null;
  CUL.pending = null;
  CUL.dirty = false;
}

function modal(title){
  const existing = document.getElementById("culmodal");
  if (existing) existing.remove();
  const back = document.createElement("div");
  back.className = "modalback";
  back.id = "culmodal";
  const box = document.createElement("div");
  box.className = "modalbox";
  box.setAttribute("role", "dialog");
  box.setAttribute("aria-label", title);
  const head = document.createElement("div");
  head.className = "modalhead";
  const heading = document.createElement("h2");
  heading.textContent = title;
  head.appendChild(heading);
  const close = document.createElement("button");
  close.type = "button";
  close.className = "detail-close";
  close.textContent = "close";
  close.addEventListener("click", () => back.remove());
  head.appendChild(close);
  box.appendChild(head);
  back.addEventListener("click", event => { if (event.target === back) back.remove(); });
  back.appendChild(box);
  document.body.appendChild(back);

function section(parent, title){
  const wrap = document.createElement("div");
  wrap.className = "modalsection";

  wrap.appendChild(heading);
  parent.appendChild(wrap);

}

function showChanges(){
  const box = modal("Profile \u201c" + CUL.profile + "\u201d");

  const ruleKeys = Object.keys(CUL.scope.papers);
  const rules = section(box, "Retrieval rules");
  const globalCats = CUL.scope.global.categories;
  const globalGenes = CUL.scope.global.genes;
  const lines = [];
  if (!CUL.scope.enabled) lines.push("Scope disabled: no card is reachable.");
  if (globalCats.include.length) lines.push("Only these categories: " + globalCats.include.join(", "));
  if (globalCats.exclude.length) lines.push("Excluded categories: " + globalCats.exclude.join(", "));
  if (globalGenes.include.length) lines.push("Only these genes: " + globalGenes.include.join(", "));
  if (globalGenes.exclude.length) lines.push("Excluded genes: " + globalGenes.exclude.join(", "));
  ruleKeys.forEach(key => {
    const rule = CUL.scope.papers[key];
    const label = paperName[key] || key;
    if (!rule.enabled){ lines.push(label + ": whole paper excluded"); return; }
    if (rule.categories.include.length)
      lines.push(label + ": only " + rule.categories.include.join(", "));
    if (rule.categories.exclude.length)
      lines.push(label + ": excluding " + rule.categories.exclude.join(", "));
    if (rule.genes.exclude.length)
      lines.push(label + ": excluding genes " + rule.genes.exclude.join(", "));
  });
  if (!lines.length) lines.push("No rules; every card is reachable unless individually excluded.");
  lines.forEach(text => {
    const p = document.createElement("p");
    p.className = "modalline";
    p.textContent = text;
    rules.appendChild(p);
  });

  const excluded = excludedCardIds();
  const cardSection = section(box, "Individually excluded cards (" + excluded.length + ")");
  if (!excluded.length){
    const p = document.createElement("p");
    p.className = "modalline";
    p.textContent = "None.";
    cardSection.appendChild(p);
  } else {
    const byPaper = {};
    excluded.forEach(id => {
      const card = baseById[id];
      if (!card) return;
      (byPaper[card.paper] = byPaper[card.paper] || []).push(card.shortId);
    });
    Object.keys(byPaper).sort().forEach(key => {
      const p = document.createElement("p");
      p.className = "modalline";
      p.textContent = (paperName[key] || key) + ": " + byPaper[key].join(", ");
      cardSection.appendChild(p);
    });
  }

  const ids = Object.keys(CUL.amendments).sort();
  const amendSection = section(box, "Card amendments (" + ids.length + ")");
  if (!ids.length){
    const p = document.createElement("p");
    p.className = "modalline";
    p.textContent = "None. This profile changes retrieval scope only.";
    amendSection.appendChild(p);
    return;
  }
  ids.forEach(id => {
    const base = baseById[id];
    const card = effective(base);
    const block = document.createElement("div");
    block.className = "diffblock";
    const title = document.createElement("h3");
    title.textContent = base.shortId + " \u00b7 " + (paperName[base.paper] || base.paper);
    block.appendChild(title);
    const map = { interpretation:"text", category:"category", evidence_tier:"tier",
                  genes:"genes", diseases:"diseases" };
    changedFields(id).forEach(field => {
      const before = base[map[field]];
      const after = card[map[field]];
      const row = document.createElement("div");
      row.className = "diffrow";
      const label = document.createElement("span");
      label.className = "difffield";
      label.textContent = field;
      row.appendChild(label);
      const b = document.createElement("p");
      b.className = "before";
      b.textContent = Array.isArray(before) ? (before.join(", ") || "\u2014") : (before || "\u2014");
      const a = document.createElement("p");
      a.className = "after";
      a.textContent = Array.isArray(after) ? (after.join(", ") || "\u2014") : (after || "\u2014");
      row.appendChild(b);
      row.appendChild(a);
      block.appendChild(row);
    });
    const kind = document.createElement("p");
    kind.className = "diffkind";
    kind.textContent = changedFields(id).includes("interpretation")
      ? "Disclosed in the report reference list."
      : "Reachability only; not disclosed per statement.";
    block.appendChild(kind);
    amendSection.appendChild(block);
  });
}

/* In edit mode the card list becomes a selector: a tickbox for scope, and the
   row itself opens that card in the centre pane. Browse mode is untouched. */
function buildCardRow(card){
  const view = effective(card);
  const scope = scopeState(card);
  const item = document.createElement("li");
  item.className = "pickrow" + (CUL.selected === card.id ? " selected" : "") +
                   (scope.included ? "" : " excluded");
  item.dataset.cardId = card.id;

  const box = document.createElement("input");
  box.type = "checkbox";
  box.className = "pickbox";
  box.checked = scope.included;
  box.disabled = scope.locked;
  box.title = scope.locked
    ? "Out of scope by " + scope.reason + "; edit the paper rule to change this"
    : "Include this card in retrieval";
  box.setAttribute("aria-label", "Include " + card.shortId);
  box.addEventListener("click", event => event.stopPropagation());
  box.addEventListener("change", () => { setCardIncluded(card.id, box.checked); renderAll(); });
  item.appendChild(box);

  const body = document.createElement("div");
  body.className = "pickbody";

  const head = document.createElement("div");
  head.className = "pickhead";
  const id = document.createElement("span");
  id.className = "pickid";
  id.textContent = card.shortId;
  head.appendChild(id);
  const paper = document.createElement("span");
  paper.className = "pickpaper";
  paper.textContent = paperName[card.paper] || card.paper;
  head.appendChild(paper);
  if (view.amended){
    const tag = document.createElement("span");
    tag.className = "amendtag" + (view.stale ? " staletag" : "");
    tag.textContent = view.stale ? "stale" : "amended";
    head.appendChild(tag);
  }
  if (scope.locked){
    const tag = document.createElement("span");
    tag.className = "locktag";
    tag.textContent = scope.reason;
    head.appendChild(tag);
  }
  body.appendChild(head);

  const text = document.createElement("p");
  text.className = "picktext";
  text.textContent = view.text;
  body.appendChild(text);
  item.appendChild(body);

  item.tabIndex = 0;
  item.setAttribute("role", "button");
  item.addEventListener("click", () => { CUL.selected = card.id; renderAll(); });
  item.addEventListener("keydown", event => {
    if (event.key === "Enter" || event.key === " "){
      event.preventDefault();
      CUL.selected = card.id;
      renderAll();
    }
  });
  return item;
}

function buildPicker(rows){
  const list = document.getElementById("cards");
  list.innerHTML = "";
  const bar = document.createElement("div");
  bar.className = "pickbar";

  const shown = rows.filter(c => !scopeState(c).locked);
  const included = shown.filter(c => scopeState(c).included);

  const all = document.createElement("button");
  all.type = "button";
  all.className = "pbtn";
  all.textContent = "Include " + shown.length + " shown";
  all.disabled = !shown.length || included.length === shown.length;
  all.addEventListener("click", () => {
    shown.forEach(c => setCardIncluded(c.id, true));
    renderAll();
  });
  bar.appendChild(all);

  const none = document.createElement("button");
  none.type = "button";
  none.className = "pbtn";
  /* The label states the consequence: filtering to a gene and clicking this can
     write a hundred exclusions in one gesture. */
  none.textContent = "Exclude " + included.length + " shown";
  none.disabled = !included.length;
  none.addEventListener("click", () => {
    const promotion = rulePromotion(included);
    if (promotion){
      CUL.pending = { cards: included.map(c => c.id), promotion: promotion };
    } else {
      included.forEach(c => setCardIncluded(c.id, false));
      CUL.pending = null;
    }
    renderAll();
  });
  bar.appendChild(none);

  const tally = document.createElement("span");
  tally.className = "picktally";
  const reachable = DATA.cards.filter(c => scopeState(c).included).length;
  tally.textContent = reachable + " of " + DATA.cards.length + " reachable";
  bar.appendChild(tally);
  list.appendChild(bar);

  if (CUL.pending){
    list.appendChild(promotionPrompt());

  const chunk = document.createDocumentFragment();
  rows.forEach(card => chunk.appendChild(buildCardRow(card)));
  list.appendChild(chunk);
}

const state = { paper:new Set(), disease:new Set(), gene:new Set(), category:new Set(), query:"", terms:[], selected:null };
const facetSearch = { paper:"", disease:"", gene:"", category:"" };

const FACETS = [
  { key:"category", title:"Category",  field:c => [c.category], searchable:false, swatch:true },
  { key:"paper",    title:"Paper",     field:c => [c.paper],    searchable:true,  labelOf:k => paperName[k] || k },
  { key:"disease",  title:"Disease",   field:c => c.diseases,   searchable:true },
  { key:"gene",     title:"Gene",      field:c => c.genes,      searchable:true }
];

function matches(card, skip){
  const view = effective(card);
  for (const f of FACETS){
    if (f.key === skip) continue;
    const chosen = state[f.key];
    if (!chosen.size) continue;
    if (!f.field(view).some(v => chosen.has(v))) return false;
  }
  if (state.terms.length && !skip){
    if (scoreCard(view, state.terms) < 0) return false;
  }
  return true;
}

function visibleCards(){
  const rows = DATA.cards.filter(c => matches(c, null));
  if (!state.terms.length) return rows;
  return rows
    .map(c => ({ card:c, score:scoreCard(effective(c), state.terms) }))
    .sort((a, b) => b.score - a.score || (a.card.id < b.card.id ? -1 : 1))
    .map(x => x.card);
}

function countsFor(facet){
  const tally = new Map();
  for (const card of DATA.cards){
    if (!matches(card, facet.key)) continue;
    if (state.terms.length && scoreCard(effective(card), state.terms) < 0) continue;
    for (const value of facet.field(card)){
      if (!value) continue;
      tally.set(value, (tally.get(value) || 0) + 1);
    }
  }
  const all = new Set(tally.keys());
  state[facet.key].forEach(v => { if (!all.has(v)) tally.set(v, 0); });
  return tally;
}

function buildRail(){
  const rail = document.getElementById("rail");
  rail.innerHTML = "";
  for (const facet of FACETS){
    const tally = countsFor(facet);
    let entries = [...tally.entries()];
    if (facet.key === "paper"){
      entries.sort((a,b) => (facet.labelOf(a[0])).localeCompare(facet.labelOf(b[0])));
    } else if (facet.key === "category"){
      entries.sort((a,b) => b[1] - a[1] || a[0].localeCompare(b[0]));
    } else {
      entries.sort((a,b) => a[0].localeCompare(b[0], undefined, {numeric:true}));
    }
    const needle = facetSearch[facet.key].toLowerCase();
    if (needle){
      entries = entries.filter(([value]) => {
        const label = facet.labelOf ? facet.labelOf(value) : value;
        return label.toLowerCase().includes(needle) || state[facet.key].has(value);
      });
    }

    const box = document.createElement("section");
    box.className = "facet" + (state[facet.key].size ? " active" : "");

    const head = document.createElement("h2");
    head.textContent = facet.title;
    const clear = document.createElement("button");
    clear.type = "button";
    clear.className = "clear";
    clear.textContent = "clear";
    clear.addEventListener("click", () => { state[facet.key].clear(); render(); });
    head.appendChild(clear);
    box.appendChild(head);

    if (facet.searchable){
      const input = document.createElement("input");
      input.className = "facet-search";
      input.type = "search";
      input.placeholder = "Filter " + facet.title.toLowerCase() + "s";
      input.setAttribute("aria-label", "Filter " + facet.title.toLowerCase() + " list");
      input.value = facetSearch[facet.key];
      input.addEventListener("input", event => {
        facetSearch[facet.key] = event.target.value;
        render({ keepFocus: facet.key });
      });
      box.appendChild(input);
    }

    const list = document.createElement("ul");
    list.className = "options" + (entries.length <= 8 ? " short" : "");
    for (const [value, count] of entries){
      const item = document.createElement("li");
      const button = document.createElement("button");
      const on = state[facet.key].has(value);
      button.type = "button";
      button.className = "opt";
      button.setAttribute("aria-pressed", on ? "true" : "false");
      if (!count && !on) button.disabled = true;

      const tick = document.createElement("span");
      tick.className = "tick";
      tick.textContent = on ? "\u2715" : "";
      tick.setAttribute("aria-hidden", "true");
      button.appendChild(tick);

      if (facet.swatch){
        const dot = document.createElement("span");
        dot.className = "swatch";
        dot.style.background = CATEGORY_COLOURS[value] || "var(--muted)";
        button.appendChild(dot);
      }

      const label = document.createElement("span");
      label.className = "label";
      label.textContent = facet.labelOf ? facet.labelOf(value) : value;
      button.appendChild(label);

      const num = document.createElement("span");
      num.className = "count";
      num.textContent = count;
      button.appendChild(num);

      button.addEventListener("click", () => {
        const set = state[facet.key];
        if (set.has(value)) set.delete(value); else set.add(value);
        render();
      });
      item.appendChild(button);
      list.appendChild(item);
    }
    if (!entries.length){
      const item = document.createElement("li");
      item.className = "tally";
      item.style.padding = "4px";
      item.textContent = "No matches in this list.";
      list.appendChild(item);
    }
    box.appendChild(list);
    rail.appendChild(box);
  }
}

function highlight(text, needle){
  if (!needle) return document.createTextNode(text);
  const fragment = document.createDocumentFragment();
  const lower = text.toLowerCase();
  let from = 0;
  let at = lower.indexOf(needle, from);
  while (at !== -1){
    fragment.appendChild(document.createTextNode(text.slice(from, at)));
    const mark = document.createElement("mark");
    mark.textContent = text.slice(at, at + needle.length);
    fragment.appendChild(mark);
    from = at + needle.length;
    at = lower.indexOf(needle, from);
  }
  fragment.appendChild(document.createTextNode(text.slice(from)));
  return fragment;
}

function textOrDash(value){
  if (value === null || value === undefined || value === "") return "—";
  if (Array.isArray(value)) return value.length ? value.join(", ") : "—";
  if (typeof value === "object") return JSON.stringify(value);
  return String(value);
}

function addMeta(grid, label, value){
  const dt = document.createElement("dt");
  dt.textContent = label;
  const dd = document.createElement("dd");
  dd.textContent = textOrDash(value);
  grid.append(dt, dd);
}

function detailSection(title){
  const section = document.createElement("section");
  section.className = "detail-section";
  const head = document.createElement("h2");
  head.textContent = title;
  section.appendChild(head);
  return section;
}

function closeDetail(){
  state.selected = null;
  document.body.classList.remove("detail-open");
  document.getElementById("detail").innerHTML = "";
  document.querySelectorAll("li.card.selected").forEach(el => el.classList.remove("selected"));

function buildDetail(card){
  if (!DATA.full || !card || !card.details) return;
  state.selected = card.id;
  document.body.classList.add("detail-open");
  const pane = document.getElementById("detail");
  pane.innerHTML = "";

  const paper = paperByKey[card.paper];
  const exact = card.details.card || {};
  const evidence = card.details.evidence || {};
  const paperDetails = (paper && paper.details) || {};

  const head = document.createElement("div");
  head.className = "detail-head";
  const id = document.createElement("div");
  id.className = "detail-id";
  id.textContent = card.id;
  const close = document.createElement("button");
  close.type = "button";
  close.className = "detail-close";
  close.textContent = "Close";
  close.setAttribute("aria-label", "Close card details");
  close.addEventListener("click", closeDetail);
  head.append(id, close);
  pane.appendChild(head);

  // Repeat the interpretation at the top, then show only the metadata useful
  // for reviewing/classifying the selected card. Arrays are rendered as
  // human-readable joined values rather than indexed parameter paths.
  const interpretation = detailSection("Interpretation");
  const text = document.createElement("p");
  text.className = "detail-interpretation";
  text.textContent = exact.interpretation || card.text;
  interpretation.appendChild(text);
  pane.appendChild(interpretation);

  const classification = detailSection("Classification");
  const classificationGrid = document.createElement("dl");
  classificationGrid.className = "meta-grid";
  addMeta(classificationGrid, "Genes", exact.genes || card.genes);
  addMeta(classificationGrid, "Category", exact.category || card.category);
  addMeta(classificationGrid, "Disease", exact.diseases || card.diseases);
  classification.appendChild(classificationGrid);
  pane.appendChild(classification);

  const evidenceMeta = detailSection("Evidence");
  const evidenceGrid = document.createElement("dl");
  evidenceGrid.className = "meta-grid";
  addMeta(evidenceGrid, "Evidence tier", exact.evidence_tier || card.tier);
  addMeta(
    evidenceGrid,
    "Secondary citation",
    exact.secondary_citation && exact.secondary_citation.display
  );
  evidenceMeta.appendChild(evidenceGrid);
  for (const fragment of (evidence.fragments || [])){
    const box = document.createElement("div");
    box.className = "evidence-fragment";
    const label = document.createElement("div");
    label.className = "fragment-label";
    label.textContent = [fragment.fragment_id, fragment.role, fragment.locator]
      .filter(Boolean)
      .join(" · ");
    const quote = document.createElement("blockquote");
    quote.textContent = fragment.quote || "";
    box.append(label, quote);
    evidenceMeta.appendChild(box);
  }
  pane.appendChild(evidenceMeta);

  const acceptance = paperDetails.accepted_package || {};
  const acceptanceMeta = detailSection("Acceptance");
  const acceptanceGrid = document.createElement("dl");
  acceptanceGrid.className = "meta-grid";
  addMeta(acceptanceGrid, "Acceptance path", acceptance.acceptance_path);
  addMeta(acceptanceGrid, "Accepted at", acceptance.accepted_at);
  addMeta(acceptanceGrid, "Accepted at source", acceptance.accepted_at_source);
  addMeta(acceptanceGrid, "Accepted in version", acceptance.accepted_in_version);
  addMeta(acceptanceGrid, "Latest version", acceptance.latest_version || acceptance.accepted_in_version);
  addMeta(acceptanceGrid, "Version history", acceptance.version_history);
  acceptanceMeta.appendChild(acceptanceGrid);
  pane.appendChild(acceptanceMeta);

  pane.scrollTop = 0;
  document.querySelectorAll("li.card").forEach(el => {
    el.classList.toggle("selected", el.dataset.cardId === card.id);
  });
}

function buildCards(){
  const list = document.getElementById("cards");
  const rows = visibleCards();
  list.innerHTML = "";

  document.getElementById("tally").innerHTML =
    "<b>" + rows.length + "</b> of " + DATA.cards.length + " cards";

  if (!rows.length){
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.innerHTML = "<h3>Nothing matches these filters</h3>" +
      "<p>Remove a filter, or clear all of them and start from a single gene or paper.</p>";
    list.appendChild(empty);
    return;
  }

  const chunk = document.createDocumentFragment();
  for (const card of rows){
    const view = effective(card);
    const item = document.createElement("li");
    item.className = "card" + (state.selected === card.id ? " selected" : "");
    item.dataset.cardId = card.id;
    item.style.setProperty("--spine", CATEGORY_COLOURS[view.category] || "var(--rule)");
    if (DATA.full && !EDIT.on){
      item.tabIndex = 0;
      item.setAttribute("role", "button");
      item.setAttribute("aria-label", "Open full details for " + card.id);
      item.addEventListener("click", () => buildDetail(card));
      item.addEventListener("keydown", event => {
        if (event.key === "Enter" || event.key === " "){
          event.preventDefault();
          buildDetail(card);
        }
      });
    }

    const cid = document.createElement("span");
    cid.className = "cid";
    cid.textContent = card.id;
    if (view.amended){
      const tag = document.createElement("span");
      tag.className = "amendtag" + (view.stale ? " staletag" : "");
      tag.textContent = view.stale ? "stale amendment" : "amended";
      cid.appendChild(tag);
    }
    const paper = paperByKey[card.paper] || {};
    if (paper.evidence === "mismatched"){
      const tag = document.createElement("span");
      tag.className = "evidencetag";
      tag.textContent = "package out of sync";
      tag.title = paper.evidenceWarning || "";
      cid.appendChild(tag);
    }
    item.appendChild(cid);

    const para = document.createElement("p");
    para.appendChild(highlight(view.text, highlightNeedle()));
    item.appendChild(para);

    item.appendChild(copyRow(card));

    chunk.appendChild(item);
  }
  list.appendChild(chunk);
  if (DATA.full && state.selected && !rows.some(card => card.id === state.selected)) closeDetail();
}

function render(options){
  const keep = options && options.keepFocus;
  buildRail();
  renderBody();
  if (keep){
    const facetIndex = FACETS.findIndex(f => f.key === keep);
    const input = document.querySelectorAll(".facet")[facetIndex].querySelector(".facet-search");
    if (input){
      input.focus();
      input.setSelectionRange(input.value.length, input.value.length);
    }
  }
}

document.getElementById("provenance").textContent =
  "corpus " + DATA.corpusVersion + " \u00b7 " + DATA.cards.length + " cards \u00b7 " +
  DATA.papers.length + " papers" + (DATA.full ? " · full evidence view" : "");

document.getElementById("textsearch").addEventListener("input", event => {
  state.query = event.target.value.trim().toLowerCase();
  state.terms = parseQuery(state.query);
  buildRail();
  buildCards();
});

document.getElementById("reset").addEventListener("click", () => {
  FACETS.forEach(f => { state[f.key].clear(); facetSearch[f.key] = ""; });
  state.query = "";
  state.terms = [];
  document.getElementById("textsearch").value = "";
  render();
});

const railToggle = document.getElementById("railtoggle");
railToggle.addEventListener("click", () => {
  const rail = document.getElementById("rail");
  const open = rail.hasAttribute("hidden");
  if (open) rail.removeAttribute("hidden"); else rail.setAttribute("hidden", "");
  railToggle.setAttribute("aria-expanded", open ? "true" : "false");
});
if (window.matchMedia("(max-width:900px)").matches){
  document.getElementById("rail").setAttribute("hidden", "");
}

render();

function highlightNeedle(){
  const plain = state.terms.filter(x => !x.negate && !x.field);
  return plain.length ? plain[0].text : "";
}

/* The only place that decides what the panes contain. render() and renderAll()
   both route through it, so a filter click cannot render browse-mode cards while
   edit mode is active. */
function renderBody(){
  if (EDIT.on){
    buildPicker(visibleCards());
    buildEditorPane();
    updateProfileBar();
  } else {
    buildCards();
  }
}

function renderAll(){ render(); }

function setMode(on){
  EDIT.on = on;
  document.body.classList.toggle("edit-mode", on);
  document.body.classList.toggle("detail-open", on ? true : document.body.classList.contains("detail-open") && !on ? false : false);
  document.getElementById("mode-browse").setAttribute("aria-pressed", String(!on));
  document.getElementById("mode-edit").setAttribute("aria-pressed", String(on));
  const mount = document.getElementById("profilemount");
  mount.innerHTML = "";
  if (on){ mount.appendChild(buildProfileBar()); }
  else { CUL.selected = null; CUL.pending = null; }
  renderAll();
}

document.getElementById("mode-browse").addEventListener("click", () => setMode(false));
document.getElementById("mode-edit").addEventListener("click", () => setMode(true));

if (DATA.evidenceMode === "partial" || DATA.evidenceMode === "none"){
  const note = DATA.evidenceMode === "none"
    ? " \u00b7 corpus-only view"
    : " \u00b7 partial evidence (" + DATA.missingPackages.length + " paper(s) without accepted packages)";
  document.getElementById("provenance").textContent += note;
}

</script>
</body>
</html>
