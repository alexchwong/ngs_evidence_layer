etain a blast requirement of at least 20%."},{"id":"arber-2022-blood-140-1200-C0167","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["MDS/AML"],"text":"MDS cases with 10%-19% blasts are classified as MDS/AML after higher-priority AML-defining genetic categories are considered."},{"id":"arber-2022-blood-140-1200-C0168","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["BCR","ABL1"],"diseases":["B-ALL"],"text":"BCR::ABL1-positive B-ALL is divided into lymphoid-only and multilineage BCR::ABL1-positive subsets."},{"id":"arber-2022-blood-140-1200-C0169","paper":"arber-2022-blood-140-1200","category":"biomarker","tier":"guideline criterion","genes":["BCR","ABL1"],"diseases":["B-ALL"],"text":"In BCR::ABL1-positive B-ALL, FISH detection of the translocation in granulocytes supports multilineage involvement, whereas FISH positivity confined to lymphoblasts supports lymphoid-only involvement."},{"id":"arber-2022-blood-140-1200-C0170","paper":"arber-2022-blood-140-1200","category":"biomarker","tier":"guideline criterion","genes":["BCR","ABL1"],"diseases":["B-ALL"],"text":"After treatment of BCR::ABL1-positive B-ALL, high RT-PCR positivity for BCR::ABL1 can persist despite little or no MRD by flow cytometry and other molecular MRD methods, which can affect MRD interpretation."},{"id":"arber-2022-blood-140-1200-C0171","paper":"arber-2022-blood-140-1200","category":"treatment","tier":"restated secondary","genes":["ABL1"],"diseases":["B-ALL"],"text":"BCR::ABL1-like B-ALL with ABL-class fusions is important to recognize because these cases show a distinctive response pattern to ABL1-class tyrosine-kinase inhibitors."},{"id":"arber-2022-blood-140-1200-C0172","paper":"arber-2022-blood-140-1200","category":"biomarker","tier":"guideline criterion","genes":["CRLF2"],"diseases":["B-ALL"],"text":"CRLF2 rearrangement in BCR::ABL1-like B-ALL can often be detected by FISH or screened by CRLF2 flow cytometry because CRLF2 is upregulated."},{"id":"arber-2022-blood-140-1200-C0173","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["MYC"],"diseases":["B-ALL"],"text":"B-ALL with MYC rearrangement is classified as an immature B-ALL entity distinct from aggressive mature B-cell lymphomas with MYC rearrangement."},{"id":"arber-2022-blood-140-1200-C0174","paper":"arber-2022-blood-140-1200","category":"prognosis","tier":"restated secondary","genes":["MYC"],"diseases":["B-ALL"],"text":"B-ALL with MYC rearrangement has poor prognosis in the ICC summary table."},{"id":"arber-2022-blood-140-1200-C0175","paper":"arber-2022-blood-140-1200","category":"prognosis","tier":"restated secondary","genes":["DUX4","IKZF1"],"diseases":["B-ALL"],"text":"DUX4-rearranged B-ALL has excellent prognosis in children and adults, even with adverse features such as IKZF1 deletion."},{"id":"arber-2022-blood-140-1200-C0176","paper":"arber-2022-blood-140-1200","category":"biomarker","tier":"guideline criterion","genes":["DUX4"],"diseases":["B-ALL"],"text":"FISH detection of DUX4 rearrangement is difficult."},{"id":"arber-2022-blood-140-1200-C0177","paper":"arber-2022-blood-140-1200","category":"biomarker","tier":"guideline criterion","genes":["DUX4"],"diseases":["B-ALL"],"text":"DUX4 overexpression is specific for DUX4-rearranged B-ALL and can be detected by quantitative gene-expression testing or immunohistochemistry."},{"id":"arber-2022-blood-140-1200-C0178","paper":"arber-2022-blood-140-1200","category":"biomarker","tier":"guideline criterion","genes":["DUX4"],"diseases":["B-ALL"],"text":"CD371 expression is associated with DUX4-rearranged B-ALL and may be identified by flow cytometry."},{"id":"arber-2022-blood-140-1200-C0179","paper":"arber-2022-blood-140-1200","category":"prognosis","tier":"restated secondary","genes":["MEF2D"],"diseases":["B-ALL"],"text":"MEF2D-rearranged B-ALL has poor prognosis."},{"id":"arber-2022-blood-140-1200-C0180","paper":"arber-2022-blood-140-1200","category":"biomarker","tier":"guideline criterion","genes":["MEF2D"],"diseases":["B-ALL"],"text":"MEF2D-rearranged B-ALL can be assessed by whole-transcriptome sequencing or MEF2D FISH."},{"id":"arber-2022-blood-140-1200-C0181","paper":"arber-2022-blood-140-1200","category":"biomarker","tier":"guideline criterion","genes":["MEF2D","BCL9"],"diseases":["B-ALL"],"text":"MEF2D-rearranged B-ALL with the common BCL9 fusion partner can be detected with available fusion FISH probes."},{"id":"arber-2022-blood-140-1200-C0183","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["ZNF384"],"diseases":["B-ALL"],"text":"ZNF384-rearranged leukemia is a distinct rearrangement-defined entity that may present as B-ALL or B/myeloid MPAL."},{"id":"arber-2022-blood-140-1200-C0184","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["ZNF384","ZNF362"],"diseases":["B-ALL"],"text":"ZNF362-rearranged cases with the same characteristic expression profile are grouped with ZNF384/ZNF362-rearranged B-ALL."},{"id":"arber-2022-blood-140-1200-C0185","paper":"arber-2022-blood-140-1200","category":"prognosis","tier":"restated secondary","genes":["ZNF384","EP300","TCF3"],"diseases":["B-ALL"],"text":"In ZNF384-rearranged B-ALL, prognosis varies by fusion partner, with EP300 associated with the best prognosis and TCF3 with the worst."},{"id":"arber-2022-blood-140-1200-C0186","paper":"arber-2022-blood-140-1200","category":"biomarker","tier":"guideline criterion","genes":["ZNF384","ZNF362"],"diseases":["B-ALL"],"text":"ZNF384/ZNF362-rearranged B-ALL can be assessed by whole-transcriptome sequencing, with FISH possible for some rearrangements."},{"id":"arber-2022-blood-140-1200-C0187","paper":"arber-2022-blood-140-1200","category":"prognosis","tier":"restated secondary","genes":["NUTM1","KMT2A"],"diseases":["B-ALL"],"text":"NUTM1-rearranged B-ALL has favorable prognosis and, in infants, a much more favorable prognosis than KMT2A-rearranged leukemia."},{"id":"arber-2022-blood-140-1200-C0188","paper":"arber-2022-blood-140-1200","category":"biomarker","tier":"guideline criterion","genes":["NUTM1"],"diseases":["B-ALL"],"text":"NUTM1-rearranged B-ALL can be diagnosed with a standard NUTM1 break-apart FISH probe set."},{"id":"arber-2022-blood-140-1200-C0189","paper":"arber-2022-blood-140-1200","category":"prognosis","tier":"restated secondary","genes":["TCF3","TCF4","HLF"],"diseases":["B-ALL"],"text":"HLF-rearranged B-ALL has very poor prognosis."},{"id":"arber-2022-blood-140-1200-C0190","paper":"arber-2022-blood-140-1200","category":"treatment","tier":"restated secondary","genes":["TCF3","TCF4","HLF"],"diseases":["B-ALL"],"text":"Anti-CD19 therapy and transplant have shown some promise in HLF-rearranged B-ALL."},{"id":"arber-2022-blood-140-1200-C0191","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["CDX2","UBTF","FLT3","PAN3","ATXN7L3"],"diseases":["B-ALL"],"text":"CDX2/UBTF B-ALL is defined by concomitant FLT3/PAN3-region enhancer retargeting with CDX2 deregulation and a UBTF-region lesion producing UBTF::ATXN7L3."},{"id":"arber-2022-blood-140-1200-C0192","paper":"arber-2022-blood-140-1200","category":"prognosis","tier":"restated secondary","genes":["CDX2","UBTF"],"diseases":["B-ALL"],"text":"CDX2/UBTF B-ALL appears to have poor outcome with conventional chemotherapy."},{"id":"arber-2022-blood-140-1200-C0193","paper":"arber-2022-blood-140-1200","category":"biomarker","tier":"guideline criterion","genes":["CDX2","UBTF"],"diseases":["B-ALL"],"text":"CDX2/UBTF B-ALL can be assessed using RT-PCR or whole-transcriptome sequencing for its defining lesions."},{"id":"arber-2022-blood-140-1200-C0194","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["IKZF1"],"diseases":["B-ALL"],"text":"B-ALL with IKZF1 N159Y is recognized as a distinct point-mutation-defined entity."},{"id":"arber-2022-blood-140-1200-C0195","paper":"arber-2022-blood-140-1200","category":"biomarker","tier":"guideline criterion","genes":["IKZF1"],"diseases":["B-ALL"],"text":"The defining IKZF1 N159Y mutation in B-ALL can be detected by exome or gene-panel sequencing."},{"id":"arber-2022-blood-140-1200-C0196","paper":"arber-2022-blood-140-1200","category":"prognosis","tier":"restated secondary","genes":["IKZF1"],"diseases":["B-ALL"],"text":"B-ALL with IKZF1 N159Y is assigned intermediate prognosis in the ICC summary table."},{"id":"arber-2022-blood-140-1200-C0197","paper":"arber-2022-blood-140-1200","category":"prognosis","tier":"restated secondary","genes":["PAX5"],"diseases":["B-ALL"],"text":"PAX5 P80R B-ALL has relatively favorable prognosis in the source discussion."},{"id":"arber-2022-blood-140-1200-C0198","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["PAX5"],"diseases":["B-ALL"],"text":"The PAX5 P80R B-ALL entity depends on biallelic PAX5 alteration through deletion or inactivation of the second allele."},{"id":"arber-2022-blood-140-1200-C0199","paper":"arber-2022-blood-140-1200","category":"biomarker","tier":"guideline criterion","genes":["PAX5"],"diseases":["B-ALL"],"text":"The defining PAX5 P80R mutation in B-ALL can be detected by exome or gene-panel sequencing."},{"id":"arber-2022-blood-140-1200-C0200","paper":"arber-2022-blood-140-1200","category":"prognosis","tier":"restated secondary","genes":["PAX5"],"diseases":["B-ALL"],"text":"B-ALL with PAX5 P80R is summarized as intermediate prognosis overall and good prognosis in adults in the ICC summary table."},{"id":"arber-2022-blood-140-1200-C0201","paper":"arber-2022-blood-140-1200","category":"prognosis","tier":"restated secondary","genes":["ETV6","RUNX1"],"diseases":["B-ALL"],"text":"Pediatric ETV6::RUNX1-like B-ALL appears to have the same favorable prognosis as ETV6::RUNX1 B-ALL."},{"id":"arber-2022-blood-140-1200-C0202","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["PAX5"],"diseases":["B-ALL"],"text":"PAX5-altered B-ALL is a provisional subtype characterized by diverse PAX5 rearrangements, point mutations, and intragenic lesions."},{"id":"arber-2022-blood-140-1200-C0203","paper":"arber-2022-blood-140-1200","category":"biomarker","tier":"guideline criterion","genes":["PAX5"],"diseases":["B-ALL"],"text":"Complete definition of PAX5-altered B-ALL requires gene-expression profiling."},{"id":"arber-2022-blood-140-1200-C0204","paper":"arber-2022-blood-140-1200","category":"prognosis","tier":"restated secondary","genes":["ZEB2","CEBPE"],"diseases":["B-ALL"],"text":"B-ALL cases clustering with ZEB2 H1038R or IGH::CEBPE have poor prognosis."},{"id":"arber-2022-blood-140-1200-C0205","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["ZEB2","CEBPE"],"diseases":["B-ALL"],"text":"ZEB2 H1038R and IGH::CEBPE lesions do not uniquely define the expression-defined provisional B-ALL group."},{"id":"arber-2022-blood-140-1200-C0206","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["KMT2A"],"diseases":["B-ALL"],"text":"KMT2A rearrangement defines an ICC B-ALL subtype with recurrent genetic abnormality."},{"id":"arber-2022-blood-140-1200-C0207","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["ETV6","RUNX1"],"diseases":["B-ALL"],"text":"ETV6::RUNX1 defines an ICC B-ALL subtype with recurrent genetic abnormality."},{"id":"arber-2022-blood-140-1200-C0208","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["IL3","IGH"],"diseases":["B-ALL"],"text":"IL3::IGH defines an ICC B-ALL subtype with recurrent genetic abnormality."},{"id":"arber-2022-blood-140-1200-C0209","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["TCF3","PBX1"],"diseases":["B-ALL"],"text":"TCF3::PBX1 defines an ICC B-ALL subtype with recurrent genetic abnormality."},{"id":"arber-2022-blood-140-1200-C0210","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["ABL1"],"diseases":["B-ALL"],"text":"BCR::ABL1-like B-ALL with an ABL1-class rearrangement is recognized as an ICC subtype."},{"id":"arber-2022-blood-140-1200-C0211","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["B-ALL"],"text":"B-ALL with iAMP21 is recognized as an ICC subtype."},{"id":"arber-2022-blood-140-1200-C0212","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["ZEB2","CEBPE"],"diseases":["B-ALL"],"text":"B-ALL with mutated ZEB2 p.H1038R/IGH::CEBPE is listed as a provisional ICC entity."},{"id":"arber-2022-blood-140-1200-C0213","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["ZNF384"],"diseases":["B-ALL"],"text":"B-ALL with a ZNF384-rearranged-like expression profile is listed as a provisional ICC entity."},{"id":"arber-2022-blood-140-1200-C0214","paper":"arber-2022-blood-140-1200","category":"diagnosis","tier":"guideline criterion","genes":["KMT2A"],"diseases":["B-ALL"],"text":"B-ALL with a KMT2A-rearranged-like expression profile is listed as a provisional ICC entity."},{"id":"baliakas-2019-operational-germline-testing-C0002","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"restated secondary","genes":["ELANE","CSF3R","GFI1","SRP54"],"diseases":["MDS","AML"],"text":"Severe congenital neutropenia involving ELANE, CSF3R, GFI1, or SRP54 is listed as a germline predisposition associated with MDS and AML."},{"id":"baliakas-2019-operational-germline-testing-C0003","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"restated secondary","genes":["SRP72"],"diseases":["MDS"],"text":"SRP72-associated bone marrow failure syndrome is listed as a germline predisposition associated with MDS."},{"id":"baliakas-2019-operational-germline-testing-C0004","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"restated secondary","genes":["RUNX1"],"diseases":["MDS","AML"],"text":"RUNX1 is listed as a germline predisposition gene associated with MDS and AML."},{"id":"baliakas-2019-operational-germline-testing-C0005","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"restated secondary","genes":["ANKRD26"],"diseases":["AML","MDS","CML"],"text":"Germline ANKRD26 predisposition is associated with AML, MDS, and CML."},{"id":"baliakas-2019-operational-germline-testing-C0006","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"restated secondary","genes":["ETV6"],"diseases":["acute lymphoblastic leukaemia/lymphoma","AML","MDS"],"text":"Germline ETV6 predisposition is associated with ALL, AML, and MDS."},{"id":"baliakas-2019-operational-germline-testing-C0007","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"restated secondary","genes":["GATA2"],"diseases":["MDS","AML"],"text":"GATA2 deficiency syndrome is listed as a germline predisposition associated with MDS and AML."},{"id":"baliakas-2019-operational-germline-testing-C0008","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"restated secondary","genes":["SAMD9L"],"diseases":["MDS","AML"],"text":"SAMD9L-associated ataxia-pancytopenia syndrome is listed as a germline predisposition to MDS/AML with monosomy 7."},{"id":"baliakas-2019-operational-germline-testing-C0009","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"restated secondary","genes":["SAMD9"],"diseases":["MDS","AML"],"text":"SAMD9-associated MIRAGE syndrome is listed as a germline predisposition to MDS/AML with monosomy 7."},{"id":"baliakas-2019-operational-germline-testing-C0010","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"restated secondary","genes":["DDX41"],"diseases":["MDS","AML"],"text":"Germline DDX41 mutation is listed as a predisposition associated with MDS and AML."},{"id":"baliakas-2019-operational-germline-testing-C0011","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"restated secondary","genes":["CBL","KRAS","NF1","PTPN11"],"diseases":["JMML","AML"],"text":"RASopathies involving CBL, KRAS, NF1, or PTPN11 are listed as germline predisposition syndromes associated with JMML and AML."},{"id":"baliakas-2019-operational-germline-testing-C0012","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"restated secondary","genes":["TP53"],"diseases":["MDS","AML"],"text":"TP53-associated Li-Fraumeni syndrome is listed as a germline predisposition that includes MDS and AML."},{"id":"baliakas-2019-operational-germline-testing-C0013","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"restated secondary","genes":["MECOM"],"diseases":["MDS","AML"],"text":"MECOM-associated syndromes are listed among germline conditions associated with MDS and AML."},{"id":"baliakas-2019-operational-germline-testing-C0014","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"restated secondary","genes":["DKC1"],"diseases":["MDS","AML"],"text":"DKC1-associated telomere biology disorder is listed as a germline predisposition associated with MDS and AML."},{"id":"baliakas-2019-operational-germline-testing-C0015","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"restated secondary","genes":["LIG4"],"diseases":["MDS"],"text":"LIG4 syndrome is listed as a germline predisposition associated with MDS."},{"id":"baliakas-2019-operational-germline-testing-C0016","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"restated secondary","genes":["SRP72"],"diseases":[],"text":"Congenital sensorineural deafness is a characteristic clinical clue to SRP72-associated germline predisposition."},{"id":"baliakas-2019-operational-germline-testing-C0018","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"guideline criterion","genes":["TERC","RUNX1"],"diseases":[],"text":"Poor stem-cell mobilization in a sibling candidate donor is reported as a rare clue to germline TERC or RUNX1 predisposition."},{"id":"baliakas-2019-operational-germline-testing-C0019","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"guideline criterion","genes":["RUNX1","GATA2","TP53","ETV6","CEBPA"],"diseases":["MDS","AML"],"text":"In MDS or AML, a RUNX1, GATA2, TP53, ETV6, or CEBPA variant detected on a somatic NGS panel with VAF 40–60% or >90% can suggest possible germline origin."},{"id":"baliakas-2019-operational-germline-testing-C0020","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"guideline criterion","genes":["RUNX1","GATA2","TP53","ETV6","CEBPA"],"diseases":["MDS","AML"],"text":"When a RUNX1, GATA2, TP53, ETV6, or CEBPA variant detected on a somatic NGS panel is suspected to be germline in MDS/AML, confirmation in extra-hematological tissue is highly recommended after consent."},{"id":"baliakas-2019-operational-germline-testing-C0021","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"restated secondary","genes":["DDX41"],"diseases":["MDS","AML"],"text":"Possible germline DDX41 predisposition should not be excluded in older adults: DDX41 variants are associated with MDS and AML between ages 55 and 65 years."},{"id":"baliakas-2019-operational-germline-testing-C0022","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"restated secondary","genes":["DDX41"],"diseases":[],"text":"Truncating DDX41 variants are usually of germline origin."},{"id":"baliakas-2019-operational-germline-testing-C0023","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"guideline criterion","genes":["GATA2","SAMD9","SAMD9L"],"diseases":["MDS","AML"],"text":"In patients diagnosed with MDS or AML before age 50 without suggestive personal or family history, chromosome 7 loss abnormalities should prompt referral for germline counseling/testing; this criterion is particularly relevant to GATA2-, SAMD9-, and SAMD9L-related predisposition."},{"id":"baliakas-2019-operational-germline-testing-C0025","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"restated secondary","genes":["RUNX1","ANKRD26","ETV6"],"diseases":[],"text":"Carriers of RUNX1, ANKRD26, or ETV6 variants may have thrombocytopenia at baseline."},{"id":"baliakas-2019-operational-germline-testing-C0026","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"restated secondary","genes":["RUNX1","ANKRD26","ETV6"],"diseases":[],"text":"Carriers of RUNX1, ANKRD26, or ETV6 variants may have a bleeding tendency even without thrombocytopenia."},{"id":"baliakas-2019-operational-germline-testing-C0027","paper":"baliakas-2019-operational-germline-testing","category":"biomarker","tier":"guideline criterion","genes":["GATA2","RUNX1"],"diseases":["MDS","AML"],"text":"For germline predisposition to MDS/AML involving pathogenic GATA2 or RUNX1 variants, the working group recommends repeating CBC every 6 months, particularly in high-risk patients."},{"id":"baliakas-2019-operational-germline-testing-C0028","paper":"baliakas-2019-operational-germline-testing","category":"prognosis","tier":"restated secondary","genes":["GATA2","RUNX1"],"diseases":["MDS","AML"],"text":"In hereditary conditions related mainly to germline GATA2 or RUNX1 mutations, emergence of clonal hematopoiesis is associated with increased risk of developing MDS or AML."},{"id":"baliakas-2019-operational-germline-testing-C0030","paper":"baliakas-2019-operational-germline-testing","category":"germline","tier":"guideline criterion","genes":["CEBPA"],"diseases":["AML"],"text":"Germline CEBPA variants are associated with AML."},{"id":"baliakas-2019-operational-germline-testing-C0031","paper":"baliakas-2019-operational-germline-testing","category":"treatment","tier":"guideline criterion","genes":["CEBPA"],"diseases":["AML"],"text":"AML with germline CEBPA mutation has no absolute indication for allo-HSCT in first complete remission."},{"id":"baliakas-2019-operational-germline-testing-C0032","paper":"baliakas-2019-operational-germline-testing","category":"treatment","tier":"restated secondary","genes":["CEBPA"],"diseases":["AML"],"text":"Patients with germline CEBPA-associated AML can experience long remissions after conventional chemotherapy."},{"id":"baliakas-2019-operational-germline-testing-C0033","paper":"baliakas-2019-operational-germline-testing","category":"prognosis","tier":"restated secondary","genes":["CEBPA"],"diseases":["AML"],"text":"Germline CEBPA-associated AML remains at high risk of developing new leukemic clones."},{"id":"baliakas-2019-operational-germline-testing-C0034","paper":"baliakas-2019-operational-germline-testing","category":"treatment","tier":"guideline criterion","genes":["CEBPA"],"diseases":["AML"],"text":"Although allo-HSCT is not absolutely indicated in first remission, it may be considered later in germline CEBPA-associated AML."},{"id":"barbui-2015-blood-cancer-journal-5-e369-C0001","paper":"barbui-2015-blood-cancer-journal-5-e369","category":"prognosis","tier":"restated secondary","genes":["CALR"],"diseases":["ET"],"text":"In ET, CALR mutation was reported not to further modify prediction of future vascular events by IPSET-thrombosis."},{"id":"barbui-2015-blood-cancer-journal-5-e369-C0002","paper":"barbui-2015-blood-cancer-journal-5-e369","category":"prognosis","tier":"univariable or descriptive","genes":["JAK2"],"diseases":["ET"],"text":"In conventionally assigned low-risk ET, JAK2 mutation without cardiovascular risk factors was associated with a higher annual thrombosis rate than absence of both JAK2 mutation and cardiovascular risk factors (1.59% vs 0.44% patients/year; P=0.001)."},{"id":"barbui-2015-blood-cancer-journal-5-e369-C0003","paper":"barbui-2015-blood-cancer-journal-5-e369","category":"prognosis","tier":"univariable or descriptive","genes":["JAK2"],"diseases":["ET"],"text":"In conventionally assigned low-risk JAK2-unmutated ET, cardiovascular risk factors alone did not significantly increase thrombosis compared with absence of both factors (1.05% vs 0.44% patients/year; P=NS)."},{"id":"barbui-2015-blood-cancer-journal-5-e369-C0004","paper":"barbui-2015-blood-cancer-journal-5-e369","category":"prognosis","tier":"univariable or descriptive","genes":["JAK2"],"diseases":["ET"],"text":"In conventionally assigned low-risk JAK2-mutated ET, concomitant cardiovascular risk factors did not significantly increase thrombosis compared with JAK2 mutation alone (P=0.217)."},{"id":"barbui-2015-blood-cancer-journal-5-e369-C0005","paper":"barbui-2015-blood-cancer-journal-5-e369","category":"prognosis","tier":"univariable or descriptive","genes":["JAK2"],"diseases":["ET"],"text":"In conventionally assigned high-risk ET, patients with both JAK2 mutation and cardiovascular risk factors had higher thrombosis risk than patients with neither factor (4.17% vs 1.44% patients/year; P=0.011)."},{"id":"barbui-2015-blood-cancer-journal-5-e369-C0006","paper":"barbui-2015-blood-cancer-journal-5-e369","category":"prognosis","tier":"univariable or descriptive","genes":["JAK2"],"diseases":["ET"],"text":"In conventionally high-risk ET defined by a history of thrombosis, JAK2 mutation and/or cardiovascular risk factors provided only limited, non-significant additional thrombosis-risk enhancement, regardless of age."},{"id":"barbui-2015-blood-cancer-journal-5-e369-C0007","paper":"barbui-2015-blood-cancer-journal-5-e369","category":"prognosis","tier":"univariable or descriptive","genes":["JAK2"],"diseases":["ET"],"text":"In conventionally high-risk ET defined by age alone, JAK2 mutation with or without cardiovascular risk factors might increase thrombosis risk (P=0.05)."},{"id":"barbui-2015-blood-cancer-journal-5-e369-C0008","paper":"barbui-2015-blood-cancer-journal-5-e369","category":"prognosis","tier":"univariable or descriptive","genes":["JAK2"],"diseases":["ET"],"text":"In the revised ET thrombosis classification, very-low-risk disease is defined by no thrombosis history, age ≤60 years, and unmutated JAK2."},{"id":"barbui-2015-blood-cancer-journal-5-e369-C0009","paper":"barbui-2015-blood-cancer-journal-5-e369","category":"prognosis","tier":"univariable or descriptive","genes":["JAK2"],"diseases":["ET"],"text":"In the revised ET thrombosis classification, low-risk disease is defined by no thrombosis history, age ≤60 years, and mutated JAK2."},{"id":"barbui-2015-blood-cancer-journal-5-e369-C0010","paper":"barbui-2015-blood-cancer-journal-5-e369","category":"prognosis","tier":"univariable or descriptive","genes":["JAK2"],"diseases":["ET"],"text":"In the revised ET thrombosis classification, intermediate-risk disease is defined by no thrombosis history, age >60 years, and unmutated JAK2."},{"id":"barbui-2015-blood-cancer-journal-5-e369-C0011","paper":"barbui-2015-blood-cancer-journal-5-e369","category":"prognosis","tier":"univariable or descriptive","genes":["JAK2"],"diseases":["ET"],"text":"In the revised ET thrombosis classification, high-risk disease is defined by a history of thrombosis or by age >60 years together with JAK2 mutation."},{"id":"barbui-2015-blood-cancer-journal-5-e369-C0012","paper":"barbui-2015-blood-cancer-journal-5-e369","category":"treatment","tier":"univariable or descriptive","genes":["JAK2"],"diseases":["ET"],"text":"For revised very-low-risk ET (no thrombosis history, age ≤60 years, JAK2-unmutated) without cardiovascular risk factors, the authors would not insist on aspirin; they state that these treatment recommendations require prospective controlled-study evaluation."},{"id":"barbui-2015-blood-cancer-journal-5-e369-C0013","paper":"barbui-2015-blood-cancer-journal-5-e369","category":"treatment","tier":"univariable or descriptive","genes":["JAK2"],"diseases":["ET"],"text":"For revised very-low-risk ET (no thrombosis history, age ≤60 years, JAK2-unmutated) with cardiovascular risk factors, the authors advise once-daily aspirin; they state that these treatment recommendations require prospective controlled-study evaluation."},{"id":"barbui-2015-blood-cancer-journal-5-e369-C0014","paper":"barbui-2015-blood-cancer-journal-5-e369","category":"treatment","tier":"univariable or descriptive","genes":["JAK2"],"diseases":["ET"],"text":"For revised low-risk JAK2-mutated ET, twice-daily aspirin is considered reasonable but not mandated, especially when cardiovascular risk factors are present; the recommendation is pending prospective controlled-study evaluation."},{"id":"barbui-2015-blood-cancer-journal-5-e369-C0015","paper":"barbui-2015-blood-cancer-journal-5-e369","category":"treatment","tier":"univariable or descriptive","genes":["JAK2"],"diseases":["ET"],"text":"For revised intermediate-risk ET (no thrombosis history, age >60 years, JAK2-unmutated), the authors encourage cytoreductive therapy but would not insist on it; twice-daily aspirin may be used instead, pending prospective controlled-study evaluation."},{"id":"barbui-2015-blood-cancer-journal-5-e369-C0016","paper":"barbui-2015-blood-cancer-journal-5-e369","category":"treatment","tier":"univariable or descriptive","genes":["JAK2"],"diseases":["ET"],"text":"For revised high-risk ET (history of thrombosis, or age >60 years with JAK2 mutation), the authors encourage cytoreductive therapy, pending prospective controlled-study evaluation."},{"id":"bernard-2022-nejm-evidence-1-na-C0001","paper":"bernard-2022-nejm-evidence-1-na","category":"diagnosis","tier":"univariable or descriptive","genes":["TP53"],"diseases":["MDS"],"text":"In MDS, TP53 multihit status is defined by multiple TP53 mutations or by a TP53 mutation with loss of heterozygosity, including chromosomal deletion or copy-neutral LOH."},{"id":"bernard-2022-nejm-evidence-1-na-C0002","paper":"bernard-2022-nejm-evidence-1-na","category":"prognosis","tier":"multivariable-adjusted","genes":["TP53"],"diseases":["MDS"],"text":"In MDS, TP53 multihit, but not monoallelic TP53 mutation, is a strong adverse prognostic feature after adjustment for clinical confounders and IPSS-R."},{"id":"bernard-2022-nejm-evidence-1-na-C0003","paper":"bernard-2022-nejm-evidence-1-na","category":"prognosis","tier":"multivariable-adjusted","genes":["FLT3"],"diseases":["MDS"],"text":"In MDS, FLT3 mutations (ITD or TKD) are strong adverse prognostic features and were among the mutations with the strongest association with AML transformation."},{"id":"bernard-2022-nejm-evidence-1-na-C0004","paper":"bernard-2022-nejm-evidence-1-na","category":"prognosis","tier":"multivariable-adjusted","genes":["KMT2A"],"diseases":["MDS"],"text":"In MDS, KMT2A (MLL) partial tandem duplication is a strong adverse prognostic feature, with high risk of AML transformation and poor overall survival."},{"id":"bernard-2022-nejm-evidence-1-na-C0005","paper":"bernard-2022-nejm-evidence-1-na","category":"prognosis","tier":"multivariable-adjusted","genes":["ASXL1"],"diseases":["MDS"],"text":"In MDS, ASXL1 mutation was significantly associated with adverse risk for leukemia-free survival, overall survival, and AML transformation after adjustment for confounders and IPSS-R."},{"id":"bernard-2022-nejm-evidence-1-na-C0006","paper":"bernard-2022-nejm-evidence-1-na","category":"prognosis","tier":"multivariable-adjusted","genes":["BCOR"],"diseases":["MDS"],"text":"In MDS, BCOR mutation was significantly associated with adverse risk for leukemia-free survival, overall survival, and AML transformation after adjustment for confounders and IPSS-R."},{"id":"bernard-2022-nejm-evidence-1-na-C0007","paper":"bernard-2022-nejm-evidence-1-na","category":"prognosis","tier":"multivariable-adjusted","genes":["EZH2"],"diseases":["MDS"],"text":"In MDS, EZH2 mutation was significantly associated with adverse risk for leukemia-free survival, overall survival, and AML transformation after adjustment for confounders and IPSS-R."},{"id":"bernard-2022-nejm-evidence-1-na-C0008","paper":"bernard-2022-nejm-evidence-1-na","category":"prognosis","tier":"multivariable-adjusted","genes":["NRAS"],"diseases":["MDS"],"text":"In MDS, NRAS mutation was significantly associated with adverse risk for leukemia-free survival, overall survival, and AML transformation after adjustment for confounders and IPSS-R."},{"id":"bernard-2022-nejm-evidence-1-na-C0009","paper":"bernard-2022-nejm-evidence-1-na","category":"prognosis","tier":"multivariable-adjusted","genes":["RUNX1"],"diseases":["MDS"],"text":"In MDS, RUNX1 mutation was significantly associated with adverse risk for leukemia-free survival, overall survival, and AML transformation after adjustment for confounders and IPSS-R."},{"id":"bernard-2022-nejm-evidence-1-na-C0010","paper":"bernard-2022-nejm-evidence-1-na","category":"prognosis","tier":"multivariable-adjusted","genes":["STAG2"],"diseases":["MDS"],"text":"In MDS, STAG2 mutation was significantly associated with adverse risk for leukemia-free survival, overall survival, and AML transformation after adjustment for confounders and IPSS-R."},{"id":"bernard-2022-nejm-evidence-1-na-C0011","paper":"bernard-2022-nejm-evidence-1-na","category":"prognosis","tier":"multivariable-adjusted","genes":["U2AF1"],"diseases":["MDS"],"text":"In MDS, U2AF1 mutation was significantly associated with adverse risk for leukemia-free survival, overall survival, and AML transformation after adjustment for confounders and IPSS-R."},{"id":"bernard-2022-nejm-evidence-1-na-C0012","paper":"bernard-2022-nejm-evidence-1-na","category":"prognosis","tier":"univariable or descriptive","genes":["DDX41"],"diseases":["MDS"],"text":"In MDS, DDX41 mutation was associated with increased risk of AML transformation."},{"id":"bernard-2022-nejm-evidence-1-na-C0013","paper":"bernard-2022-nejm-evidence-1-na","category":"prognosis","tier":"univariable or descriptive","genes":["DDX41"],"diseases":["MDS"],"text":"In MDS, DDX41 mutation was associated with favorable overall survival, particularly in MDS with excess blasts, despite its association with AML transformation."},{"id":"bernard-2022-nejm-evidence-1-na-C0014","paper":"bernard-2022-nejm-evidence-1-na","category":"germline","tier":"univariable or descriptive","genes":["DDX41"],"diseases":["MDS"],"text":"In MDS, a biallelic DDX41 pattern with clonal and subclonal VAF peaks was considered suggestive of a germline DDX41 mutation followed by a secondary somatic hit."},{"id":"bernard-2022-nejm-evidence-1-na-C0015","paper":"bernard-2022-nejm-evidence-1-na","category":"prognosis","tier":"univariable or descriptive","genes":["SF3B1","BCOR","BCORL1","RUNX1","NRAS","STAG2","SRSF2"],"diseases":["MDS"],"text":"In MDS, favorable outcomes associated with SF3B1 mutation were confined to the SF3B1a subgroup; this subgroup excludes comutations in BCOR, BCORL1, RUNX1, NRAS, STAG2, SRSF2, and del(5q)."},{"id":"bernard-2022-nejm-evidence-1-na-C0016","paper":"bernard-2022-nejm-evidence-1-na","category":"prognosis","tier":"univariable or descriptive","genes":["SF3B1","BCOR","BCORL1","NRAS","RUNX1","SRSF2","STAG2"],"diseases":["MDS"],"text":"In MDS, the favorable prognostic association of SF3B1 mutation was not observed in the SF3B1b subgroup defined by comutation with BCOR, BCORL1, NRAS, RUNX1, SRSF2, or STAG2."},{"id":"bernard-2022-nejm-evidence-1-na-C0017","paper":"bernard-2022-nejm-evidence-1-na","category":"prognosis","tier":"univariable or descriptive","genes":["SF3B1"],"diseases":["MDS"],"text":"In MDS, the favorable prognostic association of SF3B1 mutation was not observed in the SF3B15q subgroup with concomitant isolated del(5q)."},{"id":"bernard-2022-nejm-evidence-1-na-C0018","paper":"bernard-2022-nejm-evidence-1-na","category":"biomarker","tier":"univariable or descriptive","genes":["SF3B1","BCOR","BCORL1","NRAS","RUNX1","SRSF2","STAG2"],"diseases":["MDS"],"text":"For prognostic interpretation in MDS, SF3B1-mutated cases should be distinguished by comutation-defined genetic subset rather than treating all SF3B1 mutations as uniformly favorable."},{"id":"bernard-2022-nejm-evidence-1-na-C0019","paper":"bernard-2022-nejm-evidence-1-na","category":"prognosis","tier":"multivariable-adjusted","genes":["NPM1"],"diseases":["MDS"],"text":"In the adjusted IPSS-M leukemia-free-survival model for MDS, NPM1 mutation is a main-effect feature with adjusted hazard ratio 1.54 (0.78–3.02) and model weight 0.430."},{"id":"bernard-2022-nejm-evidence-1-na-C0020","paper":"bernard-2022-nejm-evidence-1-na","category":"prognosis","tier":"multivariable-adjusted","genes":["ETV6"],"diseases":["MDS"],"text":"In the adjusted IPSS-M leukemia-free-survival model for MDS, ETV6 mutation is a main-effect feature with adjusted hazard ratio 1.48 (0.98–2.23) and model weight 0.391."},{"id":"bernard-2022-nejm-evidence-1-na-C0021","paper":"bernard-2022-nejm-evidence-1-na","category":"prognosis","tier":"multivariable-adjusted","genes":["IDH2"],"diseases":["MDS"],"text":"In the adjusted IPSS-M leukemia-free-survival model for MDS, IDH2 mutation is a main-effect feature with adjusted hazard ratio 1.46 (1.05–2.02) and model weight 0.379."},{"id":"bernard-2022-nejm-evidence-1-na-C0022","paper":"bernard-2022-nejm-evidence-1-na","category":"prognosis","tier":"multivariable-adjusted","genes":["CBL"],"diseases":["MDS"],"text":"In the adjusted IPSS-M leukemia-free-survival model for MDS, CBL mutation is a main-effect feature with adjusted hazard ratio 1.34 (0.99–1.82) and model weight 0.295."},{"id":"bernard-2022-nejm-evidence-1-na-C0023","paper":"bernard-2022-nejm-evidence-1-na","category":"prognosis","tier":"multivariable-adjusted","genes":["SRSF2"],"diseases":["MDS"],"text":"In the adjusted IPSS-M leukemia-free-survival model for MDS, SRSF2 mutation is a main-effect feature with adjusted hazard ratio 1.27 (1.03–1.56) and model weight 0.239."},{"id":"bernard-2022-nejm-evidence-1-na-C0024","paper":"bernard-2022-nejm-evidence-1-na","category":"prognosis","tier":"multivariable-adjusted","genes":["DNMT3A"],"diseases":["MDS"],"text":"In the adjusted IPSS-M leukemia-free-survival model for MDS, DNMT3A mutation is a main-effect feature with adjusted hazard ratio 1.25 (1.02–1.53) and model weight 0.221."},{"id":"bernard-2022-nejm-evidence-1-na-C0025","paper":"bernard-2022-nejm-evidence-1-na","category":"prognosis","tier":"multivariable-adjusted","genes":["KRAS"],"diseases":["MDS"],"text":"In the adjusted IPSS-M leukemia-free-survival model for MDS, KRAS mutation is a main-effect feature with adjusted hazard ratio 1.22 (0.84–1.77) and model weight 0.202."},{"id":"bernard-2022-nejm-evidence-1-na-C0026","paper":"bernard-2022-nejm-evidence-1-na","category":"prognosis","tier":"univariable or descriptive","genes":["BCOR","BCORL1","CEBPA","ETNK1","GATA2","GNB1","IDH1","NF1","PHF6","PPM1D","PRPF8","PTPN11","SETBP1","STAG2","WT1"],"diseases":["MDS"],"text":"In MDS, IPSS-M captures residual adverse molecular risk by counting mutations in BCOR, BCORL1, CEBPA, ETNK1, GATA2, GNB1, IDH1, NF1, PHF6, PPM1D, PRPF8, PTPN11, SETBP1, STAG2, and WT1; the residual mutation-count contribution is capped at two mutations."},{"id":"bernard-2022-nejm-evidence-1-na-C0027","paper":"bernard-2022-nejm-evidence-1-na","category":"prognosis","tier":"univariable or descriptive","genes":["ASXL1","CBL","DNMT3A","ETV6","EZH2","FLT3","IDH2","KRAS","KMT2A","NPM1","NRAS","RUNX1","SF3B1","SRSF2","TP53","U2AF1"],"diseases":["MDS"],"text":"For the 16 IPSS-M main-effect prognostic genes in MDS, mutation VAF is not used to weight mutations; the model uses binary gene features, with TP53 allelic state and SF3B1 genetic subsets encoded separately because of their differential outcome effects."},{"id":"bernard-2022-nejm-evidence-1-na-C0028","paper":"bernard-2022-nejm-evidence-1-na","category":"prognosis","tier":"univariable or descriptive","genes":["ASXL1","CBL","DNMT3A","ETV6","EZH2","FLT3","IDH2","KRAS","KMT2A","NPM1","NRAS","RUNX1","SF3B1","SRSF2","TP53","U2AF1","BCOR","BCORL1","CEBPA","ETNK1","GATA2","GNB1","IDH1","NF1","PHF6","PPM1D","PRPF8","PTPN11","SETBP1","STAG2","WT1"],"diseases":["MDS"],"text":"In MDS, an IPSS-M score of 0 represents the average patient; scores of -1, 1, and 2 correspond to approximately half, double, and fourfold risk, respectively, relative to the average patient."},{"id":"bernard-2022-nejm-evidence-1-na-C0029","paper":"bernard-2022-nejm-evidence-1-na","category":"prognosis","tier":"univariable or descriptive","genes":["ASXL1","CBL","DNMT3A","ETV6","EZH2","FLT3","IDH2","KRAS","KMT2A","NPM1","NRAS","RUNX1","SF3B1","SRSF2","TP53","U2AF1","BCOR","BCORL1","CEBPA","ETNK1","GATA2","GNB1","IDH1","NF1","PHF6","PPM1D","PRPF8","PTPN11","SETBP1","STAG2","WT1"],"diseases":["MDS"],"text":"In MDS, the IPSS-M very low risk category had a median leukemia-free survival of 9.7 years in the discovery cohort."},{"id":"bernard-2022-nejm-evidence-1-na-C0030","paper":"bernard-2022-nejm-evidence-1-na","category":"prognosis","tier":"univariable or descriptive","genes":["ASXL1","CBL","DNMT3A","ETV6","EZH2","FLT3","IDH2","KRAS","KMT2A","NPM1","NRAS","RUNX1","SF3B1","SRSF2","TP53","U2AF1","BCOR","BCORL1","CEBPA","ETNK1","GATA2","GNB1","IDH1","NF1","PHF6","PPM1D","PRPF8","PTPN11","SETBP1","STAG2","WT1"],"diseases":["MDS"],"text":"In MDS, the IPSS-M very low risk category had a median overall survival of 10.6 years in the discovery cohort."},{"id":"bernard-2022-nejm-evidence-1-na-C0031","paper":"bernard-2022-nejm-evidence-1-na","category":"prognosis","tier":"univariable or descriptive","genes":["ASXL1","CBL","DNMT3A","ETV6","EZH2","FLT3","IDH2","KRAS","KMT2A","NPM1","NRAS","RUNX1","SF3B1","SRSF2","TP53","U2AF1","BCOR","BCORL1","CEBPA","ETNK1","GATA2","GNB1","IDH1","NF1","PHF6","PPM1D","PRPF8","PTPN11","SETBP1","STAG2","WT1"],"diseases":["MDS"],"text":"In MDS, the IPSS-M very low risk category had AML-transformation incidences of 0.0% at 1 year, 1.2% at 2 years, and 2.8% at 4 years in the discovery cohort."},{"id":"bernard-2022-nejm-evidence-1-na-C0032","paper":"bernard-2022-nejm-evidence-1-na","category":"prognosis","tier":"univariable or descriptive","genes":["ASXL1","CBL","DNMT3A","ETV6","EZH2","FLT3","IDH2","KRAS","KMT2A","NPM1","NRAS","RUNX1","SF3B1","SRSF2","TP53","U2AF1","BCOR","BCORL1","CEBPA","ETNK1","GATA2","GNB1","IDH1","NF1","PHF6","PPM1D","PRPF8","PTPN11","SETBP1","STAG2","WT1"],"diseases":["MDS"],"text":"In MDS, the IPSS-M low risk category had a median leukemia-free survival of 5.9 years in the discovery cohort."},{"id":"bernard-2022-nejm-evidence-1-na-C0033","paper":"bernard-2022-nejm-evidence-1-na","category":"prognosis","tier":"univariable or descriptive","genes":["ASXL1","CBL","DNMT3A","ETV6","EZH2","FLT3","IDH2","KRAS","KMT2A","NPM1","NRAS","RUNX1","SF3B1","SRSF2","TP53","U2AF1","BCOR","BCORL1","CEBPA","ETNK1","GATA2","GNB1","IDH1","NF1","PHF6","PPM1D","PRPF8","PTPN11","SETBP1","STAG2","WT1"],"diseases":["MDS"],"text":"In MDS, the IPSS-M low risk category had a median overall survival of 6.0 years in the discovery cohort."},{"id":"bernard-2022-nejm-evidence-1-na-C0034","paper":"bernard-2022-nejm-evidence-1-na","category":"prognosis","tier":"univariable or descriptive","genes":["ASXL1","CBL","DNMT3A","ETV6","EZH2","FLT3","IDH2","KRAS","KMT2A","NPM1","NRAS","RUNX1","SF3B1","SRSF2","TP53","U2AF1","BCOR","BCORL1","CEBPA","ETNK1","GATA2","GNB1","IDH1","NF1","PHF6","PPM1D","PRPF8","PTPN11","SETBP1","STAG2","WT1"],"diseases":["MDS"],"text":"In MDS, the IPSS-M low risk category had AML-transformation incidences of 1.7% at 1 year, 3.4% at 2 years, and 5.1% at 4 years in the discovery cohort."},{"id":"bernard-2022-nejm-evidence-1-na-C0035","paper":"bernard-2022-nejm-evidence-1-na","category":"prognosis","tier":"univariable or descriptive","g urvival of 2.3 years in the discovery cohort."},{"id":"bernard-2022-nejm-evidence-1-na-C0039","paper":"bernard-2022-nejm-evidence-1-na","category":"prognosis","tier":"univariable or descriptive","genes":["ASXL1","CBL","DNMT3A","ETV6","EZH2","FLT3","IDH2","KRAS","KMT2A","NPM1","NRAS","RUNX1","SF3B1","SRSF2","TP53","U2AF1","BCOR","BCORL1","CEBPA","ETNK1","GATA2","GNB1","IDH1","NF1","PHF6","PPM1D","PRPF8","PTPN11","SETBP1","STAG2","WT1"],"diseases":["MDS"],"text":"In MDS, the IPSS-M moderate high risk category had a median overall survival of 2.8 years in the discovery cohort."},{"id":"bernard-2022-nejm-evidence-1-na-C0040","paper":"bernard-2022-nejm-evidence-1-na","category":"prognosis","tier":"univariable or descriptive","genes":["ASXL1","CBL","DNMT3A","ETV6","EZH2","FLT3","IDH2","KRAS","KMT2A","NPM1","NRAS","RUNX1","SF3B1","SRSF2","TP53","U2AF1","BCOR","BCORL1","CEBPA","ETNK1","GATA2","GNB1","IDH1","NF1","PHF6","PPM1D","PRPF8","PTPN11","SETBP1","STAG2","WT1"],"diseases":["MDS"],"text":"In MDS, the IPSS-M moderate high risk category had AML-transformation incidences of 9.5% at 1 year, 14.0% at 2 years, and 18.9% at 4 years in the discovery cohort."},{"id":"bernard-2022-nejm-evidence-1-na-C0041","paper":"bernard-2022-nejm-evidence-1-na","category":"prognosis","tier":"univariable or descriptive","genes":["ASXL1","CBL","DNMT3A","ETV6","EZH2","FLT3","IDH2","KRAS","KMT2A","NPM1","NRAS","RUNX1","SF3B1","SRSF2","TP53","U2AF1","BCOR","BCORL1","CEBPA","ETNK1","GATA2","GNB1","IDH1","NF1","PHF6","PPM1D","PRPF8","PTPN11","SETBP1","STAG2","WT1"],"diseases":["MDS"],"text":"In MDS, the IPSS-M high risk category had a median leukemia-free survival of 1.5 years in the discovery cohort."},{"id":"bernard-2022-nejm-evidence-1-na-C0042","paper":"bernard-2022-nejm-evidence-1-na","category":"prognosis","tier":"univariable or descriptive","genes":["ASXL1","CBL","DNMT3A","ETV6","EZH2","FLT3","IDH2","KRAS","KMT2A","NPM1","NRAS","RUNX1","SF3B1","SRSF2","TP53","U2AF1","BCOR","BCORL1","CEBPA","ETNK1","GATA2","GNB1","IDH1","NF1","PHF6","PPM1D","PRPF8","PTPN11","SETBP1","STAG2","WT1"],"diseases":["MDS"],"text":"In MDS, the IPSS-M high risk category had a median overall survival of 1.7 years in the discovery cohort."},{"id":"bernard-2022-nejm-evidence-1-na-C0043","paper":"bernard-2022-nejm-evidence-1-na","category":"prognosis","tier":"univariable or descriptive","genes":["ASXL1","CBL","DNMT3A","ETV6","EZH2","FLT3","IDH2","KRAS","KMT2A","NPM1","NRAS","RUNX1","SF3B1","SRSF2","TP53","U2AF1","BCOR","BCORL1","CEBPA","ETNK1","GATA2","GNB1","IDH1","NF1","PHF6","PPM1D","PRPF8","PTPN11","SETBP1","STAG2","WT1"],"diseases":["MDS"],"text":"In MDS, the IPSS-M high risk category had AML-transformation incidences of 14.3% at 1 year, 21.2% at 2 years, and 29.2% at 4 years in the discovery cohort."},{"id":"bernard-2022-nejm-evidence-1-na-C0044","paper":"bernard-2022-nejm-evidence-1-na","category":"prognosis","tier":"univariable or descriptive","genes":["ASXL1","CBL","DNMT3A","ETV6","EZH2","FLT3","IDH2","KRAS","KMT2A","NPM1","NRAS","RUNX1","SF3B1","SRSF2","TP53","U2AF1","BCOR","BCORL1","CEBPA","ETNK1","GATA2","GNB1","IDH1","NF1","PHF6","PPM1D","PRPF8","PTPN11","SETBP1","STAG2","WT1"],"diseases":["MDS"],"text":"In MDS, the IPSS-M very high risk category had a median leukemia-free survival of 0.76 years in the discovery cohort."},{"id":"bernard-2022-nejm-evidence-1-na-C0045","paper":"bernard-2022-nejm-evidence-1-na","category":"prognosis","tier":"univariable or descriptive","genes":["ASXL1","CBL","DNMT3A","ETV6","EZH2","FLT3","IDH2","KRAS","KMT2A","NPM1","NRAS","RUNX1","SF3B1","SRSF2","TP53","U2AF1","BCOR","BCORL1","CEBPA","ETNK1","GATA2","GNB1","IDH1","NF1","PHF6","PPM1D","PRPF8","PTPN11","SETBP1","STAG2","WT1"],"diseases":["MDS"],"text":"In MDS, the IPSS-M very high risk category had a median overall survival of 1.0 years in the discovery cohort."},{"id":"bernard-2022-nejm-evidence-1-na-C0046","paper":"bernard-2022-nejm-evidence-1-na","category":"prognosis","tier":"univariable or descriptive","genes":["ASXL1","CBL","DNMT3A","ETV6","EZH2","FLT3","IDH2","KRAS","KMT2A","NPM1","NRAS","RUNX1","SF3B1","SRSF2","TP53","U2AF1","BCOR","BCORL1","CEBPA","ETNK1","GATA2","GNB1","IDH1","NF1","PHF6","PPM1D","PRPF8","PTPN11","SETBP1","STAG2","WT1"],"diseases":["MDS"],"text":"In MDS, the IPSS-M very high risk category had AML-transformation incidences of 28.2% at 1 year, 38.6% at 2 years, and 42.8% at 4 years in the discovery cohort."},{"id":"bernard-2022-nejm-evidence-1-na-C0047","paper":"bernard-2022-nejm-evidence-1-na","category":"treatment","tier":"univariable or descriptive","genes":["TP53"],"diseases":["MDS"],"text":"Among patients with MDS treated with hypomethylating agents, stem-cell transplantation, or lenalidomide, TP53 multihit remained the strongest predictor of worse overall survival across these treatment modalities."},{"id":"bernard-2022-nejm-evidence-1-na-C0048","paper":"bernard-2022-nejm-evidence-1-na","category":"treatment","tier":"univariable or descriptive","genes":["DDX41"],"diseases":["MDS"],"text":"In MDS, DDX41 mutation was associated with favorable overall survival after hypomethylating-agent treatment, but the authors state that this treatment-specific association requires confirmation in randomized studies."},{"id":"bernard-2022-nejm-evidence-1-na-C0049","paper":"bernard-2022-nejm-evidence-1-na","category":"treatment","tier":"restated secondary","genes":[],"diseases":["MDS"],"text":"Patients with higher-risk MDS are considered for disease-modifying and survival-prolonging treatment strategies, including hypomethylating agents and allogeneic transplantation."},{"id":"bernard-2022-nejm-evidence-1-na-C0050","paper":"bernard-2022-nejm-evidence-1-na","category":"biomarker","tier":"multivariable-adjusted","genes":["TP53","FLT3","KMT2A"],"diseases":["MDS"],"text":"In MDS, the authors highlight screening at diagnosis for TP53 multihit, FLT3 mutation, and KMT2A (MLL) partial tandem duplication because these were strong adverse outcome predictors."},{"id":"bolton-2020-chemo-ch-C0001","paper":"bolton-2020-chemo-ch","category":"treatment","tier":"univariable or descriptive","genes":["TP53","PPM1D","CHEK2"],"diseases":["CHIP"],"text":"In clonal hematopoiesis, radiation, platinum, and topoisomerase II inhibitor therapy preferentially selects TP53-, PPM1D-, and CHEK2-mutant DNA-damage-response clones; serial sampling showed DDR clones outcompete other clones under therapy."},{"id":"bolton-2020-chemo-ch-C0003","paper":"bolton-2020-chemo-ch","category":"prognosis","tier":"multivariable-adjusted","genes":["TP53"],"diseases":["CHIP"],"text":"Among cancer patients exposed to cancer therapy, TP53-mutated clonal hematopoiesis showed one of the strongest gene-level associations with subsequent therapy-related myeloid neoplasm risk."},{"id":"bolton-2020-chemo-ch-C0004","paper":"bolton-2020-chemo-ch","category":"prognosis","tier":"multivariable-adjusted","genes":["SRSF2","U2AF1","SF3B1"],"diseases":["CHIP"],"text":"Among cancer patients exposed to cancer therapy, clonal hematopoiesis with spliceosome-gene mutations in SRSF2, U2AF1, or SF3B1 was among the strongest gene-level associations with subsequent therapy-related myeloid neoplasm risk."},{"id":"cloos-2026-blood-147-1147-C0001","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["NPM1"],"diseases":["AML"],"text":"In NPM1-mutated AML after 2 chemotherapy cycles, MRD positivity is formally interpreted in peripheral blood rather than bone marrow; a positive peripheral-blood result is a warning response, not high risk of treatment failure, because the postremission transplant-versus-consolidation decision remains uncertain."},{"id":"cloos-2026-blood-147-1147-C0002","paper":"cloos-2026-blood-147-1147","category":"prognosis","tier":"guideline criterion","genes":["NPM1"],"diseases":["AML"],"text":"For NPM1-mutated AML at end of treatment, 0.1% NPM1/ABL1 in bone marrow is the guideline MRD-positivity threshold with demonstrated prognostic significance; levels around 2% are typically close to hematologic relapse and may leave insufficient time for preemptive escalation."},{"id":"cloos-2026-blood-147-1147-C0003","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["NPM1"],"diseases":["AML"],"text":"During follow-up of NPM1-mutated AML, conversion to detectable peripheral-blood NPM1 MRD at ≥0.01% defines MRD relapse. If MRD was never negative, a ≥1-log10 rise from the nadir in the same tissue defines relapse; qPCR relapse should be confirmed within 4 weeks, preferably in paired blood and marrow."},{"id":"cloos-2026-blood-147-1147-C0004","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["NPM1"],"diseases":["AML"],"text":"During follow-up of NPM1-mutated AML, conversion to detectable bone-marrow NPM1 MRD at ≥0.1% defines MRD relapse. If MRD was never negative, a ≥1-log10 rise from the nadir in the same tissue defines relapse; confirmation within 4 weeks is preferred unless marrow NPM1/ABL1 is ≥1%."},{"id":"cloos-2026-blood-147-1147-C0005","paper":"cloos-2026-blood-147-1147","category":"prognosis","tier":"restated secondary","genes":["NPM1"],"diseases":["AML"],"text":"In NPM1-mutated AML, MRD relapse is strongly correlated with impending clinical relapse."},{"id":"cloos-2026-blood-147-1147-C0006","paper":"cloos-2026-blood-147-1147","category":"treatment","tier":"restated secondary","genes":["NPM1"],"diseases":["AML"],"text":"For NPM1-mutated AML at ELN-defined MRD relapse, evidence supports initiating antileukemic therapy before morphologic relapse as a feasible and effective preemptive strategy."},{"id":"cloos-2026-blood-147-1147-C0007","paper":"cloos-2026-blood-147-1147","category":"treatment","tier":"guideline criterion","genes":["NPM1"],"diseases":["AML"],"text":"For NPM1-mutated AML with MRD relapse, allogeneic hematopoietic cell transplantation should be strongly considered."},{"id":"cloos-2026-blood-147-1147-C0008","paper":"cloos-2026-blood-147-1147","category":"prognosis","tier":"guideline criterion","genes":["NPM1"],"diseases":["AML"],"text":"NPM1 qPCR MRD has prognostic value in AML treated with a hypomethylating agent plus venetoclax, although its clinical utility in this nonintensive setting remains under development."},{"id":"cloos-2026-blood-147-1147-C0009","paper":"cloos-2026-blood-147-1147","category":"prognosis","tier":"guideline criterion","genes":["NPM1"],"diseases":["AML"],"text":"For NPM1-mutated AML, persistence of mutated NPM1 at VAF ≥0.01% in genomic DNA from peripheral blood or bone marrow may identify increased risk of relapse and mortality; this use requires further validation."},{"id":"cloos-2026-blood-147-1147-C0010","paper":"cloos-2026-blood-147-1147","category":"prognosis","tier":"restated secondary","genes":["NPM1","FLT3"],"diseases":["AML"],"text":"In AML with both NPM1 mutation and FLT3-ITD, persistence of MRD by either NPM1 qPCR or FLT3-ITD UHS-NGS is associated with increased risk compared with testing negative."},{"id":"cloos-2026-blood-147-1147-C0011","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["NPM1","FLT3"],"diseases":["AML"],"text":"In AML with both NPM1 mutation and FLT3-ITD, NPM1 MRD can serve as the stand-alone molecular MRD marker when FLT3-ITD UHS-NGS is unavailable."},{"id":"cloos-2026-blood-147-1147-C0012","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["FLT3"],"diseases":["AML"],"text":"For FLT3-ITD AML, UHS-NGS MRD assessment is strongly supported after two treatment cycles and before alloHCT."},{"id":"cloos-2026-blood-147-1147-C0013","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["FLT3"],"diseases":["AML"],"text":"For FLT3-ITD AML, UHS-NGS MRD monitoring at end of treatment and during follow-up is recommended on the basis of expert consensus and more limited evidence."},{"id":"cloos-2026-blood-147-1147-C0014","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["FLT3"],"diseases":["AML"],"text":"For FLT3-ITD AML by UHS-NGS, MRD positivity is defined as a level greater than the assay limit of detection; the guideline states that assay sensitivity must reach at least 0.01%."},{"id":"cloos-2026-blood-147-1147-C0015","paper":"cloos-2026-blood-147-1147","category":"prognosis","tier":"guideline criterion","genes":["FLT3"],"diseases":["AML"],"text":"In FLT3-ITD AML after two intensive-chemotherapy cycles or before alloHCT, UHS-NGS MRD at or above the assay LOD is MRD positive and classified as high risk of treatment failure; bone marrow is preferred over peripheral blood."},{"id":"cloos-2026-blood-147-1147-C0016","paper":"cloos-2026-blood-147-1147","category":"prognosis","tier":"guideline criterion","genes":["FLT3"],"diseases":["AML"],"text":"In FLT3-ITD–mutated AML at end of treatment, UHS-NGS MRD at or above the assay limit of detection is classified as MRD positive and high risk of treatment failure; bone marrow is preferred over peripheral blood. The guideline notes that evidence for FLT3-ITD UHS-NGS at EOT is limited and states that the LOD must be at least 0.01% VAF."},{"id":"cloos-2026-blood-147-1147-C0017","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["FLT3"],"diseases":["AML"],"text":"During follow-up of FLT3-ITD AML, UHS-NGS MRD at or above the assay LOD defines MRD relapse in peripheral blood or bone marrow. Repeat confirmation may be omitted because relapse can be imminent, but low-level results from the LOD to <0.01% VAF should be promptly repeated, especially for a clone differing from diagnosis."},{"id":"cloos-2026-blood-147-1147-C0018","paper":"cloos-2026-blood-147-1147","category":"prognosis","tier":"guideline criterion","genes":["FLT3"],"diseases":["AML"],"text":"FLT3-ITD UHS-NGS MRD identifies AML patients at increased risk of relapse and death."},{"id":"cloos-2026-blood-147-1147-C0019","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["FLT3"],"diseases":["AML"],"text":"During follow-up of FLT3-ITD AML, FLT3-ITD should not be used as the sole MRD marker when another marker is available because relapse can occur without FLT3-ITD."},{"id":"cloos-2026-blood-147-1147-C0020","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["FLT3"],"diseases":["AML"],"text":"When multiple FLT3-ITD clones are detected by UHS-NGS MRD testing, report the VAF and sequence of each clone; use the major clone to determine MRD level and also report the summed VAF if possible."},{"id":"cloos-2026-blood-147-1147-C0021","paper":"cloos-2026-blood-147-1147","category":"treatment","tier":"guideline criterion","genes":["FLT3"],"diseases":["AML"],"text":"In FLT3-mutated AML after alloHCT, sorafenib maintenance is effective independent of pretransplant MFC-MRD status."},{"id":"cloos-2026-blood-147-1147-C0022","paper":"cloos-2026-blood-147-1147","category":"treatment","tier":"guideline criterion","genes":["FLT3","NPM1"],"diseases":["AML"],"text":"In FLT3-ITD AML, post-alloHCT gilteritinib is recommended for patients with UHS-NGS MRD positivity before transplant or around day 30 after transplant; the reported benefit was especially evident with one FLT3-ITD clone and co-mutated NPM1."},{"id":"cloos-2026-blood-147-1147-C0023","paper":"cloos-2026-blood-147-1147","category":"treatment","tier":"restated secondary","genes":["FLT3"],"diseases":["AML"],"text":"In FLT3-mutated AML, quizartinib maintenance following intensive chemotherapy appears effective irrespective of MRD status; post-alloHCT maintenance data remain limited, and initiation of maintenance has not been assessed in a randomized trial."},{"id":"cloos-2026-blood-147-1147-C0024","paper":"cloos-2026-blood-147-1147","category":"treatment","tier":"guideline criterion","genes":["FLT3"],"diseases":["AML"],"text":"For AML patients receiving standard-of-care FLT3-inhibitor maintenance, evidence is very limited to support stopping treatment on the basis of MRD results."},{"id":"cloos-2026-blood-147-1147-C0025","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["RUNX1","RUNX1T1","CBFB","MYH11"],"diseases":["AML"],"text":"For core-binding-factor AML with RUNX1::RUNX1T1 or CBFB::MYH11, a ≥3-log reduction from diagnostic baseline is recommended to stratify relapse risk; log reduction should use the same tissue, bone marrow is preferred, and the diagnostic transcript level must be established."},{"id":"cloos-2026-blood-147-1147-C0026","paper":"cloos-2026-blood-147-1147","category":"prognosis","tier":"guideline criterion","genes":["RUNX1","RUNX1T1","CBFB","MYH11"],"diseases":["AML"],"text":"For core-binding-factor AML after two intensive-chemotherapy cycles or before alloHCT, <3-log10 reduction of RUNX1::RUNX1T1 or CBFB::MYH11 transcript from diagnosis is MRD positive and classified as a warning response."},{"id":"cloos-2026-blood-147-1147-C0027","paper":"cloos-2026-blood-147-1147","category":"prognosis","tier":"guideline criterion","genes":["RUNX1","RUNX1T1","CBFB","MYH11"],"diseases":["AML"],"text":"For core-binding-factor AML at end of treatment, <3-log10 reduction of RUNX1::RUNX1T1 or CBFB::MYH11 transcript from diagnosis is MRD positive and classified as high risk of treatment failure."},{"id":"cloos-2026-blood-147-1147-C0028","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["RUNX1","RUNX1T1","CBFB","MYH11"],"diseases":["AML"],"text":"During follow-up of core-binding-factor AML, conversion to detectable RUNX1::RUNX1T1 or CBFB::MYH11 transcript at ≥0.1% defines MRD relapse in peripheral blood or bone marrow. If MRD was never negative, a ≥1-log10 rise from nadir in the same tissue defines relapse; qPCR relapse should be confirmed within 4 weeks."},{"id":"cloos-2026-blood-147-1147-C0029","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["RUNX1","RUNX1T1","CBFB","MYH11"],"diseases":["AML"],"text":"In core-binding-factor AML, low-level RUNX1::RUNX1T1 or CBFB::MYH11 positivity at end of treatment can persist in patients who never relapse and may arise from fusion-bearing mast cells; the MRD-relapse threshold was redefined to reduce overtreatment of such low-level positivity."},{"id":"cloos-2026-blood-147-1147-C0030","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["PML","RARA"],"diseases":["APL"],"text":"In acute promyelocytic leukemia, PML::RARA MRD monitoring is recommended at end of treatment rather than during ongoing therapy."},{"id":"cloos-2026-blood-147-1147-C0031","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["PML","RARA"],"diseases":["APL"],"text":"In acute promyelocytic leukemia, PML::RARA MRD positivity at end of treatment is a warning response rather than definitive treatment failure because stable low-level MRD may persist transiently."},{"id":"cloos-2026-blood-147-1147-C0032","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["PML","RARA"],"diseases":["APL"],"text":"For acute promyelocytic leukemia with PML::RARA MRD positivity at end of treatment, regular post-EOT MRD monitoring is advised to document stability or conversion to MRD negativity."},{"id":"cloos-2026-blood-147-1147-C0033","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["PML","RARA"],"diseases":["APL"],"text":"Routine PML::RARA MRD follow-up in acute promyelocytic leukemia is recommended only for high-risk patients who did not receive arsenic trioxide, reflecting the very low relapse risk after ATO-based regimens."},{"id":"cloos-2026-blood-147-1147-C0034","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["PML","RARA"],"diseases":["APL"],"text":"For PML::RARA MRD follow-up in acute promyelocytic leukemia, bone marrow is preferred over peripheral blood because peripheral blood typically becomes MRD positive almost concurrently with hematologic relapse and therefore has limited value for early detection."},{"id":"cloos-2026-blood-147-1147-C0035","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["PML","RARA"],"diseases":["APL"],"text":"During follow-up of acute promyelocytic leukemia, conversion to detectable bone-marrow PML::RARA at ≥0.001% defines MRD relapse. If MRD was never negative, a ≥1-log10 rise from nadir in the same tissue defines relapse; qPCR relapse should be confirmed within 4 weeks."},{"id":"cloos-2026-blood-147-1147-C0037","paper":"cloos-2026-blood-147-1147","category":"treatment","tier":"guideline criterion","genes":["KMT2A"],"diseases":["AML"],"text":"For KMT2A-rearranged AML, MRD assays are available or under development, but the role of clinical intervention for persistent fusion-gene MRD at specific thresholds and treatment time points remains unestablished."},{"id":"cloos-2026-blood-147-1147-C0038","paper":"cloos-2026-blood-147-1147","category":"germline","tier":"guideline criterion","genes":["ANKRD26","CEBPA","DDX41","ETV6","GATA2","RUNX1","TP53"],"diseases":["AML"],"text":"In AML remission after intensive chemotherapy and before alloHCT, variants in germline-predisposition genes such as ANKRD26, CEBPA, DDX41, ETV6, GATA2, RUNX1 and TP53 are not prognostic for MRD and should not be counted toward MRD status at those time points."},{"id":"cloos-2026-blood-147-1147-C0039","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["DNMT3A","TET2","ASXL1"],"diseases":["AML"],"text":"In AML remission after intensive chemotherapy and before alloHCT, age-related clonal-hematopoiesis variants in DNMT3A, TET2 and ASXL1 are not prognostic for MRD and should not be counted toward MRD status at those time points."},{"id":"cloos-2026-blood-147-1147-C0040","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["NPM1"],"diseases":["AML"],"text":"For NPM1-mutated AML after alloHCT, serial UHS-NGS monitoring using the diagnostic NPM1 marker is an implemented example of posttransplant molecular MRD surveillance; the guideline states that this serial diagnostic-marker approach correlates with impending relapse and that broader gene use requires rigorous validation."},{"id":"cloos-2026-blood-147-1147-C0041","paper":"cloos-2026-blood-147-1147","category":"prognosis","tier":"restated secondary","genes":["TP53","IDH1","CEBPA"],"diseases":["AML"],"text":"For AML at the selected pre-alloHCT time points reviewed in this guideline, residual TP53, IDH1 or bZIP-mutated CEBPA detected by UHS-NGS did not show a prognostic effect."},{"id":"cloos-2026-blood-147-1147-C0042","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["NPM1","FLT3","PML","RARA","RUNX1","RUNX1T1","CBFB","MYH11","KMT2A","WT1","MECOM"],"diseases":["AML"],"text":"For AML molecular MRD, validated leukemia-specific assays targeting NPM1, FLT3-ITD, PML::RARA, RUNX1::RUNX1T1, CBFB::MYH11 or KMT2A rearrangements are preferred over less-specific WT1 or MECOM/EVI1 expression markers."},{"id":"cloos-2026-blood-147-1147-C0043","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["NPM1","FLT3","PML","RARA"],"diseases":["AML"],"text":"When monitoring a rare NPM1 variant, very large FLT3-ITD, or uncommon noncanonical PML::RARA transcript in AML, analyte detectability should first be confirmed at diagnosis with the intended MRD assay before longitudinal monitoring."},{"id":"cloos-2026-blood-147-1147-C0044","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["FLT3"],"diseases":["AML"],"text":"For FLT3-ITD AML monitored by UHS-NGS, no warning category is defined at any time because current evidence does not support a safe or stable low-level MRD range."},{"id":"cloos-2026-blood-147-1147-C0045","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["PML","RARA"],"diseases":["APL"],"text":"For PML::RARA in acute promyelocytic leukemia during follow-up, no warning category is defined because current evidence does not support a safe or stable low-level MRD range during follow-up."},{"id":"cloos-2026-blood-147-1147-C0046","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["NPM1"],"diseases":["AML"],"text":"In NPM1-mutated AML, MRD levels are approximately tenfold higher in bone marrow than peripheral blood, so tissue-specific positivity thresholds are used; MRD negativity is defined as <0.001% NPM1/ABL1 or meeting the qualitative undetectable criterion with adequate ABL1 copies in either tissue."},{"id":"cloos-2026-blood-147-1147-C0047","paper":"cloos-2026-blood-147-1147","category":"biomarker","tier":"guideline criterion","genes":["CEBPA"],"diseases":["AML"],"text":"For CEBPA bZIP in-frame AML after two cycles of intensive chemotherapy, the guideline notes evidence favoring MFC-MRD over molecular MRD; prognostic use at end of treatment and during follow-up still requires further study."},{"id":"d-hner-2022-blood-140-1345-C0001","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"univariable or descriptive","genes":["TP53"],"diseases":["AML"],"text":"AML classification is hierarchical: AML with a recurrent genetic abnormality takes precedence; among remaining categories, TP53-mutated disease supersedes myelodysplasia-related gene-mutated disease, which supersedes myelodysplasia-related cytogenetic disease."},{"id":"d-hner-2022-blood-140-1345-C0002","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["MDS/AML","AML"],"text":"For categories other than AML-defining recurrent genetic abnormalities, 10%-19% marrow or blood blasts are designated MDS/AML and at least 20% blasts are designated AML."},{"id":"d-hner-2022-blood-140-1345-C0003","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"guideline criterion","genes":[],"diseases":["MPN"],"text":"Cases with a prior MPN are excluded from AML classification at 10%-19% blasts and are classified as accelerated-phase MPN; at at least 20% blasts they are classified as blast-phase MPN."},{"id":"d-hner-2022-blood-140-1345-C0004","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"univariable or descriptive","genes":[],"diseases":["MDS/MPN"],"text":"For patients with an established MDS/MPN, the MDS/MPN diagnosis is retained until there are at least 20% blasts/blast equivalents; detection of an AML-defining recurrent genetic abnormality at 10%-19% blasts does not itself change that diagnostic label."},{"id":"d-hner-2022-blood-140-1345-C0005","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"guideline criterion","genes":["PML","RARA"],"diseases":["APL"],"text":"t(15;17)(q24.1;q21.2)/PML::RARA defines APL/AML with at least 10% marrow or blood blasts."},{"id":"d-hner-2022-blood-140-1345-C0006","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"guideline criterion","genes":["RUNX1","RUNX1T1"],"diseases":["AML"],"text":"t(8;21)(q22;q22.1)/RUNX1::RUNX1T1 defines AML with at least 10% marrow or blood blasts."},{"id":"d-hner-2022-blood-140-1345-C0007","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"guideline criterion","genes":["CBFB","MYH11"],"diseases":["AML"],"text":"inv(16)(p13.1q22) or t(16;16)(p13.1;q22)/CBFB::MYH11 defines AML with at least 10% marrow or blood blasts."},{"id":"d-hner-2022-blood-140-1345-C0008","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"guideline criterion","genes":["KMT2A","MLLT3"],"diseases":["AML"],"text":"t(9;11)(p21.3;q23.3)/MLLT3::KMT2A defines AML with at least 10% marrow or blood blasts."},{"id":"d-hner-2022-blood-140-1345-C0009","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"guideline criterion","genes":["DEK","NUP214"],"diseases":["AML"],"text":"t(6;9)(p22.3;q34.1)/DEK::NUP214 defines AML with at least 10% marrow or blood blasts."},{"id":"d-hner-2022-blood-140-1345-C0010","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"guideline criterion","genes":["GATA2","MECOM"],"diseases":["AML"],"text":"inv(3)(q21.3q26.2) or t(3;3)(q21.3;q26.2)/GATA2,MECOM(EVI1) defines AML with at least 10% marrow or blood blasts."},{"id":"d-hner-2022-blood-140-1345-C0011","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"univariable or descriptive","genes":["NPM1"],"diseases":["AML"],"text":"Mutated NPM1 is an AML-defining recurrent genetic abnormality when marrow or blood blasts are at least 10%."},{"id":"d-hner-2022-blood-140-1345-C0012","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"guideline criterion","genes":["CEBPA"],"diseases":["AML"],"text":"An in-frame mutation in the CEBPA bZIP domain, monoallelic or biallelic, defines the CEBPA-mutated AML subtype when marrow or blood blasts are at least 10%."},{"id":"d-hner-2022-blood-140-1345-C0013","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"guideline criterion","genes":["ABL1","BCR"],"diseases":["AML","CML"],"text":"AML with t(9;22)(q34.1;q11.2)/BCR::ABL1 requires at least 20% marrow or blood blasts; cases with BCR::ABL1 rearrangement and 10%-19% blasts are classified as CML in accelerated phase."},{"id":"d-hner-2022-blood-140-1345-C0014","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"guideline criterion","genes":["BCOR","FIP1L1","IRF2BP2","NPM1","RARA","STAT3","STAT5B","TBL1XR1","ZBTB16"],"diseases":["APL"],"text":"In acute promyelocytic leukemia (APL), recurrent RARA rearrangements involving IRF2BP2, NPM1, ZBTB16, STAT5B, STAT3, TBL1XR1, FIP1L1, or BCOR should be reported as the specific RARA-rearranged entity; as AML-defining recurrent abnormalities, they apply at at least 10% marrow or blood blasts."},{"id":"d-hner-2022-blood-140-1345-C0015","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"guideline criterion","genes":["AFDN","AFF1","ELL","KMT2A","MLLT1","MLLT10","TET1"],"diseases":["AML"],"text":"In acute myeloid leukemia (AML), recurrent KMT2A rearrangements with AFF1, AFDN, MLLT10, TET1, ELL, or MLLT1 should be reported as the specific KMT2A-rearranged entity; as AML-defining recurrent abnormalities, they apply at at least 10% marrow or blood blasts."},{"id":"d-hner-2022-blood-140-1345-C0016","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"guideline criterion","genes":["ETV6","MECOM","MYC","RUNX1"],"diseases":["AML"],"text":"In acute myeloid leukemia (AML), recurrent MECOM rearrangements involving MYC, ETV6, RUNX1, or the listed t(2;3) MECOM rearrangement should be reported as the specific MECOM-rearranged entity; as AML-defining recurrent abnormalities, they apply at at least 10% marrow or blood blasts."},{"id":"d-hner-2022-blood-140-1345-C0017","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"univariable or descriptive","genes":["CBFA2T3","CREBBP","ERG","ETV6","FUS","GLIS2","KAT6A","KMD5A","MLF1","MLLT10","MNX1","MRTFA","NPM1","NSD1","NUP98","PICALM","PRDM16","RBM15","RPN1","RUNX1"],"diseases":["AML"],"text":"In acute myeloid leukemia (AML), the rare recurring rearrangements involving PRDM16::RPN1, RBM15::MRTFA, NPM1::MLF1, NUP98::NSD1, ETV6::MNX1, KAT6A::CREBBP, PICALM::MLLT10, NUP98::KMD5A or other NUP98 partners, FUS::ERG, RUNX1::CBFA2T3, and CBFA2T3::GLIS2 are AML-defining recurrent genetic abnormalities and apply at at least 10% marrow or blood blasts."},{"id":"d-hner-2022-blood-140-1345-C0018","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"guideline criterion","genes":["TP53"],"diseases":["AML"],"text":"In the absence of an overriding AML-defining recurrent genetic abnormality, a pathogenic somatic TP53 mutation with VAF at least 10%, with or without loss of the wild-type TP53 allele, defines the TP53-mutated category; cases are MDS/AML at 10%-19% blasts and AML at at least 20% blasts."},{"id":"d-hner-2022-blood-140-1345-C0019","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"guideline criterion","genes":["ASXL1","BCOR","EZH2","RUNX1","SF3B1","SRSF2","STAG2","TP53","U2AF1","ZRSR2"],"diseases":["AML","MDS/AML"],"text":"In acute myeloid leukemia (AML) lacking an overriding recurrent AML abnormality and TP53 mutation, mutations in ASXL1, BCOR, EZH2, RUNX1, SF3B1, SRSF2, STAG2, U2AF1, or ZRSR2 define the myelodysplasia-related gene-mutated category irrespective of prior MDS; these cases are designated MDS/AML at 10%-19% blasts and AML at at least 20% blasts."},{"id":"d-hner-2022-blood-140-1345-C0020","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"univariable or descriptive","genes":[],"diseases":["AML"],"text":"At least three unrelated chromosome abnormalities, excluding class-defining recurring abnormalities and hyperdiploid karyotypes with three or more trisomies/polysomies without structural abnormalities, is a complex karyotype sufficient for the myelodysplasia-related cytogenetic AML category when higher-priority categories are absent. In this branch, 10%-19% blasts is MDS/AML and at least 20% blasts is AML."},{"id":"d-hner-2022-blood-140-1345-C0021","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"univariable or descriptive","genes":[],"diseases":["AML"],"text":"del(5q), t(5q), or add(5q) is sufficient for the myelodysplasia-related cytogenetic AML category when higher-priority categories are absent. In this branch, 10%-19% blasts is MDS/AML and at least 20% blasts is AML."},{"id":"d-hner-2022-blood-140-1345-C0022","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"univariable or descriptive","genes":[],"diseases":["AML"],"text":"Monosomy 7 or del(7q) is sufficient for the myelodysplasia-related cytogenetic AML category when higher-priority categories are absent. In this branch, 10%-19% blasts is MDS/AML and at least 20% blasts is AML."},{"id":"d-hner-2022-blood-140-1345-C0023","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"univariable or descriptive","genes":[],"diseases":["AML"],"text":"Trisomy 8 is sufficient for the myelodysplasia-related cytogenetic AML category when higher-priority categories are absent. In this branch, 10%-19% blasts is MDS/AML and at least 20% blasts is AML."},{"id":"d-hner-2022-blood-140-1345-C0024","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"univariable or descriptive","genes":[],"diseases":["AML"],"text":"del(12p), t(12p), or add(12p) is sufficient for the myelodysplasia-related cytogenetic AML category when higher-priority categories are absent. In this branch, 10%-19% blasts is MDS/AML and at least 20% blasts is AML."},{"id":"d-hner-2022-blood-140-1345-C0025","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"univariable or descriptive","genes":[],"diseases":["AML"],"text":"i(17q) is sufficient for the myelodysplasia-related cytogenetic AML category when higher-priority categories are absent. In this branch, 10%-19% blasts is MDS/AML and at least 20% blasts is AML."},{"id":"d-hner-2022-blood-140-1345-C0026","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"univariable or descriptive","genes":[],"diseases":["AML"],"text":"Monosomy 17, add(17p), or del(17p) is sufficient for the myelodysplasia-related cytogenetic AML category when higher-priority categories are absent. In this branch, 10%-19% blasts is MDS/AML and at least 20% blasts is AML."},{"id":"d-hner-2022-blood-140-1345-C0027","paper":"d-hner-2022-blood-140-1345","category":"diagnosis","tier":"univariable or descriptive","genes":[],"diseases"
